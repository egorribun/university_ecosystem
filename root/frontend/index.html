<!doctype html>
<html lang="ru">
  <head>
    <script>
      (function () {
        import("/static-shell-i18n.js")
          .then(({ applyDocumentLanguage, applyMetaTranslations, getPreferredLanguage }) => {
            const language = window.__UE_SELECTED_LANG__ || getPreferredLanguage(window);
            window.__UE_SELECTED_LANG__ = language;
            applyDocumentLanguage(document, language);
            applyMetaTranslations(document, language);
          })
          .catch((error) => {
            console.error("Failed to load static shell translations", error);
          });
      })();
    </script>
    <script>
      (function () {
        var lang = "ru";
        try {
          var storedLang = localStorage.getItem("ue:language");
          if (storedLang === "en" || storedLang === "ru") {
            lang = storedLang;
          } else {
            var browser = (navigator.language || "").toLowerCase();
            if (browser.indexOf("en") === 0) {
              lang = "en";
            }
          }
        } catch (error) {}
        document.documentElement.setAttribute("lang", lang);
        window.__UE_SELECTED_LANG__ = lang;

        var storedTheme = null;
        try {
          storedTheme = localStorage.getItem("theme");
        } catch (e) {}
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = prefersDark;
        if (storedTheme === "light") {
          dark = false;
        } else if (storedTheme === "dark") {
          dark = true;
        }
        var bg = dark ? "#060b14" : "#e8f1fb";
        var html = document.documentElement;
        html.style.backgroundColor = bg;
        html.style.colorScheme = dark ? "dark" : "light";
        html.classList.toggle("dark", dark);
        function applyThemeToBody() {
          if (!document.body) return false;
          document.body.style.backgroundColor = bg;
          document.body.classList.toggle("dark", dark);
          var root = document.getElementById("root");
          if (root) root.style.backgroundColor = bg;
          return true;
        }
        if (!applyThemeToBody()) {
          document.addEventListener("readystatechange", function onReady() {
            if (document.readyState !== "loading" && applyThemeToBody()) {
              document.removeEventListener("readystatechange", onReady);
            }
          });
          document.addEventListener("DOMContentLoaded", applyThemeToBody);
        }
      })();
    </script>
    <style>
      html {
        background-color: #060b14;
        color: #dde6f7;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        html {
          background-color: #e8f1fb;
          color: #101621;
          color-scheme: light;
        }
      }
      html,
      body,
      #root {
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        height: auto;
      }
      body {
        margin: 0;
        background: inherit;
        color: inherit;
        overscroll-behavior-y: none;
      }
      #root {
        background: inherit;
        color: inherit;
      }
      html.dark, html.dark body, html.dark #root { background-color: #060b14 !important; color: #dde6f7 }
      html:not(.dark), html:not(.dark) body, html:not(.dark) #root { background-color: #e8f1fb; color: #101621 }
      * { scrollbar-width: none; -ms-overflow-style: none }
      *::-webkit-scrollbar { display: none; width: 0; height: 0 }
      html { scrollbar-gutter: stable }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8f1fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060b14" />
