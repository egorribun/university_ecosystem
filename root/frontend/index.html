<!doctype html>
<html lang="ru">
  <head>
    <script>
      (function () {
        import("/static-shell-i18n.js")
          .then(({ applyDocumentLanguage, applyMetaTranslations, getPreferredLanguage }) => {
            const language = window.__UE_SELECTED_LANG__ || getPreferredLanguage(window);
            window.__UE_SELECTED_LANG__ = language;
            applyDocumentLanguage(document, language);
            applyMetaTranslations(document, language);
          })
          .catch((error) => {
            console.error("Failed to load static shell translations", error);
          });
      })();
    </script>
    <script>
      (function () {
        var lang = "ru";
        try {
          var storedLang = localStorage.getItem("ue:language");
          if (storedLang === "en" || storedLang === "ru") {
            lang = storedLang;
          } else {
            var browser = (navigator.language || "").toLowerCase();
            if (browser.indexOf("en") === 0) {
              lang = "en";
            }
          }
        } catch (error) {}
        document.documentElement.setAttribute("lang", lang);
        window.__UE_SELECTED_LANG__ = lang;

        var s = null;
        try {
          s = localStorage.getItem("theme");
        } catch (e) {}
        var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = m;
        if (s === "light") {
          dark = false;
        } else if (s === "dark") {
          dark = true;
        }
        var bg = dark ? "#0b0d11" : "#f4f8fd";
        var html = document.documentElement;
        html.style.backgroundColor = bg;
        if (dark) html.classList.add("dark");
        document.addEventListener("DOMContentLoaded", function () {
          document.body.style.backgroundColor = bg;
          document.body.classList.toggle("dark", dark);
          var r = document.getElementById("root");
          if (r) r.style.backgroundColor = bg;
        });
      })();
    </script>
    <style>
      html, body, #root { min-height: 100vh; min-height: 100svh; min-height: 100dvh; height: auto }
      body { margin: 0; background: inherit; overscroll-behavior-y: none }
      #root { background: inherit }
      * { scrollbar-width: none; -ms-overflow-style: none }
      *::-webkit-scrollbar { display: none; width: 0; height: 0 }
      html { scrollbar-gutter: stable }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f8fd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d11" />
    <meta
      name="description"
      content="Всё необходимое — профиль, расписание, новости и события кампуса — в одном месте."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Экосистема ГУУ" />
    <meta
      property="og:description"
      content="Личный кабинет: профиль, расписание, новости и события кампуса."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Экосистема ГУУ" />
    <meta
      name="twitter:description"
      content="Личный кабинет: профиль, расписание, новости и события кампуса."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <title>Экосистема ГУУ</title>
    <link rel="icon" type="image/png" href="/guu_logo.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/maskable-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/maskable-icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

  </head>
