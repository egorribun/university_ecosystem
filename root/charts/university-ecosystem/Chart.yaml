apiVersion: v2
name: university-ecosystem
description: A world-class Helm chart for the University Ecosystem platform
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: 15.5.34
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 19.1.5
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
