# docker-compose.sandbox.yml — local test-sandbox infrastructure (Wave 1.4).
#
# Purpose-built for HOST-based test runs (NOT in-container): brings up the four
# backing services on DISTINCT host ports so it coexists with a running
# docker-compose.full.yml stack (which does not publish these ports to the host).
# Driven by scripts/run-test-sandbox.ps1, which exports the matching env vars,
# runs alembic migrations, compiles the Rust FFI extension (maturin develop) and
# runs the full local test suite.
#
# Self-contained: no .env dependency, no external networks, no auth on the test
# brokers (isolated + ephemeral — torn down with `down -v`). Image pins match
# ADR-022 / docker-compose.full.yml so the sandbox mirrors production wire formats.
name: ue-sandbox

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test  # pragma: allowlist secret
      POSTGRES_DB: test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    # 16379 (not 56379) — the 55000-57000 range is frequently reserved by
    # Windows WinNAT/Hyper-V (`netsh int ipv4 show excludedportrange tcp`).
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  nats:
    image: nats:2.12.6-alpine@sha256:1cfc36e2e5e638243d8c722f72c954cd0ec4b15ee82fadbc718ce12e2b3c1652
    # JetStream (-js) enabled + HTTP monitoring on 8222 for the healthcheck.
    # No auth: test-only, isolated, ephemeral.
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:54222:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin  # pragma: allowlist secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
