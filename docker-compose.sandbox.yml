# docker-compose.sandbox.yml — local test-sandbox infrastructure (Wave 1.4).
#
# Purpose-built for HOST-based test runs (NOT in-container): brings up the four
# backing services on DISTINCT host ports so it coexists with a running
# docker-compose.full.yml stack (which does not publish these ports to the host).
# Driven by scripts/run-test-sandbox.ps1, which exports the matching env vars,
# runs alembic migrations, compiles the Rust FFI extension (maturin develop) and
# runs the full local test suite.
#
# Self-contained: no .env dependency, no external networks, no auth on the test
# brokers (isolated + ephemeral — torn down with `down -v`). The S3 sandbox
# uses the same pinned SeaweedFS image as the Core/full Compose stacks
# (ADR-042).
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test  # pragma: allowlist secret
      POSTGRES_DB: test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # 16379 (not 56379) — the 55000-57000 range is frequently reserved by
    # Windows WinNAT/Hyper-V (`netsh int ipv4 show excludedportrange tcp`).
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M

  nats:
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    # JetStream (-js) enabled + HTTP monitoring on 8222 for the healthcheck.
    # No auth: test-only, isolated, ephemeral.
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:54222:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M

  minio:
    image: ghcr.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-s3.port=9000"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin  # pragma: allowlist secret
      S3_BUCKET: uploads
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/status"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
