version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/university-ecosystem/core/gen/go
plugins:
  # Go generation using local binaries
  - plugin: go
    out: ../gen/go
    opt: paths=source_relative
  - plugin: go-grpc
    out: ../gen/go
    opt: paths=source_relative

  # Python generation (using built-in protoc language support)
  - plugin: python
    out: ../gen/python
  - plugin: pyi
    out: ../gen/python
  - plugin: grpc-python
    out: ../gen/python
