apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
spec:
  podSelector:
    matchLabels: {app: university-backend}
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: university-gateway}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: postgres}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels: {app: redis}
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - podSelector:
            matchLabels: {app: minio}
      ports: [{protocol: TCP, port: 9000}]
    - to:
        - podSelector:
            matchLabels: {app: elasticsearch}
      ports: [{protocol: TCP, port: 9200}]
    - to:
        - podSelector:
            matchLabels: {app: spicedb}
      ports: [{protocol: TCP, port: 50051}]
    - to:
        - podSelector:
            matchLabels: {app: temporal}
      ports: [{protocol: TCP, port: 7233}]
    - to:
        # RZ-09 (audit 2026-03-04): Restrict DNS to kube-system/kube-dns only.
        # The previous namespaceSelector:{} allowed UDP:53 to any pod in any
        # namespace, creating a lateral movement vector via arbitrary UDP traffic.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports: [{protocol: UDP, port: 53}]
