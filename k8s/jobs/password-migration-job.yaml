# checkov:skip=CKV_K8S_43:IMAGE_TAG is replaced with an immutable digest by the deployment pipeline
# checkov:skip=CKV_K8S_35:the one-shot migration receives required secrets through Kubernetes SecretKeyRef
# TD-W15-04 (audit 2026-03-23 Wave 15): Bcrypt → Argon2id batch migration Job.
#
# This Job marks accounts still using legacy bcrypt hashes as "must reset password".
# Users are prompted to set a new password on next login, which produces an Argon2id hash.
#
# Run via:
#   kubectl create job --from=cronjob/... OR
#   kubectl apply -f k8s/jobs/password-migration-job.yaml
#
# Completion criteria:
#   auth_legacy_bcrypt_users_remaining gauge == 0 for 30+ consecutive days.
#   See app/core/metrics.py and the Grafana "Password Migration Progress" dashboard.
#
# Deadline: 2026-09-01 (TD-W14-02). After this date, bcrypt code should be removed
# entirely from app/auth/security.py and bcrypt removed from dependencies.
apiVersion: batch/v1
kind: Job
metadata:
  name: password-migration-argon2
  namespace: university-ecosystem
  labels:
    app: password-migration
    component: maintenance
    wave: "15"
spec:
  backoffLimit: 3
  # Job is considered failed if not complete within 2 hours
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: password-migration
        component: maintenance
    spec:
      restartPolicy: OnFailure
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: "registry.example.com/backend:${IMAGE_TAG}"  # Set via kustomize/helm; checkov:skip=CKV_K8S_43:IMAGE_TAG is replaced with an immutable digest by the deployment pipeline
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.cli
            - migrate-passwords
            - force-reset
            - --batch-size
            - "500"
            - --yes  # Non-interactive for K8s Job
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SECRET_KEY
            - name: ENVIRONMENT
              value: production
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
