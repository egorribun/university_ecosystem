apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: password-migration-network-policy
  namespace: university-ecosystem
spec:
  podSelector:
    matchLabels:
      app: password-migration
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
