apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: university-ecosystem
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      # DEBT-01 (audit 2026-03-06): Use dedicated ServiceAccount with no K8s API access.
      # Prevents SSRF to kubernetes.default.svc via mounted JWT token.
      serviceAccountName: backend
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: university-ecosystem/backend:${IMAGE_TAG:-latest}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: backend-secrets
            - configMapRef:
                name: backend-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: university-ecosystem
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
