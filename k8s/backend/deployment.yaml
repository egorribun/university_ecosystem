apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: university-ecosystem
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      # DEBT-01 (audit 2026-03-06): Use dedicated ServiceAccount with no K8s API access.
      # Prevents SSRF to kubernetes.default.svc via mounted JWT token.
      serviceAccountName: backend
      automountServiceAccountToken: false
      # MOD-06 (audit 2026-03-15 Wave 7): Allow in-flight requests to complete
      # within the grace period before SIGKILL.  preStop sleep gives kube-proxy
      # time to propagate the endpoint removal to all nodes (~2-5 s lag).
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: university-ecosystem/backend:${IMAGE_TAG:-latest}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: backend-secrets
            - configMapRef:
                name: backend-config
          # MOD-06: preStop sleep ensures load balancer drains before pod dies.
          # K8s sends SIGTERM + starts preStop concurrently; the sleep lets the
          # readiness probe flip to 503 and LB endpoint lists propagate first.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            # MOD-06: Liveness checks process health only (no DB/Redis).
            # High initialDelay avoids false restarts during slow DB startup.
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            # Readiness checks DB connectivity + shutdown flag.
            # Short period ensures fast endpoint removal on shutdown.
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: university-ecosystem
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
