#checkov:skip=CKV_K8S_43:IMAGE_TAG is replaced with an immutable digest by the deployment pipeline
#checkov:skip=CKV_K8S_35:the backend receives configuration through ExternalSecret-backed envFrom by design
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: university-ecosystem
  annotations:
    checkov.io/skip1: CKV_K8S_43=IMAGE_TAG is replaced with an immutable digest by the deployment pipeline
    checkov.io/skip2: CKV_K8S_35=configuration is intentionally delivered through ExternalSecret-backed envFrom
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      # DEBT-01 (audit 2026-03-06): Use dedicated ServiceAccount with no K8s API access.
      # Prevents SSRF to kubernetes.default.svc via mounted JWT token.
      serviceAccountName: backend
      automountServiceAccountToken: false
      # TD-31-01: Spread replicas across nodes so a single node failure doesn't
      # take out 100% of backend capacity. "preferred" keeps single-node dev clusters
      # functional — the scheduler tries to spread but won't block deployment.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: backend
                topologyKey: kubernetes.io/hostname
      # PERF-31-01: Spread replicas across availability zones where possible.
      # ScheduleAnyway is a soft constraint for single-zone clusters.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      # MOD-06 (audit 2026-03-15 Wave 7): Allow in-flight requests to complete
      # within the grace period before SIGKILL.  preStop sleep gives kube-proxy
      # time to propagate the endpoint removal to all nodes (~2-5 s lag).
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          # RZ-W15-06 (audit 2026-03-23 Wave 15): Removed :latest fallback.
          # IMAGE_TAG must be explicitly set (commit SHA or semver) in the CD pipeline.
          # The deploy workflow validates IMAGE_TAG is non-empty before calling kubectl.
          # Using :latest in production breaks reproducibility and risks pulling an
          # unstable image when the registry tag is force-pushed.
          image: registry.example.com/backend:${IMAGE_TAG}  # RZ-33-25: match Kyverno restrict-image-registries; checkov:skip=CKV_K8S_43:IMAGE_TAG is replaced with an immutable digest by the deployment pipeline
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: backend-secrets
            - configMapRef:
                name: backend-config
          # MOD-06: preStop sleep ensures load balancer drains before pod dies.
          # K8s sends SIGTERM + starts preStop concurrently; the sleep lets the
          # readiness probe flip to 503 and LB endpoint lists propagate first.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            # MOD-06: Liveness checks process health only (no DB/Redis).
            # High initialDelay avoids false restarts during slow DB startup.
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            # Readiness checks DB connectivity + shutdown flag.
            # Short period ensures fast endpoint removal on shutdown.
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: university-ecosystem
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
