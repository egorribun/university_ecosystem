# DEBT-01 (audit 2026-03-06): Explicit ServiceAccount with least-privilege RBAC.
# Without this, backend pod uses the `default` ServiceAccount which may have
# system:discovery ClusterRoleBinding — enabling SSRF to `http://kubernetes.default.svc`.
#
# automountServiceAccountToken: false ensures the K8s API JWT is NOT mounted
# into the pod at /var/run/secrets/kubernetes.io/serviceaccount/token,
# eliminating a major SSRF / lateral movement vector.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: university-ecosystem
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
automountServiceAccountToken: false
---
# Empty Role — backend does not need K8s API access today.
# Add specific rules here if future features require API server communication.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-minimal
  namespace: university-ecosystem
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-minimal
  namespace: university-ecosystem
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: university-ecosystem
roleRef:
  kind: Role
  name: backend-minimal
  apiGroup: rbac.authorization.k8s.io
