# MOD-14-03 (audit 2026-03-18): ExternalSecret pulls backend secrets from Vault.
# Refreshes every 5 minutes. target.creationPolicy=Owner means ESO owns the
# resulting k8s Secret and cleans it up when this ExternalSecret is deleted.
#
# Integration with Helm/k8s deployment:
#   k8s/backend/deployment.yaml already references `backend-secrets` via
#     envFrom[].secretRef.name: backend-secrets
#   This ExternalSecret produces target.name=backend-secrets, matching
#   deployment.yaml secretRef.name (RZ-W16-01 fix).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: university-ecosystem
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: university/backend
        property: secret_key
    - secretKey: DATABASE_URL
      remoteRef:
        key: university/backend
        property: database_url
    - secretKey: CSRF_HMAC_SECRET
      remoteRef:
        key: university/backend
        property: csrf_hmac_secret
    - secretKey: INTERNAL_HMAC_SECRET
      remoteRef:
        key: university/backend
        property: internal_hmac_secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: university/backend
        property: jwt_secret
    - secretKey: NATS_AUTH_TOKEN
      remoteRef:
        key: university/backend
        property: nats_auth_token
    - secretKey: AUDIT_LOG_SECRET
      remoteRef:
        key: university/backend
        property: audit_log_secret
