# MOD-14-03 (audit 2026-03-18): ExternalSecret pulls backend secrets from Vault.
# Refreshes every 5 minutes. target.creationPolicy=Owner means ESO owns the
# resulting k8s Secret and cleans it up when this ExternalSecret is deleted.
#
# Integration with Helm/k8s deployment:
#   k8s/backend/deployment.yaml already references `backend-secrets` via
#     envFrom[].secretRef.name: backend-secrets
#   This ExternalSecret produces target.name=backend-secrets, matching
#   deployment.yaml secretRef.name (RZ-W16-01 fix).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: university-ecosystem
spec:
  refreshInterval: 1m  # TD-22-04 (Wave 22): reduced from 5m to limit JWT verification failures during key rotation
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: university/backend
        property: secret_key
    - secretKey: DATABASE_URL
      remoteRef:
        key: university/backend
        property: database_url
    # Cache and revocation state must live on separate Redis instances.  The
    # backend rejects a shared/default endpoint outside development.
    - secretKey: CACHE_REDIS_URL # pragma: allowlist secret; key identifier only
      remoteRef:
        key: university/backend
        property: cache_redis_url # pragma: allowlist secret; remote property identifier only
    - secretKey: REVOCATION_REDIS_URL # pragma: allowlist secret; key identifier only
      remoteRef:
        key: university/backend
        property: revocation_redis_url # pragma: allowlist secret; remote property identifier only
    - secretKey: CSRF_HMAC_SECRET
      remoteRef:
        key: university/backend
        property: csrf_hmac_secret # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:ExternalSecret property identifier, not a secret value
    - secretKey: INTERNAL_HMAC_SECRET
      remoteRef:
        key: university/backend
        property: internal_hmac_secret # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:External Secret property identifier, not a secret value
    - secretKey: JWT_SECRET
      remoteRef:
        key: university/backend
        property: jwt_secret # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:External Secret property identifier, not a secret value
    - secretKey: NATS_AUTH_TOKEN
      remoteRef:
        key: university/backend
        property: nats_auth_token # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:External Secret property identifier, not a secret value
    - secretKey: AUDIT_LOG_SECRET
      remoteRef:
        key: university/backend
        property: audit_log_secret # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:External Secret property identifier, not a secret value
    - secretKey: WS_HUB_INTERNAL_SECRET # pragma: allowlist secret; key identifier only
      remoteRef:
        key: university/backend
        property: ws_hub_internal_secret # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:External Secret property identifier, not a secret value
    - secretKey: IDEMPOTENCY_HMAC_SECRET # pragma: allowlist secret; key identifier only
      remoteRef:
        key: university/backend
        property: idempotency_hmac_secret # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:External Secret property identifier, not a secret value
    # Use a non-C_IDENTIFIER key so envFrom skips the private key. The RSA
    # material is exposed only through the read-only volume in deployment.yaml.
    # JWT_PRIVATE_KEY_PATH points to that file and never carries key material.
    - secretKey: jwt-rsa-private-key # pragma: allowlist secret; key identifier only
      remoteRef:
        key: university/backend
        property: jwt_private_key # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:External Secret property identifier, not a secret value
