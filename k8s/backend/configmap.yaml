apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: university-ecosystem
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  CORS_ALLOWED_ORIGINS: "https://university.example.com"
  ENABLE_METRICS_ENDPOINT: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_STORAGE_BACKEND: "redis"
