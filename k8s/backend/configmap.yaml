apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: university-ecosystem
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  CORS_ALLOWED_ORIGINS: "https://university.example.com"
  ENABLE_METRICS_ENDPOINT: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_STORAGE_BACKEND: "redis"
  # In-cluster OpenFeature provider endpoint (Service in k8s/flagd/deployment.yaml).
  FLAGD_HOST: "flagd"
  FLAGD_PORT: "8013"
