# RZ-14-05 / MOD-14-03 (audit 2026-03-18): External Secrets Operator
# Replaces manually-managed k8s Secrets with ESO-managed rotation from HashiCorp Vault.
# Install ESO first: helm install external-secrets external-secrets/external-secrets \
#   --namespace external-secrets --create-namespace
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-store
  annotations:
    # Audit trail: ESO ClusterSecretStore pointing to internal Vault
    managed-by: "external-secrets-operator"
spec:
  provider:
    vault:
      server: "https://vault.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "university-backend"
          serviceAccountRef:
            name: backend-sa
            namespace: university
