# MOD-14-01 (audit 2026-03-18): Feature flag definitions for flagd.
#
# flagd evaluates flags at runtime using the Open Feature specification.
# Flags are defined in flagd's JSON format and mounted into the flagd pod.
#
# To add a flag:
#   1. Add it to the "flags" section below.
#   2. Apply: kubectl apply -f k8s/flagd/flags-configmap.yaml
#   3. Send SIGHUP to flagd to reload: kubectl rollout restart deployment/flagd
#
# Flag types: boolean, string, integer, float, object
# Targeting rules use the Common Expression Language (CEL).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flagd-flags
  namespace: university-ecosystem  # RZ-33-20: match project namespace
  labels:
    app: flagd
    component: feature-flags
data:
  flags.json: |
    {
      "$schema": "https://flagd.dev/schema/v0/flags.json",
      "flags": {
        "new-chat-ui": {
          "state": "DISABLED",
          "variants": {
            "on": true,
            "off": false
          },
          "defaultVariant": "off",
          "targeting": {}
        },
        "semantic-search": {
          "state": "DISABLED",
          "variants": {
            "on": true,
            "off": false
          },
          "defaultVariant": "off",
          "targeting": {}
        },
        "push-batching": {
          "state": "ENABLED",
          "variants": {
            "on": true,
            "off": false
          },
          "defaultVariant": "on",
          "targeting": {}
        },
        "graphql-subscriptions": {
          "state": "DISABLED",
          "variants": {
            "on": true,
            "off": false
          },
          "defaultVariant": "off",
          "targeting": {}
        }
      }
    }
