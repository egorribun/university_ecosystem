# MOD-14-01 (audit 2026-03-18): flagd — self-hosted OpenFeature provider.
#
# flagd serves evaluation via gRPC (8013); health and metrics use management (8014).
# The backend connects to flagd via openfeature-provider-flagd using the gRPC endpoint.
#
# kustomization.yaml generates the flagd-flags ConfigMap from the canonical
# flags.json and mounts it at /etc/flagd/flags.json. Reviewed GitOps updates
# refresh the projected file; flagd watches and applies valid changes without
# an imperative API mutation.
#
# Production checklist:
#   1. Set FLAGD_METRICS_EXPORTER=otel and OTEL_EXPORTER_OTLP_ENDPOINT for tracing.
#   2. Review NetworkPolicy to restrict flagd access to backend pods only.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  namespace: university-ecosystem
  labels:
    app: flagd
    component: feature-flags
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flagd
  template:
    metadata:
      labels:
        app: flagd
        component: feature-flags
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # TD-25-04: match distroless nonroot UID
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.16.1@sha256:9525b3c2916183810f93f0a72774c1dfad48d1ae22852c753719c46db80af5e7
          imagePullPolicy: Always
          args:
            - start
            - --uri
            - file:/etc/flagd/flags.json
            - --port
            - "8013"
            - --management-port
            - "8014"
          ports:
            - name: grpc
              containerPort: 8013
            - name: management
              containerPort: 8014
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: flags-config
              mountPath: /etc/flagd
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: flags-config
          configMap:
            name: flagd-flags
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: flagd
---
apiVersion: v1
kind: Service
metadata:
  name: flagd
  namespace: university-ecosystem
  labels:
    app: flagd
    component: feature-flags
spec:
  selector:
    app: flagd
  ports:
    - name: grpc
      port: 8013
      targetPort: grpc
    - name: management
      port: 8014
      targetPort: management
  type: ClusterIP
---
# ServiceMonitor for Prometheus scraping of flagd metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flagd
  namespace: university-ecosystem
  labels:
    app: flagd
spec:
  selector:
    matchLabels:
      app: flagd
  endpoints:
    - port: management
      interval: 15s
      path: /metrics
