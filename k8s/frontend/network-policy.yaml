# TD-07 (audit 2026-03-06): NetworkPolicy for frontend pods.
# MOD-22-08 (audit 2026-03-25 Wave 22): Added gateway egress rule.
# Without this policy, frontend pods can initiate arbitrary egress connections.
# This policy restricts ingress to ingress-nginx and egress to gateway + kube-dns only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: university-ecosystem
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept traffic only from the nginx ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # MOD-22-08: Allow egress to the gateway service (API proxy)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 8080
    # Allow DNS resolution (kube-system, required for all pods)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
