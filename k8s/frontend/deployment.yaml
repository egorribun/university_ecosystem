#checkov:skip=CKV_K8S_43:IMAGE_TAG is replaced with an immutable digest by the deployment pipeline
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: university-ecosystem
  annotations:
    checkov.io/skip1: CKV_K8S_43=IMAGE_TAG is replaced with an immutable digest by the deployment pipeline
    checkov.io/skip2: CKV_K8S_40=the image declares the non-root node user at UID 1000; forcing a different UID breaks file ownership
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  # Explicit RollingUpdate strategy keeps normal deployments observable and reversible.
  # `maxUnavailable: 0` ensures NO drop in capacity during canary stage Pod
  # cycling — new Pods come up + pass /healthz before old Pods are removed.
  # `maxSurge: 25%` allows one extra Pod (replicas:2 → 3 transient peak)
  # so rollouts complete within reasonable time. `progressDeadlineSeconds`
  # 600 (10 min) is the cap before the controller marks the rollout failed
  # — generous because Node SSR cold start + PWA precache can take 30-60s.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:                    # TD-28-01: match backend seccompProfile
        seccompProfile:
          type: RuntimeDefault
      # TD-33-01: Spread replicas across nodes so a single node failure doesn't
      # take out 100% of frontend capacity. Mirrors backend anti-affinity (TD-31-01).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: frontend
                topologyKey: kubernetes.io/hostname
      # TD-33-02: Spread replicas across availability zones where possible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      # Wave 131 SW5 — graceful shutdown for Node SSR. Node listens on PORT
      # 3000; on SIGTERM, server-prod.mjs closes the http server with a 30s
      # drain window so in-flight SSR requests complete before exit.
      # preStop sleep:10 (was 5 for nginx) lets the load balancer route
      # away before SIGTERM lands; matches the wrapper's drain timeout.
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: registry.example.com/frontend:${IMAGE_TAG}  # RZ-33-25: match Kyverno restrict-image-registries; checkov:skip=CKV_K8S_43:IMAGE_TAG is replaced with an immutable digest by the deployment pipeline
          imagePullPolicy: Always
          ports:
            # Wave 131 SW5: containerPort 8080 (nginx) → 3000 (Node SSR).
            # Matches frontend.Dockerfile EXPOSE + ENV PORT=3000.
            - containerPort: 3000
              name: http
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          # Wave 131 SW5 — probe target = /healthz fast path (W131 SW2)
          # instead of the prior `/` (which would have run full SSR on
          # every probe and added unnecessary load + cold-start risk).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15  # Node startup ~5-10s; was 10 for nginx
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            # The image's declared non-root `node` user is UID 1000.
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Wave 131 SW5: nginx-cache + nginx-run emptyDirs removed (no
            # nginx in Node runtime). /tmp emptyDir kept because Node may
            # write small temp files (V8 + libuv use /tmp under load) and
            # readOnlyRootFilesystem: true requires an explicit writable mount.
            - name: tmp
              mountPath: /tmp
          resources:
            # Wave 131 SW5 resource bump — Node + V8 heap + tanstackStart
            # SSR per-request work peaks 250-400 MB under load (vs ~50 MB
            # nginx static-serve). CPU also bumps because SSR component
            # render is CPU-bound (vs nginx file IO).
            requests:
              cpu: 100m       # was 50m (nginx)
              memory: 128Mi   # was 64Mi
            limits:
              cpu: 500m       # was 200m
              memory: 512Mi   # was 256Mi (nginx gzip headroom)
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: university-ecosystem
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
