# Wave 132 SW4 — Phase 6 canary fallback Deployment template.
#
# This is the LEGACY fallback target that lives alongside the W131 Node SSR
# Deployment during canary stages 0-5 (see ../deployment.yaml + parent
# services/caddy/Caddyfile `lb_policy weighted_round_robin` block). When
# the canary completes (Stage 5 = 100/0 SSR-only), the operator deletes
# this Deployment + Service via:
#
#     kubectl -n university-ecosystem delete -f k8s/frontend/canary/deployment-stable.yaml
#
# Then reverts the Caddyfile default handle to the single-upstream form
# (commented at the bottom of services/caddy/Caddyfile).
#
# TEMPLATE — operator MUST set the image tag during canary preparation:
#   1. Build the legacy SPA fallback image from a pinned pre-W125 commit
#      (e.g. tag `pre-w125-spa` or commit SHA `b2f6960aa` = W123 SW3 known
#      stable point with Wave 124-LCP perf wins applied but no SSR)
#   2. The legacy nginx config MUST expose `/healthz` (200 OK) so Caddy's
#      active health probe in services/caddy/Caddyfile doesn't mark this
#      pool unhealthy and skip it. Add to the nginx config:
#         location = /healthz { return 200 'OK'; add_header Content-Type text/plain; }
#   3. Push to your registry; replace `${LEGACY_SPA_IMAGE}` below with the
#      full image reference (e.g. `registry.example.com/frontend-stable:pre-w125-spa`)
#   4. Apply this manifest BEFORE flipping any Caddy weight off 100/0.
#   5. Verify via:
#         kubectl -n university-ecosystem rollout status deployment/frontend-stable
#         kubectl -n university-ecosystem get pods -l app.kubernetes.io/name=frontend-stable
#
# See `docs/CANARY_ROLLOUT_PHASE6.md` § "Pre-canary checklist" for the
# full operator workflow.
# checkov:skip=CKV_K8S_43:operator replaces the image template with an immutable digest before apply
# checkov:skip=CKV_K8S_14:operator replaces the image template with a fixed non-latest tag before apply
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-stable
  namespace: university-ecosystem
  annotations:
    checkov.io/skip1: CKV_K8S_43=operator replaces the image template with an immutable digest before apply
    checkov.io/skip2: CKV_K8S_14=operator replaces the image template with a fixed non-latest tag before apply
    checkov.io/skip3: CKV_K8S_40=operator supplies a non-root UID matching the selected legacy image
  labels:
    app.kubernetes.io/name: frontend-stable
    app.kubernetes.io/component: web
    # `app.kubernetes.io/part-of: frontend` groups stable + ssr in dashboards
    # so Grafana / Sentry can compare per-pool metrics during canary stages.
    app.kubernetes.io/part-of: frontend
    # `wave: w132-canary` marks artifacts as canary-period only — operator
    # can grep this label when removing them at Stage 6 cleanup.
    wave: w132-canary
spec:
  # Match SSR Deployment's replicas:2. Stage progression scales these
  # inversely — at Stage 4 (75% SSR) operator can scale `frontend-stable`
  # to `replicas: 1` to reflect lower load on the legacy pool. At Stage 5
  # this Deployment is deleted entirely.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-stable
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: frontend
        wave: w132-canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: frontend-stable
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend-stable
      # Pre-W131 nginx had no SIGTERM-aware drain; default 30s grace is fine.
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend-stable
          # OPERATOR: replace this with the actual legacy image reference
          # before applying. Example references:
          #   registry.example.com/frontend-stable:pre-w125-spa
          #   registry.example.com/frontend-stable:b2f6960aa
          image: ${LEGACY_SPA_IMAGE}  # checkov:skip=CKV_K8S_43:operator replaces this template with an immutable canary digest before apply; checkov:skip=CKV_K8S_14:operator must provide a non-latest immutable image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /healthz   # operator must add this endpoint to nginx config
              port: http
            initialDelaySeconds: 10  # nginx starts faster than Node SSR
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            # Pre-W131 nginx static-serve baseline: cpu 50m / 200m,
            # memory 64Mi / 256Mi. Nginx is much lighter than Node SSR
            # (~50 MB resident vs 250-400 MB for Node), so resource
            # ceiling stays at the original nginx values.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 10Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-stable
  namespace: university-ecosystem
  labels:
    app.kubernetes.io/name: frontend-stable
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: frontend
    wave: w132-canary
spec:
  selector:
    app.kubernetes.io/name: frontend-stable
  ports:
    # Exposed at port 8080 to match `frontend-stable:8080` upstream
    # in services/caddy/Caddyfile (W132 SW3 lb_policy weighted_round_robin).
    - port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
# Optional: PodDisruptionBudget for the canary pool.
# At Stage 1 (90/10) operator can apply this; at Stage 5 (0/100) it can be
# deleted alongside the Deployment.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-stable
  namespace: university-ecosystem
  labels:
    app.kubernetes.io/name: frontend-stable
    wave: w132-canary
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-stable
