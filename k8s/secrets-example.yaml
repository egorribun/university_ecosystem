# Example secrets - DO NOT COMMIT REAL VALUES
# Copy to secrets.yaml and apply: kubectl apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: university-ecosystem
type: Opaque
stringData:
  SECRET_KEY: "change-me-to-a-strong-secret" #checkov:skip=CKV_SECRET_6:documented placeholder in an example manifest
  DATABASE_URL: "postgresql+asyncpg://user:password@postgres:5432/university" # pragma: allowlist secret;checkov:skip=CKV_SECRET_4:documented placeholder in an example manifest
  REDIS_URL: "redis://redis:6379/0" # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:documented non-secret example connection
  VAPID_PRIVATE_KEY: "your-vapid-private-key" # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:documented placeholder in an example manifest
  VAPID_PUBLIC_KEY: "your-vapid-public-key" # pragma: allowlist secret;checkov:skip=CKV_SECRET_6:documented placeholder in an example manifest
  METRICS_BASIC_AUTH_USERNAME: "prometheus"
  METRICS_BASIC_AUTH_PASSWORD: "strong-metrics-password" #checkov:skip=CKV_SECRET_4:documented placeholder in an example manifest
