# Example secrets - DO NOT COMMIT REAL VALUES
# Copy to secrets.yaml and apply: kubectl apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: university-ecosystem
type: Opaque
stringData:
  SECRET_KEY: "change-me-to-a-strong-secret"
  DATABASE_URL: "postgresql+asyncpg://user:password@postgres:5432/university"
  REDIS_URL: "redis://redis:6379/0"
  VAPID_PRIVATE_KEY: "your-vapid-private-key"
  VAPID_PUBLIC_KEY: "your-vapid-public-key"
  METRICS_BASIC_AUTH_USERNAME: "prometheus"
  METRICS_BASIC_AUTH_PASSWORD: "strong-metrics-password"
