apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: university-ecosystem
  namespace: university-ecosystem
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # MOD-W18-03 (audit 2026-03-23 Wave 18): enforce TLS 1.3 only.
    # All modern browsers have supported TLS 1.3 since 2019 (Chrome 70, Firefox 63, Safari 12.1).
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    # RZ-08: proxy-body-size MUST match ContentSizeLimitMiddleware.max_bytes in
    # app/core/middleware.py (currently 50 MB). Update both together.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # MOD-W16-02: L7 rate limiting at ingress level — drops burst traffic before
    # it reaches backend rate-limit middleware. Values tuned for production load.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Set CERT_MANAGER_ISSUER_NAME in the deployment environment; do not bake
    # a cluster-specific issuer into this reusable manifest.
    cert-manager.io/cluster-issuer: "${CERT_MANAGER_ISSUER_NAME}"
spec:
  ingressClassName: nginx
  tls:
    # TD-31-02 (supersedes TD-28-03): Parameterized via envsubst in the deploy
    # pipeline. Set CERT_MANAGER_ISSUER_NAME, FRONTEND_HOST, API_HOST,
    # TLS_SECRET_NAME env vars before
    # running: envsubst < ingress.yaml | kubectl apply -f -
    - hosts:
        - ${FRONTEND_HOST}
        - ${API_HOST}
      secretName: ${TLS_SECRET_NAME}
  rules:
    - host: ${FRONTEND_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: ${API_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
