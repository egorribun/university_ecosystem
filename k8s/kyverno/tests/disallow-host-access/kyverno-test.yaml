apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-host-access
policies:
  - ../../cluster-policies.yaml
resources:
  - ../compliant-pod.yaml
  - host-access.yaml
results:
  - policy: disallow-host-access
    resources: [university-ecosystem/compliant-pod]
    kind: Pod
    result: pass
  - policy: disallow-host-access
    resources: [university-ecosystem/host-network-pod]
    kind: Pod
    result: fail
  - policy: disallow-host-access
    resources: [university-ecosystem/host-pid-pod]
    kind: Pod
    result: fail
  - policy: disallow-host-access
    resources: [university-ecosystem/host-ipc-pod]
    kind: Pod
    result: fail
  - policy: disallow-host-access
    resources: [university-ecosystem/host-path-pod]
    kind: Pod
    result: fail
  - policy: disallow-host-access
    resources: [university-ecosystem/host-port-pod]
    kind: Pod
    result: fail
  - policy: disallow-host-access
    resources: [university-ecosystem/init-host-port-pod]
    kind: Pod
    result: fail
  - policy: disallow-host-access
    resources: [spire/spire-host-access-pod]
    kind: Pod
    result: pass
