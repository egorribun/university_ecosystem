apiVersion: v1
kind: Pod
metadata:
  name: unpinned-bitnami-exporter-pod
  namespace: university-ecosystem
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: redis-exporter
      image: docker.io/bitnami/redis-exporter:1.70.0-debian-12-r2
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: "100m"
          memory: "128Mi"
