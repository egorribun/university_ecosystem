apiVersion: v1
kind: Pod
metadata:
  name: untrusted-ephemeralcontainer-pod
  namespace: university-ecosystem
spec:
  containers:
    - name: app
      image: ghcr.io/egorribun/university_ecosystem/backend:v1.0.0
  ephemeralContainers:
    - name: debug
      image: ghcr.io/otherpublisher/project/debug:v1.0.0
      targetContainerName: app
