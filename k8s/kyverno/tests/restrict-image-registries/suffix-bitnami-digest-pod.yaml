apiVersion: v1
kind: Pod
metadata:
  name: suffix-bitnami-digest-pod
  namespace: university-ecosystem
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: redis
      image: docker.io/bitnami/redis@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd-suffix
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: "100m"
          memory: "128Mi"
