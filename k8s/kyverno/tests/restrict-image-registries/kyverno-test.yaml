apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-image-registries
policies:
  - ../../cluster-policies.yaml
resources:
  - ../compliant-pod.yaml
  - approved-bitnami-pod.yaml
  - bad.yaml
  - unpinned-bitnami-pod.yaml
  - empty-bitnami-digest-pod.yaml
  - nonhex-bitnami-digest-pod.yaml
  - suffix-bitnami-digest-pod.yaml
  - unpinned-bitnami-exporter-pod.yaml
  - unpinned-bitnami-nats-pod.yaml
results:
  - policy: restrict-image-registries
    resources: [university-ecosystem/compliant-pod]
    kind: Pod
    result: pass
  - policy: restrict-image-registries
    resources: [university-ecosystem/approved-bitnami-pod]
    kind: Pod
    result: pass
  - policy: restrict-image-registries
    resources: [university-ecosystem/untrusted-registry-pod]
    kind: Pod
    result: fail
  - policy: restrict-image-registries
    resources: [university-ecosystem/unpinned-bitnami-pod]
    kind: Pod
    result: fail
  - policy: restrict-image-registries
    resources: [university-ecosystem/empty-bitnami-digest-pod]
    kind: Pod
    result: fail
  - policy: restrict-image-registries
    resources: [university-ecosystem/nonhex-bitnami-digest-pod]
    kind: Pod
    result: fail
  - policy: restrict-image-registries
    resources: [university-ecosystem/suffix-bitnami-digest-pod]
    kind: Pod
    result: fail
  - policy: restrict-image-registries
    resources: [university-ecosystem/unpinned-bitnami-exporter-pod]
    kind: Pod
    result: fail
  - policy: restrict-image-registries
    resources: [university-ecosystem/unpinned-bitnami-nats-pod]
    kind: Pod
    result: fail
