apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-privilege-escalation
policies:
  - ../../cluster-policies.yaml
resources:
  - ../compliant-pod.yaml
  - bad.yaml
results:
  - policy: disallow-privilege-escalation
    resources: [university-ecosystem/compliant-pod]
    kind: Pod
    result: pass
  - policy: disallow-privilege-escalation
    resources: [university-ecosystem/privilege-escalation-pod]
    kind: Pod
    result: fail
