apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod
  namespace: university-ecosystem
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: ghcr.io/egorribun/university_ecosystem/backend:v1.0.0
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: "100m"
          memory: "128Mi"
