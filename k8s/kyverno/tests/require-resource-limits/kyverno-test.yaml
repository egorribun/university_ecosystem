apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-resource-limits
policies:
  - ../../cluster-policies.yaml
resources:
  - ../compliant-pod.yaml
  - bad.yaml
results:
  - policy: require-resource-limits
    resources: [university-ecosystem/compliant-pod]
    kind: Pod
    result: pass
  - policy: require-resource-limits
    resources: [university-ecosystem/missing-limits-pod]
    kind: Pod
    result: fail
