apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-run-as-non-root-ephemeral-subresource
policies:
  - ../../../cluster-policies.yaml
resources:
  - ../../ephemeral-container-subresource/resources.yaml
variables: ../../ephemeral-container-subresource/values.yaml
results:
  - policy: require-run-as-non-root
    isValidatingPolicy: true
    resources: [university-ecosystem/ephemeral-valid-pod]
    kind: Pod
    result: pass
  - policy: require-run-as-non-root
    isValidatingPolicy: true
    resources: [university-ecosystem/ephemeral-root-override-pod]
    kind: Pod
    result: fail
