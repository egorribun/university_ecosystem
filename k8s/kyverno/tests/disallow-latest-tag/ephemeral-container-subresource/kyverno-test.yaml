policies:
  - ../../../cluster-policies.yaml
resources:
  - ../../ephemeral-container-subresource/resources.yaml
variables: ../../ephemeral-container-subresource/values.yaml
results:
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    resources: [university-ecosystem/ephemeral-valid-pod]
