apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-readonly-root-filesystem-ephemeral-subresource
policies:
  - ../../../cluster-policies.yaml
resources:
  - ../../ephemeral-container-subresource/resources.yaml
variables: ../../ephemeral-container-subresource/values.yaml
results:
  - policy: require-readonly-root-filesystem
    isValidatingPolicy: true
    resources: [university-ecosystem/ephemeral-valid-pod]
    kind: Pod
    result: pass
  - policy: require-readonly-root-filesystem
    isValidatingPolicy: true
    resources: [university-ecosystem/ephemeral-writable-root-pod]
    kind: Pod
    result: fail
