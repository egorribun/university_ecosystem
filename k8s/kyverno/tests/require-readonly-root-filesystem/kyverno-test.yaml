apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-readonly-root-filesystem
policies:
  - ../../cluster-policies.yaml
resources:
  - ../compliant-pod.yaml
  - bad.yaml
results:
  - policy: require-readonly-root-filesystem
    rule: check-readOnlyRootFilesystem
    resources: [university-ecosystem/compliant-pod]
    kind: Pod
    result: pass
  - policy: require-readonly-root-filesystem
    rule: check-readOnlyRootFilesystem
    resources: [university-ecosystem/writable-root-pod]
    kind: Pod
    result: fail
