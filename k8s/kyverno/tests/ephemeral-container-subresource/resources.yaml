apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-valid-pod
  namespace: university-ecosystem
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: ghcr.io/egorribun/university_ecosystem/backend:v1.0.0
      imagePullPolicy: Always
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  ephemeralContainers:
    - name: debug
      image: ghcr.io/egorribun/university_ecosystem/backend:v1.0.0
      imagePullPolicy: Always
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: ["ALL"]
---
