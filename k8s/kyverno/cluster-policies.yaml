apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Require Drop All Capabilities
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
spec:
  failurePolicy: Fail
  validationActions: [Deny, Audit]
  evaluation:
    admission: { enabled: true }
    background: { enabled: true }
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: university-ecosystem
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.?securityContext.?capabilities.?drop.orValue([]).exists(capability,
            capability == 'ALL'))
      message: Every container must include ALL in securityContext.capabilities.drop

