---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/minversion: 1.19.0
spec:
  failurePolicy: Fail
  validationActions: [Deny, Audit]
  evaluation:
    admission: { enabled: true }
    background: { enabled: true }
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: university-ecosystem
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.image.startsWith('registry.example.com/') ||
          container.image.startsWith('ghcr.io/'))
      message: Images must come from registry.example.com or ghcr.io

---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
spec:
  failurePolicy: Fail
  validationActions: [Deny, Audit]
  evaluation:
    admission: { enabled: true }
    background: { enabled: true }
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: university-ecosystem
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.?resources.?limits.?cpu.orValue('') != '' &&
          container.?resources.?limits.?memory.orValue('') != '')
      message: Every container must define CPU and memory limits

