---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest or Empty Image Tags
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  failurePolicy: Fail
  validationActions: [Deny, Audit]
  evaluation:
    admission: { enabled: true }
    background: { enabled: true }
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: university-ecosystem
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.image.matches('^.+(@sha256:[a-f0-9]{64}|:[^/:@]+)$') &&
          !container.image.matches('(?i)^.+:latest$'))
      message: Every image must use an explicit non-empty tag or immutable sha256 digest

---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-access
  annotations:
    policies.kyverno.io/title: Disallow Host Namespace and Filesystem Access
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  failurePolicy: Fail
  validationActions: [Deny, Audit]
  evaluation:
    admission: { enabled: true }
    background: { enabled: true }
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: university-ecosystem
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        object.spec.?hostNetwork.orValue(false) == false &&
        object.spec.?hostPID.orValue(false) == false &&
        object.spec.?hostIPC.orValue(false) == false &&
        object.spec.?volumes.orValue([]).all(volume, !has(volume.hostPath)) &&
        variables.allContainers.all(container,
          container.?ports.orValue([]).all(port,
            port.?hostPort.orValue(0) == 0))
      message: Host namespaces, hostPath volumes, and host ports are not allowed
