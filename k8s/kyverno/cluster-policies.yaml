# University Ecosystem admission controls for Kyverno 1.19+.
#
# Kyverno removed the legacy ClusterPolicy API after its v1.19 compatibility
# window. These CEL-native ValidatingPolicy resources keep admission fail-closed
# while also producing background policy reports.
#
# Production installation:
#   helm upgrade --install kyverno kyverno/kyverno --namespace kyverno \
#     --create-namespace --set admissionController.replicas=3 \
#     --set backgroundController.replicas=2 \
#     --set cleanupController.replicas=2 \
#     --set reportsController.replicas=2

---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  failurePolicy: Fail
  validationActions: [Deny, Audit]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: university-ecosystem
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: podRunAsNonRoot
      expression: object.spec.?securityContext.?runAsNonRoot.orValue(false)
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.?securityContext.?runAsNonRoot.orValue(variables.podRunAsNonRoot))
      message: Pod or every container must set runAsNonRoot to true

---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  failurePolicy: Fail
  validationActions: [Deny, Audit]
  evaluation:
    admission: { enabled: true }
    background: { enabled: true }
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: university-ecosystem
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: Every container must set allowPrivilegeEscalation to false

