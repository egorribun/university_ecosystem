# Non-secret release identity for the isolated Trivy Helm scan. Image digests
# for first-party backend init work are generated from the current source-bound
# backend OCI archive; third-party Redis images use their chart-pinned defaults.
applicationReleaseName: trivy-scan

redis:
  fullnameOverride: trivy-scan-revocation-redis
  commonLabels:
    "university-ecosystem.io/revocation-store-for": trivy-scan
    "app.kubernetes.io/instance": trivy-scan