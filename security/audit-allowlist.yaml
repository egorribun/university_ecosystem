# Track temporary dependency audit exceptions.
# All entries must include an owner and expiry date to avoid silent drift.
npm:
  overrides:
    - package: glob
      pinned_version: "13.0.6"
      owner: frontend@university.example
      expires: 2026-12-31
      reason: |
        Build tooling currently spans workbox-build (^11.0.1), Storybook
        docgen (^13.0.1), and Sentry bundler plugins (^13.0.6). Pinning the
        shared override to audited glob 13.0.6 avoids retaining an older
        duplicate while all CI and production builds run on Node.js 24.
  advisories:
    - id: "1130129"
      package: fast-uri
      owner: frontend@university.example
      expires: 2026-12-31
      reason: |
        ReDoS vulnerability in fast-uri. Transitive dependency from ajv / dev toolchain.
    - id: "1115382"
      package: picomatch
      owner: frontend@university.example
      expires: 2026-09-30
      reason: |
        ReDoS via extglob quantifiers (GHSA-c2c7-rcm5-vvqj).
        Transitive dep from vite/chokidar; no override available yet.
    - id: "1115384"
      package: picomatch
      owner: frontend@university.example
      expires: 2026-09-30
      reason: |
        ReDoS via extglob quantifiers (GHSA-c2c7-rcm5-vvqj), alternate source ID.
        Transitive dep from vite/chokidar; no override available yet.
    - id: "1115394"
      package: picomatch
      owner: frontend@university.example
      expires: 2026-09-30
      reason: |
        Method Injection in POSIX Character Classes (GHSA-3v7f-55p6-f55p).
        Transitive dep from vite/chokidar; awaiting upstream patch.
    - id: "1115396"
      package: picomatch
      owner: frontend@university.example
      expires: 2026-09-30
      reason: |
        Method Injection in POSIX Character Classes (GHSA-3v7f-55p6-f55p), alternate source ID.
        Transitive dep from vite/chokidar; awaiting upstream patch.
