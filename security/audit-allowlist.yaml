# Track temporary dependency audit exceptions.
# All entries must include an owner and expiry date to avoid silent drift.
npm:
  overrides:
    - package: glob
      pinned_version: "13.0.6"
      owner: frontend@university.example
      expires: 2026-12-31
      reason: |
        Build tooling currently spans workbox-build (^11.0.1), Storybook
        docgen (^13.0.1), and Sentry bundler plugins (^13.0.6). Pinning the
        shared override to audited glob 13.0.6 avoids retaining an older
        duplicate while all CI and production builds run on Node.js 24.
  advisories: []

pip:
  advisories: []
