# Track temporary dependency audit exceptions.
# All entries must include an owner and expiry date to avoid silent drift.
npm:
  overrides:
    - package: glob
      pinned_version: "11.1.0"
      owner: frontend@university.example
      expires: 2026-12-31
      reason: |
        Tailwind CSS 3.x pulls in sucrase's glob CLI; pinning ensures we stay on the patched release until the Tailwind 4 upgrade.
  advisories:
    - id: "1112818"
      package: "@isaacs/brace-expansion"
      owner: frontend@university.example
      expires: 2026-06-30
      reason: |
        Critical DoS vulnerability (GHSA-7h2j-956f-4vf2) in brace-expansion.
        Allowing temporarily until downstream dependencies (likely vite or storybook) patch this.
    - id: "1112862"
      package: "@isaacs/brace-expansion"
      owner: frontend@university.example
      expires: 2026-06-30
      reason: |
        Uncontrolled Resource Consumption (GHSA-7h2j-956f-4vf2) in brace-expansion.
        Adding specific source ID from npm audit report to the allowlist.
    - id: "1112954"
      package: "@isaacs/brace-expansion"
      owner: frontend@university.example
      expires: 2026-06-30
      reason: |
        Uncontrolled Resource Consumption (GHSA-7h2j-956f-4vf2) in brace-expansion.
        Another source ID for the same vulnerability found in recent audit.
    - id: "1115382"
      package: picomatch
      owner: frontend@university.example
      expires: 2026-09-30
      reason: |
        ReDoS via extglob quantifiers (GHSA-c2c7-rcm5-vvqj).
        Transitive dep from vite/chokidar; no override available yet.
    - id: "1115384"
      package: picomatch
      owner: frontend@university.example
      expires: 2026-09-30
      reason: |
        ReDoS via extglob quantifiers (GHSA-c2c7-rcm5-vvqj), alternate source ID.
        Transitive dep from vite/chokidar; no override available yet.
    - id: "1115394"
      package: picomatch
      owner: frontend@university.example
      expires: 2026-09-30
      reason: |
        Method Injection in POSIX Character Classes (GHSA-3v7f-55p6-f55p).
        Transitive dep from vite/chokidar; awaiting upstream patch.
    - id: "1115396"
      package: picomatch
      owner: frontend@university.example
      expires: 2026-09-30
      reason: |
        Method Injection in POSIX Character Classes (GHSA-3v7f-55p6-f55p), alternate source ID.
        Transitive dep from vite/chokidar; awaiting upstream patch.
    - id: "1115369"
      package: yaml
      owner: frontend@university.example
      expires: 2026-09-30
      reason: |
        Stack Overflow via deeply nested YAML collections.
        Used by postcss-import; not exploitable via our CSS pipeline.

pip:
  advisories:
    - id: CVE-2024-23342
      package: ecdsa
      owner: backend@university.example
      expires: 2027-12-31
      reason: |
        No upstream fix planned. The vulnerability is a low-impact potential timing attack in some curves, not applicable to our current usage. (GHSA-wj6h-64fc-37mp)
