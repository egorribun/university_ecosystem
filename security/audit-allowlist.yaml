# Track temporary dependency audit exceptions.
# All entries must include an owner and expiry date to avoid silent drift.
npm:
  overrides:
    - package: glob
      pinned_version: "11.1.0"
      owner: frontend@university.example
      expires: 2026-12-31
      reason: |
        Tailwind CSS 3.x pulls in sucrase's glob CLI; pinning ensures we stay on the patched release until the Tailwind 4 upgrade.
  advisories:
    - id: "1112818"
      package: "@isaacs/brace-expansion"
      owner: frontend@university.example
      expires: 2026-06-30
      reason: |
        Critical DoS vulnerability (GHSA-7h2j-956f-4vf2) in brace-expansion.
        Allowing temporarily until downstream dependencies (likely vite or storybook) patch this.

pip:
  advisories:
    - id: CVE-2024-23342
      package: ecdsa
      owner: backend@university.example
      expires: 2026-12-31
      reason: |
        python-ecdsa has no upstream fix for CVE-2024-23342 (GHSA-wj6h-64fc-37mp). Monitor upstream and replace or upgrade when a patch lands.
    - id: CVE-2026-22702
      package: virtualenv
      owner: backend@university.example
      expires: 2026-03-01
      reason: |
        Vulnerability fixed in virtualenv 20.36.2. Currently, only 20.36.1 is available in the public index.
        Upgrade and remove this exit when 20.36.2 becomes available.
    - id: CVE-2026-0994
      package: protobuf
      owner: backend@university.example
      expires: 2026-03-01
      reason: |
        DoS vulnerability in protobuf json_format. Currently using 6.33.4 (latest).
        Official fix status is pending verification as this CVE was published very recently (2026-01-23).
