services:
  backend:
    build:
      context: .
      dockerfile: root/backend.Dockerfile
      target: runtime
    env_file:
      - path: root/.env
        required: false
    environment:
      # Using host machine's PostgreSQL database
      DATABASE_URL: postgresql+asyncpg://postgres:DevSecurePass2024!@host.docker.internal:5432/university
      FRONTEND_ORIGIN: http://localhost:8081
      FRONTEND_ORIGINS: http://localhost:8081,http://localhost:8080
      NOTIFICATIONS_SCHEDULER_INLINE_ENABLED: "false"
      ENABLE_METRICS_ENDPOINT: "false"
      METRICS_ALLOWLIST: 127.0.0.1,::1
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      RATE_LIMIT_HEADERS_ENABLED: "true"
      TASKIQ_BROKER_URL: redis://redis:6379/2
      SECRET_KEY: "dev_secret_key_1234567890"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: root/frontend.Dockerfile
      target: runtime
      args:
        VITE_BACKEND_ORIGIN: ""
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  notifications-worker:
    build:
      context: .
      dockerfile: root/backend.Dockerfile
      target: runtime
    command: python -m app.workers.notifications
    env_file:
      - path: root/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:DevSecurePass2024!@host.docker.internal:5432/university
      NOTIFICATIONS_WORKER_METRICS_HOST: 0.0.0.0
      NOTIFICATIONS_WORKER_METRICS_PORT: "9101"
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      TASKIQ_BROKER_URL: redis://redis:6379/2
      SECRET_KEY: "dev_secret_key_1234567890"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "9102:9101"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9101/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevSecurePass2024!}
      POSTGRES_DB: ${POSTGRES_DB:-university}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  migrations:
    build:
      context: .
      dockerfile: root/backend.Dockerfile
      target: runtime
    command: alembic stamp head
    env_file:
      - ${ENV_FILE:-root/.env.example}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:DevSecurePass2024!@postgres:5432/university}
      SECRET_KEY: "dev_secret_key_1234567890"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
