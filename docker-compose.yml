services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      # Database connection - MUST be set in .env file
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - set in .env file}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8081}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8081,http://localhost:8080}
      NOTIFICATIONS_SCHEDULER_INLINE_ENABLED: "false"
      ENABLE_METRICS_ENDPOINT: "false"
      METRICS_ALLOWLIST: 127.0.0.1,::1
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      RATE_LIMIT_HEADERS_ENABLED: "true"
      TASKIQ_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - set in .env file}
      # Push notifications
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Spotify
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
      SPOTIFY_SCOPES: ${SPOTIFY_SCOPES}
    volumes:
      - static-data:/app/app/static
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
      - public
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      target: runtime
      args:
        VITE_BACKEND_ORIGIN: ""
    ports:
      - "8081:8080"
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notifications-worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    command: python -m app.workers.notifications
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - set in .env file}
      NOTIFICATIONS_WORKER_METRICS_HOST: 0.0.0.0
      NOTIFICATIONS_WORKER_METRICS_PORT: "9101"
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      TASKIQ_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - set in .env file}
      # Push notifications
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Spotify
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
      SPOTIFY_SCOPES: ${SPOTIFY_SCOPES}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "9102:9101"
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9101/healthz >/dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg17-v0.8.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set in .env file}
      POSTGRES_DB: ${POSTGRES_DB:-university}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G

  redis:
    image: redis:7.4.2-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  migrations:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    command: alembic upgrade head
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required - set in .env file}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - set in .env file}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  imgproxy:
    image: darthsim/imgproxy:v3.15.0
    ports:
      - "8082:8080"
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_ALLOWED_SOURCES: "http://backend:8000/,https://*,http://*"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: "true"
    restart: unless-stopped
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  temporal:
    image: temporalio/admin-tools:1.25.1
    container_name: temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    entrypoint: [ "/bin/bash", "-c", "temporal server start-dev --ip 0.0.0.0 --ui-port 8233 --db-filename /data/temporal.db" ]
    volumes:
      - temporal_data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: minio
    # Ports only exposed on internal network for security
    # Access via backend service or SSH tunnel for console
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - set in .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - set in .env file}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  spicedb:
    image: authzed/spicedb:v1.36.0
    container_name: spicedb
    command: serve --grpc-preshared-key "${SPICEDB_PRESHARED_KEY:?SPICEDB_PRESHARED_KEY is required}" --datastore-engine postgres --datastore-conn-uri "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/spicedb?sslmode=disable"
    # Internal only - accessed by backend services
    expose:
      - "50051"
      - "8443"
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY:?SPICEDB_PRESHARED_KEY is required - set in .env file}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "grpc_health_probe", "-addr=:50051" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  rust-optimizer:
    build:
      context: .
      dockerfile: services/rust-optimizer/Dockerfile
    ports:
      - "8090:8080"
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  pyroscope:
    image: grafana/pyroscope:1.7.1
    container_name: pyroscope
    ports:
      - "4040:4040"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

networks:
  public:
  internal:
    internal: true

volumes:
  postgres-data:
  static-data:
  temporal_data:
  minio_data:
