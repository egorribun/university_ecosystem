services:
  backend:
    build:
      context: .
      dockerfile: root/backend.Dockerfile
      target: runtime
    env_file:
      - root/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/university
      FRONTEND_ORIGIN: http://localhost:5173
      FRONTEND_ORIGINS: http://localhost:5173
      NOTIFICATIONS_SCHEDULER_INLINE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: root/frontend.Dockerfile
    environment:
      VITE_BACKEND_ORIGIN: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "5173:5173"

  notifications-worker:
    build:
      context: .
      dockerfile: root/backend.Dockerfile
      target: runtime
    command: python -m app.workers.notifications
    env_file:
      - root/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/university
      NOTIFICATIONS_WORKER_METRICS_HOST: 0.0.0.0
      NOTIFICATIONS_WORKER_METRICS_PORT: "9101"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "9101:9101"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: university
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  postgres-data:
