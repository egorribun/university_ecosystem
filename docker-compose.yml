services:
  backend:
    build:
      context: .
      dockerfile: root/backend.Dockerfile
      target: runtime
    env_file:
      - root/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/university
      FRONTEND_ORIGIN: http://localhost:8080
      FRONTEND_ORIGINS: http://localhost:8080
      NOTIFICATIONS_SCHEDULER_INLINE_ENABLED: "false"
      ENABLE_METRICS_ENDPOINT: "true"
      METRICS_BASIC_AUTH_USERNAME: metrics
      METRICS_BASIC_AUTH_PASSWORD: changeme
      METRICS_ALLOWLIST: 127.0.0.1,::1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: root/frontend.Dockerfile
      target: runtime
      args:
        VITE_BACKEND_ORIGIN: http://localhost:8000
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  notifications-worker:
    build:
      context: .
      dockerfile: root/backend.Dockerfile
      target: runtime
    command: python -m app.workers.notifications
    env_file:
      - root/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/university
      NOTIFICATIONS_WORKER_METRICS_HOST: 0.0.0.0
      NOTIFICATIONS_WORKER_METRICS_PORT: "9101"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "9101:9101"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: university
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  postgres-data:
