services:
  backend:
    build:
      context: .
      dockerfile: root/backend.Dockerfile
      target: runtime
    env_file:
      - root/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the backend database DSN}
      FRONTEND_ORIGIN: http://localhost:8080
      FRONTEND_ORIGINS: http://localhost:8080
      NOTIFICATIONS_SCHEDULER_INLINE_ENABLED: "false"
      ENABLE_METRICS_ENDPOINT: "true"
      METRICS_ALLOWLIST: 127.0.0.1,::1
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      RATE_LIMIT_HEADERS_ENABLED: "true"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: root/frontend.Dockerfile
      target: runtime
      args:
        VITE_BACKEND_ORIGIN: http://localhost:8000
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  notifications-worker:
    build:
      context: .
      dockerfile: root/backend.Dockerfile
      target: runtime
    command: python -m app.workers.notifications
    env_file:
      - root/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the backend database DSN}
      NOTIFICATIONS_WORKER_METRICS_HOST: 0.0.0.0
      NOTIFICATIONS_WORKER_METRICS_PORT: "9101"
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "9101:9101"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9101/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-university}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:?Use POSTGRES_PASSWORD_FILE to provide the database password}
      POSTGRES_DB: ${POSTGRES_DB:-university}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-university}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  migrations:
    build:
      context: .
      dockerfile: root/backend.Dockerfile
      target: runtime
    command: alembic upgrade head
    env_file:
      - root/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the backend database DSN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
