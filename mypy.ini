# mypy.ini — per-module overrides only.
# Global config (strict=true, files=["app"], python_version="3.12") lives in
# pyproject.toml [tool.mypy]. CI invokes: mypy --config-file pyproject.toml
#
# TD-01 (audit 2026-03-06): python_version 3.11 → 3.12 (matches CI + pyproject.toml).
# TD-02 (audit 2026-03-06): Removed global allow_untyped_defs / allow_untyped_globals —
#   those guards caused mypy to silently accept un-annotated code everywhere.
# TD-08 (audit 2026-03-06): `files` narrowlist removed — pyproject.toml covers all of app/.

[mypy]
python_version = 3.12
mypy_path = .
plugins = pydantic.mypy, sqlalchemy.ext.mypy.plugin, strawberry.ext.mypy_plugin
namespace_packages = True
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
show_error_codes = True
follow_imports = normal

[mypy-app.auth.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-app.services.auth.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-app.api.auth.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-app.api.deps.*]
disallow_untyped_defs = True
warn_return_any = True
