# Go Microservices
# Run with: docker compose -f docker-compose.yml -f docker-compose.go.yml up -d

services:
  # API Gateway - Rate limiting, JWT validation, reverse proxy
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://:${REDIS_PASSWORD}@valkey:6379/3
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be explicitly set in .env (TD-W16-01)}
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      backend:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - public
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    restart: unless-stopped

  # WebSocket Hub - Real-time messaging
  ws-hub:
    build:
      context: .
      dockerfile: services/ws-hub/Dockerfile
    ports:
      - "8083:8081"
    environment:
      WS_HUB_PORT: "8081"
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be explicitly set in .env (TD-W16-01)}
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      # PERF-W15-04: Increase in production to handle burst reconnects (e.g. post-deploy)
      AUTH_CLIENT_MAX_CONNS_PER_HOST: "50"
    depends_on:
      - nats
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    restart: unless-stopped

  # File Processor - Image processing worker
  file-processor:
    build:
      context: .
      dockerfile: services/file-processor/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - set in .env file}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - set in .env file}
      MINIO_BUCKET: uploads
    depends_on:
      nats:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped
