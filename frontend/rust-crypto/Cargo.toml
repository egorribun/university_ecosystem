[package]
name = "uni-wasm-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Ignore false positive unused dev-dependency in cargo-udeps
[package.metadata.cargo-udeps.ignore]
development = ["wasm-bindgen-test"]


[lib]
# rlib added (testing session 9) so the crate can be linked into native
# `cargo test` binaries for the RFC KAT tests; cdylib still drives wasm-pack.
crate-type = ["cdylib", "rlib"]

[dependencies]
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
wasm-bindgen = "0.2.129"
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = "0.13"
scrypt = "0.12"
hex = "0.4"
zeroize = "=1.9.1"


[dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
# Exact pair for the locked wasm-bindgen 0.2.129 (TD-22-02 pin style). Drives
# the browser-parity KATs in tests/wasm.rs under `wasm-pack test`.
wasm-bindgen-test = "=0.3.79"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"
