[package]
name = "wasm-sanitizer"
version = "0.1.0"
authors = ["Admin"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
wasm-bindgen = "0.2.84"
ammonia = "4.0.0"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
