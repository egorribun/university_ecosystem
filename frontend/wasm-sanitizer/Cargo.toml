[package]
name = "wasm-sanitizer"
version = "0.1.0"
authors = ["Admin"]
edition = "2021"
license = "MIT"
# Ignore false positive unused dev-dependency in cargo-udeps
[package.metadata.cargo-udeps.ignore]
development = ["wasm-bindgen-test"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
wasm-bindgen = "0.2.114"
ammonia = "4.1.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
proptest = "1"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
