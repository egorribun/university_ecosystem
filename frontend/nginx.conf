upstream backend {
    server backend:8000;
}

# Handle WebSocket Upgrade headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    # NOTE: Content-Security-Policy is NOT set here.
    # The backend (app/core/policies/csp.py) generates a nonce-based CSP header
    # (strict-dynamic + require-trusted-types-for) on every proxied response.
    # nginx add_header would override it — that would defeat nonce protection entirely.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # DEBT-06 (audit 2026-03-06): Block Flash/PDF cross-domain policy files.
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # DEBT-06: Prevent cross-origin embedding of our assets via <img>, <script>, etc.
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # DEBT-06: Reject oversized request bodies at nginx level before they reach the backend.
    # Backend independently limits file uploads; this is a defence-in-depth DoS guard.
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy API requests to backend
    location ^~ /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Auth-specific paths if they are separate from /api/
    location ^~ /auth/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy standard status endpoint
    location = /healthz {
        proxy_pass http://backend/healthz;
        proxy_set_header Host $host;
    }

    # Proxy WebSocket connections to backend
    location ^~ /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 300s: client pings every 30s (useChatWebSocket.ts), so 5 min is safe.
        # 86400 (24h) keeps zombie connections alive for hours after network failure.
        proxy_read_timeout 300;
    }

    # Proxy static files from backend
    location ^~ /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Service Worker must not be cached and needs correct headers
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Service-Worker-Allowed "/" always;
        expires off;
        try_files $uri =404;
    }

    # Cache hashed build assets for a long time.
    # Handles both /assets/... and root-level hashed files
    location ~* \.(?:js|css|webp|png|jpg|jpeg|gif|ico|svg|json)$ {
        try_files $uri /index.html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Serve the SPA entry point for all other routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
