<!doctype html>
<html lang="ru">

<head>
  <script>
    ;(function () {
      // 1. Theme Initialization
      var s = null
      try { s = localStorage.getItem("ue-mode") } catch (e) {}
      var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      var dark = s ? s === "dark" : m
      var html = document.documentElement
      if (dark) html.classList.add("dark")

      // 2. Language Detection
      var lang = "ru"
      try {
        var storedLang = localStorage.getItem("ue:language")
        if (storedLang === "en" || storedLang === "ru") {
          lang = storedLang
        } else {
          var browser = (navigator.language || "").toLowerCase()
          if (browser.indexOf("en") === 0) lang = "en"
        }
      } catch (error) {}
      html.setAttribute("lang", lang)
      window.__UE_SELECTED_LANG__ = lang

      // 3. Static Shell Hooks
      import("/static-shell-i18n.js")
        .then(({ applyDocumentLanguage, applyMetaTranslations }) => {
          applyDocumentLanguage(document, lang)
          applyMetaTranslations(document, lang)
        })
        .catch(function() {})
    })()
  </script>

  <style>
    :root {
      --initial-bg: #f8fafc;
      --z-debug: 999999;
    }

    .dark {
      --initial-bg: #020617;
    }

    html {
      background: var(--initial-bg, #060b14) !important;
      background-color: var(--initial-bg, #060b14) !important;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      height: auto;
      scrollbar-gutter: stable;
      visibility: visible;
      overflow-y: auto;
    }

    body {
      background: var(--initial-bg, #060b14) !important;
      background-color: var(--initial-bg, #060b14) !important;
      margin: 0;
      overscroll-behavior-y: none;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      height: auto;
      opacity: 1;
      visibility: visible;
    }

    #root {
      background: var(--initial-bg, #060b14) !important;
      background-color: var(--initial-bg, #060b14) !important;
      min-height: 100dvh;
      height: auto;
      opacity: 0;
      transition: opacity 0.15s ease-in;
    }

    #root.ready,
    .lhci-mode #root {
      opacity: 1;
    }

    html::before,
    html::after,
    body::before,
    body::after {
      display: none !important;
    }
  </style>
