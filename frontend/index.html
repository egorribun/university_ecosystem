<!doctype html>
<html lang="ru">
  <head>
    <script>
      ;(function () {
        // 1. Theme Initialization
        var s = null
        try {
          s = localStorage.getItem("ue-mode")
        } catch (e) {}
        var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        var dark = s ? s === "dark" : m
        var html = document.documentElement
        if (dark) html.classList.add("dark")

        // 2. Language Detection
        var lang = "ru"
        try {
          var cookieMatch = document.cookie.match(/(?:^|;\s*)ue:language=(ru|en)(?:;|$)/)
          if (cookieMatch) {
            lang = cookieMatch[1]
          } else {
            var storedLang = localStorage.getItem("ue:language")
            if (storedLang === "en" || storedLang === "ru") {
              lang = storedLang
            }
          }
        } catch (error) {}
        html.setAttribute("lang", lang)
        window.__UE_SELECTED_LANG__ = lang

        // 3. Static Shell Hooks
        import("/static-shell-i18n.js")
          .then(({ applyDocumentLanguage, applyMetaTranslations }) => {
            applyDocumentLanguage(document, lang)
            applyMetaTranslations(document, lang)
          })
          .catch(function () {})
      })()
    </script>

    <style>
      :root {
        --initial-bg: #f8fafc;
        --z-debug: 999999;
      }

      .dark {
        --initial-bg: #020617;
      }

      html {
        background: var(--initial-bg, #060b14) !important;
        background-color: var(--initial-bg, #060b14) !important;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        height: auto;
        scrollbar-gutter: stable;
        visibility: visible;
        overflow-y: auto;
      }

      body {
        background: var(--initial-bg, #060b14) !important;
        background-color: var(--initial-bg, #060b14) !important;
        margin: 0;
        overscroll-behavior-y: none;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        height: auto;
        opacity: 1;
        visibility: visible;
      }

      #root {
        background: var(--initial-bg, #060b14) !important;
        background-color: var(--initial-bg, #060b14) !important;
        min-height: 100dvh;
        height: auto;
        opacity: 0;
        transition: opacity 0.15s ease-in;
      }

      #root.ready,
      .lhci-mode #root {
        opacity: 1;
      }

      html::before,
      html::after,
      body::before,
      body::after {
        display: none !important;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!--
    Content-Security-Policy is NOT set here.
    In production: the backend (app/core/policies/csp.py) injects a nonce-based
    CSP header (strict-dynamic + require-trusted-types-for 'script') on every response.
    In development: Vite injects a permissive dev-only meta-CSP via vite.config.ts plugin.
    Setting a static CSP here would override the server header and defeat nonce protection.
  -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta
      name="description"
      content="Всё необходимое — профиль, расписание, новости и события кампуса — в одном месте."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Экосистема ГУУ" />
    <meta
      property="og:description"
      content="Личный кабинет: профиль, расписание, новости и события кампуса."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Экосистема ГУУ" />
    <meta
      name="twitter:description"
      content="Личный кабинет: профиль, расписание, новости и события кампуса."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="google-site-verification" content="not-applicable" />
    <title>Экосистема ГУУ</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!--
    External image fallback connection hints — preconnect + dns-prefetch to picsum.photos (placeholder
    image CDN used by NewsCard + EventCard heroes). Phase 0 chrome-devtools
    LCPDiscovery insight on /news flagged "Request is discoverable in
    initial document: FAILED" — image URL is seeded from client state, so
    we can't preload the specific URL, but we CAN pre-establish the TCP +
    TLS + DNS connection to the origin. Saves ~150-300ms on mobile 3G for
    the first above-the-fold hero image. `crossorigin` attribute is
    required so the preconnect reuses the credentialed-CORS connection
    established when the img fetch fires (image requests go out with
    crossorigin semantics).
    -->
    <link rel="preconnect" href="https://picsum.photos" crossorigin />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>

  <body>
    <div
      id="lhci-marker"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        color: black;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        z-index: var(--z-debug);
      "
    >
      LHCI RENDER START
    </div>
    <div id="root"></div>
    <noscript>
      <style>
        #root {
          display: block !important;
        }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
