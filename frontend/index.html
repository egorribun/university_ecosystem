<!doctype html>
<html lang="ru">

<head>
  <script>
    ; (function () {
      var s = null
      try {
        s = localStorage.getItem("ue-mode")
      } catch (e) { }
      var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      var dark = s ? s === "dark" : m
      // Standardized theme colors from theme.css
      var bg = dark ? "#020617" : "#f8fafc"
      var html = document.documentElement
      html.style.backgroundColor = bg
      html.style.setProperty("--initial-bg", bg)
      if (dark) {
        html.classList.add("dark")
      }
    })()
  </script>
  <!-- LHCI_MODE_MARKER -->
  <style>
    /* LHCI_CSS_PLACEHOLDER */
  </style>
  <script>
      ; (function () {
        import("/static-shell-i18n.js")
          .then(({ applyDocumentLanguage, applyMetaTranslations, getPreferredLanguage }) => {
            const language = window.__UE_SELECTED_LANG__ || getPreferredLanguage(window)
            window.__UE_SELECTED_LANG__ = language
            applyDocumentLanguage(document, language)
            applyMetaTranslations(document, language)
          })
          .catch((error) => {
            console.error("Failed to load static shell translations", error)
          })
      })()
  </script>
  <script>
      ; (function () {
        var lang = "ru"
        try {
          var storedLang = localStorage.getItem("ue:language")
          if (storedLang === "en" || storedLang === "ru") {
            lang = storedLang
          } else {
            var browser = (navigator.language || "").toLowerCase()
            if (browser.indexOf("en") === 0) {
              lang = "en"
            }
          }
        } catch (error) { }
        document.documentElement.setAttribute("lang", lang)
        window.__UE_SELECTED_LANG__ = lang
      })()
  </script>
  <style>
    :root {
      --initial-bg: #f8fafc;
    }

    .dark {
      --initial-bg: #020617;
    }

    html {
      background: var(--initial-bg, #060b14) !important;
      background-color: var(--initial-bg, #060b14) !important;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      height: auto;
      scrollbar-gutter: stable;
      visibility: visible;
      overflow-y: auto;
    }

    body {
      background: var(--initial-bg, #060b14) !important;
      background-color: var(--initial-bg, #060b14) !important;
      margin: 0;
      overscroll-behavior-y: none;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      height: auto;
      opacity: 1;
      visibility: visible;
    }

    #root {
      background: var(--initial-bg, #060b14) !important;
      background-color: var(--initial-bg, #060b14) !important;
      min-height: 100dvh;
      height: auto;
      opacity: 0;
      transition: opacity 0.15s ease-in;
    }

    #root.ready,
    .lhci-mode #root {
      opacity: 1;
    }

    html::before,
    html::after,
    body::before,
    body::after {
      display: none !important;
    }
  </style>
