<!doctype html>
<html lang="ru" style="background-color: #060B14;">
  <head>
    <script>
      (function () {
        var s = null;
        try {
          s = localStorage.getItem("theme");
        } catch (e) {}
        var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = s ? s === "dark" : m;
        var bg = dark ? "#060B14" : "#E8F1FB";
        var html = document.documentElement;
        html.style.backgroundColor = bg;
        html.style.setProperty("--initial-bg", bg);
        if (dark) {
          html.classList.add("dark");
        }
      })();
    </script>
    <script>
      (function () {
        import("/static-shell-i18n.js")
          .then(({ applyDocumentLanguage, applyMetaTranslations, getPreferredLanguage }) => {
            const language = window.__UE_SELECTED_LANG__ || getPreferredLanguage(window);
            window.__UE_SELECTED_LANG__ = language;
            applyDocumentLanguage(document, language);
            applyMetaTranslations(document, language);
          })
          .catch((error) => {
            console.error("Failed to load static shell translations", error);
          });
      })();
    </script>
    <script>
      (function () {
        var lang = "ru";
        try {
          var storedLang = localStorage.getItem("ue:language");
          if (storedLang === "en" || storedLang === "ru") {
            lang = storedLang;
          } else {
            var browser = (navigator.language || "").toLowerCase();
            if (browser.indexOf("en") === 0) {
              lang = "en";
            }
          }
        } catch (error) {}
        document.documentElement.setAttribute("lang", lang);
        window.__UE_SELECTED_LANG__ = lang;
      })();
    </script>
    <style>
      :root {
        --initial-bg: #060B14;
      }
      html {
        background: var(--initial-bg, #060B14) !important;
        background-color: var(--initial-bg, #060B14) !important;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        height: auto;
        scrollbar-gutter: stable;
        visibility: visible;
      }
      body {
        background: var(--initial-bg, #060B14) !important;
        background-color: var(--initial-bg, #060B14) !important;
        margin: 0;
        overscroll-behavior-y: none;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        height: auto;
        opacity: 1;
        visibility: visible;
      }
      #root {
        background: var(--initial-bg, #060B14) !important;
        background-color: var(--initial-bg, #060B14) !important;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        height: auto;
        opacity: 0;
        transition: opacity 0.15s ease-in;
      }
      #root.ready {
        opacity: 1;
      }
      html::before,
      html::after,
      body::before,
      body::after {
        display: none !important;
      }
      * { scrollbar-width: none; -ms-overflow-style: none }
      *::-webkit-scrollbar { display: none; width: 0; height: 0 }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta

        font-src 'self' data: https://fonts.gstatic.com;

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E8F1FB" />

    <meta
