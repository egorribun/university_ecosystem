[project]
name = "university-ecosystem"
version = "1.0.0"
description = "University Ecosystem Platform"
# MOD-03 (audit 2026-03-06): CI and mypy already target 3.12; enforce it here.
# Benefits: @override decorator, tomllib in stdlib, faster TaskGroup, ~5% CPython throughput.
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.0",      # No breaking API changes between 23 and 24; pin removed (TD-3: audit 2026-02-24)
    "aiosqlite>=0.19",
    "alembic>=1.13,<2.0",
    "anyio>=4.0.0,<5.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.30.0",
    "bcrypt==5.0.0",
    # PERF-7 (audit 2026-03-05): Switched from synchronous boto3 to aioboto3 (async
    # native wrapper). boto3 is a transitive dependency of aioboto3 so no separate
    # entry needed. v15.5.0 is the current stable release (March 2026).
    "aioboto3>=15,<16",
    "brotli-asgi>=1.4",
    "clamd>=1.0.2",
    "cryptography>=41",
    "defusedxml>=0.7.1",
    "diskcache>=5.6.0",
    "elasticsearch[async]>=8.0,<9.0.0",
    "email-validator>=2.0",
    "fastapi>=0.135.1,<1.0",
    "filelock>=3.20.3",
    "geoip2>=4.0",
    "gputil>=1.4.0",
    "grpcio>=1.60.0",
    "grpclib>=0.4.7",
    "httpx>=0.27",
    "minio>=7.2",
    "nats-py>=2.9",
    "nh3>=0.2.17",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-asgi",
    "opentelemetry-instrumentation-asyncpg",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-sdk",
    "opentelemetry-semantic-conventions",
    "orjson>=3.10",
    "pgvector>=0.4.2",
    "pillow>=10",
    "pillow-avif-plugin>=1.4.0",
    "polars>=1.0",
    "prometheus-client>=0.20",
    "protobuf>=6.33.5",
    "psutil>=6.0.0",
    "psycopg[binary]>=3.1",
    "pyasn1>=0.6.2",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.13.0,<3",
    "pyjwt>=2.10.1",
    "pyotp>=2.9",
    "pyroscope-io>=0.8.0 ; sys_platform != 'win32'",
    "python-dotenv>=1.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.22",
    "pyvips>=2.2 ; sys_platform != 'win32'",
    "pywebpush>=1.9",
    "redis>=5,<6",
    "sentry-sdk[opentelemetry]>=2,<3",
    "sqlalchemy[asyncio]>=2.0.48,<3",
    "starlette>=0.40",
    "strawberry-graphql[fastapi]>=0.250",
    "structlog>=24.0",
    "typer>=0.12.0",
    "urllib3>=2.6.3",
    "uvicorn[standard]>=0.23",
    "uvloop>=0.21 ; sys_platform != 'win32'",
    "webauthn>=2.0.0",
    "zxcvbn>=4.5.0",
    "authzed>=1.15.0",
    "grpcio-health-checking>=1.60.0",
    "dishka>=0.14",
    "openfeature-sdk>=0.8.4",
    "rust_ext",
    "pyo3_sanitizer",
    # RZ-11 (audit 2026-03-05): virtualenv moved to [dependency-groups.dev] —
    # it is a developer tooling package that ships pip/setuptools/wheel and
    # inflates the production image with unnecessary CVE surface.
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin",
    "strawberry.ext.mypy_plugin"
]
files = ["app"]
mypy_path = "."
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
explicit_package_bases = true

# Per-module overrides for gradual adoption
[[tool.mypy.overrides]]
module = ["alembic.*", "tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false

# Routers and services contain many FastAPI route handlers decorated with
# Depends(); their signatures are validated by FastAPI at startup rather than
# mypy.  Allow missing annotations in these modules during the migration period.
# DEADLINE: 2026-Q3 | Action: annotate each route function one PR at a time,
# then remove that module from this list. Start with app.api.admin.*.
[[tool.mypy.overrides]]
module = ["app.routers.*"]
disallow_untyped_defs = false
check_untyped_defs = false
# Temporarily exempt only the services with the most complex Depends() chains.
# All other services must be fully annotated.
[[tool.mypy.overrides]]
module = "app.core.feature_flags"
warn_unused_ignores = false
# redis.asyncio exposes aclose() at runtime but stubs lag behind; suppress until
# types-redis ships the correct async API surface.
disable_error_code = ["misc", "attr-defined", "type-arg"]

[[tool.mypy.overrides]]
# Redis[T] generic type params missing in several infrastructure modules.
# Tracked: add Redis[Any] annotations across these files in Q3 2026.
module = [
    "app.core.ratelimit.strategies.base",
    "app.services.fraud_detection_service",
    "app.deps.cache",
    "app.api.ws.presence",
    "app.auth.redis_session",
]
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
# Broad User|UserDTO|UUID|str union used for actor flexibility; narrow in Q3 2026.
module = [
    "app.services.user.compliance_service",
    "app.services.user.profile_service",
    "app.services.user.media_service",
]
disable_error_code = ["union-attr", "arg-type"]

[[tool.mypy.overrides]]
module = "app.api.users"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "app.core.metrics"
warn_unreachable = false
warn_unused_ignores = false
disable_error_code = ["unreachable"]

[[tool.mypy.overrides]]
module = "app.utils.files"
warn_unused_ignores = false
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = ["app.services.chat_service", "app.services.webpush"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "pyotp",
    "pywebpush",
    "brotli_asgi",
    "PIL.*",
    "pyvips",
    "alembic.*",
    "fastapi.*",
    "starlette.*",
    "orjson",
    "anyio",
    "dagger",
    "nh3",
    "defusedxml.*",
    "dishka.*",
    "structlog",
    "opentelemetry.*",
    "uvicorn",
    "prometheus_client.*",
    "sentry_sdk.*",
    "openfeature.*",
    "pgvector.*",
    "asyncpg.*",
    "polars",
    "httpx",
    "msgspec.*",
    "pillow_avif",
    "jwt",
    "argon2",
    "webauthn.*",
    "nats.*",
    "psutil",
    "uvloop",
    "bcrypt",
    "aioboto3.*",
    "botocore.*",
    "boto3.*",
    "pydantic_settings.*",
    "maxminddb.*",
    "authzed.*",
    "grpcutil.*",
    "grpclib.*",
    "pyroscope",
    "magic",
    "rust_ext",
    "pyo3_sanitizer",
    "zxcvbn",
    "nats.*",
    "redis.*",
    "clamd",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["gen"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long
    "B008",   # do not perform function calls in argument defaults (FastAPI standard)
    "B007",   # loop control variable not used
    "RUF001", # ambiguous characters
    "RUF002",
    "RUF003",
    # RUF012 (mutable class default) was previously suppressed globally.
    # It has been re-enabled (TD-5: audit 2026-02-24).
    # Run: ruff check --select RUF012 app/ to see and fix remaining violations.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "E402", "W291", "S101", "ERA001"]
"alembic/*" = ["I001", "E402"]
"app/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",                # our code: treat as errors
    "ignore::DeprecationWarning:passlib",       # passlib/bcrypt upstream noise
    "ignore::DeprecationWarning:pkg_resources", # setuptools legacy noise
    "ignore::PendingDeprecationWarning",        # third-party pending removals
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks as integration test requiring external services",
    "flaky: marks as potentially flaky test",
    "security: marks as security-related test",
]
addopts = [
    "--strict-markers",
    "-ra",              # Show extra test summary for all except passed
]

[tool.coverage.run]
relative_files = true
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "fakeredis>=2",
    "hypothesis>=6.112",
    "maturin>=1.7,<2",
    "mypy>=1.19.1",
    "pyright>=1.1.400",
    "pre-commit>=3.8",
    "bandit[toml]>=1.9.4",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-xdist>=3.5",
    "ruff>=0.15.4",
    "types-aiofiles>=25.1.0.20251011",
    # RZ-11 (audit 2026-03-05): virtualenv belongs here — it is developer tooling,
    # not a production runtime dependency.
    "virtualenv>=20.36.2",
    "types-requests>=2.32.4.20260107",
    "types-pyyaml>=6.0.12.20250915",
    "types-redis>=4.6.0.20240425",
]

[tool.uv.workspace]
members = ["native/rust_ext", "crates/pyo3-sanitizer"]

[tool.uv.sources]
rust_ext = { workspace = true }
pyo3_sanitizer = { workspace = true }

[tool.pyright]
# MOD-05 (audit 2026-03-11): Pyright added as an ADDITIONAL type checker alongside
# mypy. Not replacing mypy yet — target Q2 2026 to assess findings and migrate.
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
# Paths to check
include = ["app"]
exclude = ["app/deps", "**/migrations", "**/__pycache__", "**/*.pyi"]
# Use virtual environment
venvPath = "."
venv = ".venv"
# Strict settings for new code
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImports = true
reportUnusedVariable = "warning"
reportDuplicateImport = true

[tool.bandit]
# Bandit static analysis security scanner.
# Runs via pre-commit on app/ (excluding tests/).
targets = ["app"]
exclude_dirs = ["tests", "alembic"]
skips = [
    # B101: assert — acceptable in non-production guard code.
    "B101",
    # B104: bind all interfaces — uvicorn does this intentionally (0.0.0.0).
    "B104",
]
