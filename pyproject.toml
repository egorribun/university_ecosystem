[project]
name = "university-ecosystem"
version = "1.0.0"
description = "University Ecosystem Platform"
# MOD-21-08 (audit 2026-03-25 Wave 21): Standardised on Python 3.14.
# Python 3.14 benefits: deferred annotation evaluation (PEP 649), improved error
# messages, faster startup, template strings (PEP 750), free-threading (PEP 703).
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiofiles>=25.1.0,<26",    # TD-06 (audit 2026-03-15): upper bound prevents silent breaking major upgrades
  "aiosqlite>=0.22.1,<1.0",  # TD-W9-06: upper bound — aiosqlite 1.0 may break API
  "alembic>=1.18.4,<2.0",
  "anyio>=4.13.0,<5.0",
  "argon2-cffi>=25.1.0,<26",  # TD-W18-06 (Wave 18): upper bound prevents silent major-version breakage
  "asyncpg>=0.31.0,<0.32", # PY-P1-01 (audit Wave 10): tight minor bound; Renovate opens PR to advance
  # TD-21-04 (Wave 21): bcrypt removed from production deps — legacy hash
  # verification disabled.  Kept in [dependency-groups.dev] for test compat.
  # "bcrypt==5.0.0",  # REMOVED
  # PERF-7 (audit 2026-03-05): Switched from synchronous boto3 to aioboto3 (async
  # native wrapper). boto3 is a transitive dependency of aioboto3 so no separate
  # entry needed. v15.5.0 is the current stable release (March 2026).
  "aioboto3>=15.5.0,<16",
  "brotli-asgi>=1.6.0",
  "clamd>=1.0.2",
  "cryptography>=46.0.7",                             # TD-06 (audit 2026-03-15): updated to fix CVE-2026-26007
  "defusedxml>=0.7.1",
  "diskcache>=5.6.3",
  "elasticsearch[async]>=9.3.0,<10.0.0",
  "email-validator>=2.3.0,<3",  # TD-W18-06 (Wave 18): upper bound prevents silent major-version breakage
  "fastapi>=0.135.3,<0.142",                          # PY-P1-01 (audit Wave 10): tight minor bound; update consciously via Renovate
  "filelock>=3.25.2",
  "geoip2>=5.2.0",
  "grpcio>=1.80.0",
  "gunicorn>=25.3.0",
  "httpx[http2]>=0.28.1,<1.0",                          # TD-W9-06: upper bound — httpx 1.0 has breaking transport API changes
  "minio>=7.2.20",
  "nats-py>=2.14.0,<3",                                  # MOD-W10-01: upper bound; nats-py 3.0 has breaking JetStream API changes
  "nh3>=0.3.4",
  # MOD-20-02 (audit 2026-03-24): Added upper bounds (<2.0 / <1.0) to prevent
  # accidental major-version breakage.  The 0.x instrumentation packages are
  # NOT beta — the 0.x prefix is a versioning convention tracking the SDK minor.
  "opentelemetry-api>=1.41.0,<2.0",
  "opentelemetry-exporter-otlp>=1.41.0,<2.0",
  "opentelemetry-instrumentation>=0.62b0,<1.0",
  "opentelemetry-instrumentation-asgi>=0.62b0,<1.0",
  "opentelemetry-instrumentation-asyncpg>=0.62b0,<1.0",
  "opentelemetry-instrumentation-fastapi>=0.62b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.62b0,<1.0",
  "opentelemetry-instrumentation-redis>=0.62b0,<1.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.62b0,<1.0",
  "opentelemetry-sdk>=1.41.0,<2.0",
  "opentelemetry-semantic-conventions>=0.62b0,<1.0",
  "orjson>=3.11.8",
  "pgvector>=0.4.2",
  "pillow>=12.3.0",
  "pillow-avif-plugin>=1.5.5,<2",  # TD-26-04: upper bound
  "polars>=1.39.3",
  "prometheus-client>=0.25.0",
  "protobuf>=7.34.1",
  "psutil>=7.2.2",
  "psycopg[binary]>=3.3.3",
  "pyasn1>=0.6.3,<1",  # TD-26-04: upper bound
  "pydantic>=2.12.0,<2.14.0",  # FIX-41-01: Python 3.14 Field.__init__(doc=) support requires 2.13+, but strawberry-graphql incompatible with 2.13.0+
  "pydantic-settings>=2.13.1,<3",
  "pyjwt>=2.12.1",
  "pyopenssl>=26.0.0",
  "pyotp>=2.9,<3",                                    # TD-06 (audit 2026-03-15): upper bound; Renovate will open PR for v3
  "pyroscope-io>=1.0.4 ; sys_platform != 'win32'",
  "python-dotenv>=1.2.2",
  "python-magic>=0.4.27",
  "python-multipart>=0.0.26",
  "pyvips>=3.1.1 ; sys_platform != 'win32'",
  "pywebpush>=2.3.0",
  "redis>=7.4.0,<9",  # FIX-41-03: redis 5.x recursion bug w/ Py3.14 (>=7.4.0). W210: cap <9 (resolved stays 7.4.0; aligns MOD-W5-03 gate across uv edges)
  "sentry-sdk[opentelemetry]>=2.57.0,<3",
  "sqlalchemy[asyncio]>=2.0.49,<3",
  "starlette>=1.0.0,<2.0",                             # MOD-W10-01: upper bound
  "strawberry-graphql[fastapi]>=0.314.3,<0.324.0",    # FIX-41-02: Python 3.14 compat; Renovate opens PR to advance
  "structlog>=25.5.0",
  "typer>=0.24.1",
  "urllib3>=2.6.3,<2.8",                              # PY-P1-01 (audit Wave 10): tight minor bound — urllib3 v3 breaks transport API; update via Renovate
  "uvicorn[standard]>=0.44.0",
  "uvloop>=0.22.1 ; sys_platform != 'win32'",
  "webauthn>=2.7.1",
  "zxcvbn>=4.5.0",
  "authzed>=1.24.4",
  "grpcio-health-checking>=1.80.0",
  "dishka>=1.9.1,<2",                                  # MOD-W10-01: upper bound; dishka 2.0 may restructure DI container API
  "openfeature-sdk>=0.8.4",
  "rust_ext",
  # PY-P1-02 (audit Wave 10): pyo3_sanitizer removed from production deps —
  # it is a build-time / development tooling package, not a runtime dependency.
  # Kept in [dependency-groups.dev] below so it remains available locally and in CI.
  # RZ-11 (audit 2026-03-05): virtualenv moved to [dependency-groups.dev] —
  # it is a developer tooling package that ships pip/setuptools/wheel and
  # inflates the production image with unnecessary CVE surface.
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = [
  "pydantic.mypy",
  "sqlalchemy.ext.mypy.plugin",
  "strawberry.ext.mypy_plugin",
]
files = ["app"]
mypy_path = "."
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
explicit_package_bases = true
implicit_reexport = false    # Catches accidental re-exports from __init__.py modules
warn_no_return = true        # Detects functions with missing return in non-void branches
exclude = [
    "alembic/versions/",     # Auto-generated migrations
    "app/api/generated/",    # Auto-generated OpenAPI client
]

# TD-W15-01 (audit 2026-03-23 Wave 15): Strict mypy for app/repositories/.
# This is the DB boundary — most critical layer for type safety.
# Start with full strict; disable_error_code list should only shrink over time.
[[tool.mypy.overrides]]
module = "app.repositories.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true

# Per-module overrides for gradual adoption
[[tool.mypy.overrides]]
module = ["alembic.*"]
disallow_untyped_defs = false
check_untyped_defs = false

# The initial type hints exception for app.routers.* has been removed.
# Routers must now adhere to strict typing standards using Annotated.
# Temporarily exempt only the services with the most complex Depends() chains.
# All other services must be fully annotated.
[[tool.mypy.overrides]]
module = "app.core.feature_flags"
warn_unused_ignores = false
# redis.asyncio exposes aclose() at runtime but stubs lag behind; suppress until
# types-redis ships the correct async API surface.
disable_error_code = ["misc", "attr-defined", "type-arg"]


# TD-20-06 (audit 2026-03-24): Each exemption below has a tracking comment
# explaining why strict mode is relaxed.  Remove once the underlying issue
# (stubs, complex Depends chains, Prometheus types) is resolved upstream.
[[tool.mypy.overrides]]
module = "app.api.users"
warn_unused_ignores = false
# TD-20-06: Complex Annotated[Depends()] chains produce spurious unused-ignore warnings.

[[tool.mypy.overrides]]
module = "app.core.metrics"
warn_unreachable = false
warn_unused_ignores = false
disable_error_code = ["unreachable"]
# TD-20-06: prometheus_client type stubs mark some branches as unreachable.

[[tool.mypy.overrides]]
module = "app.utils.files"
warn_unused_ignores = false
disable_error_code = ["assignment"]
# TD-20-06: Dynamic file-type detection assigns str | None to str — acceptable.

[[tool.mypy.overrides]]
module = "app.core.middleware.request_id"
warn_unused_ignores = false
# structlog optional import: pre-commit mypy 1.15 doesn't flag assignment, CI mypy does.

[[tool.mypy.overrides]]
module = ["app.services.minio_storage", "app.core.ssrf"]
warn_unused_ignores = false
# pre-commit mypy lacks minio stubs / full socket types; CI mypy has all deps installed.

[[tool.mypy.overrides]]
module = ["app.services.webpush"]
disallow_untyped_defs = false
warn_unused_ignores = false
# TD-20-06: Large service modules with complex async callback signatures.
# Gradual typing in progress — aim to remove this by end of Q2 2026.

[[tool.mypy.overrides]]
module = ["app.graphql.queries", "app.services.chat.command_service"]
warn_unused_ignores = false
# Suppress unused-ignore warnings where CI mypy and pre-commit mypy disagree on error codes.

[[tool.mypy.overrides]]
module = [
  "pyotp",
  "pywebpush",
  "brotli_asgi",
  "PIL.*",
  "pyvips",
  "alembic.*",
  "fastapi.*",
  "starlette.*",
  "orjson",
  "anyio",
  "dagger",
  "nh3",
  "defusedxml.*",
  "dishka.*",
  "structlog",
  "opentelemetry.*",
  "uvicorn",
  "prometheus_client.*",
  "sentry_sdk.*",
  "openfeature.*",
  "pgvector.*",
  "asyncpg.*",
  "polars",
  "httpx",
  "msgspec.*",
  "pillow_avif",
  "jwt",
  "argon2",
  "webauthn.*",
  "nats.*",
  "psutil",
  "uvloop",
  "bcrypt",
  "aioboto3.*",
  "botocore.*",
  "boto3.*",
  "pydantic_settings.*",
  "maxminddb.*",
  "authzed.*",
  "grpcutil.*",
  "pyroscope",
  "magic",
  "rust_ext",
  "pyo3_sanitizer",
  "zxcvbn",
  "nats.*",
  "redis.*",
  "grpc.*",
  "grpc",
  "clamd",
  "elasticsearch.*",
  "structlog.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = ["gen"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "RUF", # ruff-specific rules
  "S",   # flake8-bandit (Security audit)
]
ignore = [
  "E501",   # line too long
  "B008",   # do not perform function calls in argument defaults (FastAPI standard)
  "B007",   # loop control variable not used
  "RUF001", # ambiguous characters
  "RUF002",
  "RUF003",
  # RUF012 (mutable class default) re-enabled (TD-5: audit 2026-02-24).
]

[tool.ruff.lint.per-file-ignores]
"analyze_coverage.py" = ["S314", "E741"]
"scripts/check_mutation_score.py" = ["S603"]
"scripts/run_mutmut_diff.py" = ["S603", "S607"]
"tests/*" = ["ARG001", "ARG002", "E402", "W291", "S101", "S105", "S106", "ERA001"]
"alembic/*" = ["I001", "E402"]
"app/main.py" = ["E402"]
# Wave-20 (audit 2026-03-24): suppress pre-existing false positives on field
# names containing "password"/"auth" that trigger S104/S105 heuristics.
"app/core/config/notifications.py" = ["S104"]  # metrics host 0.0.0.0
"app/core/config/security.py" = ["S105"]  # audit_log_secret dev default
"app/core/config/mixins/mfa_settings.py" = ["S105"]  # password_hibp_api_url
"app/core/config/mixins/rate_limit_settings.py" = ["S105"]  # rate_limit names
"app/services/audit_service.py" = ["S105"]  # AuditEvent enum values
"app/core/exceptions/handlers.py" = ["S101"]  # assert isinstance() guard
"app/cli/tests.py" = ["S603"]  # MOD-29-01: subprocess with hardcoded cmd list (not user input)
"app/schemas/schemas.py" = ["S105"]  # MOD-29-01: token_type="bearer" is not a password
"app/utils/retry.py" = ["S311"]  # MOD-29-01: random.random() for jitter, not crypto

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
  "error::DeprecationWarning",                # our code: treat as errors
  # TD-28-05: passlib removed in Wave 21 (TD-21-04) — filter kept for test compat
  "ignore::DeprecationWarning:passlib",       # passlib/bcrypt upstream noise
  "ignore::DeprecationWarning:pkg_resources", # setuptools legacy noise
  "ignore::DeprecationWarning:dishka",        # dishka 1.8+ starlette integration move
  "ignore::DeprecationWarning:testcontainers", # testcontainers internal deprecations
  "ignore:The 'lia' package has been renamed:DeprecationWarning",  # lia→cross_web (strawberry dep, stacklevel=2)
  "ignore::PendingDeprecationWarning",        # third-party pending removals
  "ignore:DISTINCT ON is currently supported only:sqlalchemy.exc.SADeprecationWarning",  # SQLite test DB — chat repo uses DISTINCT ON
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "schemathesis: marks the dedicated OpenAPI property-based conformance gate",
  "integration: marks as integration test requiring external services",
  "flaky: marks as potentially flaky test",
  "security: marks as security-related test",
  "chaos: marks as chaos/resilience test requiring adversarial conditions",
]
addopts = [
  "--strict-markers",
  "-m",
  "not schemathesis",
  # Keep pytest's transient files inside the repository worktree.  Some Windows
  # environments expose C:\\Temp but deny creating pytest's numbered subdirectory.
  "--basetemp=.pytest_tmp",
  "-ra",              # Show extra test summary for all except passed
]

[tool.coverage.run]
relative_files = true
source = ["app"]
branch = true
omit = [
  # Entrypoints / maintenance scripts — not unit-testable
  "app/worker.py",
  # Entrypoints / scripts — not unit-testable
  "app/__main__.py",
  "app/core/uvloop_setup.py",
  "app/core/profiling.py",
  "app/core/ci/*",
]

[tool.coverage.report]
fail_under = 91
show_missing = true
# Mirrors the canonical floor in quality/quality-contract.json.
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if __name__ == .__main__.:",
  "raise AssertionError",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "artifacts/coverage/python/coverage.json"

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1.0",
  "fakeredis>=2.35.1",
  "hypothesis>=6.151.12",
  "maturin>=1.13.1,<2",
  "mypy>=1.20.1,<2.4",
  "pyright>=1.1.408",
  "pre-commit>=4.5.1",
  "bandit[toml]>=1.9.4",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  # RZ-30-05: ruff v0.15.x has regression (strips except parens → SyntaxError).
  # Pin to 0.14.x until upstream fix lands.  Pre-commit already pins 0.14.14.
  "ruff>=0.14.14,<0.17",
  "types-aiofiles>=25.1.0.20260409",
  # RZ-11 (audit 2026-03-05): virtualenv belongs here — it is developer tooling,
  # not a production runtime dependency.
  "virtualenv>=21.2.1",
  # PY-P1-02 (audit Wave 10): pyo3_sanitizer is a build-time tool, not a runtime dep.
  "pyo3_sanitizer",
  "types-requests>=2.33.0.20260408",
  "types-pyyaml>=6.0.12.20260408",
  "types-redis>=4.6.0.20241004",
  # MOD-07 (audit 2026-03-16 Wave 10): Consumer-driven contract tests for the
  # Python backend → ws-hub NATS message boundary.  pact-python v2 wraps the
  # Pact Rust FFI and exposes the pact.v3 API used in tests/contracts/.
  "pact-python==3.4.0",
  "diff-cover>=9.2.0",
  "mutmut>=3.0.0",
  # Wave 2 / Task 2.3 — Schemathesis for property-based OpenAPI conformance testing.
  # Generates random-but-valid requests from the OpenAPI spec and asserts the
  # server's responses match the declared schemas (status codes, bodies, headers).
  # Runs against the live FastAPI app in CI via ASGI transport (no network needed).
  # NOTE: schemathesis 3.x requires pytest<9; use 4.x which lifted this restriction.
  "schemathesis>=4.0.0,<5",
  "atheris>=2.3.0 ; sys_platform == 'linux'",
  "testcontainers>=4.14.2",
]

# MOD-06 (audit Wave 11): dedicated security scanning group.
# Install with: uv sync --group security
# Used in CI/CD security audit job and pre-deployment gate.
#   bandit   — Python SAST (AST-based, complements ruff's flake8-bandit rules)
#   semgrep  — multi-language semantic SAST with OWASP/CVE rulesets
#   pip-audit — dependency vulnerability scanner (OSV/PyPI Advisory DB)
security = ["bandit[toml]>=1.9.4", "semgrep>=1.159.0", "pip-audit>=2.10.0"]

[tool.uv.workspace]
members = ["native/rust_ext", "crates/pyo3-sanitizer"]

[tool.uv]
exclude-newer = "7 days"
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
override-dependencies = [
    "protobuf>=7.34.1",
    "grpcio>=1.80.0",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.0",
    "opentelemetry-proto>=1.41.0",
    "opentelemetry-semantic-conventions>=0.62b0",
    "click>=8.2.1",
    "tomli>=2.2.1",
]

[tool.uv.sources]
rust_ext = { workspace = true }
pyo3_sanitizer = { workspace = true }

[tool.pyright]
# MOD-05 (audit 2026-03-11): Pyright added as an ADDITIONAL type checker alongside
# mypy. Not replacing mypy yet — target Q2 2026 to assess findings and migrate.
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
# Paths to check
include = ["app"]
exclude = ["app/deps", "**/migrations", "**/__pycache__", "**/*.pyi"]
# Use virtual environment
venvPath = "."
venv = ".venv"
# Strict settings for new code
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImports = true
reportUnusedVariable = "warning"
reportDuplicateImport = true

[tool.bandit]
# Bandit static analysis security scanner.
# TD-W17-05 (Wave 17): tests/ no longer excluded — test code can contain
# security anti-patterns (hardcoded credentials, shell=True, pickle) that
# leak to production via copy-paste. Intentional fixtures use # nosec.
targets = ["app", "tests"]
exclude_dirs = ["alembic"]
skips = [
  # B101: assert — acceptable in non-production guard code.
  "B101",
  # B104: bind all interfaces — uvicorn does this intentionally (0.0.0.0).
  "B104",
]

[tool.mutmut]
# mutmut 3.5.0 config (read from [tool.mutmut] in pyproject by config_reader()).
# The installed 3.5.0 reads `paths_to_mutate` (a LIST — load_config() iterates the
# value, so a bare string would be split char-by-char) to locate the mutation
# universe; without it mutmut falls back to guess_paths_to_mutate(), which does
# NOT try app/ and raises FileNotFoundError ("Could not figure out where the code
# to mutate is"). `source_paths` is a newer/unreleased key NOT recognized by 3.5.0.
# `pytest_add_cli_args_test_selection` scopes the pytest run. Incremental file
# selection is done positionally via dotted-module glob patterns at the CLI
# (see .github/workflows/ci.yml mutation-tests job) — those filter within this universe.
paths_to_mutate = ["app/"]
pytest_add_cli_args_test_selection = ["tests/"]
# mutmut runs the baseline/stats suite inside an isolated `mutants/` copy whose
# tree is built by copy_src_dir() (walk_all_files copies ONLY paths_to_mutate =
# app/) plus copy_also_copy_files() (the user-config `also_copy` paths). tests/
# arrives via mutmut's own test-selection copy, but on-disk repo files OUTSIDE
# app/+tests/ are NOT copied — so infra-contract tests that assert those files
# fail in the mutants/ copy with "Path doesn't exist: mutants/<path>" →
# "failed to collect stats. runner returned 1" (the mutmut CI job's sole failure
# mode; `mutmut run` itself exits 0 even with surviving mutants — score-gating is
# the separate `export_cicd_stats` command the CI does not call).
#
# These three tests assert repo files mutmut's mutants/ copy lacks AND exercise
# ZERO app/ source (pure infra-config contracts → zero mutation-killing signal),
# so they are correctly excluded from the mutation baseline:
#   - test_migrations_runtime.py  → alembic/ ScriptDirectory (head convergence)
#   - test_wave173_caddy_routing  → infrastructure/Caddyfile  (W173 routing)
#   - test_wave173_ws_hub_env     → docker-compose.full.yml   (W173 ws-hub env)
# Copy the repository-contract paths into the isolated tree so the full nightly
# run can measure them without a false collection failure. This also keeps the
# incremental runner's clean-test baseline honest.
also_copy = ["infrastructure", "alembic", "docker-compose.full.yml"]
#
# UPDATE (mutmut-green fix): the async cross-loop exclusions (test_spotify_fallback /
# test_push_router_full / test_auth_mfa / test_notifications_api) have been REMOVED.
# mutmut runs pytest multiple times IN ONE PROCESS (stats -> clean test -> forced-fail,
# then os.fork per mutant), and the 2nd pytest.main() errored at async teardown with
# "The future belongs to a different loop". ROOT CAUSE = the lifespan `periodic_scheduler`
# background daemon (app/core/lifespan.py) — the ONLY background task NOT already gated
# out of the "testing" environment (Outbox/NATS/partition all skip in testing). Its
# asyncio.Task + Event bound to run-1's event loop and leaked into run-2 -> cross-loop
# error. Gating it on `settings.environment != "testing"` (matching the existing daemon
# gates) removes the only loop-leaking background task, so EVERY async test now survives
# mutmut's multi-pytest.main() cycle. Validated locally on Windows WITHOUT mutmut via a
# 2x-pytest.main()-in-one-process repro over the 5 formerly-failing files / 87 tests
# (incl. test_event_attendance_api, session-5's "moved-to" failure) -> run-2 clean.
# (Session-5's dispose-engine hook only MOVED the failure because the engine was not the
# first leaker — periodic_scheduler's Task/Event was. No conftest hook is needed now.)
pytest_add_cli_args = [
    "--ignore=tests/integration/test_migration_data.py",
    # Schemathesis dynamically generates tests that pytest cannot collect individually by node ID,
    # causing exit code 4 / BadTestExecutionCommandsException. Ignore them under mutmut.
    "--ignore=tests/test_schemathesis_api.py",
    # Lifespan tests check database readiness using alembic.ini which mutmut doesn't copy.
    "--ignore=tests/test_lifespan.py",
]
