[package]
name = "pyo3-sanitizer"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the ammonia-based HTML sanitizer (isomorphic with the WASM frontend crate)"
authors = ["Admin"]
license = "MIT"

[lib]
# cdylib = native Python extension (.pyd / .so), rlib for fuzzing/testing
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 extension-module feature = embed Python only at link time, not startup.
# This is the correct feature for native Python .so extensions built by maturin.
pyo3 = { version = "0.29", features = ["abi3-py311"] }  # RUSTSEC-2026-0176/-0177: patched in >=0.29.0
ammonia = "4.1.2"

[dev-dependencies]
# Property-based testing: generates arbitrary inputs to find edge cases automatically.
proptest = "1"
# Micro-benchmarking framework for reliable, statistically-sound measurements.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sanitizer_bench"
harness = false

[profile.release]
# LTO produces significantly smaller binaries for cdylib targets at the cost of
# a longer link step. Acceptable for the infrequent CI build cadence.
lto = true
opt-level = 3
codegen-units = 1

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
