repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.3
    hooks:
      - id: ruff
        name: ruff check
        args: ["--fix"]
      - id: ruff
        name: ruff fix imports
        args: ["--select", "I", "--fix"]
      - id: ruff
        name: ruff check imports (no-fix)
        stages: [manual]
        args: ["--select", "I"]
      - id: ruff-format
        name: ruff format

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--line-length=88]
      - id: black
        name: black (check only)
        stages: [manual]
        args: [--check, --diff, --line-length=88]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.3
    hooks:
      - id: gitleaks
        args: ["protect", "--staged"]

  - repo: local
    hooks:
      - id: enforce-secret-strength
        name: Enforce strong secrets in env files
        entry: python scripts/enforce_secret_strength.py
        language: system
        files: "(\\.env(\\.example)?|docker-compose\\.yml)$"
