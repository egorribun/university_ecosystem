repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        name: ruff check
        args: ["--fix"]
      - id: ruff
        name: ruff fix imports
        args: ["--select", "I", "--fix"]
      - id: ruff
        name: ruff check imports (no-fix)
        stages: [manual]
        args: ["--select", "I"]
      - id: ruff-format
        name: ruff format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit security scan
        # Config lives in [tool.bandit] inside pyproject.toml.
        args: ["-c", "pyproject.toml"]
        files: ^app/
        exclude: ^tests/

  - repo: local
    hooks:
      - id: enforce-secret-strength
        name: Enforce strong secrets in env files
        entry: python scripts/enforce_secret_strength.py
        language: system
        files: "(\\.env(\\.example)?|docker-compose\\.yml)$"
