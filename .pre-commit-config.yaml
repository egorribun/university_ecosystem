repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14  # TD-29-03: pinned — v0.15.4 strips except-clause parens (SyntaxError on Python 3)
    hooks:
      - id: ruff
        name: ruff check
        args: ["--fix"]
      - id: ruff
        name: ruff fix imports
        args: ["--select", "I", "--fix"]
      - id: ruff
        name: ruff check imports (no-fix)
        stages: [manual]
        args: ["--select", "I"]
      - id: ruff-format
        name: ruff format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets scan
        args: ["--baseline", ".secrets.baseline"]
        exclude: ".env.docker.example|.env.example|uv.lock"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit security scan
        # Config lives in [tool.bandit] inside pyproject.toml.
        args: ["-c", "pyproject.toml"]
        files: ^app/
        exclude: ^tests/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        name: mypy type-check (auth + services)
        args: ["--config-file", "pyproject.toml"]
        # TD-W18-05 (audit 2026-03-23 Wave 18): expanded scope to cover app/services/,
        # app/api/, and app/graphql/ — previously only auth+core+repos were strict-checked.
        files: ^app/(auth|services|api|core|repositories|graphql)/
        additional_dependencies:
          - "pydantic>=2"
          - "pydantic-settings"
          - "sqlalchemy[mypy]>=2"
          - "types-redis"
          - "types-passlib"
          - "types-aiofiles"
          - "types-requests"
          - "types-pyyaml"
          - "types-zxcvbn"
          - "strawberry-graphql>=0.250"
          - "fastapi"
          - "starlette"
          - "nh3"
          - "orjson"
          - "bcrypt"
          - "pyjwt"
          - "argon2-cffi"
          - "aiofiles"
          - "clamd"
          - "python-multipart"
          - "uvicorn"
          - "types-psutil"
          - "dishka"
          - "authzed"
          - "grpcio"

  - repo: local
    hooks:
      - id: enforce-secret-strength
        name: Enforce strong secrets in env files
        entry: python scripts/enforce_secret_strength.py
        language: system
        files: "(\\.env(\\.example)?|docker-compose\\.yml)$"

      # MOD-28-01: Local gate for Python 2 except syntax (mirrors CI gate MOD-27-01)
      # Uses staged content via `git show :file` to avoid false positives from
      # pre-commit stash/restore when ruff-format also modifies files.
      - id: no-python2-except
        name: Reject Python 2 except syntax
        stages: [pre-commit]  # RZ-33-27: was [manual] — must run on every commit
        entry: bash -c 'FAILS=""; for f in $(git diff --cached --name-only --diff-filter=ACM -- "*.py"); do HITS=$(git show ":$f" 2>/dev/null | grep -nP "except\s+\w+\s*,\s*\w+\s*:" || true); if [ -n "$HITS" ]; then while IFS= read -r line; do FAILS="$FAILS\n$f:$line"; done <<< "$HITS"; fi; done; if [ -n "$FAILS" ]; then echo -e "Python 2 except syntax found:$FAILS"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
