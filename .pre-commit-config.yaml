repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        name: ruff check
        args: ["--fix"]
      - id: ruff
        name: ruff fix imports
        args: ["--select", "I", "--fix"]
      - id: ruff
        name: ruff check imports (no-fix)
        stages: [manual]
        args: ["--select", "I"]
      - id: ruff-format
        name: ruff format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets scan
        args: ["--baseline", ".secrets.baseline"]
        exclude: ".env.docker.example|.env.example|uv.lock"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit security scan
        # Config lives in [tool.bandit] inside pyproject.toml.
        args: ["-c", "pyproject.toml"]
        files: ^app/
        exclude: ^tests/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        name: mypy type-check (auth + services)
        args: ["--config-file", "pyproject.toml"]
        files: ^app/(auth|services/auth|api/deps|core)/
        additional_dependencies:
          - "pydantic>=2"
          - "pydantic-settings"
          - "sqlalchemy[mypy]>=2"
          - "types-redis"
          - "types-passlib"
          - "types-aiofiles"
          - "types-requests"
          - "types-pyyaml"
          - "types-zxcvbn"
          - "strawberry-graphql>=0.250"
          - "fastapi"
          - "starlette"
          - "nh3"
          - "orjson"
          - "bcrypt"
          - "pyjwt"
          - "argon2-cffi"
          - "aiofiles"
          - "clamd"
          - "python-multipart"
          - "uvicorn"
          - "types-psutil"
          - "dishka"
          - "authzed"
          - "grpcio"

  - repo: local
    hooks:
      - id: enforce-secret-strength
        name: Enforce strong secrets in env files
        entry: python scripts/enforce_secret_strength.py
        language: system
        files: "(\\.env(\\.example)?|docker-compose\\.yml)$"
