# Infrastructure access and search override.
# Run after the base file:
#   docker compose -f docker-compose.yml -f docker-compose.infra.yml up -d
#
# Existing base services keep their image, command, security, healthcheck, and
# volume definitions. This override only replaces host port publication and
# adds Elasticsearch, preventing version downgrades or duplicate bindings.

services:
  postgres:
    ports: !override
      - "127.0.0.1:54321:5432"

  valkey:
    ports: !override
      - "127.0.0.1:63791:6379"

  spicedb:
    ports: !override
      - "127.0.0.1:50052:50051"

  minio:
    ports: !override
      - "127.0.0.1:9000:9000" # API
      - "127.0.0.1:9001:9001" # Console

  nats:
    ports: !override
      - "127.0.0.1:4222:4222" # Client connections
      - "127.0.0.1:8222:8222" # Monitoring

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.12
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=false
      - "ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required - set in .env file}"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL -u elastic:${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required - set in .env file} http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  elasticsearch-data:
