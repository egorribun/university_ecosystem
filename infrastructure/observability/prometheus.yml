# Prometheus Configuration
# https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# PERF-03 (audit Wave 11, 2026-03-17): alert rule files.
rule_files:
  - "alerts/*.yaml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # University Ecosystem API
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    basic_auth:
      username: metrics_scraper
      password_file: /tmp/backend_metrics_password

  # Notifications Worker
  - job_name: 'notifications-worker'
    static_configs:
      - targets: ['notifications-worker:9101']
    scrape_interval: 30s

  # Valkey/Redis (native RESP is not an HTTP metrics endpoint)
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # OpenFeature flag evaluation service
  - job_name: 'flagd'
    static_configs:
      - targets: ['flagd:8014']
    metrics_path: /metrics

  # MinIO
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster

  # NATS' monitoring port exposes JSON endpoints (/varz, /jsz), not native
  # Prometheus text. Add a maintained exporter before restoring a NATS scrape;
  # pointing Prometheus directly at :8222/metrics produces a permanent 404.

  # Tempo
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
    metrics_path: /metrics

  # Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics

  # Pyroscope
  - job_name: 'pyroscope'
    static_configs:
      - targets: ['pyroscope:4040']
    metrics_path: /metrics

  # Gateway (Go reverse-proxy) — exposes L1 cache + auth metrics
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:9102']
    metrics_path: /metrics
    scrape_interval: 10s
