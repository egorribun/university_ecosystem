services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  redis:
    image: redis:7.4.2-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:test@postgres:5432/test_db
      CACHE_REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      NATS_URL: nats://test-nats:4222
      SECRET_KEY: test_secret_key
      ALEMBIC_CONFIG: alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test-net
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head && pytest tests/ -v --tb=short --ignore=tests/performance"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  test-net:
