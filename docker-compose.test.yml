services:
  postgres:
    image: pgvector/pgvector:pg17
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-net

  redis:
    image: redis:7.4.2-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-net

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      ENVIRONMENT: testing
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:test@postgres:5432/test_db
      CACHE_REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      NATS_URL: nats://test-nats:4222
      SECRET_KEY: test_secret_key
      ALEMBIC_CONFIG: alembic.ini
      # Keep pool small so multiple tests sharing the global engine stay well
      # under PostgreSQL's max_connections=200 limit.
      DATABASE_POOL_SIZE: 5
      DATABASE_MAX_OVERFLOW: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test-net
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head && pytest tests/ -v --tb=short --ignore=tests/performance"

networks:
  test-net:
