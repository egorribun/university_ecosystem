services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - test-net

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M
    networks:
      - test-net

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    ports:
      - "127.0.0.1:8474:8474"   # HTTP API для управления toxics
      - "127.0.0.1:5433:5433"   # PostgreSQL proxy
      - "127.0.0.1:6380:6380"   # Redis proxy
      - "127.0.0.1:4223:4223"   # NATS proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8474/version"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks:
      - test-net

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      ENVIRONMENT: testing
      AUTO_CREATE_SCHEMA: "false"
      RUN_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:test@postgres:5432/test_db
      INTEGRATION_DATABASE_URL: postgresql+asyncpg://postgres:DevSecurePass2024x@university_ecosystem-postgres-1:5432/university  # pragma: allowlist secret; checkov:skip=CKV_SECRET_4:disposable test-only credential for an isolated container
      TEST_USER_EMAIL: test@university.dev
      TEST_USER_PASSWORD: TestPass@2024x  # pragma: allowlist secret; checkov:skip=CKV_SECRET_4:disposable test-only credential for an isolated container
      CACHE_REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      NATS_URL: nats://test-nats:4222
      SECRET_KEY: test_secret_key_for_docker_compose_tests_only_32c  # pragma: allowlist secret
      ALEMBIC_CONFIG: alembic.ini
      # Keep pool small so multiple tests sharing the global engine stay well
      # under PostgreSQL's max_connections=200 limit.
      DATABASE_POOL_SIZE: 5
      DATABASE_MAX_OVERFLOW: 10
      BACKEND_URL: http://backend:8000
      GATEWAY_URL: http://gateway:8080
      TEMPO_URL: http://tempo:3200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test-net
      - app_internal
      - app_db
    volumes:
      - .:/app
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G
    # LOW-W19: removed stale --ignore=tests/performance (directory has no Python tests)
    command: >
      sh -c "alembic upgrade head && pytest tests/ -v --tb=short"

networks:
  test-net:
  app_internal:
    external: true
    name: university_ecosystem_internal
  app_db:
    external: true
    name: university_ecosystem_db_net
