# Dependency Review Configuration
# Used by the dependency-review-action

fail-on-severity: high

allow-licenses:
  - MIT
  - MIT-CMU
  - HPND
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Python-2.0
  - PSF-2.0
  - LGPL-2.0-or-later
  - LGPL-2.1
  - LGPL-2.1-only
  - LGPL-3.0
  - MPL-1.1
  - MPL-2.0
  - Unlicense
  - CC0-1.0
  - 0BSD
  - BlueOak-1.0.0
  - Artistic-2.0
  - Zlib
  - BSL-1.0
  - LicenseRef-scancode-protobuf

allow-ghsas: []

# W149 SW4 — per-package allow for pact-python 3.4.0+.
# Bot reports "We could not detect a license" because the package's
# metadata uses PEP 621 free-text `License: MIT License` instead of PEP
# 639 canonical `License-Expression: MIT`. GitHub Advisory DB cannot
# parse the free-text form. METADATA file at
# .venv/Lib/site-packages/pact_python-3.4.0.dist-info/METADATA confirms
# the actual license is MIT. Inherited from W146 polish-v3 → W147 →
# W148; pre-W149 NOT a CI blocker (severity = warn), but the bot ran
# `:warning:` on every PR — closed here via per-package allowlist
# (purl spec, dependency-review-action v4+).
allow-dependencies-licenses:
  - "pkg:pypi/pact-python"

vulnerability-check: true
license-check: true

comment-summary-in-pr: always
