# Dependency Review Configuration
# Used by the dependency-review-action

fail-on-severity: high

allow-licenses:
  - MIT
  - MIT-CMU
  - HPND
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Python-2.0
  - PSF-2.0
  - LGPL-2.0-or-later
  - LGPL-2.1
  - LGPL-2.1-only
  - LGPL-3.0
  - MPL-1.1
  - MPL-2.0
  - Unlicense
  - CC0-1.0
  - 0BSD
  - BlueOak-1.0.0
  - Artistic-2.0
  - Zlib
  - BSL-1.0
  - LicenseRef-scancode-protobuf
  - LicenseRef-scancode-google-patent-license-golang

allow-ghsas: []

# W149 SW4 — per-package allow for pact-python 3.4.0+.
# Bot reports "We could not detect a license" because the package's
# metadata uses PEP 621 free-text `License: MIT License` instead of PEP
# 639 canonical `License-Expression: MIT`. GitHub Advisory DB cannot
# parse the free-text form. METADATA file at
# .venv/Lib/site-packages/pact_python-3.4.0.dist-info/METADATA confirms
# the actual license is MIT. Inherited from W146 polish-v3 → W147 →
# W148; pre-W149 NOT a CI blocker (severity = warn), but the bot ran
# `:warning:` on every PR — closed here via per-package allowlist
# (purl spec, dependency-review-action v4+).
allow-dependencies-licenses:
  - "pkg:pypi/pact-python"
  - "pkg:github/actions/cache"
  - "pkg:github/actions/upload-artifact"
  - "pkg:golang/github.com/davecgh/go-spew"
  - "pkg:golang/github.com/kr/pretty"
  - "pkg:golang/github.com/pmezard/go-difflib"
  - "pkg:golang/github.com/redis/go-redis/v9"
  - "pkg:golang/github.com/rogpeppe/go-internal"
  - "pkg:golang/gopkg.in/check.v1"
  - "pkg:golang/gopkg.in/yaml.v3"
  - "pkg:golang/github.com/pelletier/go-toml/v2"
  - "pkg:golang/github.com/goccy/go-json"
  - "pkg:golang/github.com/klauspost/cpuid/v2"
  - "pkg:golang/github.com/spf13/pflag"
  - "pkg:pypi/diff-cover"
  - "pkg:pypi/linkify-it-py"
  - "pkg:pypi/mdit-py-plugins"
  - "pkg:pypi/mutmut"
  - "pkg:pypi/textual"
  - "pkg:pypi/uc-micro-py"
  # Session 9 Stream D — wasm-bindgen-test (=0.3.64, rust-crypto dev-dep for the
  # browser-parity KATs) pulls minicov 0.3.8 transitively. minicov is dual
  # Apache-2.0/MIT (permissive, compatible) but its crate metadata emits the
  # malformed string "LicenseRef-bad-apache-2.0mit", which the Advisory DB
  # cannot map to an SPDX id — same metadata-parsing artifact class as the
  # pact-python PEP-639 case above. Test/coverage-only transitive dep.
  - "pkg:cargo/minicov"

vulnerability-check: true
license-check: true

comment-summary-in-pr: always
