# Dependency Review Configuration
# Used by the dependency-review-action

fail-on-severity: critical

allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Python-2.0
  - PSF-2.0
  - LGPL-2.1
  - LGPL-3.0
  - MPL-2.0
  - Unlicense
  - CC0-1.0
  - 0BSD

allow-ghsas: []

vulnerability-check: true
license-check: true

comment-summary-in-pr: always
