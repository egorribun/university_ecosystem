name: Nilaway (Go Nil Pointer Analysis)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  nilaway:
    name: Nilaway Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install Nilaway
        # Content-addressed via Sum DB (sum.golang.org)
        run: go install go.uber.org/nilaway/cmd/nilaway@latest

      - name: Run Nilaway on Go services
        run: |
          exit_code=0
          for dir in services/ws-hub services/file-processor services/gateway; do
            if [ -d "$dir" ]; then
              echo "Running Nilaway on $dir"
              (cd "$dir" && nilaway ./...) || exit_code=$?
            fi
          done
          exit $exit_code
