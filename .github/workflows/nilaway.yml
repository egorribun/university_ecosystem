name: Nilaway (Go Nil Pointer Analysis)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  nilaway:
    name: Nilaway Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"
          cache: true

      - name: Install Nilaway
        # Content-addressed via Sum DB (sum.golang.org)
        run: go install github.com/uber-go/nilaway/cmd/nilaway@latest

      - name: Run Nilaway on Go services
        run: |
          exit_code=0
          for dir in services/ws-hub services/file-processor services/gateway; do
            if [ -d "$dir" ]; then
              echo "Running Nilaway on $dir"
              (cd "$dir" && nilaway ./...) || exit_code=$?
            fi
          done
          exit $exit_code
