name: Generate OpenAPI Spec

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "pyproject.toml"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Importing app.main loads Settings, which requires these values. The spec
    # needs no database connection; SECRET_KEY gets an ephemeral masked value.
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      ENVIRONMENT: testing
      SECRET_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure ephemeral application secret
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          printf 'SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"

      # The application logs to stdout while importing, so the spec is written
      # to its file directly rather than through a stdout redirect.
      - name: Generate OpenAPI spec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend
          uv run --frozen python - <<'PY'
          import json
          import pathlib

          from app.main import app

          spec = app.openapi()
          if not spec.get("paths"):
              raise SystemExit("OpenAPI spec has no paths")
          pathlib.Path("frontend/openapi.json").write_text(
              json.dumps(spec, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          uv run --frozen python -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' frontend/openapi.json

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: frontend/openapi.json
