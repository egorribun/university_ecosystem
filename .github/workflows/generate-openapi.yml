name: Generate OpenAPI Spec

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "app/**"
      - "pyproject.toml"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7.1.5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate OpenAPI spec
        run: |
          mkdir -p frontend
          uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2))" > frontend/openapi.json

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: openapi
          path: frontend/openapi.json

