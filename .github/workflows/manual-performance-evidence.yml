          def cgroup_memory(*, fs=None, max_scopes=MAX_SCOPES):
              """Return visible scopes, or raise TelemetryUnavailable; no root fallback.

              fs is a read-only dependency for bounded fixtures. Production callers omit it.
              Hidden ancestors are always unknown. Missing interfaces fail closed except
              a validated documented global-root layout with non-applicable files.
              """
              fs = fs or LocalFS()
              if not isinstance(max_scopes, int) or not 1 <= max_scopes <= MAX_SCOPES:
                  raise TelemetryUnavailable("Invalid scope budget")
              try:
                  membership_text = fs.read_text("/proc/self/cgroup", PROC_LIMIT)
                  mount_text = fs.read_text("/proc/self/mountinfo", PROC_LIMIT)
                  membership = _membership(membership_text)
                  compatible = []
                  for mount in _mounts(mount_text):
                      if membership.is_relative_to(mount["root"]):
                          compatible.append(mount)
                  if not compatible:
                      raise TelemetryUnavailable(
                          "No compatible visible cgroup2 membership mapping"
                      )
                  # Wider visible views first; all compatible mounts must validate.
                  compatible.sort(key=lambda m: (len(PurePosixPath(m["root"]).parts), m["id"]))
                  scopes, seen = [], set()
                  visits = 0
                  for mount in compatible:
                      point, mount_root = (
                          PurePosixPath(mount["point"]),
                          PurePosixPath(mount["root"]),
                      )
                      path = point / membership.relative_to(mount_root)
                      logical = membership
                      while True:
                          visits += 1
                          if visits > max_scopes:
                              raise TelemetryUnavailable("Visible scope visit budget exceeded")
                          identity, row = _scope(fs, path, logical, mount)
                          if identity not in seen:
                              seen.add(identity)
                              scopes.append(row)
                          if path == point:
                              break
                          path, logical = path.parent, logical.parent
                  if fs.read_text("/proc/self/cgroup", PROC_LIMIT) != membership_text:
                      raise TelemetryUnavailable("Cgroup membership changed during sample")
                  if fs.read_text("/proc/self/mountinfo", PROC_LIMIT) != mount_text:
                      raise TelemetryUnavailable("Mount topology changed during sample")
                  if not any(row["status"] == "observed" for row in scopes):
                      raise TelemetryUnavailable("No visible memory-controller telemetry")
                  return {
                      "membership": str(membership),
                      "mounts": compatible,
                      "scopes": scopes,
                      "scope_visits": visits,
                      "visible_chain_complete": True,
                      "hidden_ancestors": "unknown",
                      "entire_hierarchy_known": False,
                      "scope": "Visible ambient cgroups; usage can include siblings and runner services",
                  }
              except TelemetryUnavailable:
                  raise
              except (OSError, ValueError, KeyError, IndexError) as exc:
                  raise TelemetryUnavailable("Cgroup telemetry unavailable: " + str(exc)) from exc


          def _host_memory(fs):
              values = {}
              for line in fs.read_text("/proc/meminfo", PROC_LIMIT).splitlines():
                  name, separator, rest = line.partition(":")
                  if separator and name in {"MemTotal", "MemAvailable"}:
                      parts = rest.split()
                      if name in values or len(parts) != 2 or parts[1] != "kB":
                          raise TelemetryUnavailable("Malformed or duplicate host memory field")
                      values[name] = _uint(parts[0]) * 1024
              if (
                  set(values) != {"MemTotal", "MemAvailable"}
                  or not 0 <= values["MemAvailable"] <= values["MemTotal"]
                  or not values["MemTotal"]
              ):
                  raise TelemetryUnavailable("Missing or inconsistent host memory telemetry")
              return values


          def _margin(scope, limit, remaining):
              return {
                  "scope": scope,
                  "limit_bytes": limit,
                  "remaining_bytes": remaining,
                  "reserve_bytes": max(MIN_RESERVE, (limit + 4) // 5),
              }


          def memory_sample(known, table, *, fs=None):
              """Return a caller-actionable observation, without signaling any process.

              Stop promptly when stop_required is true. False means only that this
              sample observed no pressure/error; it is not launch approval or OOM safety.
              """
              fs = fs or LocalFS()
              owned = [
                  value
                  for pid, value in table.items()
                  if pid in known and value["start"] == known[pid]
              ]
              result = {
                  "t": time.time(),
                  "process_tree_rss_bytes": sum(value["rss"] for value in owned),
                  "process_count": len(owned),
                  "host_available_bytes": None,
                  "visible_limit_bound_bytes": None,
                  "headroom_bytes": None,
                  "cgroup": None,
                  "margins": [],
                  "pressured_scopes": [],
                  "stop_required": True,
                  "rapid_stop_required": True,
                  "stop_reason": "memory_telemetry_unavailable",
                  "oom_prevention_guaranteed": False,
              }
              try:
                  host = _host_memory(fs)
                  result["host_available_bytes"] = host["MemAvailable"]
                  result["margins"].append(
                      _margin("host", host["MemTotal"], host["MemAvailable"])
                  )
                  result["cgroup"] = cgroup_memory(fs=fs)
                  for scope in result["cgroup"]["scopes"]:
                      maximum = scope["memory.max"]
                      if scope["status"] == "observed" and maximum != "max":
                          result["margins"].append(
                              _margin(
                                  scope["cgroup_path"], maximum, maximum - scope["memory.current"]
                              )
                          )
                  result["headroom_bytes"] = min(
                      row["remaining_bytes"] for row in result["margins"]
                  )
                  result["visible_limit_bound_bytes"] = min(
                      row["limit_bytes"] for row in result["margins"]
                  )
                  result["pressured_scopes"] = [
                      row
                      for row in result["margins"]
                      if row["remaining_bytes"] <= row["reserve_bytes"]
                  ]
                  result["stop_required"] = bool(result["pressured_scopes"])
                  result["rapid_stop_required"] = result["stop_required"]
                  result["stop_reason"] = "memory_pressure" if result["stop_required"] else None
              except (OSError, ValueError, TelemetryUnavailable) as exc:
                  result["telemetry_error"] = str(exc)
                  result["pressured_scopes"] = [
                      row
                      for row in result["margins"]
                      if row["remaining_bytes"] <= row["reserve_bytes"]
                  ]
              return result


          def _event_snapshot(snapshot):
              """Validate bounded event inputs independently of the sampling filesystem."""
              if (
                  not isinstance(snapshot, dict)
                  or snapshot.get("visible_chain_complete") is not True
              ):
                  raise TelemetryUnavailable("Missing or incomplete event snapshot")
              membership = str(_path(snapshot["membership"]))
              mounts = snapshot["mounts"]
              if not isinstance(mounts, list) or not 1 <= len(mounts) <= MAX_CGROUP_MOUNTS:
                  raise TelemetryUnavailable("Invalid event mount snapshot")
              topology = []
              for mount in mounts:
                  device = mount["device"]
                  if (
                      not isinstance(device, str)
                      or len(device) > 64
                      or not re.fullmatch(r"[0-9]+:[0-9]+", device)
                  ):
                      raise TelemetryUnavailable("Invalid event mount device")
                  if type(mount["id"]) is not int or not 0 <= mount["id"] <= 2**64 - 1:
                      raise TelemetryUnavailable("Invalid event mount identity")
                  topology.append(
                      (mount["id"], device, str(_path(mount["root"])), str(_path(mount["point"])))
                  )
              rows = snapshot["scopes"]
              if not isinstance(rows, list) or not 1 <= len(rows) <= MAX_SCOPES:
                  raise TelemetryUnavailable("Invalid or over-budget event scope snapshot")
              scopes = {}
              for row in rows:
                  path = str(_path(row["cgroup_path"]))
                  identity = row["identity"]
                  if not isinstance(identity, (list, tuple)) or len(identity) != 2:
                      raise TelemetryUnavailable("Missing event scope identity")
                  device, inode = identity
                  if (
                      not isinstance(device, str)
                      or len(device) > 64
                      or not re.fullmatch(r"[0-9]+:[0-9]+", device)
                      or type(inode) is not int
                      or not 0 <= inode <= 2**64 - 1
                  ):
                      raise TelemetryUnavailable("Invalid event scope identity")
                  if path in scopes or row["status"] not in {
                      "observed",
                      "documented_global_root_exception",
                  }:
                      raise TelemetryUnavailable("Duplicate or unsupported event scope")
                  counters = {}
                  if row["status"] == "observed":
                      values = row["memory.events.parsed"]
                      if not isinstance(values, dict) or not 5 <= len(values) <= 128:
                          raise TelemetryUnavailable("Missing or over-budget event counters")
                      for name, value in values.items():
                          if (
                              not isinstance(name, str)
                              or not re.fullmatch(r"[a-z_]{1,64}", name)
                              or type(value) is not int
                              or not 0 <= value <= 2**64 - 1
                          ):
                              raise TelemetryUnavailable("Invalid event counter")
                          counters[name] = value
                      if not {"low", "high", "max", "oom", "oom_kill"} <= set(counters):
                          raise TelemetryUnavailable("Required event counters are absent")
                  scopes[path] = {
                      "identity": (device, inode),
                      "status": row["status"],
                      "counters": counters,
                  }
              if not any(row["status"] == "observed" for row in scopes.values()):
                  raise TelemetryUnavailable("No observed event scopes")
              return (membership, tuple(sorted(topology))), scopes


          def cgroup_event_deltas(previous_cgroup, current_cgroup):
              """Pure comparison. Caller retains baseline and sticky run inconclusiveness.

              Any observed oom/oom_kill/oom_group_kill increase is inconclusive. Resets,
              missing/added counters or scopes, changed identities/topology, and invalid
              telemetry are inconclusive too. Unknown hidden ancestry alone is not.
              """
              result = {
                  "inconclusive": False,
                  "stop_required": False,
                  "reason": None,
                  "reasons": [],
                  "oom_increases": [],
                  "counter_deltas": [],
                  "coverage": "Compared visible event counters only; hidden ancestors remain unknown",
              }

              def issue(reason):
                  if reason not in result["reasons"]:
                      result["reasons"].append(reason)

              try:
                  old_topology, old = _event_snapshot(previous_cgroup)
                  new_topology, new = _event_snapshot(current_cgroup)
                  if old_topology != new_topology:
                      issue("event_topology_changed")
                  if old.keys() - new.keys():
                      issue("event_scope_disappeared")
                  if new.keys() - old.keys():
                      issue("event_scope_appeared")
                  for path in sorted(old.keys() & new.keys()):
                      before, after = old[path], new[path]
                      if (
                          before["identity"] != after["identity"]
                          or before["status"] != after["status"]
                      ):
                          issue("event_scope_identity_changed")
                          continue
                      old_values, new_values = before["counters"], after["counters"]
                      if old_values.keys() - new_values.keys():
                          issue("event_counter_disappeared")
                      if new_values.keys() - old_values.keys():
                          issue("event_counter_appeared")
                      deltas = {}
                      for name in sorted(old_values.keys() & new_values.keys()):
                          delta = new_values[name] - old_values[name]
                          deltas[name] = delta
                          if delta < 0:
                              issue("event_counter_reset")
                          if delta > 0 and name in {"oom", "oom_kill", "oom_group_kill"}:
                              result["oom_increases"].append(
                                  {
                                      "scope": path,
                                      "counter": name,
                                      "delta": delta,
                                      "identity": list(after["identity"]),
                                  }
                              )
                              issue("oom_event_increase")
                      if any(deltas.values()):
                          result["counter_deltas"].append(
                              {
                                  "scope": path,
                                  "identity": list(after["identity"]),
                                  "counters": deltas,
                              }
                          )
              except (TelemetryUnavailable, ValueError, TypeError, KeyError) as exc:
                  issue("event_telemetry_unavailable")
                  result["telemetry_error"] = str(exc)
              result["inconclusive"] = bool(result["reasons"])
              result["stop_required"] = result["inconclusive"]
              result["reason"] = result["reasons"][0] if result["reasons"] else None
              return result


          def stop_owned(root, known, grace=20, *, owner, direct_child, deadline, rapid=False):
              started = time.monotonic()
              end = min(started + min(grace, 20), deadline)
              stages = (
                  [(signal.SIGKILL, min(started + 3, deadline))]
                  if rapid
                  else [(signal.SIGTERM, end), (signal.SIGKILL, min(started + 26, deadline))]
              )
              for sig, until in stages:
                  while True:
                      table = process_table()
                      known.update(owner.collect(known, table))
                      owner.reap_adopted(root)
                      # Only Popen reaps its direct child, preserving the actual exit code.
                      direct_child.poll()
                      if not owner.has_children():
                          return True
                      live = {
                          p: s
                          for p, s in known.items()
                          if p in table and table[p]["start"] == s and table[p]["state"] != "Z"
                      }
                      for pid, identity in live.items():
                          owner.send(pid, identity, sig)
                      if root not in live and direct_child.poll() is None:
                          # This direct child cannot have a reused PID while still waitable.
                          direct_child.send_signal(sig)
                      if time.monotonic() >= until:
                          break
                      time.sleep(0.1)
              return False


          def directory_size(root):
              return sum(
                  p.stat().st_size
                  for p in pathlib.Path(root).rglob("*")
                  if p.is_file() and not p.is_symlink()
              )


          def run(
              command, *, cwd, env, output, name, deadline, telemetry=True, event_baseline=None
          ):
              owner = SubreaperOwner()
              previous = {}
              interrupted = []
              try:
                  # Install before launching: a soft cancellation must not kill the owner
                  # between Popen and the first process snapshot.
                  for sig in [signal.SIGTERM, signal.SIGINT]:
                      previous[sig] = signal.signal(
                          sig, lambda received, _: interrupted.append(received)
                      )
                  return run_owned(
                      command,
                      cwd=cwd,
                      env=env,
                      output=output,
                      name=name,
                      deadline=deadline,
                      telemetry=telemetry,
                      owner=owner,
                      interrupted=interrupted,
                      event_baseline=event_baseline,
                  )
              finally:
                  try:
                      owner.release()
                  finally:
                      restore_error = None
                      for sig, handler in previous.items():
                          try:
                              signal.signal(sig, handler)
                          except BaseException as exc:
                              restore_error = restore_error or exc
                      if restore_error:
                          raise restore_error


          def run_owned(
              command,
              *,
              cwd,
              env,
              output,
              name,
              deadline,
              telemetry,
              owner,
              interrupted,
              event_baseline,
          ):
              output = pathlib.Path(output)
              started = time.monotonic()
              known = {}
              reason = None
              log_bytes = 0
              peak = 0
              min_headroom = None
              primary = None
              quiesced = False
              original_identity = None
              selector = None
              next_sample = 0
              rapid_cleanup = False
              event_comparison = None
              if started >= deadline:
                  raise ProbeFailure("Absolute work deadline reached before " + name)
              if interrupted:
                  raise ProbeFailure("Cancelled before launching " + name)
              child = subprocess.Popen(
                  command,
                  cwd=cwd,
                  env=env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  start_new_session=True,
              )
              try:
                  # Every post-Popen acquisition is inside owned cleanup. Capture before
                  # poll/wait can reap even an instant child and permit PID reuse.
                  original_table = process_table()
                  original_identity = original_table.get(child.pid)
                  if original_identity is None:
                      reason = "root_identity_unavailable"
                      raise ProbeFailure("Cannot establish original child process identity")
                  known[child.pid] = original_identity["start"]
                  known.update(owner.collect(known, original_table))
                  selector = selectors.DefaultSelector()
                  selector.register(child.stdout, selectors.EVENT_READ)
                  with (
                      (output / (name + ".log")).open("wb") as log,
                      (output / (name + ".memory.jsonl")).open("w") as memory,
                  ):
                      while child.poll() is None or selector.get_map():
                          now = time.monotonic()
                          table = process_table()
                          known.update(owner.collect(known, table))
                          owner.reap_adopted(child.pid)
                          if interrupted:
                              reason = "cancelled"
                              break
                          if now >= deadline:
                              reason = "absolute_deadline"
                              break
                          if now >= next_sample:
                              next_sample = now + 1
                              if directory_size(output) > ARTIFACT_LIMIT:
                                  reason = "artifact_cap"
                                  break
                              if shutil.disk_usage(output).free < 2 * GIB:
                                  reason = "disk_headroom_below_2GiB"
                                  break
                              if telemetry:
                                  try:
                                      sample = memory_sample(known, table)
                                  except BaseException:
                                      rapid_cleanup = True
                                      raise
                                  memory.write(json.dumps(sample) + "\n")
                                  memory.flush()
                                  peak = max(peak, sample["process_tree_rss_bytes"])
                                  if sample["headroom_bytes"] is not None:
                                      min_headroom = min(
                                          sample["headroom_bytes"],
                                          min_headroom
                                          if min_headroom is not None
                                          else sample["headroom_bytes"],
                                      )
                                  if (
                                      event_baseline is not None
                                      and sample.get("cgroup") is not None
                                  ):
                                      event_comparison = cgroup_event_deltas(
                                          event_baseline, sample["cgroup"]
                                      )
                                      if event_comparison["inconclusive"]:
                                          reason = "cgroup_events: " + event_comparison["reason"]
                                          rapid_cleanup = True
                                          break
                                  if sample["stop_required"]:
                                      reason = sample.get("stop_reason", "memory_pressure")
                                      rapid_cleanup = True
                                      break
                          for key, _ in selector.select(0.1):
                              chunk = os.read(key.fileobj.fileno(), 65536)
                              if not chunk:
                                  selector.unregister(key.fileobj)
                                  continue
                              log_bytes += len(chunk)
                              if log_bytes > LOG_LIMIT:
                                  reason = "log_cap"
                                  break
                              log.write(chunk)
                          if reason:
                              break
              except BaseException as exc:
                  primary = exc
                  if reason is None:
                      reason = type(exc).__name__ + ": " + str(exc)
              finally:
                  cleanup_error = None
                  cleanup_deadline = time.monotonic() + 30
                  owner.cleanup_deadline = cleanup_deadline
                  try:
                      try:
                          quiesced = stop_owned(
                              child.pid,
                              known,
                              grace=3 if not reason else 20,
                              owner=owner,
                              direct_child=child,
                              deadline=cleanup_deadline - 4,
                              rapid=rapid_cleanup,
                          )
                      except BaseException as exc:
                          cleanup_error = exc
                      finally:
                          # Reap even if telemetry, tracing, or tree termination failed.
                          try:
                              child.wait(timeout=2)
                          except subprocess.TimeoutExpired:
                              child.kill()
                              child.wait(timeout=2)
                              quiesced = False
                          # An incomplete /proc snapshot is never enough to end cleanup.
                          # Reparented children may only become visible after root wait.
                          if owner.has_children() and time.monotonic() < cleanup_deadline:
                              quiesced = stop_owned(
                                  child.pid,
                                  known,
                                  owner=owner,
                                  direct_child=child,
                                  deadline=cleanup_deadline,
                                  rapid=True,
                              )
                          quiesced = (
                              quiesced
                              and owner.drain_after_root_wait()
                              and original_identity is not None
                          )
                  finally:
                      if selector is not None:
                          try:
                              selector.close()
                          except BaseException as exc:
                              cleanup_error = cleanup_error or exc
                      try:
                          child.stdout.close()
                      except BaseException as exc:
                          cleanup_error = cleanup_error or exc
                  if interrupted and reason is None:
                      reason = "cancelled"
                  if telemetry and event_baseline is not None:
                      try:
                          event_comparison = cgroup_event_deltas(event_baseline, cgroup_memory())
                      except (OSError, ValueError, TelemetryUnavailable) as exc:
                          event_comparison = {
                              "inconclusive": True,
                              "reason": "final_event_telemetry_unavailable",
                              "error": str(exc),
                          }
                      if event_comparison["inconclusive"]:
                          reason = reason or ("cgroup_events: " + event_comparison["reason"])
                  final_table = process_table()
                  atomic(
                      output / (name + ".process.json"),
                      {
                          "command": command,
                          "seconds": time.monotonic() - started,
                          "exit_code": child.returncode,
                          "failure": reason,
                          "whole_tree_sampled_rss_peak_bytes": peak,
                          "minimum_headroom_bytes": min_headroom,
                          "original_pid": child.pid,
                          "original_start": original_identity["start"]
                          if original_identity
                          else None,
                          "cleanup_failure": str(cleanup_error) if cleanup_error else None,
                          "owned_processes": len(known),
                          "ownership_anchor": {"pid": owner.pid, "start": owner.start},
                          "process_local_subreaper": True,
                          "adopted_children_reaped": owner.reaped,
                          "rapid_memory_pressure_cleanup": rapid_cleanup,
                          "cgroup_event_comparison": event_comparison,
                          "process_tree_quiesced": quiesced
                          and not any(
                              p in final_table
                              and final_table[p]["start"] == s
                              and final_table[p]["state"] != "Z"
                              for p, s in known.items()
                          ),
                      },
                  )
              if primary is not None:
                  raise primary
              if cleanup_error is not None:
                  raise cleanup_error
              if reason or child.returncode or not quiesced:
                  raise ProbeFailure(
                      f"{name}: {reason or child.returncode or 'process tree remains live'}"
                  )


          def isolated_checker(work, source, pins):
              archive = work / "checker.tgz"
              with urllib.request.urlopen(pins["checker_tarball"], timeout=60) as response:
                  raw = response.read(1024 * 1024 + 1)
              if (
                  len(raw) > 1024 * 1024
                  or "sha512-" + base64.b64encode(hashlib.sha512(raw).digest()).decode()
                  != pins["checker_integrity"]
              ):
                  raise ProbeFailure("Official checker integrity mismatch")
              archive.write_bytes(raw)
              root = work / "checker-deps/node_modules/@stryker-mutator/typescript-checker"
              root.mkdir(parents=True)
              with tarfile.open(archive, "r:gz") as tar:
                  for member in tar.getmembers():
                      parts = pathlib.PurePosixPath(member.name).parts
                      if (
                          not parts
                          or parts[0] != "package"
                          or ".." in parts
                          or member.issym()
                          or member.islnk()
                          or not (member.isfile() or member.isdir())
                      ):
                          raise ProbeFailure("Unsafe checker archive")
                      member.name = str(pathlib.PurePosixPath(*parts[1:]))
                      tar.extract(member, root, filter="data")
              package = json.loads((root / "package.json").read_text())
              if (
                  package["name"] != "@stryker-mutator/typescript-checker"
                  or package["version"] != "10.0.0"
              ):
                  raise ProbeFailure("Unexpected checker package")
              deps = source / "frontend/node_modules"
              base = root.parent.parent
              for name in [
                  "typescript",
                  "semver",
                  "@stryker-mutator/api",
                  "@stryker-mutator/util",
                  "@stryker-mutator/core",
              ]:
                  link = base / name
                  link.parent.mkdir(parents=True, exist_ok=True)
                  link.symlink_to(deps / name, target_is_directory=True)
              return root


          def reporter_health(output):
              """Only a clean, bounded reporter wrapUp can provide positive health proof."""
              output = pathlib.Path(output)
              for name in ["reporter.failure.json", "reporter.pending.json"]:
                  if os.path.lexists(output / name):
                      return {"healthy": False, "reason": name + " is present"}
              try:
                  marker = output / "reporter.healthy.json"
                  if marker.is_symlink() or not marker.is_file() or marker.stat().st_size > 4096:
                      raise ValueError("missing or invalid reporter healthy marker")
                  health = json.loads(marker.read_text())
                  if (
                      not isinstance(health, dict)
                      or health.get("schema") != 1
                      or health.get("state") != "healthy"
                      or health.get("report_ready") is not True
                      or health.get("max_count") != 1460
                      or health.get("max_bytes") != 64 * 1024 * 1024
                      or type(health.get("count")) is not int
                      or type(health.get("bytes")) is not int
                      or not 0 <= health["count"] <= 1460
                      or not 0 <= health["bytes"] <= 64 * 1024 * 1024
                  ):
                      raise ValueError("invalid or over-bound reporter healthy marker")
                  raw = output / "mutants.raw.jsonl"
                  if (
                      raw.is_symlink()
                      or not raw.is_file()
                      or raw.stat().st_size != health["bytes"]
                  ):
                      raise ValueError("raw reporter size mismatch")
                  digest = hashlib.sha256()
                  count = 0
                  with raw.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(65536), b""):
                          digest.update(chunk)
                          count += chunk.count(b"\n")
                  if digest.hexdigest() != health.get("sha256") or count != health["count"]:
                      raise ValueError("raw reporter digest or record count mismatch")
                  return {"healthy": True, "count": count, "bytes": health["bytes"]}
              except (OSError, ValueError, TypeError) as exc:
                  return {"healthy": False, "reason": str(exc)}


          def file_sha256(path):
              """Hash evidence in bounded chunks, including during failure finalization."""
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(65536), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def finalize(output, failure):
              output = pathlib.Path(output)
              result = {
                  "schema": 1,
                  "diagnostic_only": True,
                  "release_eligible": False,
                  "kill_credit": 0,
                  "exclusion_credit": 0,
                  "full_campaign_capacity_proven": False,
                  "outcome": "inconclusive",
                  "failure": failure,
                  "upload_on_cancellation": "best effort; not guaranteed after hard kill/runner loss",
              }
              baseline_path = output / "resource-baseline.json"
              if baseline_path.exists() or (output / "seed.json").exists():
                  try:
                      if (
                          not baseline_path.is_file()
                          or baseline_path.stat().st_size > 16 * 1024**2
                      ):
                          raise TelemetryUnavailable("Missing or over-bound resource baseline")
                      baseline = json.loads(baseline_path.read_text())
                      resource = cgroup_event_deltas(baseline, cgroup_memory())
                  except (OSError, ValueError, TelemetryUnavailable) as exc:
                      resource = {
                          "inconclusive": True,
                          "reason": "resource_event_telemetry_unavailable",
                          "error": str(exc),
                      }
                  result["resource_events"] = resource
                  result["resource_capacity_proven"] = False
                  result["hidden_resource_constraints"] = "unknown"
                  result["oom_prevention_guaranteed"] = False
                  if resource["inconclusive"]:
                      result["failure"] = result["failure"] or (
                          "resource events inconclusive: " + resource["reason"]
                      )
              health = reporter_health(output)
              result["reporter_health"] = health
              if not health["healthy"]:
                  result["failure"] = result["failure"] or (
                      "reporter unhealthy: " + health["reason"]
                  )
              if (output / "assignment.json").exists() and not (
                  output / "population.json"
              ).exists():
                  assignment = json.loads((output / "assignment.json").read_text())

                  def canonical(value):
                      return json.dumps(value, sort_keys=True, separators=(",", ":"))

                  expected = {
                      canonical(json.loads(value)): value
                      for value in assignment["expected_signatures"]
                  }
                  observations = {}
                  unmatched = []
                  rawpath = output / "mutants.raw.jsonl"
                  for line in rawpath.read_text().splitlines() if rawpath.exists() else []:
                      try:
                          event = json.loads(line)
                          source = pathlib.Path(os.environ["PROBE_SOURCE"]) / "frontend"
                          file = pathlib.Path(event["fileName"]).relative_to(source).as_posix()
                          signature = {
                              "sourcePath": file,
                              "mutatorName": event["mutatorName"],
                              "replacement": event["replacement"],
                              "start": {
                                  k: event["location"]["start"][k] - 1 for k in ["line", "column"]
                              },
                              "end": {
                                  k: event["location"]["end"][k] - 1 for k in ["line", "column"]
                              },
                          }
                          key = canonical(signature)
                          if key not in expected:
                              unmatched.append(event)
                          else:
                              observations.setdefault(key, []).append(
                                  {
                                      "id": event["id"],
                                      "status": event["status"],
                                      "statusReason": event.get("statusReason"),
                                  }
                              )
                      except (ValueError, KeyError):
                          unmatched.append({"unparsed_raw_line": line})
                  atomic(
                      output / "population.partial.json",
                      {
                          "complete": False,
                          "expected": len(expected),
                          "results": [
                              {
                                  "signature": signature,
                                  "observations": observations.get(key, []),
                                  "observed": key in observations,
                              }
                              for key, signature in expected.items()
                          ],
                          "unmatched_observations": unmatched,
                          "unobserved_status": None,
                          "note": "Missing results have no inferred status or kill/exclusion credit.",
                      },
                  )
              try:
                  population = json.loads((output / "population.json").read_text())
                  plan = json.loads((output / "parity-plan.json").read_text())
                  receipts = (
                      [
                          json.loads(line)
                          for line in (output / "parity.raw.jsonl").read_text().splitlines()
                      ]
                      if (output / "parity.raw.jsonl").exists()
                      else []
                  )
                  by_sig = {r["signature"]: r for r in receipts}
                  expected = {r["signature"] for r in plan["mutants"]}
                  parity_complete = (
                      len(receipts) == len(by_sig) == len(expected) and set(by_sig) == expected
                  )
                  result.update(
                      {
                          "population_complete": population["complete"],
                          "status_counts": population["counts"],
                          "compile_errors": len(expected),
                          "parity_observed": len(receipts),
                          "parity_complete": parity_complete,
                          "parity_missing": sorted(expected - set(by_sig)),
                          "parity_disagreements": [
                              r["signature"] for r in receipts if r["verdict"] != "matched"
                          ],
                          "observed_statuses_preserved": True,
                      }
                  )
                  if (
                      not result["failure"]
                      and health["healthy"]
                      and population["complete"]
                      and population["hasTestedViableMutant"]
                      and parity_complete
                      and all(r["verdict"] == "matched" for r in receipts)
                  ):
                      result["outcome"] = "completed_this_assignment_with_parity"
              except (OSError, ValueError, KeyError) as exc:
                  result["analysis_incomplete"] = str(exc)
              # Keep the raw report untouched. If an output bound was breached, omit entire files,
              # record their hashes, and keep the run inconclusive rather than truncating evidence.
              omitted = []
              while directory_size(output) > ARTIFACT_LIMIT:
                  candidates = [
                      p
                      for p in output.rglob("*")
                      if p.is_file() and p.name not in ["receipt.json", "seed.json"]
                  ]
                  if not candidates:
                      break
                  item = max(candidates, key=lambda p: p.stat().st_size)
                  omitted.append(
                      {
                          "file": str(item.relative_to(output)),
                          "size": item.stat().st_size,
                          "sha256": file_sha256(item),
                      }
                  )
                  item.unlink()
              if omitted:
                  result.update({"outcome": "inconclusive", "omitted_oversize_evidence": omitted})
              atomic(output / "receipt.json", result)
              manifest = [
                  {
                      "path": str(p.relative_to(output)),
                      "bytes": p.stat().st_size,
                      "sha256": file_sha256(p),
                  }
                  for p in sorted(output.rglob("*"))
                  if p.is_file() and p.name != "manifest.json"
              ]
              atomic(
                  output / "manifest.json",
                  {
                      "files": manifest,
                      "payload_bytes": sum(f["bytes"] for f in manifest),
                      "max_artifact_bytes": GIB,
                      "retention_days": 7,
                  },
              )
              if directory_size(output) >= GIB:
                  raise ProbeFailure("Upload payload exceeds 1GiB")
              return result


          def main():
              env = os.environ.copy()
              source = pathlib.Path(env["PROBE_SOURCE"]).resolve()
              work = pathlib.Path(env["PROBE_WORK"]).resolve()
              output = pathlib.Path(env["PROBE_OUTPUT"]).resolve()
              harness = pathlib.Path(env["PROBE_HARNESS"]).resolve()
              output.mkdir(parents=True, exist_ok=True)
              work.mkdir(parents=True, exist_ok=True)
              failure = None
              hard = float(env["PROBE_ABSOLUTE_DEADLINE"])
              work_deadline = hard - 630
              resource_baseline = None

              def interrupted(sig, _):
                  raise ProbeFailure("Interrupted by signal " + str(sig))

              for sig in [signal.SIGINT, signal.SIGTERM]:
                  signal.signal(sig, interrupted)
              pins = json.loads((harness / "pins.json").read_text())
              env.update(
                  {
                      "CI": "true",
                      "TZ": "UTC",
                      "PROBE_SOURCE": str(source),
                      "PROBE_OUTPUT": str(output),
                      "PROBE_HARNESS": str(harness),
                      "PROBE_WORK": str(work),
                  }
              )
              for key in list(env):
                  if any(x in key.upper() for x in ["TOKEN", "PASSWORD", "SECRET"]):
                      env.pop(key)
              env["NODE_OPTIONS"] = "--max-old-space-size=4096"

              def phase(name, args, cwd=None, deadline=work_deadline):
                  env["PROBE_PHASE_REMAINING_MS"] = str(
                      max(0, int((deadline - time.monotonic()) * 1000) - 30000)
                  )
                  run(
                      args,
                      cwd=cwd or str(source / "frontend"),
                      env=env,
                      output=output,
                      name=name,
                      deadline=deadline,
                      event_baseline=resource_baseline,
                  )

              try:
                  resource_baseline = cgroup_memory()
                  atomic(output / "resource-baseline.json", resource_baseline)
                  atomic(
                      output / "host.json",
                      {
                          "cpu_count": os.cpu_count(),
                          "uname": list(os.uname()),
                          "disk": dict(zip(["total", "used", "free"], shutil.disk_usage(work))),
                          "runner_name": env.get("RUNNER_NAME"),
                          "runner_arch": env.get("RUNNER_ARCH"),
                          "image_os": env.get("ImageOS"),
                          "image_version": env.get("ImageVersion"),
                          "cgroup": resource_baseline,
                      },
                  )
                  if (
                      subprocess.check_output(
                          ["git", "rev-parse", "HEAD"], cwd=source, text=True
                      ).strip()
                      != pins["source_sha"]
                  ):
                      raise ProbeFailure("Tested checkout is not exact source SHA")
                  phase(
                      "dependency-setup",
                      [
                          "npm",
                          "ci",
                          "--ignore-scripts",
                          "--no-audit",
                          "--no-fund",
                          "--cache",
                          str(work / "npm-cache"),
                      ],
                  )
                  if time.monotonic() >= work_deadline:
                      raise ProbeFailure("Setup consumed work deadline")
                  phase(
                      "checker-setup",
                      [sys.executable, str(harness / "supervisor.py"), "checker-setup"],
                  )
                  env["PROBE_CHECKER"] = str(
                      work / "checker-deps/node_modules/@stryker-mutator/typescript-checker"
                  )
                  versions = {}
                  for name in [
                      "@stryker-mutator/core",
                      "@stryker-mutator/api",
                      "@stryker-mutator/util",
                      "@stryker-mutator/vitest-runner",
                      "typescript",
                      "@typescript/old",
                      "@typescript/native",
                      "semver",
                  ]:
                      versions[name] = json.loads(
                          (source / "frontend/node_modules" / name / "package.json").read_text()
                      )["version"]
                  if versions != {k: v for k, v in pins["dependency_versions"].items()}:
                      raise ProbeFailure("Installed toolchain differs from approved lock")
                  atomic(
                      output / "toolchain.json",
                      {
                          "versions": versions,
                          "node": subprocess.check_output(
                              ["node", "--version"], text=True
                          ).strip(),
                          "checker_integrity": pins["checker_integrity"],
                      },
                  )
                  phase("prepare", ["node", str(harness / "probe-driver.mjs"), "prepare"])
                  for compiler in ["ts6", "ts7"]:
                      for mode in ["original", "equivalent"]:
                          name = "baseline-" + compiler + "-" + mode
                          phase(
                              name,
                              [
                                  "node",
                                  str(harness / "compiler-diagnostics.mjs"),
                                  str(source / "frontend"),
                                  str(source / "frontend/node_modules"),
                                  compiler,
                                  mode,
                                  str(output / (name + ".json")),
                              ],
                          )
                  producer_cutoff = (
                      work_deadline - 3600
                  )  # reserve up to one hour for exhaustive parity
                  phase(
                      "producer",
                      ["node", str(harness / "probe-driver.mjs"), "producer"],
                      deadline=producer_cutoff,
                  )
                  phase("analyze", ["node", str(harness / "probe-driver.mjs"), "analyze"])
                  replay = work / "replay"
                  replay.mkdir()
                  env["PROBE_REPLAY"] = str(replay)
                  for name in ["frontend", "quality"]:
                      shutil.copytree(
                          source / name,
                          replay / name,
                          ignore=shutil.ignore_patterns("node_modules", "reports", ".git"),
                      )
                  (replay / "frontend/node_modules").symlink_to(
                      source / "frontend/node_modules", target_is_directory=True
                  )
                  phase("parity", ["node", str(harness / "probe-driver.mjs"), "parity"])
              except BaseException as exc:
                  failure = f"{type(exc).__name__}: {exc}"
              finally:
                  result = finalize(output, failure)
                  print(json.dumps(result))
              return 0 if result["outcome"] == "completed_this_assignment_with_parity" else 1


          if __name__ == "__main__":
              if len(sys.argv) > 1 and sys.argv[1] == "checker-setup":
                  isolated_checker(
                      pathlib.Path(os.environ["PROBE_WORK"]),
                      pathlib.Path(os.environ["PROBE_SOURCE"]),
                      json.loads(
                          (pathlib.Path(os.environ["PROBE_HARNESS"]) / "pins.json").read_text()
                      ),
                  )
              elif len(sys.argv) > 1 and sys.argv[1] == "finalize":
                  output = pathlib.Path(os.environ["PROBE_OUTPUT"])
                  if not (output / "receipt.json").exists():
                      finalize(
                          output,
                          "workflow finalizer: "
                          + os.environ.get("PROBE_STEP_OUTCOME", "unknown"),
                      )
                  if directory_size(output) >= GIB:
                      raise ProbeFailure("Upload payload exceeds 1GiB")
              else:
                  sys.exit(main())
          PROBE_FILE_supervisor_py
