                  # not the namespace root. A namespaced non-root still has cgroup.type.
                  # Verify the entire documented layout, not merely a '/' pathname.
                  absent = ["cgroup.type", "cgroup.events", "memory.peak", "memory.events"]
                  if str(logical) != "/" or mount["root"] != "/" or str(path) != mount["point"]:
                      raise TelemetryUnavailable(
                          "Unexplained absent memory interfaces: " + str(path)
                      )
                  if any(
                      _optional_read(fs, str(path / name), VALUE_LIMIT, mount) is not None
