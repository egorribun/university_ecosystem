name: "Manual Performance Evidence"
run-name: "REVISED checker diagnostic / 2595 shard 027"
on:
  workflow_dispatch:
    inputs:
      harness_sha:
        description: "Reviewed immutable diagnostic branch commit SHA"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnostic-pr1306-checker-2595
  cancel-in-progress: false
jobs:
  diagnostic:
    name: "Diagnostic only / Stryker TS6 checker with native TS7 parity"
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/pr1306-checker-2595' && github.sha == inputs.harness_sha && github.run_attempt == 1 && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - name: Seed receipt, establish absolute deadline, materialize reviewed harness
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          PROBE_BASE="${RUNNER_TEMP}/checker-2595-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$PROBE_BASE/harness" "$PROBE_BASE/output" "$PROBE_BASE/work"
          export PROBE_BASE
          cat > "$PROBE_BASE/harness/bootstrap.py" <<'PROBE_FILE_bootstrap_py'
          import json
          import os
          import pathlib
          import time

          root = pathlib.Path(os.environ["PROBE_BASE"])
          values = {
              "PROBE_HARNESS": str(root / "harness"),
              "PROBE_OUTPUT": str(root / "output"),
              "PROBE_WORK": str(root / "work"),
              "PROBE_SOURCE": str(pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "source"),
              "PROBE_PREFLIGHT": str(root / "preflight/PREFLIGHT_ARTIFACT.json"),
              "PROBE_ABSOLUTE_DEADLINE": str(time.monotonic() + 16080),
          }
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          seed = {
              "schema": 1,
              "outcome": "inconclusive",
              "diagnostic_only": True,
              "release_eligible": False,
              "kill_credit": 0,
              "exclusion_credit": 0,
              "harness_sha": os.environ["GITHUB_SHA"],
              "source_sha": "2595c0ebc674edb69557f3c6edd0a184973d62e2",
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "wall_clock_started": time.time(),
              "absolute_monotonic_deadline": values["PROBE_ABSOLUTE_DEADLINE"],
              "budget_seconds": 16080,
              "finalization_reserve_seconds": 600,
              "cleanup_reserve_seconds": 30,
              "parity_reserve_seconds": 3600,
              "upload_on_cancellation": "best effort; a hard kill or runner loss can prevent upload",
          }
          (root / "output/seed.json").write_text(json.dumps(seed, indent=2) + "\n")
          PROBE_FILE_bootstrap_py
          python3 "$PROBE_BASE/harness/bootstrap.py"
          cat > "$PROBE_BASE/harness/pins.json" <<'PROBE_FILE_pins_json'
          {
            "schema": 1,
            "label": "REVISED proposal; original proposal unavailable",
            "source_sha": "2595c0ebc674edb69557f3c6edd0a184973d62e2",
            "diagnostic_branch_base_sha": "b6d50fe468137b10942565bf5501000c04ec8437",
            "diagnostic_branch": "diagnostic/pr1306-checker-2595",
            "provider_run_id": 37164443034,
            "provider_run_attempt": 1,
            "provider_tested_merge_sha": "2f6177ac61ceb1f5cda1450dce07c3979d5407ef",
            "provider_base_sha": "6fa133b57f62c554162876d4e6d8349f8060fce9",
            "preflight_artifact_id": 11288907591,
            "preflight_archive_sha256": "a4f367cbf16c2165103c7cd42387c67f1de47bcedd0a3370f2772749403f41dc",
            "preflight_member_sha256": "87cae755912b9994d9004e9364d976d26917d12af1a765599ae83375514122b2",
            "preflight_payload_sha256": "0740c5ffebfedd0d96df6a1d7606a6ed547db7d20df9b6c92cd43d5410274138",
            "preflight_digest": "3027b8928a46d841dcecd59c7a55c3a76b95a5675bfe4b2efdf47e04f06faeeb",
            "universe": 42897,
            "shard_index": 27,
            "signature_set_sha256": "500aa3d9d0aac1ea663ac3dd60b279e78a1adc5559ca93b167b5712c4a2c0167",
            "checker_tarball": "https://registry.npmjs.org/@stryker-mutator/typescript-checker/-/typescript-checker-10.0.0.tgz",
            "checker_integrity": "sha512-GLvC0LVd8RJ5SxR3eFcgb7DFKmw07DYtPXs942z6Qh7l6p7YBnFyd7lPw7nvA9UKEYDd22embrFmLlyC1XJjXw==",
            "dependency_versions": {
              "@stryker-mutator/core": "10.0.0",
              "@stryker-mutator/api": "10.0.0",
              "@stryker-mutator/util": "10.0.0",
              "@stryker-mutator/vitest-runner": "10.0.0",
              "typescript": "6.0.2",
              "@typescript/old": "6.0.3",
              "@typescript/native": "7.0.2",
              "semver": "7.8.4"
            }
          }
          PROBE_FILE_pins_json
          cat > "$PROBE_BASE/harness/probe-lib.mjs" <<'PROBE_FILE_probe_lib_mjs'
          import { createHash } from "node:crypto";
          export const sha256 = (value) =>
            createHash("sha256").update(value).digest("hex");
          export const json = (value) => JSON.stringify(value, null, 2) + "\n";
          export function applyMutant(source, mutant) {
            const lines = source.split("\n");
            const offset = ({ line, column }) => {
              if (
                !Number.isInteger(line) ||
                !Number.isInteger(column) ||
                line < 0 ||
                line >= lines.length ||
                column < 0 ||
                column > lines[line].length
              )
                throw Error("Invalid mutation range");
              return lines.slice(0, line).reduce((n, s) => n + s.length + 1, 0) + column;
            };
            const start = offset(mutant.start),
              end = offset(mutant.end);
            if (end < start || typeof mutant.replacement !== "string")
              throw Error("Invalid mutation range");
            return source.slice(0, start) + mutant.replacement + source.slice(end);
          }
          export function assessPopulation(expected, results) {
            const terminal = new Set([
              "Killed",
              "Survived",
              "NoCoverage",
              "Timeout",
              "RuntimeError",
              "CompileError",
              "Ignored",
            ]);
            const want = new Set(expected),
              seen = new Set(),
              counts = {},
              foreign = [],
              duplicates = [],
              invalid = [];
            for (const r of results) {
              if (!want.has(r.signature)) foreign.push(r.signature);
              if (seen.has(r.signature)) duplicates.push(r.signature);
              seen.add(r.signature);
              counts[r.status] = (counts[r.status] ?? 0) + 1;
              if (!terminal.has(r.status)) invalid.push(r.signature);
            }
            const missing = expected.filter((s) => !seen.has(s));
            return {
              expected: expected.length,
              observed: results.length,
              counts,
              missing,
              foreign,
              duplicates,
              invalid,
              complete:
                want.size === expected.length &&
                !missing.length &&
                !foreign.length &&
                !duplicates.length &&
                !invalid.length,
              hasTestedViableMutant: results.some(
                (r) => r.status === "Killed" || r.status === "Survived",
              ),
            };
          }
          export function parityVerdict(ts6, ts7) {
            const fingerprint = (d) =>
              JSON.stringify({ code: d.code, file: d.file, start: d.start, end: d.end });
            const canonical = (ds) =>
              JSON.stringify([...new Set(ds.map(fingerprint))].sort());
            return ts6.length > 0 && ts7.length > 0 && canonical(ts6) === canonical(ts7)
              ? "matched"
              : "inconclusive";
          }
          PROBE_FILE_probe_lib_mjs
          cat > "$PROBE_BASE/harness/compiler-diagnostics.mjs" <<'PROBE_FILE_compiler_diagnostics_mjs'
          import fs from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          // Exactly v10.0.0 src/tsconfig-helpers.ts, single-project branch.
          export const checkerCompilerOptions = Object.freeze({
            allowUnreachableCode: true,
            noUnusedLocals: false,
            noUnusedParameters: false,
            noEmit: true,
            incremental: false,
            composite: false,
          });

          export async function diagnostics(root, dependencyRoot, compiler, equivalent) {
            root = path.resolve(root);
            dependencyRoot = path.resolve(dependencyRoot);
            const configPath = path.join(root, "tsconfig.json");
            const ts = (
              await import(
                pathToFileURL(path.join(dependencyRoot, "typescript/lib/typescript.js"))
              )
            ).default;
            const loaded = ts.readConfigFile(configPath, ts.sys.readFile);
            if (loaded.error) throw Error("Cannot parse original tsconfig");
            if (loaded.config.references)
              throw Error(
                "Project references require a separately reviewed parity design",
              );
            const config = structuredClone(loaded.config);
            if (equivalent) {
              config.compilerOptions = {
                ...config.compilerOptions,
                ...checkerCompilerOptions,
              };
              delete config.compilerOptions.tsBuildInfoFile;
              delete config.compilerOptions.declarationDir;
            }
            const locate = (file, start, end) => {
              if (!file) return { file: null, start: null, end: null, range: null };
              const absolute = path.resolve(root, file);
              const text = fs.readFileSync(absolute, "utf8");
              if (
                !Number.isInteger(start) ||
                !Number.isInteger(end) ||
                start < 0 ||
                end < start ||
                end > text.length
              )
                throw Error("Unrepresentable diagnostic range");
              const point = (n) => {
                const before = text.slice(0, n).split("\n");
                return { line: before.length - 1, column: before.at(-1).length };
              };
              return {
                file: path.relative(root, absolute).replaceAll("\\", "/"),
                start,
                end,
                range: { start: point(start), end: point(end) },
              };
            };
            if (compiler === "ts6") {
              const parsed = ts.parseJsonConfigFileContent(
                config,
                ts.sys,
                root,
                undefined,
                configPath,
              );
              const program = ts.createProgram(parsed.fileNames, parsed.options);
              return [...parsed.errors, ...ts.getPreEmitDiagnostics(program)]
                .filter((d) => d.category === ts.DiagnosticCategory.Error)
                .map((d) => ({
                  code: d.code,
                  message: ts.flattenDiagnosticMessageText(d.messageText, "\n"),
                  ...locate(
                    d.file?.fileName,
                    d.start,
                    d.start === undefined ? undefined : d.start + (d.length ?? 0),
                  ),
                }));
            }
            if (compiler !== "ts7") throw Error("Unknown compiler");
            const { API } = await import(
              pathToFileURL(
                path.join(dependencyRoot, "@typescript/native/dist/api/sync/api.js"),
              )
            );
            const api = new API({
              cwd: root,
              fs: equivalent
                ? {
                    readFile: (file) =>
                      path.resolve(file) === configPath
                        ? JSON.stringify(config)
                        : undefined,
                  }
                : undefined,
            });
            try {
              const snapshot = api.updateSnapshot({ openProjects: [configPath] });
              try {
                const program = snapshot.getProject(configPath)?.program;
                if (!program) throw Error("Native API omitted the project");
                const all = [
                  ...program.getConfigFileParsingDiagnostics(),
                  ...program.getProgramDiagnostics(),
                  ...program.getGlobalDiagnostics(),
                  ...program.getSyntacticDiagnostics(),
                  ...program.getBindDiagnostics(),
                  ...program.getSemanticDiagnostics(),
                ];
                const values = all
                  .filter((d) => d.category === 1)
                  .map((d) => ({
                    code: d.code,
                    message: d.text,
                    ...locate(d.fileName, d.pos, d.end),
                  }));
                return [...new Map(values.map((v) => [JSON.stringify(v), v])).values()];
              } finally {
                snapshot.dispose();
              }
            } finally {
              api.close();
            }
          }

          if (process.argv[1] === new URL(import.meta.url).pathname) {
            const [root, deps, compiler, mode, out] = process.argv.slice(2);
            const errors = await diagnostics(root, deps, compiler, mode === "equivalent");
            fs.writeFileSync(
              out,
              JSON.stringify({ compiler, mode, errors }, null, 2) + "\n",
            );
            if (errors.length) process.exitCode = 1;
          }
          PROBE_FILE_compiler_diagnostics_mjs
          cat > "$PROBE_BASE/harness/stryker-child.mjs" <<'PROBE_FILE_stryker_child_mjs'
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          import fs from "node:fs";
          const root = process.env.PROBE_SOURCE;
          const { Stryker } = await import(
            pathToFileURL(
              path.join(
                root,
                "frontend/node_modules/@stryker-mutator/core/dist/src/index.js",
              ),
            )
          );
          const canonical = (
            await import(pathToFileURL(path.join(root, "frontend/stryker.config.mjs")))
          ).default;
          const options = {
            configFile: path.join(root, "frontend/stryker.config.mjs"),
            plugins: [
              ...canonical.plugins,
              path.join(process.env.PROBE_CHECKER, "dist/src/index.js"),
              path.join(process.env.PROBE_HARNESS, "partial-reporter.mjs"),
            ],
            checkers: ["typescript"],
            tsconfigFile: "tsconfig.json",
            typescriptChecker: {
              prioritizePerformanceOverAccuracy: false,
              experimentalNativePreview: false,
            },
            concurrency: 4,
            reporters: ["json", "bounded-diagnostic"],
            jsonReporter: {
              fileName: path.join(process.env.PROBE_OUTPUT, "mutation.raw.json"),
            },
          };
          fs.writeFileSync(
            path.join(process.env.PROBE_OUTPUT, "requested-options.json"),
            JSON.stringify(options, null, 2) + "\n",
          );
          await new Stryker(options).runMutationTest();
          PROBE_FILE_stryker_child_mjs
          cat > "$PROBE_BASE/harness/partial-reporter.mjs" <<'PROBE_FILE_partial_reporter_mjs'
          import fs from "node:fs";
          import path from "node:path";
          import { createHash } from "node:crypto";
          import { pathToFileURL } from "node:url";
          const api = await import(
            pathToFileURL(
              path.join(
                process.env.PROBE_SOURCE,
                "frontend/node_modules/@stryker-mutator/api/dist/src/plugin/index.js",
              ),
            )
          );
          const MAX_COUNT = 1460;
          const MAX_BYTES = 64 * 1024 * 1024;
          class BoundedDiagnosticReporter {
            count = 0;
            bytes = 0;
            attemptedCount = 0;
            attemptedBytes = 0;
            failure = null;
            reportReady = false;
            finished = false;
            hash = createHash("sha256");
            output = process.env.PROBE_OUTPUT;

            constructor() {
              try {
                // Fresh, privately owned output is mandatory. Never erase an old signal.
                this.writeSignal("reporter.pending.json", {
                  schema: 1,
                  state: "pending",
                });
                for (const name of ["reporter.failure.json", "reporter.healthy.json"])
                  if (fs.existsSync(path.join(this.output, name)))
                    throw Error("Reporter signal already exists");
                fs.closeSync(
                  fs.openSync(path.join(this.output, "mutants.raw.jsonl"), "wx"),
                );
              } catch {
                this.fail("reporter_initialization_failed");
              }
            }

            writeSignal(name, value) {
              const fd = fs.openSync(path.join(this.output, name), "wx", 0o600);
              try {
                fs.writeFileSync(fd, JSON.stringify(value) + "\n");
                fs.fsyncSync(fd);
              } finally {
                fs.closeSync(fd);
              }
              const directory = fs.openSync(this.output, "r");
              try {
                fs.fsyncSync(directory);
              } finally {
                fs.closeSync(directory);
              }
            }

            fail(reason) {
              if (!this.failure) {
                this.failure = Error(reason);
                // BroadcastReporter catches callback errors. Also preserve failure in the
                // child exit status, including when storage cannot accept the failure file.
                process.exitCode = 1;
                try {
                  this.writeSignal("reporter.failure.json", {
                    schema: 1,
                    state: "failed",
                    reason,
                    attempted_count: this.attemptedCount,
                    attempted_bytes: this.attemptedBytes,
                    recorded_count: this.count,
                    recorded_bytes: this.bytes,
                  });
                } catch {
                  // Before clean wrapUp, pending or missing healthy evidence fails closed.
                  // A late callback after wrapUp relies on the nonzero child status if
                  // storage cannot persist failure. Never clear the in-memory latch.
                }
              }
              throw this.failure;
            }

            active() {
              if (this.failure) throw this.failure;
              if (this.finished) this.fail("reporter_callback_after_wrap_up");
            }

            onMutantTested(result) {
              this.active();
              let line;
              try {
                // Preserve exactly what Stryker reported. No status synthesis or rewrites.
                line = JSON.stringify(result) + "\n";
                this.attemptedCount++;
                this.attemptedBytes += Buffer.byteLength(line);
              } catch {
                this.fail("reporter_serialization_failed");
              }
              if (this.attemptedCount > MAX_COUNT || this.attemptedBytes > MAX_BYTES)
                this.fail("partial_report_bound_exceeded");
              try {
                fs.appendFileSync(path.join(this.output, "mutants.raw.jsonl"), line);
                this.hash.update(line);
                this.count = this.attemptedCount;
                this.bytes = this.attemptedBytes;
              } catch {
                this.fail("reporter_raw_write_failed");
              }
            }

            onMutationTestReportReady() {
              this.active();
              this.reportReady = true;
            }

            wrapUp() {
              if (this.failure) throw this.failure;
              if (this.finished) return;
              if (!this.reportReady) this.fail("reporter_final_report_missing");
              try {
                const fd = fs.openSync(path.join(this.output, "mutants.raw.jsonl"), "r");
                try {
                  fs.fsyncSync(fd);
                } finally {
                  fs.closeSync(fd);
                }
                this.writeSignal("reporter.healthy.json", {
                  schema: 1,
                  state: "healthy",
                  report_ready: true,
                  count: this.count,
                  bytes: this.bytes,
                  sha256: this.hash.digest("hex"),
                  max_count: MAX_COUNT,
                  max_bytes: MAX_BYTES,
                });
                // Final successful filesystem operation. If health write/fsync fails,
                // pending remains even if a full-looking healthy JSON file was written.
                fs.unlinkSync(path.join(this.output, "reporter.pending.json"));
                this.finished = true;
              } catch {
                this.fail("reporter_finalization_failed");
              }
            }
          }
          export const strykerPlugins = [
            api.declareClassPlugin(
              api.PluginKind.Reporter,
              "bounded-diagnostic",
              BoundedDiagnosticReporter,
            ),
          ];
          PROBE_FILE_partial_reporter_mjs
          cat > "$PROBE_BASE/harness/probe-driver.mjs" <<'PROBE_FILE_probe_driver_mjs'
          import fs from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";
          import {
            sha256,
            json,
            applyMutant,
            assessPopulation,
            parityVerdict,
          } from "./probe-lib.mjs";
          import {
            diagnostics,
            checkerCompilerOptions,
          } from "./compiler-diagnostics.mjs";
          const mode = process.argv[2],
            root = process.env.PROBE_SOURCE,
            out = process.env.PROBE_OUTPUT;
          const deps = path.join(root, "frontend/node_modules"),
            frontend = path.join(root, "frontend");
          const api = await import(
            pathToFileURL(path.join(frontend, "scripts/run-stryker.mjs"))
          );
          const write = (name, data) => {
            const text = json(data);
            if (Buffer.byteLength(text) > 128 * 1024 * 1024)
              throw Error("JSON artifact cap exceeded");
            fs.writeFileSync(path.join(out, name + ".tmp"), text);
            fs.renameSync(path.join(out, name + ".tmp"), path.join(out, name));
          };
          const read = (name) =>
            JSON.parse(fs.readFileSync(path.join(out, name), "utf8"));
          const pins = JSON.parse(
            fs.readFileSync(path.join(process.env.PROBE_HARNESS, "pins.json"), "utf8"),
          );
          async function verify() {
            const raw = fs.readFileSync(process.env.PROBE_PREFLIGHT);
            if (sha256(raw) !== pins.preflight_member_sha256)
              throw Error("Preflight member hash mismatch");
            const artifact = JSON.parse(raw);
            const p = artifact.payload;
            if (
              sha256(json(p)) !== pins.preflight_payload_sha256 ||
              artifact.payloadSha256 !== pins.preflight_payload_sha256 ||
              sha256(JSON.stringify(p.preflight.files)) !== pins.preflight_digest
            )
              throw Error("Preflight payload/universe mismatch");
            if (
              p.workflow.runId !== String(pins.provider_run_id) ||
              p.workflow.runAttempt !== "1" ||
              p.workflow.sourceHeadSha !== pins.source_sha ||
              p.workflow.sha !== pins.provider_tested_merge_sha
            )
              throw Error("Wrong provider identity");
            for (const [file, expected] of Object.entries(p.sourceRevision.inputHashes)) {
              const absolute = path.resolve(root, file);
              if (
                !absolute.startsWith(root + path.sep) ||
                sha256(fs.readFileSync(absolute)) !== expected
              )
                throw Error("Original source input changed: " + file);
            }
            const shard = p.shardPlan[pins.shard_index];
            if (
              shard.id !== "shard-027" ||
              shard.files.length !== 43 ||
              shard.mutantCount !== 1460
            )
              throw Error("Shard assignment mismatch");
            const preflightByFile = new Map(),
              sourceByFile = new Map();
            let universe = 0;
            for (const [file, entry] of Object.entries(p.preflight.files)) {
              const source = fs.readFileSync(path.join(frontend, file), "utf8");
              if (sha256(source) !== entry.sourceSha256)
                throw Error("Universe source changed: " + file);
              preflightByFile.set(file, {
                sourceSha256: entry.sourceSha256,
                mutants: entry.mutantSignatures,
              });
              sourceByFile.set(file, source);
              universe += entry.mutantSignatures.length;
            }
            const expected = [...preflightByFile]
              .flatMap(([file, v]) =>
                v.mutants.filter((s) =>
                  shard.files.some((pattern) =>
                    api.mutationPatternCoversMutant(pattern, s, file),
                  ),
                ),
              )
              .sort();
            if (
              universe !== 42897 ||
              expected.length !== 1460 ||
              new Set(expected).size !== 1460 ||
              sha256(JSON.stringify(expected)) !== pins.signature_set_sha256
            )
              throw Error("Exact population mismatch");
            return {
              shard,
              expected,
              preflightByFile,
              sourceByFile,
              inputHashesChecked: Object.keys(p.sourceRevision.inputHashes).length,
            };
          }
          if (mode === "prepare") {
            const v = await verify();
            write("assignment.json", {
              ...pins,
              patterns: v.shard.files,
              expected_signatures: v.expected,
              input_hashes_checked: v.inputHashesChecked,
              preflight_source_count: v.preflightByFile.size,
              diagnostic_only: true,
              release_eligible: false,
              checker_compiler_options: checkerCompilerOptions,
              worker_split: {
                configured: 4,
                initial_checker: 2,
                initial_vitest: 2,
                vitest_after_checkers: 4,
              },
            });
          } else if (mode === "producer") {
            const v = await verify();
            const temp = path.join(process.env.PROBE_WORK, "stryker");
            fs.mkdirSync(temp);
            await api.stageStrykerSandboxInputs(
              temp,
              path.join(root, "quality/coverage-source-policy.json"),
            );
            const cancel = api.installProcessSignalCancellation();
            try {
              const timeout = Number(process.env.PROBE_PHASE_REMAINING_MS);
              if (!Number.isSafeInteger(timeout) || timeout < 1000)
                throw Error("No producer budget");
              await api.runStrykerShardExecution({
                args: [path.join(process.env.PROBE_HARNESS, "stryker-child.mjs")],
                description: "Diagnostic shard-027 checker",
