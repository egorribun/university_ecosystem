                      # Constructor interruption or a recoverable cleanup error can leave
                      # a live adopted child. Retry discovery/kill/reap within one budget.
                      end = self.cleanup_deadline or (time.monotonic() + 30)
                      known = {}
                      while time.monotonic() < end:
                          try:
                              known.update(self.collect(known, process_table()))
                              for pid, identity in known.items():
