                  ).split()
                  subtree = fs.read_text(
                      str(path / "cgroup.subtree_control"), VALUE_LIMIT, mount=mount
                  ).split()
                  if (
                      "memory" not in controllers
                      or "memory" not in subtree
                      or any(
                          not re.fullmatch(r"[a-z][a-z0-9_]*", item)
                          for item in controllers + subtree
