          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/checker-2595-${{ github.run_id }}-${{ github.run_attempt }}/preflight
          merge-multiple: true
      - name: Run one bounded producer and exhaustive compile-error parity
        id: probe
        shell: bash
        run: python3 "$PROBE_HARNESS/supervisor.py"
      - name: Preserve failure receipt and enforce upload cap
        id: finalize
        if: always()
        shell: bash
        timeout-minutes: 2
        env:
          PROBE_STEP_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          python3 "$PROBE_HARNESS/supervisor.py" finalize
      - name: Upload bounded diagnostic evidence
        if: always() && steps.finalize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
