      - name: Checkout exact original source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          ref: 2595c0ebc674edb69557f3c6edd0a184973d62e2
