          class SubreaperOwner:
              """Own only descendants of this otherwise child-free, single-threaded caller."""

              def __init__(self):
                  if not hasattr(os, "pidfd_open") or not hasattr(signal, "pidfd_send_signal"):
                      raise ProbeFailure("Required Linux pidfd APIs are unavailable")
                  self.pid = os.getpid()
                  tasks = list(pathlib.Path("/proc/self/task").iterdir())
                  if len(tasks) != 1:
                      raise ProbeFailure("Process owner must be single-threaded")
                  # WNOWAIT checks kernel ownership without reaping an unrelated child.
                  try:
                      os.waitid(os.P_ALL, 0, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                  except ChildProcessError:
                      pass
                  else:
                      raise ProbeFailure("Process owner already has children before launch")
                  self.start = self.identity(self.pid)["start"]
                  descriptor = os.pidfd_open(self.pid)
                  try:
                      # Signal zero checks support/permission without delivering a signal.
                      signal.pidfd_send_signal(descriptor, 0)
                  finally:
                      os.close(descriptor)
                  self.libc = ctypes.CDLL(None, use_errno=True)
                  previous = ctypes.c_int()
                  if self.libc.prctl(37, ctypes.byref(previous), 0, 0, 0) != 0:
                      raise ProbeFailure("Cannot read process-local subreaper attribute")
                  self.previous = previous.value
                  self.reaped = []
                  self.cleanup_deadline = None
                  if self.libc.prctl(36, 1, 0, 0, 0) != 0:
                      raise ProbeFailure("Cannot enable process-local subreaper attribute")
                  current = ctypes.c_int()
                  if (
                      self.libc.prctl(37, ctypes.byref(current), 0, 0, 0) != 0
                      or current.value != 1
                  ):
                      self.libc.prctl(36, self.previous, 0, 0, 0)
                      raise ProbeFailure("Process-local subreaper readback failed")

              @staticmethod
              def identity(pid):
                  data = pathlib.Path(f"/proc/{pid}/stat").read_text()
                  fields = data[data.rfind(")") + 2 :].split()
                  return {"ppid": int(fields[1]), "start": int(fields[19])}

              def collect(self, known, table):
                  anchor = table.get(self.pid)
                  if anchor is None or anchor["start"] != self.start:
                      raise ProbeFailure("Process ownership anchor is unavailable")
                  owned = descendants(self.pid, {**known, self.pid: self.start}, table)
                  owned.pop(self.pid, None)
                  return owned

              def send(self, pid, start, sig):
                  if pid == self.pid:
                      raise ProbeFailure("Refusing to signal the process owner")
                  try:
                      descriptor = os.pidfd_open(pid)
                  except ProcessLookupError:
                      return
                  try:
                      try:
                          current = self.identity(pid)
                      except FileNotFoundError:
                          return
                      if current["start"] != start:
                          return
                      # The descriptor still refers to this identity if its PID later exits.
                      try:
                          signal.pidfd_send_signal(descriptor, sig)
                      except ProcessLookupError:
                          pass
                  finally:
                      os.close(descriptor)

              def reap_adopted(self, direct_child):
                  for pid, row in process_table().items():
                      if pid == direct_child or row["ppid"] != self.pid:
                          continue
                      try:
                          reaped, status = os.waitpid(pid, os.WNOHANG)
                      except ChildProcessError:
                          continue
                      if reaped:
                          self.reaped.append({"pid": reaped, "wait_status": status})

              def drain_after_root_wait(self):
                  while True:
                      try:
                          pid, status = os.waitpid(-1, os.WNOHANG)
                      except ChildProcessError:
                          return True
                      if not pid:
                          return False
                      self.reaped.append({"pid": pid, "wait_status": status})

              @staticmethod
              def has_children():
                  try:
                      os.waitid(os.P_ALL, 0, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                  except ChildProcessError:
