                          # Keep ownership enabled while this failing supervisor lives.
                          raise ProbeFailure("Owned children remain; bounded cleanup exhausted")
                      if self.libc.prctl(36, self.previous, 0, 0, 0) != 0:
                          raise ProbeFailure("Cannot restore process-local subreaper attribute")
                      raise ProbeFailure("Residual owned children required fallback cleanup")
                  if self.libc.prctl(36, self.previous, 0, 0, 0) != 0:
                      raise ProbeFailure("Cannot restore process-local subreaper attribute")


          def atomic(path, value):
              path = pathlib.Path(path)
              temp = path.with_suffix(path.suffix + ".tmp")
              temp.write_text(json.dumps(value, indent=2) + "\n")
              temp.replace(path)


          def process_table():
              table = {}
              for entry in pathlib.Path("/proc").iterdir():
                  if not entry.name.isdigit():
                      continue
                  try:
                      data = (entry / "stat").read_text()
                      tail = data[data.rfind(")") + 2 :].split()
                      table[int(entry.name)] = {
                          "ppid": int(tail[1]),
                          "start": int(tail[19]),
                          "rss": int(tail[21]) * os.sysconf("SC_PAGE_SIZE"),
                          "state": tail[0],
                      }
                  except (OSError, ValueError, IndexError):
                      pass
              return table


          def descendants(root, known, table):
              owned = {
                  pid
                  for pid, start in known.items()
                  if pid in table and table[pid]["start"] == start
              }
              # Only a previously captured PID/start identity can seed ownership.
              # An unknown root may already have exited and its PID may have been reused.
              while True:
                  more = {pid for pid, v in table.items() if v["ppid"] in owned}
                  if more <= owned:
                      break
                  owned |= more
              return {pid: table[pid]["start"] for pid in owned}


          PROC_LIMIT = 256 * 1024


          VALUE_LIMIT = 4096


          EVENT_LIMIT = 8192


          MAX_MOUNTS = 1024


          MAX_CGROUP_MOUNTS = 64


          MAX_SCOPES = 256


          MIN_RESERVE = 3 * GIB


          class TelemetryUnavailable(RuntimeError):
              pass


          class LocalFS:
              """Only bounded reads. Actual mount identity is verified via an open FD."""

              def _fd_identity(self, fd, path, mount):
                  info = os.fstat(fd)
                  device = f"{os.major(info.st_dev)}:{os.minor(info.st_dev)}"
                  fdinfo = self.read_text(f"/proc/self/fdinfo/{fd}", VALUE_LIMIT)
                  mount_ids = [
                      line.split()[1]
                      for line in fdinfo.splitlines()
                      if line.startswith("mnt_id:")
                  ]
                  if device != mount["device"] or mount_ids != [str(mount["id"])]:
                      raise TelemetryUnavailable("Cgroup mount identity mismatch: " + path)
                  return device, info.st_ino

              def read_text(self, path, limit, *, mount=None):
                  fd = os.open(path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW | os.O_NONBLOCK)
                  try:
                      if not stat.S_ISREG(os.fstat(fd).st_mode):
                          raise TelemetryUnavailable(
                              "Telemetry is not a regular interface: " + path
                          )
                      if mount is not None:
                          self._fd_identity(fd, path, mount)
                      raw = bytearray()
                      while len(raw) <= limit:
                          chunk = os.read(fd, min(8192, limit + 1 - len(raw)))
                          if not chunk:
                              break
                          raw.extend(chunk)
                      if len(raw) > limit:
                          raise TelemetryUnavailable("Telemetry read exceeds byte cap: " + path)
                      return raw.decode("utf-8")
                  finally:
                      os.close(fd)

              def scope_identity(self, path, mount):
                  fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC | os.O_NOFOLLOW)
                  try:
                      return self._fd_identity(fd, path, mount)
                  finally:
                      os.close(fd)


          def _uint(text):
              value = text.strip()
              if not re.fullmatch(r"[0-9]{1,20}", value) or int(value) > 2**64 - 1:
                  raise TelemetryUnavailable("Invalid unsigned telemetry value")
              return int(value)


          def _path(text):
              if len(text) > 4096 or not text.startswith("/") or "\x00" in text:
                  raise TelemetryUnavailable("Invalid or overlong hierarchy path")
              path = PurePosixPath(text)
              if ".." in path.parts or len(path.parts) > 128 or str(path) != text:
                  raise TelemetryUnavailable("Unsupported hierarchy path: " + text)
              return path


          def _unescape_mount(text):
              # mountinfo escapes are decoded once, so a literal backslash is preserved.
              escapes = {"040": " ", "011": "\t", "012": "\n", "134": "\\"}
              return re.sub(r"\\(.){0,3}", lambda match: escapes[match.group()[1:]], text)


          def _membership(text):
              rows = [line[3:] for line in text.splitlines() if line.startswith("0::")]
              if len(rows) != 1 or rows[0].endswith(" (deleted)"):
                  raise TelemetryUnavailable("Exactly one live cgroup v2 membership is required")
              return _path(rows[0])


          def _mounts(text):
              lines = text.splitlines()
              if len(lines) > MAX_MOUNTS:
                  raise TelemetryUnavailable("Mount record budget exceeded")
              cgroups = []
              seen_ids = set()
              for line in lines:
                  left, separator, right = line.partition(" - ")
                  before, after = left.split(), right.split()
                  if not separator or len(before) < 6 or len(after) < 3:
                      raise TelemetryUnavailable("Malformed mountinfo record")
                  mount_id = _uint(before[0])
                  if mount_id in seen_ids:
                      raise TelemetryUnavailable("Duplicate mount identity")
                  seen_ids.add(mount_id)
                  if after[0] != "cgroup2":
                      continue
                  if not re.fullmatch(r"[0-9]+:[0-9]+", before[2]):
                      raise TelemetryUnavailable("Malformed cgroup device identity")
                  cgroups.append(
                      {
                          "id": mount_id,
                          "device": before[2],
                          "root": str(_path(_unescape_mount(before[3]))),
                          "point": str(_path(_unescape_mount(before[4]))),
                      }
                  )
              if not cgroups or len(cgroups) > MAX_CGROUP_MOUNTS:
                  raise TelemetryUnavailable("No cgroup2 mount or mount budget exceeded")
              return cgroups


          def _optional_read(fs, path, limit, mount):
              try:
                  return fs.read_text(path, limit, mount=mount).strip()
              except FileNotFoundError:
                  return None


          def _scope(fs, path, logical, mount):
              identity = fs.scope_identity(str(path), mount)
              maximum = _optional_read(fs, str(path / "memory.max"), VALUE_LIMIT, mount)
              current = _optional_read(fs, str(path / "memory.current"), VALUE_LIMIT, mount)
              row = {
                  "path": str(path),
                  "cgroup_path": str(logical),
                  "mount_id": mount["id"],
                  "identity": list(identity),
              }
              if maximum is None and current is None:
