name: Focused live evidence

# AUD-178, AUD-432, AUD-454 and AUD-501 need a result named per spec, and the full
# live suite prints only totals. This runs each spec alone on one owned full stand.
# It is finding evidence, not a required check. Spec selection is diagnostic-only
# in the stand runner, so this does not replace the full suite.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/focused-live-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focused-live-evidence-${{ github.event.pull_request.number || github.ref }}
  # Let an active owned run finish its cleanup before a newer run starts.
  cancel-in-progress: false

jobs:
  focused-live-evidence:
    name: Focused live spec evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install locked Python runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install locked Chromium and browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Select an owned state directory
        run: |
          set -euo pipefail
          state_root="$(python -c 'import tempfile; print(tempfile.gettempdir())')"
          printf 'LIVE_STATE_DIR=%s/ue-live-acceptance/run-%s-%s-focused\n' \
            "$state_root" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Start the owned full live stand
        id: start-stand
        env:
          STAND_REF: ${{ github.sha }}
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand up
          --in-place --state-dir "$LIVE_STATE_DIR" --ref "$STAND_REF" --stack full

      - name: Run each spec alone and require every case to pass
        timeout-minutes: 75
        run: |
          # Actions starts bash with -e; one failing spec must not hide the others.
          set +e -uo pipefail
          status=0
          for spec in \
            tests/e2e-live/aud178-reset-referer-csp.live.spec.ts \
            tests/e2e-live/auth-login-lockout.live.spec.ts \
            tests/e2e-live/register-double-submit.live.spec.ts \
            tests/e2e-live/messenger-membership-revocation.live.spec.ts \
            tests/e2e-live/story-viewer-keyboard.live.spec.ts
          do
            raw="$RUNNER_TEMP/focused-live-raw.txt"
            uv run --frozen --no-sync python -m scripts.live_stand e2e \
              --in-place --state-dir "$LIVE_STATE_DIR" --mode full --spec "$spec" \
              | tee "$raw"
            result=$?
            # A skipped, flaky or failed case adds a count, so the exact form rejects it.
            if [[ "$result" -eq 0 ]] \
              && grep -Eq '^live E2E counts passed=[1-9][0-9]*$' "$raw" \
              && grep -Fxq 'live E2E outcome=passed exit_code=0' "$raw"; then
              echo "focused live result spec=$spec outcome=passed"
            else
              echo "focused live result spec=$spec outcome=failed"
              status=1
            fi
          done
          exit "$status"

      - name: Stop owned containers
        if: ${{ always() && steps.start-stand.outcome != 'skipped' }}
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand stop
          --in-place --state-dir "$LIVE_STATE_DIR"
