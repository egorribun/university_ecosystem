name: Gitleaks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify security policy inputs against protected base
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pull-request base SHA is not an immutable 40-hex commit" >&2
            exit 1
          fi
          if [[ "$BASE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::security policy check refuses a cross-repository pull request" >&2
            exit 1
          fi
          git fetch --no-tags origin "$BASE_SHA"
          policy_paths=(
            ".github/workflows"
            ".gitleaks.toml"
            ".gitleaksignore"
            "scripts/quality/gitleaks_ci.py"
            "native/rust_ext/deny.toml"
            "quality/ci-check-catalog.json"
            "quality/security-false-positive-dispositions.json"
            "security/audit-allowlist.yaml"
          )
          changed=()
          for path in "${policy_paths[@]}"; do
            if ! git diff --quiet "$BASE_SHA" -- "$path"; then
              changed+=("$path")
            fi
          done
          if (( ${#changed[@]} > 0 )); then
            if [[ "$PR_AUTHOR" != "egorribun" ]]; then
              printf '::error::security policy changes require an owner-authored PR: %s\n' "${changed[*]}" >&2
              exit 1
            fi
            printf '::notice::owner-authored policy update accepted for review: %s\n' "${changed[*]}"
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: false

      - name: Install Gitleaks
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
          GOSUMDB: sum.golang.org
          GOPROXY: https://proxy.golang.org
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go version -m "$GOBIN/gitleaks" | awk '$1 == "mod" && $2 == "github.com/zricethezav/gitleaks/v8" && $3 == "v8.30.1" { found = 1 } END { exit !found }'

      - name: Run complete Gitleaks history
        shell: bash
        env:
          GITLEAKS_EVENT_NAME: ${{ github.event_name }}
          GITLEAKS_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GITLEAKS_EVENT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          GITLEAKS_REPORT_PATH: ${{ runner.temp }}/gitleaks-results/results.sarif
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-bin/gitleaks
        run: python scripts/quality/gitleaks_ci.py

      - name: Upload redacted Gitleaks SARIF
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-results.sarif
          path: ${{ runner.temp }}/gitleaks-results/results.sarif
          if-no-files-found: warn
