name: Gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        run: |
          docker run --rm -v ${{ github.workspace }}:/tmp ghcr.io/trufflesecurity/trufflehog:latest git file:///tmp --exclude-paths=/tmp/.trufflehog-exclude.txt --results=verified --fail --exclude-detectors=Codeclimate ${{ github.event_name == 'pull_request' && format('--since-commit={0}', github.event.pull_request.base.sha) || '' }}
