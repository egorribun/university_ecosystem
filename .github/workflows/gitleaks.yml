name: Gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        run: |
          docker run --rm -v ${{ github.workspace }}:/tmp ghcr.io/trufflesecurity/trufflehog:latest git file:///tmp --config /tmp/.trufflehog.yaml --only-verified --exclude-detectors=Codeclimate --base=${{ github.event.pull_request.base.sha }} --head=${{ github.event.pull_request.head.sha }}
