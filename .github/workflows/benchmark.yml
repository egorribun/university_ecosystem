name: "Continuous Performance Benchmarking"

on:
  push:
    branches:
      - main
  pull_request: {}

# Required pull-request contexts must be read-only. Historical charts are
# published only by the guarded main-only job below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Run Go Benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Capture advisory Go benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance/advisory/go
          (
            cd services/gateway
            go test -bench=. -run=^$ ./...
          ) 2>&1 | tee artifacts/performance/advisory/go/gateway-bench.txt
          (
            cd services/ws-hub
            go test -bench=. -run=^$ ./...
          ) 2>&1 | tee artifacts/performance/advisory/go/wshub-bench.txt
          cat \
            artifacts/performance/advisory/go/gateway-bench.txt \
            artifacts/performance/advisory/go/wshub-bench.txt \
            > artifacts/performance/advisory/go/benchmarks.txt

      - name: Enforce gateway HashRing lookup budget
        shell: bash
        run: |
          set -euo pipefail
          (
            cd services/gateway
            go test -run=^$ -bench=^BenchmarkHashRingLookup$ -benchtime=1s -count=5 .
          ) 2>&1 | tee artifacts/performance/advisory/go/gateway-hashring-budget.txt
          python3 scripts/quality/check_go_benchmark_budget.py \
            artifacts/performance/advisory/go/gateway-hashring-budget.txt \
            --benchmark BenchmarkHashRingLookup \
            --metric ns/op \
            --exclusive-maximum 4000 \
            --expected-samples 5

      - name: Upload advisory Go benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-advisory-go
          path: artifacts/performance/advisory/go
          if-no-files-found: warn
          retention-days: 14

  ws-hub-regression:
    name: WS-Hub Go Benchmark Regression Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Resolve immutable revisions and capture paired evidence
        id: capture_ws_hub
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_CANDIDATE_SHA: ${{ github.sha }}
          PR_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_CANDIDATE_SHA: ${{ github.sha }}
          PUSH_SOURCE_HEAD_SHA: ${{ github.sha }}
          PUSH_BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="$PR_BASE_SHA"
              CANDIDATE_SHA="$PR_CANDIDATE_SHA"
              SOURCE_HEAD_SHA="$PR_SOURCE_HEAD_SHA"
              BASE_REF="$PR_BASE_REF"
              ;;
            push)
              BASE_SHA="$PUSH_BASE_SHA"
              CANDIDATE_SHA="$PUSH_CANDIDATE_SHA"
              SOURCE_HEAD_SHA="$PUSH_SOURCE_HEAD_SHA"
              BASE_REF="$PUSH_BASE_REF"
              ;;
            *)
              echo "Unsupported performance event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

          ZERO_SHA="0000000000000000000000000000000000000000"
          validate_sha() {
            local value="$1"
            local label="$2"
            if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$label must be a full 40-hex commit SHA" >&2
              exit 2
            fi
          }
          validate_sha "$BASE_SHA" "base SHA"
          validate_sha "$CANDIDATE_SHA" "candidate SHA"
          validate_sha "$SOURCE_HEAD_SHA" "source head SHA"
          if [[ -z "$BASE_REF" ]]; then
            echo "Base ref must be non-empty" >&2
            exit 2
          fi
          if [[ "$BASE_SHA" == "$ZERO_SHA" || "$CANDIDATE_SHA" == "$ZERO_SHA" ]]; then
            echo "Initial-push all-zero SHAs cannot be benchmarked" >&2
            exit 2
          fi
          if [[ "$SOURCE_HEAD_SHA" == "$ZERO_SHA" ]]; then
            echo "All-zero source head SHA cannot be benchmarked" >&2
            exit 2
          fi
          echo "source_head_sha=$SOURCE_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          ARTIFACT_ROOT="${RUNNER_TEMP}/quality-performance-ws-hub-${BASE_SHA}-${CANDIDATE_SHA}"
          if [[ -e "$ARTIFACT_ROOT" ]]; then
            echo "Performance artifact root must be fresh: $ARTIFACT_ROOT" >&2
            exit 2
          fi
          echo "artifact_root=$ARTIFACT_ROOT" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$BASE_SHA" "$CANDIDATE_SHA"
          if ! git cat-file -e "$SOURCE_HEAD_SHA^{commit}"; then
            git fetch --no-tags origin "$SOURCE_HEAD_SHA"
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          if [[ "$BASE_SHA" == "$CANDIDATE_SHA" ]]; then
            echo "Base and candidate revisions must differ" >&2
            exit 2
          fi
          if ! git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"; then
            echo "Base revision must be an ancestor of the candidate revision" >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "Checkout is not the immutable candidate SHA" >&2
            exit 2
          fi
          PARENT_LINE="$(git rev-list --parents -n1 "$CANDIDATE_SHA")"
          read -r COMMIT_ID PARENT_ONE PARENT_TWO EXTRA_PARENTS <<< "$PARENT_LINE"
          if [[ "$COMMIT_ID" != "$CANDIDATE_SHA" ]]; then
            echo "Candidate parent record does not identify the candidate" >&2
            exit 2
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PARENT_ONE" != "$BASE_SHA" ]]; then
              echo "PR merge parent does not match the immutable base SHA" >&2
              exit 2
            fi
            if [[ "$PARENT_TWO" != "$SOURCE_HEAD_SHA" ]]; then
              echo "PR merge parent does not match the source head SHA" >&2
              exit 2
            fi
            if [[ -n "$EXTRA_PARENTS" ]]; then
              echo "PR candidate must have exactly two parents" >&2
              exit 2
            fi
          else
            if [[ "$SOURCE_HEAD_SHA" != "$CANDIDATE_SHA" ]]; then
              echo "Non-PR source head must equal the tested candidate SHA" >&2
              exit 2
            fi
          fi

          BASE_WORKTREE="${RUNNER_TEMP}/performance-base-ws-hub"
          if [[ -e "$BASE_WORKTREE" ]]; then
            echo "Base worktree path must be fresh: $BASE_WORKTREE" >&2
            exit 2
          fi
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          BASE_CAPTURE_HELPER="$BASE_WORKTREE/scripts/quality/capture_isolated_benchmarks.py"
          BASE_COMPARATOR="$BASE_WORKTREE/scripts/quality/compare_paired_benchmarks.py"
          if ! test -f "$BASE_CAPTURE_HELPER"; then
            echo "Trusted base capture helper is absent: $BASE_CAPTURE_HELPER" >&2
            exit 2
          fi
          if ! test -f "$BASE_COMPARATOR"; then
            echo "Trusted base comparator is absent: $BASE_COMPARATOR" >&2
            exit 2
          fi

          PYTHON_BIN="$(command -v python)"
          if [[ "$PYTHON_BIN" != /* || ! -x "$PYTHON_BIN" ]]; then
            echo "Python interpreter must resolve to an absolute executable" >&2
            exit 2
          fi
          BASE_COMPARATOR_SHA256="$(sha256sum "$BASE_COMPARATOR" | awk '{print $1}')"
          if [[ ! "$BASE_COMPARATOR_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Trusted base comparator hash is invalid" >&2
            exit 2
          fi

          {
            echo "base_sha=$BASE_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "base_worktree=$BASE_WORKTREE"
            echo "base_comparator=$BASE_COMPARATOR"
            echo "base_comparator_sha256=$BASE_COMPARATOR_SHA256"
            echo "python_bin=$PYTHON_BIN"
          } >> "$GITHUB_OUTPUT"

          "$PYTHON_BIN" -I "$BASE_CAPTURE_HELPER" \
            --format go \
            --base-worktree "$BASE_WORKTREE" \
            --candidate-worktree "$GITHUB_WORKSPACE" \
            --artifact-root "$ARTIFACT_ROOT" \
            --runner-temp "$RUNNER_TEMP" \
            --base-revision "$BASE_SHA" \
            --candidate-revision "$CANDIDATE_SHA"

      - name: Record immutable benchmark provenance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.capture_ws_hub.outputs.base_sha }}
          TESTED_COMMIT_SHA: ${{ steps.capture_ws_hub.outputs.candidate_sha }}
          SOURCE_HEAD_SHA: ${{ steps.capture_ws_hub.outputs.source_head_sha }}
          BASE_REF: ${{ steps.capture_ws_hub.outputs.base_ref }}
          ARTIFACT_ROOT: ${{ steps.capture_ws_hub.outputs.artifact_root }}
        run: |
          set -euo pipefail
          validate_sha() {
            local value="$1"
            local label="$2"
            if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$label must be a full 40-hex commit SHA" >&2
              exit 2
            fi
          }
          validate_sha "$BASE_SHA" "base SHA"
          validate_sha "$TESTED_COMMIT_SHA" "tested commit SHA"
          validate_sha "$SOURCE_HEAD_SHA" "source head SHA"
          if [[ -z "$BASE_REF" ]]; then
            echo "Benchmark provenance base ref is missing" >&2
            exit 2
          fi
          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Benchmark provenance run id is invalid" >&2
            exit 2
          fi
          if [[ ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "Benchmark provenance identity is incomplete" >&2
            exit 2
          fi
          if [[ ! -d "$ARTIFACT_ROOT" ]]; then
            echo "Benchmark provenance artifact root is missing" >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$TESTED_COMMIT_SHA" ]]; then
            echo "Benchmark provenance target is not the captured immutable artifact" >&2
            exit 2
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required to record benchmark provenance" >&2
            exit 2
          fi
          PARENT_LINE="$(git rev-list --parents -n1 "$TESTED_COMMIT_SHA")"
          COMMIT_ID="${PARENT_LINE%% *}"
          if [[ "$COMMIT_ID" != "$TESTED_COMMIT_SHA" ]]; then
            echo "Tested commit parent record is invalid" >&2
            exit 2
          fi
          PARENTS_JSON="$(printf '%s\n' "$PARENT_LINE" | jq -R 'split(" ")[1:]')"
          PROVENANCE_TMP="$ARTIFACT_ROOT/provenance.json.tmp"
          jq -n \
            --arg schema_version "1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg event "$EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg ref "$GITHUB_REF" \
            --arg base_ref "$BASE_REF" \
            --arg base_sha "$BASE_SHA" \
            --arg source_head_sha "$SOURCE_HEAD_SHA" \
            --arg tested_commit_sha "$TESTED_COMMIT_SHA" \
            --argjson tested_commit_parents "$PARENTS_JSON" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version: ($schema_version|tonumber), repository: $repository, workflow: $workflow, workflow_ref: $workflow_ref, event: $event, run_id: ($run_id|tonumber), run_attempt: ($run_attempt|tonumber), ref: $ref, base_ref: $base_ref, base_sha: $base_sha, source_head_sha: $source_head_sha, tested_commit_sha: $tested_commit_sha, tested_commit_parents: $tested_commit_parents, timestamp: $timestamp}' \
            > "$PROVENANCE_TMP"
          mv -- "$PROVENANCE_TMP" "$ARTIFACT_ROOT/provenance.json"

      - name: Compare paired benchmark evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_SOURCE_HEAD_SHA: ${{ github.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_BASE_REF: ${{ github.ref_name }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_TESTED_COMMIT_SHA: ${{ github.sha }}
          ARTIFACT_ROOT: ${{ steps.capture_ws_hub.outputs.artifact_root }}
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="${{ steps.capture_ws_hub.outputs.artifact_root }}"
          case "$EVENT_NAME" in
            pull_request)
              EXPECTED_SOURCE_HEAD_SHA="$PR_SOURCE_HEAD_SHA"
              EXPECTED_BASE_SHA="$PR_BASE_SHA"
              EXPECTED_BASE_REF="$PR_BASE_REF"
              ;;
            push)
              EXPECTED_SOURCE_HEAD_SHA="$PUSH_SOURCE_HEAD_SHA"
              EXPECTED_BASE_SHA="$PUSH_BASE_SHA"
              EXPECTED_BASE_REF="$PUSH_BASE_REF"
              ;;
            *)
              echo "Unsupported performance event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac
          if [[ ! -f "$ARTIFACT_ROOT/provenance.json" ]]; then
            echo "Benchmark provenance is missing" >&2
            exit 2
          fi
          if [[ ! "$EXPECTED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Expected workflow run id is invalid" >&2
            exit 2
          fi
          if [[ ! "$EXPECTED_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "Expected workflow run identity is invalid" >&2
            exit 2
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required to verify benchmark provenance" >&2
            exit 2
          fi
          PARENT_LINE="$(git rev-list --parents -n1 "$EXPECTED_TESTED_COMMIT_SHA")"
          COMMIT_ID="${PARENT_LINE%% *}"
          if [[ "$COMMIT_ID" != "$EXPECTED_TESTED_COMMIT_SHA" ]]; then
            echo "Expected tested commit parent record is invalid" >&2
            exit 2
          fi
          ACTUAL_PARENTS_JSON="$(printf '%s\n' "$PARENT_LINE" | jq -R 'split(" ")[1:]')"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            EXPECTED_PARENTS_JSON="$(jq -n --arg base "$EXPECTED_BASE_SHA" --arg source "$EXPECTED_SOURCE_HEAD_SHA" '[$base, $source]')"
          else
            EXPECTED_PARENTS_JSON="$ACTUAL_PARENTS_JSON"
          fi
          jq -e \
            --arg event "$EVENT_NAME" \
            --arg run_id "$EXPECTED_RUN_ID" \
            --arg run_attempt "$EXPECTED_RUN_ATTEMPT" \
            --arg ref "$GITHUB_REF" \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg source_head_sha "$EXPECTED_SOURCE_HEAD_SHA" \
            --arg tested_commit_sha "$EXPECTED_TESTED_COMMIT_SHA" \
            --argjson expected_parents "$EXPECTED_PARENTS_JSON" \
            '(.schema_version == 1 and .event == $event and (.run_id|tostring) == $run_id and (.run_attempt|tostring) == $run_attempt and .ref == $ref and .base_ref == $base_ref and .base_sha == $base_sha and .source_head_sha == $source_head_sha and .tested_commit_sha == $tested_commit_sha and .tested_commit_parents == $expected_parents and (if $event == "pull_request" then .tested_commit_parents == [$base_sha, $source_head_sha] else .source_head_sha == .tested_commit_sha end))' \
            "$ARTIFACT_ROOT/provenance.json" >/dev/null
          BASE_COMPARATOR="${{ steps.capture_ws_hub.outputs.base_comparator }}"
          PYTHON_BIN="${{ steps.capture_ws_hub.outputs.python_bin }}"
          EXPECTED_COMPARATOR_SHA256="${{ steps.capture_ws_hub.outputs.base_comparator_sha256 }}"
          if [[ "$PYTHON_BIN" != /* || ! -x "$PYTHON_BIN" ]]; then
            echo "Python interpreter must remain an absolute executable" >&2
            exit 2
          fi
          if ! test -f "$BASE_COMPARATOR"; then
            echo "Trusted base comparator is absent: $BASE_COMPARATOR" >&2
            exit 2
          fi
          ACTUAL_COMPARATOR_SHA256="$(sha256sum "$BASE_COMPARATOR" | awk '{print $1}')"
          if [[ "$ACTUAL_COMPARATOR_SHA256" != "$EXPECTED_COMPARATOR_SHA256" ]]; then
            echo "Trusted base comparator changed after capture" >&2
            exit 2
          fi
          "$PYTHON_BIN" -I "$BASE_COMPARATOR" \
            --format go \
            --base-dir "$ARTIFACT_ROOT/base" \
            --candidate-dir "$ARTIFACT_ROOT/candidate" \
            --expected-pairs 12 \
            --base-revision "${{ steps.capture_ws_hub.outputs.base_sha }}" \
            --candidate-revision "${{ steps.capture_ws_hub.outputs.candidate_sha }}" \
            --toolchain-json "$ARTIFACT_ROOT/toolchain.json" \
            --output "$ARTIFACT_ROOT/comparison.json"

      - name: Upload paired benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-ws-hub-paired
          path: ${{ steps.capture_ws_hub.outputs.artifact_root }}
          if-no-files-found: warn
          retention-days: 14

      - name: Remove immutable base worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BASE_WORKTREE="${RUNNER_TEMP}/performance-base-ws-hub"
          if [[ -d "$BASE_WORKTREE" ]]; then
            git worktree remove --force "$BASE_WORKTREE" || true
          fi

  rust-criterion:
    name: Rust Criterion Benchmarks (pyo3-sanitizer)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/pyo3-sanitizer/target
          key: rust-criterion-${{ runner.os }}-${{ hashFiles('crates/pyo3-sanitizer/Cargo.toml') }}
          restore-keys: rust-criterion-${{ runner.os }}-

      - name: Capture advisory Criterion benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance/advisory/rust-criterion
          (
            cd crates/pyo3-sanitizer
            cargo bench -p pyo3-sanitizer --bench sanitizer_bench --no-default-features \
              -- --output-format bencher
          ) 2>&1 | tee artifacts/performance/advisory/rust-criterion/criterion-bench.txt

      - name: Upload advisory Criterion benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-advisory-rust-criterion
          path: artifacts/performance/advisory/rust-criterion
          if-no-files-found: warn
          retention-days: 14

  rust-native-regression:
    name: Rust Native Optimizer Regression Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Resolve immutable revisions and capture paired evidence
        id: capture_rust_native
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_CANDIDATE_SHA: ${{ github.sha }}
          PR_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_CANDIDATE_SHA: ${{ github.sha }}
          PUSH_SOURCE_HEAD_SHA: ${{ github.sha }}
          PUSH_BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="$PR_BASE_SHA"
              CANDIDATE_SHA="$PR_CANDIDATE_SHA"
              SOURCE_HEAD_SHA="$PR_SOURCE_HEAD_SHA"
              BASE_REF="$PR_BASE_REF"
              ;;
            push)
              BASE_SHA="$PUSH_BASE_SHA"
              CANDIDATE_SHA="$PUSH_CANDIDATE_SHA"
              SOURCE_HEAD_SHA="$PUSH_SOURCE_HEAD_SHA"
              BASE_REF="$PUSH_BASE_REF"
              ;;
            *)
              echo "Unsupported performance event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

          ZERO_SHA="0000000000000000000000000000000000000000"
          validate_sha() {
            local value="$1"
            local label="$2"
            if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$label must be a full 40-hex commit SHA" >&2
              exit 2
            fi
          }
          validate_sha "$BASE_SHA" "base SHA"
          validate_sha "$CANDIDATE_SHA" "candidate SHA"
          validate_sha "$SOURCE_HEAD_SHA" "source head SHA"
          if [[ -z "$BASE_REF" ]]; then
            echo "Base ref must be non-empty" >&2
            exit 2
          fi
          if [[ "$BASE_SHA" == "$ZERO_SHA" || "$CANDIDATE_SHA" == "$ZERO_SHA" ]]; then
            echo "Initial-push all-zero SHAs cannot be benchmarked" >&2
            exit 2
          fi
          if [[ "$SOURCE_HEAD_SHA" == "$ZERO_SHA" ]]; then
            echo "All-zero source head SHA cannot be benchmarked" >&2
            exit 2
          fi
          echo "source_head_sha=$SOURCE_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          ARTIFACT_ROOT="${RUNNER_TEMP}/quality-performance-rust-native-${BASE_SHA}-${CANDIDATE_SHA}"
          if [[ -e "$ARTIFACT_ROOT" ]]; then
            echo "Performance artifact root must be fresh: $ARTIFACT_ROOT" >&2
            exit 2
          fi
          echo "artifact_root=$ARTIFACT_ROOT" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "$BASE_SHA" "$CANDIDATE_SHA"
          if ! git cat-file -e "$SOURCE_HEAD_SHA^{commit}"; then
            git fetch --no-tags origin "$SOURCE_HEAD_SHA"
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          if [[ "$BASE_SHA" == "$CANDIDATE_SHA" ]]; then
            echo "Base and candidate revisions must differ" >&2
            exit 2
          fi
          if ! git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"; then
            echo "Base revision must be an ancestor of the candidate revision" >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "Checkout is not the immutable candidate SHA" >&2
            exit 2
          fi
          PARENT_LINE="$(git rev-list --parents -n1 "$CANDIDATE_SHA")"
          read -r COMMIT_ID PARENT_ONE PARENT_TWO EXTRA_PARENTS <<< "$PARENT_LINE"
          if [[ "$COMMIT_ID" != "$CANDIDATE_SHA" ]]; then
            echo "Candidate parent record does not identify the candidate" >&2
            exit 2
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PARENT_ONE" != "$BASE_SHA" ]]; then
              echo "PR merge parent does not match the immutable base SHA" >&2
              exit 2
            fi
            if [[ "$PARENT_TWO" != "$SOURCE_HEAD_SHA" ]]; then
              echo "PR merge parent does not match the source head SHA" >&2
              exit 2
            fi
            if [[ -n "$EXTRA_PARENTS" ]]; then
              echo "PR candidate must have exactly two parents" >&2
              exit 2
            fi
          else
            if [[ "$SOURCE_HEAD_SHA" != "$CANDIDATE_SHA" ]]; then
              echo "Non-PR source head must equal the tested candidate SHA" >&2
              exit 2
            fi
          fi

          BASE_WORKTREE="${RUNNER_TEMP}/performance-base-rust-native"
          if [[ -e "$BASE_WORKTREE" ]]; then
            echo "Base worktree path must be fresh: $BASE_WORKTREE" >&2
            exit 2
          fi
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          BASE_CAPTURE_HELPER="$BASE_WORKTREE/scripts/quality/capture_isolated_benchmarks.py"
          BASE_COMPARATOR="$BASE_WORKTREE/scripts/quality/compare_paired_benchmarks.py"
          BASE_RUST_DOCKERFILE="$BASE_WORKTREE/containers/quality/Dockerfile.performance-rust"
          if ! test -f "$BASE_CAPTURE_HELPER"; then
            echo "Trusted base capture helper is absent: $BASE_CAPTURE_HELPER" >&2
            exit 2
          fi
          if ! test -f "$BASE_COMPARATOR"; then
            echo "Trusted base comparator is absent: $BASE_COMPARATOR" >&2
            exit 2
          fi
          if ! test -f "$BASE_RUST_DOCKERFILE"; then
            echo "Trusted base Rust Dockerfile is absent: $BASE_RUST_DOCKERFILE" >&2
            exit 2
          fi

          PYTHON_BIN="$(command -v python)"
          if [[ "$PYTHON_BIN" != /* || ! -x "$PYTHON_BIN" ]]; then
            echo "Python interpreter must resolve to an absolute executable" >&2
            exit 2
          fi
          BASE_COMPARATOR_SHA256="$(sha256sum "$BASE_COMPARATOR" | awk '{print $1}')"
          if [[ ! "$BASE_COMPARATOR_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Trusted base comparator hash is invalid" >&2
            exit 2
          fi

          {
            echo "base_sha=$BASE_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "base_worktree=$BASE_WORKTREE"
            echo "base_comparator=$BASE_COMPARATOR"
            echo "base_comparator_sha256=$BASE_COMPARATOR_SHA256"
            echo "python_bin=$PYTHON_BIN"
          } >> "$GITHUB_OUTPUT"

          "$PYTHON_BIN" -I "$BASE_CAPTURE_HELPER" \
            --format rust \
            --base-worktree "$BASE_WORKTREE" \
            --candidate-worktree "$GITHUB_WORKSPACE" \
            --artifact-root "$ARTIFACT_ROOT" \
            --runner-temp "$RUNNER_TEMP" \
            --base-revision "$BASE_SHA" \
            --candidate-revision "$CANDIDATE_SHA" \
            --rust-dockerfile "$BASE_RUST_DOCKERFILE"

      - name: Record immutable benchmark provenance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.capture_rust_native.outputs.base_sha }}
          TESTED_COMMIT_SHA: ${{ steps.capture_rust_native.outputs.candidate_sha }}
          SOURCE_HEAD_SHA: ${{ steps.capture_rust_native.outputs.source_head_sha }}
          BASE_REF: ${{ steps.capture_rust_native.outputs.base_ref }}
          ARTIFACT_ROOT: ${{ steps.capture_rust_native.outputs.artifact_root }}
        run: |
          set -euo pipefail
          validate_sha() {
            local value="$1"
            local label="$2"
            if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$label must be a full 40-hex commit SHA" >&2
              exit 2
            fi
          }
          validate_sha "$BASE_SHA" "base SHA"
          validate_sha "$TESTED_COMMIT_SHA" "tested commit SHA"
          validate_sha "$SOURCE_HEAD_SHA" "source head SHA"
          if [[ -z "$BASE_REF" ]]; then
            echo "Benchmark provenance base ref is missing" >&2
            exit 2
          fi
          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Benchmark provenance run id is invalid" >&2
            exit 2
          fi
          if [[ ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "Benchmark provenance identity is incomplete" >&2
            exit 2
          fi
          if [[ ! -d "$ARTIFACT_ROOT" ]]; then
            echo "Benchmark provenance artifact root is missing" >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$TESTED_COMMIT_SHA" ]]; then
            echo "Benchmark provenance target is not the captured immutable artifact" >&2
            exit 2
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required to record benchmark provenance" >&2
            exit 2
          fi
          PARENT_LINE="$(git rev-list --parents -n1 "$TESTED_COMMIT_SHA")"
          COMMIT_ID="${PARENT_LINE%% *}"
          if [[ "$COMMIT_ID" != "$TESTED_COMMIT_SHA" ]]; then
            echo "Tested commit parent record is invalid" >&2
            exit 2
          fi
          PARENTS_JSON="$(printf '%s\n' "$PARENT_LINE" | jq -R 'split(" ")[1:]')"
          PROVENANCE_TMP="$ARTIFACT_ROOT/provenance.json.tmp"
          jq -n \
            --arg schema_version "1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg event "$EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg ref "$GITHUB_REF" \
            --arg base_ref "$BASE_REF" \
            --arg base_sha "$BASE_SHA" \
            --arg source_head_sha "$SOURCE_HEAD_SHA" \
            --arg tested_commit_sha "$TESTED_COMMIT_SHA" \
            --argjson tested_commit_parents "$PARENTS_JSON" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version: ($schema_version|tonumber), repository: $repository, workflow: $workflow, workflow_ref: $workflow_ref, event: $event, run_id: ($run_id|tonumber), run_attempt: ($run_attempt|tonumber), ref: $ref, base_ref: $base_ref, base_sha: $base_sha, source_head_sha: $source_head_sha, tested_commit_sha: $tested_commit_sha, tested_commit_parents: $tested_commit_parents, timestamp: $timestamp}' \
            > "$PROVENANCE_TMP"
          mv -- "$PROVENANCE_TMP" "$ARTIFACT_ROOT/provenance.json"

      - name: Compare paired benchmark evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_SOURCE_HEAD_SHA: ${{ github.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_BASE_REF: ${{ github.ref_name }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_TESTED_COMMIT_SHA: ${{ github.sha }}
          ARTIFACT_ROOT: ${{ steps.capture_rust_native.outputs.artifact_root }}
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="${{ steps.capture_rust_native.outputs.artifact_root }}"
          case "$EVENT_NAME" in
            pull_request)
              EXPECTED_SOURCE_HEAD_SHA="$PR_SOURCE_HEAD_SHA"
              EXPECTED_BASE_SHA="$PR_BASE_SHA"
              EXPECTED_BASE_REF="$PR_BASE_REF"
              ;;
            push)
              EXPECTED_SOURCE_HEAD_SHA="$PUSH_SOURCE_HEAD_SHA"
              EXPECTED_BASE_SHA="$PUSH_BASE_SHA"
              EXPECTED_BASE_REF="$PUSH_BASE_REF"
              ;;
            *)
              echo "Unsupported performance event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac
          if [[ ! -f "$ARTIFACT_ROOT/provenance.json" ]]; then
            echo "Benchmark provenance is missing" >&2
            exit 2
          fi
          if [[ ! "$EXPECTED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Expected workflow run id is invalid" >&2
            exit 2
          fi
          if [[ ! "$EXPECTED_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "Expected workflow run identity is invalid" >&2
            exit 2
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq is required to verify benchmark provenance" >&2
            exit 2
          fi
          PARENT_LINE="$(git rev-list --parents -n1 "$EXPECTED_TESTED_COMMIT_SHA")"
          COMMIT_ID="${PARENT_LINE%% *}"
          if [[ "$COMMIT_ID" != "$EXPECTED_TESTED_COMMIT_SHA" ]]; then
            echo "Expected tested commit parent record is invalid" >&2
            exit 2
          fi
          ACTUAL_PARENTS_JSON="$(printf '%s\n' "$PARENT_LINE" | jq -R 'split(" ")[1:]')"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            EXPECTED_PARENTS_JSON="$(jq -n --arg base "$EXPECTED_BASE_SHA" --arg source "$EXPECTED_SOURCE_HEAD_SHA" '[$base, $source]')"
          else
            EXPECTED_PARENTS_JSON="$ACTUAL_PARENTS_JSON"
          fi
          jq -e \
            --arg event "$EVENT_NAME" \
            --arg run_id "$EXPECTED_RUN_ID" \
            --arg run_attempt "$EXPECTED_RUN_ATTEMPT" \
            --arg ref "$GITHUB_REF" \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg source_head_sha "$EXPECTED_SOURCE_HEAD_SHA" \
            --arg tested_commit_sha "$EXPECTED_TESTED_COMMIT_SHA" \
            --argjson expected_parents "$EXPECTED_PARENTS_JSON" \
            '(.schema_version == 1 and .event == $event and (.run_id|tostring) == $run_id and (.run_attempt|tostring) == $run_attempt and .ref == $ref and .base_ref == $base_ref and .base_sha == $base_sha and .source_head_sha == $source_head_sha and .tested_commit_sha == $tested_commit_sha and .tested_commit_parents == $expected_parents and (if $event == "pull_request" then .tested_commit_parents == [$base_sha, $source_head_sha] else .source_head_sha == .tested_commit_sha end))' \
            "$ARTIFACT_ROOT/provenance.json" >/dev/null
          BASE_COMPARATOR="${{ steps.capture_rust_native.outputs.base_comparator }}"
          PYTHON_BIN="${{ steps.capture_rust_native.outputs.python_bin }}"
          EXPECTED_COMPARATOR_SHA256="${{ steps.capture_rust_native.outputs.base_comparator_sha256 }}"
          ARTIFACT_ROOT="${{ steps.capture_rust_native.outputs.artifact_root }}"
          if [[ "$PYTHON_BIN" != /* || ! -x "$PYTHON_BIN" ]]; then
            echo "Python interpreter must remain an absolute executable" >&2
            exit 2
          fi
          if ! test -f "$BASE_COMPARATOR"; then
            echo "Trusted base comparator is absent: $BASE_COMPARATOR" >&2
            exit 2
          fi
          ACTUAL_COMPARATOR_SHA256="$(sha256sum "$BASE_COMPARATOR" | awk '{print $1}')"
          if [[ "$ACTUAL_COMPARATOR_SHA256" != "$EXPECTED_COMPARATOR_SHA256" ]]; then
            echo "Trusted base comparator changed after capture" >&2
            exit 2
          fi
          "$PYTHON_BIN" -I "$BASE_COMPARATOR" \
            --format bencher \
            --base-dir "$ARTIFACT_ROOT/base" \
            --candidate-dir "$ARTIFACT_ROOT/candidate" \
            --expected-pairs 12 \
            --base-revision "${{ steps.capture_rust_native.outputs.base_sha }}" \
            --candidate-revision "${{ steps.capture_rust_native.outputs.candidate_sha }}" \
            --toolchain-json "$ARTIFACT_ROOT/toolchain.json" \
            --output "$ARTIFACT_ROOT/comparison.json"

      - name: Upload paired benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-rust-native-paired
          path: ${{ steps.capture_rust_native.outputs.artifact_root }}
          if-no-files-found: warn
          retention-days: 14

      - name: Remove immutable base worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BASE_WORKTREE="${RUNNER_TEMP}/performance-base-rust-native"
          if [[ -d "$BASE_WORKTREE" ]]; then
            git worktree remove --force "$BASE_WORKTREE" || true
          fi

  publish-performance-history:
    needs:
      - benchmark
      - ws-hub-regression
      - rust-criterion
      - rust-native-regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download advisory Go benchmark evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-advisory-go
          path: history-artifacts/go

      - name: Download advisory Criterion benchmark evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-advisory-rust-criterion
          path: history-artifacts/rust-criterion

      - name: Publish advisory Go benchmark history
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "Go Services Performance Benchmarks"
          tool: "go"
          output-file-path: "history-artifacts/go/benchmarks.txt"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "200%"
          comment-on-alert: false
          fail-on-alert: false

      - name: Publish advisory Criterion benchmark history
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "Rust Criterion Benchmarks (pyo3-sanitizer)"
          tool: "cargo"
          output-file-path: "history-artifacts/rust-criterion/criterion-bench.txt"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          comment-on-alert: false
          fail-on-alert: false
