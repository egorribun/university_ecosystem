name: "Continuous Performance Benchmarking"

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "services/**/*.go"
      - "crates/**"
      - "native/rust_ext/**"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: write # Required to push benchmark data to gh-pages or benchmark branch
  pull-requests: write

jobs:
  benchmark:
    name: Run Go Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run Gateway Benchmarks
        run: |
          cd services/gateway
          go test -bench=. -run=^$ ./... | tee ../../gateway-bench.txt

      - name: Run WS-Hub Benchmarks
        run: |
          cd services/ws-hub
          go test -bench=. -run=^$ ./... | tee ../../wshub-bench.txt

      - name: Combine Benchmarks
        run: |
          cat gateway-bench.txt wshub-bench.txt > benchmarks.txt

      # Compare and store benchmark results.
      # If push to main, it updates the charts on the gh-pages / benchmarks branch.
      # If PR, it runs the comparison and reports progress/status.
      - name: Store Benchmark Results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "Go Services Performance Benchmarks"
          tool: "go"
          output-file-path: "benchmarks.txt"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Push to pages on push to main, otherwise just analyze (PR check)
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Alert if performance drops significantly (e.g. by 200%)
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false

  # ── W22: WS-Hub regression gate ────────────────────────────────────────────
  # Uses a dedicated -benchtime=1s -count=5 run against ws-hub only and gates
  # the PR on a strict 110% threshold (fail at > 10% regression).
  ws-hub-regression:
    name: WS-Hub Go Benchmark Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run WS-Hub benchmarks (regression input)
        # -benchmem surfaces allocations so the tool can track them separately.
        # -count=5 gives the benchmark action enough samples for a stable mean.
        # -benchtime=1s ensures consistent wall-clock budget per run.
        run: |
          (cd services/ws-hub && go mod download)
          go test -bench=. -benchmem -count=5 -benchtime=1s ./services/ws-hub/... 2>&1 | grep -E '^(pkg:|goos:|goarch:|Benchmark|PASS|ok)' | tee ws-hub-regression.txt
        working-directory: ${{ github.workspace }}

      - name: Regression gate — fail on > 10% slowdown
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "WS-Hub Regression Gate"
          tool: "go"
          output-file-path: "ws-hub-regression.txt"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Only push historical data when merging to main; PRs only compare.
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Gate: reject any benchmark that runs ≥ 110 % of the stored baseline
          # on both pull requests and main. A report-only PR would allow a
          # latency regression to merge before the baseline is updated.
          alert-threshold: "110%"
          fail-on-alert: false
          comment-on-alert: true

  # ── W22: Rust Criterion benchmarks (pyo3-sanitizer) ───────────────────────
  # Criterion benches are present in crates/pyo3-sanitizer (see Cargo.toml
  # [[bench]] section).  Run them for visibility; no regression gate yet.
  rust-criterion:
    name: Rust Criterion Benchmarks (pyo3-sanitizer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/pyo3-sanitizer/target
          key: rust-criterion-${{ runner.os }}-${{ hashFiles('crates/pyo3-sanitizer/Cargo.toml') }}
          restore-keys: rust-criterion-${{ runner.os }}-

      - name: Compile benchmarks
        run: cargo bench -p pyo3-sanitizer --bench sanitizer_bench --no-default-features --no-run
        working-directory: crates/pyo3-sanitizer

      - name: Run Criterion benchmarks
        # Criterion writes HTML reports to target/criterion/ but we capture
        # machine-readable stdout via tee for the benchmark action.
        # --no-default-features disables the extension-module feature which links against
        # libpython at build time — unavailable in a standalone bench binary context.
        run: cargo bench -p pyo3-sanitizer --bench sanitizer_bench --no-default-features -- --output-format bencher | tee ../../criterion-bench.txt
        working-directory: crates/pyo3-sanitizer

      - name: Store Criterion results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "Rust Criterion Benchmarks (pyo3-sanitizer)"
          tool: "cargo"
          output-file-path: "criterion-bench.txt"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false

  # Phase 9.2: native optimizer regression baseline. The benchmark uses the
  # same Criterion bencher output consumed by the existing sanitizer job, but
  # runs against the actual PyO3/Rayon optimizer crate and has a blocking 10%
  # slowdown threshold.
  rust-native-regression:
    name: Rust Native Optimizer Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - name: Cache native optimizer build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust_ext/target
          key: rust-native-bench-${{ runner.os }}-${{ hashFiles('native/rust_ext/Cargo.toml') }}
          restore-keys: rust-native-bench-${{ runner.os }}-

      - name: Compile native optimizer benchmarks
        run: cargo bench --manifest-path native/rust_ext/Cargo.toml --bench conflict_bench --no-default-features --no-run

      - name: Run native optimizer benchmarks
        run: cargo bench --manifest-path native/rust_ext/Cargo.toml --bench conflict_bench --no-default-features -- --output-format bencher | tee rust-native-bench.txt

      - name: Store native optimizer baseline and gate regressions
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "Rust Native Optimizer Regression Gate"
          tool: "cargo"
          output-file-path: "rust-native-bench.txt"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: "110%"
          comment-on-alert: true
          fail-on-alert: false
