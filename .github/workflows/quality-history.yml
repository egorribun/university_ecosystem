name: Quality History

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: quality-history
  cancel-in-progress: false

jobs:
  archive:
    name: Archive quality manifest and render dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv and quality validator dependencies
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync quality validator dependencies
        run: uv sync --frozen

      - name: Collect latest successful CI quality manifest
        id: collect-manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::No successful main CI run is available for the quality-history archive."
            exit 1
          fi
          run_metadata="$RUNNER_TEMP/quality-run.json"
          artifact_metadata="$RUNNER_TEMP/quality-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$run_metadata"
          head_sha="$(jq -r '.head_sha' "$run_metadata")"
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Latest successful CI run returned an invalid head SHA."
            exit 1
          fi
          test "$(jq -r '.conclusion' "$run_metadata")" = success
          test "$(jq -r '.event' "$run_metadata")" = push
          test "$(jq -r '.head_branch' "$run_metadata")" = main
          test "$(jq -r '.path' "$run_metadata")" = .github/workflows/ci.yml
          run_attempt="$(jq -r '.run_attempt' "$run_metadata")"
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            > "$artifact_metadata"
          artifact_name="quality-evidence-$head_sha"
          test "$(jq --arg name "$artifact_name" '[.[].artifacts[] | select(.name == $name and .expired == false)] | length' "$artifact_metadata")" -eq 1
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          evidence_root="$RUNNER_TEMP/quality-source"
          rm -rf -- "$evidence_root"
          git worktree add --detach "$evidence_root" "$head_sha"
          mkdir -p docs/testing/quality-history
          if ! gh run download "$run_id" --name "$artifact_name" --dir "$evidence_root"; then
            echo "::error::Successful CI run $run_id has no downloadable quality-manifest evidence bundle."
            exit 1
          fi
          manifest_path="$evidence_root/artifacts/coverage/quality-manifest.json"
          checksum_path="$evidence_root/artifacts/coverage/quality-manifest.json.sha256"
          if [[ ! -s "$manifest_path" || ! -s "$checksum_path" ]]; then
            echo "::error::quality-manifest.json is missing from CI run $run_id."
            exit 1
          fi
          (cd "$evidence_root" && sha256sum --check artifacts/coverage/quality-manifest.json.sha256)
          uv run python "$evidence_root/scripts/quality/validate_quality_contract.py" \
            --contract "$evidence_root/quality/quality-contract.json" \
            --schema "$evidence_root/quality/coverage-manifest.schema.json" \
            --artifact-root "$evidence_root" \
            --mutation-registry "$evidence_root/quality/mutation-exclusions.json" \
            --manifest "$manifest_path" \
            --expected-commit-sha "$head_sha" \
            --expected-workflow-run-id "$run_id" \
            --expected-workflow-run-attempt "$run_attempt" \
            --expected-workflow-event push \
            --expected-workflow-repository "$GITHUB_REPOSITORY" \
            --expected-workflow-ref "$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" \
            --expected-workflow-job coverage-policy-gate
          history_path="docs/testing/quality-history/${head_sha}.json"
          if [[ -e "$history_path" ]]; then
            if cmp --silent "$manifest_path" "$history_path"; then
              echo "Quality history for $head_sha is already archived."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Quality history collision for immutable commit $head_sha."
            exit 1
          fi
          cp "$manifest_path" "$history_path"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Render deterministic dashboard
        if: steps.collect-manifest.outputs.available == 'true'
        run: >-
          python scripts/quality/generate_dashboard.py
          --history-dir docs/testing/quality-history
          --limit 30

      - name: Commit quality history
        if: steps.collect-manifest.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/quality-history docs/testing/dashboard.md
          if git diff --cached --quiet; then
            echo "No new quality history to commit."
            exit 0
          fi
          head_sha="${{ steps.collect-manifest.outputs.head_sha }}"
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Quality history source SHA is missing or invalid."
            exit 1
          fi
          branch="automation/quality-history-${head_sha}"
          existing_pr="$(gh pr list --state all --head "$branch" --limit 1 --json number,state,url --jq '.[0] // empty')"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git show "origin/$branch:docs/testing/quality-history/${head_sha}.json" \
              | cmp --silent - "docs/testing/quality-history/${head_sha}.json"; then
              echo "::error::Remote quality-history branch collides with immutable commit $head_sha."
              exit 1
            fi
            if [[ -n "$existing_pr" ]]; then
              echo "Quality history PR already exists for $head_sha: $existing_pr"
              exit 0
            fi
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(quality): archive quality history" \
              --body "Automated archive of the latest successful CI quality manifest and dashboard."
            exit 0
          fi
          if [[ -n "$existing_pr" ]]; then
            echo "Quality history PR was already handled for $head_sha: $existing_pr"
            exit 0
          fi
          git switch -c "$branch"
          git commit -m "chore(quality): archive quality history for ${head_sha:0:12}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(quality): archive quality history" \
            --body "Automated archive of the latest successful CI quality manifest and dashboard."
