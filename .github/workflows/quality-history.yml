name: Quality History

on:
  schedule:
    - cron: "30 2 * * *"
  # Manual reruns must use repository_dispatch; unlike workflow_dispatch this
  # event always resolves the workflow from the repository default branch.
  repository_dispatch:
    types: [run-quality-history]

permissions:
  actions: read
  contents: read

concurrency:
  group: quality-history
  cancel-in-progress: false

jobs:
  archive:
    name: Archive quality manifest and render dashboard
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Verify trusted main source
        env:
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Quality history refuses to run outside protected main."
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main --depth=1
          trusted_sha="$(git rev-parse refs/remotes/origin/main)"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Protected main did not resolve to a full commit SHA."
            exit 1
          fi
          if [[ "$checked_out_sha" != "$trusted_sha" || "$EVENT_SHA" != "$trusted_sha" || "$WORKFLOW_SHA" != "$trusted_sha" ]]; then
            echo "::error::Workflow source is not the current immutable protected-main commit."
            exit 1
          fi

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv and quality validator dependencies
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync quality validator dependencies
        run: uv sync --frozen

      - name: Collect latest successful CI quality manifest
        id: collect-manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::No successful main CI run is available for the quality-history archive."
            exit 1
          fi
          run_metadata="$RUNNER_TEMP/quality-run.json"
          artifact_metadata="$RUNNER_TEMP/quality-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$run_metadata"
          head_sha="$(jq -r '.head_sha' "$run_metadata")"
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Latest successful CI run returned an invalid head SHA."
            exit 1
          fi
          test "$(jq -r '.conclusion' "$run_metadata")" = success
          test "$(jq -r '.event' "$run_metadata")" = push
          test "$(jq -r '.head_branch' "$run_metadata")" = main
          test "$(jq -r '.path' "$run_metadata")" = .github/workflows/ci.yml
          run_attempt="$(jq -r '.run_attempt' "$run_metadata")"
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            > "$artifact_metadata"
          artifact_name="quality-evidence-$head_sha-attempt-$run_attempt"
          test "$(jq --arg name "$artifact_name" '[.[].artifacts[] | select(.name == $name and .expired == false)] | length' "$artifact_metadata")" -eq 1
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          evidence_root="$RUNNER_TEMP/quality-source"
          rm -rf -- "$evidence_root"
          git worktree add --detach "$evidence_root" "$head_sha"
          if ! gh run download "$run_id" --name "$artifact_name" --dir "$evidence_root"; then
            echo "::error::Successful CI run $run_id has no downloadable quality-manifest evidence bundle."
            exit 1
          fi
          manifest_path="$evidence_root/artifacts/coverage/quality-manifest.json"
          checksum_path="$evidence_root/artifacts/coverage/quality-manifest.json.sha256"
          if [[ ! -s "$manifest_path" || ! -s "$checksum_path" ]]; then
            echo "::error::quality-manifest.json is missing from CI run $run_id."
            exit 1
          fi
          (cd "$evidence_root" && sha256sum --check artifacts/coverage/quality-manifest.json.sha256)
          uv run python "$evidence_root/scripts/quality/validate_quality_contract.py" \
            --contract "$evidence_root/quality/quality-contract.json" \
            --schema "$evidence_root/quality/coverage-manifest.schema.json" \
            --artifact-root "$evidence_root" \
            --mutation-registry "$evidence_root/quality/mutation-exclusions.json" \
            --manifest "$manifest_path" \
            --expected-commit-sha "$head_sha" \
            --expected-workflow-run-id "$run_id" \
            --expected-workflow-run-attempt "$run_attempt" \
            --expected-workflow-event push \
            --expected-workflow-repository "$GITHUB_REPOSITORY" \
            --expected-workflow-ref "$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" \
            --expected-workflow-job coverage-policy-gate
          # The publish staging directory is runner-local and discarded with the
          # job. Nothing is written to the repository.
          publish_root="$RUNNER_TEMP/quality-publish"
          rm -rf -- "$publish_root"
          mkdir -p "$publish_root/quality-history"
          cp "$manifest_path" "$publish_root/quality-history/${head_sha}.json"

      - name: Collect prior quality history artifact
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.collect-manifest.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Quality history source SHA is missing or invalid."
            exit 1
          fi
          publish_root="$RUNNER_TEMP/quality-publish"
          history_root="$publish_root/quality-history"
          prior_root="$RUNNER_TEMP/quality-prior"
          rm -rf -- "$prior_root"
          mkdir -p "$prior_root"
          gh run list --workflow quality-history.yml --branch main --status success \
            --limit 30 --json databaseId --jq '.[].databaseId' > "$prior_root/run-ids.txt"
          found=0
          while read -r prior_run; do
            if ! [[ "$prior_run" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Quality history run listing returned an invalid run id."
              exit 1
            fi
            artifacts_json="$prior_root/artifacts-$prior_run.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$prior_run/artifacts?per_page=100" \
              > "$artifacts_json"
            matches="$(jq -r '[.[].artifacts[] | select((.name | startswith("quality-history-")) and .expired == false) | .name] | join("\n")' "$artifacts_json")"
            if [[ -z "$matches" ]]; then
              continue
            fi
            if [[ "$(printf '%s\n' "$matches" | wc -l)" -ne 1 ]]; then
              echo "::error::Quality history run $prior_run has ambiguous history artifacts."
              exit 1
            fi
            gh run download "$prior_run" --name "$matches" --dir "$prior_root/run-$prior_run"
            found=1
            break
          done < "$prior_root/run-ids.txt"
          if [[ "$found" -eq 0 ]]; then
            echo "No prior quality history artifact is available; the dashboard covers the current manifest only."
            exit 0
          fi
          shopt -s nullglob
          for prior_manifest in "$prior_root"/run-*/quality-history/*.json; do
            prior_sha="$(basename "$prior_manifest" .json)"
            if ! [[ "$prior_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Prior quality history contains an invalid manifest name."
              exit 1
            fi
            if ! jq -e --arg sha "$prior_sha" '.commit_sha == $sha' "$prior_manifest" > /dev/null; then
              echo "::error::Prior quality history manifest does not match its commit SHA."
              exit 1
            fi
            target="$history_root/${prior_sha}.json"
            if [[ -e "$target" ]]; then
              if ! cmp --silent "$prior_manifest" "$target"; then
                echo "::error::Conflicting prior quality history for commit $prior_sha."
                exit 1
              fi
              continue
            fi
            cp "$prior_manifest" "$target"
          done
          echo "Prior quality history entries: $(find "$history_root" -maxdepth 1 -name '*.json' | wc -l)"

      - name: Render deterministic dashboard
        shell: bash
        run: |
          set -euo pipefail
          publish_root="$RUNNER_TEMP/quality-publish"
          python scripts/quality/generate_dashboard.py \
            --history-dir "$publish_root/quality-history" \
            --output "$publish_root/dashboard.md" \
            --limit 30
          test -s "$publish_root/dashboard.md"

      - name: Publish dashboard to job summary
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/quality-publish/dashboard.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality history artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-history-${{ steps.collect-manifest.outputs.head_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-publish
          if-no-files-found: error
          retention-days: 90
