name: Quality History

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: quality-history
  cancel-in-progress: false

jobs:
  archive:
    name: Archive quality manifest and render dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Collect latest successful CI quality manifest
        id: collect-manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId,headSha --jq '.[0] // empty')"
          if [[ -z "$latest" ]]; then
            echo "::error::No successful main CI run is available for the quality-history archive."
            exit 1
          fi
          run_id="$(jq -r '.databaseId' <<< "$latest")"
          head_sha="$(jq -r '.headSha' <<< "$latest")"
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Latest successful CI run returned an invalid head SHA."
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/quality-ci" docs/testing/quality-history
          if ! gh run download "$run_id" --name "quality-evidence-$head_sha" --dir "$RUNNER_TEMP/quality-ci"; then
            echo "::error::Successful CI run $run_id has no downloadable quality-manifest evidence bundle."
            exit 1
          fi
          manifest_path="$RUNNER_TEMP/quality-ci/artifacts/coverage/quality-manifest.json"
          checksum_path="$RUNNER_TEMP/quality-ci/artifacts/coverage/quality-manifest.json.sha256"
          if [[ ! -s "$manifest_path" || ! -s "$checksum_path" ]]; then
            echo "::error::quality-manifest.json is missing from CI run $run_id."
            exit 1
          fi
          (cd "$RUNNER_TEMP/quality-ci" && sha256sum --check artifacts/coverage/quality-manifest.json.sha256)
          if ! manifest_sha="$(jq -er '.commit_sha | select(type == "string")' "$manifest_path")"; then
            echo "::error::quality-manifest.json has no valid commit_sha."
            exit 1
          fi
          if [[ "$manifest_sha" != "$head_sha" ]]; then
            echo "::error::Quality manifest commit $manifest_sha does not match CI run commit $head_sha."
            exit 1
          fi
          history_path="docs/testing/quality-history/${head_sha}.json"
          if [[ -e "$history_path" ]]; then
            if cmp --silent "$manifest_path" "$history_path"; then
              echo "Quality history for $head_sha is already archived."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Quality history collision for immutable commit $head_sha."
            exit 1
          fi
          cp "$manifest_path" "$history_path"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Render deterministic dashboard
        if: steps.collect-manifest.outputs.available == 'true'
        run: >-
          python scripts/quality/generate_dashboard.py
          --history-dir docs/testing/quality-history
          --limit 30

      - name: Commit quality history
        if: steps.collect-manifest.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/quality-history docs/testing/dashboard.md
          if git diff --cached --quiet; then
            echo "No new quality history to commit."
            exit 0
          fi
          head_sha="${{ steps.collect-manifest.outputs.head_sha }}"
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Quality history source SHA is missing or invalid."
            exit 1
          fi
          branch="automation/quality-history-${head_sha}"
          existing_pr="$(gh pr list --state all --head "$branch" --limit 1 --json number,state,url --jq '.[0] // empty')"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git show "origin/$branch:docs/testing/quality-history/${head_sha}.json" \
              | cmp --silent - "docs/testing/quality-history/${head_sha}.json"; then
              echo "::error::Remote quality-history branch collides with immutable commit $head_sha."
              exit 1
            fi
            if [[ -n "$existing_pr" ]]; then
              echo "Quality history PR already exists for $head_sha: $existing_pr"
              exit 0
            fi
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(quality): archive quality history" \
              --body "Automated archive of the latest successful CI quality manifest and dashboard."
            exit 0
          fi
          if [[ -n "$existing_pr" ]]; then
            echo "Quality history PR was already handled for $head_sha: $existing_pr"
            exit 0
          fi
          git switch -c "$branch"
          git commit -m "chore(quality): archive quality history for ${head_sha:0:12}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(quality): archive quality history" \
            --body "Automated archive of the latest successful CI quality manifest and dashboard."
