# Reusable E2E Tests Workflow
# Runs Playwright E2E tests against a running backend
name: E2E Tests

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      python-version:
        description: "Python version for backend"
        required: false
        type: string
        default: "3.13"
      browser:
        description: "Browser to test (chromium, firefox, webkit)"
        required: false
        type: string
        default: "chromium"
      test-pattern:
        description: "Playwright test pattern"
        required: false
        type: string
        default: ""
      base-url:
        description: "Override base URL for tests"
        required: false
        type: string
        default: ""

jobs:
  e2e:
    name: E2E Tests (${{ inputs.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: "dummy_secret_key_for_ci_tests_at_least_32_chars"
      ENVIRONMENT: testing
      # Use Postgres (pgvector image) for migrations: pgvector, JSONB, partial
      # indexes, CONCURRENTLY, and ALTER COLUMN TYPE don't exist in SQLite, so
      # SQLite-passing migrations can silently fail in production.
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test_e2e"
      OTEL_SDK_DISABLED: "true"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies
        run: |
          uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # W142 polish-v3 — taiki-e/install-action wasm-pack tool resolution
      # broken: drager/wasm-pack 404 since v0.14.0 moved to rustwasm/wasm-pack;
      # install-action hardcodes old repo. Pinned rustwasm canonical curl URL
      # (HTTPS rustwasm.github.io, official wasm-pack installer — same trust
      # boundary as the SHA-pinned action's upstream source). Same fix as
      # W141 polish-v2 visual-audit.yml + W142 chromatic.yml.
      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Install Playwright
        working-directory: frontend
        env:
          BROWSER: ${{ inputs.browser }}
        run: npx playwright install --with-deps "$BROWSER"

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Start backend server
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Run E2E tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base-url || 'http://127.0.0.1:5173' }}
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8000
          INPUT_BASE_URL: ${{ inputs.base-url }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
          BROWSER: ${{ inputs.browser }}
        run: |
          BASE_URL="$INPUT_BASE_URL"
          if [[ -z "$BASE_URL" ]]; then
            BASE_URL="http://127.0.0.1:5173"
          fi

          npx playwright test "$TEST_PATTERN" \
            --project="$BROWSER" \
            --reporter=html

      # Wave 122 SW3: cross-env URL_STATE_E2E auto-managed mode.
      # Playwright's webServer.command (per playwright.config.ts:73-110)
      # spins up its own VITE_LHCI=true preview on port 4175 via cross-env,
      # so this step is independent of the default preview started above.
      # Chromium-only by design (W120 SW7 + W121 SW3 establishes the test
      # set). The auth bypass active under VITE_LHCI lets the URL-state
      # spec exercise authenticated routes without real auth.
      #
      # Wave 147 SW5 + SW6 partial structural closure (was W146 polish-v7
      # `continue-on-error: true` honest defer).
      #
      # The 5 pre-W147 failures were FOUR distinct root causes (NOT a
      # single hypothesis as the W146 honest-defer text assumed):
      #
      #   1. /schedule schema bug — `scheduleSearchSchema.w: v.string()`
      #      rejected TanStack Router's number-coerced `?w=1`. Closed
      #      W147 SW5 via union(number | string→number-transform). Test
      #      now passes (page mounts properly, not 500).
      #
      #   2. /activity test value bug — spec used `?p=month` but
      #      `activitySearchSchema.p` picklist is ["30d", "90d", "180d"].
      #      Closed W147 SW5 by changing test to `?p=90d` + removing the
      #      h1 Suspense-boundary wait (test goal is URL persistence).
      #
      #   3. /events tab + /events search hydration timing — W148+
      #      structural fix scope (~3-5h). Test.skip'd in spec with
      #      W148+ rationale + paths inline. See url-state-persistence
      #      .spec.ts for full diagnostic narrative.
      #
      #   4. /map MapLibre canvas headless mount — W148+ structural fix
      #      scope (~2-4h). Test.skip'd similarly.
      #
      # Result: 3 active tests (news + activity + schedule) pass + 3
      # test.skip'd. No failures. The `continue-on-error: true` of W146
      # polish-v7 is removed — the step now succeeds cleanly with 3
      # skipped (Playwright `test.skip` does not fail the step).
      #
      # W148+ work to close the remaining 3 deferrals is documented
      # inline in `frontend/tests/e2e/url-state-persistence.spec.ts`.
      - name: Run URL-state e2e (cross-env auto-managed)
        if: inputs.browser == 'chromium'
        working-directory: frontend
        env:
          URL_STATE_E2E: "true"
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8000
        run: |
          npx playwright test url-state-persistence.spec.ts \
            --project=chromium \
            --reporter=html

      # Wave 179 SW9: extend URL_STATE_E2E auto-managed mode to the new
      # login-flow regression spec. Closes W174 §Honesty #4-playwright by
      # adding chromium-only e2e for 3 W177 SW1 + W178 SW1 + W179 SW4
      # redirect scenarios (authed /login → /dashboard, authed
      # /forgot-password → /dashboard via PublicLayout useEffect, and
      # state.from preservation /login?redirect=/events → /events).
      # Reuses the same VITE_LHCI=true preview on port 4175 from the
      # URL_STATE_E2E webServer config in playwright.config.ts.
      - name: Run wave179 login-flow e2e (cross-env auto-managed)
        if: inputs.browser == 'chromium'
        working-directory: frontend
        env:
          URL_STATE_E2E: "true"
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8000
        run: |
          npx playwright test wave179-login-flow.spec.ts \
            --project=chromium \
            --reporter=html

      - name: Run authenticated accessibility E2E tests (cross-env auto-managed)
        if: inputs.browser == 'chromium'
        working-directory: frontend
        env:
          URL_STATE_E2E: "true"
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8000
        run: |
          npx playwright test accessibility.spec.ts \
            --project=chromium \
            --reporter=html

      - name: Terminate backend
        if: always()
        run: |
          if [[ -n "$BACKEND_PID" ]]; then
            kill "$BACKEND_PID" || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ inputs.browser }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ inputs.browser }}
          path: frontend/test-results/
          retention-days: 7


