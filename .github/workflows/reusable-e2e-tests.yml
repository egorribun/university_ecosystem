# Reusable E2E Tests Workflow
# Runs Playwright E2E tests against a running backend
name: E2E Tests

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      python-version:
        description: "Python version for backend"
        required: false
        type: string
        default: "3.13"
      browser:
        description: "Browser to test (chromium, firefox, webkit)"
        required: false
        type: string
        default: "chromium"
      test-pattern:
        description: "Playwright test pattern"
        required: false
        type: string
        default: ""
      base-url:
        description: "Override base URL for tests"
        required: false
        type: string
        default: ""

permissions: read-all

jobs:
  e2e:
    name: E2E Tests (${{ inputs.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: "dummy_secret_key_for_ci_tests_at_least_32_chars"
      ENVIRONMENT: testing
      DATABASE_URL: "sqlite+aiosqlite:///./e2e-test.db"
      OTEL_SDK_DISABLED: "true"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7.1.5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies
        run: |
          uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # P0-01 (audit 2026-03-06): Replaced unsafe `curl | sh` with taiki-e/install-action.
      # The action verifies SHA256 checksums from official GitHub releases, preventing
      # supply chain attacks via DNS hijacking or CDN compromise (OWASP CI/CD C-PPE-1).
      - name: Install wasm-pack
        uses: taiki-e/install-action@cbb1dcaa26e1459e2876c39f61c1e22a1258aac5 # v2.68.33
        with:
          tool: wasm-pack

      - name: Install Playwright
        working-directory: frontend
        env:
          BROWSER: ${{ inputs.browser }}
        run: npx playwright install --with-deps $BROWSER

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Start backend server
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Run E2E tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base-url || 'http://127.0.0.1:5173' }}
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8000
          INPUT_BASE_URL: ${{ inputs.base-url }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
          BROWSER: ${{ inputs.browser }}
        run: |
          BASE_URL="$INPUT_BASE_URL"
          if [[ -z "$BASE_URL" ]]; then
            BASE_URL="http://127.0.0.1:5173"
          fi

          npx playwright test $TEST_PATTERN \
            --project=$BROWSER \
            --reporter=html

      - name: Terminate backend
        if: always()
        run: |
          if [[ -n "$BACKEND_PID" ]]; then
            kill $BACKEND_PID || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.6.0
        with:
          name: playwright-report-${{ inputs.browser }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.6.0
        with:
          name: playwright-traces-${{ inputs.browser }}
          path: frontend/test-results/
          retention-days: 7


