# Reusable E2E Tests Workflow
# Runs Playwright E2E tests against a running backend
name: E2E Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "24"
      python-version:
        description: "Python version for backend"
        required: false
        type: string
        default: "3.14"
      browser:
        description: "Browser to test (chromium, firefox, webkit)"
        required: false
        type: string
        default: "chromium"
      test-pattern:
        description: "Playwright test pattern"
        required: false
        type: string
        default: ""
      base-url:
        description: "Override base URL for tests"
        required: false
        type: string
        default: ""
      shard-index:
        description: "Playwright shard number (1-based)"
        required: false
        type: number
        default: 1
      shard-total:
        description: "Total number of Playwright shards"
        required: false
        type: number
        default: 1
      advisory:
        description: "Allow this E2E invocation to report without blocking its caller"
        required: false
        type: boolean
        default: false
      collect-coverage:
        description: "Collect Chromium V8 coverage and upload an Istanbul/LCOV artifact"
        required: false
        type: boolean
        default: false
      wasm-artifact-id:
        description: "Server-issued same-run E2E WASM artifact id"
        required: false
        type: string
        default: ""
      wasm-artifact-name:
        description: "Attempt- and SHA-bound E2E WASM artifact name"
        required: false
        type: string
        default: ""
      wasm-artifact-digest:
        description: "Upload-artifact archive digest for the E2E WASM artifact"
        required: false
        type: string
        default: ""
jobs:
  e2e:
    name: E2E Tests (${{ inputs.browser }})
    runs-on: ubuntu-24.04
    # Reusable-workflow callers cannot set continue-on-error on the caller job.
    # Keep the advisory policy inside the reusable workflow so the same workflow
    # remains blocking by default for Chromium and opt-in advisory for the
    # stabilization matrix.
    continue-on-error: ${{ inputs.advisory }}
    # The Chromium suite includes expensive accessibility scans. The caller
    # splits the default suite into four Playwright shards.
    # Keep one worker per shard: four concurrent Chromium navigations are the
    # stable ceiling for the SSR preview; higher aggregate concurrency cascades
    # into page.goto net::ERR_ABORTED timeouts.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SECRET_KEY: "dummy_secret_key_for_ci_tests_at_least_32_chars"
      ENVIRONMENT: testing
      # Use Postgres (pgvector image) for migrations: pgvector, JSONB, partial
      # indexes, CONCURRENTLY, and ALTER COLUMN TYPE don't exist in SQLite, so
      # SQLite-passing migrations can silently fail in production.
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test_e2e"
      OTEL_SDK_DISABLED: "true"
      E2E_COVERAGE: ${{ inputs.collect-coverage && inputs.browser == 'chromium' && 'true' || 'false' }}
      # Rolldown/TanStack Start can briefly peak at ~1.55 GiB on the Linux
      # hosted runner while the SSR bundle is emitted. Keep the orchestrator's
      # finite RSS watchdog enabled with CI headroom; the V8 heap cap remains
      # 1536 MiB, so this does not turn an unbounded build into a pass.
      ROLLDOWN_WORKER_THREADS: "2"
      FRONTEND_BUILD_MAX_RSS_MB: "2048"
      FRONTEND_BUILD_MAX_OLD_SPACE_MB: "1536"
      # The artifact mode consumes the caller's immutable same-run producer.
      # Standalone/manual callers leave all three inputs empty and use the
      # explicitly guarded local fallback below.
      SKIP_WASM_BUILD: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies
        run: |
          uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Validate E2E WASM artifact input contract
        if: ${{ inputs.wasm-artifact-id != '' || inputs.wasm-artifact-name != '' || inputs.wasm-artifact-digest != '' }}
        shell: bash
        env:
          WASM_ARTIFACT_ID: ${{ inputs.wasm-artifact-id }}
          WASM_ARTIFACT_NAME: ${{ inputs.wasm-artifact-name }}
          WASM_ARTIFACT_DIGEST: ${{ inputs.wasm-artifact-digest }}
        run: |
          set -euo pipefail
          # Artifact mode is all-or-none. A partial input must never silently
          # fall back to a fresh local build or consume an ambiguous artifact.
          if [[ -z "$WASM_ARTIFACT_ID" || -z "$WASM_ARTIFACT_NAME" || -z "$WASM_ARTIFACT_DIGEST" ]]; then
            echo "::error::E2E WASM artifact mode requires all three inputs (id, name, digest)."
            exit 1
          fi
          [[ "$WASM_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WASM_ARTIFACT_NAME" =~ ^frontend-e2e-wasm-[0-9]+-[0-9]+-[0-9a-f]{40}$ ]]
          [[ "$WASM_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Download immutable E2E WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # An id is server-issued and scoped to this workflow run. Do not
          # replace it with a name-only or cross-run lookup.
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: frontend

      - name: Verify server-side E2E WASM artifact digest
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ inputs.wasm-artifact-id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.wasm-artifact-digest }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-connrefused \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_url}" -o "${response_file}"
          actual_digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("digest", ""))' "${response_file}")"
          if [[ "$actual_digest" =~ ^[0-9a-f]{64}$ ]]; then
            actual_digest="sha256:${actual_digest}"
          fi
          if [[ "${actual_digest}" != "${EXPECTED_ARTIFACT_DIGEST}" ]]; then
            echo "::error::E2E WASM artifact digest mismatch: server=${actual_digest} expected=${EXPECTED_ARTIFACT_DIGEST}"
            exit 1
          fi

      - name: Verify immutable E2E WASM provenance
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_ARTIFACT_ID: ${{ inputs.wasm-artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.wasm-artifact-name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.wasm-artifact-digest }}
        run: |
          set -euo pipefail
          test -s frontend/WASM_PROVENANCE.json
          test -s frontend/WASM_INVENTORY.json
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          export EXPECTED_SHA EXPECTED_PR_HEAD_SHA EXPECTED_REPOSITORY EXPECTED_WORKFLOW_REF EXPECTED_WORKFLOW_SHA EXPECTED_RUN_ID EXPECTED_RUN_ATTEMPT EXPECTED_EVENT EXPECTED_ARTIFACT_ID EXPECTED_ARTIFACT_NAME EXPECTED_ARTIFACT_DIGEST
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("frontend").resolve()
          provenance_path = root / "WASM_PROVENANCE.json"
          inventory_path = root / "WASM_INVENTORY.json"
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          expected = {
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "source_sha": os.environ["EXPECTED_SHA"],
              "pr_head_sha": os.environ["EXPECTED_PR_HEAD_SHA"],
              "workflow_ref": os.environ["EXPECTED_WORKFLOW_REF"],
              "workflow_sha": os.environ["EXPECTED_WORKFLOW_SHA"],
              "run_id": int(os.environ["EXPECTED_RUN_ID"]),
              "run_attempt": int(os.environ["EXPECTED_RUN_ATTEMPT"]),
              "event": os.environ["EXPECTED_EVENT"],
              "artifact_name": os.environ["EXPECTED_ARTIFACT_NAME"],
              "artifact_kind": "e2e-wasm",
              "schema_version": 1,
          }
          for key, value in expected.items():
              if provenance.get(key) != value:
                  raise SystemExit(f"WASM provenance mismatch for {key}: {provenance.get(key)!r}")
          files = inventory.get("files")
          if inventory.get("schema_version") != 1 or not isinstance(files, list) or not files:
              raise SystemExit("WASM inventory is missing or malformed")
          expected_digest = inventory.get("inventory_sha256")
          canonical = json.dumps(
              {"schema_version": inventory["schema_version"], "files": files},
              sort_keys=True,
              separators=(",", ":"),
          ).encode()
          if expected_digest != hashlib.sha256(canonical).hexdigest():
              raise SystemExit("WASM inventory digest mismatch")
          expected_paths = set()
          for record in files:
              relative = record.get("path") if isinstance(record, dict) else None
              if not isinstance(relative, str) or relative.startswith("/") or ".." in Path(relative).parts:
                  raise SystemExit(f"invalid WASM inventory path: {relative!r}")
              path = root / relative
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(root):
                  raise SystemExit(f"unsafe or missing WASM inventory path: {relative!r}")
              if relative in expected_paths:
                  raise SystemExit(f"duplicate WASM inventory path: {relative!r}")
              expected_paths.add(relative)
              if path.stat().st_size != record.get("size"):
                  raise SystemExit(f"WASM size mismatch: {relative}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != record.get("sha256"):
                  raise SystemExit(f"WASM digest mismatch: {relative}")
          actual_paths = {
              path.relative_to(root).as_posix()
              for package in (root / "rust-crypto/pkg", root / "wasm-sanitizer/pkg")
              for path in package.rglob("*")
              if path.is_file() and not path.is_symlink()
          }
          if actual_paths != expected_paths:
              raise SystemExit("WASM inventory does not exactly match generated package files")
          if provenance.get("inventory_sha256") != expected_digest:
              raise SystemExit("WASM provenance inventory digest mismatch")
          package_roots = (root / "rust-crypto/pkg", root / "wasm-sanitizer/pkg")
          for package in package_roots:
              if not package.is_dir() or package.is_symlink():
                  raise SystemExit(f"missing or symlinked WASM package: {package}")
              for entry in package.rglob("*"):
                  if entry.is_symlink():
                      raise SystemExit(f"symlink in WASM package: {entry}")
          PY
          (cd frontend && node scripts/verify-wasm-artifacts.mjs)

      - name: Verify E2E coverage merger
        if: ${{ inputs.collect-coverage && inputs.browser == 'chromium' }}
        working-directory: frontend
        run: npm run test:e2e:coverage-tool

      # W142 polish-v3 — taiki-e/install-action wasm-pack tool resolution
      # broken: drager/wasm-pack 404 since v0.14.0 moved to rustwasm/wasm-pack;
      # install-action hardcodes old repo. Pinned rustwasm canonical curl URL
      # (HTTPS rustwasm.github.io, official wasm-pack installer — same trust
      # boundary as the SHA-pinned action's upstream source). Same fix as
      # W141 polish-v2 visual-audit.yml + W142 chromatic.yml.
      - name: Install wasm-pack
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-pack@0.15.0

      - name: Setup Rust toolchain
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        # The fallback producer must use the same compiler as the canonical
        # same-run producer or generated bytes can drift across runner images.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      - name: Build WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        # Binaryen is downloaded by wasm-pack from GitHub Releases on the first
        # build. Retry transient CDN 404/timeout failures without weakening the
        # build: persistent failures still fail the job after three attempts.
        working-directory: frontend
        env:
          SKIP_WASM_BUILD: "0"
        run: |
          for attempt in 1 2 3; do
            if wasm-pack build rust-crypto --target web --release && \
               wasm-pack build wasm-sanitizer --target web --release; then
              echo "OK: WASM modules built (attempt $attempt)"
              exit 0
            fi
            echo "WASM build failed on attempt $attempt; retrying after 10s..."
            sleep 10
          done
          echo "::error::WASM build failed after 3 attempts"
          exit 1

      - name: Restore Playwright browser cache
        id: restore_playwright_browser_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache only Playwright-managed browser binaries. The lockfile and
          # canonical browser name bind the entry to the exact dependency and
          # browser variant; node_modules and test output never enter this key.
          path: ~/.cache/ms-playwright
          key: playwright-browsers-v1-${{ runner.os }}-${{ inputs.browser == 'mobile-webkit' && 'webkit' || inputs.browser }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright
        working-directory: frontend
        env:
          BROWSER: ${{ inputs.browser }}
          # ubuntu-24.04 hosted runners are pre-provisioned with Playwright's
          # shared browser libraries. Keep the helper's full --with-deps path
          # as the default for local/self-hosted callers; this opt-in only
          # removes the repeated apt bootstrap from this hosted E2E workflow.
          PLAYWRIGHT_SKIP_SYSTEM_DEPS: "1"
        run: bash ../scripts/ci/install-playwright-with-deps.sh "$BROWSER"

      - name: Save Playwright browser cache
        if: ${{ success() && steps.restore_playwright_browser_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-v1-${{ runner.os }}-${{ inputs.browser == 'mobile-webkit' && 'webkit' || inputs.browser }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Start backend server
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Run E2E tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base-url || 'http://127.0.0.1:5173' }}
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8000
          INPUT_BASE_URL: ${{ inputs.base-url }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
          BROWSER: ${{ inputs.browser }}
          SHARD_INDEX: ${{ inputs.shard-index }}
          SHARD_TOTAL: ${{ inputs.shard-total }}
        run: |
          BASE_URL="$INPUT_BASE_URL"
          if [[ -z "$BASE_URL" ]]; then
            BASE_URL="http://127.0.0.1:5173"
          fi

          npx playwright test "$TEST_PATTERN" \
            --project="$BROWSER" \
            --shard="$SHARD_INDEX/$SHARD_TOTAL" \
            --workers=1 \
            --reporter=html

      # Wave 122 SW3: cross-env URL_STATE_E2E auto-managed mode.
      # Playwright's webServer.command (per playwright.config.ts:73-110)
      # spins up its own VITE_LHCI=true preview on port 4175 via cross-env,
      # so this step is independent of the default preview started above.
      # The URL-state suite remains Chromium-only because its auth bypass and
      # route-specific diagnostics are intentionally separate from the
      # cross-browser functional matrix. The regular E2E suite is invoked for
      # all browser projects by the caller's advisory matrix job.
      #
      # Wave 147 SW5 + SW6 partial structural closure (was W146 polish-v7
      # `continue-on-error: true` honest defer).
      #
      # The 5 pre-W147 failures were FOUR distinct root causes (NOT a
      # single hypothesis as the W146 honest-defer text assumed):
      #
      #   1. /schedule schema bug — `scheduleSearchSchema.w: v.string()`
      #      rejected TanStack Router's number-coerced `?w=1`. Closed
      #      W147 SW5 via union(number | string→number-transform). Test
      #      now passes (page mounts properly, not 500).
      #
      #   2. /activity test value bug — spec used `?p=month` but
      #      `activitySearchSchema.p` picklist is ["30d", "90d", "180d"].
      #      Closed W147 SW5 by changing test to `?p=90d` + removing the
      #      h1 Suspense-boundary wait (test goal is URL persistence).
      #
      #   3. /events tab + /events search hydration timing — W148+
      #      structural fix scope (~3-5h). Test.skip'd in spec with
      #      W148+ rationale + paths inline. See url-state-persistence
      #      .spec.ts for full diagnostic narrative.
      #
      #   4. /map MapLibre canvas headless mount — W148+ structural fix
      #      scope (~2-4h). Test.skip'd similarly.
      #
      # Result: 3 active tests (news + activity + schedule) pass + 3
      # test.skip'd. No failures. The `continue-on-error: true` of W146
      # polish-v7 is removed — the step now succeeds cleanly with 3
      # skipped (Playwright `test.skip` does not fail the step).
      #
      # W148+ work to close the remaining 3 deferrals is documented
      # inline in `frontend/tests/e2e/url-state-persistence.spec.ts`.
      - name: Run URL-state e2e (cross-env auto-managed)
        if: inputs.browser == 'chromium' && inputs.shard-index == 1
        working-directory: frontend
        env:
          URL_STATE_E2E: "true"
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8000
        run: |
          # Playwright cleans its output directory at the start of each
          # invocation. Keep auxiliary suites in separate subdirectories so
          # the coverage merger can still see the regular shard output and
          # every auxiliary suite's report.
          npx playwright test url-state-persistence.spec.ts messenger-heartbeat-blackhole.spec.ts \
            --project=chromium \
            --output=test-results/url-state \
            --reporter=html

      # Wave 179 SW9: extend URL_STATE_E2E auto-managed mode to the new
      # login-flow regression spec. Closes W174 §Honesty #4-playwright by
      # adding chromium-only e2e for 3 W177 SW1 + W178 SW1 + W179 SW4
      # redirect scenarios (authed /login → /dashboard, authed
      # /forgot-password → /dashboard via PublicLayout useEffect, and
      # state.from preservation /login?redirect=/events → /events).
      # Reuses the same VITE_LHCI=true preview on port 4175 from the
      # URL_STATE_E2E webServer config in playwright.config.ts.
      - name: Run wave179 login-flow e2e (cross-env auto-managed)
        if: inputs.browser == 'chromium' && inputs.shard-index == 1
        working-directory: frontend
        env:
          URL_STATE_E2E: "true"
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8000
        run: |
          npx playwright test login-flow.spec.ts \
            --project=chromium \
            --output=test-results/login-flow \
            --reporter=html

      # Phase 7.4: exercise the production Node SSR wrapper and assert that
      # hashed assets are immutable while the HTML shell is never shared.
      - name: Run production SSR cache-control contract
        if: inputs.browser == 'chromium' && inputs.shard-index == 1
        working-directory: frontend
        env:
          PRODUCTION_SERVER_E2E: "true"
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8000
        run: |
          npx playwright test ssr-caching.spec.ts \
            --project=chromium \
            --output=test-results/ssr-caching \
            --reporter=html

      - name: Run authenticated accessibility E2E tests (cross-env auto-managed)
        if: inputs.browser == 'chromium' && inputs.shard-index == 1
        working-directory: frontend
        env:
          URL_STATE_E2E: "true"
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8000
        run: |
          npx playwright test accessibility.spec.ts \
            --project=chromium \
            --output=test-results/accessibility \
            --reporter=html

      - name: Merge Chromium JavaScript coverage
        if: ${{ inputs.collect-coverage && inputs.browser == 'chromium' && success() }}
        working-directory: frontend
        run: node scripts/merge-playwright-coverage.mjs --input=test-results --output=coverage/e2e

      - name: Upload E2E coverage artifact
        if: ${{ always() && inputs.collect-coverage && inputs.browser == 'chromium' }}
        # Coverage is diagnostic evidence; an artifact transport outage must
        # not turn a passing browser test into a false product failure.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-coverage-${{ inputs.shard-index }}-of-${{ inputs.shard-total }}
          path: frontend/coverage/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Terminate backend
        if: always()
        run: |
          if [[ -n "$BACKEND_PID" ]]; then
            kill "$BACKEND_PID" || true
          fi

      - name: Upload Playwright report
        if: always()
        # Keep the test result authoritative while making report transport
        # best-effort (GitHub artifact service can transiently time out).
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ inputs.browser }}-shard-${{ inputs.shard-index }}-of-${{ inputs.shard-total }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ inputs.browser }}-shard-${{ inputs.shard-index }}-of-${{ inputs.shard-total }}
          path: frontend/test-results/
          retention-days: 7
