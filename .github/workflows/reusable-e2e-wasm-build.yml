# Shared same-run WebAssembly producer for browser E2E jobs.
#
# The producer is deliberately a small, read-only reusable workflow.  It builds
# the two generated packages once, publishes an attempt- and SHA-bound artifact,
# and records the exact source/toolchain/file inventory that consumers verify
# before the generated modules can be used by Playwright.
name: E2E WASM Build

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      artifact_id:
        description: "Server-issued same-run artifact id"
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_name:
        description: "Attempt- and SHA-bound artifact name"
        value: ${{ jobs.build.outputs.artifact_name }}
      artifact_digest:
        description: "Upload-artifact archive digest"
        value: ${{ jobs.build.outputs.artifact_digest }}

jobs:
  build:
    name: Build E2E WASM modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.publish.outputs.artifact_name }}
      artifact_digest: ${{ steps.normalize_digest.outputs.artifact_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Rust toolchain
        # Keep E2E's same-run producer byte-identical to the checked-in
        # packages and the frontend producer despite hosted-image updates.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0

      - name: Install pinned wasm-opt
        shell: bash
        run: |
          set -euo pipefail
          binaryen_version="version_133"
          binaryen_sha256="2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489" # public Binaryen release checksum
          binaryen_root="$RUNNER_TEMP/binaryen-$binaryen_version"
          binaryen_archive="$RUNNER_TEMP/binaryen-$binaryen_version-x86_64-linux.tar.gz"
          binaryen_url="https://github.com/WebAssembly/binaryen/releases/download/$binaryen_version/binaryen-$binaryen_version-x86_64-linux.tar.gz"
          rm -rf -- "$binaryen_root"
          mkdir -p -- "$binaryen_root"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$binaryen_archive" "$binaryen_url"
          printf '%s  %s\n' "$binaryen_sha256" "$binaryen_archive" \
            | sha256sum --check --strict
          tar --extract --file "$binaryen_archive" --strip-components=1 --directory "$binaryen_root"
          test -x "$binaryen_root/bin/wasm-opt"
          "$binaryen_root/bin/wasm-opt" --version | grep -Fq "version 133"
          echo "$binaryen_root/bin" >> "$GITHUB_PATH"

      - name: Build immutable WASM modules
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          wasm-pack --version
          rustup target add wasm32-unknown-unknown
          rustup target list --installed | grep -Fxq "wasm32-unknown-unknown"
          # Rust embeds source and dependency paths in optimized WASM custom
          # sections. Remap runner-specific paths to canonical Linux paths
          # while preserving any caller-provided flags.
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$HOME/.cargo=/usr/local/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/work"
          for attempt in 1 2 3; do
            rm -rf -- rust-crypto/pkg wasm-sanitizer/pkg
            # wasm-pack installs shared wasm-bindgen/wasm-opt helpers under
            # the user's cache.  Serialize the producers to avoid concurrent
            # cache writes that make generated bytes drift from provenance.
            if wasm-pack build rust-crypto --target web --release && \
               wasm-pack build wasm-sanitizer --target web --release; then
              echo "OK: WASM modules built (attempt $attempt)"
              exit 0
            fi
            if (( attempt == 3 )); then
              echo "::error::WASM build failed after 3 attempts"
              exit 1
            fi
            echo "WASM build failed on attempt $attempt; retrying after 10s..."
            sleep 10
          done

      - name: Bind checked-in package bytes to source inventory
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { writeSourceProvenance } from "./scripts/wasm-source-provenance.mjs"
          await writeSourceProvenance(process.cwd())
          JS
          node scripts/verify-wasm-artifacts.mjs

      - name: Write immutable WASM provenance
        id: publish
        working-directory: frontend
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          PRODUCER_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_SHA"
          export EXPECTED_SHA PR_HEAD_SHA WORKFLOW_REPOSITORY WORKFLOW_REF WORKFLOW_SHA RUN_ID RUN_ATTEMPT WORKFLOW_EVENT PRODUCER_JOB
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".").resolve()
          package_roots = (Path("rust-crypto/pkg"), Path("wasm-sanitizer/pkg"))
          records = []
          for package_root in package_roots:
              if not package_root.is_dir() or package_root.is_symlink():
                  raise SystemExit(f"missing or symlinked WASM package: {package_root}")
              # ``Path.rglob`` keeps the relative spelling of a relative root.
              # Resolve the validated package root before walking so every
              # path can be safely compared with the absolute checkout root.
              absolute_package_root = package_root.resolve()
              if not absolute_package_root.is_relative_to(root):
                  raise SystemExit(
                      f"WASM package escapes checkout root: {package_root}"
                  )
              for path in sorted(absolute_package_root.rglob("*")):
                  if path.is_symlink():
                      raise SystemExit(f"symlink in WASM package: {path}")
                  if path.is_file():
                      relative = path.relative_to(root).as_posix()
                      digest = hashlib.sha256(path.read_bytes()).hexdigest()
                      records.append({"path": relative, "size": path.stat().st_size, "sha256": digest})
          if not records:
              raise SystemExit("WASM package inventory is empty")
          inventory = {"schema_version": 1, "files": records}
          inventory_bytes = json.dumps(inventory, sort_keys=True, separators=(",", ":")).encode()
          inventory["inventory_sha256"] = hashlib.sha256(inventory_bytes).hexdigest()
          Path("WASM_INVENTORY.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          provenance = {
              "schema_version": 1,
              "artifact_kind": "e2e-wasm",
              "artifact_name": f"frontend-e2e-wasm-{os.environ['RUN_ID']}-{os.environ['RUN_ATTEMPT']}-{os.environ['EXPECTED_SHA']}",
              "repository": os.environ["WORKFLOW_REPOSITORY"],
              "source_sha": os.environ["EXPECTED_SHA"],
              "pr_head_sha": os.environ["PR_HEAD_SHA"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "event": os.environ["WORKFLOW_EVENT"],
              "producer_job": os.environ["PRODUCER_JOB"],
              "toolchain": {
                  "node": os.popen("node --version").read().strip(),
                  "rustc": os.popen("rustc --version").read().strip(),
                  "wasm_pack": os.popen("wasm-pack --version").read().strip(),
                  "target": "wasm32-unknown-unknown",
              },
              "inventory_sha256": inventory["inventory_sha256"],
          }
          Path("WASM_PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"artifact_name={provenance['artifact_name']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_name={provenance['artifact_name']}\n")
          PY

      # Temporary public build-postimage export for GitHub-plugin-only recovery.
      # Remove after the generated packages and source manifest are committed.
      - name: Export bounded WASM candidate postimages
        working-directory: frontend
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git show HEAD:frontend/WASM_SOURCE_PROVENANCE.json > "$RUNNER_TEMP/wasm-candidate-base.json"
          node --input-type=module <<'JS'
          import { createHash } from "node:crypto"
          import { lstat, readFile } from "node:fs/promises"
          import path from "node:path"

          const prefix = "WASM_CANDIDATE_V1 "
          const cryptoPaths = [
            "rust-crypto/pkg/package.json",
            "rust-crypto/pkg/uni_wasm_crypto.d.ts",
            "rust-crypto/pkg/uni_wasm_crypto.js",
            "rust-crypto/pkg/uni_wasm_crypto_bg.wasm",
          ]
          const sanitizerPaths = [
            "wasm-sanitizer/pkg/package.json",
            "wasm-sanitizer/pkg/wasm_sanitizer.d.ts",
            "wasm-sanitizer/pkg/wasm_sanitizer.js",
            "wasm-sanitizer/pkg/wasm_sanitizer_bg.wasm",
          ]
          const previous = JSON.parse(await readFile(
            path.join(process.env.RUNNER_TEMP, "wasm-candidate-base.json"), "utf8"
          ))
          const sourceSha = process.env.SOURCE_SHA
          if (!/^[0-9a-f]{40}$/.test(sourceSha)) throw new Error("invalid source SHA")
          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex")
          const records = []
          let totalBytes = 0
          for (const relative of [...cryptoPaths, ...sanitizerPaths, "WASM_SOURCE_PROVENANCE.json"]) {
            const info = await lstat(relative)
            if (!info.isFile() || info.isSymbolicLink()) throw new Error("invalid candidate file")
            const bytes = await readFile(relative)
            const digest = sha256(bytes)
            const prior = previous.packages[relative]
            if (sanitizerPaths.includes(relative)) {
              if (!prior || prior.size !== bytes.length || prior.sha256 !== digest) {
                throw new Error("unchanged sanitizer package drifted; inspect before export")
              }
              records.push({ kind: "unchanged", path: relative, size: bytes.length, sha256: digest })
              continue
            }
            if (bytes.length > 131072) throw new Error("candidate exceeds per-file export bound")
            if (prior && prior.size === bytes.length && prior.sha256 === digest) {
              records.push({ kind: "unchanged", path: relative, size: bytes.length, sha256: digest })
              continue
            }
            totalBytes += bytes.length
            if (totalBytes > 524288) throw new Error("candidate exceeds total export bound")
            const gitBlobSha = createHash("sha1")
              .update(Buffer.from("blob " + bytes.length + "\0")).update(bytes).digest("hex")
            const encoded = bytes.toString("base64")
            const chunks = encoded.match(/.{1,4096}/g) ?? [""]
            records.push({
              kind: "file", path: relative, size: bytes.length, sha256: digest,
              git_blob_sha: gitBlobSha, total_parts: chunks.length, source_sha: sourceSha,
            })
            chunks.forEach((data, index) => records.push({
              kind: "part", path: relative, index, data,
            }))
          }
          // Do not emit a partial candidate if any path, hash or size check failed.
          for (const record of records) console.log(prefix + JSON.stringify(record))
          console.log(prefix + JSON.stringify({
            kind: "complete", source_sha: sourceSha, total_bytes: totalBytes,
            files: records.filter((record) => record.kind === "file").length,
          }))
          JS

      - name: Upload immutable E2E WASM modules
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.publish.outputs.artifact_name }}
          path: |
            frontend/rust-crypto/pkg
            frontend/wasm-sanitizer/pkg
            frontend/WASM_SOURCE_PROVENANCE.json
            frontend/WASM_PROVENANCE.json
            frontend/WASM_INVENTORY.json
          if-no-files-found: error
          overwrite: false
          # GitHub's failed-job rerun window is 30 days. Keep the immutable
          # producer artifact for that entire window so consumers can retry
          # without rebuilding or losing SHA-bound provenance.
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

      - name: Normalize E2E WASM artifact digest
        id: normalize_digest
        shell: bash
        env:
          RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          if [[ "$RAW_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            artifact_digest="sha256:${RAW_ARTIFACT_DIGEST}"
          elif [[ "$RAW_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            artifact_digest="$RAW_ARTIFACT_DIGEST"
          else
            echo "::error::Unexpected upload-artifact digest format"
            exit 1
          fi
          printf 'artifact_digest=%s\n' "$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Verify uploaded artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.normalize_digest.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
