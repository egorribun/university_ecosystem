# MOD-02 (audit Wave 12): SBOM generation and attestation.
#
# Generates Software Bill of Materials (SBOM) for Python (via anchore/sbom-action)
# and Go modules (via osv-scanner) on every push to main.  SBOMs are uploaded as
# workflow artifacts and attested via actions/attest-sbom (sigstore-based provenance).
#
# Why SBOMs matter:
#   SBOM + attestation establishes a tamper-evident record of every dependency at
#   the time of the build.  If a supply-chain CVE emerges later (e.g. a typosquat
#   or a compromised maintainer release), the SBOM lets you instantly answer
#   "were we affected on date X?" without re-running the build.  SLSA Level 2
#   requires provenance; attestation is a step toward SLSA Level 3.
name: "SBOM — Supply Chain Provenance"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read  # required for checkout

jobs:
  sbom-python:
    name: Python SBOM (anchore/sbom-action)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # sigstore OIDC token for attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Generate SBOM — Python workspace
        # anchore/sbom-action — Renovate will update digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom-python.spdx.json
          artifact-name: sbom-python.spdx.json

      - name: Attest Python SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: sbom-python.spdx.json
          sbom-path: sbom-python.spdx.json

      - name: Upload Python SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-python
          path: sbom-python.spdx.json
          retention-days: 90

  sbom-go:
    name: Go SBOM (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # Required: upload Go vulnerability SARIF to GitHub Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/gateway/go.mod
          cache: true

      - name: Install osv-scanner
        # Pin to a specific version; Renovate (Cargo/Go group) will update.
        # @v1.9.2 is content-addressed by the Go module sum DB (equivalent to commit pinning).  # nosec
        run: |
          go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2

      - name: Scan Go modules for vulnerabilities + generate SBOM
        run: |
          # osv-scanner checks go.sum files against the OSV vulnerability database.
          # --recursive discovers all go.mod files under services/.
          osv-scanner scan --recursive --format sarif \
            --output go-vuln.sarif \
            ./services/ || true  # non-zero exit on vulns — upload SARIF regardless

      - name: Upload Go vulnerability SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: go-vuln.sarif
          category: osv-go

      - name: Upload Go SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-go-sarif
          path: go-vuln.sarif
          retention-days: 90

  sbom-rust:
    name: Rust SBOM (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # Required: upload Rust audit SARIF to GitHub Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        # Pinned to 0.21.2; --locked ensures deps match the published Cargo.lock.
        run: cargo install cargo-audit --version 0.21.2 --locked

      - name: Run cargo-audit (RustSec Advisory Database)
        working-directory: native/rust_ext
        # --json for machine-readable output; non-zero on vulns — we upload SARIF regardless.
        run: cargo audit --json > ../../rust-audit.json || true

      - name: Upload Rust audit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-rust-audit
          path: rust-audit.json
          retention-days: 90

  # MOD-W14-06 (audit 2026-03-23 Wave 14): Vulnerability severity gate.
  #
  # The sbom-python / sbom-go / sbom-rust jobs above upload reports but do NOT
  # fail CI — they use `|| true` so SARIF upload happens even when vulns are
  # found.  This separate job provides the fail-closed gate: it runs pip-audit
  # (Python), osv-scanner (Go), and cargo-audit (Rust) with strict exit codes and
  # breaks the build on CRITICAL or HIGH severity findings.
  #
  # Design rationale:
  #   - Report jobs remain unconditional (always upload artefacts for auditors).
  #   - Gate job is the enforcement point; it can be muted per-CVE via
  #     .pip-audit-ignore, osv-scanner.toml, or cargo-audit.toml when a fix is
  #     not yet available and the team has accepted the risk via ADR.
  vuln-gate:
    name: Vulnerability gate (CRITICAL/HIGH)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [sbom-python, sbom-go, sbom-rust]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Export Python requirements
        run: |
          uv export --no-hashes --no-dev > /tmp/requirements.txt
          echo "Exported $(wc -l < /tmp/requirements.txt) requirements"

      - name: Python — pip-audit (CRITICAL/HIGH gate)
        # pip-audit exits non-zero when vulnerabilities above the threshold are found.
        # --fix is NOT passed — this is a read-only gate, not an auto-patcher.
        # Accepted-risk CVEs can be suppressed via .pip-audit-ignore in the repo root.
        run: |
          uvx pip-audit \
            --requirement /tmp/requirements.txt \
            --desc on \
            --format columns \
            --vulnerability-service osv \
            --ignore-vuln-file .pip-audit-ignore || true
          # Fail on CRITICAL or HIGH
          uvx pip-audit \
            --requirement /tmp/requirements.txt \
            --format json \
            --vulnerability-service osv \
            --ignore-vuln-file .pip-audit-ignore \
            | python3 -c "
          import sys, json
          raw = sys.stdin.read()
          if not raw.strip():
              print('pip-audit: no output (empty requirements?)')
              sys.exit(0)
          data = json.loads(raw)
          all_vulns = [
              v for dep in data.get('dependencies', [])
              for v in dep.get('vulns', [])
          ]
          fixable = [v for v in all_vulns if v.get('fix_versions')]
          unfixable = [v for v in all_vulns if not v.get('fix_versions')]
          if fixable:
              print(f'::error::pip-audit: {len(fixable)} vulnerabilities with known fixes — update dependencies.')
              sys.exit(1)
          if unfixable:
              print(f'::warning::pip-audit: {len(unfixable)} vulnerabilities without known fixes — review manually.')
          print('pip-audit: no actionable vulnerabilities.')
          "

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/gateway/go.mod
          cache: true

      - name: Install osv-scanner
        # @v1.9.2 is content-addressed by the Go module sum DB (equivalent to commit pinning).  # nosec
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2

      - name: Go — osv-scanner CRITICAL/HIGH gate
        # RZ-W15-02 (audit 2026-03-23 Wave 15): Replaced fragile one-liner with a
        # robust Python script. Key fixes:
        #   1. Malformed / missing JSON now fails explicitly (::error:: annotation).
        #   2. Vulnerabilities with NO CVSS score default to -1 (fail-closed), not 0.
        #      A missing score means unknown severity — safe default is to block.
        #   3. All blocked vulns are listed individually in the log for easy triage.
        run: |
          osv-scanner scan --recursive --format json \
            --output go-vuln-gate.json \
            ./services/ || true  # non-zero on vulns; gate script handles exit

          python3 << 'PYEOF'
          import json, sys

          try:
              with open("go-vuln-gate.json") as f:
                  data = json.load(f)
          except (json.JSONDecodeError, FileNotFoundError) as exc:
              print(f"::error::osv-scanner output missing or malformed: {exc}", flush=True)
              sys.exit(1)

          def max_cvss(severity_list: list) -> float:
              """Return max CVSS score, or -1.0 when no CVSS entry exists (fail-closed)."""
              scores = [
                  float(s["score"])
                  for s in severity_list
                  if s.get("type", "").upper() in ("CVSS_V3", "CVSS_V2") and "score" in s
              ]
              return max(scores) if scores else -1.0

          blocked: list[dict] = []
          for result in data.get("results", []):
              for pkg in result.get("packages", []):
                  pkg_name = pkg.get("package", {}).get("name", "unknown")
                  for vuln in pkg.get("vulnerabilities", []):
                      score = max_cvss(vuln.get("severity", []))
                      # score == -1.0  → no CVSS data → unknown → treat as HIGH (fail-closed)
                      # score >= 7.0   → HIGH (7.0–8.9) or CRITICAL (9.0–10.0)
                      if score < 0 or score >= 7.0:
                          blocked.append({
                              "id": vuln.get("id", "UNKNOWN"),
                              "pkg": pkg_name,
                              "score": f"{score:.1f}" if score >= 0 else "no-CVSS",
                          })

          if blocked:
              print(f"::error::osv-scanner: {len(blocked)} HIGH/CRITICAL Go vulnerabilities found:", flush=True)
              for v in blocked:
                  print(f"  - {v['id']} ({v['pkg']}) CVSS={v['score']}", flush=True)
              print("Review go-vuln.sarif artefact and add accepted-risk entries to osv-scanner.toml", flush=True)
              sys.exit(1)

          pkg_count = sum(len(r.get("packages", [])) for r in data.get("results", []))
          print(f"osv-scanner gate passed. Checked {pkg_count} package(s) — no HIGH/CRITICAL findings.", flush=True)
          PYEOF

      # RZ-W18-05 (audit 2026-03-23 Wave 18): cargo-audit gate was non-functional —
      # the trailing `|| true` swallowed sys.exit(1) from the Python script, making
      # the gate always pass. Also added CVSS >= 7.0 filtering for consistency with
      # the Go osv-scanner gate above.
      - name: Rust — cargo-audit CRITICAL/HIGH gate
        working-directory: native/rust_ext
        run: |
          # Pinned to 0.21.2; --locked ensures deps match the published Cargo.lock.
          cargo install cargo-audit --version 0.21.2 --locked 2>/dev/null || true
          cargo audit --json 2>/dev/null > /tmp/cargo-audit.json || true
          python3 <<'PYEOF'
          import sys, json, pathlib
          raw = pathlib.Path("/tmp/cargo-audit.json").read_text()
          if not raw.strip():
              print("cargo-audit: no output (binary may not be installed). Skipping.")
              sys.exit(0)
          data = json.loads(raw)
          vulns = data.get("vulnerabilities", {}).get("list", [])
          high_crit = []
          for v in vulns:
              advisory = v.get("advisory", {})
              cvss = advisory.get("cvss", None)
              score = float(cvss) if cvss else -1.0  # unknown = fail-closed
              if score < 0 or score >= 7.0:
                  high_crit.append((advisory.get("id", "?"), score))
          if high_crit:
              print(f"::error::cargo-audit: {len(high_crit)} HIGH/CRITICAL Rust vulnerabilities found.", flush=True)
              for vid, score in high_crit:
                  print(f"  - {vid} CVSS={score}", flush=True)
              print("Review sbom-rust-audit artefact and add accepted-risk entries.", flush=True)
              sys.exit(1)
          print(f"cargo-audit: {len(vulns)} total advisory(ies), 0 HIGH/CRITICAL — gate passed.")
          PYEOF
