# MOD-02 (audit Wave 12): SBOM generation and attestation.
#
# Generates Software Bill of Materials (SBOM) for Python (via anchore/sbom-action)
# and Go modules (via osv-scanner) on every push to main.  SBOMs are uploaded as
# workflow artifacts and attested via actions/attest-sbom (sigstore-based provenance).
#
# Why SBOMs matter:
#   SBOM + attestation establishes a tamper-evident record of every dependency at
#   the time of the build.  If a supply-chain CVE emerges later (e.g. a typosquat
#   or a compromised maintainer release), the SBOM lets you instantly answer
#   "were we affected on date X?" without re-running the build.  SLSA Level 2
#   requires provenance; attestation is a step toward SLSA Level 3.
name: "SBOM — Supply Chain Provenance"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read  # required for checkout

jobs:
  sbom-python:
    name: Python SBOM (anchore/sbom-action)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # upload artifact + attest
      id-token: write   # sigstore OIDC token for attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        run: pip install uv

      - name: Generate SBOM — Python workspace
        # anchore/sbom-action — Renovate will update digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom-python.spdx.json
          artifact-name: sbom-python.spdx.json

      - name: Attest Python SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: sbom-python.spdx.json
          sbom-path: sbom-python.spdx.json

      - name: Upload Python SBOM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-python
          path: sbom-python.spdx.json
          retention-days: 90

  sbom-go:
    name: Go SBOM (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload SARIF to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: services/gateway/go.mod
          cache: true

      - name: Install osv-scanner
        # Pin to a specific version; Renovate (Cargo/Go group) will update.
        run: |
          go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2

      - name: Scan Go modules for vulnerabilities + generate SBOM
        run: |
          # osv-scanner checks go.sum files against the OSV vulnerability database.
          # --recursive discovers all go.mod files under services/.
          osv-scanner scan --recursive --format sarif \
            --output go-vuln.sarif \
            ./services/ || true  # non-zero exit on vulns — upload SARIF regardless

      - name: Upload Go vulnerability SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4.34.1
        if: always()
        with:
          sarif_file: go-vuln.sarif
          category: osv-go

      - name: Upload Go SARIF artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: sbom-go-sarif
          path: go-vuln.sarif
          retention-days: 90

  sbom-rust:
    name: Rust SBOM (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload SARIF to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit (RustSec Advisory Database)
        working-directory: native/rust_ext
        # --json for machine-readable output; non-zero on vulns — we upload SARIF regardless.
        run: cargo audit --json > ../../rust-audit.json || true

      - name: Upload Rust audit artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: sbom-rust-audit
          path: rust-audit.json
          retention-days: 90

