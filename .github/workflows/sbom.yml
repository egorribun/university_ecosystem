# MOD-02 (audit Wave 12): SBOM generation and attestation.
#
# Generates Software Bill of Materials (SBOM) for Python (via anchore/sbom-action)
# and Go modules (via osv-scanner) on every push to main.  SBOMs are uploaded as
# workflow artifacts and attested via actions/attest-sbom (sigstore-based provenance).
#
# Why SBOMs matter:
#   SBOM + attestation establishes a tamper-evident record of every dependency at
#   the time of the build.  If a supply-chain CVE emerges later (e.g. a typosquat
#   or a compromised maintainer release), the SBOM lets you instantly answer
#   "were we affected on date X?" without re-running the build.  SLSA Level 2
#   requires provenance; attestation is a step toward SLSA Level 3.
name: "SBOM — Supply Chain Provenance"

on:
  push:
    branches: ["main"]
  # Pull requests use a separate read-only vulnerability evaluator below.
  # The attestation/SARIF producers remain trusted-main-only because they
  # request write-capable GitHub permissions.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # required for checkout

concurrency:
  # A newer PR commit or main push supersedes stale inventory. Operator-
  # dispatched evidence runs stay unique and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  # Canonical inventory for the RustSec gate. Fuzz lockfiles are included
  # deliberately: they execute untrusted generated inputs in CI and must not
  # become an unaudited dependency island. A contract test compares this list
  # with every tracked Cargo.lock so new crates fail closed until added here.
  RUST_AUDIT_LOCKFILES: |-
    frontend/rust-crypto/Cargo.lock
    frontend/rust-crypto/fuzz/Cargo.lock
    frontend/tools/stryker-process-host/Cargo.lock
    frontend/wasm-sanitizer/Cargo.lock
    frontend/wasm-sanitizer/fuzz/Cargo.lock
    native/rust_ext/Cargo.lock
    native/rust_ext/fuzz/Cargo.lock

jobs:
  sbom-python:
    name: Python SBOM (anchore/sbom-action)
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # sigstore OIDC token for attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never leave even the read-only workflow token in an untrusted PR
          # checkout where scanner code could read and exfiltrate it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Generate SBOM — Python workspace
        # anchore/sbom-action — Renovate will update digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom-python.spdx.json
          artifact-name: sbom-python.spdx.json

      - name: Attest Python SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: sbom-python.spdx.json
          sbom-path: sbom-python.spdx.json

      - name: Upload Python SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-python
          path: sbom-python.spdx.json
          retention-days: 90

  sbom-go:
    name: Go SBOM (osv-scanner)
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # Required: upload Go vulnerability SARIF to GitHub Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pin the complete patched toolchain. A go.mod minimum such as
          # 1.26.4 can resolve to a runner image that still carries vulnerable
          # standard-library symbols; govulncheck must analyze the same fixed
          # toolchain used by the build jobs.
          go-version: "1.26.10"
          cache: true

      - name: Install osv-scanner
        # The paired version and digest are reviewed together against the
        # official release provenance before Renovate updates this pin.
        shell: bash
        run: |
          set -euo pipefail
          osv_scanner_version="v2.6.0" osv_scanner_sha256="ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108"
          if [[ "${RUNNER_OS:-}" != "Linux" || "${RUNNER_ARCH:-}" != "X64" ]] || \
             [[ "$(/usr/bin/uname -s)" != "Linux" || "$(/usr/bin/uname -m)" != "x86_64" ]]; then
            echo "::error::OSV scanner release asset requires Linux x86-64." >&2
            exit 1
          fi
          if [[ ! "$osv_scanner_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || ! "$osv_scanner_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::OSV scanner version or checksum is malformed." >&2
            exit 1
          fi
          if [[ "${RUNNER_TEMP:-}" != /* || ! -d "$RUNNER_TEMP" || -L "$RUNNER_TEMP" ]]; then
            echo "::error::RUNNER_TEMP must be an absolute physical directory." >&2
            exit 1
          fi
          osv_dir="$(mktemp -d "${RUNNER_TEMP%/}/osv-scanner.XXXXXXXX")"
          cleanup_osv() {
            if [[ -n "${osv_dir:-}" && "$osv_dir" == "${RUNNER_TEMP%/}"/osv-scanner.* && -d "$osv_dir" && ! -L "$osv_dir" ]]; then
              rm -rf -- "$osv_dir"
            fi
          }
          trap cleanup_osv EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          osv_binary="$osv_dir/osv-scanner"
          /usr/bin/curl --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --tlsv1.2 --max-redirs 5 --max-time 120 \
            --max-filesize 67108864 --output "$osv_binary" \
            "https://github.com/google/osv-scanner/releases/download/$osv_scanner_version/osv-scanner_linux_amd64"
          if [[ ! -f "$osv_binary" || -L "$osv_binary" || ! -s "$osv_binary" ]]; then
            echo "::error::OSV scanner asset is missing or is not a regular nonempty file." >&2
            exit 1
          fi
          printf '%s  %s\n' "$osv_scanner_sha256" "$osv_binary" | /usr/bin/sha256sum --check --strict
          chmod 0755 -- "$osv_binary"
          osv_version_output="$("$osv_binary" --version)"
          if [[ "${osv_version_output%%$'\n'*}" != "osv-scanner version: ${osv_scanner_version#v}" ]]; then
            echo "::error::OSV scanner version does not match its release pin." >&2
            exit 1
          fi
          printf 'OSV_SCANNER_BIN=%s\n' "$osv_binary" >> "$GITHUB_ENV"
          trap - EXIT INT TERM

      - name: Scan Go modules for vulnerabilities + generate SBOM
        id: osv_scan
        shell: bash
        run: |
          set -euo pipefail
          manifest_list="$(mktemp "${RUNNER_TEMP%/}/osv-go-manifests.XXXXXXXX")"
          trap 'rm -f -- "$manifest_list"' EXIT
          config_file="$(mktemp "${RUNNER_TEMP%/}/osv-go-config.XXXXXXXX")"
          trap 'rm -f -- "$manifest_list" "$config_file"' EXIT
          git ls-files -z -- ':(glob)services/**/go.mod' > "$manifest_list"
          mapfile -d '' -t manifests < "$manifest_list"
          if ((${#manifests[@]} == 0)); then
            echo "::error::No tracked Go service manifests were discovered." >&2
            exit 1
          fi
          seen_manifests=()
          manifest_args=()
          for manifest in "${manifests[@]}"; do
            [[ -f "$manifest" && ! -L "$manifest" ]] || exit 1
            for prior in "${seen_manifests[@]}"; do
              [[ "$prior" != "$manifest" ]] || exit 1
            done
            seen_manifests+=("$manifest")
            manifest_args+=(--lockfile "$manifest")
          done
          set +e
          # Keep the recursive scan while requiring every tracked Go manifest to
          # be extracted explicitly by the pinned scanner. The empty override
          # prevents adjacent scanner configs from suppressing findings.
          "$OSV_SCANNER_BIN" scan source --recursive --format sarif \
            --config "$config_file" \
            "${manifest_args[@]}" \
            --output go-vuln.sarif \
            ./services/
          scanner_status=$?
          set -e
          echo "scanner_status=$scanner_status" >> "$GITHUB_OUTPUT"

      - name: Upload Go vulnerability SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: go-vuln.sarif
          category: osv-go

      - name: Upload Go SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-go-sarif
          path: go-vuln.sarif
          retention-days: 90

      - name: Validate OSV scanner result
        if: always()
        shell: bash
        env:
          SCANNER_STATUS: ${{ steps.osv_scan.outputs.scanner_status }}
        run: |
          set -euo pipefail
          if [[ ! "$SCANNER_STATUS" =~ ^[0-9]+$ ]]; then
            echo "::error::OSV scanner did not publish a numeric exit status."
            exit 1
          fi
          if [[ "$SCANNER_STATUS" -gt 1 ]]; then
            echo "::error::OSV scanner failed operationally (exit $SCANNER_STATUS)."
            exit 1
          fi
          if ! jq --exit-status \
            '.version == "2.1.0" and
             (.runs | type == "array" and length > 0) and
             all(.runs[]; .tool.driver.name | type == "string" and length > 0) and
             all(.runs[]; .results | type == "array")' \
            go-vuln.sarif >/dev/null; then
            echo "::error::OSV scanner did not produce a structurally valid SARIF report."
            exit 1
          fi

          finding_count="$(jq '[.runs[].results[]] | length' go-vuln.sarif)"
          if [[ "$SCANNER_STATUS" -eq 0 && "$finding_count" -ne 0 ]]; then
            echo "::error::OSV scanner exited 0 but reported $finding_count finding(s)."
            exit 1
          fi
          if [[ "$SCANNER_STATUS" -eq 1 && "$finding_count" -eq 0 ]]; then
            echo "::error::OSV scanner exited 1 without a reportable finding."
            exit 1
          fi
          echo "Validated OSV SARIF with $finding_count module-level finding(s)."


      # OSV v2.6.0 applies GoVersionOverride after matching. Scan an isolated
      # manifest containing the actual builder version, with no ignored findings.
      - name: Gate the pinned Go builder standard library
        shell: bash
        run: |
          set -euo pipefail
          scope_dir="$(mktemp -d "${RUNNER_TEMP%/}/osv-go-stdlib.XXXXXXXX")"
          cleanup() {
            rm -f -- "$scope_dir/manifests" "$scope_dir/go.mod" "$scope_dir/osv-scanner.toml" "$scope_dir/stdlib.json"
            rmdir -- "$scope_dir"
          }
          trap cleanup EXIT

          git ls-files -z -- ':(glob)services/**/go.mod' > "$scope_dir/manifests"
          mapfile -d '' -t manifests < "$scope_dir/manifests"
          if ((${#manifests[@]} == 0)); then
            echo "::error::No tracked Go service manifests were discovered." >&2
            exit 1
          fi
          seen=()
          for manifest in "${manifests[@]}"; do
            [[ -f "$manifest" && ! -L "$manifest" ]] || exit 1
            for prior in "${seen[@]}"; do
              [[ "$prior" != "$manifest" ]] || exit 1
            done
            seen+=("$manifest")
          done

          toolchain="$(GOTOOLCHAIN=local go env GOVERSION)"
          if [[ ! "$toolchain" =~ ^go([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            echo "::error::Go builder toolchain is not an exact patch release." >&2
            exit 1
          fi
          version="${toolchain#go}"
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"

          # Every Docker Go build stage must use the same digest-pinned version.
          for dockerfile in services/{caddy,gateway,ws-hub,file-processor}/Dockerfile; do
            [[ -f "$dockerfile" && ! -L "$dockerfile" ]] || exit 1
            builders=0
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" =~ ^[[:space:]]*FROM[[:space:]]+.*golang: ]]; then
                read -r _ image _ <<< "$line"
                if [[ ! "$image" =~ ^golang:([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})-alpine[0-9.]*@sha256:[0-9a-f]{64}$ ]] ||
                   [[ "${BASH_REMATCH[1]}" != "$version" ]]; then
                  echo "::error::A Go builder is unpinned or differs from the scanner toolchain." >&2
                  exit 1
                fi
                builders=$((builders + 1))
              fi
            done < "$dockerfile"
            if ((builders == 0)); then
              echo "::error::A service Dockerfile has no checked Go builder." >&2
              exit 1
            fi
          done

          # Reject a higher minimum or an explicit toolchain until the actual
          # builder version has been rechecked.
          for manifest in go.mod gen/go/go.mod "${manifests[@]}"; do
            [[ -f "$manifest" && ! -L "$manifest" ]] || exit 1
            directives=0
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" =~ ^[[:space:]]*toolchain[[:space:]] ]]; then
                echo "::error::An explicit Go toolchain directive needs review." >&2
                exit 1
              fi
              if [[ "$line" =~ ^[[:space:]]*go[[:space:]] ]]; then
                if [[ ! "$line" =~ ^[[:space:]]*go[[:space:]]+([0-9]{1,3})\.([0-9]{1,3})(\.([0-9]{1,3}))?([[:space:]]*(//.*)?)?$ ]]; then
                  echo "::error::A Go manifest has an invalid version directive." >&2
                  exit 1
                fi
                module_major="${BASH_REMATCH[1]}" module_minor="${BASH_REMATCH[2]}" module_patch="${BASH_REMATCH[4]:-0}"
                if ((10#$module_major > 10#$major ||
                     (10#$module_major == 10#$major && 10#$module_minor > 10#$minor) ||
                     (10#$module_major == 10#$major && 10#$module_minor == 10#$minor && 10#$module_patch > 10#$patch))); then
                  echo "::error::A Go manifest requires a newer toolchain than the builder." >&2
                  exit 1
                fi
                directives=$((directives + 1))
              fi
            done < "$manifest"
            if ((directives != 1)); then
              echo "::error::A Go manifest must have exactly one version directive." >&2
              exit 1
            fi
          done

          printf 'module example.invalid/osv-stdlib\n\ngo %s\n' "$version" > "$scope_dir/go.mod"
          printf 'ScanGoModVersion = true\n' > "$scope_dir/osv-scanner.toml"
          "$OSV_SCANNER_BIN" scan source --no-call-analysis=go --all-packages --all-vulns \
            --format json --config "$scope_dir/osv-scanner.toml" \
            --lockfile "$scope_dir/go.mod" --output-file "$scope_dir/stdlib.json"

          # A zero exit alone is insufficient: require the exact stdlib
          # inventory and no vulnerability records.
          python3 - "$scope_dir/stdlib.json" "$scope_dir/go.mod" "$version" <<'PY'
          import json
          import pathlib
          import sys

          def reject_duplicates(pairs):
              data = {}
              for key, value in pairs:
                  if key in data:
                      raise ValueError("duplicate JSON key")
                  data[key] = value
              return data

          report_path, manifest_path, version = sys.argv[1:]
          path = pathlib.Path(report_path)
          if path.is_symlink() or not path.is_file() or not 0 < path.stat().st_size <= 4 * 1024 * 1024:
              raise ValueError("missing or oversized stdlib inventory")
          report = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=reject_duplicates)
          results = report["results"]
          if not isinstance(results, list) or len(results) != 1:
              raise ValueError("stdlib inventory must contain one source")
          result = results[0]
          source = result["source"]
          if source.get("type") != "lockfile" or pathlib.Path(source["path"]).resolve() != pathlib.Path(manifest_path).resolve():
              raise ValueError("stdlib inventory source mismatch")
          packages = result["packages"]
          if not isinstance(packages, list) or len(packages) != 1:
              raise ValueError("stdlib inventory must contain one package")
          record = packages[0]
          if record["package"] != {"name": "stdlib", "version": version, "ecosystem": "Go"}:
              raise ValueError("stdlib inventory version or package mismatch")
          if record.get("vulnerabilities", []) != [] or record.get("groups", []) != []:
              raise ValueError("stdlib inventory contains vulnerability findings")
          print("Verified Go builder stdlib inventory: " + version)
          PY


  sbom-rust:
    name: Rust SBOM (cargo-audit)
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # Required: upload Rust audit SARIF to GitHub Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action
        with:
          toolchain: stable

      - name: Install cargo-audit
        # Exact pin plus --locked keeps the scanner and its build graph reproducible.
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo-audit report and validate output
        working-directory: native/rust_ext
        # Findings are reportable here, but operational or malformed output is never accepted.
        run: |
          mkdir -p ../../rust-audit-reports
          audit_count=0
          audit_failed=0
          cargo_audit_fetch_args=()
          while IFS= read -r lockfile; do
            [[ -z "$lockfile" ]] && continue
            audit_count=$((audit_count + 1))
            if [[ ! -f "../../$lockfile" ]]; then
              echo "::error::Configured Rust lockfile is missing: $lockfile"
              audit_failed=1
              continue
            fi

            report_name="${lockfile//\//__}.json"
            set +e
            cargo audit "${cargo_audit_fetch_args[@]}" \
              --file "../../$lockfile" \
              --json > "../../rust-audit-reports/$report_name"
            cargo_audit_status=$?
            set -e
            cargo_audit_fetch_args=(--no-fetch)
            if python3 ../../scripts/check_dependency_audit_report.py cargo \
              --report "../../rust-audit-reports/$report_name" \
              --scanner-status "$cargo_audit_status" \
              --report-only; then
              echo "Validated RustSec report for $lockfile"
            else
              audit_failed=1
            fi
          done <<< "$RUST_AUDIT_LOCKFILES"

          if (( audit_count == 0 )); then
            echo "::error::Rust lockfile audit inventory is empty"
            exit 1
          fi
          exit "$audit_failed"

      - name: Upload Rust audit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-rust-audit
          path: rust-audit-reports/
          retention-days: 90

  # MOD-W14-06 (audit 2026-03-23 Wave 14): Vulnerability severity gate.
  #
  # The report jobs above keep findings available as artifacts. The Rust report
  # path still fails on scanner or schema errors while accepting valid findings
  # for upload. This separate job provides the policy gate: it runs pip-audit
  # (Python), symbol-aware govulncheck (Go), and cargo-audit (Rust). Reachable Go
  # findings are all blocking because the curated Go database does not assign
  # CVSS consistently; module-only findings remain visible in the OSV SARIF.
  #
  # Design rationale:
  #   - Report jobs remain unconditional (always upload artefacts for auditors).
  #   - Gate job is the enforcement point. Python/Rust exceptions require their
  #     versioned policy files and an accepted-risk ADR. Reachable Go findings
  #     are never silently ignored by this workflow.
  vuln-gate:
    # Keep the externally visible main-CI check context stable for run history.
    name: Vulnerability gate (CRITICAL/HIGH, main)
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    # Cold runs compile cargo-audit and execute three ecosystems sequentially.
    timeout-minutes: 30
    needs: [sbom-python, sbom-go, sbom-rust]
    permissions:
      contents: read
    steps:
      - name: Require successful SBOM producers
        shell: bash
        env:
          PYTHON_SBOM_RESULT: ${{ needs.sbom-python.result }}
          GO_SBOM_RESULT: ${{ needs.sbom-go.result }}
          RUST_SBOM_RESULT: ${{ needs.sbom-rust.result }}
        run: |
          set -euo pipefail
          for result in "$PYTHON_SBOM_RESULT" "$GO_SBOM_RESULT" "$RUST_SBOM_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required SBOM producer did not succeed." >&2
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install pinned Python audit tools
        run: uv sync --frozen --group security

      - name: Export Python requirements
        run: |
          uv export --frozen --no-hashes --no-dev --no-emit-workspace > /tmp/requirements.txt
          echo "Exported $(wc -l < /tmp/requirements.txt) requirements"

      - name: Python — known-vulnerability allowlist gate
        # Every complete advisory inventory must be approved or fixed. The
        # batch adapter keeps this gate fail-closed during OSV per-package
        # endpoint outages and emits the same validator input as pip-audit.
        run: |
          set +e
          rm -f /tmp/pip-audit.json
          uv run --frozen --no-sync python scripts/osv_batch_audit.py \
            --requirement /tmp/requirements.txt \
            --output /tmp/pip-audit.json \
            --timeout 30 \
            --attempts 4 \
            --batch-size 100
          pip_audit_status=$?
          set -e
          uv run --frozen --no-sync python scripts/check_dependency_audit_report.py pip \
            --report /tmp/pip-audit.json \
            --scanner-status "$pip_audit_status" \
            --allowlist security/audit-allowlist.yaml

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install govulncheck
        # Pinned official Go vulnerability analyzer; the module sum DB verifies
        # the downloaded source before installation.  # nosec
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Go — govulncheck reachable vulnerability gate
        # Source analysis blocks every vulnerability reachable from authored
        # service code. The separate OSV SARIF job intentionally retains the
        # broader module inventory for review without guessing missing CVSS.
        run: |
          govulncheck \
            ./services/gateway/... \
            ./services/ws-hub/... \
            ./services/file-processor/... \
            ./services/cmd/uni-cli/... \
            ./services/pkg/logging/... \
            ./services/pkg/spiffe/... \
            ./services/pkg/spicedb/...

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Rust — high/critical/unknown vulnerability gate
        working-directory: native/rust_ext
        run: |
          mkdir -p /tmp/rust-audit-reports
          audit_count=0
          audit_failed=0
          cargo_audit_fetch_args=()
          while IFS= read -r lockfile; do
            [[ -z "$lockfile" ]] && continue
            audit_count=$((audit_count + 1))
            if [[ ! -f "../../$lockfile" ]]; then
              echo "::error::Configured Rust lockfile is missing: $lockfile"
              audit_failed=1
              continue
            fi

            report_name="${lockfile//\//__}.json"
            set +e
            cargo audit "${cargo_audit_fetch_args[@]}" \
              --file "../../$lockfile" \
              --json > "/tmp/rust-audit-reports/$report_name"
            cargo_audit_status=$?
            set -e
            cargo_audit_fetch_args=(--no-fetch)
            if python3 ../../scripts/check_dependency_audit_report.py cargo \
              --report "/tmp/rust-audit-reports/$report_name" \
              --scanner-status "$cargo_audit_status"; then
              echo "Passed RustSec gate for $lockfile"
            else
              audit_failed=1
            fi
          done <<< "$RUST_AUDIT_LOCKFILES"

          if (( audit_count == 0 )); then
            echo "::error::Rust lockfile audit inventory is empty"
            exit 1
          fi
          exit "$audit_failed"

  # Pull-request vulnerability gate.  This job intentionally performs the
  # same three ecosystem scans as the trusted-main gate, but has read-only
  # permissions and never uploads SARIF, artifacts, or attestations.  Keeping
  # this as a distinct job preserves the required check name while preventing
  # untrusted PR code from reaching any privileged report producer.
  vuln-gate-pr:
    name: Vulnerability gate (CRITICAL/HIGH)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR gate executes repository-local audit scripts. Do not leave
          # the read-only workflow token in .git/config where untrusted code
          # could read and exfiltrate it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install pinned Python audit tools
        run: uv sync --frozen --group security --no-install-project

      - name: Export Python requirements
        run: |
          uv export --frozen --no-hashes --no-dev --no-emit-workspace > /tmp/requirements.txt
          echo "Exported $(wc -l < /tmp/requirements.txt) requirements"

      - name: Python — known-vulnerability allowlist gate
        run: |
          set +e
          rm -f /tmp/pip-audit.json
          uv run --frozen --no-sync python scripts/osv_batch_audit.py \
            --requirement /tmp/requirements.txt \
            --output /tmp/pip-audit.json \
            --timeout 30 \
            --attempts 4 \
            --batch-size 100
          pip_audit_status=$?
          set -e
          uv run --frozen --no-sync python scripts/check_dependency_audit_report.py pip \
            --report /tmp/pip-audit.json \
            --scanner-status "$pip_audit_status" \
            --allowlist security/audit-allowlist.yaml

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Go — govulncheck reachable vulnerability gate
        run: |
          govulncheck \
            ./services/gateway/... \
            ./services/ws-hub/... \
            ./services/file-processor/... \
            ./services/cmd/uni-cli/... \
            ./services/pkg/logging/... \
            ./services/pkg/spiffe/... \
            ./services/pkg/spicedb/...

      # AUD-483: the Go OSV module inventory also runs on pull requests. It uses
      # the same checksum-pinned scanner and fail-closed SARIF validation as the
      # trusted-main producer, but this read-only job never uploads SARIF, an
      # artifact, or an attestation. Reachable Go findings stay blocked by the
      # govulncheck gate, and module-level findings keep the main-branch policy.
      - name: Install osv-scanner (pull request inventory)
        # The paired version and digest are reviewed together against the
        # official release provenance before Renovate updates this pin.
        shell: bash
        run: |
          set -euo pipefail
          osv_scanner_version="v2.6.0" osv_scanner_sha256="ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108"
          if [[ "${RUNNER_OS:-}" != "Linux" || "${RUNNER_ARCH:-}" != "X64" ]] || \
             [[ "$(/usr/bin/uname -s)" != "Linux" || "$(/usr/bin/uname -m)" != "x86_64" ]]; then
            echo "::error::OSV scanner release asset requires Linux x86-64." >&2
            exit 1
          fi
          if [[ ! "$osv_scanner_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || ! "$osv_scanner_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::OSV scanner version or checksum is malformed." >&2
            exit 1
          fi
          if [[ "${RUNNER_TEMP:-}" != /* || ! -d "$RUNNER_TEMP" || -L "$RUNNER_TEMP" ]]; then
            echo "::error::RUNNER_TEMP must be an absolute physical directory." >&2
            exit 1
          fi
          osv_dir="$(mktemp -d "${RUNNER_TEMP%/}/osv-scanner.XXXXXXXX")"
          cleanup_osv() {
            if [[ -n "${osv_dir:-}" && "$osv_dir" == "${RUNNER_TEMP%/}"/osv-scanner.* && -d "$osv_dir" && ! -L "$osv_dir" ]]; then
              rm -rf -- "$osv_dir"
            fi
          }
          trap cleanup_osv EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          osv_binary="$osv_dir/osv-scanner"
          /usr/bin/curl --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --tlsv1.2 --max-redirs 5 --max-time 120 \
            --max-filesize 67108864 --output "$osv_binary" \
            "https://github.com/google/osv-scanner/releases/download/$osv_scanner_version/osv-scanner_linux_amd64"
          if [[ ! -f "$osv_binary" || -L "$osv_binary" || ! -s "$osv_binary" ]]; then
            echo "::error::OSV scanner asset is missing or is not a regular nonempty file." >&2
            exit 1
          fi
          printf '%s  %s\n' "$osv_scanner_sha256" "$osv_binary" | /usr/bin/sha256sum --check --strict
          chmod 0755 -- "$osv_binary"
          osv_version_output="$("$osv_binary" --version)"
          if [[ "${osv_version_output%%$'\n'*}" != "osv-scanner version: ${osv_scanner_version#v}" ]]; then
            echo "::error::OSV scanner version does not match its release pin." >&2
            exit 1
          fi
          printf 'OSV_SCANNER_BIN=%s\n' "$osv_binary" >> "$GITHUB_ENV"
          trap - EXIT INT TERM

      - name: Scan Go modules for vulnerabilities (pull request inventory)
        id: osv_scan
        shell: bash
        run: |
          set -euo pipefail
          manifest_list="$(mktemp "${RUNNER_TEMP%/}/osv-go-manifests.XXXXXXXX")"
          trap 'rm -f -- "$manifest_list"' EXIT
          config_file="$(mktemp "${RUNNER_TEMP%/}/osv-go-config.XXXXXXXX")"
          trap 'rm -f -- "$manifest_list" "$config_file"' EXIT
          git ls-files -z -- ':(glob)services/**/go.mod' > "$manifest_list"
          mapfile -d '' -t manifests < "$manifest_list"
          if ((${#manifests[@]} == 0)); then
            echo "::error::No tracked Go service manifests were discovered." >&2
            exit 1
          fi
          seen_manifests=()
          manifest_args=()
          for manifest in "${manifests[@]}"; do
            [[ -f "$manifest" && ! -L "$manifest" ]] || exit 1
            for prior in "${seen_manifests[@]}"; do
              [[ "$prior" != "$manifest" ]] || exit 1
            done
            seen_manifests+=("$manifest")
            manifest_args+=(--lockfile "$manifest")
          done
          set +e
          # Keep the recursive scan while requiring every tracked Go manifest to
          # be extracted explicitly by the pinned scanner. The empty override
          # prevents adjacent scanner configs from suppressing findings.
          "$OSV_SCANNER_BIN" scan source --recursive --format sarif \
            --config "$config_file" \
            "${manifest_args[@]}" \
            --output go-vuln.sarif \
            ./services/
          scanner_status=$?
          set -e
          echo "scanner_status=$scanner_status" >> "$GITHUB_OUTPUT"

      - name: Validate OSV scanner result (pull request inventory)
        if: always()
        shell: bash
        env:
          SCANNER_STATUS: ${{ steps.osv_scan.outputs.scanner_status }}
        run: |
          set -euo pipefail
          if [[ ! "$SCANNER_STATUS" =~ ^[0-9]+$ ]]; then
            echo "::error::OSV scanner did not publish a numeric exit status."
            exit 1
          fi
          if [[ "$SCANNER_STATUS" -gt 1 ]]; then
            echo "::error::OSV scanner failed operationally (exit $SCANNER_STATUS)."
            exit 1
          fi
          if ! jq --exit-status \
            '.version == "2.1.0" and
             (.runs | type == "array" and length > 0) and
             all(.runs[]; .tool.driver.name | type == "string" and length > 0) and
             all(.runs[]; .results | type == "array")' \
            go-vuln.sarif >/dev/null; then
            echo "::error::OSV scanner did not produce a structurally valid SARIF report."
            exit 1
          fi

          finding_count="$(jq '[.runs[].results[]] | length' go-vuln.sarif)"
          if [[ "$SCANNER_STATUS" -eq 0 && "$finding_count" -ne 0 ]]; then
            echo "::error::OSV scanner exited 0 but reported $finding_count finding(s)."
            exit 1
          fi
          if [[ "$SCANNER_STATUS" -eq 1 && "$finding_count" -eq 0 ]]; then
            echo "::error::OSV scanner exited 1 without a reportable finding."
            exit 1
          fi
          echo "Validated OSV SARIF with $finding_count module-level finding(s)."


      # OSV v2.6.0 applies GoVersionOverride after matching. Scan an isolated
      # manifest containing the actual builder version, with no ignored findings.
      - name: Gate the pinned Go builder standard library
        shell: bash
        run: |
          set -euo pipefail
          scope_dir="$(mktemp -d "${RUNNER_TEMP%/}/osv-go-stdlib.XXXXXXXX")"
          cleanup() {
            rm -f -- "$scope_dir/manifests" "$scope_dir/go.mod" "$scope_dir/osv-scanner.toml" "$scope_dir/stdlib.json"
            rmdir -- "$scope_dir"
          }
          trap cleanup EXIT

          git ls-files -z -- ':(glob)services/**/go.mod' > "$scope_dir/manifests"
          mapfile -d '' -t manifests < "$scope_dir/manifests"
          if ((${#manifests[@]} == 0)); then
            echo "::error::No tracked Go service manifests were discovered." >&2
            exit 1
          fi
          seen=()
          for manifest in "${manifests[@]}"; do
            [[ -f "$manifest" && ! -L "$manifest" ]] || exit 1
            for prior in "${seen[@]}"; do
              [[ "$prior" != "$manifest" ]] || exit 1
            done
            seen+=("$manifest")
          done

          toolchain="$(GOTOOLCHAIN=local go env GOVERSION)"
          if [[ ! "$toolchain" =~ ^go([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            echo "::error::Go builder toolchain is not an exact patch release." >&2
            exit 1
          fi
          version="${toolchain#go}"
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"

          # Every Docker Go build stage must use the same digest-pinned version.
          for dockerfile in services/{caddy,gateway,ws-hub,file-processor}/Dockerfile; do
            [[ -f "$dockerfile" && ! -L "$dockerfile" ]] || exit 1
            builders=0
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" =~ ^[[:space:]]*FROM[[:space:]]+.*golang: ]]; then
                read -r _ image _ <<< "$line"
                if [[ ! "$image" =~ ^golang:([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})-alpine[0-9.]*@sha256:[0-9a-f]{64}$ ]] ||
                   [[ "${BASH_REMATCH[1]}" != "$version" ]]; then
                  echo "::error::A Go builder is unpinned or differs from the scanner toolchain." >&2
                  exit 1
                fi
                builders=$((builders + 1))
              fi
            done < "$dockerfile"
            if ((builders == 0)); then
              echo "::error::A service Dockerfile has no checked Go builder." >&2
              exit 1
            fi
          done

          # Reject a higher minimum or an explicit toolchain until the actual
          # builder version has been rechecked.
          for manifest in go.mod gen/go/go.mod "${manifests[@]}"; do
            [[ -f "$manifest" && ! -L "$manifest" ]] || exit 1
            directives=0
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ "$line" =~ ^[[:space:]]*toolchain[[:space:]] ]]; then
                echo "::error::An explicit Go toolchain directive needs review." >&2
                exit 1
              fi
              if [[ "$line" =~ ^[[:space:]]*go[[:space:]] ]]; then
                if [[ ! "$line" =~ ^[[:space:]]*go[[:space:]]+([0-9]{1,3})\.([0-9]{1,3})(\.([0-9]{1,3}))?([[:space:]]*(//.*)?)?$ ]]; then
                  echo "::error::A Go manifest has an invalid version directive." >&2
                  exit 1
                fi
                module_major="${BASH_REMATCH[1]}" module_minor="${BASH_REMATCH[2]}" module_patch="${BASH_REMATCH[4]:-0}"
                if ((10#$module_major > 10#$major ||
                     (10#$module_major == 10#$major && 10#$module_minor > 10#$minor) ||
                     (10#$module_major == 10#$major && 10#$module_minor == 10#$minor && 10#$module_patch > 10#$patch))); then
                  echo "::error::A Go manifest requires a newer toolchain than the builder." >&2
                  exit 1
                fi
                directives=$((directives + 1))
              fi
            done < "$manifest"
            if ((directives != 1)); then
              echo "::error::A Go manifest must have exactly one version directive." >&2
              exit 1
            fi
          done

          printf 'module example.invalid/osv-stdlib\n\ngo %s\n' "$version" > "$scope_dir/go.mod"
          printf 'ScanGoModVersion = true\n' > "$scope_dir/osv-scanner.toml"
          "$OSV_SCANNER_BIN" scan source --no-call-analysis=go --all-packages --all-vulns \
            --format json --config "$scope_dir/osv-scanner.toml" \
            --lockfile "$scope_dir/go.mod" --output-file "$scope_dir/stdlib.json"

          # A zero exit alone is insufficient: require the exact stdlib
          # inventory and no vulnerability records.
          python3 - "$scope_dir/stdlib.json" "$scope_dir/go.mod" "$version" <<'PY'
          import json
          import pathlib
          import sys

          def reject_duplicates(pairs):
              data = {}
              for key, value in pairs:
                  if key in data:
                      raise ValueError("duplicate JSON key")
                  data[key] = value
              return data

          report_path, manifest_path, version = sys.argv[1:]
          path = pathlib.Path(report_path)
          if path.is_symlink() or not path.is_file() or not 0 < path.stat().st_size <= 4 * 1024 * 1024:
              raise ValueError("missing or oversized stdlib inventory")
          report = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=reject_duplicates)
          results = report["results"]
          if not isinstance(results, list) or len(results) != 1:
              raise ValueError("stdlib inventory must contain one source")
          result = results[0]
          source = result["source"]
          if source.get("type") != "lockfile" or pathlib.Path(source["path"]).resolve() != pathlib.Path(manifest_path).resolve():
              raise ValueError("stdlib inventory source mismatch")
          packages = result["packages"]
          if not isinstance(packages, list) or len(packages) != 1:
              raise ValueError("stdlib inventory must contain one package")
          record = packages[0]
          if record["package"] != {"name": "stdlib", "version": version, "ecosystem": "Go"}:
              raise ValueError("stdlib inventory version or package mismatch")
          if record.get("vulnerabilities", []) != [] or record.get("groups", []) != []:
              raise ValueError("stdlib inventory contains vulnerability findings")
          print("Verified Go builder stdlib inventory: " + version)
          PY


      # AUD-483: every pull-request OSV Go result must be an exact, unexpired
      # owner disposition (GHSA alias, manifest, module, version). Stdlib, GO-only
      # and unrecorded findings fail the job; see
      # scripts/quality/validate_osv_go_results.py.
      - name: Gate OSV Go results by exact disposition (pull request)
        if: always()
        shell: bash
        env:
          SCANNER_STATUS: ${{ steps.osv_scan.outputs.scanner_status }}
        run: |
          set -euo pipefail
          python3 -m scripts.quality.validate_osv_go_results             --sarif go-vuln.sarif             --scanner-status "$SCANNER_STATUS"

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Rust — high/critical/unknown vulnerability gate
        working-directory: native/rust_ext
        run: |
          mkdir -p /tmp/rust-audit-reports
          audit_count=0
          audit_failed=0
          cargo_audit_fetch_args=()
          while IFS= read -r lockfile; do
            [[ -z "$lockfile" ]] && continue
            audit_count=$((audit_count + 1))
            if [[ ! -f "../../$lockfile" ]]; then
              echo "::error::Configured Rust lockfile is missing: $lockfile"
              audit_failed=1
              continue
            fi

            report_name="${lockfile//\//__}.json"
            set +e
            cargo audit "${cargo_audit_fetch_args[@]}" \
              --file "../../$lockfile" \
              --json > "/tmp/rust-audit-reports/$report_name"
            cargo_audit_status=$?
            set -e
            cargo_audit_fetch_args=(--no-fetch)
            if python3 ../../scripts/check_dependency_audit_report.py cargo \
              --report "/tmp/rust-audit-reports/$report_name" \
              --scanner-status "$cargo_audit_status"; then
              echo "Passed RustSec gate for $lockfile"
            else
              audit_failed=1
            fi
          done <<< "$RUST_AUDIT_LOCKFILES"

          if (( audit_count == 0 )); then
            echo "::error::Rust lockfile audit inventory is empty"
            exit 1
          fi
          exit "$audit_failed"
