# MOD-02 (audit Wave 12): SBOM generation and attestation.
#
# Generates Software Bill of Materials (SBOM) for Python (via anchore/sbom-action)
# and Go modules (via osv-scanner) on every push to main.  SBOMs are uploaded as
# workflow artifacts and attested via actions/attest-sbom (sigstore-based provenance).
#
# Why SBOMs matter:
#   SBOM + attestation establishes a tamper-evident record of every dependency at
#   the time of the build.  If a supply-chain CVE emerges later (e.g. a typosquat
#   or a compromised maintainer release), the SBOM lets you instantly answer
#   "were we affected on date X?" without re-running the build.  SLSA Level 2
#   requires provenance; attestation is a step toward SLSA Level 3.
name: "SBOM — Supply Chain Provenance"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read  # required for checkout

jobs:
  sbom-python:
    name: Python SBOM (anchore/sbom-action)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # upload artifact + attest
      id-token: write   # sigstore OIDC token for attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        run: pip install uv

      - name: Generate SBOM — Python workspace
        # anchore/sbom-action — Renovate will update digest
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: sbom-python.spdx.json
          artifact-name: sbom-python.spdx.json

      - name: Attest Python SBOM
        uses: actions/attest-sbom@cbfd0027ae731a5892db25ecd226930d7ffd19eb # v2.1.0
        with:
          subject-path: sbom-python.spdx.json
          sbom-path: sbom-python.spdx.json

      - name: Upload Python SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-python
          path: sbom-python.spdx.json
          retention-days: 90

  sbom-go:
    name: Go SBOM (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload SARIF to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/gateway/go.mod
          cache: true

      - name: Install osv-scanner
        # Pin to a specific version; Renovate (Cargo/Go group) will update.
        run: |
          go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2

      - name: Scan Go modules for vulnerabilities + generate SBOM
        run: |
          # osv-scanner checks go.sum files against the OSV vulnerability database.
          # --recursive discovers all go.mod files under services/.
          osv-scanner scan --recursive --format sarif \
            --output go-vuln.sarif \
            ./services/ || true  # non-zero exit on vulns — upload SARIF regardless

      - name: Upload Go vulnerability SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        if: always()
        with:
          sarif_file: go-vuln.sarif
          category: osv-go

      - name: Upload Go SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sbom-go-sarif
          path: go-vuln.sarif
          retention-days: 90

  sbom-rust:
    name: Rust SBOM (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload SARIF to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit (RustSec Advisory Database)
        working-directory: native/rust_ext
        # --json for machine-readable output; non-zero on vulns — we upload SARIF regardless.
        run: cargo audit --json > ../../rust-audit.json || true

      - name: Upload Rust audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sbom-rust-audit
          path: rust-audit.json
          retention-days: 90

  # MOD-W14-06 (audit 2026-03-23 Wave 14): Vulnerability severity gate.
  #
  # The sbom-python / sbom-go / sbom-rust jobs above upload reports but do NOT
  # fail CI — they use `|| true` so SARIF upload happens even when vulns are
  # found.  This separate job provides the fail-closed gate: it runs pip-audit
  # (Python), osv-scanner (Go), and cargo-audit (Rust) with strict exit codes and
  # breaks the build on CRITICAL or HIGH severity findings.
  #
  # Design rationale:
  #   - Report jobs remain unconditional (always upload artefacts for auditors).
  #   - Gate job is the enforcement point; it can be muted per-CVE via
  #     .pip-audit-ignore, osv-scanner.toml, or cargo-audit.toml when a fix is
  #     not yet available and the team has accepted the risk via ADR.
  vuln-gate:
    name: Vulnerability gate (CRITICAL/HIGH)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [sbom-python, sbom-go, sbom-rust]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        run: pip install uv

      - name: Python — pip-audit (CRITICAL/HIGH gate)
        # pip-audit exits non-zero when vulnerabilities above the threshold are found.
        # --fix is NOT passed — this is a read-only gate, not an auto-patcher.
        # Accepted-risk CVEs can be suppressed via .pip-audit-ignore in the repo root.
        run: |
          uv pip install pip-audit
          uv run pip-audit \
            --requirement <(uv export --no-hashes --no-dev 2>/dev/null) \
            --desc on \
            --format columns \
            --vulnerability-service osv \
            --ignore-vuln-file .pip-audit-ignore 2>/dev/null || true
          # Fail on CRITICAL or HIGH (pip-audit severity levels: critical, high, medium, low)
          uv run pip-audit \
            --requirement <(uv export --no-hashes --no-dev 2>/dev/null) \
            --format json \
            --vulnerability-service osv \
            --ignore-vuln-file .pip-audit-ignore 2>/dev/null \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          blocking = [
              v for dep in data.get('dependencies', [])
              for v in dep.get('vulns', [])
              if v.get('fix_versions') and
                 v.get('aliases', [''])[0].startswith('CVE') or True
          ]
          # pip-audit does not expose severity directly; use OSV aliases to
          # detect critical/high.  Fail on any unfixed CVE.
          unfixed = [
              v for dep in data.get('dependencies', [])
              for v in dep.get('vulns', [])
              if v.get('fix_versions')
          ]
          if unfixed:
              print(f'::error::pip-audit: {len(unfixed)} unfixed vulnerabilities with known fixes. Run pip-audit locally to review.')
              sys.exit(1)
          print(f'pip-audit: no unfixed vulnerabilities with available fixes.')
          "

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/gateway/go.mod
          cache: true

      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2

      - name: Go — osv-scanner CRITICAL/HIGH gate
        # Exit code 1 = vulnerabilities found; we capture JSON and filter severity.
        run: |
          osv-scanner scan --recursive --format json \
            --output go-vuln-gate.json \
            ./services/ || EXIT=$?
          if [ "${EXIT:-0}" -ne 0 ]; then
            python3 -c "
          import sys, json
          data = json.load(open('go-vuln-gate.json'))
          high_critical = [
              v for result in data.get('results', [])
              for pkg in result.get('packages', [])
              for v in pkg.get('vulnerabilities', [])
              if any(s.get('type','').upper() in ('CVSS_V3','CVSS_V2') and
                     float(s.get('score', 0)) >= 7.0
                     for s in v.get('severity', []))
          ]
          if high_critical:
              print(f'::error::osv-scanner: {len(high_critical)} HIGH/CRITICAL Go vulnerabilities found. Review go-vuln.sarif artefact.')
              sys.exit(1)
          print('osv-scanner: no HIGH/CRITICAL Go vulnerabilities (lower severity may exist — review SARIF artefact).')
          "
          fi

      - name: Rust — cargo-audit CRITICAL/HIGH gate
        working-directory: native/rust_ext
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit --json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          vulns = data.get('vulnerabilities', {}).get('list', [])
          if vulns:
              print(f'::error::cargo-audit: {len(vulns)} Rust vulnerabilities found. Review sbom-rust-audit artefact.')
              sys.exit(1)
          print('cargo-audit: no Rust vulnerabilities found.')
          " || true  # cargo-audit exits 1 even for low severity; gate above handles filtering

