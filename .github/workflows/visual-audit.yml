# Wave 139 SW1 — Linux on-demand visual a11y audit (axe-core via wave138-visual-audit.mjs).
#
# ## Why this exists
#
# Wave 138 SW3 created `frontend/scripts/wave138-visual-audit.mjs` (~527 LoC),
# the first per-page visual a11y audit infra feasible since the SSR migration
# arc started in W125. SW3+SW4 hit the W137 SW7 Windows heavy-DOM wall family:
# AxeBuilder.analyze() injects axe-core via page.evaluate, which hangs on
# /dashboard's heavy SSR-rendered DOM in Chrome on Windows headless mode.
#
# Linux runners do NOT have this wall — same script, different OS = works.
# This workflow is the Linux execution path that closes W138 §Honesty #4.
#
# ## Triggers
#
# `workflow_dispatch` only — manual run via Actions UI or `gh workflow run`.
# Triggering on PR/push is intentionally NOT done. Visual a11y audits are
# investigative, not blocking gates. `ci.yml`'s e2e + LHCI matrix already
# covers blocking gates; this is for on-demand deep-dives + violation
# triage during W139 SW3+SW4 + future per-page polish arcs.
#
# ## Architecture (no Docker compose — uses runner-host services pattern)
#
# wave138-visual-audit.mjs requires a SINGLE ORIGIN that serves both
# backend (/.well-known/jwks.json, /api/v1/auth/*) and frontend (/dashboard
# SSR + others). In dev compose, Caddy is the unified ingress. Reproducing
# that on a Linux runner without docker-compose-ing the full stack:
#
#   - backend: `uv run uvicorn` on :8000 (mirrors reusable-e2e-tests.yml)
#   - frontend Node SSR: `npm run start` on :3000 (W131 SW1 server-prod.mjs)
#   - Caddy ingress: `docker run caddy --network host` on :80 with minimal
#     Caddyfile that routes /api/v1/* + /.well-known/* → :8000, default → :3000
#   - postgres + redis: GitHub Actions `services:` (mirrors reusable-e2e-tests.yml)
#
# Trade-off vs full Docker compose: simpler, faster, fewer secrets needed,
# matches the existing reusable-e2e-tests pattern. Skips ws-hub, file-processor,
# Temporal, MinIO, Elasticsearch — none needed for the visual audit on the
# 8 SSR routes (all read-only renders).
#
# ## RS256 keypair
#
# Mirrors start-docker.ps1 New-JwtRs256Key (.NET 8 PowerShell-only). Linux
# uses openssl genpkey + standard PKCS#8 PEM. Same key shape; backend reads
# via JWT_PRIVATE_KEY_PATH env, JWKS endpoint serves public key derivation.
#
# ## Test user
#
# Visual audit script logs in as test@university.dev / TestPass@2024x (per
# CLAUDE.md test user convention). Workflow registers this user via
# /api/v1/auth/register POST (idempotent — 409 OK if exists).
#
# ## Carries forward
#
# When file-processor Path (a-rebind only) lands in W139 SW2, this workflow
# will need to add file-processor + Temporal services if visual audit ever
# needs to test image-resize-dependent flows. Out of scope for W139 visual
# audit (read-only routes don't trigger file-processor).
name: Visual Audit (Linux On-Demand)

on:
  workflow_dispatch: #checkov:skip=CKV_GHA_7:manual input intentionally selects the visual-audit route subset
    inputs:
      routes:
        description: "Comma-separated route subset (empty = full 8-SSR-route sweep). Example: `/dashboard` or `dashboard,events`."
        required: false
        type: string
        default: ""

permissions: read-all

concurrency:
  group: visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    name: Axe a11y audit on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Backend env (mirrors reusable-e2e-tests.yml + adds RS256)
      SECRET_KEY: "dummy_secret_key_for_visual_audit_ci_at_least_32_chars"  # pragma: allowlist secret
      ENVIRONMENT: testing
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test_visual_audit"  # pragma: allowlist secret
      OTEL_SDK_DISABLED: "true"
      ALGORITHM: "RS256"
      JWT_PRIVATE_KEY_PATH: ".secrets/jwt_rs256.pem"
      # W139 SW3 iter2: explicit NATS_URL pointing at the localhost NATS
      # service (no auth — matches backend default nats_url config). Without
      # this, backend's NatsTaskBroker hangs at lifespan.
      NATS_URL: "nats://127.0.0.1:4222"
      # W140 SW4 iter6: explicit Redis URLs. Login flow goes through
      # `redis_session.create_session()` → `_get_shared_client(redis_url)` →
      # `Redis.from_url(url, ...)`. The `redis_url` is sourced from
      # `settings.rate_limit_storage_uri` which DEFAULTS to "memory://" if
      # the env var is absent (per app/core/config/mixins/rate_limit_settings.py:45).
      # "memory://" is not a valid Redis URL scheme, so Redis.from_url raises
      # ValueError → HTTP 500 on /api/v1/auth/login/json. Pre-W140 this was
      # masked because the visual audit script never reached the login step
      # (CSRF dance was missing + earlier blockers fired). After SW4 iter4
      # unblocked CSRF, login now reaches Redis URL parsing and 500s.
      CACHE_REDIS_URL: "redis://127.0.0.1:6379/0"
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: "redis://127.0.0.1:6379/1"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test  # pragma: allowlist secret
          POSTGRES_DB: test_visual_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_visual_audit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # W139 SW3 iter2: NATS service added after iter1 confirmed backend
      # lifespan hangs on `nats.aio.client._connect_to_server` with
      # `ConnectionRefusedError: [Errno 111] Connection refused` (NATS
      # server not running). Backend's `NatsTaskBroker` (app/core/nats_broker.py)
      # has NO env-flag to skip; lifespan unconditionally awaits the broker
      # via Dishka container. CI workflow must provide NATS for backend to
      # converge. Default port 4222, no auth (matches backend default
      # nats_url "nats://127.0.0.1:4222").
      nats:
        image: nats:2.10.25-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget -q -O - http://localhost:8222/varz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies
        run: uv sync --frozen

      # Wave 141 polish-v2 (post-wave-close): switched from
      # taiki-e/install-action@v2.77.5 (which hardcodes drager/wasm-pack
      # releases URL → 404 as of 2026-05-11; rustwasm/wasm-pack is the
      # canonical repo, drager redirects 301 but GitHub asset URLs don't
      # auto-follow) to the official wasm-pack curl installer from
      # rustwasm.github.io. Reliable + reproducible across CI runs.
      # P0-01 (audit 2026-03-06) supply-chain note: curl installer comes
      # from rustwasm-canonical infrastructure; equivalent trust level to
      # the action since both ultimately fetch from rustwasm/wasm-pack
      # GitHub release assets.
      - name: Install wasm-pack
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build WASM modules
        # W139 (z) #5: WASM binaryen download flake — wasm-pack downloads
        # binaryen on first invocation from GitHub releases CDN. Transient
        # 404/timeout failures are observed (rate-limiting or release flake).
        # W140 SW4 mitigation: retry up to 3 times with 10s backoff. Each
        # build is idempotent (binaryen cache reused on retry).
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            if wasm-pack build rust-crypto --target web && \
               wasm-pack build wasm-sanitizer --target web; then
              echo "OK: WASM modules built (attempt $attempt)"
              exit 0
            fi
            echo "WASM build failed on attempt $attempt; retrying after 10s..."
            sleep 10
          done
          echo "::error::WASM build failed after 3 attempts"
          exit 1

      - name: Generate RS256 keypair
        # Mirrors start-docker.ps1 New-JwtRs256Key (W137 SW1):
        # RSA-2048 PKCS#8 PEM at .secrets/jwt_rs256.pem. Backend reads via
        # JWT_PRIVATE_KEY_PATH; /.well-known/jwks.json endpoint derives
        # public key from this private key + serves it as JWK.
        run: |
          mkdir -p .secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out .secrets/jwt_rs256.pem
          ls -la .secrets/jwt_rs256.pem
          echo "OK: RS256 keypair generated"

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Build frontend (E2E reduced-chrome mode, NOT VITE_LHCI bypass)
        # Visual audit needs the REAL authed flow (NOT VITE_LHCI mock-user bypass).
        # W141 SW1 adds VITE_E2E_MODE=1 to enable the W116 SW1 reduced MainLayout
        # pattern (frontend/src/components/layout/MainLayout.tsx:30-75): Navbar /
        # Footer / BackToTop / MobileBottomNav replaced with landmark-only stubs
        # (`<nav data-e2e-stub="main-nav" />` etc.) under E2E flag. This shrinks
        # the heavy authed-route DOM enough for axe-core's analyze() to complete
        # within the 60s timeout (W140 NEW §Honesty caveat #5 closure).
        #
        # Why this is SAFE for the auth-cookie SSR chain: per W141 Phase 1
        # Explore Agent 1, Navbar is CLIENT-SIDE hydration only — useNavbarLogic
        # reads from useAuthStore Zustand, while SSR auth flows from HTTP cookie
        # headers NOT Navbar fetching /users/me. Stripping Navbar in the E2E
        # build does NOT affect W126-W127 cookie-driven SSR rendering of route
        # content (/dashboard, /events, etc.).
        #
        # Trade-off: less coverage of Navbar/Footer in this audit. Those
        # components are covered by tests/e2e/a11y-public.spec.ts on /login
        # (compact route, no chrome) + Wave 142+ can add dedicated chrome
        # component a11y tests if needed.
        #
        # Tree-shake invariants verified post-build:
        # 1. VITE_LHCI mock-user bypass STAYS tree-shaken (zero `lhci-mock-user`
        #    in dist — auth bypass not active) — different flag, independent state
        # 2. VITE_E2E_MODE branch IS bundled (`data-e2e-stub` strings present in
        #    dist — flag took effect; new W141 SW1 check)
        working-directory: frontend
        env:
          VITE_BACKEND_ORIGIN: http://localhost
          VITE_E2E_MODE: "1"
        run: |
          npm run build
          if find dist/client/assets -name "*.js" -exec grep -l "lhci-mock-user" {} + 2>/dev/null | grep -q .; then
            echo "::error::VITE_LHCI tree-shake invariant violated — E2E build contains LHCI mock-user reference"
            exit 1
          fi
          echo "OK: VITE_LHCI bypass tree-shaken cleanly"
          if ! find dist/client/assets -name "*.js" -exec grep -l "data-e2e-stub" {} + 2>/dev/null | grep -q .; then
            echo "::error::VITE_E2E_MODE flag did NOT take effect — dist lacks data-e2e-stub markers (MainLayout reduced-chrome branch not active)"
            exit 1
          fi
          echo "OK: VITE_E2E_MODE=1 took effect (data-e2e-stub markers present in dist)"

      - name: Install Playwright bundled chromium
        # Wave 138 SW3 explicitly uses bundled Chromium (NOT real Chrome via
        # `channel: "chrome"`). AxeBuilder injects axe-core via page.evaluate;
        # real Chrome path hits the Windows heavy-DOM eval wall family. Bundled
        # Chromium matches a11y-public.spec.ts working pattern (W113 SW1).
        # On Linux this distinction is moot for the wall (Linux doesn't have
        # the wall) but we keep bundled chromium for consistency with W138 SW3.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        # uvicorn on 127.0.0.1:8000 with --log-level debug + redirect to log file
        # so the next "Wait for backend health" step can tail it on timeout.
        # W139 SW3 first-run discovery: backend lifespan calls
        # _startup_background_workers which connects to NATS/ES/SpiceDB (services
        # NOT running on CI Linux runner — only postgres + redis from
        # `services:` block). Without log capture, lifespan hang produces NO
        # diagnostic output. Adding `> /tmp/backend.log 2>&1` surfaces the
        # actual hang point.
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level debug > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend health
        # 180s timeout (90 × 2s) — extended from 60s in W139 SW3 first-run iter.
        # Backend startup on CI Linux includes lifespan with potential service
        # discovery delays (NATS/SpiceDB/ES connect attempts may have long
        # default timeouts before erroring + continuing). On timeout, tail
        # backend log for diagnostic visibility.
        #
        # W140 SW4 path fix: `/health` returns 404 (no such route exists).
        # The actual routes are /health/live, /healthz, /health/ready
        # (+ legacy /ready). For CI readiness polling we use /health/ready
        # which is the lean Readiness Probe (just DB connectivity + not
        # shutting down). Matches the backend Dockerfile HEALTHCHECK pattern
        # in W140 SW3-fix (docker-compose.full.yml override). Pre-W140
        # `/health` 404 silently turned this loop into a 180s wait → timeout,
        # masked by the parallel NATS hang issue (W139 (z) #4).
        run: |
          for i in {1..90}; do
            if curl -sf http://127.0.0.1:8000/health/ready > /dev/null; then
              echo "OK: backend ready after $i attempts (~$(( i * 2 ))s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend failed to start within 180s"
          echo "---backend-log-tail---"
          tail -200 /tmp/backend.log 2>&1 || echo "(no /tmp/backend.log file)"
          echo "---ps-aux-uvicorn---"
          ps aux | grep -i uvicorn 2>&1 | head -5 || echo "(no uvicorn process)"
          exit 1

      - name: Verify JWKS endpoint
        # JWKS endpoint MUST serve at least 1 RS256 key. wave138-visual-audit.mjs
        # checks both /api/v1/.well-known/jwks.json and /.well-known/jwks.json
        # paths (W137 SW4 pattern). Linux backend serves at the same paths
        # as Caddy-fronted dev compose.
        run: |
          if ! curl -sf http://127.0.0.1:8000/.well-known/jwks.json | python -c "import sys, json; d = json.load(sys.stdin); keys = d.get('keys', []); assert len(keys) > 0, 'JWKS empty'; print(f'OK: JWKS has {len(keys)} key(s)')"; then
            echo "::error::JWKS endpoint not serving keys (RS256 backend setup broken)"
            exit 1
          fi

      - name: Seed test user
        # Idempotent registration: 409 means user exists from prior run reuse.
        # The visual audit script logs in as test@university.dev / TestPass@2024x
        # — these are the CLAUDE.md-documented test credentials.
        #
        # W140 SW4 CSRF dance: CSRFMiddleware (app/core/csrf.py + middleware/setup.py:47-60)
        # is enabled in `testing` env too and requires both csrf_token cookie
        # AND X-CSRF-Token header on POST. /api/v1/auth/register is NOT in
        # exempt_prefixes. Pre-W140 the workflow's plain curl POST got 403
        # (z) discovery surfaced after backend health was fixed.
        # Mitigation: GET /api/v1/auth/csrf-cookie to set the cookie, extract
        # the token, then POST register with both cookie + matching header.
        run: |
          # Step 1: Get CSRF cookie. /api/v1/auth/csrf-cookie sets the cookie.
          curl -s -c /tmp/cookies.txt http://127.0.0.1:8000/api/v1/auth/csrf-cookie > /dev/null
          # shellcheck disable=SC2016  # $7 is an awk positional field ref, not a shell var
          CSRF=$(awk '/csrf_token/ {print $7}' /tmp/cookies.txt)
          if [ -z "$CSRF" ]; then
            echo "::error::Failed to obtain CSRF token from /api/v1/auth/csrf-cookie"
            cat /tmp/cookies.txt
            exit 1
          fi
          echo "OK: obtained CSRF token (len=${#CSRF})"

          # Step 2: POST /register with the cookie + header.
          STATUS=$(curl -s -o /tmp/register.json -w "%{http_code}" -X POST http://127.0.0.1:8000/api/v1/auth/register \
            -b /tmp/cookies.txt \
            -H "Content-Type: application/json" \
            -H "X-CSRF-Token: $CSRF" \
            -d '{"email": "test@university.dev", "password": "TestPass@2024x", "full_name": "Visual Audit User"}' || echo "ERROR")
          echo "Register response: HTTP $STATUS"
          cat /tmp/register.json || true
          echo ""
          # 200/201 = created; 409 = exists; anything else fails the workflow
          case "$STATUS" in
            200|201) echo "OK: test user created" ;;
            409) echo "OK: test user already exists (idempotent)" ;;
            *) echo "::error::Test user registration failed: HTTP $STATUS"; exit 1 ;;
          esac

      - name: Start frontend Node SSR
        # W131 SW1 server-prod.mjs: bare Node SSR on :3000 (NOT Caddy ingress).
        # /healthz fast-path returns <10ms (W131 SW2). VITE_BACKEND_ORIGIN baked
        # at build time = http://localhost (matches Caddy ingress below).
        working-directory: frontend
        env:
          NODE_ENV: production
          PORT: "3000"
          HOST: "0.0.0.0"
        run: |
          npm run start &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend Node SSR health
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3000/healthz > /dev/null; then
              echo "OK: frontend Node SSR ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "::error::Frontend Node SSR failed to start within 60s"
          exit 1

      - name: Start Caddy ingress
        # Caddy on :80 (host network) routes:
        #   /api/v1/*           → backend :8000
        #   /.well-known/*      → backend :8000
        #   default (frontend)  → Node SSR :3000
        # Mirrors infrastructure/Caddyfile dev pattern minus TLS (HTTP only on CI).
        # docker run with `--network host` so caddy can reach 127.0.0.1:8000 +
        # 127.0.0.1:3000 directly — simpler than mapping individual ports.
        run: |
          cat > /tmp/Caddyfile <<'EOF'
          {
            auto_https off
            admin off
          }
          :80 {
            handle /api/v1/* {
              reverse_proxy 127.0.0.1:8000
            }
            handle /.well-known/* {
              reverse_proxy 127.0.0.1:8000
            }
            handle {
              reverse_proxy 127.0.0.1:3000
            }
          }
          EOF
          docker run -d --name caddy --network host -v /tmp/Caddyfile:/etc/caddy/Caddyfile caddy:2.11.2-alpine
          # Wait for Caddy proxy chain
          for i in {1..15}; do
            if curl -sf http://localhost/healthz > /dev/null && curl -sf http://localhost/.well-known/jwks.json > /dev/null; then
              echo "OK: Caddy ingress reachable + proxying correctly"
              exit 0
            fi
            echo "Waiting for Caddy proxy... ($i/15)"
            sleep 2
          done
          echo "::error::Caddy proxy chain not reachable"
          docker logs caddy || true
          exit 1

      - name: Run visual audit script
        # ORIGIN=http://localhost — Caddy on :80 fronts backend + frontend Node SSR.
        # ROUTES env from workflow_dispatch input (empty = full sweep).
        # `continue-on-error: true` so artifact upload always runs (script exit
        # codes 1-5 indicate violations or setup issues; we want the sidecar JSON).
        working-directory: frontend
        env:
          ORIGIN: http://localhost
          ROUTES: ${{ inputs.routes }}
          TEST_EMAIL: test@university.dev
          TEST_PASSWORD: TestPass@2024x  # pragma: allowlist secret
        run: node ./scripts/wave138-visual-audit.mjs
        continue-on-error: true

      - name: Backend log diagnostic dump
        # W140 SW4 iter5 diagnostic: visual audit script's login step may
        # return HTTP 500 (or other server-side errors) that don't surface
        # backend-side via the script's `loginResp.text()` slice. Tail the
        # last 300 lines of /tmp/backend.log unconditionally after the
        # visual audit run for triage. `always()` so this runs even if a
        # prior step failed.
        if: always()
        run: |
          echo "---backend-log-tail---"
          tail -300 /tmp/backend.log 2>&1 || echo "(no /tmp/backend.log file)"

      - name: Print summary table
        # Reads .screenshots/wave138-visual-audit/*.json sidecar files + emits
        # markdown to $GITHUB_STEP_SUMMARY for at-a-glance review without
        # artifact download (mirrors lhci-linux.yml summary pattern).
        if: always()
        working-directory: frontend
        run: |
          # shellcheck disable=SC2016  # ${...} are JS template literals, not shell vars
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = ".screenshots/wave138-visual-audit";
            if (!fs.existsSync(dir)) {
              console.log("No sidecar JSONs to summarize (script may have failed before producing reports)");
              process.exit(0);
            }
            const files = fs.readdirSync(dir).filter((f) => f.endsWith(".json"));
            if (files.length === 0) {
              console.log("No JSON sidecars found");
              process.exit(0);
            }
            const summary = process.env.GITHUB_STEP_SUMMARY;
            const lines = [];
            lines.push("## Visual Audit Results (Linux On-Demand)");
            lines.push("");
            lines.push("| Route | HTTP | Auth | Hydr err | Console err | Axe critical/serious | Net req |");
            lines.push("|---|---|---|---|---|---|---|");
            for (const f of files.sort()) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
                const route = r.route ?? f.replace(/\.json$/, "");
                const http = r.httpStatus ?? "-";
                const authed = r.authed === false ? "NO" : "AUTHED";
                const hyd = r.hydrationErrorCount ?? 0;
                const cons = (r.consoleMessages ?? []).filter((m) => m.type === "error" || m.type === "pageerror").length;
                const axe = r.axeViolationCount ?? (r.axeViolations ?? []).length;
                const net = (r.networkRequests ?? []).length;
                lines.push(`| ${route} | ${http} | ${authed} | ${hyd} | ${cons} | ${axe} | ${net} |`);
              } catch (e) {
                lines.push(`| (${f}) | - | - | - | - | parse-error | - |`);
              }
            }
            const out = lines.join("\n");
            console.log(out);
            if (summary) {
              fs.appendFileSync(summary, out + "\n");
            }
          '

      - name: Terminate background processes
        if: always()
        run: |
          if [ -n "$BACKEND_PID" ]; then kill "$BACKEND_PID" 2>/dev/null || true; fi
          if [ -n "$FRONTEND_PID" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
          docker rm -f caddy 2>/dev/null || true

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-audit-reports
          path: frontend/.screenshots/wave138-visual-audit
          retention-days: 14
          if-no-files-found: warn
