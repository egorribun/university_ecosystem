name: "SonarCloud Analysis"

on:
  push:
    # Sonar receives a token and therefore runs only from protected main.
    # Pull-request analysis is intentionally omitted: workflow and source code
    # in a same-repository PR are contributor-controlled and must not receive
    # credentials on a hosted runner.
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Advisory external analysis: SonarCloud is intentionally not a protected
    # branch status context. The main-only trigger keeps the token off
    # contributor-controlled pull-request code.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: SonarScan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        # Keep token/service outages isolated from required repository-owned gates.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
