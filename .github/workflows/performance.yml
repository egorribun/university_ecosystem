name: Performance Tests (k6)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  k6_test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install aiosqlite

      - name: Run migrations
        run: |
          uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./dev.db
          SECRET_KEY: development-secret-key

      - name: Start backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
        env:
          DATABASE_URL: sqlite+aiosqlite:///./dev.db
          SECRET_KEY: development-secret-key
          ENVIRONMENT: testing
          RATE_LIMIT_ENABLED: "false"

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/ready; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 1
          done
          echo "Backend failed to start"
          exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          curl https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run k6 load test
        run: k6 run tests/performance/load_test.js -e API_BASE_URL=http://127.0.0.1:8000

      - name: Terminate backend
        if: always()
        run: |
          if [ -n "$BACKEND_PID" ]; then
            kill $BACKEND_PID || true
          fi
