name: DB Performance Gate
on:
    pull_request:
        paths:
            - "app/repositories/**"
            - "alembic/**"
            - "scripts/db_explain_check.py"

permissions: read-all

jobs:
    explain-check:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_PASSWORD: test # pragma: allowlist secret
                    POSTGRES_USER: test
                    POSTGRES_DB: test
                ports:
                    - 5432:5432
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
            - name: Install dependencies
              run: uv sync --group dev
            - name: Run Alembic migrations
              env:
                  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test # pragma: allowlist secret
                  SECRET_KEY: test-secret-key-for-ci-perf-gate-only  # pragma: allowlist secret
                  ENVIRONMENT: test
              run: uv run alembic upgrade head
            - name: Run Pytest to capture query logs
              env:
                  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test # pragma: allowlist secret
                  SECRET_KEY: test-secret-key-for-ci-perf-gate-only  # pragma: allowlist secret
                  ENVIRONMENT: testing
              run: uv run pytest -v -k "not integration and not performance" --ignore=tests/performance
            - name: Run EXPLAIN checks
              env:
                  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test # pragma: allowlist secret
                  SECRET_KEY: test-secret-key-for-ci-perf-gate-only  # pragma: allowlist secret
                  ENVIRONMENT: test
              run: |
                  uv run python scripts/db_explain_check.py \
                    --fail-on-seq-scan \
                    --tables news,events,users \
                    --max-cost 500.0 \
                    --log-dir tests
