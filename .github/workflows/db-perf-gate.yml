name: DB Performance Gate
on:
    pull_request:
        paths:
            - "app/repositories/**"
            - "alembic/**"
            - "scripts/db_explain_check.py"

permissions: read-all

jobs:
    explain-check:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_PASSWORD: test # pragma: allowlist secret
                    POSTGRES_USER: test
                    POSTGRES_DB: test
                ports:
                    - 5432:5432
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
            - name: Install dependencies
              run: uv sync --group dev
            - name: Run Alembic migrations
              env:
                  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test # pragma: allowlist secret
                  SECRET_KEY: test-secret-key-for-ci-perf-gate-only  # pragma: allowlist secret
                  ENVIRONMENT: test
              run: uv run alembic upgrade head
            - name: Run Pytest to capture query logs
              env:
                  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test # pragma: allowlist secret
                  SECRET_KEY: test-secret-key-for-ci-perf-gate-only  # pragma: allowlist secret
                  ENVIRONMENT: testing
              run: uv run pytest -v -k "not integration and not performance" --ignore=tests/performance
            - name: Run EXPLAIN checks
              env:
                  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test # pragma: allowlist secret
                  SECRET_KEY: test-secret-key-for-ci-perf-gate-only  # pragma: allowlist secret
                  ENVIRONMENT: test
              run: |
                  uv run python scripts/db_explain_check.py \
                    --fail-on-seq-scan \
                    --tables news,events,users \
                    --max-cost 500.0 \
                    --log-dir tests
