name: DB Performance Gate
on:
    pull_request:
        paths:
            - "app/repositories/**"
            - "alembic/**"
            - "scripts/db_explain_check.py"

permissions: read-all

jobs:
    explain-check:
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
                env:
                    POSTGRES_PASSWORD: test # pragma: allowlist secret
                    POSTGRES_USER: test
                    POSTGRES_DB: test
                ports:
                    - 5432:5432
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
            - name: Install dependencies
              run: uv sync --group dev
            - name: Run Alembic migrations
              env:
                  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test # pragma: allowlist secret
                  SECRET_KEY: test-secret-key-for-ci-perf-gate-only  # pragma: allowlist secret
                  ENVIRONMENT: test
              run: uv run alembic upgrade head 2>&1
            - name: Diagnose partition state post-migration
              env:
                  PGPASSWORD: test # pragma: allowlist secret
              run: |
                  echo '=== relkind of partitioned tables ==='
                  psql -h localhost -U test -d test -c "
                    SELECT relname, relkind
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'public'
                      AND relname IN ('data_access_logs','notifications',
                                      'notification_deliveries','failed_login_attempts')
                    ORDER BY relname;
                  "
                  echo '=== child partitions via pg_inherits ==='
                  psql -h localhost -U test -d test -c "
                    SELECT parent.relname AS parent, child.relname AS child
                    FROM pg_inherits
                    JOIN pg_class parent ON pg_inherits.inhparent = parent.oid
                    JOIN pg_class child  ON pg_inherits.inhrelid  = child.oid
                    WHERE parent.relname IN ('data_access_logs','notifications',
                                             'notification_deliveries','failed_login_attempts')
                    ORDER BY parent.relname, child.relname;
                  "
                  echo '=== alembic_version ==='
                  psql -h localhost -U test -d test -c "SELECT * FROM alembic_version;"
            - name: Ensure RANGE partitions exist before pytest
              env:
                  PGPASSWORD: test # pragma: allowlist secret
              run: |
                  # Create DEFAULT + prev/current/next-month partitions for every
                  # RANGE-partitioned table using IF NOT EXISTS so the step is
                  # idempotent.  psql exits 0 even when the partition already exists.
                  #
                  # This is the authoritative safety-net: Alembic's 202607020001
                  # migration should already have created these, but we guarantee it
                  # here so that no Python-level fixture failure can block the tests.
                  PREV_MONTH=$(date -u -d "$(date +%Y-%m-01) -1 month" +%Y_%m)
                  CURR_MONTH=$(date -u +%Y_%m)
                  NEXT_MONTH=$(date -u -d "$(date +%Y-%m-01) +1 month" +%Y_%m)
                  PREV_START=$(date -u -d "$(date +%Y-%m-01) -1 month" +%Y-%m-01)
                  CURR_START=$(date -u +%Y-%m-01)
                  NEXT_START=$(date -u -d "$(date +%Y-%m-01) +1 month" +%Y-%m-01)
                  AFTER_NEXT=$(date -u -d "$(date +%Y-%m-01) +2 month" +%Y-%m-01)

                  for TABLE in data_access_logs notifications notification_deliveries failed_login_attempts; do
                      psql -h localhost -U test -d test -c "
                        CREATE TABLE IF NOT EXISTS ${TABLE}_default
                          PARTITION OF ${TABLE} DEFAULT;
                        CREATE TABLE IF NOT EXISTS ${TABLE}_${PREV_MONTH}
                          PARTITION OF ${TABLE}
                          FOR VALUES FROM ('${PREV_START}') TO ('${CURR_START}');
                        CREATE TABLE IF NOT EXISTS ${TABLE}_${CURR_MONTH}
                          PARTITION OF ${TABLE}
                          FOR VALUES FROM ('${CURR_START}') TO ('${NEXT_START}');
                        CREATE TABLE IF NOT EXISTS ${TABLE}_${NEXT_MONTH}
                          PARTITION OF ${TABLE}
                          FOR VALUES FROM ('${NEXT_START}') TO ('${AFTER_NEXT}');
                      " 2>&1 || echo "WARN: partition step for ${TABLE} had errors (may be a non-partitioned table, ignored)"
                  done

                  echo '=== Final partition state ==='
                  psql -h localhost -U test -d test -c "
                    SELECT parent.relname AS parent, child.relname AS child
                    FROM pg_inherits
                    JOIN pg_class parent ON pg_inherits.inhparent = parent.oid
                    JOIN pg_class child  ON pg_inherits.inhrelid  = child.oid
                    WHERE parent.relname IN ('data_access_logs','notifications',
                                             'notification_deliveries','failed_login_attempts')
                    ORDER BY parent.relname, child.relname;
                  "

            - name: Run Pytest to capture query logs
              env:
                  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test # pragma: allowlist secret
                  SECRET_KEY: test-secret-key-for-ci-perf-gate-only  # pragma: allowlist secret
                  ENVIRONMENT: testing
              run: |
                  # Run only repository tests — this step exists solely to emit
                  # SQL query logs that db_explain_check.py will analyze.
                  # Running the full suite (~4 600 tests) without xdist exceeds
                  # the 6-hour GitHub Actions job limit.
                  uv run pytest -v \
                    tests/test_active_session_repository.py \
                    tests/test_audit_repository.py \
                    tests/test_auth_repository.py \
                    tests/test_chat_repository_coverage.py \
                    tests/test_chat_repository_groups.py \
                    tests/test_event_repository_coverage.py \
                    tests/test_event_repository_db.py \
                    tests/test_health_repository.py \
                    tests/test_news_repository_coverage.py \
                    tests/test_news_repository_db.py \
                    tests/test_notification_repository.py \
                    tests/test_repository_base.py \
                    tests/test_repository.py \
                    tests/test_schedule_repository.py \
                    tests/test_session_repository.py \
                    tests/test_story_repository.py \
                    tests/test_user_repository_coverage.py \
                    -k "not integration and not performance"

            - name: Run EXPLAIN checks
              env:
                  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test # pragma: allowlist secret
                  SECRET_KEY: test-secret-key-for-ci-perf-gate-only  # pragma: allowlist secret
                  ENVIRONMENT: test
              run: |
                  uv run python scripts/db_explain_check.py \
                    --fail-on-seq-scan \
                    --tables news,events,users \
                    --max-cost 500.0 \
                    --log-dir tests
