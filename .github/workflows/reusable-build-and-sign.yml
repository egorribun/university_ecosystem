# Reusable workflow for building, scanning, attesting and signing Docker images.
# Satisfies SLSA Level 3 requirements for software supply chain security.
name: Build and Sign Image

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      image_name:
        description: "Subject name for the image (e.g., backend)"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: false
        default: "."
        type: string
      file:
        description: "Path to Dockerfile"
        required: true
        type: string
      tags:
        description: "Newline-separated list of tags to push"
        required: true
        type: string
      build_args:
        description: "Newline-separated list of build arguments"
        required: false
        type: string
      target:
        description: "Target stage in multi-stage build"
        required: false
        type: string
    outputs:
      digest:
        description: "The pushed image digest"
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for keyless cosign and OIDC attestation
      attestations: write # Required for SLSA build provenance
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        # CI-01 (audit Wave 10): SHA-pinned; mutable @v4 tag replaced.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # CI-01 (audit Wave 10): SHA-pinned; mutable @v4 tag replaced.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push
        id: build
        # CI-01 (audit Wave 10): SHA-pinned; mutable @v7 tag replaced.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          tags: ${{ inputs.tags }}
          build-args: ${{ inputs.build_args }}
          target: ${{ inputs.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Trivy (via apt repo)
        # GitHub-Releases downloads are unreliable on this runner;
        # the Aqua apt repository is the stable fallback.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ inputs.image_name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # skip-setup-trivy: use the binary installed above via apt
          skip-setup-trivy: true
          exit-code: "1"

      - name: Generate SBOM (CycloneDX)
        # CI-01 (audit Wave 10): SHA-pinned; mutable @v0 tag replaced.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}/${{ inputs.image_name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.json
          upload-artifact: false

      - name: Attest SBOM & Build Provenance (SLSA L3)
        # CI-01 (audit Wave 10): SHA-pinned; mutable @v4 tag replaced.
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ inputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: "https://spdx.dev/Document"
          predicate-path: sbom.json
          push-to-registry: true

      - name: Sign image (Keyless)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}/${{ inputs.image_name }}@${{ steps.build.outputs.digest }}"
