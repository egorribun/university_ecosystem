# Reusable workflow for building, scanning, attesting and signing Docker images.
# BuildKit emits build provenance for the exact pushed digest; the later steps
# scan, attach a typed SBOM attestation, and sign that same immutable subject.
name: Build and Sign Image

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      image_name:
        description: "Subject name for the image (e.g., backend)"
        required: true
        type: string
      source-sha:
        description: "Exact validated commit SHA to check out and build"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: false
        default: "."
        type: string
      file:
        description: "Path to Dockerfile"
        required: true
        type: string
      tags:
        description: "Newline-separated list of tags to push"
        required: true
        type: string
      build_args:
        description: "Newline-separated list of build arguments"
        required: false
        type: string
      canonical_frontend:
        description: "Build the one staging-certified promotable frontend variant"
        required: false
        default: false
        type: boolean
      target:
        description: "Target stage in multi-stage build"
        required: false
        type: string
    outputs:
      digest:
        description: "The pushed image digest"
        value: ${{ jobs.build.outputs.digest }}
      reference:
        description: "The final immutable image reference"
        value: ${{ jobs.build.outputs.reference }}

jobs:
  build:
    # This reusable workflow is reserved for the canonical protected-main
    # producer.  Reject calls from feature refs before allocating privileged
    # build, registry, or attestation permissions.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write # Required for keyless cosign and OIDC attestation
      attestations: write # Required for SLSA build provenance
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.references.outputs.subject_name }}@${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A workflow-call input is untrusted data.  Checkout the immutable
          # event source first, then bind source-sha to the protected main
          # revision before any build, cache, or credential-bearing action.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source checkout
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin refs/heads/main:refs/remotes/origin/main --depth=1
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"

      - name: Resolve local scan and final image references
        id: references
        env:
          FINAL_TAGS: ${{ inputs.tags }}
          CANONICAL_FRONTEND: ${{ inputs.canonical_frontend }}
          IMAGE_NAME: ${{ inputs.image_name }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          if [[ "$IMAGE_NAME" == "frontend" ]]; then
            test "$CANONICAL_FRONTEND" = "true"
          else
            test "$CANONICAL_FRONTEND" = "false"
          fi
          expected="ghcr.io/${GITHUB_REPOSITORY}/${IMAGE_NAME}:${SOURCE_SHA}"
          normalized="$(printf '%s\n' "$FINAL_TAGS" | sed '/^[[:space:]]*$/d')"
          test "$normalized" = "$expected"
          {
            echo "final_ref=$expected"
            echo "subject_name=ghcr.io/${GITHUB_REPOSITORY}/${IMAGE_NAME}"
            echo "local_ref=university-ecosystem/${IMAGE_NAME}:scan-${SOURCE_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Install checksum-pinned Trivy
        env:
          TRIVY_VERSION: 0.73.0
          # Official immutable GitHub release asset digest for
          # trivy_0.73.0_Linux-64bit.tar.gz.
          TRIVY_ARCHIVE_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b # pragma: allowlist secret -- official public release checksum
        run: |
          set -euo pipefail
          [[ "$TRIVY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TRIVY_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          trivy_dir="$(mktemp -d)"
          trap 'rm -rf -- "$trivy_dir"' EXIT
          archive="$trivy_dir/trivy.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$trivy_dir" trivy
          sudo install --mode 0755 "$trivy_dir/trivy" /usr/local/bin/trivy
          trivy --version

      - name: Set up Docker Buildx
        # CI-01 (audit Wave 10): SHA-pinned; mutable @v4 tag replaced.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build local image for security scan
        id: build
        # CI-01 (audit Wave 10): SHA-pinned; mutable @v7 tag replaced.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.references.outputs.local_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source-sha }}
          build-args: |
            ${{ inputs.build_args }}
            ${{ inputs.canonical_frontend && format('VITE_APP_RELEASE={0}', inputs.source-sha) || '' }}
            ${{ inputs.canonical_frontend && 'VITE_ENABLE_WEB_VITALS=true' || '' }}
            ${{ inputs.canonical_frontend && 'VITE_CWV_TRUSTED_RUM=true' || '' }}
            ${{ inputs.canonical_frontend && 'VITE_WEB_VITALS_ENDPOINT=/api/v1/cwv' || '' }}
          target: ${{ inputs.target }}
          # Keep each image's BuildKit cache isolated while allowing repeat
          # builds of that image to reuse layers.  The required image_name is
          # the canonical producer matrix value, so this scope is deterministic
          # and cannot collide across the six release images.
          cache-from: type=gha,scope=university-${{ inputs.image_name }}
          cache-to: type=gha,scope=university-${{ inputs.image_name }},mode=max
          provenance: false
          sbom: false

      - name: Scan local image before registry access (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.references.outputs.local_ref }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          # Use the checksum-verified binary installed before registry login.
          skip-setup-trivy: true
          exit-code: "1"

      - name: Generate SBOM (CycloneDX)
        # CI-01 (audit Wave 10): SHA-pinned; mutable @v0 tag replaced.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.references.outputs.local_ref }}
          format: cyclonedx-json
          output-file: sbom.json
          upload-artifact: false

      - name: Login to GHCR after local security gates
        # No registry credential is available until the candidate passed Trivy
        # and its SBOM was generated from the same local image.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish or reuse scanned immutable image
        id: publish
        env:
          FINAL_REF: ${{ steps.references.outputs.final_ref }}
          LOCAL_REF: ${{ steps.references.outputs.local_ref }}
          SUBJECT_NAME: ${{ steps.references.outputs.subject_name }}
        run: |
          set -euo pipefail
          python scripts/quality/publish_immutable_image.py \
            --final-ref "$FINAL_REF" \
            --local-ref "$LOCAL_REF" \
            --subject-name "$SUBJECT_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Attest build provenance for the published digest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.references.outputs.subject_name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM for the built image
        # The generic attest action previously labelled this CycloneDX document
        # as an SPDX predicate.  attest-sbom preserves the SBOM media type and
        # binds it to the digest emitted by the build step.
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ inputs.image_name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.json
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (Keyless)
        env:
          IMAGE_REF: ${{ steps.references.outputs.subject_name }}@${{ steps.publish.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REF"

      - name: Verify final signature and attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.references.outputs.subject_name }}@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REF" > cosign-verification.json
          gh attestation verify "oci://$IMAGE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --format json > attestation-verification.json
          test -s cosign-verification.json
          test -s attestation-verification.json

      - name: Write verified image digest evidence
        env:
          CANONICAL_FRONTEND: ${{ inputs.canonical_frontend }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_NAME: ${{ inputs.image_name }}
          PRODUCER_EVENT: ${{ github.event_name }}
          PRODUCER_REPOSITORY: ${{ github.repository }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_SOURCE_REF: ${{ github.ref }}
          PRODUCER_WORKFLOW_REF: ${{ github.workflow_ref }}
          PRODUCER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          SUBJECT_NAME: ${{ steps.references.outputs.subject_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/image-evidence
          python - <<'PY'
          import json, os, pathlib, re

          digest = os.environ["DIGEST"]
          image_name = os.environ["IMAGE_NAME"]
          source_sha = os.environ["SOURCE_SHA"]
          subject_name = os.environ["SUBJECT_NAME"]
          repository = os.environ["PRODUCER_REPOSITORY"]
          workflow_ref = os.environ["PRODUCER_WORKFLOW_REF"]
          workflow_sha = os.environ["PRODUCER_WORKFLOW_SHA"]
          run_id = int(os.environ["PRODUCER_RUN_ID"])
          run_attempt = int(os.environ["PRODUCER_RUN_ATTEMPT"])
          canonical_frontend = os.environ["CANONICAL_FRONTEND"] == "true"
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("invalid image digest")
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("invalid source SHA")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("invalid producer repository")
          if image_name not in {"backend", "caddy", "file-processor", "frontend", "gateway", "ws-hub"}:
              raise SystemExit("invalid image name")
          if run_id <= 0 or run_attempt <= 0:
              raise SystemExit("invalid producer run metadata")
          expected_workflow_ref = (
              f"{repository}/.github/workflows/build-release-images.yml@refs/heads/main"
          )
          if (
              workflow_ref != expected_workflow_ref
              or workflow_sha != source_sha
              or os.environ["PRODUCER_EVENT"] != "workflow_dispatch"
              or os.environ["PRODUCER_SOURCE_REF"] != "refs/heads/main"
              or canonical_frontend != (image_name == "frontend")
              or subject_name != f"ghcr.io/{repository}/{image_name}"
          ):
              raise SystemExit("invalid image evidence producer metadata")
          artifact_name = (
              f"image-digest-evidence-{image_name}-{source_sha}-attempt-{run_attempt}"
          )
          payload = {
              "schema_version": 2,
              "image_name": image_name,
              "source_sha": source_sha,
              "subject_name": subject_name,
              "digest": digest,
              "reference": f"{subject_name}@{digest}",
              "signature_verified": True,
              "attestation_verified": True,
              "producer": {
                  "repository": repository,
                  "workflow_path": ".github/workflows/build-release-images.yml",
                  "workflow_ref": workflow_ref,
                  "workflow_sha": workflow_sha,
                  "source_ref": "refs/heads/main",
                  "event": "workflow_dispatch",
                  "run_id": run_id,
                  "run_attempt": run_attempt,
                  "artifact_name": artifact_name,
              },
              "verification": {
                  "trivy_version": "0.73.0",
                  "sbom_format": "cyclonedx-json",
                  "signature": "cosign-keyless",
                  "attestation": "github-build-provenance",
              },
              "build_contract": {
                  "canonical_frontend": canonical_frontend,
                  "release_sha": source_sha,
              },
          }
          path = pathlib.Path("artifacts/image-evidence") / f"{image_name}.json"
          path.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload verified image digest evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-evidence-${{ inputs.image_name }}-${{ inputs.source-sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/image-evidence/${{ inputs.image_name }}.json
          if-no-files-found: error
