name: Renovate Config Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  renovate-validation:
    name: Renovate Config Validator (Strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Restore fast pre-commit environments
        # Share the isolated hook cache with the read-only CI pre-commit job.
        # The cache key covers hook revisions, the locked runner closure, and interpreter.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-fast-v2-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      - name: Install hash-verified pre-commit runner
        run: |
          set -euo pipefail
          requirements_file="$RUNNER_TEMP/ci-precommit.requirements.txt"
          uv export --frozen \
            --only-group ci-precommit-runner \
            --no-emit-project \
            --no-emit-workspace \
            --format requirements-txt \
            -o "$requirements_file"
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --force-reinstall \
            -r "$requirements_file"
          test "$(pre-commit --version)" = "pre-commit 4.6.2"

      - name: Run strict Renovate validator
        run: |
          set -euo pipefail
          pre-commit run renovate-config-validator --all-files --show-diff-on-failure