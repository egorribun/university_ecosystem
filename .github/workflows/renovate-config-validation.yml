name: Renovate Config Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  renovate-validation:
    name: Renovate Config Validator (Strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Generate bounded owner-approved Pillow candidate
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'egorribun/university_ecosystem' && github.event.pull_request.head.ref == 'egorribun' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          original_lock="$(mktemp)"
          metadata_file=""
          cp -- uv.lock "$original_lock"
          trap 'cp -- "$original_lock" uv.lock; rm -f -- "$original_lock" "${metadata_file:-}"' EXIT
          metadata_file="$(mktemp)"
          export ORIGINAL_PILLOW_LOCK="$original_lock"
          export PILLOW_RELEASE_METADATA="$metadata_file"
          http_status="$(curl --proto '=https' --proto-redir '=https' --max-redirs 0 \
            --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --max-filesize 2097152 --output "$metadata_file" --write-out '%{http_code}' \
            'https://pypi.org/pypi/pillow/13.0.0/json')"
          test "$http_status" = "200"
          timeout --kill-after=5s 180s uv lock --upgrade-package "pillow==13.0.0"
          timeout --kill-after=5s 60s uv lock --check
          python - <<'PY'
          import copy
          import datetime as dt
          import difflib
          import json
          import os
          import re
          import tomllib
          from pathlib import Path
          from urllib.parse import urlsplit
          
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "Duplicate metadata key")
                  result[key] = value
              return result
          
          def timestamp(value):
              require(isinstance(value, str), "Invalid upload timestamp")
              parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
              require(parsed.tzinfo is not None and parsed.utcoffset() == dt.timedelta(0), "Non-UTC upload")
              return parsed
          
          def filename(url):
              require(isinstance(url, str), "Invalid artifact URL")
              parsed = urlsplit(url)
              require(parsed.scheme == "https" and parsed.netloc == "files.pythonhosted.org"
                      and not parsed.query and not parsed.fragment, "Unexpected artifact origin")
              return parsed.path.rsplit("/", 1)[-1]
          
          original = Path(os.environ["ORIGINAL_PILLOW_LOCK"]).read_bytes()
          generated = Path("uv.lock").read_bytes()
          before = tomllib.loads(original.decode("utf-8"))
          after = tomllib.loads(generated.decode("utf-8"))
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          policy = project["tool"]["uv"]
          certifi_cutoff = "2026-10-20T02:24:17Z"
          pillow_cutoff = "2026-10-16T22:18:10Z"
          require(policy["required-version"] == "==0.12.23", "Unexpected uv version")
          require(policy["exclude-newer"] == "7 days", "Global cooldown changed")
          require(policy["exclude-newer-package"] == {"certifi": certifi_cutoff, "pillow": pillow_cutoff},
                  "Unexpected package exceptions")
          constraints = policy["constraint-dependencies"]
          require(constraints.count("certifi==2026.10.19") == 1
                  and constraints.count("pillow==13.0.0") == 1, "Missing exact constraints")
          require(project["project"]["dependencies"].count("pillow>=13.0.0,<14") == 1,
                  "Unexpected direct requirement")
          metadata_path = Path(os.environ["PILLOW_RELEASE_METADATA"])
          require(0 < metadata_path.stat().st_size <= 2097152, "Metadata size exceeded")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"), object_pairs_hook=unique_object)
          require(isinstance(metadata, dict), "Invalid release metadata")
          info = metadata["info"]
          require(info["name"].casefold() == "pillow" and info["version"] == "13.0.0"
                  and info.get("yanked") is False, "Unexpected or yanked release")
          release_files = metadata["urls"]
          require(isinstance(release_files, list) and 0 < len(release_files) <= 512,
                  "Invalid release inventory")
          inventory = {}
          for entry in release_files:
              name = entry["filename"]
              require(isinstance(name, str) and name not in inventory, "Duplicate artifact")
              inventory[name] = entry
          old_packages = [item for item in before["package"] if item["name"] == "pillow"]
          new_packages = [item for item in after["package"] if item["name"] == "pillow"]
          require(len(old_packages) == len(new_packages) == 1, "Expected one Pillow record")
          require(old_packages[0]["version"] == "12.3.0", "Unexpected old version")
          package = new_packages[0]
          require(set(package) == {"name", "version", "source", "sdist", "wheels"}
                  and package["version"] == "13.0.0"
                  and package["source"] == {"registry": "https://pypi.org/simple"},
                  "Unexpected Pillow package")
          require(isinstance(package["wheels"], list) and 0 < len(package["wheels"]) <= 512,
                  "Invalid wheel inventory")
          selected = set()
          for index, artifact in enumerate([package["sdist"], *package["wheels"]]):
              require(set(artifact) == {"url", "hash", "size", "upload-time"}, "Artifact fields")
              name = filename(artifact["url"])
              require(name not in selected and name in inventory, "Unknown or duplicate artifact")
              selected.add(name)
              entry = inventory[name]
              require(filename(entry["url"]) == name and artifact["url"] == entry["url"]
                      and entry.get("yanked") is False, "Artifact URL mismatch or yanked")
              digest = entry["digests"]["sha256"]
              require(isinstance(digest, str) and re.fullmatch(r"[0-9a-f]{64}", digest)
                      and artifact["hash"] == "sha256:" + digest, "Artifact hash mismatch")
              require(type(artifact["size"]) is int and type(entry["size"]) is int
                      and artifact["size"] > 0 and artifact["size"] == entry["size"],
                      "Artifact size mismatch")
              uploaded = timestamp(entry["upload_time_iso_8601"])
              locked_upload = timestamp(artifact["upload-time"])
              if locked_upload != uploaded or uploaded > timestamp(pillow_cutoff):
                  print(f"Artifact timestamp diagnostic: index={index} "
                        f"lock={locked_upload.isoformat()} pypi={uploaded.isoformat()} "
                        f"cutoff={pillow_cutoff}")
              require(locked_upload == uploaded
                      and uploaded <= timestamp(pillow_cutoff), "Artifact timestamp mismatch")
              if index == 0:
                  require(name == "pillow-13.0.0.tar.gz" and entry["packagetype"] == "sdist",
                          "Unexpected source distribution")
              else:
                  require(name.startswith("pillow-13.0.0-") and name.endswith(".whl")
                          and entry["packagetype"] == "bdist_wheel", "Unexpected wheel")
          expected = copy.deepcopy(before)
          expected["package"][expected["package"].index(old_packages[0])] = package
          require(expected["options"]["exclude-newer-package"] == {"certifi": certifi_cutoff},
                  "Unexpected original exceptions")
          expected["options"]["exclude-newer-package"]["pillow"] = pillow_cutoff
          require(not any(item["name"] == "pillow" for item in expected["manifest"]["constraints"]),
                  "Unexpected prior constraint")
          expected["manifest"]["constraints"].append({"name": "pillow", "specifier": "==13.0.0"})
          expected["manifest"]["constraints"].sort(key=lambda item: item["name"])
          roots = [item for item in expected["package"] if item["name"] == "university-ecosystem"]
          require(len(roots) == 1, "Expected one root record")
          requirements = roots[0]["metadata"]["requires-dist"]
          pillow_requirements = [item for item in requirements if item["name"] == "pillow"]
          require(pillow_requirements == [{"name": "pillow", "specifier": ">=12.3.0,<13"}],
                  "Unexpected original direct requirement")
          requirements[requirements.index(pillow_requirements[0])] = {
              "name": "pillow", "specifier": ">=13.0.0,<14"
          }
          require(after == expected, "Unexpected lock changes outside approved Pillow scope")
          diff = "".join(difflib.unified_diff(
              original.decode("utf-8").splitlines(True), generated.decode("utf-8").splitlines(True),
              fromfile="a/uv.lock", tofile="b/uv.lock",
          ))
          require(0 < len(diff.encode("utf-8")) <= 131072, "Candidate diff size exceeded")
          print("BEGIN PILLOW CANDIDATE DIFF; NOT CHECKED-IN LOCK VALIDATION")
          print(diff, end="")
          print("END PILLOW CANDIDATE DIFF")
          PY
          cp -- "$original_lock" uv.lock
          cmp -- "$original_lock" uv.lock
          echo "Original checked-in uv.lock restored before the normal lock gate."
          

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Restore fast pre-commit environments
        # Share the isolated hook cache with the read-only CI pre-commit job.
        # The cache key covers hook revisions, the locked runner closure, and interpreter.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-fast-v2-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      - name: Install hash-verified pre-commit runner
        run: |
          set -euo pipefail
          requirements_file="$RUNNER_TEMP/ci-precommit.requirements.txt"
          uv export --frozen \
            --only-group ci-precommit-runner \
            --no-emit-project \
            --no-emit-workspace \
            --format requirements-txt \
            -o "$requirements_file"
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --force-reinstall \
            -r "$requirements_file"
          test "$(pre-commit --version)" = "pre-commit 4.6.2"

      - name: Run strict Renovate validator
        run: |
          set -euo pipefail
          pre-commit run renovate-config-validator --all-files --show-diff-on-failure