name: Deploy (Blue-Green)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: "Skip pre-deployment tests"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Pre-deployment validation
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run critical tests
        env:
          OTEL_SDK_DISABLED: "true"
        run: uv run pytest -x -q --tb=short tests/

      - name: Verify migrations can downgrade
        env:
          DATABASE_URL: sqlite+aiosqlite:///./deploy-test.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ always() && (needs.validate.result == 'success' || inputs.skip_tests) }}
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for OIDC-based keyless cosign signing and SLSA provenance
      attestations: write  # Required to push SLSA provenance attestations to GHCR
    outputs:
      backend_digest: ${{ steps.build_backend.outputs.digest }}
      frontend_digest: ${{ steps.build_frontend.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate version tag
        id: version
        run: |
          VERSION="${{ github.sha }}-$(date +%Y%m%d%H%M%S)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign (keyless image signing)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.0.5

      - name: Build and push backend
        id: build_backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance: true generates an in-toto SLSA L2 provenance attestation,
          # making the build verifiable via 'cosign verify-attestation'.
          provenance: true
          sbom: true

      - name: Sign backend image (keyless via Sigstore/Fulcio)
        # Attaches a Rekor-logged transparency entry — no long-lived keys needed.
        env:
          DIGEST: ${{ steps.build_backend.outputs.digest }}
          TAGS: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ steps.version.outputs.version }}
        run: |
          cosign sign --yes "${TAGS}@${DIGEST}"

      - name: Build and push frontend
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign frontend image (keyless via Sigstore/Fulcio)
        env:
          DIGEST: ${{ steps.build_frontend.outputs.digest }}
          TAGS: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ steps.version.outputs.version }}
        run: |
          cosign sign --yes "${TAGS}@${DIGEST}"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy (placeholder)
        id: deploy
        run: |
          echo "::notice::Blue-Green deployment to ${{ inputs.environment }}"
          echo "Backend image: ${{ needs.build-and-push.outputs.backend_digest }}"
          echo "Frontend image: ${{ needs.build-and-push.outputs.frontend_digest }}"
          echo "Version: ${{ needs.build-and-push.outputs.version }}"

          # Placeholder for actual deployment commands
          # This would typically:
          # 1. Deploy to "green" environment
          # 2. Run health checks
          # 3. Switch traffic from "blue" to "green"
          # 4. Keep "blue" as rollback target

          echo "url=https://${{ inputs.environment }}.example.com" >> "$GITHUB_OUTPUT"

      - name: Record DORA Lead Time for Changes
        # DORA metric: time from triggering commit's author date to deployment.
        # GitHub Insights tracks Deployment Frequency automatically via the
        # 'environment' field above. Lead Time requires explicit calculation.
        id: dora
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch the triggering commit to get its author date
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            })

            const commitTs = new Date(commit.commit.author.date).getTime()
            const deployTs = Date.now()
            const leadTimeH = ((deployTs - commitTs) / 3_600_000).toFixed(2)
            const leadTimeMin = ((deployTs - commitTs) / 60_000).toFixed(0)

            core.setOutput('lead_time_hours', leadTimeH)
            core.notice(`DORA Lead Time for Changes: ${leadTimeH}h (${leadTimeMin} min)`)

            await core.summary
              .addHeading('DORA: Lead Time for Changes', 3)
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Environment', '${{ inputs.environment }}'],
                ['Commit SHA', context.sha.slice(0, 7)],
                ['Commit author date', commit.commit.author.date],
                ['Deploy time (UTC)', new Date(deployTs).toISOString()],
                ['Lead time', `${leadTimeH} hours`],
              ])
              .write()

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install requests
        run: pip install requests

      - name: Post-deployment smoke test
        run: python scripts/smoke_test.py
        env:
          GATEWAY_URL: "https://${{ inputs.environment }}-api.example.com/health"
          WS_HUB_URL: "https://${{ inputs.environment }}-ws.example.com/health"
          BACKEND_URL: "https://${{ inputs.environment }}.example.com/healthz"
          FRONTEND_URL: "https://${{ inputs.environment }}.example.com/"

  rollback:
    name: Rollback capability test
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ inputs.environment == 'staging' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Test database rollback
        env:
          DATABASE_URL: sqlite+aiosqlite:///./rollback-test.db
        run: |
          echo "Testing migration rollback capability..."
          uv run alembic upgrade head
          uv run alembic downgrade -1
          echo "✅ Rollback successful"
          uv run alembic upgrade head
          echo "✅ Re-upgrade successful"

  notify:
    name: Notify deployment status
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy, rollback]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Deployment Summary

          | Property | Value |
          |----------|-------|
          | Environment | `${{ inputs.environment }}` |
          | Version | `${{ needs.build-and-push.outputs.version }}` |
          | Deploy Status | `${{ needs.deploy.result }}` |
          | Rollback Test | `${{ needs.rollback.result }}` |

          **Triggered by:** @${{ github.actor }}
          SUMMARY
