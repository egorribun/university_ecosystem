name: Deploy (Helm / Kubernetes)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      release-sha:
        description: "Exact current main commit to deploy"
        required: true
        type: string
      quality-run-id:
        description: "Successful CI run that produced this SHA's quality evidence"
        required: true
        type: string
      cwv-certification-run-id:
        description: "Successful field-CWV certification run (required for production)"
        required: false
        default: ""
        type: string
      cwv-certified-frontend-image-digest:
        description: "Exact staging-certified frontend digest (required for production)"
        required: false
        default: ""
        type: string
      rotate-mfa-keys:
        description: "Reconcile ExternalSecret and restart MFA consumers"
        required: true
        default: false
        type: boolean
      # TD-W10-09: skip_tests input removed. Pre-deployment tests are mandatory.
      # If the test suite is too slow, parallelise via matrix strategy.
      # Fast deploy ≠ safe deploy — a broken migration that reaches production
      # can require manual DB rollback and extended downtime.

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions: read-all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Pre-deployment validation
    # A manual deploy may only be dispatched from protected main.  Without
    # this guard every checked-out script and Dockerfile would be attacker
    # controlled while later jobs hold registry/OIDC/deployment privileges.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test  # pragma: allowlist secret
          POSTGRES_DB: test_deploy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_deploy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release-sha }}

      - name: Verify deployment SHA and quality run
        id: quality-run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release-sha }}
          QUALITY_RUN_ID: ${{ inputs.quality-run-id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUALITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin refs/heads/main:refs/remotes/origin/main --depth=1
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          mkdir -p artifacts/quality
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALITY_RUN_ID" > artifacts/quality/quality-run.json
          test "$(jq -r .head_sha artifacts/quality/quality-run.json)" = "$RELEASE_SHA"
          test "$(jq -r .conclusion artifacts/quality/quality-run.json)" = success
          test "$(jq -r .event artifacts/quality/quality-run.json)" = push
          test "$(jq -r .head_branch artifacts/quality/quality-run.json)" = main
          test "$(jq -r .path artifacts/quality/quality-run.json)" = .github/workflows/ci.yml
          run_attempt="$(jq -r .run_attempt artifacts/quality/quality-run.json)"
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          echo "run-attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALITY_RUN_ID/artifacts?per_page=100" \
            > artifacts/quality/quality-artifacts.json
          test "$(jq --arg name "quality-evidence-$RELEASE_SHA" '[.artifacts[] | select(.name == $name and .expired == false)] | length' artifacts/quality/quality-artifacts.json)" -eq 1

      - name: Clean quality evidence destinations
        run: |
          set -euo pipefail
          rm -f -- coverage.xml
          rm -rf -- frontend/coverage
          rm -rf -- artifacts/coverage

      - name: Download SHA-bound quality evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-evidence-${{ inputs.release-sha }}
          run-id: ${{ inputs.quality-run-id }}
          github-token: ${{ github.token }}
          path: .

      - name: Validate SHA-bound quality evidence
        env:
          RELEASE_SHA: ${{ inputs.release-sha }}
          QUALITY_RUN_ID: ${{ inputs.quality-run-id }}
          QUALITY_RUN_ATTEMPT: ${{ steps.quality-run.outputs.run-attempt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -s artifacts/coverage/quality-manifest.json
          test -s artifacts/coverage/quality-manifest.json.sha256
          sha256sum --check artifacts/coverage/quality-manifest.json.sha256
          python scripts/quality/validate_quality_contract.py \
            --schema quality/coverage-manifest.schema.json \
            --artifact-root "$GITHUB_WORKSPACE" \
            --mutation-registry quality/mutation-exclusions.json \
            --manifest artifacts/coverage/quality-manifest.json \
            --expected-commit-sha "$RELEASE_SHA" \
            --expected-workflow-run-id "$QUALITY_RUN_ID" \
            --expected-workflow-run-attempt "$QUALITY_RUN_ATTEMPT" \
            --expected-workflow-event push \
            --expected-workflow-repository "$GITHUB_REPOSITORY" \
            --expected-workflow-ref "$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" \
            --expected-workflow-job coverage-policy-gate

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run critical tests
        env:
          OTEL_SDK_DISABLED: "true"
        run: uv run pytest -x -q --tb=short tests/

      - name: Verify migrations can downgrade
        # RZ-W8-07: Use PostgreSQL (not SQLite) — pgvector, JSONB, partial indexes
        # and FOR UPDATE locking don't exist in SQLite; a passing SQLite migration
        # can silently fail in production.
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_deploy  # pragma: allowlist secret
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    needs: [validate]
    if: ${{ always() && needs.validate.result == 'success' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # MOD-W17-04 (Wave 17): Use commit SHA as the image tag for idempotent,
      # content-addressable builds. Previously used SHA+timestamp which produced
      # different tags on retry, making rollbacks ambiguous and breaking SLSA
      # Level 2 provenance requirements.
      - name: Generate version tag
        id: version
        env:
          RELEASE_SHA: ${{ inputs.release-sha }}
        run: |
          VERSION="$RELEASE_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build Backend
    needs: [prepare]
    permissions:
      contents: read
      packages: write  # Required: push Docker images to GHCR
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: "backend"
      source-sha: ${{ inputs.release-sha }}
      file: "backend.Dockerfile"
      tags: |
        ghcr.io/${{ github.repository }}/backend:${{ needs.prepare.outputs.version }}

  build-frontend:
    name: Build Frontend
    needs: [prepare]
    permissions:
      contents: read
      packages: write  # Required: push Docker images to GHCR
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: "frontend"
      source-sha: ${{ inputs.release-sha }}
      file: "frontend.Dockerfile"
      tags: |
        ghcr.io/${{ github.repository }}/frontend:${{ needs.prepare.outputs.version }}
      build_args: |
        VITE_APP_RELEASE=${{ inputs.release-sha }}
        VITE_ENABLE_WEB_VITALS=${{ inputs.environment == 'staging' }}
        VITE_CWV_TRUSTED_RUM=${{ inputs.environment == 'staging' }}
        VITE_WEB_VITALS_ENDPOINT=/api/v1/cwv

  build-ws-hub:
    name: Build WS Hub
    needs: [prepare]
    permissions:
      contents: read
      packages: write  # Required: push Docker images to GHCR
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: "ws-hub"
      source-sha: ${{ inputs.release-sha }}
      context: "."
      file: "services/ws-hub/Dockerfile"
      tags: |
        ghcr.io/${{ github.repository }}/ws-hub:${{ needs.prepare.outputs.version }}

  build-gateway:
    name: Build Gateway
    needs: [prepare]
    permissions:
      contents: read
      packages: write  # Required: push Docker images to GHCR
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: "gateway"
      source-sha: ${{ inputs.release-sha }}
      context: "."
      file: "services/gateway/Dockerfile"
      tags: |
        ghcr.io/${{ github.repository }}/gateway:${{ needs.prepare.outputs.version }}

  build-file-processor:
    name: Build File Processor
    needs: [prepare]
    permissions:
      contents: read
      packages: write  # Required: push Docker images to GHCR
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: "file-processor"
      source-sha: ${{ inputs.release-sha }}
      context: "."
      file: "services/file-processor/Dockerfile"
      tags: |
        ghcr.io/${{ github.repository }}/file-processor:${{ needs.prepare.outputs.version }}

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    needs:
      [
        prepare,
        build-backend,
        build-frontend,
        build-ws-hub,
        build-gateway,
        build-file-processor,
      ]
    permissions:
      contents: read
      actions: read  # Verify and download exact field-CWV evidence for production.
      deployments: write  # Required: create and update GitHub deployment status records
      id-token: write  # Required: request JWT via OIDC for cloud provider authentication
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.DEPLOYMENT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-sha }}

      - name: Select immutable frontend image
        id: release-images
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          BUILT_FRONTEND_IMAGE_DIGEST: ${{ needs.build-frontend.outputs.digest }}
          CERTIFIED_FRONTEND_IMAGE_DIGEST: ${{ inputs.cwv-certified-frontend-image-digest }}
        run: |
          set -euo pipefail
          selected="$BUILT_FRONTEND_IMAGE_DIGEST"
          if [[ "$DEPLOY_ENVIRONMENT" == "production" ]]; then
            [[ "$CERTIFIED_FRONTEND_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            selected="$CERTIFIED_FRONTEND_IMAGE_DIGEST"
          fi
          [[ "$selected" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "frontend-digest=$selected" >> "$GITHUB_OUTPUT"

      - name: Verify production field certification run
        if: ${{ inputs.environment == 'production' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release-sha }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.release-images.outputs.frontend-digest }}
          CERTIFICATION_RUN_ID: ${{ inputs.cwv-certification-run-id }}
        run: |
          set -euo pipefail
          [[ "$CERTIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p artifacts/cwv/production-provenance
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CERTIFICATION_RUN_ID" \
            > artifacts/cwv/production-provenance/certification-run.json
          jq --exit-status \
            --arg sha "$RELEASE_SHA" \
            '.head_sha == $sha and .conclusion == "success" and
             .event == "workflow_dispatch" and .head_branch == "main" and
             .path == ".github/workflows/cwv-field-certification.yml"' \
            artifacts/cwv/production-provenance/certification-run.json >/dev/null
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CERTIFICATION_RUN_ID/artifacts?per_page=100" \
            > artifacts/cwv/production-provenance/certification-artifacts.json
          test "$(jq --arg name "cwv-field-certificate-$RELEASE_SHA" \
            --arg sha "$RELEASE_SHA" \
            '[.artifacts[] | select(.name == $name and .expired == false and
              .workflow_run.head_sha == $sha)] | length' \
            artifacts/cwv/production-provenance/certification-artifacts.json)" -eq 1
          test -n "$FRONTEND_IMAGE_DIGEST"

      - name: Download production field certification
        if: ${{ inputs.environment == 'production' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cwv-field-certificate-${{ inputs.release-sha }}
          run-id: ${{ inputs.cwv-certification-run-id }}
          github-token: ${{ github.token }}
          path: artifacts/cwv/production-certificate

      - name: Validate production field certification
        if: ${{ inputs.environment == 'production' }}
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release-sha }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.release-images.outputs.frontend-digest }}
        run: |
          set -euo pipefail
          cd artifacts/cwv/production-certificate/certificate
          test -s field-verdict.json
          test -s field-verdict.json.sha256
          sha256sum --check field-verdict.json.sha256
          jq --exit-status \
            --arg sha "$RELEASE_SHA" \
            --arg digest "$FRONTEND_IMAGE_DIGEST" \
            '.schema_version == 1 and .valid == true and
             .environment == "staging" and .release_sha == $sha and
             .frontend_image_digest == $digest' \
            field-verdict.json >/dev/null
          generated_epoch="$(date -u -d "$(jq -r '.generated_at' field-verdict.json)" +%s)"
          current_epoch="$(date -u +%s)"
          test "$generated_epoch" -le "$current_epoch"
          test "$((current_epoch - generated_epoch))" -le 259200

      - name: Validate deployment contract
        shell: bash
        env:
          OIDC_DEPLOY_ROLE_ARN: ${{ secrets.OIDC_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
          HELM_VALUES_FILE: ${{ vars.HELM_VALUES_FILE }}
          CONNECTIONS_SECRET_NAME: ${{ vars.CONNECTIONS_SECRET_NAME }}
          APPLICATION_SECRETS_NAME: ${{ vars.APPLICATION_SECRETS_NAME }}
          APPLICATION_EXTERNAL_SECRET_NAME: ${{ vars.APPLICATION_EXTERNAL_SECRET_NAME }}
          ROTATE_MFA_KEYS: ${{ inputs.rotate-mfa-keys }}
          MFA_OVERLAP_SMOKE_SCRIPT: ${{ vars.MFA_OVERLAP_SMOKE_SCRIPT }}
          MFA_SMOKE_BASE_URL: ${{ vars.MFA_SMOKE_BASE_URL }}
          MFA_SMOKE_MAILBOX_URL: ${{ vars.MFA_SMOKE_MAILBOX_URL }}
          MFA_SMOKE_EMAIL: ${{ secrets.MFA_SMOKE_EMAIL }}
          MFA_SMOKE_PASSWORD: ${{ secrets.MFA_SMOKE_PASSWORD }}
          MFA_SMOKE_MAILBOX_TOKEN: ${{ secrets.MFA_SMOKE_MAILBOX_TOKEN }}
          WS_HUB_DEPLOYMENT_NAME: ${{ vars.WS_HUB_DEPLOYMENT_NAME }}
          WS_HUB_CONTAINER_NAME: ${{ vars.WS_HUB_CONTAINER_NAME }}
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
          GATEWAY_HEALTH_URL: ${{ vars.GATEWAY_HEALTH_URL }}
          WS_HUB_HEALTH_URL: ${{ vars.WS_HUB_HEALTH_URL }}
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
          FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
          DEPLOY_VERSION: ${{ needs.prepare.outputs.version }}
          BACKEND_IMAGE_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.release-images.outputs.frontend-digest }}
          WS_HUB_IMAGE_DIGEST: ${{ needs.build-ws-hub.outputs.digest }}
          GATEWAY_IMAGE_DIGEST: ${{ needs.build-gateway.outputs.digest }}
          FILE_PROCESSOR_IMAGE_DIGEST: ${{ needs.build-file-processor.outputs.digest }}
        run: |
          set -euo pipefail

          required=(
            OIDC_DEPLOY_ROLE_ARN AWS_REGION EKS_CLUSTER_NAME K8S_NAMESPACE
            HELM_RELEASE_NAME HELM_VALUES_FILE CONNECTIONS_SECRET_NAME
            APPLICATION_SECRETS_NAME APPLICATION_EXTERNAL_SECRET_NAME
            WS_HUB_DEPLOYMENT_NAME
            WS_HUB_CONTAINER_NAME DEPLOYMENT_URL GATEWAY_HEALTH_URL
            WS_HUB_HEALTH_URL BACKEND_HEALTH_URL FRONTEND_HEALTH_URL
            DEPLOY_VERSION BACKEND_IMAGE_DIGEST FRONTEND_IMAGE_DIGEST
            WS_HUB_IMAGE_DIGEST GATEWAY_IMAGE_DIGEST
            FILE_PROCESSOR_IMAGE_DIGEST
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required deployment setting '$name' is not configured for the selected GitHub Environment."
              exit 1
            fi
          done

          if [[ "$ROTATE_MFA_KEYS" == "true" ]]; then
            rotation_required=(
              MFA_OVERLAP_SMOKE_SCRIPT MFA_SMOKE_BASE_URL MFA_SMOKE_MAILBOX_URL
              MFA_SMOKE_EMAIL MFA_SMOKE_PASSWORD MFA_SMOKE_MAILBOX_TOKEN
            )
            for name in "${rotation_required[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Required MFA rotation setting '$name' is not configured for the selected GitHub Environment."
                exit 1
              fi
            done
            for name in MFA_SMOKE_BASE_URL MFA_SMOKE_MAILBOX_URL; do
              if [[ ! "${!name}" =~ ^https://[^[:space:]]+$ ]]; then
                echo "::error::$name must be a non-empty HTTPS URL."
                exit 1
              fi
            done
            python3 .github/scripts/validate_mfa_smoke_path.py \
              "$MFA_OVERLAP_SMOKE_SCRIPT" >/dev/null
          fi

          if [[ ! "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]; then
            echo "::error::AWS_REGION is not a valid AWS region identifier."
            exit 1
          fi
          if [[ ! "$EKS_CLUSTER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$ ]]; then
            echo "::error::EKS_CLUSTER_NAME is not a valid EKS cluster name."
            exit 1
          fi
          for name in K8S_NAMESPACE HELM_RELEASE_NAME CONNECTIONS_SECRET_NAME APPLICATION_SECRETS_NAME APPLICATION_EXTERNAL_SECRET_NAME WS_HUB_DEPLOYMENT_NAME WS_HUB_CONTAINER_NAME; do
            value="${!name}"
            if [[ "${#value}" -gt 63 || ! "$value" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
              echo "::error::$name must be a lowercase Kubernetes DNS label."
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::DEPLOY_VERSION must be the immutable 40-character commit SHA."
            exit 1
          fi
          for name in BACKEND_IMAGE_DIGEST FRONTEND_IMAGE_DIGEST WS_HUB_IMAGE_DIGEST GATEWAY_IMAGE_DIGEST FILE_PROCESSOR_IMAGE_DIGEST; do
            if [[ ! "${!name}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$name is not an immutable sha256 image digest."
              exit 1
            fi
          done
          for name in DEPLOYMENT_URL GATEWAY_HEALTH_URL WS_HUB_HEALTH_URL BACKEND_HEALTH_URL FRONTEND_HEALTH_URL; do
            if [[ ! "${!name}" =~ ^https://[^[:space:]]+$ ]]; then
              echo "::error::$name must be a non-empty HTTPS URL."
              exit 1
            fi
          done

          case "$HELM_VALUES_FILE" in
            *.yaml|*.yml) ;;
            *)
              echo "::error::HELM_VALUES_FILE must reference a YAML file in the repository."
              exit 1
              ;;
          esac
          if [[ ! -f "$HELM_VALUES_FILE" ]]; then
            echo "::error::HELM_VALUES_FILE does not exist: $HELM_VALUES_FILE"
            exit 1
          fi
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          values_file="$(realpath "$HELM_VALUES_FILE")"
          if [[ "$values_file" != "$workspace"/* ]]; then
            echo "::error::HELM_VALUES_FILE must resolve inside the checked-out repository."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        # Uses an environment-scoped role and GitHub's short-lived OIDC token.
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.OIDC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Configure and verify cluster access
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --alias "$EKS_CLUSTER_NAME"
          kubectl config current-context
          kubectl version --client
          helm version --short
          kubectl cluster-info

          if ! kubectl get namespace "$K8S_NAMESPACE" >/dev/null 2>&1; then
            kubectl auth can-i create namespaces | grep -Fxq yes
            kubectl create namespace "$K8S_NAMESPACE"
          fi
          kubectl auth can-i get deployments --namespace "$K8S_NAMESPACE" | grep -Fxq yes
          kubectl auth can-i list deployments --namespace "$K8S_NAMESPACE" | grep -Fxq yes
          kubectl auth can-i watch deployments --namespace "$K8S_NAMESPACE" | grep -Fxq yes
          kubectl auth can-i patch deployments --namespace "$K8S_NAMESPACE" | grep -Fxq yes
          helm_secret_verbs=(get list watch create update patch delete)
          for verb in "${helm_secret_verbs[@]}"; do
            kubectl auth can-i "$verb" secrets --namespace "$K8S_NAMESPACE" | grep -Fxq yes
          done
          kubectl auth can-i get externalsecrets.external-secrets.io --namespace "$K8S_NAMESPACE" | grep -Fxq yes
          kubectl auth can-i patch externalsecrets.external-secrets.io --namespace "$K8S_NAMESPACE" | grep -Fxq yes

      - name: Build Helm dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if helm dependency build charts/university-ecosystem; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Helm dependency build failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify rendered Helm resource RBAC
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
          HELM_VALUES_FILE: ${{ vars.HELM_VALUES_FILE }}
          CONNECTIONS_SECRET_NAME: ${{ vars.CONNECTIONS_SECRET_NAME }}
          APPLICATION_SECRETS_NAME: ${{ vars.APPLICATION_SECRETS_NAME }}
          BACKEND_IMAGE_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.release-images.outputs.frontend-digest }}
          GATEWAY_IMAGE_DIGEST: ${{ needs.build-gateway.outputs.digest }}
          FILE_PROCESSOR_IMAGE_DIGEST: ${{ needs.build-file-processor.outputs.digest }}
        run: |
          set -euo pipefail
          rendered="$(mktemp "$RUNNER_TEMP/rendered-release.XXXXXX.yaml")"
          trap 'rm -f -- "$rendered"' EXIT
          bash .github/scripts/deploy-helm.sh render > "$rendered"
          mapfile -t rendered_resources < <(
            kubectl create --dry-run=client --validate=false \
              --filename "$rendered" --output name | cut -d/ -f1 | sort -u
          )
          if [[ "${#rendered_resources[@]}" -eq 0 ]]; then
            echo "::error::The selected Helm values rendered no Kubernetes resources."
            exit 1
          fi
          rendered_resource_verbs=(get list watch create update patch delete)
          for resource in "${rendered_resources[@]}"; do
            if [[ ! "$resource" =~ ^[a-z0-9.-]+$ ]]; then
              echo "::error::Rendered an invalid Kubernetes resource identity."
              exit 1
            fi
            for verb in "${rendered_resource_verbs[@]}"; do
              kubectl auth can-i "$verb" "$resource" \
                --namespace "$K8S_NAMESPACE" | grep -Fxq yes
            done
          done

      - name: Capture pre-rotation MFA key metadata
        if: ${{ inputs.rotate-mfa-keys }}
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
          HELM_VALUES_FILE: ${{ vars.HELM_VALUES_FILE }}
          CONNECTIONS_SECRET_NAME: ${{ vars.CONNECTIONS_SECRET_NAME }}
          APPLICATION_SECRETS_NAME: ${{ vars.APPLICATION_SECRETS_NAME }}
          BACKEND_IMAGE_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.release-images.outputs.frontend-digest }}
          GATEWAY_IMAGE_DIGEST: ${{ needs.build-gateway.outputs.digest }}
          FILE_PROCESSOR_IMAGE_DIGEST: ${{ needs.build-file-processor.outputs.digest }}
          MFA_SMOKE_STATE_DIR: ${{ runner.temp }}/mfa-overlap-smoke
        run: |
          set -euo pipefail
          umask 077
          contract="$(bash .github/scripts/deploy-helm.sh render-secret-contract)"
          contract_literal() {
            local key="$1"
            local values
            values="$(sed -n "s/^[[:space:]]*${key}: //p" <<< "$contract")"
            if [[ "$(wc -l <<< "$values")" -ne 1 || -z "$values" ]]; then
              echo "::error::Rendered deployment contract has no unique '$key'."
              exit 1
            fi
            printf '%s' "$values"
          }
          application_secret_name="$(contract_literal application-secret-name | jq --raw-output '.')"
          if [[ "$application_secret_name" != "$APPLICATION_SECRETS_NAME" ]]; then
            echo "::error::Rendered application Secret name does not match the selected environment."
            exit 1
          fi
          contract_file="$(mktemp "$RUNNER_TEMP/mfa-key-contract.XXXXXX.json")"
          trap 'rm -f -- "$contract_file"' EXIT
          contract_literal mfa-key-contract.json | jq --raw-output '.' > "$contract_file"
          kubectl get secret "$APPLICATION_SECRETS_NAME" \
            --namespace "$K8S_NAMESPACE" --output json | \
            python3 .github/scripts/verify_mfa_key_rotation.py capture-pre \
              --state-dir "$MFA_SMOKE_STATE_DIR" \
              --contract-file "$contract_file" \
              --expected-secret-name "$APPLICATION_SECRETS_NAME"
          mv -- "$contract_file" "$MFA_SMOKE_STATE_DIR/mfa-key-contract.json"

      - name: Prepare queued MFA overlap challenge
        if: ${{ inputs.rotate-mfa-keys }}
        shell: bash
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
          MFA_OVERLAP_SMOKE_SCRIPT: ${{ vars.MFA_OVERLAP_SMOKE_SCRIPT }}
          MFA_SMOKE_BASE_URL: ${{ vars.MFA_SMOKE_BASE_URL }}
          MFA_SMOKE_MAILBOX_URL: ${{ vars.MFA_SMOKE_MAILBOX_URL }}
          MFA_SMOKE_EMAIL: ${{ secrets.MFA_SMOKE_EMAIL }}
          MFA_SMOKE_PASSWORD: ${{ secrets.MFA_SMOKE_PASSWORD }}
          MFA_SMOKE_MAILBOX_TOKEN: ${{ secrets.MFA_SMOKE_MAILBOX_TOKEN }}
          MFA_SMOKE_STATE_DIR: ${{ runner.temp }}/mfa-overlap-smoke
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          smoke_script="$(python3 .github/scripts/validate_mfa_smoke_path.py \
            "$MFA_OVERLAP_SMOKE_SCRIPT")"
          state_dir="$MFA_SMOKE_STATE_DIR"
          if [[ ! -d "$state_dir" || \
                ! -s "$state_dir/pre-key-metadata.json" || \
                ! -s "$state_dir/mfa-key-contract.json" || \
                -e "$state_dir/old-challenge.json" ]]; then
            echo "::error::Prepared MFA key metadata is missing or stale."
            exit 1
          fi
          chmod 700 "$state_dir"

          selector="app.kubernetes.io/instance=$HELM_RELEASE_NAME,app.kubernetes.io/component=outbox-worker"
          deployments="$(kubectl get deployments --namespace "$K8S_NAMESPACE" \
            --selector "$selector" --output json)"
          deployment_name="$(jq --raw-output \
            'if (.items | length) == 1 then .items[0].metadata.name else empty end' \
            <<< "$deployments")"
          replicas="$(jq --raw-output \
            'if (.items | length) == 1 then (.items[0].spec.replicas // 1) else empty end' \
            <<< "$deployments")"
          if [[ -z "$deployment_name" || ! "$replicas" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Expected exactly one running outbox-worker Deployment."
            exit 1
          fi
          printf '%s' "$deployment_name" > "$state_dir/outbox-deployment"
          printf '%s' "$replicas" > "$state_dir/outbox-replicas"

          restore_on_error() {
            kubectl scale "deployment/$deployment_name" --namespace "$K8S_NAMESPACE" \
              --replicas="$replicas" >/dev/null || true
          }
          trap restore_on_error ERR
          kubectl scale "deployment/$deployment_name" --namespace "$K8S_NAMESPACE" \
            --replicas=0
          kubectl rollout status "deployment/$deployment_name" \
            --namespace "$K8S_NAMESPACE" --timeout=5m
          bash "$smoke_script" prepare
          trap - ERR

      - name: Reconcile application ExternalSecret
        id: mfa_secret_reconcile
        if: ${{ inputs.rotate-mfa-keys }}
        timeout-minutes: 2
        shell: bash
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          APPLICATION_SECRETS_NAME: ${{ vars.APPLICATION_SECRETS_NAME }}
          APPLICATION_EXTERNAL_SECRET_NAME: ${{ vars.APPLICATION_EXTERNAL_SECRET_NAME }}
        run: |
          set -euo pipefail
          external_secret_json="$(kubectl get externalsecret "$APPLICATION_EXTERNAL_SECRET_NAME" \
            --namespace "$K8S_NAMESPACE" --output json)"
          target_name="$(jq --raw-output '.spec.target.name // empty' \
            <<< "$external_secret_json")"
          if [[ "$target_name" != "$APPLICATION_SECRETS_NAME" ]]; then
            echo "::error::ExternalSecret target '$target_name' does not match APPLICATION_SECRETS_NAME."
            exit 1
          fi
          previous_refresh_time="$(jq --raw-output '.status.refreshTime // empty' \
            <<< "$external_secret_json")"
          previous_resource_version="$(kubectl get secret "$APPLICATION_SECRETS_NAME" \
            --namespace "$K8S_NAMESPACE" --output json 2>/dev/null | \
            jq --raw-output '.metadata.resourceVersion // empty' || true)"

          kubectl annotate externalsecret "$APPLICATION_EXTERNAL_SECRET_NAME" \
            --namespace "$K8S_NAMESPACE" \
            force-sync="$(date +%s%N)" --overwrite

          condition_type="Ready"
          deadline=$((SECONDS + 90))
          while (( SECONDS < deadline )); do
            external_secret_json="$(kubectl get externalsecret \
              "$APPLICATION_EXTERNAL_SECRET_NAME" --namespace "$K8S_NAMESPACE" \
              --output json)"
            ready="$(jq --arg condition_type "$condition_type" \
              'any(.status.conditions[]?;
                .type == $condition_type and .status == "True")' \
              <<< "$external_secret_json")"
            new_refresh_time="$(jq --raw-output '.status.refreshTime // empty' \
              <<< "$external_secret_json")"
            new_resource_version="$(kubectl get secret "$APPLICATION_SECRETS_NAME" \
              --namespace "$K8S_NAMESPACE" --output json 2>/dev/null | \
              jq --raw-output '.metadata.resourceVersion // empty' || true)"
            if [[ "$ready" == "true" && -n "$new_refresh_time" && \
                  "$new_refresh_time" != "$previous_refresh_time" && \
                  -n "$new_resource_version" && \
                  "$new_resource_version" != "$previous_resource_version" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "${ready:-false}" != "true" || -z "${new_refresh_time:-}" || \
                "$new_refresh_time" == "$previous_refresh_time" || \
                -z "${new_resource_version:-}" || \
                "$new_resource_version" == "$previous_resource_version" ]]; then
            echo "::error::ExternalSecret did not publish a fresh Ready Secret within 90 seconds."
            exit 1
          fi

      - name: Verify rotated MFA key metadata
        id: mfa_key_metadata
        if: ${{ inputs.rotate-mfa-keys }}
        timeout-minutes: 1
        shell: bash
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          APPLICATION_SECRETS_NAME: ${{ vars.APPLICATION_SECRETS_NAME }}
          MFA_SMOKE_STATE_DIR: ${{ runner.temp }}/mfa-overlap-smoke
        run: |
          set -euo pipefail
          kubectl get secret "$APPLICATION_SECRETS_NAME" \
            --namespace "$K8S_NAMESPACE" --output json | \
            python3 .github/scripts/verify_mfa_key_rotation.py verify-post \
              --state-dir "$MFA_SMOKE_STATE_DIR" \
              --contract-file "$MFA_SMOKE_STATE_DIR/mfa-key-contract.json" \
              --expected-secret-name "$APPLICATION_SECRETS_NAME"

      - name: Restore outbox after MFA Secret reconciliation
        if: ${{ always() && inputs.rotate-mfa-keys }}
        shell: bash
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          MFA_SMOKE_STATE_DIR: ${{ runner.temp }}/mfa-overlap-smoke
          RECONCILE_OUTCOME: ${{ steps.mfa_secret_reconcile.outcome }}
          ROTATION_METADATA_OUTCOME: ${{ steps.mfa_key_metadata.outcome }}
        run: |
          set -euo pipefail
          deployment_file="$MFA_SMOKE_STATE_DIR/outbox-deployment"
          replicas_file="$MFA_SMOKE_STATE_DIR/outbox-replicas"
          if [[ ! -s "$deployment_file" || ! -s "$replicas_file" ]]; then
            exit 0
          fi
          deployment_name="$(<"$deployment_file")"
          replicas="$(<"$replicas_file")"
          [[ "$replicas" =~ ^[1-9][0-9]*$ ]]
          kubectl scale "deployment/$deployment_name" --namespace "$K8S_NAMESPACE" \
            --replicas="$replicas"
          if [[ "$RECONCILE_OUTCOME" != "success" || \
                "$ROTATION_METADATA_OUTCOME" != "success" ]]; then
            kubectl rollout status "deployment/$deployment_name" \
              --namespace "$K8S_NAMESPACE" --timeout=3m
          fi

      - name: Load rotated MFA Secret into consumers
        if: ${{ inputs.rotate-mfa-keys }}
        timeout-minutes: 2
        shell: bash
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
        run: |
          set -euo pipefail
          resolve_component() {
            local component="$1"
            local selector="app.kubernetes.io/instance=$HELM_RELEASE_NAME,app.kubernetes.io/component=$component"
            local deployments
            deployments="$(kubectl get deployments --namespace "$K8S_NAMESPACE" \
              --selector "$selector" --output json)"
            jq --exit-status --raw-output \
              'if (.items | length) == 1 then .items[0].metadata.name else empty end' \
              <<< "$deployments"
          }
          verify_available() {
            local component="$1"
            local deployment_name="$2"
            local deployment
            deployment="$(kubectl get "deployment/$deployment_name" \
              --namespace "$K8S_NAMESPACE" --output json)"
            desired_replicas="$(jq '.spec.replicas // 1' <<< "$deployment")"
            availableReplicas="$(jq '.status.availableReplicas // 0' <<< "$deployment")"
            if [[ "$availableReplicas" -ne "$desired_replicas" ]]; then
              echo "::error::$component has $availableReplicas/$desired_replicas available replicas."
              exit 1
            fi
          }

          backend_deployment="$(resolve_component backend)"
          outbox_deployment="$(resolve_component outbox-worker)"
          kubectl rollout restart "deployment/$backend_deployment" \
            --namespace "$K8S_NAMESPACE"
          kubectl rollout status "deployment/$backend_deployment" \
            --namespace "$K8S_NAMESPACE" --timeout=90s &
          backend_rollout_pid=$!
          kubectl rollout status "deployment/$outbox_deployment" \
            --namespace "$K8S_NAMESPACE" --timeout=90s &
          outbox_rollout_pid=$!
          rollout_failed=0
          wait "$backend_rollout_pid" || rollout_failed=1
          wait "$outbox_rollout_pid" || rollout_failed=1
          if [[ "$rollout_failed" -ne 0 ]]; then
            echo "::error::MFA consumers did not load the rotated Secret within 90 seconds."
            exit 1
          fi
          verify_available backend "$backend_deployment"
          verify_available outbox-worker "$outbox_deployment"

      - name: Verify old MFA key-overlap behavior
        if: ${{ inputs.rotate-mfa-keys }}
        timeout-minutes: 4
        shell: bash
        env:
          MFA_OVERLAP_SMOKE_SCRIPT: ${{ vars.MFA_OVERLAP_SMOKE_SCRIPT }}
          MFA_SMOKE_BASE_URL: ${{ vars.MFA_SMOKE_BASE_URL }}
          MFA_SMOKE_MAILBOX_URL: ${{ vars.MFA_SMOKE_MAILBOX_URL }}
          MFA_SMOKE_EMAIL: ${{ secrets.MFA_SMOKE_EMAIL }}
          MFA_SMOKE_PASSWORD: ${{ secrets.MFA_SMOKE_PASSWORD }}
          MFA_SMOKE_MAILBOX_TOKEN: ${{ secrets.MFA_SMOKE_MAILBOX_TOKEN }}
          MFA_SMOKE_STATE_DIR: ${{ runner.temp }}/mfa-overlap-smoke
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          smoke_script="$(python3 .github/scripts/validate_mfa_smoke_path.py \
            "$MFA_OVERLAP_SMOKE_SCRIPT")"
          bash "$smoke_script" verify-old

      - name: Verify effective Secret contract
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
          HELM_VALUES_FILE: ${{ vars.HELM_VALUES_FILE }}
          CONNECTIONS_SECRET_NAME: ${{ vars.CONNECTIONS_SECRET_NAME }}
          APPLICATION_SECRETS_NAME: ${{ vars.APPLICATION_SECRETS_NAME }}
          BACKEND_IMAGE_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.release-images.outputs.frontend-digest }}
          GATEWAY_IMAGE_DIGEST: ${{ needs.build-gateway.outputs.digest }}
          FILE_PROCESSOR_IMAGE_DIGEST: ${{ needs.build-file-processor.outputs.digest }}
        run: |
          set -euo pipefail

          require_secret_keys() {
            local secret_name="$1"
            shift
            local secret_json
            secret_json="$(kubectl get secret "$secret_name" --namespace "$K8S_NAMESPACE" --output json)"
            for key in "$@"; do
              if ! jq --exit-status --arg key "$key" \
                '.data[$key] | type == "string" and length > 0' \
                <<< "$secret_json" >/dev/null; then
                echo "::error::Secret '$secret_name' is missing non-empty key '$key'."
                exit 1
              fi
            done
          }

          contract="$(bash .github/scripts/deploy-helm.sh render-secret-contract)"
          contract_literal() {
            local key="$1"
            local values
            values="$(sed -n "s/^[[:space:]]*${key}: //p" <<< "$contract")"
            if [[ "$(wc -l <<< "$values")" -ne 1 || -z "$values" ]]; then
              echo "::error::Rendered deployment contract has no unique '$key'."
              exit 1
            fi
            printf '%s' "$values"
          }

          application_secret_name="$(contract_literal application-secret-name | jq --raw-output '.')"
          connection_secret_name="$(contract_literal connection-secret-name | jq --raw-output '.')"
          if [[ "$application_secret_name" != "$APPLICATION_SECRETS_NAME" || \
                "$connection_secret_name" != "$CONNECTIONS_SECRET_NAME" ]]; then
            echo "::error::Rendered Secret names do not match the selected environment."
            exit 1
          fi
          mapfile -t application_secret_keys < <(
            contract_literal application-secret-keys.json | jq --raw-output 'fromjson[]'
          )
          mapfile -t connection_secret_keys < <(
            contract_literal connection-secret-keys.json | jq --raw-output 'fromjson[]'
          )
          if [[ "${#application_secret_keys[@]}" -eq 0 || \
                "${#connection_secret_keys[@]}" -eq 0 ]]; then
            echo "::error::Rendered Secret key contract is empty."
            exit 1
          fi
          require_secret_keys "$application_secret_name" "${application_secret_keys[@]}"
          require_secret_keys "$connection_secret_name" "${connection_secret_keys[@]}"

      - name: Capture rollback state
        id: rollback_state
        shell: bash
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
          WS_HUB_DEPLOYMENT_NAME: ${{ vars.WS_HUB_DEPLOYMENT_NAME }}
          WS_HUB_CONTAINER_NAME: ${{ vars.WS_HUB_CONTAINER_NAME }}
        run: |
          set -euo pipefail
          releases="$(helm list --namespace "$K8S_NAMESPACE" \
            --filter "^${HELM_RELEASE_NAME}$" --output json)"
          release_count="$(jq 'length' <<< "$releases")"
          if [[ "$release_count" -gt 1 ]]; then
            echo "::error::More than one Helm release matched '$HELM_RELEASE_NAME'."
            exit 1
          fi
          previous_revision="$(jq --raw-output \
            'if length == 0 then "0" else .[0].revision end' <<< "$releases")"
          if [[ ! "$previous_revision" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve the current Helm revision."
            exit 1
          fi

          ws_hub_image="$(kubectl get deployment "$WS_HUB_DEPLOYMENT_NAME" \
            --namespace "$K8S_NAMESPACE" --output json | \
            jq --raw-output --arg name "$WS_HUB_CONTAINER_NAME" \
              '[.spec.template.spec.containers[] |
                select(.name == $name) | .image] |
               if length == 1 then .[0] else empty end')"
          if [[ -z "$ws_hub_image" ]]; then
            echo "::error::Unable to capture exactly one WS Hub container image."
            exit 1
          fi
          echo "helm_revision=$previous_revision" >> "$GITHUB_OUTPUT"
          echo "ws_hub_image=$ws_hub_image" >> "$GITHUB_OUTPUT"

      - name: Capture field-evidence timestamp
        id: field-evidence-time
        if: ${{ inputs.environment == 'staging' }}
        shell: bash
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Deploy Helm release atomically
        id: helm_deploy
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
          HELM_VALUES_FILE: ${{ vars.HELM_VALUES_FILE }}
          CONNECTIONS_SECRET_NAME: ${{ vars.CONNECTIONS_SECRET_NAME }}
          APPLICATION_SECRETS_NAME: ${{ vars.APPLICATION_SECRETS_NAME }}
          BACKEND_IMAGE_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.release-images.outputs.frontend-digest }}
          GATEWAY_IMAGE_DIGEST: ${{ needs.build-gateway.outputs.digest }}
          FILE_PROCESSOR_IMAGE_DIGEST: ${{ needs.build-file-processor.outputs.digest }}
          DEPLOY_VERSION: ${{ needs.prepare.outputs.version }}
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
          CWV_DEPLOYED_AT: ${{ steps.field-evidence-time.outputs.timestamp }}
          CWV_EXPORT_OIDC_SUBJECT: ${{ vars.CWV_EXPORT_OIDC_SUBJECT }}
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-helm.sh lint
          bash .github/scripts/deploy-helm.sh upgrade

      - name: Deploy WS Hub image
        id: ws_hub_deploy
        shell: bash
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          WS_HUB_DEPLOYMENT_NAME: ${{ vars.WS_HUB_DEPLOYMENT_NAME }}
          WS_HUB_CONTAINER_NAME: ${{ vars.WS_HUB_CONTAINER_NAME }}
          WS_HUB_IMAGE_DIGEST: ${{ needs.build-ws-hub.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$GITHUB_REPOSITORY/ws-hub@$WS_HUB_IMAGE_DIGEST"
          kubectl get deployment "$WS_HUB_DEPLOYMENT_NAME" \
            --namespace "$K8S_NAMESPACE" >/dev/null
          kubectl set image "deployment/$WS_HUB_DEPLOYMENT_NAME" \
            "$WS_HUB_CONTAINER_NAME=$image" \
            --namespace "$K8S_NAMESPACE"
          kubectl rollout status "deployment/$WS_HUB_DEPLOYMENT_NAME" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m
          actual="$(kubectl get deployment "$WS_HUB_DEPLOYMENT_NAME" \
            --namespace "$K8S_NAMESPACE" --output json | \
            jq --raw-output --arg name "$WS_HUB_CONTAINER_NAME" \
              '.spec.template.spec.containers[] | select(.name == $name) | .image')"
          if [[ "$actual" != "$image" ]]; then
            echo "::error::WS Hub rollout uses '$actual' instead of '$image'."
            exit 1
          fi

      - name: Verify Helm-managed rollouts
        shell: bash
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
          BACKEND_IMAGE_DIGEST: ${{ needs.build-backend.outputs.digest }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.release-images.outputs.frontend-digest }}
          GATEWAY_IMAGE_DIGEST: ${{ needs.build-gateway.outputs.digest }}
          FILE_PROCESSOR_IMAGE_DIGEST: ${{ needs.build-file-processor.outputs.digest }}
        run: |
          set -euo pipefail
          helm status "$HELM_RELEASE_NAME" --namespace "$K8S_NAMESPACE"
          kubectl rollout status deployment \
            --selector "app.kubernetes.io/instance=$HELM_RELEASE_NAME" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m

          verify_image() {
            local component="$1"
            local container="$2"
            local expected="$3"
            local deployments
            local actual
            deployments="$(kubectl get deployments \
              --selector "app.kubernetes.io/instance=$HELM_RELEASE_NAME,app.kubernetes.io/component=$component" \
              --namespace "$K8S_NAMESPACE" --output json)"
            actual="$(jq --raw-output --arg container "$container" \
              'if (.items | length) == 1 then
                 [.items[0].spec.template.spec.containers[] |
                  select(.name == $container) | .image] |
                 if length == 1 then .[0] else empty end
               else empty end' <<< "$deployments")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$component rollout uses '$actual' instead of '$expected'."
              exit 1
            fi
          }

          image_prefix="$REGISTRY/$GITHUB_REPOSITORY"
          verify_image backend backend "$image_prefix/backend@$BACKEND_IMAGE_DIGEST"
          verify_image frontend frontend "$image_prefix/frontend@$FRONTEND_IMAGE_DIGEST"
          verify_image gateway gateway "$image_prefix/gateway@$GATEWAY_IMAGE_DIGEST"
          verify_image file-processor file-processor "$image_prefix/file-processor@$FILE_PROCESSOR_IMAGE_DIGEST"
          verify_image outbox-worker outbox-worker "$image_prefix/backend@$BACKEND_IMAGE_DIGEST"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install requests
        # RZ-W8-08: Pin version — unpinned installs can break silently or inject
        # a supply-chain compromise at deploy time.
        run: pip install "requests==2.33.1"

      - name: Post-deployment smoke test
        run: python scripts/smoke_test.py
        env:
          GATEWAY_URL: ${{ vars.GATEWAY_HEALTH_URL }}
          WS_HUB_URL: ${{ vars.WS_HUB_HEALTH_URL }}
          BACKEND_URL: ${{ vars.BACKEND_HEALTH_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_HEALTH_URL }}

      - name: Verify new MFA key-overlap behavior
        if: ${{ inputs.rotate-mfa-keys }}
        shell: bash
        env:
          MFA_OVERLAP_SMOKE_SCRIPT: ${{ vars.MFA_OVERLAP_SMOKE_SCRIPT }}
          MFA_SMOKE_BASE_URL: ${{ vars.MFA_SMOKE_BASE_URL }}
          MFA_SMOKE_MAILBOX_URL: ${{ vars.MFA_SMOKE_MAILBOX_URL }}
          MFA_SMOKE_EMAIL: ${{ secrets.MFA_SMOKE_EMAIL }}
          MFA_SMOKE_PASSWORD: ${{ secrets.MFA_SMOKE_PASSWORD }}
          MFA_SMOKE_MAILBOX_TOKEN: ${{ secrets.MFA_SMOKE_MAILBOX_TOKEN }}
          MFA_SMOKE_STATE_DIR: ${{ runner.temp }}/mfa-overlap-smoke
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          smoke_script="$(python3 .github/scripts/validate_mfa_smoke_path.py \
            "$MFA_OVERLAP_SMOKE_SCRIPT")"
          bash "$smoke_script" verify-new

      - name: Verify Kyverno policy compliance (MOD-14-02)
        shell: bash
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
        run: |
          set -euo pipefail
          expected_policies=(
            require-run-as-non-root
            disallow-privilege-escalation
            require-drop-all-capabilities
            require-seccomp-profile
            require-readonly-root-filesystem
            restrict-image-registries
            require-resource-limits
            require-always-pull-policy
            disallow-latest-tag
          )
          policies="$(kubectl get validatingpolicies.policies.kyverno.io --output json)"
          for policy in "${expected_policies[@]}"; do
            if ! jq --exit-status --arg name "$policy" \
              '.items[] | select(.metadata.name == $name) |
               (.status.conditionStatus.ready == true) and
               ((.spec.validationActions // []) | index("Deny") != null) and
               ((.spec.validationActions // []) | index("Audit") != null)' \
              <<< "$policies" >/dev/null; then
              echo "::error::Kyverno policy '$policy' is missing, not Ready, or does not enforce Deny+Audit."
              exit 1
            fi
          done

          reports="$(kubectl get policyreports.wgpolicyk8s.io \
            --namespace "$K8S_NAMESPACE" --output json)"
          violations="$(jq '[.items[].summary.fail // 0] | add // 0' <<< "$reports")"
          if [[ "$violations" -gt 0 ]]; then
            echo "::error::Kyverno policy violations detected: $violations failure(s)."
            kubectl get policyreports.wgpolicyk8s.io \
              --namespace "$K8S_NAMESPACE" --output yaml
            exit 1
          fi
          echo "Kyverno: all required policies enforce and no violations are reported."

      - name: Create staging field-evidence metadata
        if: ${{ inputs.environment == 'staging' }}
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release-sha }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.release-images.outputs.frontend-digest }}
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
          DEPLOYED_AT: ${{ steps.field-evidence-time.outputs.timestamp }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/cwv
          jq --null-input \
            --arg release_sha "$RELEASE_SHA" \
            --arg frontend_image_digest "$FRONTEND_IMAGE_DIGEST" \
            --arg deployment_url "$DEPLOYMENT_URL" \
            --arg deployed_at "$DEPLOYED_AT" \
            --argjson workflow_run_id "$DEPLOY_RUN_ID" \
            --argjson workflow_run_attempt "$DEPLOY_RUN_ATTEMPT" \
            '{
              schema_version: 1,
              environment: "staging",
              release_sha: $release_sha,
              frontend_image_digest: $frontend_image_digest,
              deployment_url: $deployment_url,
              deployed_at: $deployed_at,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt
            }' > artifacts/cwv/staging-deployment.json
          jq --exit-status \
            --arg sha "$RELEASE_SHA" \
            --arg digest "$FRONTEND_IMAGE_DIGEST" \
            --argjson run_id "$DEPLOY_RUN_ID" \
            --argjson run_attempt "$DEPLOY_RUN_ATTEMPT" \
            '.schema_version == 1 and .environment == "staging" and
             .release_sha == $sha and .frontend_image_digest == $digest and
             .workflow_run_id == $run_id and
             .workflow_run_attempt == $run_attempt' \
            artifacts/cwv/staging-deployment.json >/dev/null
          (cd artifacts/cwv && \
            sha256sum staging-deployment.json > staging-deployment.json.sha256)

      - name: Upload staging field-evidence metadata
        if: ${{ inputs.environment == 'staging' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-deployment-${{ inputs.release-sha }}
          path: |
            artifacts/cwv/staging-deployment.json
            artifacts/cwv/staging-deployment.json.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Roll back a deployment that failed verification
        if: ${{ failure() && steps.rollback_state.outcome == 'success' }}
        shell: bash
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
          WS_HUB_DEPLOYMENT_NAME: ${{ vars.WS_HUB_DEPLOYMENT_NAME }}
          WS_HUB_CONTAINER_NAME: ${{ vars.WS_HUB_CONTAINER_NAME }}
          PREVIOUS_HELM_REVISION: ${{ steps.rollback_state.outputs.helm_revision }}
          PREVIOUS_WS_HUB_IMAGE: ${{ steps.rollback_state.outputs.ws_hub_image }}
          HELM_DEPLOY_OUTCOME: ${{ steps.helm_deploy.outcome }}
        run: |
          set -uo pipefail
          rollback_failed=0

          if [[ "$HELM_DEPLOY_OUTCOME" == "success" ]]; then
            if [[ "$PREVIOUS_HELM_REVISION" == "0" ]]; then
              if helm status "$HELM_RELEASE_NAME" --namespace "$K8S_NAMESPACE" >/dev/null 2>&1; then
                if ! helm uninstall "$HELM_RELEASE_NAME" \
                  --namespace "$K8S_NAMESPACE" --wait --timeout 10m; then
                  echo "::error::Unable to remove the newly installed failed release."
                  rollback_failed=1
                fi
              fi
            elif ! helm rollback "$HELM_RELEASE_NAME" "$PREVIOUS_HELM_REVISION" \
              --namespace "$K8S_NAMESPACE" --wait --wait-for-jobs --timeout 10m; then
              echo "::error::Unable to roll Helm back to revision $PREVIOUS_HELM_REVISION."
              rollback_failed=1
            fi
          fi

          if ! kubectl set image "deployment/$WS_HUB_DEPLOYMENT_NAME" \
            "$WS_HUB_CONTAINER_NAME=$PREVIOUS_WS_HUB_IMAGE" \
            --namespace "$K8S_NAMESPACE"; then
            echo "::error::Unable to restore the previous WS Hub image."
            rollback_failed=1
          elif ! kubectl rollout status "deployment/$WS_HUB_DEPLOYMENT_NAME" \
            --namespace "$K8S_NAMESPACE" --timeout=5m; then
            echo "::error::The restored WS Hub deployment did not become ready."
            rollback_failed=1
          fi

          if [[ "$rollback_failed" -ne 0 ]]; then
            exit 1
          fi
          echo "Deployment rollback completed after a failed verification gate."

      - name: Record DORA Lead Time for Changes
        # This runs only after the atomic rollout, smoke probes, and policy gate.
        id: dora
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        with:
          script: |
            const environment = process.env.DEPLOY_ENVIRONMENT
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            })

            const commitTs = new Date(commit.commit.author.date).getTime()
            const deployTs = Date.now()
            const leadTimeH = ((deployTs - commitTs) / 3_600_000).toFixed(2)
            const leadTimeMin = ((deployTs - commitTs) / 60_000).toFixed(0)

            core.setOutput('lead_time_hours', leadTimeH)
            core.notice(`DORA Lead Time for Changes: ${leadTimeH}h (${leadTimeMin} min)`)

            await core.summary
              .addHeading('DORA: Lead Time for Changes', 3)
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Environment', environment],
                ['Commit SHA', context.sha.slice(0, 7)],
                ['Commit author date', commit.commit.author.date],
                ['Deploy time (UTC)', new Date(deployTs).toISOString()],
                ['Lead time', `${leadTimeH} hours`],
              ])
              .write()

  rollback:
    name: Database rollback capability test
    runs-on: ubuntu-24.04
    needs: [deploy]
    if: ${{ inputs.environment == 'staging' }}
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test  # pragma: allowlist secret
          POSTGRES_DB: test_rollback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_rollback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release-sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Test database rollback
        # RZ-W8-07: Use PostgreSQL for rollback test — same dialect as production.
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_rollback  # pragma: allowlist secret
        run: |
          echo "Testing migration rollback capability..."
          uv run alembic upgrade head
          uv run alembic downgrade -1
          echo "✅ Rollback successful"
          uv run alembic upgrade head
          echo "✅ Re-upgrade successful"

  notify:
    name: Notify deployment status
    runs-on: ubuntu-24.04
    needs: [prepare, build-backend, deploy, rollback]
    if: always()
    steps:
      - name: Deployment summary
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_VERSION: ${{ needs.prepare.outputs.version }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          ROLLBACK_STATUS: ${{ needs.rollback.result }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          {
            printf "%s\n\n" "## Deployment Summary"
            printf "%s\n" "| Property | Value |"
            printf "%s\n" "|----------|-------|"
            printf "| Environment | \`%s\` |\n" "${DEPLOY_ENVIRONMENT}"
            printf "| Version | \`%s\` |\n" "${DEPLOY_VERSION}"
            printf "| Deploy Status | \`%s\` |\n" "${DEPLOY_STATUS}"
            printf "| Rollback Test | \`%s\` |\n\n" "${ROLLBACK_STATUS}"
            printf "**Triggered by:** @%s\n" "${TRIGGER_ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"
