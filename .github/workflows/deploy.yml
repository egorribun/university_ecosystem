name: Deploy (Blue-Green)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      # TD-W10-09: skip_tests input removed. Pre-deployment tests are mandatory.
      # If the test suite is too slow, parallelise via matrix strategy.
      # Fast deploy ≠ safe deploy — a broken migration that reaches production
      # can require manual DB rollback and extended downtime.

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions: read-all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Pre-deployment validation
    runs-on: ubuntu-latest
    if: ${{ true }}  # TD-W10-09: always run validation; skip_tests input removed
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test  # pragma: allowlist secret
          POSTGRES_DB: test_deploy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run critical tests
        env:
          OTEL_SDK_DISABLED: "true"
        run: uv run pytest -x -q --tb=short tests/

      - name: Verify migrations can downgrade
        # RZ-W8-07: Use PostgreSQL (not SQLite) — pgvector, JSONB, partial indexes
        # and FOR UPDATE locking don't exist in SQLite; a passing SQLite migration
        # can silently fail in production.
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_deploy  # pragma: allowlist secret
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ always() && needs.validate.result == 'success' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate version tag
        id: version
        run: |
          VERSION="${{ github.sha }}-$(date +%Y%m%d%H%M%S)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build Backend
    needs: [prepare]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: "backend"
      file: "backend.Dockerfile"
      tags: |
        ghcr.io/${{ github.repository }}/backend:${{ needs.prepare.outputs.version }}
        ghcr.io/${{ github.repository }}/backend:${{ inputs.environment }}
    secrets: inherit # pragma: allowlist secret

  build-frontend:
    name: Build Frontend
    needs: [prepare]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: "frontend"
      file: "frontend.Dockerfile"
      tags: |
        ghcr.io/${{ github.repository }}/frontend:${{ needs.prepare.outputs.version }}
        ghcr.io/${{ github.repository }}/frontend:${{ inputs.environment }}
    secrets: inherit # pragma: allowlist secret

  build-ws-hub:
    name: Build WS Hub
    needs: [prepare]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: "ws-hub"
      context: "."
      file: "services/ws-hub/Dockerfile"
      tags: |
        ghcr.io/${{ github.repository }}/ws-hub:${{ needs.prepare.outputs.version }}
        ghcr.io/${{ github.repository }}/ws-hub:${{ inputs.environment }}
    secrets: inherit # pragma: allowlist secret

  build-gateway:
    name: Build Gateway
    needs: [prepare]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: "gateway"
      context: "."
      file: "services/gateway/Dockerfile"
      tags: |
        ghcr.io/${{ github.repository }}/gateway:${{ needs.prepare.outputs.version }}
        ghcr.io/${{ github.repository }}/gateway:${{ inputs.environment }}
    secrets: inherit # pragma: allowlist secret

  build-file-processor:
    name: Build File Processor
    needs: [prepare]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: "file-processor"
      context: "."
      file: "services/file-processor/Dockerfile"
      tags: |
        ghcr.io/${{ github.repository }}/file-processor:${{ needs.prepare.outputs.version }}
        ghcr.io/${{ github.repository }}/file-processor:${{ inputs.environment }}
    secrets: inherit # pragma: allowlist secret

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs:
      [
        prepare,
        build-backend,
        build-frontend,
        build-ws-hub,
        build-gateway,
        build-file-processor,
      ]
    permissions:
      contents: read
      deployments: write
      id-token: write # Required for requesting the JWT for OIDC
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Cloud Provider Credentials (OIDC)
        # Replaces long-lived secrets with ephemeral, short-lived tokens via GitHub's OIDC provider.
        # Ensure the cloud provider's identity pool trusts this repository and environment.
        # NOTE (2026-03-06): Upgraded from v4 to v6. Requires GitHub Actions runner ≥ 2.327.1.
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.OIDC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy (placeholder)
        id: deploy
        run: |
          echo "::notice::Blue-Green deployment to ${{ inputs.environment }}"
          echo "Backend image: ${{ needs.build-backend.outputs.digest }}"
          echo "Frontend image: ${{ needs.build-frontend.outputs.digest }}"
          echo "WS Hub image: ${{ needs.build-ws-hub.outputs.digest }}"
          echo "Version: ${{ needs.prepare.outputs.version }}"

          # Placeholder for actual deployment commands
          # This would typically:
          # 1. Deploy to "green" environment
          # 2. Run health checks
          # 3. Switch traffic from "blue" to "green"
          # 4. Keep "blue" as rollback target

          echo "url=https://${{ inputs.environment }}.example.com" >> "$GITHUB_OUTPUT"

      - name: Record DORA Lead Time for Changes
        # DORA metric: time from triggering commit's author date to deployment.
        # GitHub Insights tracks Deployment Frequency automatically via the
        # 'environment' field above. Lead Time requires explicit calculation.
        id: dora
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // Fetch the triggering commit to get its author date
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            })

            const commitTs = new Date(commit.commit.author.date).getTime()
            const deployTs = Date.now()
            const leadTimeH = ((deployTs - commitTs) / 3_600_000).toFixed(2)
            const leadTimeMin = ((deployTs - commitTs) / 60_000).toFixed(0)

            core.setOutput('lead_time_hours', leadTimeH)
            core.notice(`DORA Lead Time for Changes: ${leadTimeH}h (${leadTimeMin} min)`)

            await core.summary
              .addHeading('DORA: Lead Time for Changes', 3)
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Environment', '${{ inputs.environment }}'],
                ['Commit SHA', context.sha.slice(0, 7)],
                ['Commit author date', commit.commit.author.date],
                ['Deploy time (UTC)', new Date(deployTs).toISOString()],
                ['Lead time', `${leadTimeH} hours`],
              ])
              .write()

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install requests
        # RZ-W8-08: Pin version — unpinned installs can break silently or inject
        # a supply-chain compromise at deploy time.
        run: pip install "requests==2.32.3"

      - name: Post-deployment smoke test
        run: python scripts/smoke_test.py
        env:
          GATEWAY_URL: "https://${{ inputs.environment }}-api.example.com/health"
          WS_HUB_URL: "https://${{ inputs.environment }}-ws.example.com/health"
          BACKEND_URL: "https://${{ inputs.environment }}.example.com/healthz"
          FRONTEND_URL: "https://${{ inputs.environment }}.example.com/"

  rollback:
    name: Rollback capability test
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ inputs.environment == 'staging' }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test  # pragma: allowlist secret
          POSTGRES_DB: test_rollback
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Test database rollback
        # RZ-W8-07: Use PostgreSQL for rollback test — same dialect as production.
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_rollback  # pragma: allowlist secret
        run: |
          echo "Testing migration rollback capability..."
          uv run alembic upgrade head
          uv run alembic downgrade -1
          echo "✅ Rollback successful"
          uv run alembic upgrade head
          echo "✅ Re-upgrade successful"

  notify:
    name: Notify deployment status
    runs-on: ubuntu-latest
    needs: [prepare, build-backend, deploy, rollback]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Deployment Summary

          | Property | Value |
          |----------|-------|
          | Environment | `${{ inputs.environment }}` |
          | Version | `${{ needs.prepare.outputs.version }}` |
          | Deploy Status | `${{ needs.deploy.result }}` |
          | Rollback Test | `${{ needs.rollback.result }}` |

          **Triggered by:** @${{ github.actor }}
          SUMMARY
