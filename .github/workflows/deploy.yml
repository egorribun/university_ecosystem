name: Deploy (Blue-Green)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: "Skip pre-deployment tests"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Pre-deployment validation
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run critical tests
        env:
          OTEL_SDK_DISABLED: "true"
        run: uv run pytest -x -q --tb=short tests/

      - name: Verify migrations can downgrade
        env:
          DATABASE_URL: sqlite+aiosqlite:///./deploy-test.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ always() && (needs.validate.result == 'success' || inputs.skip_tests) }}
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for OIDC-based keyless cosign signing and SLSA provenance
      attestations: write  # Required to push SLSA provenance attestations to GHCR
      artifact-metadata: write # Required for actions/attest storage records
    outputs:
      backend_digest: ${{ steps.build_backend.outputs.digest }}
      frontend_digest: ${{ steps.build_frontend.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate version tag
        id: version
        run: |
          VERSION="${{ github.sha }}-$(date +%Y%m%d%H%M%S)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Install cosign (keyless image signing)
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.0.5

      - name: Build and push backend
        id: build_backend
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance: true generates an in-toto SLSA L2 provenance attestation,
          # making the build verifiable via 'cosign verify-attestation'.
          provenance: true
          sbom: true

      # MOD-04 (audit 2026-03-06): Scan the pushed image for OS-level CVEs before
      # signing it.  exit-code: "1" fails the build on CRITICAL/HIGH findings,
      # ensuring only clean images are signed and deployed.
      - name: Trivy — scan backend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload backend Trivy SARIF
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-backend.sarif

      - name: Sign backend image (keyless via Sigstore/Fulcio)
        # Attaches a Rekor-logged transparency entry — no long-lived keys needed.
        env:
          DIGEST: ${{ steps.build_backend.outputs.digest }}
          TAGS: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ steps.version.outputs.version }}
        run: |
          cosign sign --yes "${TAGS}@${DIGEST}"

      # MOD-04 (audit 2026-03-08 Wave 5): Generate and attest a CycloneDX SBOM
      # for the backend image.  The attestation is uploaded to GitHub's artifact
      # store and logged to Sigstore's Rekor, making it verifiable via:
      #   gh attestation verify <image>@<digest> --owner <owner>
      # Satisfies SOC 2 Type II requirement for software provenance.
      - name: Generate backend SBOM (CycloneDX)
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-backend.cyclonedx.json
          upload-artifact: false   # We attest rather than upload raw file

      - name: Attest backend SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          subject-digest: ${{ steps.build_backend.outputs.digest }}
          sbom-path: sbom-backend.cyclonedx.json
          push-to-registry: true

      - name: Build and push frontend
        id: build_frontend
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Trivy — scan frontend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload frontend Trivy SARIF
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-frontend.sarif

      - name: Sign frontend image (keyless via Sigstore/Fulcio)
        env:
          DIGEST: ${{ steps.build_frontend.outputs.digest }}
          TAGS: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ steps.version.outputs.version }}
        run: |
          cosign sign --yes "${TAGS}@${DIGEST}"

      - name: Generate frontend SBOM (CycloneDX)
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-frontend.cyclonedx.json
          upload-artifact: false

      - name: Attest frontend SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          subject-digest: ${{ steps.build_frontend.outputs.digest }}
          sbom-path: sbom-frontend.cyclonedx.json
          push-to-registry: true

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      deployments: write
      id-token: write # Required for requesting the JWT for OIDC
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Cloud Provider Credentials (OIDC)
        # Replaces long-lived secrets with ephemeral, short-lived tokens via GitHub's OIDC provider.
        # Ensure the cloud provider's identity pool trusts this repository and environment.
        # NOTE (2026-03-06): Upgraded from v4 to v6. Requires GitHub Actions runner ≥ 2.327.1.
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.OIDC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy (placeholder)
        id: deploy
        run: |
          echo "::notice::Blue-Green deployment to ${{ inputs.environment }}"
          echo "Backend image: ${{ needs.build-and-push.outputs.backend_digest }}"
          echo "Frontend image: ${{ needs.build-and-push.outputs.frontend_digest }}"
          echo "Version: ${{ needs.build-and-push.outputs.version }}"

          # Placeholder for actual deployment commands
          # This would typically:
          # 1. Deploy to "green" environment
          # 2. Run health checks
          # 3. Switch traffic from "blue" to "green"
          # 4. Keep "blue" as rollback target

          echo "url=https://${{ inputs.environment }}.example.com" >> "$GITHUB_OUTPUT"

      - name: Record DORA Lead Time for Changes
        # DORA metric: time from triggering commit's author date to deployment.
        # GitHub Insights tracks Deployment Frequency automatically via the
        # 'environment' field above. Lead Time requires explicit calculation.
        id: dora
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // Fetch the triggering commit to get its author date
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            })

            const commitTs = new Date(commit.commit.author.date).getTime()
            const deployTs = Date.now()
            const leadTimeH = ((deployTs - commitTs) / 3_600_000).toFixed(2)
            const leadTimeMin = ((deployTs - commitTs) / 60_000).toFixed(0)

            core.setOutput('lead_time_hours', leadTimeH)
            core.notice(`DORA Lead Time for Changes: ${leadTimeH}h (${leadTimeMin} min)`)

            await core.summary
              .addHeading('DORA: Lead Time for Changes', 3)
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Environment', '${{ inputs.environment }}'],
                ['Commit SHA', context.sha.slice(0, 7)],
                ['Commit author date', commit.commit.author.date],
                ['Deploy time (UTC)', new Date(deployTs).toISOString()],
                ['Lead time', `${leadTimeH} hours`],
              ])
              .write()

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install requests
        run: pip install requests

      - name: Post-deployment smoke test
        run: python scripts/smoke_test.py
        env:
          GATEWAY_URL: "https://${{ inputs.environment }}-api.example.com/health"
          WS_HUB_URL: "https://${{ inputs.environment }}-ws.example.com/health"
          BACKEND_URL: "https://${{ inputs.environment }}.example.com/healthz"
          FRONTEND_URL: "https://${{ inputs.environment }}.example.com/"

  rollback:
    name: Rollback capability test
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ inputs.environment == 'staging' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Test database rollback
        env:
          DATABASE_URL: sqlite+aiosqlite:///./rollback-test.db
        run: |
          echo "Testing migration rollback capability..."
          uv run alembic upgrade head
          uv run alembic downgrade -1
          echo "✅ Rollback successful"
          uv run alembic upgrade head
          echo "✅ Re-upgrade successful"

  notify:
    name: Notify deployment status
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy, rollback]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Deployment Summary

          | Property | Value |
          |----------|-------|
          | Environment | `${{ inputs.environment }}` |
          | Version | `${{ needs.build-and-push.outputs.version }}` |
          | Deploy Status | `${{ needs.deploy.result }}` |
          | Rollback Test | `${{ needs.rollback.result }}` |

          **Triggered by:** @${{ github.actor }}
          SUMMARY
