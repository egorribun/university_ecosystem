# Wave 112 (foundation) — Chromatic visual regression testing.
#
# Storybook + @chromatic-com/storybook are already wired locally
# (.storybook/main.ts has the addon). This workflow uploads built stories
# to Chromatic for visual diff review on every PR.
#
# Setup: add CHROMATIC_PROJECT_TOKEN to repo Secrets. Without the secret
# the job is skipped (safe no-op for forks and unauthenticated PRs).
#
# Baselines accepted in SW3 (after consistency tokens settle) — until then
# Chromatic runs in collect-only mode.
#
# ✅ Wave 123 SW1 (2026-04-30) — UNBLOCKED. Storybook + Vite 8/Rolldown
# runtime failure (`__STORYBOOK_MODULE_CORE_EVENTS_PREVIEW_ERRORS__ is
# not defined`) resolved via `build.rolldownOptions.output.strictExecutionOrder:
# true` in `.storybook/main.ts` viteFinal hook. Per the canonical workaround
# documented in vitejs/vite#21948 (closed 2026-04-07 by Vite 8.0.6), Rolldown's
# module execution order optimization must be disabled for Storybook's
# custom module loader to wire up its globals before chunks try to read
# them. Build verified: storybook-static loads cleanly, EventCard story
# renders with 0 console errors (chrome-devtools-mcp 2026-04-30).
#
# Upstream issue resolution chain (all closed as of 2026-04-30):
#
#   - https://github.com/storybookjs/storybook/issues/33789 (Vite 8 umbrella; closed 2026-03-10)
#   - https://github.com/vitejs/rolldown-vite/issues/562 (`__STORYBOOK_MODULE_*`; closed 2026-03-19 as DUPLICATE of vite#21948)
#   - https://github.com/storybookjs/storybook/issues/31711 (PREVIEW_API; closed 2025-10-13)
#   - https://github.com/rolldown/rolldown/issues/3982 (`import.meta.glob`; closed 2025-09-11)
#   - https://github.com/vitejs/vite/issues/21948 (root cause; closed 2026-04-07 by Vite 8.0.6)
#
# ✅ Wave 201 (2026-05-30) — ACTIVATION-READY. The 6 non-deterministic stories
# (WeatherParticles + MapLibreMap canvas/WebGL; ParticleAuthBackground +
# MfaChallengeView particle bg; EventCard relative-time; FlipCountdown live
# clock) carry `parameters.chromatic.disableSnapshot: true` so the first baseline
# is clean. Full activation runbook: docs/audits/AUDIT_WAVE201.md.
#
# To enable Chromatic baseline (USER actions in repo settings):
#
#   1. Add `CHROMATIC_PROJECT_TOKEN` Secret — value is NOT hardcoded here; it
#      lives in your Chromatic dashboard / `memory/wave122_chromatic_upstream.md`.
#   2. Set `CHROMATIC_ENABLED=true` repo variable.
#   3. Open/merge a PR touching `frontend/**` → this workflow triggers + uploads
#      built stories. A merge to `main` auto-accepts the initial baseline
#      (`autoAcceptChanges` below); subsequent PRs then surface diffs.
#   4. Accept/review baselines in the Chromatic dashboard.
#   5. (Optional follow-up, after the baseline is trusted) flip
#      `exitZeroOnChanges: true → false` below to BLOCK PRs on un-accepted diffs.
#
# See `memory/wave122_chromatic_upstream.md` for full diagnosis history,
# Storybook/Vite version requirements, and durability notes for the
# `strictExecutionOrder` workaround.

name: Chromatic

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/chromatic.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/chromatic.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Chromatic Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip cleanly when the secret is not configured (forks, fresh checkouts).
    if: ${{ vars.CHROMATIC_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Chromatic needs full git history to detect baseline diffs.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-pack
        # W142 polish-v3 fix (replicates W141 polish-v2 from visual-audit.yml):
        # taiki-e/install-action@v2.77.5 hardcodes drager/wasm-pack releases
        # URL → 404 as of 2026-05-11; rustwasm/wasm-pack is the canonical
        # repo since v0.14.0 (2026-01-20) but install-action doesn't auto-
        # follow. Replaced with the official wasm-pack curl installer from
        # rustwasm.github.io (same fix already in visual-audit.yml line 180).
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Build WASM modules
        # Wave 146 polish-v5 — 3-attempt retry around `wasm-pack build` to
        # absorb transient GitHub Releases binaryen download flakes (W139
        # (z) #5 family). `wasm-pack build` internally fetches binaryen
        # (wasm-opt) from `github.com/WebAssembly/binaryen/releases` on first
        # run per Rust target; transient network errors there cause hard
        # build failures. Same retry pattern as `visual-audit.yml` (W140 SW4
        # iter3) — 3 attempts with 10s backoff; if all 3 fail, the build
        # step exits non-zero on the last attempt and the CI step fails.
        run: |
          for i in 1 2 3; do
            (wasm-pack build rust-crypto --target web && \
             wasm-pack build wasm-sanitizer --target web) && exit 0
            echo "wasm-pack build attempt $i failed; retrying in 10s..."
            sleep 10
          done
          echo "wasm-pack build failed after 3 attempts" >&2
          exit 1

      - name: Publish to Chromatic
        # SHA-pinned per RZ-22-03 convention (no mutable @v tags).
        uses: chromaui/action@7aca53e7aa87489020a97f633c1e7e82c12e5973 # v17.0.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend
          # Collect-only / REPORT mode (W201): diffs are visible but don't block PRs.
          # Enforce by flipping this to `false` once the baseline is trusted
          # (W201 documented this as a deliberate post-baseline follow-up).
          exitZeroOnChanges: true
          onlyChanged: true
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' }}
