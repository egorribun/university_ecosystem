# Chromatic visual regression workflow. The Storybook addon is configured in
# `.storybook/main.ts`; this workflow runs only on trusted default-branch pushes
# or a repository_dispatch that verifies the current `main` SHA. Pull requests
# do not receive a runner or the project token.
#
# Six proven nondeterministic stories opt out of Chromatic snapshots:
# - WeatherParticles: continuously randomized canvas particles.
# - MapLibreMap: WebGL output and remote map tiles vary with GPU/network state.
# - ParticleAuthBackground and MfaChallengeView: animated particle backgrounds
#   cannot be frozen into stable images.
# - EventCard: relative-date/status text changes with wall-clock time.
# - FlipCountdown: live countdown text changes with wall-clock time.
# Keep these six exclusions limited to snapshot capture; their behavior and
# accessibility still need coverage in the relevant tests. Add no new exclusion
# without reproducing the source of nondeterminism and reviewing the impact.
#
# Activation requires available plan/quota, the repository secret
# `CHROMATIC_PROJECT_TOKEN`, both repository variables
# `CHROMATIC_ENABLED=true` and `CHROMATIC_BILLING_ACTIVE=true`, and removal of
# the `skip: true` guard below. A trusted `main` run collects/updates the
# baseline; inspect it in the Chromatic dashboard while `exitZeroOnChanges`
# remains `true`. Only consider `false` after the baseline is trusted. This
# workflow currently runs on `main`, so that setting alone does not add a
# pull-request gate. Keep `autoAcceptChanges` scoped to trusted `main`.
name: Chromatic

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/chromatic.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/chromatic.yml"
  # Manual reruns use repository_dispatch so the workflow is always loaded
  # from the default branch, never from a caller-selected ref.
  repository_dispatch:
    types: [run-chromatic]

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Chromatic Visual Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The variable gate keeps this standalone workflow from running until
    # Chromatic plan/quota is available. It is independent of ci.yml's
    # `ci-success` aggregate. The publish step's `skip: true` is a second
    # disabled-by-default guard and posts no snapshots.
    #
    # To activate, confirm plan/quota, set `CHROMATIC_PROJECT_TOKEN`, set both
    # repository variables to `true`, then remove `skip: true` below. Keep the
    # main-only event condition and report-only mode while the baseline is
    # collected and reviewed.
    # The publish action receives a project token and executes repository code;
    # keep it on trusted default-branch events only. Pull requests get no
    # runner and no token, even when Chromatic is enabled.
    if: ${{ vars.CHROMATIC_ENABLED == 'true' && vars.CHROMATIC_BILLING_ACTIVE == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'repository_dispatch') }}
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Chromatic needs full git history to detect baseline diffs.
          fetch-depth: 0

      - name: Verify trusted main source
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Chromatic manual dispatch refuses to run outside protected main."
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main --depth=1
          trusted_sha="$(git rev-parse refs/remotes/origin/main)"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Protected main did not resolve to a full commit SHA."
            exit 1
          fi
          if [[ "$checked_out_sha" != "$trusted_sha" || "$EVENT_SHA" != "$trusted_sha" || "$WORKFLOW_SHA" != "$trusted_sha" ]]; then
            echo "::error::Workflow source is not the current immutable protected-main commit."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install wasm-pack
        # W142 polish-v3 fix (replicates W141 polish-v2 from visual-audit.yml):
        # taiki-e/install-action@v2.77.5 hardcodes drager/wasm-pack releases
        # URL → 404 as of 2026-05-11; rustwasm/wasm-pack is the canonical
        # repo since v0.14.0 (2026-01-20) but install-action doesn't auto-
        # follow. Replaced with the official wasm-pack curl installer from
        # rustwasm.github.io (same fix already in visual-audit.yml line 180).
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Setup Rust toolchain
        # Pin the compiler used for tracked WASM package generation.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # pinned action
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Build WASM modules
        # Wave 146 polish-v5 — 3-attempt retry around `wasm-pack build` to
        # absorb transient GitHub Releases binaryen download flakes (W139
        # (z) #5 family). `wasm-pack build` internally fetches binaryen
        # (wasm-opt) from `github.com/WebAssembly/binaryen/releases` on first
        # run per Rust target; transient network errors there cause hard
        # build failures. Same retry pattern as `visual-audit.yml` (W140 SW4
        # iter3) — 3 attempts with 10s backoff; if all 3 fail, the build
        # step exits non-zero on the last attempt and the CI step fails.
        run: |
          for i in 1 2 3; do
            (wasm-pack build rust-crypto --target web && \
             wasm-pack build wasm-sanitizer --target web) && exit 0
            echo "wasm-pack build attempt $i failed; retrying in 10s..."
            sleep 10
          done
          echo "wasm-pack build failed after 3 attempts" >&2
          exit 1

      - name: Publish to Chromatic
        # SHA-pinned per RZ-22-03 convention (no mutable @v tags).
        uses: chromaui/action@bb3b582719a93c1828c5e520e62992b2937d7889 # v18.9.4
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend
          # Disabled-by-default safety guard. Remove only after confirming the
          # project plan/quota and configuring the token and repository variables.
          skip: true
          # Collect-only / report mode: visual changes do not fail this workflow.
          # Keep this true through baseline review; this workflow currently runs
          # on trusted-main events, not pull requests.
          exitZeroOnChanges: true
          onlyChanged: true
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' }}
