# Wave 112 (foundation) — Chromatic visual regression testing.
#
# Storybook + @chromatic-com/storybook are already wired locally
# (.storybook/main.ts has the addon). This workflow uploads built stories
# to Chromatic for visual diff review on every PR.
#
# Setup: add CHROMATIC_PROJECT_TOKEN to repo Secrets. Without the secret
# the job is skipped (safe no-op for forks and unauthenticated PRs).
#
# Baselines accepted in SW3 (after consistency tokens settle) — until then
# Chromatic runs in collect-only mode.
#
# ⚠ Wave 122 SW5 — STILL BLOCKED by upstream Storybook + Vite 8 / Rolldown
# integration gaps. `vars.CHROMATIC_ENABLED` should remain unset until at
# least one of these upstream issues closes:
#
#   - https://github.com/storybookjs/storybook/issues/33789
#       (Storybook umbrella tracker for Vite 8/Rolldown support)
#   - https://github.com/vitejs/rolldown-vite/issues/562
#       (`__STORYBOOK_MODULE_*` globals not injected — primary failure)
#   - https://github.com/storybookjs/storybook/issues/31711
#       (exact match: SB+Rolldown __STORYBOOK_MODULE_PREVIEW_API__ undefined)
#   - https://github.com/rolldown/rolldown/issues/3982
#       (`import.meta.glob` Rolldown bug — blocks W121 SW7 Webpack swap fallback)
#
# History: W120 SW8 first hit the `__STORYBOOK_MODULE_*` runtime failure.
# W121 SW7 attempted the Webpack-builder swap (60-min hard time-box,
# reverted at T+10 min) and ran into `import.meta.glob` instead — confirming
# both upstream issues affect us. See `memory/wave122_chromatic_upstream.md`
# for full upstream issue tracking and quarterly monitoring action.
#
# When upstream lands a fix: re-attempt by running `npm run build-storybook`
# end-to-end + `npm run chromatic` locally with token. If clean, flip
# `vars.CHROMATIC_ENABLED=true` to enable this workflow on PRs.

name: Chromatic

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/chromatic.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/chromatic.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Chromatic Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip cleanly when the secret is not configured (forks, fresh checkouts).
    if: ${{ vars.CHROMATIC_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Chromatic needs full git history to detect baseline diffs.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-pack
        uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486 # v2.75.18
        with:
          tool: wasm-pack

      - name: Build WASM modules
        run: |
          wasm-pack build rust-crypto --target web
          wasm-pack build wasm-sanitizer --target web

      - name: Publish to Chromatic
        # SHA-pinned per RZ-22-03 convention (no mutable @v tags).
        uses: chromaui/action@2bd0e8db83b13ba0d6e74feb5e6a3bd61d4fe4c2 # v13.4.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend
          # Wave 112 SW1: collect-only mode until SW3 consistency baseline.
          # Switch to `exitZeroOnChanges: false` after SW3 to enforce.
          exitZeroOnChanges: true
          onlyChanged: true
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' }}
