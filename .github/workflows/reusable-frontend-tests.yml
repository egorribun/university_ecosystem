# Reusable Frontend Tests Workflow
name: Frontend Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      working-directory:
        description: "Frontend directory"
        required: false
        type: string
        default: "frontend"
      run-e2e:
        description: "Run Playwright E2E tests"
        required: false
        type: boolean
        default: false
      run-lighthouse:
        description: "Run Lighthouse audits"
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
        description: "Codecov upload token"

jobs:
  unit-tests-shard:
    name: Unit Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-pack
        # W142 polish-v3 — taiki-e/install-action wasm-pack broken (drager/
        # wasm-pack 404; rustwasm/wasm-pack canonical since v0.14.0). Same
        # fix as W141 polish-v2 visual-audit.yml + W142 chromatic.yml.
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Build WASM modules
        run: |
          wasm-pack build rust-crypto --target web
          wasm-pack build wasm-sanitizer --target web

      - name: Run type check
        run: npm run typecheck

      - name: Run unit-test shard
        # Each shard sees only a fraction of the repository and therefore
        # cannot satisfy the repository-wide coverage thresholds on its own.
        # The merged `unit-tests` job below owns the single global coverage
        # and differential gate; keep shard runs focused on test correctness.
        run: >-
          npm run test:ci --
          --shard=${{ matrix.shard }}/4
          --coverage.thresholds.lines=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.statements=0
        env:
          CI: "true"

      - name: Upload Vitest shard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-vitest-report-shard-${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/vitest-report.xml
          if-no-files-found: warn

      - name: Upload frontend coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-shard-${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/coverage/

  # Keep a stable `Frontend Tests / Unit Tests` check for branch protection.
  # The matrix above owns execution; this job owns the merged, repository-wide
  # coverage artifact and the differential gate.
  unit-tests:
    name: Unit Tests
    needs: unit-tests-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Fail if a test shard failed
        if: ${{ needs.unit-tests-shard.result != 'success' }}
        run: |
          echo "::error::At least one frontend Vitest shard did not pass."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production-only client contracts
        run: npm run test:client-production

      - name: Download frontend coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frontend-coverage-shard-*
          path: ${{ inputs.working-directory }}/.coverage-shards
          merge-multiple: false

      - name: Merge frontend coverage shards
        run: node scripts/merge-vitest-coverage.mjs --input=.coverage-shards --output=coverage --expected-shards=4

      - name: Download Vitest shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frontend-vitest-report-shard-*
          path: ${{ inputs.working-directory }}/.vitest-reports
          merge-multiple: false

      - name: Set up Python for differential coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv for differential coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check differential frontend coverage
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          COMPARE_BRANCH: ${{ github.base_ref }}
        run: |
          uv sync --frozen
          git fetch origin $env:COMPARE_BRANCH
          # The current authored frontend diff is fully covered; keep the
          # ratchet strict so newly changed source cannot reintroduce debt.
          uv run diff-cover frontend/coverage/lcov.info --compare-branch=origin/$env:COMPARE_BRANCH --fail-under=100

      - name: Upload Vitest report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-vitest-report
          path: ${{ inputs.working-directory }}/.vitest-reports/
          if-no-files-found: warn

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: ${{ inputs.working-directory }}/coverage/

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./${{ inputs.working-directory }}/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-pack
        # W142 polish-v3 — taiki-e/install-action wasm-pack broken (drager/
        # wasm-pack 404; rustwasm/wasm-pack canonical since v0.14.0). Same
        # fix as W141 polish-v2 visual-audit.yml + W142 chromatic.yml.
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Build WASM modules
        run: |
          wasm-pack build rust-crypto --target web
          wasm-pack build wasm-sanitizer --target web

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # MOD-43-01 (audit 2026-03-29 Wave 43): Token sync drift gate.
      # Ensures CSS → TS token mirror stays in sync. Fails if sync produces a diff.
      - name: Verify token sync (CSS ↔ TS)
        run: |
          npm run tokens:sync
          git diff --exit-code src/theme/tokens.ts || {
            echo "::error::tokens.ts is out of sync with CSS tokens. Run 'npm run tokens:sync' and commit."
            exit 1
          }

      # Wave 112 — i18n EN↔RU parity gate (was manual via npm run i18n:check,
      # now enforced in CI so missing translations fail the build).
      - name: Verify i18n EN↔RU parity
        run: npm run i18n:check

      - name: Run ts-prune (dead code check)
        run: npm run lint:deadcode

      - name: Run depcheck (dependency check)
        run: npm run lint:depcheck

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # P0-01 (audit 2026-03-06): Replaced unsafe shell-piped installer with taiki-e/install-action.
      # The action verifies SHA256 checksums from official GitHub releases, preventing
      # supply chain attacks via DNS hijacking or CDN compromise (OWASP CI/CD C-PPE-1).
      - name: Install wasm-pack
        # W142 polish-v3 — taiki-e/install-action wasm-pack broken (drager/
        # wasm-pack 404; rustwasm/wasm-pack canonical since v0.14.0). Same
        # fix as W141 polish-v2 visual-audit.yml + W142 chromatic.yml.
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Build rust-crypto
        run: |
          cd rust-crypto
          wasm-pack build --target web

      - name: Build app
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist
          if-no-files-found: error

  # MOD-23-06 (audit 2026-03-25 Wave 23): Bundle size analysis.
  # Alerts on >500 KB main chunk growth and generates a JSON report for trend tracking.
  bundle-analysis:
    name: Bundle Analysis
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Analyze bundle size
        run: |
          # Generate JSON report of all chunks
          echo '{}' > bundle-report.json
          total_size=0
          main_chunk_size=0
          for f in dist/client/assets/*.js; do
            size=$(wc -c < "$f")
            name=$(basename "$f")
            total_size=$((total_size + size))
            # Track main/index chunk specifically
            if echo "$name" | grep -qE '^(index|main)'; then
              main_chunk_size=$size
            fi
            echo "  $name: $(( size / 1024 )) KB"
          done
          echo ""
          echo "Total JS: $(( total_size / 1024 )) KB"
          echo "Main chunk: $(( main_chunk_size / 1024 )) KB"
          echo ""
          # Fail if main chunk exceeds 500 KB (gzipped will be ~150 KB)
          LIMIT_KB=500
          main_kb=$(( main_chunk_size / 1024 ))
          if [ "$main_kb" -gt "$LIMIT_KB" ]; then
            echo "::error::Main chunk ($main_kb KB) exceeds $LIMIT_KB KB budget"
            exit 1
          fi
          echo "::notice::Bundle analysis passed — main chunk $main_kb KB (limit: $LIMIT_KB KB)"

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-report
          path: ${{ inputs.working-directory }}/bundle-report.json
          if-no-files-found: warn

  lighthouse:
    name: Lighthouse Audit
    if: ${{ inputs.run-lighthouse }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Download built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-pack
        # W142 polish-v3 — taiki-e/install-action wasm-pack broken (drager/
        # wasm-pack 404; rustwasm/wasm-pack canonical since v0.14.0). Same
        # fix as W141 polish-v2 visual-audit.yml + W142 chromatic.yml.
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Run Lighthouse CI
        run: npm run lhci

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-reports
          path: ${{ inputs.working-directory }}/.lighthouseci
          if-no-files-found: warn
