# Reusable Frontend Tests Workflow
name: Frontend Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "24"
      working-directory:
        description: "Frontend directory"
        required: false
        type: string
        default: "frontend"
      run-e2e:
        description: "Run Playwright E2E tests"
        required: false
        type: boolean
        default: false
      run-lighthouse:
        description: "Run Lighthouse audits"
        required: false
        type: boolean
        default: false
      wasm-artifact-id:
        description: "Optional same-run server-issued WASM artifact id"
        required: false
        type: string
        default: ""
      wasm-artifact-name:
        description: "Optional same-run WASM artifact name"
        required: false
        type: string
        default: ""
      wasm-artifact-digest:
        description: "Optional same-run WASM artifact archive digest"
        required: false
        type: string
        default: ""
jobs:
  # Validate or (for compatibility callers) compile the immutable WASM
  # packages once per workflow attempt. The CI caller supplies the shared E2E
  # producer artifact so frontend and browser jobs never rebuild Rust in the
  # same workflow run. Standalone callers retain the old producer fallback.
  wasm-build:
    name: Build WASM modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Validate shared WASM artifact input contract
        if: ${{ inputs.wasm-artifact-id != '' || inputs.wasm-artifact-name != '' || inputs.wasm-artifact-digest != '' }}
        shell: bash
        env:
          WASM_ARTIFACT_ID: ${{ inputs.wasm-artifact-id }}
          WASM_ARTIFACT_NAME: ${{ inputs.wasm-artifact-name }}
          WASM_ARTIFACT_DIGEST: ${{ inputs.wasm-artifact-digest }}
        run: |
          set -euo pipefail
          if [[ -z "$WASM_ARTIFACT_ID" || -z "$WASM_ARTIFACT_NAME" || -z "$WASM_ARTIFACT_DIGEST" ]]; then
            echo "::error::Shared WASM artifact mode requires all three inputs (id, name, digest)."
            exit 1
          fi
          [[ "$WASM_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WASM_ARTIFACT_NAME" =~ ^frontend-e2e-wasm-[0-9]+-[0-9]+-[0-9a-f]{40}$ ]]
          [[ "$WASM_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Download shared immutable WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: ${{ inputs.working-directory }}

      - name: Verify shared WASM artifact digest and provenance
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ inputs.wasm-artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.wasm-artifact-name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.wasm-artifact-digest }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_url}" -o "${response_file}"
          actual_digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("digest", ""))' "${response_file}")"
          if [[ "$actual_digest" =~ ^[0-9a-f]{64}$ ]]; then actual_digest="sha256:${actual_digest}"; fi
          [[ "$actual_digest" == "$EXPECTED_ARTIFACT_DIGEST" ]]
          test -s WASM_PROVENANCE.json
          test -s WASM_INVENTORY.json
          export EXPECTED_ARTIFACT_NAME EXPECTED_SHA EXPECTED_PR_HEAD_SHA EXPECTED_WORKFLOW_REF EXPECTED_WORKFLOW_SHA EXPECTED_RUN_ID EXPECTED_RUN_ATTEMPT EXPECTED_EVENT REPOSITORY
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          provenance = json.loads(Path("WASM_PROVENANCE.json").read_text(encoding="utf-8"))
          inventory = json.loads(Path("WASM_INVENTORY.json").read_text(encoding="utf-8"))
          expected = {
              "artifact_name": os.environ["EXPECTED_ARTIFACT_NAME"],
              "artifact_kind": "e2e-wasm",
              "repository": os.environ["REPOSITORY"],
              "source_sha": os.environ["EXPECTED_SHA"],
              "pr_head_sha": os.environ["EXPECTED_PR_HEAD_SHA"],
              "workflow_ref": os.environ["EXPECTED_WORKFLOW_REF"],
              "workflow_sha": os.environ["EXPECTED_WORKFLOW_SHA"],
              "run_id": int(os.environ["EXPECTED_RUN_ID"]),
              "run_attempt": int(os.environ["EXPECTED_RUN_ATTEMPT"]),
              "event": os.environ["EXPECTED_EVENT"],
              "schema_version": 1,
          }
          for key, value in expected.items():
              if provenance.get(key) != value:
                  raise SystemExit(f"WASM provenance mismatch for {key}")
          files = inventory.get("files")
          if inventory.get("schema_version") != 1 or not isinstance(files, list) or not files:
              raise SystemExit("WASM inventory is missing or malformed")
          canonical = json.dumps({"schema_version": 1, "files": files}, sort_keys=True, separators=(",", ":")).encode()
          if inventory.get("inventory_sha256") != hashlib.sha256(canonical).hexdigest():
              raise SystemExit("WASM inventory digest mismatch")
          expected_paths = set()
          for record in files:
              relative = record.get("path") if isinstance(record, dict) else None
              if not isinstance(relative, str) or relative.startswith("/") or ".." in Path(relative).parts:
                  raise SystemExit(f"invalid WASM inventory path: {relative!r}")
              path = root / relative
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(root):
                  raise SystemExit(f"unsafe or missing WASM inventory path: {relative!r}")
              if relative in expected_paths or path.stat().st_size != record.get("size"):
                  raise SystemExit(f"WASM inventory mismatch: {relative}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != record.get("sha256"):
                  raise SystemExit(f"WASM digest mismatch: {relative}")
              expected_paths.add(relative)
          actual_paths = {
              path.relative_to(root).as_posix()
              for package in (root / "rust-crypto/pkg", root / "wasm-sanitizer/pkg")
              for path in package.rglob("*")
              if path.is_file() and not path.is_symlink()
          }
          if actual_paths != expected_paths or provenance.get("inventory_sha256") != inventory["inventory_sha256"]:
              raise SystemExit("WASM inventory does not exactly match generated package files")
          PY
          node scripts/verify-wasm-artifacts.mjs

      - name: Setup Rust toolchain
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        # Pin the compiler that produced the checked-in WASM bytes.  The
        # hosted runner's `stable` channel is mutable and a compiler update
        # changes optimized binaries, which must fail closed at provenance
        # validation rather than silently replacing the release artifact.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Install pinned wasm-opt
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        shell: bash
        run: |
          set -euo pipefail
          binaryen_version="version_117"
          binaryen_sha256="3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212" # public Binaryen release checksum
          binaryen_root="$RUNNER_TEMP/binaryen-$binaryen_version"
          binaryen_archive="$RUNNER_TEMP/binaryen-$binaryen_version-x86_64-linux.tar.gz"
          binaryen_url="https://github.com/WebAssembly/binaryen/releases/download/$binaryen_version/binaryen-$binaryen_version-x86_64-linux.tar.gz"
          rm -rf -- "$binaryen_root"
          mkdir -p -- "$binaryen_root"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$binaryen_archive" "$binaryen_url"
          printf '%s  %s\n' "$binaryen_sha256" "$binaryen_archive" \
            | sha256sum --check --strict
          tar --extract --file "$binaryen_archive" --strip-components=1 --directory "$binaryen_root"
          test -x "$binaryen_root/bin/wasm-opt"
          "$binaryen_root/bin/wasm-opt" --version | grep -Fq "version 117"
          echo "$binaryen_root/bin" >> "$GITHUB_PATH"

      - name: Build immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          wasm-pack --version
          rustup target add wasm32-unknown-unknown
          rustup target list --installed | grep -Fxq "wasm32-unknown-unknown"
          # Rust embeds source and dependency paths in optimized WASM custom
          # sections. Remap runner-specific paths to canonical Linux paths
          # while preserving any caller-provided flags.
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$HOME/.cargo=/usr/local/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/work"
          # wasm-pack installs shared wasm-bindgen/wasm-opt helpers under the
          # user's cache.  Running both producers concurrently races those
          # cache writes and can produce bytes that drift from the checked-in
          # source-bound provenance.  Keep the two builds ordered; the small
          # serialization cost is cheaper than a flaky retry and preserves
          # reproducible artifact bytes.
          wasm-pack build rust-crypto --target web --release
          wasm-pack build wasm-sanitizer --target web --release
          if [[ ! -s rust-crypto/pkg/uni_wasm_crypto_bg.wasm || ! -s wasm-sanitizer/pkg/wasm_sanitizer_bg.wasm ]]; then
            echo "::error::WASM build did not produce both binary modules"
            exit 1
          fi
          node scripts/verify-wasm-artifacts.mjs

      - name: Upload immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ inputs.working-directory }}/rust-crypto/pkg
            ${{ inputs.working-directory }}/wasm-sanitizer/pkg
          if-no-files-found: error
          overwrite: false
          retention-days: 1
          compression-level: 0

  unit-tests-shard:
    name: Unit Tests (shard ${{ matrix.shard }}/4)
    needs: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}

      - name: Download shared immutable WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Clean frontend shard coverage outputs
        run: rm -rf -- coverage

      - name: Run unit-test shard
        # Each shard sees only a fraction of the repository and therefore
        # cannot satisfy the repository-wide coverage thresholds on its own.
        # The merged `unit-tests` job below owns the single global coverage
        # and differential gate; keep shard runs focused on test correctness.
        run: >-
          npm run test:ci --
          --shard=${{ matrix.shard }}/4
          --coverage.thresholds.lines=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.statements=0
        env:
          CI: "true"

      - name: Write frontend shard provenance
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          SHARD_ID: ${{ matrix.shard }}
          ARTIFACT_NAME: frontend-coverage-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -s frontend/coverage/coverage-final.json
          node_version="$(node -p 'process.versions.node')"
          vitest_version="$(node -p 'require("./frontend/node_modules/vitest/package.json").version')"
          python3 scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output frontend/coverage/coverage-provenance.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "$ARTIFACT_NAME" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "node=$node_version" \
            --tool-version "vitest=$vitest_version" \
            --tool-version quality-provenance=2.0.0 \
            --report "frontend-shard|istanbul-json|frontend/coverage/coverage-final.json|frontend/.coverage-shards/$ARTIFACT_NAME/coverage-final.json"

      - name: Upload Vitest shard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-vitest-report-shard-${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/vitest-report.xml
          if-no-files-found: error

      - name: Upload frontend coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ inputs.working-directory }}/coverage/coverage-final.json
            ${{ inputs.working-directory }}/coverage/coverage-provenance.json
          if-no-files-found: error

  # Keep a stable `Frontend Tests / Unit Tests` check for branch protection.
  # The matrix above owns execution; this job owns the merged, repository-wide
  # coverage artifact and the differential gate.
  unit-tests:
    name: Unit Tests
    needs: unit-tests-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Fail if a test shard failed
        if: ${{ needs.unit-tests-shard.result != 'success' }}
        # This guard intentionally runs before checkout so a failed shard
        # exits quickly.  The repository-relative default working directory
        # does not exist until checkout, therefore pin the guard to the
        # runner workspace explicitly.
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::At least one frontend Vitest shard did not pass."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production-only client contracts
        run: npm run test:client-production

      - name: Clean merged frontend coverage outputs
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- frontend/.coverage-shards
          rm -rf -- frontend/.vitest-reports
          rm -rf -- frontend/coverage

      - name: Download frontend coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frontend-coverage-shard-*-attempt-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/.coverage-shards
          merge-multiple: false

      - name: Verify frontend shard provenance
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(find frontend/.coverage-shards -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 4
          for shard in 1 2 3 4; do
            artifact="frontend-coverage-shard-${shard}-attempt-${RUN_ATTEMPT}"
            shard_root="frontend/.coverage-shards/$artifact"
            test "$(find "$shard_root" -maxdepth 1 -type f | wc -l)" -eq 2
            test -s "$shard_root/coverage-final.json"
            test -s "$shard_root/coverage-provenance.json"
            python3 scripts/quality/coverage_provenance.py verify \
              --repository-root "$GITHUB_WORKSPACE" \
              --expected-sha "$EXPECTED_SHA" \
              --expected-repository "$WORKFLOW_REPOSITORY" \
              --expected-run-id "$RUN_ID" \
              --expected-run-attempt "$RUN_ATTEMPT" \
              --expected-workflow-ref "$WORKFLOW_REF" \
              --expected-workflow-sha "$WORKFLOW_SHA" \
              --expected-event "$WORKFLOW_EVENT" \
              --expected-job unit-tests-shard \
              --expected-artifact "$artifact" \
              --metadata "$shard_root/coverage-provenance.json"
          done

      - name: Merge frontend coverage shards
        run: node scripts/merge-vitest-coverage.mjs --input=.coverage-shards --output=coverage --expected-shards=4

      - name: Download Vitest shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frontend-vitest-report-shard-*
          path: ${{ inputs.working-directory }}/.vitest-reports
          merge-multiple: false

      - name: Set up Python for differential coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv for differential coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check differential frontend coverage
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          COMPARE_BRANCH: ${{ github.base_ref }}
        run: |
          uv sync --frozen
          git fetch origin $env:COMPARE_BRANCH
          # The current authored frontend diff is fully covered; keep the
          # ratchet strict so newly changed source cannot reintroduce debt.
          uv run diff-cover frontend/coverage/lcov.info --compare-branch=origin/$env:COMPARE_BRANCH --fail-under=100

      - name: Write frontend coverage provenance
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -s frontend/coverage/lcov.info
          test -s frontend/coverage/coverage-final.json
          test "$(find frontend/coverage -maxdepth 1 -type f | wc -l)" -eq 2
          node_version="$(node -p 'process.versions.node')"
          vitest_version="$(node -p 'require("./frontend/node_modules/vitest/package.json").version')"
          python3 scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output frontend/coverage/coverage-provenance.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "frontend-coverage-attempt-$RUN_ATTEMPT" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "node=$node_version" \
            --tool-version "vitest=$vitest_version" \
            --tool-version quality-provenance=2.0.0 \
            --report "frontend|lcov|frontend/coverage/lcov.info|frontend/coverage/lcov.info" \
            --report "frontend|istanbul-json|frontend/coverage/coverage-final.json|frontend/coverage/coverage-final.json"

      - name: Upload Vitest report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-vitest-report
          path: ${{ inputs.working-directory }}/.vitest-reports/
          # The aggregate report directory is intentionally dot-prefixed.
          # upload-artifact excludes hidden paths by default; opting in keeps
          # the downloaded shard JUnit evidence from disappearing silently.
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-attempt-${{ github.run_attempt }}
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-final.json
            frontend/coverage/coverage-provenance.json
          if-no-files-found: error

  lint:
    name: Lint & Format
    needs: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}

      - name: Download shared immutable WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # MOD-43-01 (audit 2026-03-29 Wave 43): Token sync drift gate.
      # Ensures CSS → TS token mirror stays in sync. Fails if sync produces a diff.
      - name: Verify token sync (CSS ↔ TS)
        run: |
          npm run tokens:sync
          git diff --exit-code src/theme/tokens.ts || {
            echo "::error::tokens.ts is out of sync with CSS tokens. Run 'npm run tokens:sync' and commit."
            exit 1
          }

      # These read-only gates are independent. Run them on the same bounded
      # runner in parallel so the workflow does not spend one full process
      # duration per gate while still collecting every exit status and log.
      - name: Run frontend static gates in parallel
        shell: bash
        env:
          STATIC_GATE_LOG_DIR: ${{ runner.temp }}/frontend-static-gates
        run: |
          set -euo pipefail
          rm -rf -- "$STATIC_GATE_LOG_DIR"
          mkdir -p "$STATIC_GATE_LOG_DIR"

          run_gate() {
            local gate="$1"
            shift
            local status=0
            "$@" >"$STATIC_GATE_LOG_DIR/$gate.log" 2>&1 || status=$?
            printf '%s\n' "$status" >"$STATIC_GATE_LOG_DIR/$gate.status"
          }

          run_gate typecheck npm run typecheck &
          run_gate eslint npm run lint &
          run_gate formatting npm run format:check &
          run_gate i18n npm run i18n:check &
          run_gate message_contract python ../scripts/generate_message_contract.py --check &
          run_gate deadcode npm run lint:deadcode &
          run_gate depcheck npm run lint:depcheck &
          wait

          failed=0
          for gate in typecheck eslint formatting i18n message_contract deadcode depcheck; do
            echo "::group::$gate"
            cat "$STATIC_GATE_LOG_DIR/$gate.log"
            echo "::endgroup::"
            status="$(cat "$STATIC_GATE_LOG_DIR/$gate.status")"
            if [[ "$status" -ne 0 ]]; then
              echo "::error title=Frontend static gate failed::$gate exited with $status"
              failed=1
            fi
          done
          exit "$failed"

  build:
    name: Production Build
    needs: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
      # The 1536 MiB V8 heap cap excludes Rolldown's Rust worker pool and
      # other native allocations. Keep finite RSS headroom around that heap;
      # this same bounded pair is exercised by the Linux E2E/browser builds.
      FRONTEND_BUILD_MAX_RSS_MB: "2048"
      FRONTEND_BUILD_MAX_OLD_SPACE_MB: "1536"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}

      - name: Download shared immutable WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          SKIP_WASM_BUILD: "1"

      - name: Upload production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist
          if-no-files-found: error

      # Lighthouse must use a bundle compiled with VITE_LHCI=true.  That flag
      # controls compile-time mocks and SSR-safe UI branches, so setting it in
      # the shard after downloading the production bundle is too late.  Reuse
      # the WASM artifacts produced above and build this second immutable
      # bundle once, keeping the expensive wasm-pack work out of every shard.
      - name: Build Lighthouse bundle
        run: npm run build
        env:
          VITE_LHCI: "true"
          SKIP_WASM_BUILD: "1"

      - name: Upload Lighthouse bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-lhci-dist
          path: ${{ inputs.working-directory }}/dist
          if-no-files-found: error

  # Fail-closed bundle budgets and a machine-readable report for trend tracking.
  bundle-analysis:
    name: Bundle Analysis
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Test bundle analyzer
        run: node --test scripts/check-bundle-budget.test.mjs

      - name: Analyze bundle size
        run: node scripts/check-bundle-budget.mjs

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-report
          path: ${{ inputs.working-directory }}/bundle-report.json
          if-no-files-found: warn

  # Keep the full 10-route × 3-run Lighthouse matrix, but execute independent
  # route groups concurrently. A single sequential job exceeded its 30-minute
  # budget before producing the reports; sharding changes wall-clock time only.
  lighthouse-shards:
    name: Lighthouse Audit (${{ matrix.shard }})
    if: ${{ inputs.run-lighthouse }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            urls: ",login/,dashboard/"
          - shard: content
            urls: "news/,schedule/,events/"
          - shard: realtime
            urls: "activity/,map/,messenger/"
          - shard: fallback
            urls: "404/"
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
      LHCI_URLS: ${{ matrix.urls }}
      # The dedicated LHCI bundle is built once by the `build` job with
      # VITE_LHCI=true and downloaded into this shard. Rebuilding here would
      # make every shard re-download Binaryen through wasm-pack, so a transient
      # GitHub Releases outage could fail Lighthouse before a single audit
      # starts. run-lhci still prepares route fallbacks and performs the
      # complete collect/assert gate.
      SKIP_BUILD: "1"
      # Serve route-specific SSR HTML from the immutable build. Measuring the
      # route-agnostic static SPA fallback would clear it through createRoot()
      # on every deep link and turn route chunk loading into synthetic LCP.
      LHCI_USE_SSR_PREVIEW: "1"
      LHCI_SSR_PREVIEW_PORT: "4175"
      # ubuntu-24.04 already contains the browser runtime libraries. The
      # Playwright apt bootstrap is intentionally opt-in here: every matrix
      # shard has its own runner, and a slow apt mirror can consume the full
      # Lighthouse timeout before the audit begins.
      LHCI_SKIP_SYSTEM_DEPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Download Lighthouse bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-lhci-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI shard
        run: npm run lhci

      - name: Upload Lighthouse shard reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/.lighthouseci
          include-hidden-files: true
          if-no-files-found: error

  # Preserve the required check display name and the single artifact consumed
  # by ci.yml's Performance Gate while allowing the route shards to run in
  # parallel. Every shard has already run lhci assert plus the route privacy
  # policy; this job verifies the complete matrix and materializes one exact,
  # retry-safe LHR artifact.
  lighthouse:
    name: Lighthouse Audit
    if: ${{ always() && !cancelled() && inputs.run-lighthouse }}
    needs: lighthouse-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Verify all Lighthouse shards passed
        if: ${{ needs.lighthouse-shards.result != 'success' }}
        # This guard runs before the artifact download creates the frontend
        # working directory.  Keep it at the workspace root so a failed shard
        # reports the real Lighthouse failure instead of a missing cwd error.
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::One or more Lighthouse shards failed"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download Lighthouse shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lighthouse-reports-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ inputs.working-directory }}/.lighthouseci-shards
          merge-multiple: false

      - name: Assemble canonical Lighthouse evidence
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHARDS_ROOT: "${{ inputs.working-directory }}/.lighthouseci-shards"
        run: |
          set -euo pipefail
          producer_root=artifacts/lighthouse/producer
          shards_root="$SHARDS_ROOT"
          prefix="lighthouse-reports-${RUN_ID}-${RUN_ATTEMPT}"
          expected_shards=(core content realtime fallback)
          expected_counts=(9 9 9 3)

          if [[ -L artifacts || -L artifacts/lighthouse || -L "$shards_root" ]]; then
            echo "::error::Lighthouse evidence path must not traverse a symlink"
            exit 1
          fi
          rm -rf -- "$producer_root"
          mkdir -p "$producer_root/lhr"
          test -d "$shards_root"
          if find "$shards_root" -mindepth 1 -maxdepth 1 -type l -print -quit | grep -q .; then
            echo "::error::Lighthouse shard download contains a symlink"
            exit 1
          fi
          actual_members="$(find "$shards_root" -mindepth 1 -maxdepth 1 -print | wc -l)"
          if [[ "$actual_members" -ne "${#expected_shards[@]}" ]]; then
            echo "::error::Lighthouse shard download contains an unexpected artifact member"
            exit 1
          fi
          actual_shards="$(find "$shards_root" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          if [[ "$actual_shards" -ne "${#expected_shards[@]}" ]]; then
            echo "::error::Expected exactly ${#expected_shards[@]} Lighthouse shard artifacts, found $actual_shards"
            exit 1
          fi

          total=0
          for position in "${!expected_shards[@]}"; do
            shard="${expected_shards[$position]}"
            expected_count="${expected_counts[$position]}"
            shard_dir="$shards_root/${prefix}-${shard}"
            if [[ ! -d "$shard_dir" ]]; then
              echo "::error::Missing Lighthouse artifact for shard $shard"
              exit 1
            fi
            if find "$shard_dir" -type l -print -quit | grep -q .; then
              echo "::error::Lighthouse shard artifact contains a symlink: $shard"
              exit 1
            fi
            mapfile -d '' reports < <(find "$shard_dir" -type f -name 'lhr-*.json' -print0 | sort -z)
            if [[ "${#reports[@]}" -ne "$expected_count" ]]; then
              echo "::error::Expected $expected_count Lighthouse LHR JSON reports for shard $shard, found ${#reports[@]}"
              exit 1
            fi
            mkdir -p "$producer_root/lhr/$shard"
            for index in "${!reports[@]}"; do
              report="${reports[$index]}"
              printf -v report_name "lhr-%02d.json" "$index"
              target="$producer_root/lhr/$shard/$report_name"
              test -f "$report"
              test ! -L "$report"
              cp -- "$report" "$target"
              total=$((total + 1))
            done
          done
          # core/content/realtime carry three routes × three runs; fallback
          # carries the dedicated 404 route × three runs.  The retry selector
          # accepts only this fixed 30-LHR matrix.
          if [[ "$total" -ne 30 ]]; then
            echo "::error::Expected exactly 30 Lighthouse LHR JSON reports, found $total"
            exit 1
          fi
          echo "Assembled $total canonical Lighthouse LHR reports"

      - name: Write Lighthouse evidence provenance
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          LOGICAL_ARTIFACT_NAME: lighthouse-reports
          PHYSICAL_ARTIFACT_NAME: lighthouse-reports-attempt-${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          workspace_root="$(pwd -P)"
          github_workspace_root="$(realpath -- "$GITHUB_WORKSPACE")"
          if [[ "$workspace_root" != "$github_workspace_root" ]]; then
            echo "::error::Lighthouse provenance workspace is not the canonical checkout root" >&2
            printf 'pwd -P=%s\nGITHUB_WORKSPACE=%s\nrealpath(GITHUB_WORKSPACE)=%s\n' \
              "$workspace_root" "$GITHUB_WORKSPACE" "$github_workspace_root" >&2
            exit 1
          fi
          producer_root=artifacts/lighthouse/producer
          test -d "$producer_root"
          python_version="$(python3 --version | awk '{print $2}')"
          reports=()
          for shard_spec in core:9 content:9 realtime:9 fallback:3; do
            shard="${shard_spec%%:*}"
            count="${shard_spec##*:}"
            for ((index = 0; index < count; index += 1)); do
              printf -v report_name "lhr-%02d.json" "$index"
              source="$producer_root/lhr/$shard/$report_name"
              test -s "$source"
              reports+=(--report "lighthouse-$shard|lighthouse-lhr-json|$source|lhr/$shard/$report_name")
            done
          done
          # Each report is passed as a ``--report``/value pair.  Validate the
          # number of complete pairs rather than the raw argv length; checking
          # the latter against 30 would make this step exit silently at 60
          # elements before the provenance writer runs.
          test "${#reports[@]}" -eq 60
          provenance_dir="$producer_root/provenance"
          mkdir -p -- "$provenance_dir"
          test -d "$provenance_dir"
          test ! -L "$provenance_dir"
          provenance_output="$provenance_dir/lighthouse-reports.json"
          retry_output="$(mktemp)"
          retry_error="$(mktemp)"
          write_output="$(mktemp)"
          write_error="$(mktemp)"
          trap 'rm -f "$retry_output" "$retry_error" "$write_output" "$write_error"' EXIT
          retry_status=0
          python3 -m scripts.quality.coverage_retry_provenance_cli \
              --repository-root "$GITHUB_WORKSPACE" \
              --repository "$WORKFLOW_REPOSITORY" \
              --run-id "$RUN_ID" \
              --run-attempt "$RUN_ATTEMPT" \
              --workflow-ref "$WORKFLOW_REF" \
              --workflow-sha "$WORKFLOW_SHA" \
              --event "$WORKFLOW_EVENT" \
              --artifact "$LOGICAL_ARTIFACT_NAME" \
              --config-input .github/workflows/reusable-frontend-tests.yml \
              --config-input .lighthouserc.js \
              --config-input frontend/package.json \
              --config-input frontend/package-lock.json \
              --config-input frontend/scripts/run-lhci.mjs \
              --config-input frontend/scripts/lhci-route-policy.mjs \
              --config-input frontend/scripts/lhci-route-policy-config.cjs \
              --policy-input budget.json \
              --policy-input frontend/public/robots.txt \
              --policy-input quality/quality-contract.json \
              --policy-input .github/workflows/ci.yml \
              --policy-input scripts/quality/coverage_provenance.py \
              --policy-input scripts/quality/coverage_retry_context.py \
              --policy-input scripts/quality/coverage_retry_provenance_cli.py \
              --policy-input scripts/quality/select_coverage_artifacts.py \
              --policy-input scripts/quality/select_lighthouse_artifacts.py \
              --policy-input scripts/quality/select_lighthouse_artifacts_cli.py \
              >"$retry_output" 2>"$retry_error" || retry_status=$?
          if [[ "$retry_status" -ne 0 ]]; then
            echo "::error::Lighthouse retry provenance CLI failed with exit $retry_status." >&2
            cat "$retry_error" >&2
            exit "$retry_status"
          fi
          retry_values=()
          mapfile -t retry_values < "$retry_output"
          if [[ "${#retry_values[@]}" -ne 11 ]]; then
            echo "::error::Lighthouse retry CLI returned ${#retry_values[@]} values; expected 11." >&2
            cat "$retry_error" >&2
            nl -ba "$retry_output" >&2
            exit 1
          fi
          retry_args=()
          for value in "${retry_values[@]}"; do
            retry_args+=(--retry-provenance "$value")
          done
          write_status=0
          python3 scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output "$provenance_output" \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "$LOGICAL_ARTIFACT_NAME" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "python=$python_version" \
            --tool-version quality-provenance=2.0.0 \
            --tool-version lighthouse-lhr-inventory=30 \
            "${reports[@]}" \
            "${retry_args[@]}" \
            >"$write_output" 2>"$write_error" || write_status=$?
          if [[ "$write_status" -ne 0 ]]; then
            echo "::error::Lighthouse evidence provenance writer failed with exit $write_status." >&2
            cat "$write_error" >&2
            cat "$write_output" >&2
            exit "$write_status"
          fi
          if [[ ! -f "$provenance_output" || -L "$provenance_output" || ! -s "$provenance_output" ]]; then
            echo "::error::Lighthouse evidence provenance writer produced no regular, non-empty sidecar at the expected workspace path." >&2
            printf 'working directory: %s\n' "$(pwd -P)" >&2
            printf 'provenance directory listing:\n' >&2
            ls -la "$provenance_dir" >&2 || true
            printf 'provenance output path: %s\n' "$provenance_output" >&2
            if [[ -e "$provenance_output" || -L "$provenance_output" ]]; then
              stat --printf='mode=%a size=%s inode=%i links=%h type=%F\n' "$provenance_output" >&2 || true
            fi
            printf 'writer stderr:\n' >&2
            cat "$write_error" >&2
            printf 'writer stdout:\n' >&2
            cat "$write_output" >&2
            exit 1
          fi
          test -s "$provenance_output"

      - name: Upload Lighthouse retry evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-attempt-${{ github.run_attempt }}
          path: artifacts/lighthouse/producer
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
