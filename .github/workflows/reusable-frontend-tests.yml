# Reusable Frontend Tests Workflow
name: Frontend Tests

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      working-directory:
        description: "Frontend directory"
        required: false
        type: string
        default: "frontend"
      run-e2e:
        description: "Run Playwright E2E tests"
        required: false
        type: boolean
        default: false
      run-lighthouse:
        description: "Run Lighthouse audits"
        required: false
        type: boolean
        default: false

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-pack
        uses: taiki-e/install-action@0d865d5cc6d507df4765f1f866bfae8bab4e2a73 # v2.69.7
        with:
          tool: wasm-pack

      - name: Build WASM modules
        run: |
          wasm-pack build rust-crypto --target web
          wasm-pack build wasm-sanitizer --target web

      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:ci
        env:
          CI: "true"

      - name: Upload vitest report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frontend-vitest-report
          path: ${{ inputs.working-directory }}/vitest-report.xml
          if-no-files-found: warn

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-pack
        uses: taiki-e/install-action@0d865d5cc6d507df4765f1f866bfae8bab4e2a73 # v2.69.7
        with:
          tool: wasm-pack

      - name: Build WASM modules
        run: |
          wasm-pack build rust-crypto --target web
          wasm-pack build wasm-sanitizer --target web

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  build:
    name: Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # P0-01 (audit 2026-03-06): Replaced unsafe `curl | sh` with taiki-e/install-action.
      # The action verifies SHA256 checksums from official GitHub releases, preventing
      # supply chain attacks via DNS hijacking or CDN compromise (OWASP CI/CD C-PPE-1).
      - name: Install wasm-pack
        uses: taiki-e/install-action@0d865d5cc6d507df4765f1f866bfae8bab4e2a73 # v2.69.7
        with:
          tool: wasm-pack

      - name: Build rust-crypto
        run: |
          cd rust-crypto
          wasm-pack build --target web

      - name: Build app
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist
          if-no-files-found: error

  # MOD-23-06 (audit 2026-03-25 Wave 23): Bundle size analysis.
  # Alerts on >500 KB main chunk growth and generates a JSON report for trend tracking.
  bundle-analysis:
    name: Bundle Analysis
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download production bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Analyze bundle size
        run: |
          # Generate JSON report of all chunks
          echo '{}' > bundle-report.json
          total_size=0
          main_chunk_size=0
          for f in dist/assets/*.js; do
            size=$(wc -c < "$f")
            name=$(basename "$f")
            total_size=$((total_size + size))
            # Track main/index chunk specifically
            if echo "$name" | grep -qE '^(index|main)'; then
              main_chunk_size=$size
            fi
            echo "  $name: $(( size / 1024 )) KB"
          done
          echo ""
          echo "Total JS: $(( total_size / 1024 )) KB"
          echo "Main chunk: $(( main_chunk_size / 1024 )) KB"
          echo ""
          # Fail if main chunk exceeds 500 KB (gzipped will be ~150 KB)
          LIMIT_KB=500
          main_kb=$(( main_chunk_size / 1024 ))
          if [ "$main_kb" -gt "$LIMIT_KB" ]; then
            echo "::error::Main chunk ($main_kb KB) exceeds $LIMIT_KB KB budget"
            exit 1
          fi
          echo "::notice::Bundle analysis passed — main chunk $main_kb KB (limit: $LIMIT_KB KB)"

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bundle-report
          path: ${{ inputs.working-directory }}/bundle-report.json
          if-no-files-found: warn

  lighthouse:
    name: Lighthouse Audit
    if: ${{ inputs.run-lighthouse }}
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Download built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        env:
          SKIP_BUILD: "true"
        run: npm run lhci

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: lighthouse-reports
          path: ${{ inputs.working-directory }}/.lighthouseci
          if-no-files-found: warn

