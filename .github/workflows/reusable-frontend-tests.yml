# Reusable Frontend Tests Workflow
name: Frontend Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "24"
      working-directory:
        description: "Frontend directory"
        required: false
        type: string
        default: "frontend"
      run-e2e:
        description: "Run Playwright E2E tests"
        required: false
        type: boolean
        default: false
      run-lighthouse:
        description: "Run Lighthouse audits"
        required: false
        type: boolean
        default: false
      wasm-artifact-id:
        description: "Optional same-run server-issued WASM artifact id"
        required: false
        type: string
        default: ""
      wasm-artifact-name:
        description: "Optional same-run WASM artifact name"
        required: false
        type: string
        default: ""
      wasm-artifact-digest:
        description: "Optional same-run WASM artifact archive digest"
        required: false
        type: string
        default: ""
jobs:
  # Validate or (for compatibility callers) compile the immutable WASM
  # packages once per workflow attempt. The CI caller supplies the shared E2E
  # producer artifact so frontend and browser jobs never rebuild Rust in the
  # same workflow run. Standalone callers retain the old producer fallback.
  wasm-build:
    name: Build WASM modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Validate shared WASM artifact input contract
        if: ${{ inputs.wasm-artifact-id != '' || inputs.wasm-artifact-name != '' || inputs.wasm-artifact-digest != '' }}
        shell: bash
        env:
          WASM_ARTIFACT_ID: ${{ inputs.wasm-artifact-id }}
          WASM_ARTIFACT_NAME: ${{ inputs.wasm-artifact-name }}
          WASM_ARTIFACT_DIGEST: ${{ inputs.wasm-artifact-digest }}
        run: |
          set -euo pipefail
          if [[ -z "$WASM_ARTIFACT_ID" || -z "$WASM_ARTIFACT_NAME" || -z "$WASM_ARTIFACT_DIGEST" ]]; then
            echo "::error::Shared WASM artifact mode requires all three inputs (id, name, digest)."
            exit 1
          fi
          [[ "$WASM_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WASM_ARTIFACT_NAME" =~ ^frontend-e2e-wasm-[0-9]+-[0-9]+-[0-9a-f]{40}$ ]]
          [[ "$WASM_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Download shared immutable WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: ${{ inputs.working-directory }}

      - name: Verify shared WASM artifact digest and provenance
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ inputs.wasm-artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.wasm-artifact-name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.wasm-artifact-digest }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-connrefused \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_url}" -o "${response_file}"
          actual_digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("digest", ""))' "${response_file}")"
          if [[ "$actual_digest" =~ ^[0-9a-f]{64}$ ]]; then actual_digest="sha256:${actual_digest}"; fi
          [[ "$actual_digest" == "$EXPECTED_ARTIFACT_DIGEST" ]]
          test -s WASM_PROVENANCE.json
          test -s WASM_INVENTORY.json
          export EXPECTED_ARTIFACT_NAME EXPECTED_SHA EXPECTED_PR_HEAD_SHA EXPECTED_WORKFLOW_REF EXPECTED_WORKFLOW_SHA EXPECTED_RUN_ID EXPECTED_RUN_ATTEMPT EXPECTED_EVENT REPOSITORY
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          provenance = json.loads(Path("WASM_PROVENANCE.json").read_text(encoding="utf-8"))
          inventory = json.loads(Path("WASM_INVENTORY.json").read_text(encoding="utf-8"))
          expected = {
              "artifact_name": os.environ["EXPECTED_ARTIFACT_NAME"],
              "artifact_kind": "e2e-wasm",
              "repository": os.environ["REPOSITORY"],
              "source_sha": os.environ["EXPECTED_SHA"],
              "pr_head_sha": os.environ["EXPECTED_PR_HEAD_SHA"],
              "workflow_ref": os.environ["EXPECTED_WORKFLOW_REF"],
              "workflow_sha": os.environ["EXPECTED_WORKFLOW_SHA"],
              "run_id": int(os.environ["EXPECTED_RUN_ID"]),
              "run_attempt": int(os.environ["EXPECTED_RUN_ATTEMPT"]),
              "event": os.environ["EXPECTED_EVENT"],
              "schema_version": 1,
          }
          for key, value in expected.items():
              if provenance.get(key) != value:
                  raise SystemExit(f"WASM provenance mismatch for {key}")
          files = inventory.get("files")
          if inventory.get("schema_version") != 1 or not isinstance(files, list) or not files:
              raise SystemExit("WASM inventory is missing or malformed")
          canonical = json.dumps({"schema_version": 1, "files": files}, sort_keys=True, separators=(",", ":")).encode()
          if inventory.get("inventory_sha256") != hashlib.sha256(canonical).hexdigest():
              raise SystemExit("WASM inventory digest mismatch")
          expected_paths = set()
          for record in files:
              relative = record.get("path") if isinstance(record, dict) else None
              if not isinstance(relative, str) or relative.startswith("/") or ".." in Path(relative).parts:
                  raise SystemExit(f"invalid WASM inventory path: {relative!r}")
              path = root / relative
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(root):
                  raise SystemExit(f"unsafe or missing WASM inventory path: {relative!r}")
              if relative in expected_paths or path.stat().st_size != record.get("size"):
                  raise SystemExit(f"WASM inventory mismatch: {relative}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != record.get("sha256"):
                  raise SystemExit(f"WASM digest mismatch: {relative}")
              expected_paths.add(relative)
          actual_paths = {
              path.relative_to(root).as_posix()
              for package in (root / "rust-crypto/pkg", root / "wasm-sanitizer/pkg")
              for path in package.rglob("*")
              if path.is_file() and not path.is_symlink()
          }
          if actual_paths != expected_paths or provenance.get("inventory_sha256") != inventory["inventory_sha256"]:
              raise SystemExit("WASM inventory does not exactly match generated package files")
          PY
          node scripts/verify-wasm-artifacts.mjs

      - name: Setup Rust toolchain
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        # Pin the compiler that produced the checked-in WASM bytes.  The
        # hosted runner's `stable` channel is mutable and a compiler update
        # changes optimized binaries, which must fail closed at provenance
        # validation rather than silently replacing the release artifact.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0

      - name: Install pinned wasm-opt
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        shell: bash
        run: |
          set -euo pipefail
          binaryen_version="version_133"
          binaryen_sha256="2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489" # public Binaryen release checksum
          binaryen_root="$RUNNER_TEMP/binaryen-$binaryen_version"
          binaryen_archive="$RUNNER_TEMP/binaryen-$binaryen_version-x86_64-linux.tar.gz"
          binaryen_url="https://github.com/WebAssembly/binaryen/releases/download/$binaryen_version/binaryen-$binaryen_version-x86_64-linux.tar.gz"
          rm -rf -- "$binaryen_root"
          mkdir -p -- "$binaryen_root"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$binaryen_archive" "$binaryen_url"
          printf '%s  %s\n' "$binaryen_sha256" "$binaryen_archive" \
            | sha256sum --check --strict
          tar --extract --file "$binaryen_archive" --strip-components=1 --directory "$binaryen_root"
          test -x "$binaryen_root/bin/wasm-opt"
          "$binaryen_root/bin/wasm-opt" --version | grep -Fq "version 133"
          echo "$binaryen_root/bin" >> "$GITHUB_PATH"

      - name: Build immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          wasm-pack --version
          rustup target add wasm32-unknown-unknown
          rustup target list --installed | grep -Fxq "wasm32-unknown-unknown"
          # Rust embeds source and dependency paths in optimized WASM custom
          # sections. Remap runner-specific paths to canonical Linux paths
          # while preserving any caller-provided flags.
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$HOME/.cargo=/usr/local/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/work"
          # wasm-pack installs shared wasm-bindgen/wasm-opt helpers under the
          # user's cache.  Running both producers concurrently races those
          # cache writes and can produce bytes that drift from the checked-in
          # source-bound provenance.  Keep the two builds ordered; the small
          # serialization cost is cheaper than a flaky retry and preserves
          # reproducible artifact bytes.
          wasm-pack build rust-crypto --target web --release
          wasm-pack build wasm-sanitizer --target web --release
          if [[ ! -s rust-crypto/pkg/uni_wasm_crypto_bg.wasm || ! -s wasm-sanitizer/pkg/wasm_sanitizer_bg.wasm ]]; then
            echo "::error::WASM build did not produce both binary modules"
            exit 1
          fi
          node scripts/verify-wasm-artifacts.mjs

      - name: Upload immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ inputs.working-directory }}/rust-crypto/pkg
            ${{ inputs.working-directory }}/wasm-sanitizer/pkg
          if-no-files-found: error
          overwrite: false
          retention-days: 1
          compression-level: 0

  # Run the repository-wide WASM and frontend contract suite once per
  # workflow attempt. Unit shards consume the same immutable artifact and
  # focus exclusively on Vitest; keeping this job independent lets both lanes
  # start immediately after the shared producer completes.
  wasm-tests:
    name: WASM Contract Tests
    needs: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}

      - name: Download shared immutable WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        id: install-contract-dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Storybook static compatibility fixture
        timeout-minutes: 5
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          output="$(mktemp -d "$RUNNER_TEMP/storybook-static.XXXXXX")"
          trap 'rm -rf -- "$output"' EXIT
          npm run build-storybook -- --output-dir "$output" --disable-telemetry
          test -s "$output/index.html"
          test -s "$output/iframe.html"

      - name: Run frontend WASM and quality contracts
        run: npm run test:wasm
        env:
          CI: "true"

      - name: Run worker and export regression contracts
        run: >-
          npm exec -- vitest run
          src/workers/__tests__/crypto.worker.closure.test.ts
          src/workers/__tests__/crypto.worker.parity.test.ts
          src/utils/__tests__/cryptoWorker.test.ts
          src/utils/__tests__/activityExport.test.ts
          src/utils/__tests__/activityExport.closure.test.ts
          src/utils/__tests__/activityExport.pdf.test.ts
          --reporter=verbose
        env:
          CI: "true"

      - name: Run quick audit regressions
        if: ${{ !cancelled() && steps.install-contract-dependencies.outcome == 'success' }}
        run: >-
          npm exec -- vitest run
          src/api/__tests__/notifications.test.ts
          src/components/mfa/__tests__/OtpEntry.test.tsx
          src/components/mfa/__tests__/OtpEntry.mutation-contract.test.tsx
          src/components/schedule/__tests__/ScheduleListView.test.tsx
          src/features/events/__tests__/categories.closure.test.ts
          src/components/events/EventCard/__tests__/EventCardContent.closure.test.tsx
          src/components/schedule/__tests__/schedulePrint.contract.test.ts
          src/components/messenger/__tests__/ChatWindow.ime-edit.audit.test.tsx
          src/routes/__tests__/activity.search-validation.test.ts
          src/features/events/components/__tests__/EventsList.closure.test.tsx
          src/api/hooks/__tests__/events.branches.test.tsx
          src/features/events/__tests__/EventsFeature.query-error.audit.test.tsx
          src/components/events/__tests__/EventEditDialog.test.tsx
          src/pages/__tests__/StoriesAdmin.test.tsx
          src/components/map/__tests__/MapSidebar.branches.test.tsx
          src/hooks/features/__tests__/useMessengerController.test.tsx
          src/hooks/__tests__/useChatWebSocket.test.tsx
          src/components/ui/__tests__/SpotifyConnect.accessible-name.test.tsx
          src/components/mfa/__tests__/TotpQrDisplay.closure.test.tsx
          src/features/admin/__tests__/AdminNotificationsFeature.behavior.test.tsx
          src/features/admin/__tests__/AdminNotificationsFeature.destructive-race.test.tsx
          src/components/messenger/GroupInfoPanel.branches.test.tsx
          src/components/messenger/GroupInfoPanel.escape.integration.test.tsx
          src/components/pwa/__tests__/InstallPrompt.behavior.test.tsx
          src/components/layout/__tests__/AuthPageLandmarks.test.tsx
          src/components/profile/__tests__/profileUtils.closure.test.ts
          src/pages/__tests__/ResetPassword.token-error.test.tsx
          src/pages/__tests__/ForgotPassword.test.tsx
          src/pages/__tests__/Register.test.tsx
          src/pages/__tests__/Profile.behavior.test.tsx
          --reporter=verbose
        env:
          CI: "true"

      - name: Run final HTML inventory contracts
        if: ${{ !cancelled() && steps.install-contract-dependencies.outcome == 'success' }}
        timeout-minutes: 2
        run: node --test scripts/final-html-root-inventory.test.mjs

  unit-tests-shard:
    name: Unit Tests (shard ${{ matrix.shard }}/4)
    needs: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Keep all four shards in the logical matrix, but cap concurrent callers
      # so frontend unit tests do not monopolize the shared PR runner pool.
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}

      - name: Download shared immutable WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Clean frontend shard coverage outputs
        run: rm -rf -- coverage

      - name: Run unit-test shard
        # Each shard sees only a fraction of the repository and therefore
        # cannot satisfy the repository-wide coverage thresholds on its own.
        # The merged `unit-tests` job below owns the single global coverage
        # and differential gate; keep shard runs focused on test correctness.
        run: >-
          npm run test:unit-ci --
          --shard=${{ matrix.shard }}/4
          --coverage.thresholds.lines=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.statements=0
        env:
          CI: "true"

      - name: Write frontend shard provenance
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          SHARD_ID: ${{ matrix.shard }}
          ARTIFACT_NAME: frontend-coverage-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -s frontend/coverage/coverage-final.json
          node_version="$(node -p 'process.versions.node')"
          vitest_version="$(node -p 'require("./frontend/node_modules/vitest/package.json").version')"
          python3 scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output frontend/coverage/coverage-provenance.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "$ARTIFACT_NAME" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "node=$node_version" \
            --tool-version "vitest=$vitest_version" \
            --tool-version quality-provenance=2.0.0 \
            --report "frontend-shard|istanbul-json|frontend/coverage/coverage-final.json|frontend/.coverage-shards/$ARTIFACT_NAME/coverage-final.json"

      - name: Upload Vitest shard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-vitest-report-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/vitest-report.xml
          if-no-files-found: error

      - name: Upload frontend coverage shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ inputs.working-directory }}/coverage/coverage-final.json
            ${{ inputs.working-directory }}/coverage/coverage-provenance.json
          if-no-files-found: error

  # Keep a stable `Frontend Tests / Unit Tests` check for branch protection.
  # The matrix above owns execution; this job owns the merged, repository-wide
  # coverage artifact and the differential gate.
  unit-tests:
    name: Unit Tests
    needs: unit-tests-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Fail if a test shard failed
        if: ${{ needs.unit-tests-shard.result != 'success' }}
        # This guard intentionally runs before checkout so a failed shard
        # exits quickly.  The repository-relative default working directory
        # does not exist until checkout, therefore pin the guard to the
        # runner workspace explicitly.
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::At least one frontend Vitest shard did not pass."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run production-only client contracts
        run: npm run test:client-production

      - name: Clean merged frontend coverage outputs
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- frontend/.coverage-shards
          rm -rf -- frontend/.vitest-reports
          rm -rf -- frontend/coverage

      - name: Download frontend coverage shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: frontend-coverage-shard-*-attempt-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/.coverage-shards
          merge-multiple: false

      - name: Verify frontend shard provenance
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(find frontend/.coverage-shards -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 4
          for shard in 1 2 3 4; do
            artifact="frontend-coverage-shard-${shard}-attempt-${RUN_ATTEMPT}"
            shard_root="frontend/.coverage-shards/$artifact"
            test "$(find "$shard_root" -maxdepth 1 -type f | wc -l)" -eq 2
            test -s "$shard_root/coverage-final.json"
            test -s "$shard_root/coverage-provenance.json"
            python3 scripts/quality/coverage_provenance.py verify \
              --repository-root "$GITHUB_WORKSPACE" \
              --expected-sha "$EXPECTED_SHA" \
              --expected-repository "$WORKFLOW_REPOSITORY" \
              --expected-run-id "$RUN_ID" \
              --expected-run-attempt "$RUN_ATTEMPT" \
              --expected-workflow-ref "$WORKFLOW_REF" \
              --expected-workflow-sha "$WORKFLOW_SHA" \
              --expected-event "$WORKFLOW_EVENT" \
              --expected-job unit-tests-shard \
              --expected-artifact "$artifact" \
              --metadata "$shard_root/coverage-provenance.json"
          done

      - name: Merge frontend coverage shards
        run: node scripts/merge-vitest-coverage.mjs --input=.coverage-shards --output=coverage --expected-shards=4

      - name: Report merged frontend zero-hit branch arms
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          if (!process.env.GITHUB_WORKSPACE) throw new Error("Missing coverage workspace");
          const directory = path.relative(process.env.GITHUB_WORKSPACE, root);
          if (!directory || path.isAbsolute(directory) || directory.split(path.sep).includes("..")) {
            throw new Error("Coverage working directory is outside the repository");
          }
          const report = JSON.parse(readFileSync("coverage/coverage-final.json", "utf8"));
          if (!report || typeof report !== "object" || Array.isArray(report)) {
            throw new Error("Invalid merged frontend coverage object");
          }
          const rows = [];
          let total = 0;
          let unlocated = 0;
          for (const [file, entry] of Object.entries(report).sort()) {
            const relative = path.relative(root, path.resolve(file));
            if (!relative || path.isAbsolute(relative) || relative.split(path.sep).includes("..")) {
              throw new Error("Coverage source is outside the frontend directory");
            }
            if (!entry?.b || typeof entry.b !== "object" || Array.isArray(entry.b)) {
              throw new Error("Invalid frontend branch counters");
            }
            for (const [id, counts] of Object.entries(entry.b)) {
              if (!/^\d+$/.test(id) || !Number.isSafeInteger(Number(id)) || !Array.isArray(counts)) {
                throw new Error("Invalid frontend branch metadata");
              }
              for (const [arm, hits] of counts.entries()) {
                if (!Number.isSafeInteger(hits) || hits < 0) {
                  throw new Error("Invalid frontend branch hit count");
                }
                total += 1;
                if (hits !== 0) continue;
                const location = entry.branchMap?.[id]?.locations?.[arm]?.start;
                const line = Number.isSafeInteger(location?.line) && location.line > 0 ? location.line : null;
                const column = Number.isSafeInteger(location?.column) && location.column >= 0 ? location.column : null;
                if (line === null) unlocated += 1;
                rows.push({ path: directory.split(path.sep).join("/") + "/" + relative.split(path.sep).join("/"), branch: Number(id), arm, line, column, hits: 0 });
              }
            }
          }
          rows.sort((a, b) => a.path.localeCompare(b.path) || a.branch - b.branch || a.arm - b.arm);
          for (const row of rows.slice(0, 200)) console.log(JSON.stringify(row));
          console.log(JSON.stringify({ diagnostic: "frontend_branch_arms", total, zero: rows.length, unlocated, emitted: Math.min(rows.length, 200), truncated: Math.max(rows.length - 200, 0) }));
          NODE

      - name: Download Vitest shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: frontend-vitest-report-shard-*-attempt-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/.vitest-reports
          merge-multiple: false

      - name: Set up Python for differential coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv for differential coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check differential frontend coverage
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          COMPARE_BRANCH: ${{ github.base_ref }}
        run: |
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { throw "Frontend diff coverage dependency sync failed." }
          node --test tests/verify_frontend_diff_coverage.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Frontend diff coverage contract tests failed." }
          git fetch origin $env:COMPARE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch frontend diff coverage comparison branch." }
          $normalizedLcov = Join-Path $env:RUNNER_TEMP ("frontend-diff-lcov-{0}-{1}-{2}.info" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, ([guid]::NewGuid().ToString("N")))
          if (Test-Path -LiteralPath $normalizedLcov) { throw "Refusing to overwrite a pre-existing normalized LCOV path." }
          try {
            node scripts/quality/verify_frontend_diff_coverage.mjs --repo-root "$env:GITHUB_WORKSPACE" --base-ref "origin/$env:COMPARE_BRANCH" --output "$normalizedLcov"
            if ($LASTEXITCODE -ne 0) { throw "Frontend diff coverage preflight failed." }
            uv run diff-cover "$normalizedLcov" --compare-branch=origin/$env:COMPARE_BRANCH --fail-under=100
            if ($LASTEXITCODE -ne 0) { throw "Frontend differential coverage is below 100%." }
          } finally {
            if (Test-Path -LiteralPath $normalizedLcov) { Remove-Item -LiteralPath $normalizedLcov -Force }
          }

      - name: Write frontend coverage provenance
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -s frontend/coverage/lcov.info
          test -s frontend/coverage/coverage-final.json
          test "$(find frontend/coverage -maxdepth 1 -type f | wc -l)" -eq 2
          node_version="$(node -p 'process.versions.node')"
          vitest_version="$(node -p 'require("./frontend/node_modules/vitest/package.json").version')"
          python3 scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output frontend/coverage/coverage-provenance.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "frontend-coverage-attempt-$RUN_ATTEMPT" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "node=$node_version" \
            --tool-version "vitest=$vitest_version" \
            --tool-version quality-provenance=2.0.0 \
            --report "frontend|lcov|frontend/coverage/lcov.info|frontend/coverage/lcov.info" \
            --report "frontend|istanbul-json|frontend/coverage/coverage-final.json|frontend/coverage/coverage-final.json"

      - name: Upload Vitest report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-vitest-report-attempt-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/.vitest-reports/
          # The aggregate report directory is intentionally dot-prefixed.
          # upload-artifact excludes hidden paths by default; opting in keeps
          # the downloaded shard JUnit evidence from disappearing silently.
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-attempt-${{ github.run_attempt }}
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-final.json
            frontend/coverage/coverage-provenance.json
          if-no-files-found: error

  lint:
    name: Lint & Format
    needs: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}

      - name: Download shared immutable WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # MOD-43-01 (audit 2026-03-29 Wave 43): Token sync drift gate.
      # Ensures CSS → TS token mirror stays in sync. Fails if sync produces a diff.
      - name: Verify token sync (CSS ↔ TS)
        run: |
          npm run tokens:sync
          git diff --exit-code src/theme/tokens.ts || {
            echo "::error::tokens.ts is out of sync with CSS tokens. Run 'npm run tokens:sync' and commit."
            exit 1
          }

      # These read-only gates are independent. Run them on the same bounded
      # runner in parallel so the workflow does not spend one full process
      # duration per gate while still collecting every exit status and log.
      - name: Run frontend static gates in parallel
        shell: bash
        env:
          STATIC_GATE_LOG_DIR: ${{ runner.temp }}/frontend-static-gates
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf -- "$STATIC_GATE_LOG_DIR"
          mkdir -p "$STATIC_GATE_LOG_DIR"

          run_gate() {
            local gate="$1"
            shift
            local status=0
            "$@" >"$STATIC_GATE_LOG_DIR/$gate.log" 2>&1 || status=$?
            if [[ "$gate" == "formatting" && "$status" -ne 0 ]]; then
              # Read-only, bounded diffs make remote formatting failures actionable.
              # The original gate status remains authoritative, including errors.
              local shown=0
              # Match package.json's format:check scope; never scan build outputs.
              local -a format_targets=(
                'src/**/*.{ts,tsx,js,jsx,json,css,scss,md}'
                'tests/**/*.{ts,tsx,js,jsx}'
                vite.config.mts playwright.config.ts vitest.config.ts
                tsconfig.json pwa-maskable-icons.ts 'scripts/**/*.mjs'
              )
              while IFS= read -r file; do
                if [[ "$shown" -ge 10 ]]; then
                  echo "Further formatting diffs omitted." >>"$STATIC_GATE_LOG_DIR/$gate.log"
                  break
                fi
                [[ -f "$file" ]] || continue
                shown=$((shown + 1))
                printf '\nFormatting diff: %s (first 200 lines)\n' "$file" >>"$STATIC_GATE_LOG_DIR/$gate.log"
                ./node_modules/.bin/prettier "$file" 2>>"$STATIC_GATE_LOG_DIR/$gate.log" |
                  diff -u -- "$file" - |
                  sed -n '1,200p' >>"$STATIC_GATE_LOG_DIR/$gate.log" || true
              done < <(./node_modules/.bin/prettier --list-different "${format_targets[@]}")
            fi
            printf '%s\n' "$status" >"$STATIC_GATE_LOG_DIR/$gate.status"
          }

          run_gate typecheck npm run typecheck &
          run_gate eslint npm run lint &
          run_gate formatting npm run format:check &
          run_gate i18n npm run i18n:check &
          run_gate message_contract python ../scripts/generate_message_contract.py --check &
          run_gate knip npm run lint:knip &
          run_gate react_compiler_compat timeout 120s node --test scripts/react-compiler-zod-compat.test.mjs &
          wait

          failed=0
          for gate in typecheck eslint formatting i18n message_contract knip react_compiler_compat; do
            echo "::group::$gate"
            cat "$STATIC_GATE_LOG_DIR/$gate.log"
            echo "::endgroup::"
            status="$(cat "$STATIC_GATE_LOG_DIR/$gate.status")"
            if [[ "$status" -ne 0 ]]; then
              echo "::error title=Frontend static gate failed::$gate exited with $status"
              failed=1
            fi
          done
          exit "$failed"

  build:
    name: Production Build
    needs: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
      # The 1536 MiB V8 heap cap excludes Rolldown's Rust worker pool and
      # other native allocations. Keep finite RSS headroom around that heap;
      # this same bounded pair is exercised by the Linux E2E/browser builds.
      FRONTEND_BUILD_MAX_RSS_MB: "2048"
      FRONTEND_BUILD_MAX_OLD_SPACE_MB: "1536"
      # Rolldown keeps native allocations across the client and SSR passes.
      ROLLDOWN_WORKER_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}

      - name: Download shared immutable WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: ${{ inputs.working-directory }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build app
        run: npm run build
        env:
          SKIP_WASM_BUILD: "1"
          MAPLIBRE_BUILD_METADATA_OUTPUT: ${{ runner.temp }}/maplibre-inventory-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}.json

      - name: Report bounded MapLibre build inventory
        timeout-minutes: 1
        run: |
          set -euo pipefail
          node --input-type=module <<'MAPLIBRE_INVENTORY'
          import { execFileSync } from "node:child_process"
          import { createHash } from "node:crypto"
          import { constants } from "node:fs"
          import { open, realpath } from "node:fs/promises"
          import path from "node:path"
          import { gzipSync } from "node:zlib"
          
          const MAX_BYTES = 4 * 1024 * 1024
          const hash = (bytes) => createHash("sha256").update(bytes).digest("hex")
          const reject = () => { throw new Error("invalid inventory") }
          const check = (valid) => { if (!valid) reject() }
          const integer = (value, maximum = 1_000_000_000) =>
            Number.isSafeInteger(value) && value >= 0 && value <= maximum
          const digest = (value) => typeof value === "string" && /^[a-f0-9]{64}$/u.test(value)
          const safePath = (value) =>
            typeof value === "string" && value.length > 0 && value.length <= 1024 &&
            /^[A-Za-z0-9_@./-]+$/u.test(value) && !value.startsWith("/") &&
            value.split("/").every((part) => part !== "" && part !== "." && part !== "..")
          const within = (root, value) => value === root || value.startsWith(root + path.sep)
          const exact = (value, keys) => {
            check(value !== null && typeof value === "object" && !Array.isArray(value))
            const actual = Object.keys(value).sort()
            const expected = [...keys].sort()
            check(actual.length === expected.length && actual.every((key, index) => key === expected[index]))
          }
          const ordered = (values, maximum, predicate, lexical = false) => {
            check(Array.isArray(values) && values.length <= maximum)
            check(values.every(predicate))
            check(values.every((value, index) => index === 0 ||
              (lexical ? values[index - 1] < value : values[index - 1].localeCompare(value) < 0)))
          }
          async function boundedFile(file) {
            check(
              Number.isSafeInteger(constants.O_NOFOLLOW) && constants.O_NOFOLLOW > 0 &&
              Number.isSafeInteger(constants.O_NONBLOCK) && constants.O_NONBLOCK > 0
            )
            const handle = await open(file, constants.O_RDONLY | constants.O_NOFOLLOW | constants.O_NONBLOCK)
            try {
              const before = await handle.stat({ bigint: true })
              check(before.isFile() && before.size <= BigInt(MAX_BYTES))
              const bytes = Buffer.alloc(MAX_BYTES + 1)
              let size = 0
              while (size <= MAX_BYTES) {
                const part = await handle.read(bytes, size, bytes.length - size, null)
                if (part.bytesRead === 0) break
                size += part.bytesRead
              }
              check(size <= MAX_BYTES)
              const after = await handle.stat({ bigint: true })
              check(
                before.dev === after.dev && before.ino === after.ino &&
                before.size === after.size && before.size === BigInt(size) &&
                before.mtimeNs === after.mtimeNs && before.ctimeNs === after.ctimeNs
              )
              return bytes.subarray(0, size)
            } finally {
              await handle.close()
            }
          }
          async function insideFile(root, relative) {
            check(safePath(relative))
            const file = path.resolve(root, relative)
            check(within(root, file))
            const parent = await realpath(path.dirname(file))
            check(within(root, parent) && parent === path.dirname(file))
            return boundedFile(file)
          }
          
          try {
            const root = await realpath(process.cwd())
            const dist = await realpath(path.join(root, "dist"))
            const output = await realpath(path.join(dist, "client"))
            check(within(root, dist) && within(dist, output))
            const { GITHUB_SHA: checkoutSha, GITHUB_RUN_ID: runId, GITHUB_RUN_ATTEMPT: runAttempt } = process.env
            check(typeof checkoutSha === "string" && /^[a-f0-9]{40}$/u.test(checkoutSha))
            check(typeof runId === "string" && /^[1-9][0-9]{0,19}$/u.test(runId))
            check(typeof runAttempt === "string" && /^[1-9][0-9]{0,9}$/u.test(runAttempt))
            check(typeof process.env.RUNNER_TEMP === "string" && path.isAbsolute(process.env.RUNNER_TEMP))
            const temporary = await realpath(process.env.RUNNER_TEMP)
            check(!within(dist, temporary))
            const reportPath = path.join(temporary, "maplibre-inventory-" + runId + "-" + runAttempt + "-" + checkoutSha + ".json")
            const git = (...args) => execFileSync("git", args, {
              cwd: root, encoding: "utf8", timeout: 5000, maxBuffer: 4096,
              stdio: ["ignore", "pipe", "pipe"],
            }).trim()
            check(git("rev-parse", "--verify", "HEAD") === checkoutSha)
            const tracked = ["package.json", "package-lock.json", "vite.config.mts", "scripts/maplibre-build-metadata.mjs"]
            git("ls-files", "--error-unmatch", "--", ...tracked)
            git("diff", "--quiet", "HEAD", "--", ...tracked)
            const raw = await boundedFile(reportPath)
            const receipt = JSON.parse(raw.toString("utf8"))
            exact(receipt, ["schemaVersion", "profile", "package", "producerSha256", "viteConfigSha256", "graph", "mapLibreChunks"])
            check(receipt.schemaVersion === 3)
          
            const packageBytes = await insideFile(root, "package.json")
            const lockBytes = await insideFile(root, "package-lock.json")
            const installedBytes = await insideFile(root, "node_modules/maplibre-gl/package.json")
            const manifest = JSON.parse(packageBytes.toString("utf8"))
            const lock = JSON.parse(lockBytes.toString("utf8"))
            const installed = JSON.parse(installedBytes.toString("utf8"))
            const entry = lock.packages?.["node_modules/maplibre-gl"]
            const packageInfo = receipt.package
            exact(packageInfo, ["declared", "installedName", "installedVersion", "lockVersion", "lockIntegrity", "packageJsonSha256", "lockSha256", "installedManifestSha256"])
            check(
              packageInfo.declared === manifest.dependencies?.["maplibre-gl"] &&
              typeof packageInfo.declared === "string" && packageInfo.declared.length <= 128 &&
              packageInfo.installedName === "maplibre-gl" && installed.name === "maplibre-gl" &&
              packageInfo.installedVersion === "6.15.0" && installed.version === "6.15.0" &&
              packageInfo.lockVersion === "6.15.0" && entry?.version === "6.15.0" &&
              packageInfo.lockIntegrity === entry?.integrity &&
              typeof packageInfo.lockIntegrity === "string" &&
              /^sha(?:256|384|512)-[A-Za-z0-9+/=]{1,256}$/u.test(packageInfo.lockIntegrity)
            )
            check(
              packageInfo.packageJsonSha256 === hash(packageBytes) &&
              packageInfo.lockSha256 === hash(lockBytes) &&
              packageInfo.installedManifestSha256 === hash(installedBytes) &&
              receipt.producerSha256 === hash(await insideFile(root, "scripts/maplibre-build-metadata.mjs")) &&
              receipt.viteConfigSha256 === hash(await insideFile(root, "vite.config.mts"))
            )
            const profile = receipt.profile
            exact(profile, ["command", "mode", "isProduction", "lhci", "lhciEnv", "reactDevMode", "unminified", "consumer", "isWorker", "minify", "sourcemap", "target", "format"])
            check(
              profile.command === "build" && profile.mode === "production" &&
              profile.isProduction === true && profile.lhci === false && profile.lhciEnv === false &&
              profile.reactDevMode === false && profile.unminified === false &&
              profile.consumer === "client" && profile.isWorker === false && profile.format === "es" &&
              ["oxc", "esbuild", "terser"].includes(profile.minify) &&
              [false, true, "inline", "hidden"].includes(profile.sourcemap) &&
              Array.isArray(profile.target) && profile.target.length > 0 && profile.target.length <= 32 &&
              profile.target.every((value) => typeof value === "string" && /^[A-Za-z0-9.*+^~<>=| _/-]{1,128}$/u.test(value))
            )
            const graph = receipt.graph
            exact(graph, ["complete", "entryFiles", "unresolvedStaticImportCount", "unresolvedDynamicImportCount", "chunks"])
            check(Array.isArray(graph.chunks) && graph.chunks.length <= 5000)
            check(integer(graph.unresolvedStaticImportCount) && integer(graph.unresolvedDynamicImportCount))
            const graphNames = graph.chunks.map((chunk) => chunk.fileName)
            ordered(graphNames, 5000, safePath)
            const byName = new Map(graph.chunks.map((chunk) => [chunk.fileName, chunk]))
            let edgeCount = 0
            for (const chunk of graph.chunks) {
              exact(chunk, ["fileName", "rawBytes", "sha256", "isEntry", "isDynamicEntry", "imports", "dynamicImports"])
              check(integer(chunk.rawBytes, MAX_BYTES) && digest(chunk.sha256))
              const bytes = await insideFile(output, chunk.fileName)
              check(chunk.rawBytes === bytes.length && chunk.sha256 === hash(bytes))
              check(typeof chunk.isEntry === "boolean" && typeof chunk.isDynamicEntry === "boolean")
              for (const edges of [chunk.imports, chunk.dynamicImports]) {
                ordered(edges, 5000, (name) => safePath(name) && byName.has(name), true)
                edgeCount += edges.length
                check(edgeCount <= 50000)
              }
            }
            ordered(graph.entryFiles, 5000, (name) => safePath(name) && byName.has(name))
            check(JSON.stringify(graph.entryFiles) === JSON.stringify(graph.chunks.filter((chunk) => chunk.isEntry).map((chunk) => chunk.fileName)))
            check(graph.complete === (graph.entryFiles.length > 0 && graph.unresolvedStaticImportCount === 0))
            const reachable = new Set()
            const pending = [...graph.entryFiles]
            while (pending.length > 0) {
              const name = pending.pop()
              if (reachable.has(name)) continue
              reachable.add(name)
              pending.push(...byName.get(name).imports)
            }
          
            const candidates = receipt.mapLibreChunks
            check(Array.isArray(candidates) && candidates.length > 0 && candidates.length <= 8)
            ordered(candidates.map((chunk) => chunk.fileName), 8, (name) => safePath(name) && byName.has(name))
            const mapLibreChunks = []
            let moduleCount = 0
            for (const chunk of candidates) {
              exact(chunk, ["fileName", "staticEntryReachable", "rawBytes", "gzipBytes", "sha256", "gzipSha256", "modules"])
              check(chunk.staticEntryReachable === (graph.complete ? reachable.has(chunk.fileName) : null))
              check(integer(chunk.rawBytes, MAX_BYTES) && integer(chunk.gzipBytes, MAX_BYTES))
              check(digest(chunk.sha256) && digest(chunk.gzipSha256))
              const bytes = await insideFile(output, chunk.fileName)
              const compressed = gzipSync(bytes, { level: 9 })
              check(
                chunk.rawBytes === bytes.length && chunk.gzipBytes === compressed.length &&
                chunk.sha256 === hash(bytes) && chunk.gzipSha256 === hash(compressed)
              )
              check(Array.isArray(chunk.modules) && chunk.modules.length > 0)
              moduleCount += chunk.modules.length
              check(moduleCount <= 256)
              ordered(chunk.modules.map((module) => module.idSha256), 256, digest)
              const modules = []
              for (const module of chunk.modules) {
                check(["package", "project", "other"].includes(module.kind))
                const keys = ["kind", "idSha256", "renderedCodeUnits", "originalCodeUnits"]
                if (module.kind === "package") keys.push("package", "packageRoot", "path")
                exact(module, keys)
                check(integer(module.renderedCodeUnits) &&
                  (module.originalCodeUnits === null || integer(module.originalCodeUnits)))
                const safe = {
                  kind: module.kind, idSha256: module.idSha256,
                  renderedCodeUnits: module.renderedCodeUnits, originalCodeUnits: module.originalCodeUnits,
                }
                if (module.kind === "package") {
                  check(
                    safePath(module.package) && safePath(module.packageRoot) && safePath(module.path) &&
                    /^(?:@[a-z0-9._-]+\/)?[a-z0-9._-]+$/u.test(module.package) &&
                    (module.packageRoot === "node_modules/" + module.package ||
                      module.packageRoot.endsWith("/node_modules/" + module.package))
                  )
                  safe.package = module.package
                  safe.path = module.path
                }
                modules.push(safe)
              }
              check(
                modules.some((module) => module.kind === "package" && module.package === "maplibre-gl") ||
                /(?:^|\/)vendor-map(?:-|\.)/u.test(chunk.fileName)
              )
              mapLibreChunks.push({
                fileName: chunk.fileName, staticEntryReachable: chunk.staticEntryReachable,
                rawBytes: chunk.rawBytes, gzipBytes: chunk.gzipBytes,
                sha256: chunk.sha256, gzipSha256: chunk.gzipSha256, modules,
              })
            }
            const diagnostic = {
              kind: "maplibre-build-inventory-not-budget-proof",
              checkoutSha, runId, runAttempt, metadataSha256: hash(raw),
              producerSha256: receipt.producerSha256, viteConfigSha256: receipt.viteConfigSha256,
              package: packageInfo, profile,
              graph: {
                complete: graph.complete, entryFiles: graph.entryFiles, chunkCount: graph.chunks.length,
                unresolvedStaticImportCount: graph.unresolvedStaticImportCount,
                unresolvedDynamicImportCount: graph.unresolvedDynamicImportCount,
              },
              mapLibreChunks,
            }
            const line = "MAPLIBRE_BUILD_INVENTORY " + JSON.stringify(diagnostic) + "\n"
            check(Buffer.byteLength(line) <= 32768)
            process.stdout.write(line)
          } catch {
            process.stderr.write("MAPLIBRE_BUILD_INVENTORY_REJECTED\n")
            process.exitCode = 1
          }
          MAPLIBRE_INVENTORY

      - name: Capture bounded final HTML inventory
        id: capture-final-html-inventory
        timeout-minutes: 1
        env:
          NODE_OPTIONS: "--max-old-space-size=512 --max-semi-space-size=16"
          FINAL_HTML_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          FINAL_HTML_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'FINAL_HTML_INVENTORY'
          import { execFileSync } from "node:child_process"
          import { createHash } from "node:crypto"
          import { constants } from "node:fs"
          import { lstat, open, realpath, unlink } from "node:fs/promises"
          import { createRequire } from "node:module"
          import path from "node:path"
          import { pathToFileURL } from "node:url"
          import { getHeapStatistics } from "node:v8"

          const SOURCE_LIMIT = 2 * 1024 * 1024
          const REPORT_LIMIT = 65_536
          const MAX_V8_HEAP_BYTES = 640 * 1024 * 1024
          const REJECTION_REASONS = new Set([
            "input-read",
            "input-path",
            "platform",
            "path",
            "file-kind",
            "file-change",
            "file-bytes",
            "utf8",
            "empty-html",
            "namespace",
            "inline-location",
            "root-count",
            "ast-nodes",
            "import-edges",
            "total-asset-bytes",
            "output-bytes",
          ])
          const sourcePaths = [
            ".github/workflows/reusable-frontend-tests.yml",
            "frontend/package.json",
            "frontend/package-lock.json",
            "frontend/vite.config.mts",
            "frontend/scripts/final-html-root-inventory.mjs",
            "frontend/scripts/build-orchestrated.mjs",
            "frontend/scripts/post-build-shell.mjs",
          ]
          const hash = (bytes) => createHash("sha256").update(bytes).digest("hex")
          const check = (condition) => {
            if (!condition) throw new Error("invalid capture")
          }
          const commitId = (value) => typeof value === "string" && /^[a-f0-9]{40}$/u.test(value)
          const within = (root, value) => value === root || value.startsWith(root + path.sep)

          async function directory(value) {
            check(typeof value === "string" && path.isAbsolute(value))
            check(path.resolve(value) === value && (await realpath(value)) === value)
            const info = await lstat(value)
            check(info.isDirectory() && !info.isSymbolicLink())
            return value
          }

          async function boundedFile(file, maximum = SOURCE_LIMIT) {
            check((await realpath(path.dirname(file))) === path.dirname(file))
            const handle = await open(
              file,
              constants.O_RDONLY | constants.O_NOFOLLOW | constants.O_NONBLOCK
            )
            try {
              const before = await handle.stat({ bigint: true })
              check(before.isFile() && before.size >= 0n && before.size <= BigInt(maximum))
              const bytes = Buffer.alloc(maximum + 1)
              let size = 0
              while (size < bytes.length) {
                const read = await handle.read(bytes, size, bytes.length - size, null)
                if (read.bytesRead === 0) break
                size += read.bytesRead
              }
              const after = await handle.stat({ bigint: true })
              check(
                size <= maximum &&
                  before.size === BigInt(size) &&
                  before.dev === after.dev &&
                  before.ino === after.ino &&
                  before.size === after.size &&
                  before.mtimeNs === after.mtimeNs &&
                  before.ctimeNs === after.ctimeNs
              )
              return bytes.subarray(0, size)
            } finally {
              await handle.close()
            }
          }

          let ownedOutput
          let ownedIdentity
          let captureStage = "heap"
          try {
            // This bounds V8 heap, not native allocations, external buffers or total RSS.
            const heapLimit = getHeapStatistics().heap_size_limit
            check(Number.isSafeInteger(heapLimit) && heapLimit > 0)
            const heapReceipt = "FINAL_HTML_INVENTORY_HEAP_BYTES " + heapLimit + "\n"
            check(Buffer.byteLength(heapReceipt) <= 64)
            process.stdout.write(heapReceipt)
            check(heapLimit <= MAX_V8_HEAP_BYTES)
            check(
              [constants.O_NOFOLLOW, constants.O_NONBLOCK].every(
                (flag) => Number.isSafeInteger(flag) && flag > 0
              )
            )
            captureStage = "environment"
            const workspace = await directory(process.env.GITHUB_WORKSPACE)
            const frontend = await directory(path.join(workspace, "frontend"))
            check(path.resolve(process.cwd()) === frontend)
            const dist = await directory(path.join(frontend, "dist"))
            const client = await directory(path.join(dist, "client"))
            const temporary = await directory(process.env.RUNNER_TEMP)
            check(!within(dist, temporary))
            check(!process.env.VITE_LHCI)
            captureStage = "context"
            const {
              GITHUB_SHA: githubSha,
              GITHUB_RUN_ID: runId,
              GITHUB_RUN_ATTEMPT: runAttempt,
              GITHUB_EVENT_NAME: eventName,
            } = process.env
            check(commitId(githubSha))
            check(typeof runId === "string" && /^[1-9][0-9]{0,19}$/u.test(runId))
            check(typeof runAttempt === "string" && /^[1-9][0-9]{0,9}$/u.test(runAttempt))
            check(eventName === "pull_request" || eventName === "push")
            const prHeadSha = process.env.FINAL_HTML_PR_HEAD_SHA || null
            const prBaseSha = process.env.FINAL_HTML_PR_BASE_SHA || null
            check(
              eventName === "pull_request"
                ? commitId(prHeadSha) && commitId(prBaseSha)
                : prHeadSha === null && prBaseSha === null
            )

            // These commands read only this checkout. Never inherit Git overrides or credentials.
            captureStage = "git"
            const gitEnvironment = {
              PATH: process.env.PATH || "",
              HOME: workspace,
              GIT_CONFIG_NOSYSTEM: "1",
              GIT_CONFIG_GLOBAL: "/dev/null",
              GIT_TERMINAL_PROMPT: "0",
              GIT_OPTIONAL_LOCKS: "0",
              GIT_NO_LAZY_FETCH: "1",
              GIT_NO_REPLACE_OBJECTS: "1",
              LC_ALL: "C",
            }
            const git = (args, maximum = 4096) =>
              execFileSync("git", ["--no-pager", "-c", "core.fsmonitor=false", ...args], {
                cwd: workspace,
                env: gitEnvironment,
                timeout: 5000,
                maxBuffer: maximum,
                stdio: ["ignore", "pipe", "pipe"],
              })
            const gitText = (args) => git(args).toString("utf8").trim()
            check(gitText(["rev-parse", "--show-toplevel"]) === workspace)
            const checkoutSha = gitText(["rev-parse", "--verify", "HEAD"])
            check(checkoutSha === githubSha)
            // Raw commit headers preserve parents even when checkout used fetch-depth: 1.
            const rawCommit = git(["cat-file", "commit", checkoutSha], 65_536)
            const headerEnd = rawCommit.indexOf("\n\n")
            check(headerEnd > 0)
            const headers = rawCommit.subarray(0, headerEnd).toString("utf8").split("\n")
            const trees = headers.filter((line) => line.startsWith("tree "))
            const parentShas = headers
              .filter((line) => line.startsWith("parent "))
              .map((line) => line.slice(7))
            check(trees.length === 1 && parentShas.length <= 16 && parentShas.every(commitId))
            check(new Set(parentShas).size === parentShas.length)
            const treeSha = trees[0].slice(5)
            check(commitId(treeSha) && gitText(["rev-parse", "HEAD^{tree}"]) === treeSha)
            if (eventName === "pull_request") {
              check(parentShas.length === 2 && parentShas[0] === prBaseSha && parentShas[1] === prHeadSha)
            }

            captureStage = "source"
            const checkedSourceFiles = {}
            const sourceBytes = new Map()
            for (const relative of sourcePaths) {
              const bytes = await boundedFile(path.join(workspace, relative))
              const committed = git(["cat-file", "blob", checkoutSha + ":" + relative], SOURCE_LIMIT)
              check(bytes.equals(committed))
              checkedSourceFiles[relative] = hash(bytes)
              sourceBytes.set(relative, bytes)
            }
            captureStage = "toolchain"
            const lock = JSON.parse(sourceBytes.get("frontend/package-lock.json").toString("utf8"))
            const require = createRequire(path.join(frontend, "package.json"))
            const toolchain = {}
            for (const [name, label, version] of [
              ["jsdom", "jsdom", "30.1.3"],
              ["@babel/parser", "babelParser", "8.0.7"],
            ]) {
              const packageFile = require.resolve(name + "/package.json")
              const installed = JSON.parse((await boundedFile(packageFile)).toString("utf8"))
              check(installed.name === name && installed.version === version)
              check(lock.packages?.["node_modules/" + name]?.version === version)
              toolchain[label] = installed.version
            }

            // Verified source, not a sandbox: dependencies and runner ownership are external prerequisites.
            captureStage = "import"
            const { inspectFinalHtml } = await import(
              pathToFileURL(path.join(frontend, "scripts/final-html-root-inventory.mjs")).href
            )
            captureStage = "inventory"
            let rejectionReason
            let rejectionCalls = 0
            const inventory = await inspectFinalHtml(client, (reason) => {
              rejectionCalls += 1
              if (REJECTION_REASONS.has(reason)) rejectionReason = reason
            })
            if (inventory === null) {
              check(rejectionCalls === 1 && REJECTION_REASONS.has(rejectionReason))
              const rejected = "FINAL_HTML_INVENTORY_REJECTION " + rejectionReason + "\n"
              check(Buffer.byteLength(rejected) < 128)
              process.stdout.write(rejected)
            }
            check(
              inventory !== null &&
                rejectionCalls === 0 &&
                inventory.schemaVersion === 2 &&
                inventory.kind === "final-html-root-inventory-not-budget-proof" &&
                Buffer.byteLength(JSON.stringify(inventory)) <= 32_767
            )
            check(
              Array.isArray(inventory.scripts) &&
                inventory.scripts.length <= 256 &&
                Array.isArray(inventory.documents) &&
                inventory.documents.length === 2
            )
            check(
              new Set(inventory.scripts.map((script) => JSON.stringify(script))).size ===
                inventory.scripts.length
            )
            const referencedScripts = new Set()
            for (const document of inventory.documents) {
              check(Array.isArray(document.roots) && document.roots.length <= 128)
              for (const root of document.roots) {
                check(
                  Number.isSafeInteger(root.scriptIndex) &&
                    root.scriptIndex >= 0 &&
                    root.scriptIndex < inventory.scripts.length
                )
                if (!referencedScripts.has(root.scriptIndex)) {
                  check(root.scriptIndex === referencedScripts.size)
                  referencedScripts.add(root.scriptIndex)
                }
              }
            }
            check(referencedScripts.size === inventory.scripts.length)
            captureStage = "recheck"
            check(gitText(["rev-parse", "--verify", "HEAD"]) === checkoutSha)
            for (const relative of sourcePaths) {
              check(hash(await boundedFile(path.join(workspace, relative))) === checkedSourceFiles[relative])
            }

            // Event/run values remain claimed context; this is not authenticated artifact admission.
            captureStage = "output"
            const report = {
              schemaVersion: 1,
              kind: "final-html-capture-diagnostic-not-admission",
              profile: "production-final-client",
              checkout: { commitSha: checkoutSha, treeSha, parentShas },
              eventContext: { eventName, githubSha, prHeadSha, prBaseSha },
              relationship:
                eventName === "pull_request" ? "merge-parents-match-event-context" : "checkout-only",
              runContext: { runId, runAttempt },
              checkedSourceFiles,
              toolchain,
              inventory,
            }
            const bytes = Buffer.from(JSON.stringify(report) + "\n")
            const logged =
              "FINAL_HTML_INVENTORY_CAPTURE " +
              JSON.stringify({ report, reportSha256: hash(bytes) }) +
              "\n"
            check(
              bytes.length <= REPORT_LIMIT &&
                Buffer.byteLength(heapReceipt) + Buffer.byteLength(logged) <= REPORT_LIMIT
            )
            const output = path.join(
              temporary,
              "final-html-inventory-" + runId + "-" + runAttempt + "-" + checkoutSha + ".json"
            )
            const handle = await open(
              output,
              constants.O_WRONLY | constants.O_CREAT | constants.O_EXCL | constants.O_NOFOLLOW,
              0o600
            )
            ownedOutput = output
            try {
              ownedIdentity = await handle.stat({ bigint: true })
              check(ownedIdentity.isFile() && (ownedIdentity.mode & 0o777n) === 0o600n)
              await handle.writeFile(bytes)
            } finally {
              await handle.close()
            }
            captureStage = "readback"
            const verified = await boundedFile(output, REPORT_LIMIT)
            check(verified.equals(bytes) && hash(verified) === hash(bytes))
            const published = await lstat(output, { bigint: true })
            check(
              published.isFile() &&
                published.dev === ownedIdentity.dev &&
                published.ino === ownedIdentity.ino &&
                published.size === BigInt(bytes.length) &&
                (published.mode & 0o777n) === 0o600n
            )
            process.stdout.write(logged)
          } catch {
            // Remove only our own partial file, never a pre-existing output or substituted inode.
            if (ownedOutput && ownedIdentity) {
              try {
                const current = await lstat(ownedOutput, { bigint: true })
                if (current.dev === ownedIdentity.dev && current.ino === ownedIdentity.ino) {
                  await unlink(ownedOutput)
                }
              } catch {
                // The owned temporary directory is later removed by the runner.
              }
            }
            process.stdout.write("FINAL_HTML_INVENTORY_CAPTURE_STAGE " + captureStage + "\n")
            process.stderr.write("FINAL_HTML_INVENTORY_CAPTURE_REJECTED\n")
            process.exitCode = 1
          }
          FINAL_HTML_INVENTORY

      - name: Upload final HTML inventory
        id: upload-final-html-inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-final-html-inventory-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/final-html-inventory-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist
          if-no-files-found: error

      # Lighthouse must use a bundle compiled with VITE_LHCI=true.  That flag
      # controls compile-time mocks and SSR-safe UI branches, so setting it in
      # the shard after downloading the production bundle is too late.  Reuse
      # the WASM artifacts produced above and build this second immutable
      # bundle once, keeping the expensive wasm-pack work out of every shard.
      - name: Build Lighthouse bundle
        run: npm run build
        env:
          VITE_LHCI: "true"
          SKIP_WASM_BUILD: "1"

      - name: Upload Lighthouse bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-lhci-dist
          path: ${{ inputs.working-directory }}/dist
          if-no-files-found: error


  # Fail-closed bundle budgets and a machine-readable report for trend tracking.
  bundle-analysis:
    name: Bundle Analysis
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable WASM modules
        if: ${{ inputs.wasm-artifact-id == '' && inputs.wasm-artifact-name == '' && inputs.wasm-artifact-digest == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}

      - name: Download shared immutable WASM modules
        if: ${{ inputs.wasm-artifact-id != '' && inputs.wasm-artifact-name != '' && inputs.wasm-artifact-digest != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.wasm-artifact-id }}
          path: ${{ inputs.working-directory }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download production bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Test bundle analyzer
        run: node --test scripts/check-bundle-budget.test.mjs scripts/maplibre-build-metadata.test.mjs

      - name: Analyze bundle size
        run: node scripts/check-bundle-budget.mjs

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-report
          path: ${{ inputs.working-directory }}/bundle-report.json
          if-no-files-found: warn

  # Keep the full 10-route × 3-run Lighthouse matrix, but execute independent
  # route groups concurrently. A single sequential job exceeded its 30-minute
  # budget before producing the reports; sharding changes wall-clock time only.
  lighthouse-shards:
    name: Lighthouse Audit (${{ matrix.shard }})
    if: ${{ inputs.run-lighthouse }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Route coverage remains complete; two concurrent audits avoid starving
      # E2E and mutation producers on the shared runner pool.
      max-parallel: 2
      matrix:
        include:
          - shard: core
            urls: ",login/,dashboard/"
          - shard: content
            urls: "news/,schedule/,events/"
          - shard: realtime
            urls: "activity/,map/,messenger/"
          - shard: fallback
            urls: "404/"
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
      LHCI_URLS: ${{ matrix.urls }}
      # The dedicated LHCI bundle is built once by the `build` job with
      # VITE_LHCI=true and downloaded into this shard. Rebuilding here would
      # make every shard re-download Binaryen through wasm-pack, so a transient
      # GitHub Releases outage could fail Lighthouse before a single audit
      # starts. run-lhci still prepares route fallbacks and performs the
      # complete collect/assert gate.
      SKIP_BUILD: "1"
      # Serve route-specific SSR HTML from the immutable build. Measuring the
      # route-agnostic static SPA fallback would clear it through createRoot()
      # on every deep link and turn route chunk loading into synthetic LCP.
      LHCI_USE_SSR_PREVIEW: "1"
      LHCI_SSR_PREVIEW_PORT: "4175"
      # ubuntu-24.04 already contains the browser runtime libraries. The
      # Playwright apt bootstrap is intentionally opt-in here: every matrix
      # shard has its own runner, and a slow apt mirror can consume the full
      # Lighthouse timeout before the audit begins.
      LHCI_SKIP_SYSTEM_DEPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Download Lighthouse bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-lhci-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Lighthouse CI shard
        run: npm run lhci

      - name: Upload Lighthouse shard reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/.lighthouseci
          include-hidden-files: true
          if-no-files-found: error

  # Preserve the required check display name and the single artifact consumed
  # by ci.yml's Performance Gate while allowing the route shards to run in
  # parallel. Every shard has already run lhci assert plus the route privacy
  # policy; this job verifies the complete matrix and materializes one exact,
  # retry-safe LHR artifact.
  lighthouse:
    name: Lighthouse Audit
    if: ${{ always() && !cancelled() && inputs.run-lighthouse }}
    needs: lighthouse-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Verify all Lighthouse shards passed
        if: ${{ needs.lighthouse-shards.result != 'success' }}
        # This guard runs before the artifact download creates the frontend
        # working directory.  Keep it at the workspace root so a failed shard
        # reports the real Lighthouse failure instead of a missing cwd error.
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::One or more Lighthouse shards failed"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download Lighthouse shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lighthouse-reports-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ inputs.working-directory }}/.lighthouseci-shards
          merge-multiple: false

      - name: Assemble canonical Lighthouse evidence
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHARDS_ROOT: "${{ inputs.working-directory }}/.lighthouseci-shards"
        run: |
          set -euo pipefail
          producer_root=artifacts/lighthouse/producer
          shards_root="$SHARDS_ROOT"
          prefix="lighthouse-reports-${RUN_ID}-${RUN_ATTEMPT}"
          expected_shards=(core content realtime fallback)
          expected_counts=(9 9 9 3)

          if [[ -L artifacts || -L artifacts/lighthouse || -L "$shards_root" ]]; then
            echo "::error::Lighthouse evidence path must not traverse a symlink"
            exit 1
          fi
          rm -rf -- "$producer_root"
          mkdir -p "$producer_root/lhr"
          test -d "$shards_root"
          if find "$shards_root" -mindepth 1 -maxdepth 1 -type l -print -quit | grep -q .; then
            echo "::error::Lighthouse shard download contains a symlink"
            exit 1
          fi
          actual_members="$(find "$shards_root" -mindepth 1 -maxdepth 1 -print | wc -l)"
          if [[ "$actual_members" -ne "${#expected_shards[@]}" ]]; then
            echo "::error::Lighthouse shard download contains an unexpected artifact member"
            exit 1
          fi
          actual_shards="$(find "$shards_root" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          if [[ "$actual_shards" -ne "${#expected_shards[@]}" ]]; then
            echo "::error::Expected exactly ${#expected_shards[@]} Lighthouse shard artifacts, found $actual_shards"
            exit 1
          fi

          total=0
          for position in "${!expected_shards[@]}"; do
            shard="${expected_shards[$position]}"
            expected_count="${expected_counts[$position]}"
            shard_dir="$shards_root/${prefix}-${shard}"
            if [[ ! -d "$shard_dir" ]]; then
              echo "::error::Missing Lighthouse artifact for shard $shard"
              exit 1
            fi
            if find "$shard_dir" -type l -print -quit | grep -q .; then
              echo "::error::Lighthouse shard artifact contains a symlink: $shard"
              exit 1
            fi
            mapfile -d '' reports < <(find "$shard_dir" -type f -name 'lhr-*.json' -print0 | sort -z)
            if [[ "${#reports[@]}" -ne "$expected_count" ]]; then
              echo "::error::Expected $expected_count Lighthouse LHR JSON reports for shard $shard, found ${#reports[@]}"
              exit 1
            fi
            mkdir -p "$producer_root/lhr/$shard"
            for index in "${!reports[@]}"; do
              report="${reports[$index]}"
              printf -v report_name "lhr-%02d.json" "$index"
              target="$producer_root/lhr/$shard/$report_name"
              test -f "$report"
              test ! -L "$report"
              cp -- "$report" "$target"
              total=$((total + 1))
            done
          done
          # core/content/realtime carry three routes × three runs; fallback
          # carries the dedicated 404 route × three runs.  The retry selector
          # accepts only this fixed 30-LHR matrix.
          if [[ "$total" -ne 30 ]]; then
            echo "::error::Expected exactly 30 Lighthouse LHR JSON reports, found $total"
            exit 1
          fi
          echo "Assembled $total canonical Lighthouse LHR reports"

      - name: Write Lighthouse evidence provenance
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          LOGICAL_ARTIFACT_NAME: lighthouse-reports
          PHYSICAL_ARTIFACT_NAME: lighthouse-reports-attempt-${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          workspace_root="$(pwd -P)"
          github_workspace_root="$(realpath -- "$GITHUB_WORKSPACE")"
          if [[ "$workspace_root" != "$github_workspace_root" ]]; then
            echo "::error::Lighthouse provenance workspace is not the canonical checkout root" >&2
            printf 'pwd -P=%s\nGITHUB_WORKSPACE=%s\nrealpath(GITHUB_WORKSPACE)=%s\n' \
              "$workspace_root" "$GITHUB_WORKSPACE" "$github_workspace_root" >&2
            exit 1
          fi
          producer_root=artifacts/lighthouse/producer
          test -d "$producer_root"
          python_version="$(python3 --version | awk '{print $2}')"
          reports=()
          for shard_spec in core:9 content:9 realtime:9 fallback:3; do
            shard="${shard_spec%%:*}"
            count="${shard_spec##*:}"
            for ((index = 0; index < count; index += 1)); do
              printf -v report_name "lhr-%02d.json" "$index"
              source="$producer_root/lhr/$shard/$report_name"
              test -s "$source"
              reports+=(--report "lighthouse-$shard|lighthouse-lhr-json|$source|lhr/$shard/$report_name")
            done
          done
          # Each report is passed as a ``--report``/value pair.  Validate the
          # number of complete pairs rather than the raw argv length; checking
          # the latter against 30 would make this step exit silently at 60
          # elements before the provenance writer runs.
          test "${#reports[@]}" -eq 60
          provenance_dir="$producer_root/provenance"
          mkdir -p -- "$provenance_dir"
          test -d "$provenance_dir"
          test ! -L "$provenance_dir"
          provenance_output="$provenance_dir/lighthouse-reports.json"
          retry_output="$(mktemp)"
          retry_error="$(mktemp)"
          write_output="$(mktemp)"
          write_error="$(mktemp)"
          trap 'rm -f "$retry_output" "$retry_error" "$write_output" "$write_error"' EXIT
          retry_status=0
          python3 -m scripts.quality.coverage_retry_provenance_cli \
              --repository-root "$GITHUB_WORKSPACE" \
              --repository "$WORKFLOW_REPOSITORY" \
              --run-id "$RUN_ID" \
              --run-attempt "$RUN_ATTEMPT" \
              --workflow-ref "$WORKFLOW_REF" \
              --workflow-sha "$WORKFLOW_SHA" \
              --event "$WORKFLOW_EVENT" \
              --artifact "$LOGICAL_ARTIFACT_NAME" \
              --config-input .github/workflows/reusable-frontend-tests.yml \
              --config-input .lighthouserc.js \
              --config-input frontend/package.json \
              --config-input frontend/package-lock.json \
              --config-input frontend/scripts/run-lhci.mjs \
              --config-input frontend/scripts/lhci-route-policy.mjs \
              --config-input frontend/scripts/lhci-route-policy-config.cjs \
              --policy-input budget.json \
              --policy-input frontend/public/robots.txt \
              --policy-input quality/quality-contract.json \
              --policy-input .github/workflows/ci.yml \
              --policy-input scripts/quality/coverage_provenance.py \
              --policy-input scripts/quality/coverage_retry_context.py \
              --policy-input scripts/quality/coverage_retry_provenance_cli.py \
              --policy-input scripts/quality/select_coverage_artifacts.py \
              --policy-input scripts/quality/select_lighthouse_artifacts.py \
              --policy-input scripts/quality/select_lighthouse_artifacts_cli.py \
              >"$retry_output" 2>"$retry_error" || retry_status=$?
          if [[ "$retry_status" -ne 0 ]]; then
            echo "::error::Lighthouse retry provenance CLI failed with exit $retry_status." >&2
            cat "$retry_error" >&2
            exit "$retry_status"
          fi
          retry_values=()
          mapfile -t retry_values < "$retry_output"
          if [[ "${#retry_values[@]}" -ne 11 ]]; then
            echo "::error::Lighthouse retry CLI returned ${#retry_values[@]} values; expected 11." >&2
            cat "$retry_error" >&2
            nl -ba "$retry_output" >&2
            exit 1
          fi
          retry_args=()
          for value in "${retry_values[@]}"; do
            retry_args+=(--retry-provenance "$value")
          done
          write_status=0
          python3 scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output "$provenance_output" \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "$LOGICAL_ARTIFACT_NAME" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "python=$python_version" \
            --tool-version quality-provenance=2.0.0 \
            --tool-version lighthouse-lhr-inventory=30 \
            "${reports[@]}" \
            "${retry_args[@]}" \
            >"$write_output" 2>"$write_error" || write_status=$?
          if [[ "$write_status" -ne 0 ]]; then
            echo "::error::Lighthouse evidence provenance writer failed with exit $write_status." >&2
            cat "$write_error" >&2
            cat "$write_output" >&2
            exit "$write_status"
          fi
          if [[ ! -f "$provenance_output" || -L "$provenance_output" || ! -s "$provenance_output" ]]; then
            echo "::error::Lighthouse evidence provenance writer produced no regular, non-empty sidecar at the expected workspace path." >&2
            printf 'working directory: %s\n' "$(pwd -P)" >&2
            printf 'provenance directory listing:\n' >&2
            ls -la "$provenance_dir" >&2 || true
            printf 'provenance output path: %s\n' "$provenance_output" >&2
            if [[ -e "$provenance_output" || -L "$provenance_output" ]]; then
              stat --printf='mode=%a size=%s inode=%i links=%h type=%F\n' "$provenance_output" >&2 || true
            fi
            printf 'writer stderr:\n' >&2
            cat "$write_error" >&2
            printf 'writer stdout:\n' >&2
            cat "$write_output" >&2
            exit 1
          fi
          test -s "$provenance_output"

      - name: Upload Lighthouse retry evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports-attempt-${{ github.run_attempt }}
          path: artifacts/lighthouse/producer
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
