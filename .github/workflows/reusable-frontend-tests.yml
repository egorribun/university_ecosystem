# Reusable Frontend Tests Workflow
name: Frontend Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      working-directory:
        description: "Frontend directory"
        required: false
        type: string
        default: "frontend"
      run-e2e:
        description: "Run Playwright E2E tests"
        required: false
        type: boolean
        default: false
      run-lighthouse:
        description: "Run Lighthouse audits"
        required: false
        type: boolean
        default: false

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-pack
        # W142 polish-v3 — taiki-e/install-action wasm-pack broken (drager/
        # wasm-pack 404; rustwasm/wasm-pack canonical since v0.14.0). Same
        # fix as W141 polish-v2 visual-audit.yml + W142 chromatic.yml.
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Build WASM modules
        run: |
          wasm-pack build rust-crypto --target web
          wasm-pack build wasm-sanitizer --target web

      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:ci
        env:
          CI: "true"

      - name: Upload vitest report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-vitest-report
          path: ${{ inputs.working-directory }}/vitest-report.xml
          if-no-files-found: warn

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: ${{ inputs.working-directory }}/coverage/

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-pack
        # W142 polish-v3 — taiki-e/install-action wasm-pack broken (drager/
        # wasm-pack 404; rustwasm/wasm-pack canonical since v0.14.0). Same
        # fix as W141 polish-v2 visual-audit.yml + W142 chromatic.yml.
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Build WASM modules
        run: |
          wasm-pack build rust-crypto --target web
          wasm-pack build wasm-sanitizer --target web

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # MOD-43-01 (audit 2026-03-29 Wave 43): Token sync drift gate.
      # Ensures CSS → TS token mirror stays in sync. Fails if sync produces a diff.
      - name: Verify token sync (CSS ↔ TS)
        run: |
          npm run tokens:sync
          git diff --exit-code src/theme/tokens.ts || {
            echo "::error::tokens.ts is out of sync with CSS tokens. Run 'npm run tokens:sync' and commit."
            exit 1
          }

      # Wave 112 — i18n EN↔RU parity gate (was manual via npm run i18n:check,
      # now enforced in CI so missing translations fail the build).
      - name: Verify i18n EN↔RU parity
        run: npm run i18n:check

      - name: Run ts-prune (dead code check)
        run: npm run lint:deadcode

      - name: Run depcheck (dependency check)
        run: npm run lint:depcheck


  build:
    name: Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # P0-01 (audit 2026-03-06): Replaced unsafe shell-piped installer with taiki-e/install-action.
      # The action verifies SHA256 checksums from official GitHub releases, preventing
      # supply chain attacks via DNS hijacking or CDN compromise (OWASP CI/CD C-PPE-1).
      - name: Install wasm-pack
        # W142 polish-v3 — taiki-e/install-action wasm-pack broken (drager/
        # wasm-pack 404; rustwasm/wasm-pack canonical since v0.14.0). Same
        # fix as W141 polish-v2 visual-audit.yml + W142 chromatic.yml.
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Build rust-crypto
        run: |
          cd rust-crypto
          wasm-pack build --target web

      - name: Build app
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist
          if-no-files-found: error

  # MOD-23-06 (audit 2026-03-25 Wave 23): Bundle size analysis.
  # Alerts on >500 KB main chunk growth and generates a JSON report for trend tracking.
  bundle-analysis:
    name: Bundle Analysis
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Analyze bundle size
        run: |
          # Generate JSON report of all chunks
          echo '{}' > bundle-report.json
          total_size=0
          main_chunk_size=0
          for f in dist/client/assets/*.js; do
            size=$(wc -c < "$f")
            name=$(basename "$f")
            total_size=$((total_size + size))
            # Track main/index chunk specifically
            if echo "$name" | grep -qE '^(index|main)'; then
              main_chunk_size=$size
            fi
            echo "  $name: $(( size / 1024 )) KB"
          done
          echo ""
          echo "Total JS: $(( total_size / 1024 )) KB"
          echo "Main chunk: $(( main_chunk_size / 1024 )) KB"
          echo ""
          # Fail if main chunk exceeds 500 KB (gzipped will be ~150 KB)
          LIMIT_KB=500
          main_kb=$(( main_chunk_size / 1024 ))
          if [ "$main_kb" -gt "$LIMIT_KB" ]; then
            echo "::error::Main chunk ($main_kb KB) exceeds $LIMIT_KB KB budget"
            exit 1
          fi
          echo "::notice::Bundle analysis passed — main chunk $main_kb KB (limit: $LIMIT_KB KB)"

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-report
          path: ${{ inputs.working-directory }}/bundle-report.json
          if-no-files-found: warn

  lighthouse:
    name: Lighthouse Audit
    if: ${{ inputs.run-lighthouse }}
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Download built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Install dependencies
        run: npm ci

      - name: Install wasm-pack
        # W142 polish-v3 — taiki-e/install-action wasm-pack broken (drager/
        # wasm-pack 404; rustwasm/wasm-pack canonical since v0.14.0). Same
        # fix as W141 polish-v2 visual-audit.yml + W142 chromatic.yml.
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Run Lighthouse CI
        run: npm run lhci

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-reports
          path: ${{ inputs.working-directory }}/.lighthouseci
          if-no-files-found: warn
