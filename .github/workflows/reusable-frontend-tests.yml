# Reusable Frontend Tests Workflow
name: Frontend Tests

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      working-directory:
        description: "Frontend directory"
        required: false
        type: string
        default: "frontend"
      run-e2e:
        description: "Run Playwright E2E tests"
        required: false
        type: boolean
        default: false
      run-lighthouse:
        description: "Run Lighthouse audits"
        required: false
        type: boolean
        default: false

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:ci
        env:
          CI: "true"

      - name: Upload vitest report
        uses: actions/upload-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-vitest-report
          path: ${{ inputs.working-directory }}/vitest-report.xml
          if-no-files-found: warn

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  build:
    name: Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # P0-01 (audit 2026-03-06): Replaced unsafe `curl | sh` with taiki-e/install-action.
      # The action verifies SHA256 checksums from official GitHub releases, preventing
      # supply chain attacks via DNS hijacking or CDN compromise (OWASP CI/CD C-PPE-1).
      - name: Install wasm-pack
        uses: taiki-e/install-action@385db9cc6bf65d19775b02084a4b698eaca9a4f2 # v2.68.19
        with:
          tool: wasm-pack

      - name: Build rust-crypto
        run: |
          cd rust-crypto
          wasm-pack build --target web

      - name: Build app
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist
          if-no-files-found: error

  lighthouse:
    name: Lighthouse Audit
    if: ${{ inputs.run-lighthouse }}
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      VITE_BACKEND_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Download built dist
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: ${{ inputs.working-directory }}/dist

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: npm run lhci

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: always()
        with:
          name: lighthouse-reports
          path: ${{ inputs.working-directory }}/.lighthouseci
          if-no-files-found: warn
