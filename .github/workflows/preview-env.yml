# Preview Environments Pipeline
# Automatically spins up an isolated namespace in Kubernetes on PR creation
# and tears it down when the PR is closed or merged.
name: Preview Environments

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: preview-env-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview Env
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Kubeconfig
        # In a real environment, this would configure kubectl using a secret kubeconfig.
        # Here we mock it or configure it if secrets are present.
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "${PREVIEW_KUBECONFIG}" ]; then
            mkdir -p ~/.kube
            printf '%s' "${PREVIEW_KUBECONFIG}" > ~/.kube/config
          else
            echo "Mocking Kubernetes setup (dry-run mode)"
          fi

      - name: Create Isolated Namespace
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          NAMESPACE="pr-${PR_NUMBER}"
          echo "Namespace: $NAMESPACE"
          # kubectl create namespace $NAMESPACE || true

      - name: Deploy Infrastructure (Postgres, Redis, NATS)
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          NAMESPACE="pr-${PR_NUMBER}"
          echo "Deploying infra to $NAMESPACE..."
          # helm install infra charts/infra -n $NAMESPACE --create-namespace

      - name: Run Database Migrations
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          NAMESPACE="pr-${PR_NUMBER}"
          echo "Running database migrations in $NAMESPACE..."
          # kubectl exec -n $NAMESPACE deploy/backend -- alembic upgrade head

      - name: Deploy Application (Helm)
        run: |
          # NAMESPACE="pr-${{ github.event.number }}"
          # helm upgrade --install university-ecosystem charts/university-ecosystem \
          #   --namespace $NAMESPACE \
          #   --set frontend.ingress.host="pr-${{ github.event.number }}.dev.university.ru" \
          #   --set gateway.config.jwtSecret="${{ secrets.JWT_SECRET }}"

      - name: Deploy Chaos Mesh Experiments
        run: |
          # NAMESPACE="pr-${{ github.event.number }}"
          # echo "Deploying Chaos Mesh manifests to $NAMESPACE..."
          # kubectl apply -n $NAMESPACE -f k8s/chaos/network-delay.yaml
          # kubectl apply -n $NAMESPACE -f k8s/chaos/network-loss.yaml
          # kubectl apply -n $NAMESPACE -f k8s/chaos/pod-failure.yaml

      - name: OWASP ZAP Baseline Scan
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        if: ${{ env.KUBECONFIG != '' }}
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'https://pr-${{ github.event.number }}.dev.university.ru'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true

      - name: Post Preview URL Link to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = context.issue.number;
            const url = `https://pr-${prNumber}.dev.university.ru`;
            const commentBody = `🚀 **Preview Environment deployed successfully!**\n\n🔗 Test instance URL: [${url}](${url})\n\n_This environment will be automatically destroyed when the PR is closed or merged._`;
            
            // Check if comment already exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.find(c => c.body.includes("Preview Environment deployed"));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

  cleanup-preview:
    name: Teardown Preview Env
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Kubeconfig
        env:
          PREVIEW_KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "${PREVIEW_KUBECONFIG}" ]; then
            mkdir -p ~/.kube
            printf '%s' "${PREVIEW_KUBECONFIG}" > ~/.kube/config
          fi

      - name: Teardown Chaos Mesh Experiments
        run: |
          # NAMESPACE="pr-${{ github.event.number }}"
          # echo "Deleting Chaos Mesh manifests in $NAMESPACE..."
          # kubectl delete -n $NAMESPACE -f k8s/chaos/network-delay.yaml --ignore-not-found
          # kubectl delete -n $NAMESPACE -f k8s/chaos/network-loss.yaml --ignore-not-found
          # kubectl delete -n $NAMESPACE -f k8s/chaos/pod-failure.yaml --ignore-not-found

      - name: Delete Namespace
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          NAMESPACE="pr-${PR_NUMBER}"
          echo "Tearing down Preview Environment: $NAMESPACE..."
          # kubectl delete namespace $NAMESPACE --wait=false
