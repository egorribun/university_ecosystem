name: Recover source-bound WASM packages

on:
  push:
    branches: [egorribun]
    paths:
      - ".github/workflows/wasm-source-recovery.yml"

permissions:
  contents: read

jobs:
  recover:
    name: Regenerate and verify WASM packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup Rust toolchain
        # Keep E2E's same-run producer byte-identical to the checked-in
        # packages and the frontend producer despite hosted-image updates.
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned action
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-pack@0.15.0

      - name: Install pinned wasm-opt
        shell: bash
        run: |
          set -euo pipefail
          binaryen_version="version_133"
          binaryen_sha256="2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489" # public Binaryen release checksum
          binaryen_root="$RUNNER_TEMP/binaryen-$binaryen_version"
          binaryen_archive="$RUNNER_TEMP/binaryen-$binaryen_version-x86_64-linux.tar.gz"
          binaryen_url="https://github.com/WebAssembly/binaryen/releases/download/$binaryen_version/binaryen-$binaryen_version-x86_64-linux.tar.gz"
          rm -rf -- "$binaryen_root"
          mkdir -p -- "$binaryen_root"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$binaryen_archive" "$binaryen_url"
          printf '%s  %s\n' "$binaryen_sha256" "$binaryen_archive" \
            | sha256sum --check --strict
          tar --extract --file "$binaryen_archive" --strip-components=1 --directory "$binaryen_root"
          test -x "$binaryen_root/bin/wasm-opt"
          "$binaryen_root/bin/wasm-opt" --version | grep -Fq "version 133"
          echo "$binaryen_root/bin" >> "$GITHUB_PATH"


      - name: Rebuild source-bound packages and verify behavior
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --manifest-path rust-crypto/Cargo.toml --format-version 1 > /dev/null
          cargo metadata --locked --manifest-path wasm-sanitizer/Cargo.toml --format-version 1 > /dev/null
          rm -rf -- rust-crypto/pkg wasm-sanitizer/pkg
          node --input-type=module <<'JS'
          import { buildWasmArtifacts } from "./scripts/build-wasm.mjs"
          await buildWasmArtifacts(process.cwd())
          JS
          git diff --exit-code -- rust-crypto/Cargo.toml rust-crypto/Cargo.lock rust-crypto/src/lib.rs wasm-sanitizer/Cargo.toml wasm-sanitizer/Cargo.lock wasm-sanitizer/src/lib.rs
          node scripts/verify-wasm-artifacts.mjs
          node wasm-sanitizer/tests/wasm_sanitizer_node_test.js
          node --test scripts/wasm-runtime-smoke.test.mjs

      - name: Export verified package bytes for GitHub-only recovery
        working-directory: frontend
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module <<'JS'
          import { createHash } from "node:crypto"
          import { readFile, lstat } from "node:fs/promises"
          import { validateSourceProvenance } from "./scripts/wasm-source-provenance.mjs"
          const metadata = await validateSourceProvenance(process.cwd())
          const expected = [
            "rust-crypto/pkg/package.json",
            "rust-crypto/pkg/uni_wasm_crypto.d.ts",
            "rust-crypto/pkg/uni_wasm_crypto.js",
            "rust-crypto/pkg/uni_wasm_crypto_bg.wasm",
            "wasm-sanitizer/pkg/package.json",
            "wasm-sanitizer/pkg/wasm_sanitizer.d.ts",
            "wasm-sanitizer/pkg/wasm_sanitizer.js",
            "wasm-sanitizer/pkg/wasm_sanitizer_bg.wasm",
          ]
          if (JSON.stringify(Object.keys(metadata.packages).sort()) !== JSON.stringify(expected.sort())) {
            throw new Error("Unexpected generated package inventory")
          }
          const records = []
          for (const path of [...expected, "WASM_SOURCE_PROVENANCE.json"]) {
            const info = await lstat(path)
            if (!info.isFile() || info.isSymbolicLink()) throw new Error("Invalid recovery file")
            const bytes = await readFile(path)
            const sha256 = createHash("sha256").update(bytes).digest("hex")
            const encoded = bytes.toString("base64")
            const count = Math.ceil(encoded.length / 16384)
            records.push({ path, size: bytes.length, sha256, chunks: count })
            for (let index = 0; index < count; index++) {
              console.log("WASM_RECOVERY_CHUNK:" + JSON.stringify({
                path, index, data: encoded.slice(index * 16384, (index + 1) * 16384),
              }))
            }
          }
          console.log("WASM_RECOVERY_MANIFEST:" + JSON.stringify({
            source_sha: process.env.SOURCE_SHA, files: records,
          }))
          JS
