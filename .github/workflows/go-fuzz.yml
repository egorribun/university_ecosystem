name: Go Fuzzing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  fuzz:
    name: Run Go Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run Fuzz Test
        run: |
          cd services/file-processor
          go test -v -fuzz=FuzzEstimateQueryDepth -fuzztime=60s ./internal/middleware

      - name: Run gateway JWT fuzz test
        run: |
          cd services/gateway
          go test -v -fuzz=FuzzJWTValidation -fuzztime=60s ./middleware

      - name: Run ws-hub parser fuzz tests
        run: |
          cd services/ws-hub
          go test -v -fuzz=FuzzParseMessage -fuzztime=60s ./pkg/hub
          go test -v -fuzz=FuzzExtractAlgFromHeader -fuzztime=60s ./pkg/hub
