name: Go Fuzzing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Run Go Fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Run Fuzz Test
        run: |
          cd services/file-processor
          # Keep one fuzz worker: the default GOMAXPROCS-sized pool can OOM
          # the runner. Keep a five-second shutdown margin: Go 1.26.6 still
          # has golang/go#75804, where the exact fuzztime deadline can escape
          # as a false `context deadline exceeded` failure. A five-second
          # shutdown margin keeps the smoke bounded without treating the
          # toolchain race as a product failure.
          go test -v -fuzz=FuzzEstimateQueryDepth -fuzztime=25s -parallel=1 ./internal/middleware

      - name: Run gateway JWT fuzz test
        run: |
          cd services/gateway
          go test -v -fuzz=FuzzJWTValidation -fuzztime=25s -parallel=1 ./middleware

      - name: Run ws-hub parser fuzz tests
        run: |
          cd services/ws-hub
          go test -v -fuzz=FuzzParseMessage -fuzztime=25s -parallel=1 ./pkg/hub
          go test -v -fuzz=FuzzExtractAlgFromHeader -fuzztime=25s -parallel=1 ./pkg/hub
