name: SQLMap (DAST SQL Injection Scan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  sqlmap:
    name: SQLMap Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install SQLMap
        run: uv pip install "sqlmap==1.10.8"

      - name: Verify SQLMap OpenAPI support
        run: |
          sqlmap_help="$(uv run sqlmap -hh)"
          if ! grep -Fq -- "--openapi=" <<<"$sqlmap_help"; then
            echo "::error::Pinned SQLMap lacks required OpenAPI support."
            exit 1
          fi

      - name: Start FastAPI Backend in Background
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: testing
          SECRET_KEY: "sqlmap-ci-placeholder-key" # pragma: allowlist secret
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          openapi_document="$(mktemp)"
          # Wait for a successful, nonempty OpenAPI response from the app's real route.
          for i in {1..30}; do
            if curl --fail --silent --show-error \
              --output "$openapi_document" \
              "http://127.0.0.1:8000/api/openapi.json" && test -s "$openapi_document"; then
              echo "Server and OpenAPI document are ready."
              break
            fi
            echo "Waiting for server..."
            sleep 1
          done
          if ! test -s "$openapi_document"; then
            echo "::error::FastAPI OpenAPI document did not become ready within 30 seconds."
            exit 1
          fi

      - name: Run SQLMap Scan on API
        run: |
          # --batch: non-interactive mode
          # The OpenAPI document already enumerates the complete route set;
          # recrawling it only multiplies requests without increasing coverage.
          # Exclude time-based probes from this PR smoke gate: the disposable
          # app deliberately rate-limits repeated requests and those probes
          # can consume the entire job envelope without improving the
          # boolean/error/union injection signal.
          # --risk=1 --level=1: lightweight scan for CI speed
          uv run sqlmap --openapi="http://127.0.0.1:8000/api/openapi.json" \
            --openapi-base="http://127.0.0.1:8000" \
            --batch \
            --crawl=0 \
            --technique=BEU \
            --risk=1 \
            --level=1 \
            --threads=2 \
            --timeout=5 \
            --retries=0 \
            --flush-session
