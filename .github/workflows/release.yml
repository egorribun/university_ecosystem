name: Release
on:
  workflow_dispatch: {} # manual-only until production release infrastructure is ready
  # push:
  #   branches:
  #     - main

permissions: read-all

jobs:
  release:
    name: Release
    # Release credentials must never reach code from an arbitrary dispatch ref.
    # The main branch is protected and is the only trusted release source.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # CI-03 (audit Wave 10)
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Generate quality certification record
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          QUALITY_CERTIFICATION_KEY: ${{ secrets.QUALITY_CERTIFICATION_KEY }}
        run: |
          test -n "$QUALITY_CERTIFICATION_KEY" || {
            echo "::error::QUALITY_CERTIFICATION_KEY is required for a signed release certification";
            exit 1;
          }
          mkdir -p artifacts/quality
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > artifacts/quality/check-runs.json
          python -c 'import json; raw=json.load(open("artifacts/quality/check-runs.json", encoding="utf-8")); checks={item["name"]: item.get("conclusion", "unknown") for item in raw.get("check_runs", [])}; assert checks, "no completed check runs found for release SHA"; json.dump({"check_runs": checks}, open("artifacts/quality/required-checks.json", "w", encoding="utf-8"), indent=2); print(f"collected {len(checks)} check runs")'
          quality_run_id="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$quality_run_id"
          gh run download "$quality_run_id" --dir artifacts/quality/ci
          manifest_path="$(find artifacts/quality/ci -name quality-manifest.json -print -quit)"
          test -n "$manifest_path"
          python scripts/quality/generate_certification.py \
            --commit-sha "$GITHUB_SHA" \
            --contract quality/quality-contract.json \
            --checks artifacts/quality/required-checks.json \
            --report-dir artifacts/quality/ci \
            --output artifacts/quality/certification.json \
            --limitation "Per-tool raw reports remain in the CI run; this release record hashes the normalized quality manifest and contract."

      - name: Upload quality certification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-certification-${{ github.sha }}
          path: artifacts/quality/certification.json
          if-no-files-found: error

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pin a runtime supported by semantic-release 25 and its plugins.
          node-version: 24.15.0
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # npm ci installs from the lockfile exactly — reproducible and faster than npm install.
        run: npm ci

      - name: Verify release toolchain
        run: npm run test:release-toolchain

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        # Execute the exact integrity-checked package installed by `npm ci`
        # without invoking npm while the write-capable token is present.
        run: node node_modules/semantic-release/bin/semantic-release.js

  build:
    name: Build & Sign Releases
    needs: [release]
    permissions:
      contents: read
      packages: write # Required: push Docker images to GHCR
      id-token: write
      attestations: write
      security-events: write # Required: upload SARIF security scan results
    strategy:
      matrix:
        include:
          - image_name: "backend"
            file: "backend.Dockerfile"
            context: "."
          - image_name: "frontend"
            file: "frontend.Dockerfile"
            context: "."
          - image_name: "ws-hub"
            file: "services/ws-hub/Dockerfile"
            context: "services/ws-hub"
          - image_name: "gateway"
            file: "services/gateway/Dockerfile"
            context: "services/gateway"
          - image_name: "file-processor"
            file: "services/file-processor/Dockerfile"
            context: "services/file-processor"
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: ${{ matrix.image_name }}
      context: ${{ matrix.context }}
      file: ${{ matrix.file }}
      tags: |
        ghcr.io/${{ github.repository }}/${{ matrix.image_name }}:latest
        ghcr.io/${{ github.repository }}/${{ matrix.image_name }}:${{ github.sha }}
