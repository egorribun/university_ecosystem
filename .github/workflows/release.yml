name: Release
on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20 # CI-03 (audit Wave 10)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # npm ci installs from the lockfile exactly — reproducible and faster than npm install.
        run: npm ci

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        # CI-02 (audit Wave 10): pin semantic-release version — `npx semantic-release`
        # without a version downloads the latest from npm at runtime, allowing a
        # compromised npm package to exfiltrate RELEASE_TOKEN with repo write access.
        run: npx semantic-release@24.2.0

  build:
    name: Build & Sign Releases
    needs: [release]
    strategy:
      matrix:
        include:
          - image_name: "backend"
            file: "backend.Dockerfile"
            context: "."
          - image_name: "frontend"
            file: "frontend.Dockerfile"
            context: "."
          - image_name: "ws-hub"
            file: "services/ws-hub/Dockerfile"
            context: "services/ws-hub"
          - image_name: "gateway"
            file: "services/gateway/Dockerfile"
            context: "services/gateway"
          - image_name: "file-processor"
            file: "services/file-processor/Dockerfile"
            context: "services/file-processor"
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: ${{ matrix.image_name }}
      context: ${{ matrix.context }}
      file: ${{ matrix.file }}
      tags: |
        ghcr.io/${{ github.repository }}/${{ matrix.image_name }}:latest
        ghcr.io/${{ github.repository }}/${{ matrix.image_name }}:${{ github.sha }}
    secrets: inherit # pragma: allowlist secret
