name: Release
on:
  workflow_dispatch: {} # manual-only until production release infrastructure is ready
  # push:
  #   branches:
  #     - main

permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20 # CI-03 (audit Wave 10)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # npm ci installs from the lockfile exactly — reproducible and faster than npm install.
        run: npm ci

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        # CI-02 (audit Wave 10): pin semantic-release version — `npx semantic-release`
        # without a version downloads the latest from npm at runtime, allowing a
        # compromised npm package to exfiltrate RELEASE_TOKEN with repo write access.
        run: npx semantic-release@24.2.0

  build:
    name: Build & Sign Releases
    needs: [release]
    permissions:
      contents: read
      packages: write  # Required: push Docker images to GHCR
      id-token: write
      attestations: write
      security-events: write  # Required: upload SARIF security scan results
    strategy:
      matrix:
        include:
          - image_name: "backend"
            file: "backend.Dockerfile"
            context: "."
          - image_name: "frontend"
            file: "frontend.Dockerfile"
            context: "."
          - image_name: "ws-hub"
            file: "services/ws-hub/Dockerfile"
            context: "services/ws-hub"
          - image_name: "gateway"
            file: "services/gateway/Dockerfile"
            context: "services/gateway"
          - image_name: "file-processor"
            file: "services/file-processor/Dockerfile"
            context: "services/file-processor"
    uses: ./.github/workflows/reusable-build-and-sign.yml
    with:
      image_name: ${{ matrix.image_name }}
      context: ${{ matrix.context }}
      file: ${{ matrix.file }}
      tags: |
        ghcr.io/${{ github.repository }}/${{ matrix.image_name }}:latest
        ghcr.io/${{ github.repository }}/${{ matrix.image_name }}:${{ github.sha }}
    secrets: inherit # pragma: allowlist secret
