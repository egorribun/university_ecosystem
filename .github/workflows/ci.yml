# CI Pipeline - Refactored to use Reusable Workflows
#
# This is a streamlined CI configuration that delegates to modular reusable workflows.
# Original: 835 lines → Refactored: ~200 lines
#
# Reusable workflows used:
# - reusable-backend-tests.yml: Python unit/integration tests, type checking
# - reusable-frontend-tests.yml: Node.js unit tests, lint, build
# - reusable-go-tests.yml: Go service tests and linting
# - reusable-security-audit.yml: pip-audit, npm audit, Trivy

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: "dummy_secret_key_for_ci_tests_at_least_32_chars"
  ENVIRONMENT: testing

jobs:
  # ============================================================================
  # Diagnostic Job
  # ============================================================================
  ci-diagnostic:
    name: CI Diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: System Check
        run: |
          echo "CI Workflow Detected"
          echo "Ref: ${GITHUB_REF}"
          echo "Head Ref: ${GITHUB_HEAD_REF}"
          echo "Event: ${GITHUB_EVENT_NAME}"

  # ============================================================================
  # Pre-commit and Code Quality
  # ============================================================================
  run-hooks:
    name: Pre-commit & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run pre-commit (apply fixes)
        id: precommit_apply
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
        continue-on-error: true

      - name: Detect changes from pre-commit
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit pre-commit fixes
        if: ${{ steps.changes.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: pre-commit autofix"
          git pull --rebase origin "$branch" || true
          git push --force-with-lease origin "HEAD:$branch"

      - name: Fail if fixes were needed and cannot push (fork PR)
        if: ${{ steps.changes.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::pre-commit fixed files; this PR comes from a fork so CI cannot push. Run 'pre-commit run --all-files' locally and push the changes."
          exit 1

      - name: Run pre-commit (verify clean)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  # ============================================================================
  # Docker Compose Validation
  # ============================================================================
  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    needs: run-hooks
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config

  # ============================================================================
  # Backend Tests (Reusable Workflow)
  # ============================================================================
  backend-tests:
    name: Backend Tests (${{ matrix.group.name }})
    strategy:
      matrix:
        group:
          - { name: Auth, pattern: "tests/test_auth*" }
          - { name: Events, pattern: "tests/test_event*" }
          - { name: Notifications, pattern: "tests/test_notification*" }
          - { name: Chat, pattern: "tests/test_chat*" }
          - {
              name: API-Config,
              pattern: "tests/test_api* tests/test_config* tests/test_core_config.py",
            }
          - {
              name: Storage,
              pattern: "tests/test_file* tests/test_storage* tests/test_repository*",
            }
          - {
              name: Utils,
              pattern: "tests/test_utils* tests/test_encryption.py tests/test_sanitization.py",
            }
          - {
              name: System,
              pattern: "tests/test_health* tests/test_metrics* tests/test_periodic* tests/test_workers* tests/test_dead_letter* tests/test_circuit_breaker* tests/test_progressive* tests/test_retry.py tests/test_smoke.py",
            }
    needs: run-hooks
    uses: ./.github/workflows/reusable-backend-tests.yml
    with:
      test-group-name: ${{ matrix.group.name }}
      test-pattern: ${{ matrix.group.pattern }}
      python-version: "3.13"
      coverage-threshold: 72
      run-integration-tests: true
    secrets: inherit

  # ============================================================================
  # Backend Type Checking (Single Job)
  # ============================================================================
  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    needs: run-hooks
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run mypy
        run: mypy

  # ============================================================================
  # Go Tests (Reusable Workflow)
  # ============================================================================
  go-tests:
    name: Go Tests (${{ matrix.service }})
    strategy:
      matrix:
        service:
          [
            services/gateway,
            services/file-processor,
            services/ws-hub,
            services/rust-optimizer,
          ]
    needs: run-hooks
    uses: ./.github/workflows/reusable-go-tests.yml
    with:
      service-directory: ${{ matrix.service }}
      go-version: "1.25.x"
    secrets: inherit

  # ============================================================================
  # Frontend Tests (Reusable Workflow)
  # ============================================================================
  frontend-tests:
    name: Frontend Tests
    needs: run-hooks
    uses: ./.github/workflows/reusable-frontend-tests.yml
    with:
      node-version: "22"
      run-lighthouse: true
    secrets: inherit

  # ============================================================================
  # Security Audits (Reusable Workflow)
  # ============================================================================
  security-audit:
    name: Security Audit
    needs: run-hooks
    uses: ./.github/workflows/reusable-security-audit.yml
    with:
      python-version: "3.13"
      node-version: "22"
    secrets: inherit

  # ============================================================================
  # Alembic Migrations
  # ============================================================================
  alembic-migrations:
    name: Alembic Migrations
    runs-on: ubuntu-latest
    needs: run-hooks
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            sleep 1
          done

      - name: Create database tables
        env:
          SECRET_KEY: "ci-test-secret-key-at-least-32-chars"
          ENVIRONMENT: testing
        run: |
          python3 <<'PY'
          import asyncio
          from app.core.database import Base, engine

          async def create_tables():
              async with engine.begin() as conn:
                  from sqlalchemy import text
                  await conn.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
                  await conn.run_sync(Base.metadata.create_all)

          asyncio.run(create_tables())
          PY

      - name: Run Alembic upgrade and downgrade
        env:
          SECRET_KEY: "ci-test-secret-key-at-least-32-chars"
          ENVIRONMENT: testing
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade base

  # ============================================================================
  # OpenAPI Schema Generation & Verification
  # ============================================================================
  openapi-verify:
    name: Verify OpenAPI Types
    runs-on: ubuntu-latest
    needs: run-hooks
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate OpenAPI schema
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          from app.main import app

          schema_path = pathlib.Path("frontend/openapi.json")
          schema_path.write_text(json.dumps(app.openapi()))
          PY

      - name: Generate API types
        working-directory: frontend
        env:
          OPENAPI_PATH: frontend/openapi.json
        run: npm run generate:api

      - name: Verify generated API types are up to date
        run: |
          if ! git diff --quiet -- frontend/src/api/generated/schema.ts; then
            echo "::error::Generated API types are not up to date. Run 'npm run generate:api'."
            git diff -- frontend/src/api/generated/schema.ts
            exit 1
          fi

  # ============================================================================
  # Runtime Requirements Verification
  # ============================================================================
  verify-runtime-reqs:
    name: Verify Runtime Requirements
    runs-on: ubuntu-latest
    needs: run-hooks
    steps:
      - uses: actions/checkout@v5

      - name: Ensure requirements.txt excludes test-only packages
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          banned = {
              "pytest",
              "pytest-asyncio",
              "pytest-cov",
              "pre-commit",
              "fakeredis",
              "asgi-lifespan",
          }

          req_path = pathlib.Path("requirements.txt")
          violations: list[str] = []
          for raw_line in req_path.read_text().splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              name = re.split(r"[<=>!\[\]]", line, 1)[0].strip().lower()
              if name in banned:
                  violations.append(raw_line.strip())

          if violations:
              print("::error::test/development packages found in requirements.txt:")
              for entry in violations:
                  print(f"  - {entry}")
              sys.exit(1)

          print("Runtime requirements look clean.")
          PY

  # ============================================================================
  # Lighthouse Performance Gate
  # ============================================================================
  performance-gate:
    name: Performance Gate
    runs-on: ubuntu-latest
    needs:
      - frontend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Lighthouse results
        id: download_lighthouse_results
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci
        continue-on-error: true

      - name: Verify Lighthouse results artifact
        if: steps.download_lighthouse_results.outcome != 'success'
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download_lighthouse_results.outcome }}
        shell: bash
        run: |
          echo "::warning::Lighthouse results artifact not found. Check the 'Frontend Tests' job for upload issues."
          {
            echo "## Lighthouse performance gate";
            echo "- ⚠️ Artifact download outcome: ${DOWNLOAD_OUTCOME}";
            echo "- Threshold assertions skipped due to missing artifact.";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Lighthouse thresholds
        if: steps.download_lighthouse_results.outcome == 'success'
        run: |
          npx lhci assert \
            --config=../.lighthouserc.js \
            --preset=lighthouse:recommended \
            --budgetsFile=../budget.json

  # ============================================================================
  # Final Status Check
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - run-hooks
      - compose-validate
      - backend-tests
      - backend-type-check
      - go-tests
      - frontend-tests
      - security-audit
      - alembic-migrations
      - openapi-verify
      - verify-runtime-reqs
      - performance-gate
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.run-hooks.result }}" != "success" ]] ||
             [[ "${{ needs.compose-validate.result }}" != "success" ]] ||
             [[ "${{ needs.backend-tests.result }}" != "success" ]] ||
             [[ "${{ needs.backend-type-check.result }}" != "success" ]] ||
             [[ "${{ needs.go-tests.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-tests.result }}" != "success" ]] ||
             [[ "${{ needs.security-audit.result }}" != "success" ]] ||
             [[ "${{ needs.alembic-migrations.result }}" != "success" ]] ||
             [[ "${{ needs.openapi-verify.result }}" != "success" ]] ||
             [[ "${{ needs.verify-runtime-reqs.result }}" != "success" ]] ||
             [[ "${{ needs.performance-gate.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
