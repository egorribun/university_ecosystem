# CI Pipeline - Refactored to use Reusable Workflows
name: "CI - Matrix Expansion"

# MOD-20-03 (audit 2026-03-24): Added branch filter to prevent CI from running
# on every push to every branch.  Previously, each push to ANY branch triggered
# 20+ workflows.  Path-level filtering is done within individual jobs below.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
  workflow_dispatch:

# Least-privilege defaults — individual jobs extend as needed.
# Prevents Poisoned Pipeline Execution (PPE) from fork PRs (OWASP CI/CD C-PPE-1).
permissions: read-all

concurrency:
  group: ci-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  # RZ-14-06 (audit 2026-03-18): Use the configured repo secret; jobs that need
  # SECRET_KEY add an early "Generate CI secret" step that falls back to
  # `openssl rand -hex 32` so no static string ever appears in workflow logs.
  # Set CI_TEST_SECRET_KEY in repo Settings → Secrets and variables → Actions.
  SECRET_KEY: ${{ secrets.CI_TEST_SECRET_KEY }}
  ENVIRONMENT: testing

jobs:
  ci-diagnostic:
    name: CI Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5 # CI-03 (audit Wave 10)
    steps:
      - name: System Check
        run: |
          echo "CI Workflow Detected"
          echo "Ref: ${GITHUB_REF}"
          echo "Head Ref: ${GITHUB_HEAD_REF}"
          echo "Event: ${GITHUB_EVENT_NAME}"

  pre-commit-check:
    name: Pre-commit & Linting (Read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python for lock check
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Verify uv.lock is up to date (MOD-W5-03)
        # MOD-03 (audit Wave 12): explicit error annotation in GitHub Actions UI panel.
        # `uv lock --check` already exits non-zero on mismatch; the `|| (... && exit 1)`
        # addition surfaces the error in the Checks summary, not just the raw log.
        # Note: uses Python 3.13 — some deps (http-ece) crash on 3.14 setup.py.
        run: |
          pip install uv
          uv lock --check || (echo "::error::uv.lock is out of sync — run 'uv lock' locally and commit the updated lockfile" && exit 1)

      - name: Run pre-commit (check only)
        id: precommit_check
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files
        continue-on-error: true

      - name: Check pre-commit configuration failure (TD-W5-03)
        if: steps.precommit_check.outcome == 'failure'
        run: |
          EXIT_CODE="${{ steps.precommit_check.outputs.exit-code || '1' }}"
          if [ "$EXIT_CODE" -gt 1 ]; then
            echo "::error::pre-commit configuration error (exit $EXIT_CODE) — hook binary missing or config invalid"
            exit "$EXIT_CODE"
          fi

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if changes needed (fork PR)
        if: ${{ steps.changes.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::pre-commit fixed files; this PR comes from a fork so CI cannot push. Run 'pre-commit run --all-files' locally and push the changes."
          exit 1

    outputs:
      changed: ${{ steps.changes.outputs.changed }}

  pre-commit-autofix:
    name: Post-fix Formatting (Bot Push)
    if: |
      needs.pre-commit-check.outputs.changed == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: pre-commit-check
    runs-on: ubuntu-latest
    timeout-minutes: 10 # CI-03 (audit Wave 10)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Commit pre-commit fixes (RZ-W5-02)
        shell: bash
        run: |
          # Re-run fixes to ensure we have the state
          pip install pre-commit
          pre-commit run --all-files || true

          BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: pre-commit autofix [skip ci]" || exit 0

          # Attempt rebase to avoid push conflicts
          if ! git pull --rebase origin "$BRANCH"; then
            echo "::error::Rebase failed. There might be manual conflicts to resolve."
            exit 1
          fi

          git push origin "HEAD:$BRANCH"

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate CI secret key if not configured (RZ-14-06)
        # RZ-14-06: Avoid hardcoded fallback strings visible in fork logs.
        # When CI_TEST_SECRET_KEY is not set (fork PRs), generate ephemeral 32-byte key.
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Enforce Rate Limit Shim Deadline (TD-003)
        run: |
          count=$(git grep "from app.core import rate_limit" app/ | wc -l || echo "0")
          if [ "$count" -gt 15 ]; then
            echo "::error::Too many legacy rate_limit imports ($count). Baseline is 15. Do not add new ones."
            exit 1
          fi
          echo "Found $count legacy imports."
      - name: Enforce Dishka Migration Deadline (TD-004)
        # TD-4 (audit 2026-03-05): Fail if new files appear in app/deps/ to prevent
        # regression. The baseline at audit time is 12 files. New features MUST use
        # Dishka (FromDishka[]) instead of the legacy Depends() container.
        run: |
          BASELINE=12
          COUNT=$(find app/deps -name "*.py" ! -name "__init__.py" | wc -l)
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::New Depends() files detected in app/deps/ ($COUNT > baseline $BASELINE). Add new services as Dishka providers in app/core/di_provider.py instead."
            exit 1
          fi
          echo "OK: $COUNT legacy deps files (baseline: $BASELINE)"
      - name: Enforce no-pickle gate (RED-01 RZ-W13)
        # RED-01 (audit Wave 13): pickle.loads/dumps enables RCE if the data
        # source (Redis, DB) is ever compromised.  Pydantic JSON serialization
        # is the safe replacement.  This gate prevents future re-introduction.
        shell: bash
        run: |
          # TD-W18-04 (audit 2026-03-23 Wave 18): exclude comments to prevent false
          # positives (e.g. "# Do NOT import pickle" triggered the old gate).
          result=$(grep -rn "import pickle\|from pickle\|pickle\.loads\|pickle\.dumps" app/ --include="*.py" | grep -v '^\s*#' | grep -v '# nosec' || true)
          if [ -n "$result" ]; then
            echo "::error::pickle usage detected in app/ — replace with Pydantic model_validate_json / model_dump_json (see RED-01 in Wave 13 audit)"
            echo "$result"
            exit 1
          fi
          echo "OK: no pickle usage found in app/"

      - name: "Enforce Python 3 except tuple syntax (RZ-25-01 / MOD-27-01)"
        # MOD-27-01: Fixed regex — previous `grep -v 'except ('` accidentally
        # filtered valid matches, allowing 44 violations to pass the gate.
        # Now anchored to line start, requires trailing colon, no filter pipes.
        shell: bash
        run: |
          result=$(grep -rn --include='*.py' -P '^\s*except\s+[A-Za-z_][\w.]*\s*,\s*[A-Za-z_][\w.]*\s*[,:]' app/ tests/ || true)
          if [ -n "$result" ]; then
            echo "::error::Python 2 except syntax detected (MOD-27-01). Use tuple form: except (A, B):"
            echo "$result"
            echo "Found $(echo "$result" | wc -l) violations"
            exit 1
          fi
          echo "OK: no Python 2 except syntax found"

      - name: "MOD-30-01: Enforce lazy=noload on SQLAlchemy relationships"
        run: |
          # All relationships in app/models/ must have explicit lazy= parameter
          # to prevent N+1 queries.  See CLAUDE.md: "ALL relationships must have
          # explicit lazy=\"noload\"".  Use '# noload-exempt: <reason>' for
          # justified exceptions (e.g., lazy="joined" for 1:1).
          #
          # Multi-line aware: reads full relationship(...) calls across lines.
          python3 -c "
          import re, sys, pathlib

          models = pathlib.Path('app/models')
          # Match relationship( ... ) spanning multiple lines
          pat = re.compile(r'relationship\s*\(', re.MULTILINE)
          violations = []
          for f in sorted(models.rglob('*.py')):
              if '__pycache__' in str(f):
                  continue
              text = f.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              # Build line offset map
              offsets = []
              pos = 0
              for line in lines:
                  offsets.append(pos)
                  pos += len(line)
              for m in pat.finditer(text):
                  start = m.start()
                  # Find matching closing paren (handle nesting)
                  depth, i = 1, m.end()
                  while i < len(text) and depth > 0:
                      if text[i] == '(':
                          depth += 1
                      elif text[i] == ')':
                          depth -= 1
                      i += 1
                  block = text[start:i]
                  # Line number (1-based)
                  lineno = next(j + 1 for j in range(len(offsets) - 1, -1, -1) if offsets[j] <= start)
                  if 'lazy=' in block or '# noload-exempt' in block:
                      continue
                  violations.append(f'{f}:{lineno}:    {lines[lineno-1].rstrip()}')
          if violations:
              print('::error::Relationships without explicit lazy= found (MOD-30-01):')
              print('\n'.join(violations))
              print()
              print('All relationships MUST have lazy=\"noload\" (see CLAUDE.md).')
              print(\"Add '# noload-exempt: <reason>' for justified exceptions.\")
              sys.exit(1)
          print('OK: all relationships have explicit lazy= parameter')
          "

      - name: Validate docker compose configuration
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          docker compose -f docker-compose.yml config

  backend-tests:
    name: "Backend Tests (${{ matrix.name }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            name: "Python 3.13"
            coverage-check: true
            run-integration: true
            free-threading: false
          # MOD-24-03: Free-threading CI variant — temporarily disabled.
          # http-ece 1.2.1 (pywebpush dep) crashes on Python 3.14 during
          # setup.py ("Disabling the GIL is not supported by this build").
          # Re-enable once http-ece ships a 3.14-compatible release.
          # - python-version: "3.14"
          #   name: "Python 3.14 (free-threading)"
          #   coverage-check: false
          #   run-integration: false
          #   free-threading: true
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-backend-tests.yml
    with:
      test-group-name: "All-${{ matrix.name }}"
      test-pattern: "tests/"
      python-version: ${{ matrix.python-version }}
      coverage-threshold: ${{ matrix.coverage-check && 80 || 0 }}
      run-integration-tests: ${{ matrix.run-integration }}
      parallel-workers: 0 # LOW-W19: 0 = auto-detect workers via pytest-xdist (-n auto)
      python-gil: ${{ matrix.free-threading && '0' || '1' }}  # MOD-24-03
    secrets: inherit

  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      # P0-02 (audit 2026-03-06): SHA-pinned — tag-only refs are mutable and vulnerable
      # to supply chain attacks via tag mutation (OWASP CI/CD C-PPE-1).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run mypy
        run: uv run mypy

      - name: Enforce Mypy override budget
        run: |
          uv run python scripts/check_mypy_budget.py
          uv run python scripts/check_mypy_overrides_budget.py

  go-tests:
    name: Go Tests (${{ matrix.service }})
    strategy:
      matrix:
        service:
          - services/gateway
          - services/file-processor
          - services/ws-hub
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-go-tests.yml
    with:
      service-directory: ${{ matrix.service }}
      go-version: "1.26.4"
      coverage-threshold: 50
    secrets: inherit

  # MOD-W15-06 (audit 2026-03-23 Wave 15): Go fuzz testing for ws-hub message parsing.
  # Short 30s CI budget — finds quick panics and crashes.
  # Crashes are stored in testdata/fuzz/ and replayed on subsequent runs automatically.
  go-fuzz:
    name: Go Fuzz Tests (ws-hub)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache-dependency-path: services/ws-hub/go.sum

      # PERF-W18-04 (audit 2026-03-23 Wave 18): increased from 30s to 120s for
      # meaningful coverage of JSON parsing and WebSocket message validation.
      - name: Run fuzz tests (120s CI budget)
        run: |
          cd services/ws-hub
          go test ./pkg/hub/ -fuzz=FuzzParseMessage -fuzztime=120s
          go test ./pkg/hub/ -fuzz=FuzzExtractAlgFromHeader -fuzztime=120s

      - name: Upload fuzz corpus on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crash-corpus
          path: services/ws-hub/testdata/fuzz/
          retention-days: 30

  # ADR-022: Go integration tests against real testcontainers-go containers.
  # Initially non-blocking per §Migration step 5; promote to required after
  # 30-day flake rate < 1 %. Each service runs independently — failures in
  # one don't block others. Wired into ci-success aggregation below as
  # advisory (any non-success result is reported in summary but not fatal).
  go-integration-ws-hub:
    name: Go Integration Tests (ws-hub)
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-go-integration-tests.yml
    with:
      service-directory: services/ws-hub
      go-version: "1.26.4"
    secrets: inherit

  go-integration-file-processor:
    name: Go Integration Tests (file-processor)
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-go-integration-tests.yml
    with:
      service-directory: services/file-processor
      go-version: "1.26.4"
    secrets: inherit

  go-integration-gateway:
    name: Go Integration Tests (gateway)
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-go-integration-tests.yml
    with:
      service-directory: services/gateway
      go-version: "1.26.4"
    secrets: inherit

  frontend-tests:
    name: Frontend Tests
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-frontend-tests.yml
    with:
      node-version: "22"
      run-lighthouse: true
    secrets: inherit

  # Wave 122 polish A1 — wires up Playwright e2e suite + the W122 SW3
  # cross-env URL_STATE_E2E step. Adds ~5-10 min wall-clock per run
  # (backend setup + browser install + ~47 spec cases on chromium).
  # Chromium-only by design (W120 SW7 + W121 SW3); add firefox/webkit
  # in a future wave if multi-browser e2e coverage warranted.
  e2e-tests:
    name: E2E Tests
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-e2e-tests.yml
    with:
      node-version: "22"
      python-version: "3.13"
      browser: chromium
    secrets: inherit

  security-audit:
    name: Security Audit
    needs: pre-commit-check
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-security-audit.yml
    with:
      python-version: "3.13"
      node-version: "22"
    secrets: inherit

  # MOD-21-04 (audit 2026-03-25 Wave 21): Generate Software Bill of Materials
  # for supply chain security compliance (CycloneDX/SPDX).  Uploads as a build
  # artifact so downstream tools (Dependabot, Grype, etc.) can consume it.
  sbom-generate:
    name: SBOM Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: pre-commit-check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0 — RZ-22-03
        with:
          path: .
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # MOD-22-04 (audit 2026-03-25 Wave 22): SLSA provenance dry-run.
  # Validates that SLSA provenance tooling (slsa-verifier) is available
  # and the configuration is valid.  Does NOT publish attestations —
  # that is handled by the release workflow.
  provenance-check:
    name: SLSA Provenance Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: pre-commit-check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install slsa-verifier
        run: |
          curl -sSLo /tmp/slsa-verifier \
            https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.0/slsa-verifier-linux-amd64
          chmod +x /tmp/slsa-verifier

      - name: Verify slsa-verifier is functional
        run: |
          /tmp/slsa-verifier version
          echo "SLSA verifier is available and functional."

      - name: Validate provenance config exists
        run: |
          # Check that the repo has the expected CI structure for provenance.
          if [ ! -f ".github/workflows/ci.yml" ]; then
            echo "::error::CI workflow not found — provenance generation requires ci.yml"
            exit 1
          fi
          echo "Provenance configuration validated."

  alembic-migrations:
    name: Alembic Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # MOD-NEW-008 (audit 2026-03-19): Integrate Squawk to automatically lint
      # Alembic migrations. Blocks destructive statements (DROP COLUMN, ALTER TYPE)
      # ensuring Zero-Downtime Deployment (ZDD) compatibility.
      - name: Install Squawk Linter
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: sbdchd/squawk
          tag: v2.44.0 # MOD-008: update to latest release v2.44.0
          file-name: squawk-linux-x64 # Specify explicit binary name
          cache: enable
          extension-matching: disable
          rename-to: squawk
          chmod: 0755

      - name: Lint Postgres Migrations (Squawk)
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        run: |
          echo "Linting all Alembic migrations (base to head) for ZDD safety..."
          # MOD-008: Refactor Squawk to lint the generated SQL output rather than Python files.
          uv run alembic upgrade base:head --sql | squawk || {
            echo "::error::Squawk detected unsafe database operations in migrations! Review the output above."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        shell: pwsh
        run: |
          uv sync --frozen

      - name: Wait for PostgreSQL
        shell: pwsh
        run: |
          $timeout = 30
          $elapsed = 0
          do {
            if (pg_isready -h localhost -p 5432 -U test) {
              return
            }
            Start-Sleep -Seconds 1
            $elapsed++
          } while ($elapsed -lt $timeout)
          throw "PostgreSQL was not ready in $timeout seconds"

      - name: Create database tables
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        shell: bash
        run: |
          uv run python3 <<'PY'
          import asyncio
          from app.core.database import Base, engine

          async def create_tables():
              async with engine.begin() as conn:
                  from sqlalchemy import text
                  await conn.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
                  await conn.run_sync(Base.metadata.create_all)

          asyncio.run(create_tables())
          PY

      - name: Run Alembic upgrade and downgrade
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        shell: pwsh
        run: |
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini downgrade base

      # MOD-22-05 (audit 2026-03-25 Wave 22): Assert exactly 1 migration head.
      # Multiple heads indicate an un-merged migration branch — alembic upgrade
      # will fail in production.  This gate catches the issue before merge.
      - name: Check single migration head (MOD-22-05)
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        shell: bash
        run: |
          HEAD_COUNT=$(uv run alembic heads | grep -c "^" || true)
          echo "Alembic heads: $HEAD_COUNT"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic head but found $HEAD_COUNT. Merge the migration branches before merging this PR."
            uv run alembic heads
            exit 1
          fi

      - name: Check Alembic schema drift (MOD-14-03)
        # RZ-14-05 (audit 2026-03-23): alembic check exits 1 if the ORM models
        # diverge from the live schema — catches missing length constraints,
        # new columns not backed by migrations, and type mismatches.
        # Runs after upgrade head so the schema is at the latest revision.
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        shell: pwsh
        run: |
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini check || {
            echo "::error::Alembic schema drift detected — ORM models diverge from migration history. Run 'alembic revision --autogenerate' to inspect the diff."
            exit 1
          }

  openapi-verify:
    name: Verify OpenAPI Types
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies
        shell: pwsh
        run: |
          uv sync --frozen --no-dev

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: Generate OpenAPI schema
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        shell: bash
        run: |
          uv run python3 - <<'PY'
          import json
          import pathlib
          from app.main import app

          schema_path = pathlib.Path("frontend/openapi.json")
          schema_path.write_text(json.dumps(app.openapi()))
          PY

      - name: Generate API types
        working-directory: frontend
        env:
          OPENAPI_PATH: frontend/openapi.json
        run: npm run generate:api

      - name: Verify generated API types are up to date
        shell: pwsh
        run: |
          $diff = git diff --quiet -- frontend/src/api/generated/schema.ts
          if ($LASTEXITCODE -ne 0) {
            echo "::error::Generated API types are not up to date. Run 'npm run generate:api'."
            git diff -- frontend/src/api/generated/schema.ts
            exit 1
          }

  verify-runtime-reqs:
    name: Verify Runtime Requirements
    runs-on: ubuntu-latest
    timeout-minutes: 10 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ensure pyproject.toml excludes test-only packages from main dependencies
        shell: bash
        run: |
          uv run python - <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          banned = {
              "pytest",
              "pytest-asyncio",
              "pytest-cov",
              "pre-commit",
              "fakeredis",
              "asgi-lifespan",
          }

          pyproject_path = pathlib.Path("pyproject.toml")
          with open(pyproject_path, "rb") as f:
              data = tomllib.load(f)

          dependencies = data.get("project", {}).get("dependencies", [])
          violations: list[str] = []
          for entry in dependencies:
              name = re.split(r"[<=>!\[\]]", entry, 1)[0].strip().lower()
              if name in banned:
                  violations.append(entry)

          if violations:
              print("::error::test/development packages found in [project].dependencies in pyproject.toml:")
              for entry in violations:
                  print(f"  - {entry}")
              sys.exit(1)

          print("Project dependencies look clean.")
          PY

  performance-gate:
    name: Performance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20 # CI-03 (audit Wave 10)
    needs:
      - frontend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Lighthouse results
        id: download_lighthouse_results
        # RZ-NEW-007 (audit 2026-03-19): SHA-pinned to prevent supply chain attack via
        # mutable @v8 tag. All other CI actions already use SHA pinning — this was the
        # only exception. Equivalent to actions/download-artifact@v4.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci
        continue-on-error: true

      - name: Verify Lighthouse results artifact
        if: steps.download_lighthouse_results.outcome != 'success'
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download_lighthouse_results.outcome }}
        shell: bash
        run: |
          echo "::warning::Lighthouse results artifact not found. Check the 'Frontend Tests' job for upload issues."
          {
            echo "## Lighthouse performance gate";
            echo "- ⚠️ Artifact download outcome: ${DOWNLOAD_OUTCOME}";
            echo "- Threshold assertions skipped due to missing artifact.";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Lighthouse thresholds
        if: steps.download_lighthouse_results.outcome == 'success'
        run: |
          npx lhci assert \
            --config=../.lighthouserc.js \
            --preset=lighthouse:recommended \
            --budgetsFile=../budget.json

  # MOD-W15-02 (audit 2026-03-23 Wave 15): Trivy Docker image scanning.
  # Runs on every PR/push. Scans the built backend image for CRITICAL/HIGH CVEs.
  # Results are uploaded to GitHub Security tab as SARIF (visible in Code Scanning).
  docker-security-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-commit-check
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build backend image for scanning
        # LOW-W19: root Dockerfile does not exist; backend image uses backend.Dockerfile
        run: docker build -t university-ecosystem/backend:${{ github.sha }} -f backend.Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.28.0
        with:
          image-ref: university-ecosystem/backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # MOD-W15-03 (audit 2026-03-23 Wave 15): Helm lint + kubeconform validation.
  # Catches broken Helm templates and K8s manifest schema violations before deploy.
  helm-validate:
    name: Helm Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: "3.17.0"

      - name: Helm dependency build
        id: helm-deps
        run: helm dependency build charts/university-ecosystem/
        continue-on-error: true

      - name: Helm lint — university-ecosystem chart
        run: |  # pragma: allowlist secret
          STRICT_FLAG=""
          if [ "${{ steps.helm-deps.outcome }}" = "success" ]; then
            STRICT_FLAG="--strict"
          fi
          helm lint charts/university-ecosystem/ $STRICT_FLAG \
            --set redis.enabled=false \
            --set nats.enabled=false \
            --set gateway.config.jwtSecret=ci-placeholder

      - name: Helm template — dry-run
        run: |  # pragma: allowlist secret
          helm template university-ecosystem charts/university-ecosystem/ \
            --set redis.enabled=false \
            --set nats.enabled=false \
            --set gateway.config.jwtSecret=ci-placeholder \
            --set image.tag=test-sha-${{ github.sha }} \
            > /tmp/backend-manifests.yaml
          echo "Helm template rendered successfully ($(wc -l < /tmp/backend-manifests.yaml) lines)"

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf /tmp/kubeconform.tar.gz -C /tmp
          chmod +x /tmp/kubeconform

      - name: Validate manifests with kubeconform
        run: |
          cat /tmp/backend-manifests.yaml | \
            /tmp/kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  # MOD-W15-04 (audit 2026-03-23 Wave 15): Postgres migration gate.
  # Validates alembic upgrade head + downgrade base + upgrade head round-trip
  # on a real Postgres instance (not SQLite) to catch migration regressions.
  # Note: "downgrade -1" fails on merge heads (ambiguous walk) — use "base".
  db-migration-gate:
    name: DB Migration Gate (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pre-commit-check
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_migration
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run migration round-trip (up → down base → up)
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5433/test_migration
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-migration-gate-only  # pragma: allowlist secret
        run: |
          echo "=== Upgrade to HEAD ==="
          uv run alembic upgrade head

          echo "=== Downgrade to base ==="
          uv run alembic downgrade base

          echo "=== Upgrade back to HEAD ==="
          uv run alembic upgrade head

          echo "=== Migration round-trip complete ==="

  # MOD-W15-01 / Wave 18.1: Contract tests as a required CI gate.
  # Runs lightweight Python consumer contract tests (no Go/FFI needed).
  # The full Go provider verification continues in contract-tests.yml.
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run contract tests (consumer-side)
        run: |
          uv run pytest tests/contracts/ -v \
            --tb=short \
            -p no:cacheprovider \
            -k "not integration"
        env:
          PACT_DO_NOT_TRACK: "true"

  rust-ffi-asan:
    # Phase 3 QA — ADR-023: Run PyO3 FFI tests under AddressSanitizer + LeakSanitizer.
    # Memory errors that cross the Rust/Python boundary are invisible to Python's GC;
    # ASan instruments every allocation so these classes of bugs fail loudly at CI time.
    name: "Rust FFI — ASan / LSan"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies (with maturin)
        run: uv sync --extra dev

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-asan-${{ hashFiles('native/rust_ext/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-asan-

      - name: Install LLVM tools (required for ASan runtime)
        run: |
          rustup toolchain install nightly --component rust-src llvm-tools-preview --allow-downgrade --no-self-update

      - name: Run FFI tests under ASan / LSan
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite+aiosqlite:///./test_asan.db"
          SECRET_KEY: ${{ secrets.CI_TEST_SECRET_KEY }}
        run: bash scripts/run_asan_tests.sh

      - name: Upload ASan report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asan-report
          path: "asan-report.*"
          if-no-files-found: ignore

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5 # CI-03 (audit Wave 10)
    if: always()
    needs:
      - pre-commit-check
      - compose-validate
      - backend-tests
      - backend-type-check
      - go-tests
      - frontend-tests
      - security-audit
      - alembic-migrations
      - openapi-verify
      - verify-runtime-reqs
      - performance-gate
      - docker-security-scan
      - helm-validate
      - db-migration-gate
      - go-fuzz
      - go-integration-ws-hub
      - go-integration-file-processor
      - go-integration-gateway
      - contract-tests
      - provenance-check
      - e2e-tests
      - rust-ffi-asan
    steps:
      - name: Check all jobs passed
        shell: bash
        run: |
          # ADR-022 §Migration step 5: go-integration-* jobs are advisory
          # (non-blocking) initially. Promote to blocking once 30-day flake
          # rate < 1 %. They are intentionally NOT in the blocking results
          # array but ARE reported separately below.
          results=(
            "${{ needs.pre-commit-check.result }}"
            "${{ needs.compose-validate.result }}"
            "${{ needs.backend-tests.result }}"
            "${{ needs.backend-type-check.result }}"
            "${{ needs.go-tests.result }}"
            "${{ needs.frontend-tests.result }}"
            "${{ needs.security-audit.result }}"
            "${{ needs.alembic-migrations.result }}"
            "${{ needs.openapi-verify.result }}"
            "${{ needs.verify-runtime-reqs.result }}"
            "${{ needs.performance-gate.result }}"
            "${{ needs.docker-security-scan.result }}"
            "${{ needs.helm-validate.result }}"
            "${{ needs.db-migration-gate.result }}"
            "${{ needs.go-fuzz.result }}"
            "${{ needs.contract-tests.result }}"
            "${{ needs.provenance-check.result }}"
            "${{ needs.e2e-tests.result }}"
            "${{ needs.rust-ffi-asan.result }}"
          )

          failed=false
          for res in "${results[@]}"; do
            if [[ "$res" != "success" && "$res" != "skipped" ]]; then
              failed=true
              break
            fi
          done

          if [[ "$failed" == "true" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"

      - name: Report Go integration test results (advisory, ADR-022 §Migration)
        shell: bash
        run: |
          # Advisory-only — these results inform the team but do not block
          # the workflow. Promote to blocking by moving entries into the
          # `results` array above once flake rate < 1 % over 30 days.
          ws=${{ needs.go-integration-ws-hub.result }}
          fp=${{ needs.go-integration-file-processor.result }}
          gw=${{ needs.go-integration-gateway.result }}
          {
            echo "## Go integration tests (advisory)";
            echo "";
            echo "| Service | Result |";
            echo "|---------|--------|";
            echo "| ws-hub | $ws |";
            echo "| file-processor | $fp |";
            echo "| gateway | $gw |";
            echo "";
            echo "_Initially non-blocking per ADR-022 §Migration step 5._";
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Advisory results — ws-hub: $ws, file-processor: $fp, gateway: $gw"
