# CI Pipeline - Refactored to use Reusable Workflows
name: "CI - Matrix Expansion"

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege defaults — individual jobs extend as needed.
# Prevents Poisoned Pipeline Execution (PPE) from fork PRs (OWASP CI/CD C-PPE-1).
permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ci-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-01 (audit 2026-03-04): Never store secrets as plaintext in workflow env blocks.
  # Use a GitHub Actions encrypted secret; fall back to a random dummy only if the
  # secret is not configured (e.g. forks running the test matrix without access).
  # Set SECRETS.CI_TEST_SECRET_KEY in repo Settings → Secrets and variables → Actions.
  SECRET_KEY: ${{ secrets.CI_TEST_SECRET_KEY || 'ci-only-dummy-key-minimum-32-chars-entropy' }}
  ENVIRONMENT: testing

jobs:
  ci-diagnostic:
    name: CI Diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: System Check
        run: |
          echo "CI Workflow Detected"
          echo "Ref: ${GITHUB_REF}"
          echo "Head Ref: ${GITHUB_HEAD_REF}"
          echo "Event: ${GITHUB_EVENT_NAME}"

  run-hooks:
    name: Pre-commit & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push pre-commit autofix commits back to the branch
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run pre-commit (apply fixes)
        id: precommit_apply
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
        continue-on-error: true

      - name: Detect changes from pre-commit
        id: changes
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            echo "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            echo "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Commit pre-commit fixes
        if: ${{ steps.changes.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        run: |
          $branch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: pre-commit autofix"
          # CI-03 (audit 2026-03-04): Replaced --force-with-lease with a
          # pull-rebase-push pattern. --force-with-lease can still clobber work
          # if two jobs race on the same ref between the fetch and the push.
          # A rebase-then-normal-push is safer on shared team branches.
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"

      - name: Fail if fixes were needed and cannot push (fork PR)
        if: ${{ steps.changes.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::pre-commit fixed files; this PR comes from a fork so CI cannot push. Run 'pre-commit run --all-files' locally and push the changes."
          exit 1

      - name: Run pre-commit (verify clean)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    needs: run-hooks
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker compose configuration
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          docker compose -f docker-compose.yml config

  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        include:
          - python-version: "3.13"
            coverage-check: true
          - python-version: "3.12"
            coverage-check: false
    needs: run-hooks
    uses: ./.github/workflows/reusable-backend-tests.yml
    with:
      test-group-name: All-Py${{ matrix.python-version }}
      test-pattern: "tests/"
      python-version: ${{ matrix.python-version }}
      coverage-threshold: ${{ matrix.coverage-check && 80 || 0 }}
      run-integration-tests: ${{ matrix.python-version == '3.13' }}
      parallel-workers: -1 # disable parallel execution for SQLite stability
    secrets: inherit

  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    needs: run-hooks
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run mypy
        run: uv run mypy

      - name: Enforce Mypy override budget
        run: uv run python scripts/check_mypy_budget.py

  go-tests:
    name: Go Tests (${{ matrix.service }})
    strategy:
      matrix:
        service:
          - services/gateway
          - services/file-processor
          - services/ws-hub
    needs: run-hooks
    uses: ./.github/workflows/reusable-go-tests.yml
    with:
      service-directory: ${{ matrix.service }}
      go-version: "1.26.x"
    secrets: inherit

  frontend-tests:
    name: Frontend Tests
    needs: run-hooks
    uses: ./.github/workflows/reusable-frontend-tests.yml
    with:
      node-version: "22"
      run-lighthouse: true
    secrets: inherit

  security-audit:
    name: Security Audit
    needs: run-hooks
    uses: ./.github/workflows/reusable-security-audit.yml
    with:
      python-version: "3.13"
      node-version: "22"
    secrets: inherit

  alembic-migrations:
    name: Alembic Migrations
    runs-on: ubuntu-latest
    needs: run-hooks
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        shell: pwsh
        run: |
          uv sync --frozen

      - name: Wait for PostgreSQL
        shell: pwsh
        run: |
          $timeout = 30
          $elapsed = 0
          do {
            if (pg_isready -h localhost -p 5432 -U test) {
              return
            }
            Start-Sleep -Seconds 1
            $elapsed++
          } while ($elapsed -lt $timeout)
          throw "PostgreSQL was not ready in $timeout seconds"

      - name: Create database tables
        env:
          SECRET_KEY: "ci-test-secret-key-at-least-32-chars"
          ENVIRONMENT: testing
        shell: bash
        run: |
          uv run python3 <<'PY'
          import asyncio
          from app.core.database import Base, engine

          async def create_tables():
              async with engine.begin() as conn:
                  from sqlalchemy import text
                  await conn.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
                  await conn.run_sync(Base.metadata.create_all)

          asyncio.run(create_tables())
          PY

      - name: Run Alembic upgrade and downgrade
        env:
          SECRET_KEY: "ci-test-secret-key-at-least-32-chars"
          ENVIRONMENT: testing
        shell: pwsh
        run: |
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini downgrade base

  openapi-verify:
    name: Verify OpenAPI Types
    runs-on: ubuntu-latest
    needs: run-hooks
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies
        shell: pwsh
        run: |
          uv sync --frozen --no-dev

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: Generate OpenAPI schema
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        shell: bash
        run: |
          uv run python3 - <<'PY'
          import json
          import pathlib
          from app.main import app

          schema_path = pathlib.Path("frontend/openapi.json")
          schema_path.write_text(json.dumps(app.openapi()))
          PY

      - name: Generate API types
        working-directory: frontend
        env:
          OPENAPI_PATH: frontend/openapi.json
        run: npm run generate:api

      - name: Verify generated API types are up to date
        shell: pwsh
        run: |
          $diff = git diff --quiet -- frontend/src/api/generated/schema.ts
          if ($LASTEXITCODE -ne 0) {
            echo "::error::Generated API types are not up to date. Run 'npm run generate:api'."
            git diff -- frontend/src/api/generated/schema.ts
            exit 1
          }

  verify-runtime-reqs:
    name: Verify Runtime Requirements
    runs-on: ubuntu-latest
    needs: run-hooks
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ensure pyproject.toml excludes test-only packages from main dependencies
        shell: bash
        run: |
          uv run python - <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          banned = {
              "pytest",
              "pytest-asyncio",
              "pytest-cov",
              "pre-commit",
              "fakeredis",
              "asgi-lifespan",
          }

          pyproject_path = pathlib.Path("pyproject.toml")
          with open(pyproject_path, "rb") as f:
              data = tomllib.load(f)

          dependencies = data.get("project", {}).get("dependencies", [])
          violations: list[str] = []
          for entry in dependencies:
              name = re.split(r"[<=>!\[\]]", entry, 1)[0].strip().lower()
              if name in banned:
                  violations.append(entry)

          if violations:
              print("::error::test/development packages found in [project].dependencies in pyproject.toml:")
              for entry in violations:
                  print(f"  - {entry}")
              sys.exit(1)

          print("Project dependencies look clean.")
          PY

  performance-gate:
    name: Performance Gate
    runs-on: ubuntu-latest
    needs:
      - frontend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Lighthouse results
        id: download_lighthouse_results
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci
        continue-on-error: true

      - name: Verify Lighthouse results artifact
        if: steps.download_lighthouse_results.outcome != 'success'
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download_lighthouse_results.outcome }}
        shell: bash
        run: |
          echo "::warning::Lighthouse results artifact not found. Check the 'Frontend Tests' job for upload issues."
          {
            echo "## Lighthouse performance gate";
            echo "- ⚠️ Artifact download outcome: ${DOWNLOAD_OUTCOME}";
            echo "- Threshold assertions skipped due to missing artifact.";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Lighthouse thresholds
        if: steps.download_lighthouse_results.outcome == 'success'
        run: |
          npx lhci assert \
            --config=../.lighthouserc.js \
            --preset=lighthouse:recommended \
            --budgetsFile=../budget.json

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - compose-validate
      - backend-tests
      - backend-type-check
      - go-tests
      - frontend-tests
      - security-audit
      - alembic-migrations
      - openapi-verify
      - verify-runtime-reqs
      - performance-gate
    steps:
      - name: Check all jobs passed
        shell: bash
        run: |
          results=(
            "${{ needs.compose-validate.result }}"
            "${{ needs.backend-tests.result }}"
            "${{ needs.backend-type-check.result }}"
            "${{ needs.go-tests.result }}"
            "${{ needs.frontend-tests.result }}"
            "${{ needs.security-audit.result }}"
            "${{ needs.alembic-migrations.result }}"
            "${{ needs.openapi-verify.result }}"
            "${{ needs.verify-runtime-reqs.result }}"
            "${{ needs.performance-gate.result }}"
          )

          failed=false
          for res in "${results[@]}"; do
            if [[ "$res" != "success" && "$res" != "skipped" ]]; then
              failed=true
              break
            fi
          done

          if [[ "$failed" == "true" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
