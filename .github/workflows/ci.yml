      - name: Verify exact security disposition contracts
        if: ${{ !cancelled() }}
        run: |
          policy_root="$RUNNER_TEMP/contract-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/security-disposition"
          if [[ ! -f "$policy_root/status" || ! -f "$policy_root/pytest.log" ]]; then
            echo "::error::The parallel exact-disposition pytest result is missing."
            exit 1
          fi
          cat "$policy_root/pytest.log"
          policy_status="$(cat "$policy_root/status")"
          if [[ "$policy_status" != "0" ]]; then
            echo "::error::Exact-disposition pytest exited with status $policy_status."
            exit 1
          fi

