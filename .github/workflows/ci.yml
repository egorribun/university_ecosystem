          consumer_pid=""
          policy_pid=""

          printf '%s\n' "$policy_status" > "$policy_root/status"
          printf 'Consumer pytest exit status: %s\n' "$consumer_status"
          printf 'Exact disposition pytest exit status: %s\n' "$policy_status"
