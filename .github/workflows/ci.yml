  # Compare frontend MSW mocks with the authoritative OpenAPI contract.
  # This hermetic drift check remains a required PR/main-push gate.
  msw-mock-drift:
    name: MSW Mock Drift Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - pre-commit-check
      - openapi-verify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$secret"
          printf 'SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache Cargo registry
        # rust-ext is built by maturin during uv sync; cache the registry so
        # transient crates.io network faults (e.g. HTTP/2 framing errors) do
        # not cause a full build failure on every cold-cache run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-msw-${{ hashFiles('native/rust_ext/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msw-
            ${{ runner.os }}-cargo-

      - name: Install backend dependencies
        run: uv sync --frozen --no-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Generate OpenAPI spec from live FastAPI app
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: testing
        run: |
          uv run python3 - <<'PY'
          import json, pathlib
          from app.main import app
          schema_path = pathlib.Path("frontend/openapi.json")
          schema_path.write_text(
              json.dumps(app.openapi(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Normalize generated OpenAPI schema
        working-directory: frontend
        run: npm exec -- prettier --write openapi.json

      - name: Regenerate MSW mock handlers from OpenAPI spec
        working-directory: frontend
        env:
          OPENAPI_PATH: openapi.json
        run: npm run generate:api

      - name: Fail if MSW mocks are out of sync with OpenAPI spec
        run: |
          # If any generated file differs from what is committed, the
          # developer must run `npm run generate:api` locally and commit
          # the updated mock handlers.
          git diff --exit-code -- frontend/src/tests/mocks/generated/ || {
            echo "::error::MSW mock handlers are out of sync with the OpenAPI spec."
            echo "Run 'npm run generate:api' locally, review the diff, and commit."
            exit 1
          }
          echo "✅ MSW mock handlers are in sync with the OpenAPI spec."

  rust-ffi-asan:
    # Phase 3 QA — ADR-023: Run PyO3 FFI tests under AddressSanitizer + LeakSanitizer.
    # Memory errors that cross the Rust/Python boundary are invisible to Python's GC;
    # ASan instruments every allocation so these classes of bugs fail loudly at CI time.
    name: "Rust FFI - ASan / LSan"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python dependencies (with maturin)
        run: uv sync --group dev

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-asan-${{ hashFiles('native/rust_ext/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-asan-

      - name: Install LLVM tools (required for ASan runtime)
        run: |
          rustup toolchain install nightly --component rust-src --component llvm-tools --allow-downgrade --no-self-update

      - name: Generate ephemeral ASan signing key
        shell: bash
        run: |
          set -euo pipefail
          secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf '::add-mask::%s\n' "$secret"
          printf 'SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - name: Run FFI tests under ASan / LSan
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite+aiosqlite:///./test_asan.db"
          UNIVERSITY_ECOSYSTEM_PYTEST_ALLOW_DATABASE_RESET: "1"
        run: bash scripts/run_asan_tests.sh

      - name: Upload ASan report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asan-report
          path: "asan-report.*"
          if-no-files-found: ignore

  rust-ffi-tsan:
    # Phase V: Run PyO3 FFI tests under ThreadSanitizer.
    # Data races that cross the Rust/Python FFI boundary are extremely hard to debug;
    # TSan instruments every memory access and synchronization primitive to fail loudly.
    name: "Rust FFI - TSan"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python dependencies (with maturin)
        run: uv sync --group dev

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-tsan-${{ hashFiles('native/rust_ext/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tsan-

      - name: Install LLVM tools (required for TSan runtime)
        run: |
          rustup toolchain install nightly --component rust-src --component llvm-tools --allow-downgrade --no-self-update

      - name: Generate ephemeral TSan signing key
        shell: bash
        run: |
          set -euo pipefail
          secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf '::add-mask::%s\n' "$secret"
          printf 'SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - name: Run FFI tests under TSan
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite+aiosqlite:///./test_tsan.db"
          UNIVERSITY_ECOSYSTEM_PYTEST_ALLOW_DATABASE_RESET: "1"
        run: bash scripts/run_tsan_tests.sh

  rust-tests:
    # Testing session 9, Stream D — the first `cargo test` job in CI (the prior
    # Rust coverage came only from the ASan job + the weekly fuzz run).
    # Runs the native unit/KAT suites for all three Rust crates plus the
    # browser-parity wasm-bindgen tests for rust-crypto. Deterministic, so it is
    # BLOCKING (in the ci-success results array), unlike the advisory
    # long-running load-and-chaos jobs.
    name: "Rust - cargo test (x3 crates) + wasm-pack + coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # rust_ext is a PyO3 crate: even with --no-default-features (extension-module
        # dropped) the build links libpython, so a Python install must be present.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Rust (canonical 1.99.0 + wasm32 target + llvm-tools)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview

      # cargo-llvm-cov coverage targets are deliberately redirected to
      # runner.temp below. This keeps ordinary Cargo build caching fast without
      # restoring stale LLVM profraw files across source revisions.
      - name: Cache Cargo registry + target dirs (coverage-safe)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
            frontend/wasm-sanitizer/target/
            frontend/rust-crypto/target/
          # The v2 namespace prevents an existing cache archive that still
          # contains target/llvm-cov-target from being restored.
          key: ${{ runner.os }}-cargo-rust-tests-v2-${{ hashFiles('native/rust_ext/Cargo.toml', 'native/rust_ext/Cargo.lock', 'frontend/wasm-sanitizer/Cargo.toml', 'frontend/wasm-sanitizer/Cargo.lock', 'frontend/rust-crypto/Cargo.toml', 'frontend/rust-crypto/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-tests-v2-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # 0.9.1 understands Cargo's build-dir v2 layout used by current
          # nightly Rust, while remaining immutable and reproducible here.
          tool: cargo-llvm-cov@0.9.1

      - name: Install nightly Rust for branch coverage
        run: rustup toolchain install nightly --component llvm-tools-preview --allow-downgrade --no-self-update

      - name: Clean Rust coverage outputs
        run: |
          set -euo pipefail
          rm -rf -- artifacts/coverage/rust/rust-native
          rm -rf -- artifacts/coverage/rust/rust-wasm-sanitizer
          rm -rf -- artifacts/coverage/rust/rust-crypto
          rm -f -- artifacts/coverage/rust/coverage-provenance.json

      - name: Create coverage output directories
        run: mkdir -p artifacts/coverage/rust/rust-native artifacts/coverage/rust/rust-wasm-sanitizer artifacts/coverage/rust/rust-crypto

      - name: rust_ext — native unit tests + coverage (--no-default-features)
        # extension-module produces undefined Python symbols in a standalone test
        # binary on Linux; drop it and point the linker/loader at setup-python's
        # libpython via sysconfig LIBDIR.
        working-directory: native/rust_ext
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-native
          NIGHTLY_CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-native-nightly
        run: |
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="${LIBDIR}:${LD_LIBRARY_PATH}"
          cargo llvm-cov clean
          cargo llvm-cov --locked --no-default-features --lib --json --output-path ../../artifacts/coverage/rust/rust-native/llvm.json
          cargo llvm-cov report --locked --codecov --output-path ../../artifacts/coverage/rust/rust-native/codecov.json
          # Nightly branch instrumentation has a different compiler/configuration
          # identity. Keep its object files and profdata in a separate target
          # tree so the stable report lifecycle cannot remove or invalidate them.
          nightly_target_dir="${NIGHTLY_CARGO_TARGET_DIR:?}"
          export CARGO_TARGET_DIR="$nightly_target_dir"
          cargo +nightly llvm-cov clean
          cargo +nightly llvm-cov --locked --no-default-features --lib --branch --json --output-path ../../artifacts/coverage/rust/rust-native/branch-llvm.json

      - name: wasm-sanitizer — native unit tests + coverage
        working-directory: frontend/wasm-sanitizer
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-wasm-sanitizer
          NIGHTLY_CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-wasm-sanitizer-nightly
        run: |
          cargo llvm-cov clean
          cargo llvm-cov --locked --lib --json --output-path ../../artifacts/coverage/rust/rust-wasm-sanitizer/llvm.json
          cargo llvm-cov report --locked --codecov --output-path ../../artifacts/coverage/rust/rust-wasm-sanitizer/codecov.json
          # Isolate nightly branch objects from the stable coverage tree.
          nightly_target_dir="${NIGHTLY_CARGO_TARGET_DIR:?}"
          export CARGO_TARGET_DIR="$nightly_target_dir"
          cargo +nightly llvm-cov clean
          cargo +nightly llvm-cov --locked --lib --branch --json --output-path ../../artifacts/coverage/rust/rust-wasm-sanitizer/branch-llvm.json

      - name: rust-crypto — native KAT tests + coverage
        working-directory: frontend/rust-crypto
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-crypto
          NIGHTLY_CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-crypto-nightly
        # Include tests/native.rs in the coverage universe; --lib alone only
        # measures the two src/lib.rs unit tests and leaves the contract below
        # the 99/98 rust-crypto floor.
        run: |
          cargo llvm-cov clean
          cargo llvm-cov --locked --all-targets --json --output-path ../../artifacts/coverage/rust/rust-crypto/llvm.json
          cargo llvm-cov report --locked --codecov --output-path ../../artifacts/coverage/rust/rust-crypto/codecov.json
          # Isolate nightly branch objects from the stable coverage tree.
          nightly_target_dir="${NIGHTLY_CARGO_TARGET_DIR:?}"
          export CARGO_TARGET_DIR="$nightly_target_dir"
          cargo +nightly llvm-cov clean
          cargo +nightly llvm-cov --locked --all-targets --branch --json --output-path ../../artifacts/coverage/rust/rust-crypto/branch-llvm.json

      - name: Write Rust coverage provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(find artifacts/coverage/rust -name 'llvm.json' -type f | wc -l)" -eq 3
          test "$(find artifacts/coverage/rust -name 'branch-llvm.json' -type f | wc -l)" -eq 3
          while IFS= read -r report; do test -s "$report"; done < <(
            find artifacts/coverage/rust -name 'llvm.json' -type f -print
          )
          while IFS= read -r report; do test -s "$report"; done < <(
            find artifacts/coverage/rust -name 'branch-llvm.json' -type f -print
          )
          rustc_version="$(rustc --version | awk '{print $2}')"
          rustc_nightly_version="$(rustc +nightly --version | awk '{print $2}')"
          llvm_cov_version="$(cargo llvm-cov --version | awk '{print $2}')"
          python scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output artifacts/coverage/rust/coverage-provenance.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "rust-coverage-attempt-${RUN_ATTEMPT}" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "rustc=$rustc_version" \
            --tool-version "rustc-nightly=$rustc_nightly_version" \
            --tool-version "cargo-llvm-cov=$llvm_cov_version" \
            --tool-version quality-provenance=2.0.0 \
            --report "rust-native|llvm-cov-json|artifacts/coverage/rust/rust-native/llvm.json|artifacts/coverage/rust/rust-native/llvm.json" \
            --report "rust-native|llvm-cov-branch-json|artifacts/coverage/rust/rust-native/branch-llvm.json|artifacts/coverage/rust/rust-native/branch-llvm.json" \
            --report "rust-wasm-sanitizer|llvm-cov-json|artifacts/coverage/rust/rust-wasm-sanitizer/llvm.json|artifacts/coverage/rust/rust-wasm-sanitizer/llvm.json" \
            --report "rust-wasm-sanitizer|llvm-cov-branch-json|artifacts/coverage/rust/rust-wasm-sanitizer/branch-llvm.json|artifacts/coverage/rust/rust-wasm-sanitizer/branch-llvm.json" \
            --report "rust-crypto|llvm-cov-json|artifacts/coverage/rust/rust-crypto/llvm.json|artifacts/coverage/rust/rust-crypto/llvm.json" \
            --report "rust-crypto|llvm-cov-branch-json|artifacts/coverage/rust/rust-crypto/branch-llvm.json|artifacts/coverage/rust/rust-crypto/branch-llvm.json"

      - name: Upload Rust coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-attempt-${{ github.run_attempt }}
          path: |
            artifacts/coverage/rust/rust-native/llvm.json
            artifacts/coverage/rust/rust-native/branch-llvm.json
            artifacts/coverage/rust/rust-wasm-sanitizer/llvm.json
            artifacts/coverage/rust/rust-wasm-sanitizer/branch-llvm.json
            artifacts/coverage/rust/rust-crypto/llvm.json
            artifacts/coverage/rust/rust-crypto/branch-llvm.json
            artifacts/coverage/rust/coverage-provenance.json
          if-no-files-found: error

      - name: Upload Rust Codecov diagnostic artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-codecov-reports-attempt-${{ github.run_attempt }}
          path: |
            artifacts/coverage/rust/rust-native/codecov.json
            artifacts/coverage/rust/rust-wasm-sanitizer/codecov.json
            artifacts/coverage/rust/rust-crypto/codecov.json
          if-no-files-found: error

      - name: Install wasm-pack
        # rustwasm canonical curl installer (W141 polish-v2 / W142 polish-v3:
        # taiki-e/install-action hardcodes the old drager/wasm-pack repo → 404).
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0

      - name: rust-crypto — browser-parity KATs (wasm-pack, headless Chrome)
        # ubuntu-24.04 preinstalls Chrome + sets CHROMEWEBDRIVER; fall back to
        # wasm-pack's auto-download if the env var is unset.
        run: |
          if command -v chromedriver >/dev/null 2>&1; then
            CHROMEDRIVER="$(command -v chromedriver)"
            export CHROMEDRIVER
          elif [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "${CHROMEWEBDRIVER}/chromedriver" ]; then
            export CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver"
          fi
          export CHROMEDRIVER_ARGS="--headless=new --no-sandbox --disable-gpu"
          wasm-pack test --headless --chrome frontend/rust-crypto

  # Prove the declared migration rollback boundary, then re-apply every
  # migration to verify the database remains upgradeable after the rollback.
  db-migration-integrity:
    name: DB Migration Rollback Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [alembic-migrations]
    env:
      UV_PYTHON: "3.14"
      SECRET_KEY: "dummy-secret-key-for-migrations-integration-test-12345678" # pragma: allowlist secret
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_DB: migtest
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Resolve fail-closed migration downgrade policy
        id: migration-policy
        run: uv run --frozen --no-sync python scripts/quality/migration_downgrade_policy.py plan >> "$GITHUB_OUTPUT"
      - name: Apply all migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migtest # pragma: allowlist secret
        run: uv run --frozen --no-sync alembic upgrade head
      - name: Roll back the supported migration range
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migtest # pragma: allowlist secret
          SAFE_DOWNGRADE_TARGET: ${{ steps.migration-policy.outputs.safe_target }}
        run: uv run --frozen --no-sync alembic downgrade "$SAFE_DOWNGRADE_TARGET"
      - name: Verify declared irreversible migration boundary
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migtest # pragma: allowlist secret
        run: uv run --frozen --no-sync python scripts/quality/migration_downgrade_policy.py assert-boundary
      - name: Re-apply all migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migtest # pragma: allowlist secret
        run: uv run --frozen --no-sync alembic upgrade head
      - name: Run migration integrity tests
        run: uv run --frozen --no-sync pytest tests/test_migrations_integrity.py -v --tb=short

  # Advisory-only validation of the 10k WebSocket scenario definition. Running
  # that scenario requires a separately provisioned, rate-limit-adjusted stack;
  # CI must not pretend to execute a network smoke against an absent target.
  ws-stress-test:
    name: WebSocket 10k Scenario Validation (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install k6
        run: |
          set -euo pipefail
          k6_version="2.3.0"
          k6_url="https://github.com/grafana/k6/releases/download/v${k6_version}/k6-v${k6_version}-linux-amd64.tar.gz"
          k6_sha256="39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/k6.tar.gz "$k6_url"
          echo "$k6_sha256  /tmp/k6.tar.gz" | sha256sum --check --strict
          tar xzf /tmp/k6.tar.gz -C /tmp
          sudo mv "/tmp/k6-v${k6_version}-linux-amd64/k6" /usr/local/bin/
      - name: Validate k6 script syntax
        run: |
          k6 inspect tests/performance/ws_hub_10k_test.js
          k6 inspect tests/performance/ws_hub_mvp_load_test.js

  coverage-policy-gate:
    name: Coverage & Quality Policy Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - backend-tests
      - db-migration-gate
      - frontend-tests
      - go-tests
      - rust-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify aggregate checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Clean aggregate coverage destinations
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- .coverage coverage.xml
          rm -rf -- artifacts/coverage/python/shards
          rm -f -- artifacts/coverage/python/coverage.json
          rm -rf -- frontend/coverage
          rm -rf -- artifacts/coverage/go/gateway
          rm -rf -- artifacts/coverage/go/ws-hub
          rm -rf -- artifacts/coverage/go/file-processor
          rm -rf -- artifacts/coverage/go/shared-inputs
          rm -rf -- artifacts/coverage/go/shared
          rm -rf -- artifacts/coverage/rust/rust-native
          rm -rf -- artifacts/coverage/rust/rust-wasm-sanitizer
          rm -rf -- artifacts/coverage/rust/rust-crypto
          rm -rf -- artifacts/coverage/provenance
          rm -rf -- artifacts/coverage/codecov
          rm -f -- artifacts/coverage/quality-manifest.json
          rm -f -- artifacts/coverage/quality-manifest.json.sha256

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Select retry-safe same-run coverage producer artifacts
        id: select_coverage_producers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m scripts.quality.select_coverage_producer_artifacts \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --consumer-run-attempt "${{ github.run_attempt }}" \
            --commit-sha "${{ github.sha }}" \
            --run-head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --event "${{ github.event_name }}" \
            --workflow-path ".github/workflows/ci.yml"

      - name: Download Python shard coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).backend_shard_0.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/python/shards
          merge-multiple: false

      - name: Download Python shard coverage data (shard 1)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).backend_shard_1.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/python/shards
          merge-multiple: false

      - name: Download Python shard coverage data (shard 2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).backend_shard_2.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/python/shards
          merge-multiple: false

      - name: Download Python shard coverage data (shard 3)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).backend_shard_3.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/python/shards
          merge-multiple: false

      - name: Download Python migration coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).python_migration.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/python/shards
          merge-multiple: false

      - name: Set up uv for coverage aggregation
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download Frontend coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).frontend.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: frontend/coverage
          merge-multiple: false

      - name: Download Go gateway coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).go_gateway.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/go/gateway
          merge-multiple: false

      - name: Download Go ws-hub coverage artifact
