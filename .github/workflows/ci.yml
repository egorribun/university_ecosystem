      - name: Download Go shared logging coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).go_logging.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/go/shared-inputs/logging
          merge-multiple: false

      - name: Download Go SpiceDB coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).go_spicedb.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/go/shared-inputs/spicedb
          merge-multiple: false

      - name: Download Rust coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).rust_coverage.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/rust
          merge-multiple: false

      - name: Download Rust Codecov diagnostics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).rust_codecov.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/rust
          merge-multiple: false

      - name: Verify backend shard provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          SELECTIONS_JSON: ${{ steps.select_coverage_producers.outputs.selections }}
        run: |
          set -euo pipefail
          selection_value() {
            python3 - "$SELECTIONS_JSON" "$1" "$2" <<'PY'
          import json
          import sys

          selections = json.loads(sys.argv[1])
          key, field = sys.argv[2], sys.argv[3]
          value = selections.get(key, {}).get(field)
          if not isinstance(value, (str, int)) or isinstance(value, bool):
              raise SystemExit(f"missing or invalid coverage selection: {key}.{field}")
          print(value)
          PY
          }
          test "$(find artifacts/coverage/python/shards -name '.coverage.shard-*' -type f | wc -l)" -eq 4
          test "$(find artifacts/coverage/python/shards -name 'pytest-shard-*.json' -type f | wc -l)" -eq 4
          test "$(find artifacts/coverage/python/shards -name 'coverage-provenance-shard-*.json' -type f | wc -l)" -eq 4
          test "$(find artifacts/coverage/python/shards -type f | wc -l)" -eq 12
          for shard in 0 1 2 3; do
            metadata="artifacts/coverage/python/shards/coverage-provenance-shard-${shard}.json"
            artifact="$(selection_value "backend_shard_${shard}" artifact_name)"
            producer_attempt="$(selection_value "backend_shard_${shard}" producer_attempt)"
            python scripts/quality/coverage_provenance.py verify \
              --repository-root "$GITHUB_WORKSPACE" \
              --expected-sha "$EXPECTED_SHA" \
              --expected-repository "$WORKFLOW_REPOSITORY" \
              --expected-run-id "$RUN_ID" \
              --expected-run-attempt "$producer_attempt" \
              --expected-workflow-ref "$WORKFLOW_REF" \
              --expected-workflow-sha "$WORKFLOW_SHA" \
              --expected-event "$WORKFLOW_EVENT" \
              --expected-job unit-tests \
              --expected-artifact "$artifact" \
              --metadata "$metadata"
          done

      - name: Verify backend test-universe manifests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(
            find artifacts/coverage/python/shards \
              -name 'pytest-shard-*.json' -type f -print | sort
          )
          test "${#manifests[@]}" -eq 4
          verify_args=(--expected-shards 4)
          for manifest in "${manifests[@]}"; do
            verify_args+=(--manifest "$manifest")
          done
          python scripts/quality/pytest_shard_manifest.py "${verify_args[@]}"

      - name: Verify downloaded coverage artifacts
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          SELECTIONS_JSON: ${{ steps.select_coverage_producers.outputs.selections }}
        run: |
          set -euo pipefail
          selection_value() {
            python3 - "$SELECTIONS_JSON" "$1" "$2" <<'PY'
          import json
          import sys

          selections = json.loads(sys.argv[1])
          key, field = sys.argv[2], sys.argv[3]
          value = selections.get(key, {}).get(field)
          if not isinstance(value, (str, int)) or isinstance(value, bool):
              raise SystemExit(f"missing or invalid coverage selection: {key}.{field}")
          print(value)
          PY
          }
          test "$(find artifacts/coverage/python/shards -name '.coverage.shard-*' -type f | wc -l)" -eq 4
          while IFS= read -r report; do test -s "$report"; done < <(
            find artifacts/coverage/python/shards -name '.coverage.shard-*' -type f -print
          )
          test -s frontend/coverage/lcov.info
          test -s frontend/coverage/coverage-final.json
          test "$(find frontend/coverage -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find artifacts/coverage/go/shared-inputs -name 'coverage.out' -type f | wc -l)" -eq 4
          test "$(find artifacts/coverage/go -name 'coverage.out' -type f | wc -l)" -eq 7
          test "$(find artifacts/coverage/go -name 'coverage-provenance.json' -type f | wc -l)" -eq 7
          test "$(find artifacts/coverage/rust -name 'llvm.json' -type f | wc -l)" -eq 3
          test "$(find artifacts/coverage/rust -name 'branch-llvm.json' -type f | wc -l)" -eq 3
          # Match the three application crates in the coverage contract and
          # Rust producer upload. A count alone also accepts substituted paths.
          rust_codecov_reports=(
            artifacts/coverage/rust/rust-native/codecov.json
            artifacts/coverage/rust/rust-wasm-sanitizer/codecov.json
            artifacts/coverage/rust/rust-crypto/codecov.json
          )
          for report in "${rust_codecov_reports[@]}"; do
            if [[ ! -s "$report" ]]; then
              echo "::error::Missing or empty required Rust Codecov report: $report"
              exit 1
            fi
          done
          expected_rust_codecov_reports="$(printf '%s\n' "${rust_codecov_reports[@]}" | LC_ALL=C sort)"
          actual_rust_codecov_reports="$(find artifacts/coverage/rust -name 'codecov.json' -type f -print | LC_ALL=C sort)"
          if [[ "$actual_rust_codecov_reports" != "$expected_rust_codecov_reports" ]]; then
            echo "::error::Rust Codecov report inventory does not match the required components"
            printf 'Expected reports:\n%s\nActual reports:\n%s\n' "$expected_rust_codecov_reports" "$actual_rust_codecov_reports"
            exit 1
          fi
          verify_producer() {
            local metadata="$1"
            local job="$2"
            local key="$3"
            local artifact
            local producer_attempt
            artifact="$(selection_value "$key" artifact_name)"
            producer_attempt="$(selection_value "$key" producer_attempt)"
            python scripts/quality/coverage_provenance.py verify \
              --repository-root "$GITHUB_WORKSPACE" \
              --expected-sha "$EXPECTED_SHA" \
              --expected-repository "$WORKFLOW_REPOSITORY" \
              --expected-run-id "$RUN_ID" \
              --expected-run-attempt "$producer_attempt" \
              --expected-workflow-ref "$WORKFLOW_REF" \
              --expected-workflow-sha "$WORKFLOW_SHA" \
              --expected-event "$WORKFLOW_EVENT" \
              --expected-job "$job" \
              --expected-artifact "$artifact" \
              --metadata "$metadata"
          }
          verify_producer frontend/coverage/coverage-provenance.json unit-tests frontend
          verify_producer artifacts/coverage/go/gateway/coverage-provenance.json test go_gateway
          verify_producer artifacts/coverage/go/ws-hub/coverage-provenance.json test go_ws_hub
          verify_producer artifacts/coverage/go/file-processor/coverage-provenance.json test go_file_processor
          verify_producer artifacts/coverage/go/shared-inputs/uni-cli/coverage-provenance.json test go_uni_cli
          verify_producer artifacts/coverage/go/shared-inputs/logging/coverage-provenance.json test go_logging
          verify_producer artifacts/coverage/go/shared-inputs/spiffe/coverage-provenance.json test go_spiffe
          verify_producer artifacts/coverage/go/shared-inputs/spicedb/coverage-provenance.json test go_spicedb
          verify_producer artifacts/coverage/rust/coverage-provenance.json rust-tests rust_coverage

      - name: Install coverage tooling
        run: uv sync --frozen

      - name: Combine Python shard coverage
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          uv run coverage combine --data-file=.coverage artifacts/coverage/python/shards
          uv run coverage xml --data-file=.coverage -o coverage.xml
          uv run coverage json --data-file=.coverage -o artifacts/coverage/python/coverage.json
          test -s coverage.xml
          test -s artifacts/coverage/python/coverage.json
          python_version="$(uv run python -c 'import platform; print(platform.python_version())')"
          # ``coverage --version`` is human-readable ("Coverage.py, version
          # X.Y...") and its token positions are not a stable provenance
          # interface.  Read the package's canonical version instead so the
          # manifest always receives a schema-valid semantic version.
          coverage_version="$(uv run python -c 'import coverage; print(coverage.__version__)')"
          if [[ ! "$coverage_version" =~ ^[0-9]+(\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::coverage.__version__ is not a semantic version: $coverage_version"
            exit 1
          fi
          python scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output artifacts/coverage/provenance/python.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact python-coverage-aggregate \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "python=$python_version" \
            --tool-version "coverage.py=$coverage_version" \
            --tool-version quality-provenance=2.0.0 \
            --report "python|cobertura-xml|coverage.xml|coverage.xml" \
            --report "python|coverage-py-json|artifacts/coverage/python/coverage.json|artifacts/coverage/python/coverage.json"

      - name: Enforce aggregate PR differential coverage
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          COMPARE_BRANCH: ${{ github.base_ref }}
        run: |
          git fetch origin "$COMPARE_BRANCH"
          uv run diff-cover coverage.xml --compare-branch="origin/$COMPARE_BRANCH" --fail-under=100

      - name: Merge Go shared coverage evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          uv run python scripts/quality/merge_go_coverprofiles.py \
            --output artifacts/coverage/go/shared/coverage.out \
            artifacts/coverage/go/shared-inputs/uni-cli/coverage.out \
            artifacts/coverage/go/shared-inputs/logging/coverage.out \
            artifacts/coverage/go/shared-inputs/spiffe/coverage.out \
            artifacts/coverage/go/shared-inputs/spicedb/coverage.out
          test -s artifacts/coverage/go/shared/coverage.out
          python scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output artifacts/coverage/provenance/go-shared.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact go-shared-coverage-aggregate \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version go=1.26.6 \
            --tool-version quality-provenance=2.0.0 \
            --report "go-shared|go-coverprofile|artifacts/coverage/go/shared/coverage.out|artifacts/coverage/go/shared/coverage.out"

      - name: Write API-bound coverage selection receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          SELECTIONS_JSON: ${{ steps.select_coverage_producers.outputs.selections }}
        run: |
          set -euo pipefail
          selection_value() {
            python3 - "$SELECTIONS_JSON" "$1" "$2" <<'PY'
          import json
          import sys

          selections = json.loads(sys.argv[1])
          key, field = sys.argv[2], sys.argv[3]
          value = selections.get(key, {}).get(field)
          if not isinstance(value, (str, int)) or isinstance(value, bool):
              raise SystemExit(f"missing or invalid coverage selection: {key}.{field}")
          print(value)
          PY
          }
          frontend_attempt="$(selection_value frontend producer_attempt)"
          frontend_id="$(selection_value frontend artifact_id)"
          frontend_name="$(selection_value frontend artifact_name)"
          frontend_digest="$(selection_value frontend artifact_digest)"
          gateway_attempt="$(selection_value go_gateway producer_attempt)"
          gateway_id="$(selection_value go_gateway artifact_id)"
          gateway_name="$(selection_value go_gateway artifact_name)"
          gateway_digest="$(selection_value go_gateway artifact_digest)"
          ws_hub_attempt="$(selection_value go_ws_hub producer_attempt)"
          ws_hub_id="$(selection_value go_ws_hub artifact_id)"
          ws_hub_name="$(selection_value go_ws_hub artifact_name)"
          ws_hub_digest="$(selection_value go_ws_hub artifact_digest)"
          file_processor_attempt="$(selection_value go_file_processor producer_attempt)"
          file_processor_id="$(selection_value go_file_processor artifact_id)"
          file_processor_name="$(selection_value go_file_processor artifact_name)"
          file_processor_digest="$(selection_value go_file_processor artifact_digest)"
          rust_attempt="$(selection_value rust_coverage producer_attempt)"
          rust_id="$(selection_value rust_coverage artifact_id)"
          rust_name="$(selection_value rust_coverage artifact_name)"
          rust_digest="$(selection_value rust_coverage artifact_digest)"
          python3 scripts/quality/coverage_provenance.py write-api-receipt \
            --repository-root "$GITHUB_WORKSPACE" \
            --output artifacts/coverage/provenance/api-selection.json \
            --expected-sha "$EXPECTED_SHA" \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job coverage-policy-gate \
            --selection "frontend/coverage/coverage-provenance.json|unit-tests|$frontend_attempt|$frontend_id|$frontend_name|$frontend_digest" \
            --selection "artifacts/coverage/go/gateway/coverage-provenance.json|test|$gateway_attempt|$gateway_id|$gateway_name|$gateway_digest" \
            --selection "artifacts/coverage/go/ws-hub/coverage-provenance.json|test|$ws_hub_attempt|$ws_hub_id|$ws_hub_name|$ws_hub_digest" \
            --selection "artifacts/coverage/go/file-processor/coverage-provenance.json|test|$file_processor_attempt|$file_processor_id|$file_processor_name|$file_processor_digest" \
            --selection "artifacts/coverage/rust/coverage-provenance.json|rust-tests|$rust_attempt|$rust_id|$rust_name|$rust_digest"

      - name: Merge canonical coverage provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          SELECTIONS_JSON: ${{ steps.select_coverage_producers.outputs.selections }}
        run: |
          set -euo pipefail
          selection_value() {
            python3 - "$SELECTIONS_JSON" "$1" "$2" <<'PY'
          import json
          import sys

          selections = json.loads(sys.argv[1])
          key, field = sys.argv[2], sys.argv[3]
          value = selections.get(key, {}).get(field)
          if not isinstance(value, (str, int)) or isinstance(value, bool):
              raise SystemExit(f"missing or invalid coverage selection: {key}.{field}")
          print(value)
          PY
          }
          frontend_artifact="$(selection_value frontend artifact_name)"
          gateway_artifact="$(selection_value go_gateway artifact_name)"
          ws_hub_artifact="$(selection_value go_ws_hub artifact_name)"
          file_processor_artifact="$(selection_value go_file_processor artifact_name)"
          rust_artifact="$(selection_value rust_coverage artifact_name)"
          python scripts/quality/coverage_provenance.py merge \
            --repository-root "$GITHUB_WORKSPACE" \
            --contract quality/quality-contract.json \
            --output artifacts/coverage/provenance/aggregate.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job coverage-policy-gate \
            --artifact "quality-evidence-${{ github.sha }}-attempt-${RUN_ATTEMPT}" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version quality-provenance=2.0.0 \
            --retry-selection-receipt artifacts/coverage/provenance/api-selection.json \
            --producer-expectation "artifacts/coverage/provenance/python.json|coverage-policy-gate|python-coverage-aggregate" \
            --producer-expectation "frontend/coverage/coverage-provenance.json|unit-tests|$frontend_artifact" \
            --producer-expectation "artifacts/coverage/go/gateway/coverage-provenance.json|test|$gateway_artifact" \
            --producer-expectation "artifacts/coverage/go/ws-hub/coverage-provenance.json|test|$ws_hub_artifact" \
            --producer-expectation "artifacts/coverage/go/file-processor/coverage-provenance.json|test|$file_processor_artifact" \
            --producer-expectation "artifacts/coverage/provenance/go-shared.json|coverage-policy-gate|go-shared-coverage-aggregate" \
            --producer-expectation "artifacts/coverage/rust/coverage-provenance.json|rust-tests|$rust_artifact" \
            --metadata artifacts/coverage/provenance/python.json \
            --metadata frontend/coverage/coverage-provenance.json \
            --metadata artifacts/coverage/go/gateway/coverage-provenance.json \
            --metadata artifacts/coverage/go/ws-hub/coverage-provenance.json \
            --metadata artifacts/coverage/go/file-processor/coverage-provenance.json \
            --metadata artifacts/coverage/provenance/go-shared.json \
            --metadata artifacts/coverage/rust/coverage-provenance.json

      - name: Normalize coverage evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          read_tool() {
            python - "$1" <<'PY'
          import json
          import sys
          with open("artifacts/coverage/provenance/aggregate.json", encoding="utf-8") as stream:
              print(json.load(stream)["tool_versions"][sys.argv[1]])
          PY
          }
          coverage_version="$(read_tool coverage.py)"
          python_version="$(read_tool python)"
          node_version="$(read_tool node)"
          vitest_version="$(read_tool vitest)"
          go_version="$(read_tool go)"
          rustc_version="$(read_tool rustc)"
          rustc_nightly_version="$(read_tool rustc-nightly)"
          llvm_cov_version="$(read_tool cargo-llvm-cov)"
          uv run python scripts/quality/normalize_coverage_reports.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --commit-sha "$EXPECTED_SHA" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --base-ref "$BASE_REF" \
            --generated-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output artifacts/coverage/quality-manifest.json \
            --provenance-mode github-actions \
            --workflow-run-id "$RUN_ID" \
            --workflow-run-attempt "$RUN_ATTEMPT" \
            --workflow-event "$WORKFLOW_EVENT" \
            --workflow-repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-job coverage-policy-gate \
            --tool-version "coverage.py=$coverage_version" \
            --tool-version "python=$python_version" \
            --tool-version "node=$node_version" \
            --tool-version "vitest=$vitest_version" \
            --tool-version "go=$go_version" \
            --tool-version "rustc=$rustc_version" \
            --tool-version "rustc-nightly=$rustc_nightly_version" \
            --tool-version "cargo-llvm-cov=$llvm_cov_version" \
            --python-xml coverage.xml \
            --python-json artifacts/coverage/python/coverage.json \
            --frontend-lcov frontend/coverage/lcov.info \
            --frontend-json frontend/coverage/coverage-final.json \
            --go-report go-gateway=artifacts/coverage/go/gateway/coverage.out \
            --go-report go-ws-hub=artifacts/coverage/go/ws-hub/coverage.out \
            --go-report go-file-processor=artifacts/coverage/go/file-processor/coverage.out \
            --go-report go-shared=artifacts/coverage/go/shared/coverage.out \
            --rust-report rust-native=artifacts/coverage/rust/rust-native/llvm.json \
            --rust-report rust-wasm-sanitizer=artifacts/coverage/rust/rust-wasm-sanitizer/llvm.json \
            --rust-report rust-crypto=artifacts/coverage/rust/rust-crypto/llvm.json \
            --rust-branch-report rust-native=artifacts/coverage/rust/rust-native/branch-llvm.json \
            --rust-branch-report rust-wasm-sanitizer=artifacts/coverage/rust/rust-wasm-sanitizer/branch-llvm.json \
            --rust-branch-report rust-crypto=artifacts/coverage/rust/rust-crypto/branch-llvm.json

      - name: Validate quality policy, mutation registry, and Tier0 manifest
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          uv run python scripts/quality/validate_quality_contract.py \
            --schema quality/coverage-manifest.schema.json \
            --artifact-root "$GITHUB_WORKSPACE" \
            --mutation-registry quality/mutation-exclusions.json \
            --manifest artifacts/coverage/quality-manifest.json \
            --expected-commit-sha "$EXPECTED_SHA" \
            --expected-source-head-sha "$SOURCE_HEAD_SHA" \
            --expected-tested-commit-sha "$EXPECTED_SHA" \
            --expected-base-sha "$BASE_SHA" \
            --expected-base-ref "$BASE_REF" \
            --expected-workflow-run-id "$RUN_ID" \
            --expected-workflow-run-attempt "$RUN_ATTEMPT" \
            --expected-workflow-event "$WORKFLOW_EVENT" \
            --expected-workflow-repository "$WORKFLOW_REPOSITORY" \
            --expected-workflow-ref "$WORKFLOW_REF" \
            --expected-workflow-job coverage-policy-gate

      - name: Hash validated quality manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum artifacts/coverage/quality-manifest.json > artifacts/coverage/quality-manifest.json.sha256
          sha256sum --check artifacts/coverage/quality-manifest.json.sha256

      - name: Stage trusted Codecov reports
        run: |
          set -euo pipefail
          mkdir -p artifacts/coverage/codecov
          cp coverage.xml artifacts/coverage/codecov/python.xml
          cp frontend/coverage/lcov.info artifacts/coverage/codecov/frontend.lcov
          cp artifacts/coverage/go/gateway/coverage.out artifacts/coverage/codecov/go-gateway.out
          cp artifacts/coverage/go/ws-hub/coverage.out artifacts/coverage/codecov/go-ws-hub.out
          cp artifacts/coverage/go/file-processor/coverage.out artifacts/coverage/codecov/go-file-processor.out
          cp artifacts/coverage/go/shared/coverage.out artifacts/coverage/codecov/go-shared.out
          cp artifacts/coverage/rust/rust-native/codecov.json artifacts/coverage/codecov/rust-native.json
          cp artifacts/coverage/rust/rust-wasm-sanitizer/codecov.json artifacts/coverage/codecov/rust-wasm-sanitizer.json
          cp artifacts/coverage/rust/rust-crypto/codecov.json artifacts/coverage/codecov/rust-crypto.json

      - name: Upload trusted Codecov reports artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-codecov-inputs
          path: artifacts/coverage/codecov/
          if-no-files-found: error

      - name: Upload canonical quality evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            coverage.xml
            artifacts/coverage/python/coverage.json
            frontend/coverage/lcov.info
            frontend/coverage/coverage-final.json
            artifacts/coverage/go/gateway/coverage.out
            artifacts/coverage/go/ws-hub/coverage.out
            artifacts/coverage/go/file-processor/coverage.out
            artifacts/coverage/go/shared/coverage.out
            artifacts/coverage/go/shared-inputs/logging/coverage.out
            artifacts/coverage/rust/rust-native/llvm.json
            artifacts/coverage/rust/rust-native/branch-llvm.json
            artifacts/coverage/rust/rust-wasm-sanitizer/llvm.json
            artifacts/coverage/rust/rust-wasm-sanitizer/branch-llvm.json
            artifacts/coverage/rust/rust-crypto/llvm.json
            artifacts/coverage/rust/rust-crypto/branch-llvm.json
            artifacts/coverage/provenance/python.json
            artifacts/coverage/provenance/go-shared.json
            artifacts/coverage/provenance/api-selection.json
            artifacts/coverage/provenance/aggregate.json
            frontend/coverage/coverage-provenance.json
            artifacts/coverage/rust/coverage-provenance.json
            artifacts/coverage/go/gateway/coverage-provenance.json
            artifacts/coverage/go/ws-hub/coverage-provenance.json
            artifacts/coverage/go/file-processor/coverage-provenance.json
            artifacts/coverage/go/shared-inputs/uni-cli/coverage-provenance.json
            artifacts/coverage/go/shared-inputs/logging/coverage-provenance.json
            artifacts/coverage/go/shared-inputs/spiffe/coverage-provenance.json
            artifacts/coverage/go/shared-inputs/spicedb/coverage-provenance.json
            artifacts/coverage/quality-manifest.json
            artifacts/coverage/quality-manifest.json.sha256
          if-no-files-found: error

  codecov-upload:
    name: Trusted Codecov Upload
    # Never expose the OIDC minting permission to PR-controlled code.  This
    # job runs only after the aggregate gate and only for protected main pushes.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: coverage-policy-gate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download staged coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-codecov-inputs
          path: artifacts/coverage/codecov

      # Codecov flags are upload metadata, not path selectors. Keep one report
      # per upload so every component status measures exactly its own artifact.
      - name: Upload Python coverage to Codecov via OIDC
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          files: artifacts/coverage/codecov/python.xml
          flags: python
          name: trusted-main-python-${{ github.sha }}
          fail_ci_if_error: true

      - name: Upload frontend coverage to Codecov via OIDC
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          files: artifacts/coverage/codecov/frontend.lcov
          flags: frontend
          name: trusted-main-frontend-${{ github.sha }}
          fail_ci_if_error: true

      - name: Upload gateway coverage to Codecov via OIDC
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          files: artifacts/coverage/codecov/go-gateway.out
          flags: go-gateway
          name: trusted-main-go-gateway-${{ github.sha }}
          fail_ci_if_error: true

      - name: Upload ws-hub coverage to Codecov via OIDC
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          files: artifacts/coverage/codecov/go-ws-hub.out
          flags: go-ws-hub
          name: trusted-main-go-ws-hub-${{ github.sha }}
          fail_ci_if_error: true

      - name: Upload file-processor coverage to Codecov via OIDC
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          files: artifacts/coverage/codecov/go-file-processor.out
          flags: go-file-processor
          name: trusted-main-go-file-processor-${{ github.sha }}
          fail_ci_if_error: true

      - name: Upload shared Go coverage to Codecov via OIDC
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          files: artifacts/coverage/codecov/go-shared.out
          flags: go-shared
          name: trusted-main-go-shared-${{ github.sha }}
          fail_ci_if_error: true

      - name: Upload native Rust coverage to Codecov via OIDC
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          files: artifacts/coverage/codecov/rust-native.json
          flags: rust-native
          name: trusted-main-rust-native-${{ github.sha }}
          fail_ci_if_error: true

      - name: Upload WASM sanitizer coverage to Codecov via OIDC
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          files: artifacts/coverage/codecov/rust-wasm-sanitizer.json
          flags: rust-wasm-sanitizer
          name: trusted-main-rust-wasm-sanitizer-${{ github.sha }}
          fail_ci_if_error: true

      - name: Upload Rust crypto coverage to Codecov via OIDC
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          files: artifacts/coverage/codecov/rust-crypto.json
          flags: rust-crypto
          name: trusted-main-rust-crypto-${{ github.sha }}
          fail_ci_if_error: true

  quality-inventory-check:
    name: Source/Test Inventory & Anti-Pattern Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Node.js for harness TypeScript checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install harness toolchains
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Generate ephemeral audit settings
        # The model-default inventory imports SQLAlchemy metadata, which loads
        # the settings object.  Keep the workflow-level SECRET_KEY empty and
        # mint a runner-local value only for this unprivileged metadata check;
        # no repository or long-lived CI secret is exposed to PR code.
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install harness dependencies
        run: |
          uv sync --frozen
          npm --prefix frontend ci --no-audit --no-fund

      - name: Generate Inventory Manifest
        run: uv run python scripts/quality/generate_test_inventory.py

      - name: Generate and verify model-default inventory
        run: |
          uv run python scripts/quality/audit_model_defaults.py \
            --output artifacts/quality/model-default-inventory.json
          uv run python scripts/quality/audit_model_defaults.py \
            --check artifacts/quality/model-default-inventory.json

      - name: Upload model-default inventory
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-default-inventory-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/quality/model-default-inventory.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate CI check catalog
        # Keep the static governance contract on the existing required
        # inventory runner; this adds no fan-out lane or runner pressure.
        run: uv run python scripts/quality/validate_ci_check_catalog.py

      - name: Verify Orphans and Anti-Patterns
        run: uv run python scripts/quality/check_orphans_and_anti_patterns.py

      - name: Verify developer harness (hermetic repository checks)
        run: uv run python verify_harness.py --repo-only

  kyverno-test:
    name: Kyverno policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Kyverno CLI v1.19.0
        shell: bash
        run: |
          version="v1.19.0"
          archive="kyverno-cli_v1.19.0_linux_x86_64.tar.gz"
          base="https://github.com/kyverno/kyverno/releases/download/${version}"
          # Retry only transport/connection and curl-classified transient
          # failures; deterministic HTTP errors must fail the gate immediately.
          curl_args=(--fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-connrefused --connect-timeout 20)
          curl "${curl_args[@]}" --output "$RUNNER_TEMP/$archive" "$base/$archive"
          curl "${curl_args[@]}" --output "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          archive_path="$RUNNER_TEMP/$archive"
          checksum_path="$RUNNER_TEMP/checksums.txt"
          test -s "$archive_path"
          test -s "$checksum_path"
          expected_sha256="$(awk -v archive="$archive" '$2 == archive || $2 == "*" archive { print $1; exit }' "$checksum_path")"
          test -n "$expected_sha256"
          printf '%s  %s\n' "$expected_sha256" "$archive_path" | sha256sum --check -
          tar --extract --gzip --file "$archive_path" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Kyverno tests
        run: kyverno test k8s/kyverno/tests/ --require-tests

  backend-tests-unit-dummy:
    name: "Backend Tests (Python 3.14) / Unit Tests (All-Python 3.14)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: backend-tests
    steps:
      - run: echo "Satisfying branch protection for Unit Tests"

  backend-tests-integration-dummy:
    name: "Backend Tests (Python 3.14) / Integration Tests (All-Python 3.14)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: backend-tests
    steps:
      - run: echo "Satisfying branch protection for Integration Tests"

  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # CI-03 (audit Wave 10)
    permissions:
      actions: read
      contents: read
    # The authoritative aggregate must execute even while dependencies are
    # cancelled. A conditionally skipped required job is reported as success by
    # GitHub, so cancellation is evaluated by the fail-closed result table below.
    if: ${{ always() }}
    needs:
      - pre-commit-check
      - pre-commit-security-and-types
      - compose-validate
      - backend-tests
      - backend-type-check
      - go-tests
      - frontend-tests
      - security-audit
      - sbom-generate
      - alembic-migrations
      - openapi-verify
      - verify-runtime-reqs
      - docker-security-scan
      - helm-validate
      - db-migration-gate
      - go-fuzz
      - go-integration-ws-hub
      - go-integration-file-processor
      - go-integration-gateway
      - contract-tests
      - msw-mock-drift
      - provenance-check
      - e2e-wasm-build
      - rust-ffi-asan
      - rust-ffi-tsan
      - rust-tests
      - db-migration-integrity
      - actionlint
      - dockerfile-lint
      - shellcheck
      - graphql-drift-check
      - quality
      - rust-lint
      - coverage-policy-gate
      - codecov-upload
      - quality-inventory-check
      - kyverno-test

    steps:
      - name: Check all jobs passed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit-check.result }}
          PRE_COMMIT_SECURITY_RESULT: ${{ needs.pre-commit-security-and-types.result }}
          FRONTEND_TESTS_RESULT: ${{ needs.frontend-tests.result }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
          GO_TESTS_RESULT: ${{ needs.go-tests.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          BACKEND_TYPE_CHECK_RESULT: ${{ needs.backend-type-check.result }}
          COVERAGE_RESULT: ${{ needs.coverage-policy-gate.result }}
        run: |
          set -euo pipefail
          required_results=(
            "pre-commit-check|${{ needs.pre-commit-check.result }}"
            "pre-commit-security-and-types|${{ needs.pre-commit-security-and-types.result }}"
            "compose-validate|${{ needs.compose-validate.result }}"
            "backend-tests|${{ needs.backend-tests.result }}"
            "backend-type-check|${{ needs.backend-type-check.result }}"
            "go-tests|${{ needs.go-tests.result }}"
            "go-integration-ws-hub|${{ needs.go-integration-ws-hub.result }}"
            "go-integration-file-processor|${{ needs.go-integration-file-processor.result }}"
            "go-integration-gateway|${{ needs.go-integration-gateway.result }}"
            "frontend-tests|${{ needs.frontend-tests.result }}"
            "security-audit|${{ needs.security-audit.result }}"
            "sbom-generate|${{ needs.sbom-generate.result }}"
            "alembic-migrations|${{ needs.alembic-migrations.result }}"
            "openapi-verify|${{ needs.openapi-verify.result }}"
            "verify-runtime-reqs|${{ needs.verify-runtime-reqs.result }}"
            "docker-security-scan|${{ needs.docker-security-scan.result }}"
            "helm-validate|${{ needs.helm-validate.result }}"
            "db-migration-gate|${{ needs.db-migration-gate.result }}"
            "go-fuzz|${{ needs.go-fuzz.result }}"
            "contract-tests|${{ needs.contract-tests.result }}"
            "msw-mock-drift|${{ needs.msw-mock-drift.result }}"
            "provenance-check|${{ needs.provenance-check.result }}"
            "e2e-wasm-build|${{ needs.e2e-wasm-build.result }}"
            "rust-ffi-asan|${{ needs.rust-ffi-asan.result }}"
            "rust-ffi-tsan|${{ needs.rust-ffi-tsan.result }}"
            "rust-tests|${{ needs.rust-tests.result }}"
            "db-migration-integrity|${{ needs.db-migration-integrity.result }}"
            "actionlint|${{ needs.actionlint.result }}"
            "dockerfile-lint|${{ needs.dockerfile-lint.result }}"
            "shellcheck|${{ needs.shellcheck.result }}"
            "graphql-drift-check|${{ needs.graphql-drift-check.result }}"
            "quality|${{ needs.quality.result }}"
            "rust-lint|${{ needs.rust-lint.result }}"
            # The aggregate gate is skipped when one of its four producers is
            # unsuccessful. Use the same value exported above for the actual
            # result so an expression/context mismatch cannot manufacture a
            # second, misleading failure in this finalizer.
            "coverage-policy-gate|$COVERAGE_RESULT"
            "quality-inventory-check|${{ needs.quality-inventory-check.result }}"
            "kyverno-test|${{ needs.kyverno-test.result }}"
          )

          # Coverage is allowed to be skipped only when a direct producer
          # failed (or was itself skipped because an earlier producer failed).
          # Any other skip, including a cancelled producer or a skipped gate
          # with all four producers green, remains fail-closed below.
          coverage_expected_result=success
          for prerequisite in \
            "$BACKEND_TESTS_RESULT" \
            "$FRONTEND_TESTS_RESULT" \
            "$GO_TESTS_RESULT" \
            "$RUST_TESTS_RESULT"; do
            if [[ "$prerequisite" == "failure" || "$prerequisite" == "skipped" ]]; then
              coverage_expected_result=skipped
              break
            fi
          done

          failed=0
          for entry in "${required_results[@]}"; do
            IFS='|' read -r job result <<< "$entry"
            expected_result=success
            if [[ "$job" == "coverage-policy-gate" ]]; then
              expected_result="$coverage_expected_result"
            fi
            if [[ "$result" != "$expected_result" ]]; then
              echo "::error::Required CI job '$job' concluded '$result'; expected '$expected_result'."
              failed=1
            fi
          done

          assert_event_result() {
            local job="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Event-gated CI job '$job' concluded '$actual'; expected '$expected'."
              failed=1
            fi
          }

          if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == "refs/heads/main" ]]; then
            assert_event_result "codecov-upload" "${{ needs.codecov-upload.result }}" "success"
          else
            assert_event_result "codecov-upload" "${{ needs.codecov-upload.result }}" "skipped"
          fi

          if (( failed != 0 )); then
            echo "::error::One or more required CI jobs did not satisfy the fail-closed result contract."
            exit 1
          fi
          echo "All required CI checks passed."

      - name: Report integration and migration quality results
        shell: bash
        run: |
          ws=${{ needs.go-integration-ws-hub.result }}
          fp=${{ needs.go-integration-file-processor.result }}
          gw=${{ needs.go-integration-gateway.result }}
          dbmig=${{ needs.db-migration-integrity.result }}
          {
            echo "## Go integration tests (required)";
            echo "";
            echo "| Service | Result |";
            echo "|---------|--------|";
            echo "| ws-hub | $ws |";
            echo "| file-processor | $fp |";
            echo "| gateway | $gw |";
            echo "";
            echo "## Migration rollback integrity (required)";
            echo "";
            echo "| Job | Result |";
            echo "|-----|--------|";
            echo "| db-migration-integrity | $dbmig |";
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Required Go integration results - ws-hub: $ws, file-processor: $fp, gateway: $gw"
          echo "Required migration rollback integrity result - $dbmig"

      - name: Checkout source for CI health report
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python for CI health report
        if: ${{ always() }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate current-run CI timing ledger
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/quality
          python scripts/quality/analyze_ci_critical_path.py \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --concurrency-cap 20 \
            --diagnostic-lower-bound \
            --output artifacts/quality/ci-health-report.json

      - name: Render compact current-run CI health report
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/render_ci_health_report.py \
            --input artifacts/quality/ci-health-report.json \
            --output artifacts/quality/ci-health-report.md
          cat artifacts/quality/ci-health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload current-run CI health report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: ci-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/ci-health-report.*
          if-no-files-found: error
          retention-days: 14
