      - name: Download Go ws-hub coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).go_ws_hub.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/go/ws-hub
          merge-multiple: false

      - name: Download Go file-processor coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).go_file_processor.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/go/file-processor
          merge-multiple: false

      - name: Download Go uni-cli coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).go_uni_cli.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/go/shared-inputs/uni-cli
          merge-multiple: false

      - name: Download Go SPIFFE coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).go_spiffe.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
