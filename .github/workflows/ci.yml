# CI Pipeline - Refactored to use Reusable Workflows
name: "CI - Matrix Expansion"

# MOD-20-03 (audit 2026-03-24): Keep push-triggered CI limited to protected
# delivery branches (main, develop, and release/*); pull requests retain their
# required matrix regardless of source branch. Path-level filtering is done
# within individual jobs below.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    # Keep the required gate runnable when a draft PR is promoted to ready.
    # GitHub's default pull_request activity types omit ready_for_review.
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege defaults — individual jobs extend as needed.
# Prevents Poisoned Pipeline Execution (PPE) from fork PRs (OWASP CI/CD C-PPE-1).
permissions: read-all

concurrency:
  # Required PR runs share an admission group per PR so a newer commit cancels
  # stale work for that PR without evicting another PR's required run, while
  # pushes to protected branches retain independent per-ref isolation. The
  # advisory nightly workflow deliberately uses a separate
  # group because GitHub retains only one pending run per group and does not
  # provide priority ordering between workflow events.
  # This is a workflow-scoped per-PR admission/cancellation guard, not an
  # account-wide runner-pool semaphore or a reduction of logical matrix size
  # and per-lane max-parallel contracts. Other workflows have independent
  # concurrency groups and remain subject to the repository/host runner pool.
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('quality-heavy-pr-{0}', github.event.pull_request.number)
      || format('ci-matrix-{0}', github.ref) }}
  # Preserve stale-run cancellation for required PRs and protected-branch
  # pushes without allowing an advisory run to evict a required pending run.
  cancel-in-progress: true

env:
  # RZ-14-06 (audit 2026-03-18): keep the workflow-wide environment free of
  # credentials. Jobs that need a signing key generate an ephemeral value in
  # their own process; no PR-controlled checkout can inherit a repository
  # secret through this global scope.
  SECRET_KEY: ""
  ENVIRONMENT: testing

jobs:
  ci-diagnostic:
    name: CI Diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # CI-03 (audit Wave 10)
    steps:
      - name: System Check
        run: |
          echo "CI Workflow Detected"
          echo "Ref: ${GITHUB_REF}"
          echo "Head Ref: ${GITHUB_HEAD_REF}"
          echo "Event: ${GITHUB_EVENT_NAME}"

  # The ordinary pre-commit sequence used to serialize its two slowest hooks
  # (detect-secrets and mypy) ahead of every test and release qualification job.
  # Keep every hook blocking, but let a quick, read-only subset open the CI
  # fan-out while the slow security/type subset remains an independently
  # required final dependency.  The two jobs use disjoint cache namespaces:
  # cache contents are hook environments only, never quality evidence.
  pre-commit-check:
    name: Pre-commit & Linting (Read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    permissions:
      contents: read
    # Hook config and local hook entrypoints are supplied by the PR checkout.
    # Do not expose the workflow-level test secret to this unprivileged job.
    env:
      SECRET_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for lock check
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Verify uv.lock is up to date (MOD-W5-03)
        # MOD-03 (audit Wave 12): explicit error annotation in GitHub Actions UI panel.
        # `uv lock --check` already exits non-zero on mismatch; the `|| (... && exit 1)`
        # addition surfaces the error in the Checks summary, not just the raw log.
        # Note: uv.lock is generated for the project's Python version (3.14).
        run: |
          uv lock --check || (echo "::error::uv.lock is out of sync — run 'uv lock' locally and commit the updated lockfile" && exit 1)

      - name: Restore fast pre-commit environments
        # Keep the cache keyed by the immutable hook configuration, exact
        # runner closure, and interpreter location. It holds installed hook
        # toolchains only; current repository files are always checked from
        # this fresh checkout.
        # GitHub scopes caches by branch; these prefixes are CI-only and must
        # never be consumed by a privileged workflow_dispatch/workflow_run job.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-fast-v2-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      - name: Install hash-verified pre-commit runner
        # Export only the isolated runner closure: a full `uv run --frozen`
        # would synchronize the complete application environment. Hash-verified
        # pip installation prevents a substituted package from running hooks.
        run: |
          set -euo pipefail
          requirements_file="$RUNNER_TEMP/ci-precommit.requirements.txt"
          uv export --frozen \
            --only-group ci-precommit-runner \
            --no-emit-project \
            --no-emit-workspace \
            --format requirements-txt \
            -o "$requirements_file"
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --force-reinstall \
            -r "$requirements_file"
          test "$(pre-commit --version)" = "pre-commit 4.6.2"

      - name: Run fast pre-commit hooks
        env:
          # CodeQL supplies blocking hosted SAST under ADR-047 Q4.
          # The Docker-backed Semgrep hook remains mandatory locally;
          # CI skips that local hook to keep the quality fan-out bounded.
          SKIP: semgrep-docker
        run: |
          set -euo pipefail
          failed=0
          pre-commit run ruff --all-files --show-diff-on-failure || failed=1
          pre-commit run ruff-format --all-files --show-diff-on-failure || failed=1
          pre-commit run gitleaks --all-files --show-diff-on-failure || failed=1
          pre-commit run bandit --all-files --show-diff-on-failure || failed=1
          pre-commit run enforce-secret-strength --all-files --show-diff-on-failure || failed=1
          pre-commit run no-python2-except --all-files --show-diff-on-failure || failed=1
          pre-commit run actionlint --all-files --show-diff-on-failure || failed=1
          pre-commit run renovate-config-validator --all-files --show-diff-on-failure || failed=1
          exit "$failed"

  pre-commit-security-and-types:
    name: Pre-commit Security & Types (Read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    # This sibling has the same read-only trust boundary as the former single
    # pre-commit job. Starting it independently overlaps its slow scans with
    # the fast gate; ci-success still requires both results and accepts only
    # success. It has no dependencies, so use the default condition: GitHub
    # can cancel it promptly when a newer commit supersedes this attempt.
    permissions:
      contents: read
    # detect-secrets and mypy execute the PR checkout's hook configuration.
    # Keep the workflow-level test secret out of that untrusted execution.
    env:
      SECRET_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for pre-commit security hooks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Restore security/type pre-commit environments
        # Separate from the fast group so concurrent jobs cannot race to write
        # a shared cache key. Key the exact runner closure too. The cache is
        # only third-party hook environments; every scan consumes current
        # checkout files and reports fresh results.
        # This CI-only prefix must never be restored by privileged workflows.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-security-types-v2-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      - name: Install hash-verified pre-commit runner
        # Match the fast sibling exactly: only the isolated runner closure is
        # installed, and the runtime assertion rejects an unexpected executable
        # before detect-secrets or mypy can execute.
        run: |
          set -euo pipefail
          requirements_file="$RUNNER_TEMP/ci-precommit.requirements.txt"
          uv export --frozen \
            --only-group ci-precommit-runner \
            --no-emit-project \
            --no-emit-workspace \
            --format requirements-txt \
            -o "$requirements_file"
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --force-reinstall \
            -r "$requirements_file"
          test "$(pre-commit --version)" = "pre-commit 4.6.2"

      - name: Run security and type pre-commit hooks
        env:
          SKIP: semgrep-docker
        run: |
          set -euo pipefail
          failed=0
          # detect-secrets and mypy have disjoint outputs: the former only
          # canonicalizes .secrets.baseline under its lock, while the latter
          # writes the isolated .mypy_cache. Run both in parallel to remove
          # their serial ~4-minute tail without dropping either blocking gate.
          pre-commit run detect-secrets --all-files --show-diff-on-failure &
          detect_secrets_pid=$!
          pre-commit run mypy --all-files --show-diff-on-failure &
          mypy_pid=$!
          wait "$detect_secrets_pid" || failed=1
          wait "$mypy_pid" || failed=1
          exit "$failed"

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CI secret key if not configured (RZ-14-06)
        # RZ-14-06: the workflow-wide key is intentionally empty for every
        # event; generate an ephemeral 32-byte value only in this job.
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Enforce Rate Limit Shim Deadline (TD-003)
        run: |
          count=$(git grep "from app.core import rate_limit" app/ | wc -l || echo "0")
          if [ "$count" -gt 15 ]; then
            echo "::error::Too many legacy rate_limit imports ($count). Baseline is 15. Do not add new ones."
            exit 1
          fi
          echo "Found $count legacy imports."
      - name: Enforce Dishka Migration Deadline (TD-004)
        # TD-4 (audit 2026-03-05): Fail if new files appear in app/deps/ to prevent
        # regression. The baseline at audit time is 12 files. New features MUST use
        # Dishka (FromDishka[]) instead of the legacy Depends() container.
        run: |
          BASELINE=12
          COUNT=$(find app/deps -name "*.py" ! -name "__init__.py" | wc -l)
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::New Depends() files detected in app/deps/ ($COUNT > baseline $BASELINE). Add new services as Dishka providers in app/core/di_provider.py instead."
            exit 1
          fi
          echo "OK: $COUNT legacy deps files (baseline: $BASELINE)"
      - name: Enforce no-pickle gate (RED-01 RZ-W13)
        # RED-01 (audit Wave 13): pickle.loads/dumps enables RCE if the data
        # source (Redis, DB) is ever compromised.  Pydantic JSON serialization
        # is the safe replacement.  This gate prevents future re-introduction.
        shell: bash
        run: |
          # TD-W18-04 (audit 2026-03-23 Wave 18): exclude comments to prevent false
          # positives (e.g. "# Do NOT import pickle" triggered the old gate).
          result=$(grep -rn "import pickle\|from pickle\|pickle\.loads\|pickle\.dumps" app/ --include="*.py" | grep -v '^\s*#' | grep -v '# nosec' || true)
          if [ -n "$result" ]; then
            echo "::error::pickle usage detected in app/ — replace with Pydantic model_validate_json / model_dump_json (see RED-01 in Wave 13 audit)"
            echo "$result"
            exit 1
          fi
          echo "OK: no pickle usage found in app/"

      - name: "Enforce Python 3 except tuple syntax (RZ-25-01 / MOD-27-01)"
        # MOD-27-01: Fixed regex — previous `grep -v 'except ('` accidentally
        # filtered valid matches, allowing 44 violations to pass the gate.
        # Now anchored to line start, requires trailing colon, no filter pipes.
        shell: bash
        run: |
          result=$(grep -rn --include='*.py' -P '^\s*except\s+[A-Za-z_][\w.]*\s*,\s*[A-Za-z_][\w.]*\s*[,:]' app/ tests/ || true)
          if [ -n "$result" ]; then
            echo "::error::Python 2 except syntax detected (MOD-27-01). Use tuple form: except (A, B):"
            echo "$result"
            echo "Found $(echo "$result" | wc -l) violations"
            exit 1
          fi
          echo "OK: no Python 2 except syntax found"

      - name: "MOD-30-01: Enforce lazy=noload on SQLAlchemy relationships"
        run: |
          # All relationships in app/models/ must have explicit lazy= parameter
          # to prevent N+1 queries.  See CLAUDE.md: "ALL relationships must have
          # explicit lazy=\"noload\"".  Use '# noload-exempt: <reason>' for
          # justified exceptions (e.g., lazy="joined" for 1:1).
          #
          # Multi-line aware: reads full relationship(...) calls across lines.
          python3 -c "
          import re, sys, pathlib

          models = pathlib.Path('app/models')
          # Match relationship( ... ) spanning multiple lines
          pat = re.compile(r'relationship\s*\(', re.MULTILINE)
          violations = []
          for f in sorted(models.rglob('*.py')):
              if '__pycache__' in str(f):
                  continue
              text = f.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              # Build line offset map
              offsets = []
              pos = 0
              for line in lines:
                  offsets.append(pos)
                  pos += len(line)
              for m in pat.finditer(text):
                  start = m.start()
                  # Find matching closing paren (handle nesting)
                  depth, i = 1, m.end()
                  while i < len(text) and depth > 0:
                      if text[i] == '(':
                          depth += 1
                      elif text[i] == ')':
                          depth -= 1
                      i += 1
                  block = text[start:i]
                  # Line number (1-based)
                  lineno = next(j + 1 for j in range(len(offsets) - 1, -1, -1) if offsets[j] <= start)
                  if 'lazy=' in block or '# noload-exempt' in block:
                      continue
                  violations.append(f'{f}:{lineno}:    {lines[lineno-1].rstrip()}')
          if violations:
              print('::error::Relationships without explicit lazy= found (MOD-30-01):')
              print('\n'.join(violations))
              print()
              print('All relationships MUST have lazy=\"noload\" (see CLAUDE.md).')
              print(\"Add '# noload-exempt: <reason>' for justified exceptions.\")
              sys.exit(1)
          print('OK: all relationships have explicit lazy= parameter')
          "

      - name: Validate docker compose configuration
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          # imgproxy signing is mandatory in Compose; deterministic low-entropy
          # values are sufficient for config rendering and are never deployed.
          $env:IMGPROXY_KEY = [string]::new('0', 64)
          $env:IMGPROXY_SALT = [string]::new('1', 64)
          docker compose -f docker-compose.yml config
          # Also validate the merged load-and-chaos stack (base + infra + go +
          # CI override). WS_HUB_INTERNAL_SECRET is referenced by the fragment.
          $env:WS_HUB_INTERNAL_SECRET = "dummy-ci-validate-secret"  # pragma: allowlist secret
          docker compose -f docker-compose.yml -f docker-compose.infra.yml -f docker-compose.go.yml -f docker-compose.ci-loadtest.yml config | Out-Null

  actionlint:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and Run actionlint
        run: |
          set -euo pipefail
          actionlint_version="1.7.12"
          actionlint_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"  # pragma: allowlist secret
          actionlint_archive="$RUNNER_TEMP/actionlint_${actionlint_version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$actionlint_sha256" "$actionlint_archive" \
            | sha256sum --check --strict
          tar --extract --file "$actionlint_archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color -shellcheck ""


  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Hadolint
        run: |
          set -euo pipefail
          hadolint_version="2.12.0"
          hadolint_sha256="56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010"  # pragma: allowlist secret
          hadolint_path="$RUNNER_TEMP/hadolint"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$hadolint_path" \
            "https://github.com/hadolint/hadolint/releases/download/v${hadolint_version}/hadolint-Linux-x86_64"
          printf '%s  %s\n' "$hadolint_sha256" "$hadolint_path" \
            | sha256sum --check --strict
          chmod +x "$hadolint_path"
          find . -type f \( -name "*Dockerfile*" -o -name "Dockerfile*" \) ! -name "*.dockerignore" ! -path "*/node_modules/*" ! -path "*/.venv/*" -exec "$hadolint_path" --config .hadolint.yaml {} +

  shellcheck:
    name: ShellCheck Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: |
          set -euo pipefail
          shellcheck_version="0.10.0"
          shellcheck_sha256="6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"  # pragma: allowlist secret
          shellcheck_archive="$RUNNER_TEMP/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$shellcheck_sha256" "$shellcheck_archive" \
            | sha256sum --check --strict
          tar --extract --file "$shellcheck_archive" --directory "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/shellcheck-v${shellcheck_version}/shellcheck"
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          shellcheck_bin="$RUNNER_TEMP/shellcheck-v0.10.0/shellcheck"
          test -x "$shellcheck_bin"
          find scripts/ -type f -name "*.sh" -exec "$shellcheck_bin" -e SC2086 -e SC2001 -e SC2030 -e SC2031 {} +

  graphql-drift-check:
    name: GraphQL Schema Drift Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Generate current GraphQL Schema
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "dummy-key-for-graphql-generation"  # pragma: allowlist secret
          ENVIRONMENT: testing
        run: |
          uv run python -c "
          from app.graphql.schema import schema
          import pathlib
          pathlib.Path('schema.graphql').write_text(str(schema))
          "
      - name: Check drift against main branch
        run: |
          git fetch origin main
          git show origin/main:schema.graphql > /tmp/schema_main.graphql || touch /tmp/schema_main.graphql
          if [ -s /tmp/schema_main.graphql ]; then
            diff -u /tmp/schema_main.graphql schema.graphql || {
              echo "::error::GraphQL schema has changed! If this is intended, update schema.graphql on main or add the schema.graphql changes to this PR."
              exit 1
            }
          else
            echo "No schema.graphql found on main to compare against."
          fi

  quality:
    name: Code Spell & Markdown Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !.agents/skills/**
            !.venv/**
      - name: Run cspell
        id: cspell
        uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v9.1.0
        with:
          config: "cspell.json"
          use_cspell_files: true
          incremental_files_only: false
      - name: Verify cspell checked reviewed docs
        env:
          CSPELL_FILES_CHECKED: ${{ steps.cspell.outputs.number_of_files_checked }}
        run: |
          if [[ "$CSPELL_FILES_CHECKED" != "9" ]]; then
            echo "::error::CSpell checked $CSPELL_FILES_CHECKED files; expected 9 reviewed English docs"
            exit 1
          fi

  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up Rust (canonical 1.97.1)
        # Same compiler as the WASM producer (reusable-e2e-wasm-build.yml);
        # a floating channel would lint and measure different code paths.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Cache Cargo registry + target dirs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
            frontend/wasm-sanitizer/target/
            frontend/rust-crypto/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('native/rust_ext/Cargo.toml', 'frontend/wasm-sanitizer/Cargo.toml', 'frontend/rust-crypto/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
      - name: Check Formatting (rustfmt)
        run: |
          cargo fmt --all --manifest-path native/rust_ext/Cargo.toml -- --check
          cargo fmt --all --manifest-path frontend/wasm-sanitizer/Cargo.toml -- --check
          cargo fmt --all --manifest-path frontend/rust-crypto/Cargo.toml -- --check
      - name: Run Clippy (static analysis)
        run: |
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="${LIBDIR}:${LD_LIBRARY_PATH}"
          cargo clippy --manifest-path native/rust_ext/Cargo.toml --all-targets --no-default-features --locked -- -D warnings
          cargo clippy --manifest-path frontend/wasm-sanitizer/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path frontend/rust-crypto/Cargo.toml --all-targets --locked -- -D warnings

      - name: Install cargo-udeps
        run: |
          set -euo pipefail
          rustup toolchain install nightly
          binstall_script_commit="5aafaaca52423a22d83a812fa3ca77492e2895db"
          binstall_script_sha256="d3a93702160e0ec03e2a4e996855db1f01adee801fb84a43add24e0877ef8eae"
          binstall_script_url="https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${binstall_script_commit}/install-from-binstall-release.sh"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            "${binstall_script_url}" --output /tmp/install-binstall.sh
          printf '%s  %s\n' "${binstall_script_sha256}" /tmp/install-binstall.sh \
            | sha256sum --check --strict
          sh /tmp/install-binstall.sh
          cargo binstall -y cargo-udeps@0.1.61

      - name: Run cargo-udeps (unused dependencies check)
        run: |
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="${LIBDIR}:${LD_LIBRARY_PATH}"
          cargo +nightly udeps --manifest-path native/rust_ext/Cargo.toml --all-targets --no-default-features --locked
          cargo +nightly udeps --manifest-path frontend/wasm-sanitizer/Cargo.toml --all-targets --locked
          cargo +nightly udeps --manifest-path frontend/rust-crypto/Cargo.toml --all-targets --locked


  backend-tests:
    name: "Backend Tests (${{ matrix.name }})"
    strategy:
      fail-fast: false
      # Reusable backend calls expand into unit and (for selected legs)
      # integration jobs.  Keep two callers active so the PR matrix cannot
      # consume the entire hosted-runner pool while preserving all four legs.
      max-parallel: 2
      matrix:
        include:
          - python-version: "3.14"
            name: "Python 3.14-shard-0"
            shard: 0
            run-integration: true
          - python-version: "3.14"
            name: "Python 3.14-shard-1"
            shard: 1
            run-integration: false
          - python-version: "3.14"
            name: "Python 3.14-shard-2"
            shard: 2
            run-integration: false
          - python-version: "3.14"
            name: "Python 3.14-shard-3"
            shard: 3
            run-integration: false
            free-threading: false
    needs: pre-commit-check
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-backend-tests.yml
    with:
      test-group-name: "All-${{ matrix.name }}"
      test-pattern: "tests/"
      integration-test-pattern: "tests/integration/"
      python-version: ${{ matrix.python-version }}
      # A shard sees only part of the suite, so it cannot enforce the global
      # percentage in isolation. coverage-policy-gate combines all four data
      # files and enforces the canonical exact-100 contract.
      coverage-threshold: 0
      run-integration-tests: ${{ matrix.run-integration }}
      parallel-workers: 0 # LOW-W19: 0 = auto-detect workers via pytest-xdist (-n auto)
      shard-id: ${{ matrix.shard }}
      num-shards: 4
      python-gil: ${{ matrix.free-threading && '0' || '1' }}  # MOD-24-03
  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      # P0-02 (audit 2026-03-06): SHA-pinned — tag-only refs are mutable and vulnerable
      # to supply chain attacks via tag mutation (OWASP CI/CD C-PPE-1).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run mypy
        run: uv run mypy

      - name: Enforce Mypy override budget
        run: |
          uv run python scripts/check_mypy_budget.py
          uv run python scripts/check_mypy_overrides_budget.py

      # Declared runtime dependencies must match what app/ imports; every
      # exception is justified in pyproject.toml [tool.deptry].
      - name: Check runtime dependency hygiene
        run: uv run deptry app

  go-tests:
    name: Go Tests (${{ matrix.service }})
    strategy:
      # Keep every service leg running so one failure cannot mask diagnostics
      # from the remaining modules.
      fail-fast: false
      # Each reusable call expands into test and lint jobs. Two callers keep
      # the required Go matrix bounded while leaving capacity for integration.
      max-parallel: 2
      matrix:
        # Every supported Go module has exact statement coverage. Integration
        # semantics remain a separate required gate below.
        include:
          - service: services/gateway
            coverage-threshold: 100
            coverage-component: go-gateway
            coverage-canonical-path: artifacts/coverage/go/gateway/coverage.out
          - service: services/file-processor
            coverage-threshold: 100
            coverage-component: go-file-processor
            coverage-canonical-path: artifacts/coverage/go/file-processor/coverage.out
          - service: services/ws-hub
            coverage-threshold: 100
            coverage-component: go-ws-hub
            coverage-canonical-path: artifacts/coverage/go/ws-hub/coverage.out
          - service: services/cmd/uni-cli
            coverage-threshold: 100
            coverage-component: go-shared-fragment
            coverage-canonical-path: artifacts/coverage/go/shared-inputs/uni-cli/coverage.out
          - service: services/pkg/logging
            coverage-threshold: 100
            coverage-component: go-shared-fragment
            coverage-canonical-path: artifacts/coverage/go/shared-inputs/logging/coverage.out
          - service: services/pkg/spiffe
            coverage-threshold: 100
            coverage-component: go-shared-fragment
            coverage-canonical-path: artifacts/coverage/go/shared-inputs/spiffe/coverage.out
          - service: services/pkg/spicedb
            coverage-threshold: 100
            coverage-component: go-shared-fragment
            coverage-canonical-path: artifacts/coverage/go/shared-inputs/spicedb/coverage.out
    needs: pre-commit-check
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-go-tests.yml
    with:
      service-directory: ${{ matrix.service }}
      go-version: "1.26.6"
      coverage-threshold: ${{ matrix.coverage-threshold }}
      coverage-component: ${{ matrix.coverage-component }}
      coverage-canonical-path: ${{ matrix.coverage-canonical-path }}

  # MOD-W15-06 (audit 2026-03-23 Wave 15): Go fuzz testing for ws-hub message parsing.
  # Bounded fuzz smoke — finds quick panics and crashes without an unbounded
  # worker lifetime.
  # Crashes are stored in testdata/fuzz/ and replayed on subsequent runs automatically.
  go-fuzz:
    name: Go Fuzz Tests (ws-hub)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Go 1.27.1 contains the upstream fix for golang/go#75804.  Pin the
          # patched toolchain so the bounded fuzz smoke cannot report a false
          # context-deadline failure during normal deadline shutdown.
          go-version: "1.27.1"
          cache-dependency-path: services/ws-hub/go.sum

      - name: Run fuzz tests (bounded smoke)
        run: |
          cd services/ws-hub
          # Serialize fuzz workers to bound runner memory. Go 1.27.1 contains
          # the upstream fix for golang/go#75804, so the full bounded smoke
          # budget is retained without masking or ignoring failures.
          go test ./pkg/hub/ -fuzz=FuzzParseMessage -fuzztime=20s -parallel=1 -timeout=3m
          go test ./pkg/hub/ -fuzz=FuzzExtractAlgFromHeader -fuzztime=20s -parallel=1 -timeout=3m

      - name: Upload fuzz corpus on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crash-corpus
          path: services/ws-hub/testdata/fuzz/
          retention-days: 30

  # ADR-022: required Go integration tests against real testcontainers-go
  # containers. Each service runs independently for precise diagnostics.
  go-integration-ws-hub:
    name: Go Integration Tests (ws-hub)
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-go-integration-tests.yml
    with:
      service-directory: services/ws-hub
      go-version: "1.26.6"

  go-integration-file-processor:
    name: Go Integration Tests (file-processor)
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-go-integration-tests.yml
    with:
      service-directory: services/file-processor
      go-version: "1.26.6"

  go-integration-gateway:
    name: Go Integration Tests (gateway)
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-go-integration-tests.yml
    with:
      service-directory: services/gateway
      go-version: "1.26.6"

  frontend-tests:
    name: Frontend Tests
    needs:
      - e2e-wasm-build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-frontend-tests.yml
    with:
      node-version: "24"
      run-lighthouse: false
      wasm-artifact-id: ${{ needs.e2e-wasm-build.outputs.artifact_id }}
      wasm-artifact-name: ${{ needs.e2e-wasm-build.outputs.artifact_name }}
      wasm-artifact-digest: ${{ needs.e2e-wasm-build.outputs.artifact_digest }}

  # Build the generated WASM packages once for all frontend and Playwright
  # jobs. Consumers bind the server-issued artifact outputs to this run.
  e2e-wasm-build:
    name: E2E WASM Build
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-e2e-wasm-build.yml

  # Keep dependency and static security analysis blocking for every PR and
  # main push. Results remain a direct prerequisite of the CI Success gate.
  security-audit:
    name: Security Audit
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-security-audit.yml
    with:
      python-version: "3.14"
      node-version: "24"

  # MOD-21-04 (audit 2026-03-25 Wave 21): Generate Software Bill of Materials
  # for supply chain security compliance (CycloneDX/SPDX).  Uploads as a build
  # artifact so downstream tools (Dependabot, Grype, etc.) can consume it.
  sbom-generate:
    name: SBOM Generation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: pre-commit-check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.0 — RZ-22-03
        with:
          path: .
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # MOD-22-04 (audit 2026-03-25 Wave 22): SLSA provenance dry-run.
  # Validates that SLSA provenance tooling (slsa-verifier) is available
  # and the configuration is valid.  Does NOT publish attestations —
  # that is handled by the release workflow.
  provenance-check:
    name: SLSA Provenance Dry-Run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: pre-commit-check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install slsa-verifier
        run: |
          set -euo pipefail
          slsa_verifier_version="2.7.0"
          slsa_verifier_url="https://github.com/slsa-framework/slsa-verifier/releases/download/v${slsa_verifier_version}/slsa-verifier-linux-amd64"
          slsa_verifier_sha256="499befb675efcca9001afe6e5156891b91e71f9c07ab120a8943979f85cc82e6" # pragma: allowlist secret -- release checksum
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/slsa-verifier "$slsa_verifier_url"
          echo "$slsa_verifier_sha256  /tmp/slsa-verifier" | sha256sum --check --strict
          chmod +x /tmp/slsa-verifier

      - name: Verify slsa-verifier is functional
        run: |
          /tmp/slsa-verifier version
          echo "SLSA verifier is available and functional."

      - name: Validate provenance config exists
        run: |
          # Check that the repo has the expected CI structure for provenance.
          if [ ! -f ".github/workflows/ci.yml" ]; then
            echo "::error::CI workflow not found — provenance generation requires ci.yml"
            exit 1
          fi
          echo "Provenance configuration validated."

  alembic-migrations:
    name: Alembic Migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # MOD-NEW-008 (audit 2026-03-19): Integrate Squawk to automatically lint
      # Alembic migrations. Blocks destructive statements (DROP COLUMN, ALTER TYPE)
      # ensuring Zero-Downtime Deployment (ZDD) compatibility.
      - name: Install Squawk Linter
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: sbdchd/squawk
          tag: v2.44.0 # MOD-008: update to latest release v2.44.0
          asset-name: squawk-linux-x64 # Specify explicit binary name
          cache: enable
          extension-matching: disable
          rename-to: squawk
          chmod: 0755

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        shell: pwsh
        run: |
          uv sync --frozen

      - name: Lint Postgres Migrations (Squawk)
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/university_db" # pragma: allowlist secret
        run: |
          set -euo pipefail
          echo "Linting changed Alembic migrations for ZDD safety..."
          base_sha="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base_sha" ]; then base_sha="HEAD~1"; fi
          changed_files="$(git diff --name-only "$base_sha"...HEAD -- 'alembic/versions/*.py')"
          if [ -z "$changed_files" ]; then
            echo "No changed migrations; baseline migrations are covered by the immutable history gate."
            exit 0
          fi
          while IFS= read -r migration; do
            [ -z "$migration" ] && continue
            read -r revision down_revision < <(
              uv run python scripts/quality/read_alembic_revision.py "$migration"
            )
            echo "Checking $migration ($down_revision -> $revision)"
            uv run alembic upgrade "$down_revision:$revision" --sql \
              | squawk --exclude prefer-robust-stmts --exclude prefer-text-field \
                --exclude require-timeout-settings --exclude prefer-bigint-over-int \
                --exclude prefer-identity --exclude prefer-timestamp-tz \
                --exclude require-concurrent-index-creation --exclude constraint-missing-not-valid \
                --exclude require-concurrent-index-deletion \
                --exclude adding-foreign-key-constraint --exclude disallowed-unique-constraint \
                --exclude require-enum-value-ordering
          done <<< "$changed_files"

      - name: Wait for PostgreSQL
        shell: pwsh
        run: |
          $timeout = 30
          $elapsed = 0
          do {
            if (pg_isready -h localhost -p 5432 -U test) {
              return
            }
            Start-Sleep -Seconds 1
            $elapsed++
          } while ($elapsed -lt $timeout)
          throw "PostgreSQL was not ready in $timeout seconds"

      - name: Create database tables
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        shell: bash
        run: |
          uv run python3 <<'PY'
          import asyncio
          from app.core.database import Base, engine

          async def create_tables():
              async with engine.begin() as conn:
                  from sqlalchemy import text
                  await conn.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
                  await conn.run_sync(Base.metadata.create_all)

          asyncio.run(create_tables())
          PY

      - name: Resolve fail-closed migration downgrade policy
        id: migration-policy
        run: uv run python scripts/quality/migration_downgrade_policy.py plan >> "$GITHUB_OUTPUT"

      - name: Run Alembic upgrade and supported downgrade
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
          SAFE_DOWNGRADE_TARGET: ${{ steps.migration-policy.outputs.safe_target }}
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini downgrade "$SAFE_DOWNGRADE_TARGET"
          uv run python scripts/quality/migration_downgrade_policy.py assert-boundary
          uv run alembic -c alembic.ini upgrade head

      # MOD-22-05 (audit 2026-03-25 Wave 22): Assert exactly 1 migration head.
      # Multiple heads indicate an un-merged migration branch — alembic upgrade
      # will fail in production.  This gate catches the issue before merge.
      - name: Check single migration head (MOD-22-05)
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        shell: bash
        run: |
          set -euo pipefail
          heads="$(uv run alembic heads)"
          HEAD_COUNT="$(awk 'NF { count++ } END { print count + 0 }' <<< "$heads")"
          echo "Alembic heads: $HEAD_COUNT"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic head but found $HEAD_COUNT. Merge the migration branches before merging this PR."
            uv run alembic heads
            exit 1
          fi

      - name: Check Alembic schema drift (MOD-14-03)
        # RZ-14-05 (audit 2026-03-23): alembic check exits 1 if the ORM models
        # diverge from the live schema — catches missing length constraints,
        # new columns not backed by migrations, and type mismatches.
        # Runs after upgrade head so the schema is at the latest revision.
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        shell: pwsh
        run: |
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini check || {
            echo "::error::Alembic schema drift detected — ORM models diverge from migration history. Run 'alembic revision --autogenerate' to inspect the diff."
            exit 1
          }

  openapi-verify:
    name: Verify OpenAPI Types
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache Cargo registry
        # rust-ext is built by maturin during uv sync; cache the registry so
        # transient crates.io network faults (e.g. HTTP/2 framing errors) do
        # not cause a full build failure on every cold-cache run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-openapi-${{ hashFiles('native/rust_ext/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-openapi-
            ${{ runner.os }}-cargo-

      - name: Install backend dependencies
        shell: pwsh
        run: |
          uv sync --frozen --no-dev

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Generate OpenAPI schema
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        shell: bash
        run: |
          uv run python3 - <<'PY'
          import json
          import pathlib
          from app.main import app

          schema_path = pathlib.Path("frontend/openapi.json")
          schema_path.write_text(
              json.dumps(app.openapi(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Normalize generated OpenAPI schema
        working-directory: frontend
        run: npm exec -- prettier --write openapi.json

      - name: Generate API types
        working-directory: frontend
        env:
          OPENAPI_PATH: frontend/openapi.json
        run: npm run generate:api

      - name: Verify generated API types are up to date
        shell: pwsh
        run: |
          git diff --exit-code -- `
            frontend/openapi.json `
            frontend/src/api/generated/ `
            frontend/src/tests/mocks/generated/
          if ($LASTEXITCODE -ne 0) {
            echo "::error::Generated OpenAPI, TypeScript SDK, or MSW mocks are not up to date. Run 'npm run generate:api'."
            exit 1
          }

  verify-runtime-reqs:
    name: Verify Runtime Requirements
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ensure pyproject.toml excludes test-only packages from main dependencies
        shell: bash
        run: |
          uv run python - <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          banned = {
              "pytest",
              "pytest-asyncio",
              "pytest-cov",
              "pre-commit",
              "fakeredis",
              "asgi-lifespan",
          }

          pyproject_path = pathlib.Path("pyproject.toml")
          with open(pyproject_path, "rb") as f:
              data = tomllib.load(f)

          dependencies = data.get("project", {}).get("dependencies", [])
          violations: list[str] = []
          for entry in dependencies:
              name = re.split(r"[<=>!\[\]]", entry, 1)[0].strip().lower()
              if name in banned:
                  violations.append(entry)

          if violations:
              print("::error::test/development packages found in [project].dependencies in pyproject.toml:")
              for entry in violations:
                  print(f"  - {entry}")
              sys.exit(1)

          print("Project dependencies look clean.")
          PY

  docker-security-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: pre-commit-check
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image for scanning
        # LOW-W19: root Dockerfile does not exist; backend image uses backend.Dockerfile
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t "university-ecosystem/backend:${IMAGE_TAG}" -f backend.Dockerfile .

      - name: Run Trivy vulnerability scanner
        id: trivy_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Prefer the canonical GHCR database. The public mirror can be
          # transiently unavailable from GitHub-hosted runners; changing the
          # source does not alter severity policy or the fail-closed gate.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          image-ref: university-ecosystem/backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          # Match the pre-category configuration key used by main. The
          # reusable audit has a separate job key for filesystem/config scans.
          category: ".github/workflows/ci.yml:docker-security-scan"

  # MOD-W15-03 (audit 2026-03-23 Wave 15): Helm lint + kubeconform validation.
  # Catches broken Helm templates and K8s manifest schema violations before deploy.
  helm-validate:
    name: Helm Lint & Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "3.17.0"

      - name: Helm dependency build
        shell: bash
        run: |
          python3 scripts/ci/helm_dependency_build.py \
            charts/university-ecosystem \
            redis-20.13.4.tgz nats-8.5.4.tgz

      - name: Helm lint — university-ecosystem chart
        run: |  # pragma: allowlist secret
          helm lint charts/university-ecosystem/ --strict \
            --set redis.enabled=false \
            --set nats.enabled=false \
            --set applicationSecrets.existingSecret=ci-application-secrets

      - name: Helm template — dry-run
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |  # pragma: allowlist secret
          helm template university-ecosystem charts/university-ecosystem/ \
            --set redis.enabled=false \
            --set nats.enabled=false \
            --set applicationSecrets.existingSecret=ci-application-secrets \
            --set global.imageTag="test-sha-${IMAGE_TAG}" \
            > /tmp/backend-manifests.yaml
          echo "Helm template rendered successfully ($(wc -l < /tmp/backend-manifests.yaml) lines)"

      - name: Install kubeconform
        run: |
          set -euo pipefail
          kubeconform_version="0.6.7"
          kubeconform_url="https://github.com/yannh/kubeconform/releases/download/v${kubeconform_version}/kubeconform-linux-amd64.tar.gz"
          kubeconform_sha256="95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73" # pragma: allowlist secret -- release checksum
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/kubeconform.tar.gz "$kubeconform_url"
          echo "$kubeconform_sha256  /tmp/kubeconform.tar.gz" | sha256sum --check --strict
          tar xf /tmp/kubeconform.tar.gz -C /tmp
          chmod +x /tmp/kubeconform

      - name: Validate manifests with kubeconform
        run: |
          /tmp/kubeconform -strict -summary \
            -skip NetworkChaos,PodChaos,HTTPChaos,ClusterPolicy,ScaledObject,ExternalSecret,SecretStore,ClusterSecretStore,PrometheusRule,TriggerAuthentication,ServiceMonitor,Kustomization,Test \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/866b2653a5334db9aed20ad74701e20fd464471b/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/backend-manifests.yaml

      - name: Validate static K8s manifests with kubeconform
        run: |
          /tmp/kubeconform -strict -summary \
            -ignore-filename-pattern 'secrets-example\.yaml' \
            -ignore-filename-pattern '.*bad.*' \
            -ignore-filename-pattern '.*kyverno.*' \
            -ignore-filename-pattern '.*flags\.json' \
            -ignore-filename-pattern '.*kustomization\.yaml' \
            -skip NetworkChaos,PodChaos,HTTPChaos,ClusterPolicy,ScaledObject,ExternalSecret,SecretStore,ClusterSecretStore,PrometheusRule,TriggerAuthentication,TestSuite,UnitTest,ServiceMonitor,Kustomization,Test \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/866b2653a5334db9aed20ad74701e20fd464471b/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s/

      - name: Validate SPIRE runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          awk '/server.conf: \|/{found=1; next} /^---/{found=0} found {sub(/^    /, ""); print}' \
            k8s/spire/spire-server.yaml \
            | docker run --rm -i \
                --entrypoint /opt/spire/bin/spire-server \
                ghcr.io/spiffe/spire-server:1.15.2@sha256:aa74ef1be86bc8e0684007d84a4d9859d294384d842c30425048d73429f3216e \
                validate -config /dev/stdin
          awk '/agent.conf: \|/{found=1; next} /^---/{found=0} found {sub(/^    /, ""); print}' \
            k8s/spire/spire-agent.yaml \
            | docker run --rm -i \
                --entrypoint /opt/spire/bin/spire-agent \
                ghcr.io/spiffe/spire-agent:1.15.2@sha256:1d042e4040466686e0ee46f74981ff2167c86adfadca19b3835946f4d6047536 \
                validate -config /dev/stdin


  # MOD-W15-04 (audit 2026-03-23 Wave 15): Postgres migration gate.
  # Validates alembic upgrade + the supported downgrade range + upgrade on a
  # real Postgres instance. Declared data-loss boundaries are exercised
  # separately and must fail with their exact audited reason.
  db-migration-gate:
    name: DB Migration Gate (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: pre-commit-check
    env:
      UV_PYTHON: "3.14"
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: test
          # Passwordless auth is limited to this disposable job service.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: test_migration
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Resolve fail-closed migration downgrade policy
        id: migration-policy
        run: uv run python scripts/quality/migration_downgrade_policy.py plan >> "$GITHUB_OUTPUT"

      - name: Run supported migration round-trip and verify boundary
        env:
          DATABASE_URL: postgresql+asyncpg://test@localhost:5433/test_migration
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-migration-gate-only  # pragma: allowlist secret
          SAFE_DOWNGRADE_TARGET: ${{ steps.migration-policy.outputs.safe_target }}
        run: |
          echo "=== Upgrade to HEAD ==="
          uv run alembic upgrade head

          echo "=== Downgrade supported range to $SAFE_DOWNGRADE_TARGET ==="
          uv run alembic downgrade "$SAFE_DOWNGRADE_TARGET"

          echo "=== Verify declared irreversible boundary ==="
          uv run python scripts/quality/migration_downgrade_policy.py assert-boundary

          echo "=== Upgrade back to HEAD ==="
          uv run alembic upgrade head

          echo "=== Migration round-trip complete ==="

      - name: Build backend image for password preflight
        shell: bash
        run: |
          set -euo pipefail
          image_tag="local/migrate-passwords-ci:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --file backend.Dockerfile \
            --tag "$image_tag" \
            --load \
            .
          image_id="$(docker image inspect --format '{{.Id}}' "$image_tag")"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "backend image did not produce a full immutable image ID" >&2
            exit 1
          fi
          printf 'MIGPASS_BACKEND_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf 'backend_image_config_digest=%s\n' "$image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify password preflight in immutable backend image
        env:
          DATABASE_URL: postgresql+asyncpg://test@127.0.0.1:5433/test_migration
        run: uv run python scripts/quality/migrate_passwords_image_gate.py

  # MOD-W15-01 / Wave 18.1: Contract tests as a required CI gate.
  # Runs lightweight Python consumer contract tests (no Go/FFI needed).
  # The full Go provider verification continues in contract-tests.yml.
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run contract tests (consumer-side)
        # Contract coverage includes test_file_processor_contract.py (ProcessResult
        # callback schema) alongside the existing ws-hub NATS contract.
        run: |
          uv run pytest tests/contracts/ -v \
            --tb=short \
            -p no:cacheprovider \
            -k "not integration"
        env:
          PACT_DO_NOT_TRACK: "true"

  # Compare frontend MSW mocks with the authoritative OpenAPI contract.
  # This hermetic drift check remains a required PR/main-push gate.
  msw-mock-drift:
    name: MSW Mock Drift Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - pre-commit-check
      - openapi-verify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache Cargo registry
        # rust-ext is built by maturin during uv sync; cache the registry so
        # transient crates.io network faults (e.g. HTTP/2 framing errors) do
        # not cause a full build failure on every cold-cache run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-msw-${{ hashFiles('native/rust_ext/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msw-
            ${{ runner.os }}-cargo-

      - name: Install backend dependencies
        run: uv sync --frozen --no-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Generate OpenAPI spec from live FastAPI app
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: testing
        run: |
          uv run python3 - <<'PY'
          import json, pathlib
          from app.main import app
          schema_path = pathlib.Path("frontend/openapi.json")
          schema_path.write_text(
              json.dumps(app.openapi(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Normalize generated OpenAPI schema
        working-directory: frontend
        run: npm exec -- prettier --write openapi.json

      - name: Regenerate MSW mock handlers from OpenAPI spec
        working-directory: frontend
        env:
          OPENAPI_PATH: openapi.json
        run: npm run generate:api

      - name: Fail if MSW mocks are out of sync with OpenAPI spec
        run: |
          # If any generated file differs from what is committed, the
          # developer must run `npm run generate:api` locally and commit
          # the updated mock handlers.
          git diff --exit-code -- frontend/src/tests/mocks/generated/ || {
            echo "::error::MSW mock handlers are out of sync with the OpenAPI spec."
            echo "Run 'npm run generate:api' locally, review the diff, and commit."
            exit 1
          }
          echo "✅ MSW mock handlers are in sync with the OpenAPI spec."

  rust-ffi-asan:
    # Phase 3 QA — ADR-023: Run PyO3 FFI tests under AddressSanitizer + LeakSanitizer.
    # Memory errors that cross the Rust/Python boundary are invisible to Python's GC;
    # ASan instruments every allocation so these classes of bugs fail loudly at CI time.
    name: "Rust FFI - ASan / LSan"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python dependencies (with maturin)
        run: uv sync --group dev

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-asan-${{ hashFiles('native/rust_ext/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-asan-

      - name: Install LLVM tools (required for ASan runtime)
        run: |
          rustup toolchain install nightly --component rust-src --component llvm-tools --allow-downgrade --no-self-update

      - name: Run FFI tests under ASan / LSan
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite+aiosqlite:///./test_asan.db"
          UNIVERSITY_ECOSYSTEM_PYTEST_ALLOW_DATABASE_RESET: "1"
          SECRET_KEY: test-secret-key-1234567890abcdef  # pragma: allowlist secret
        run: bash scripts/run_asan_tests.sh

      - name: Upload ASan report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asan-report
          path: "asan-report.*"
          if-no-files-found: ignore

  rust-ffi-tsan:
    # Phase V: Run PyO3 FFI tests under ThreadSanitizer.
    # Data races that cross the Rust/Python FFI boundary are extremely hard to debug;
    # TSan instruments every memory access and synchronization primitive to fail loudly.
    name: "Rust FFI - TSan"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python dependencies (with maturin)
        run: uv sync --group dev

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-tsan-${{ hashFiles('native/rust_ext/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tsan-

      - name: Install LLVM tools (required for TSan runtime)
        run: |
          rustup toolchain install nightly --component rust-src --component llvm-tools --allow-downgrade --no-self-update

      - name: Run FFI tests under TSan
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite+aiosqlite:///./test_tsan.db"
          UNIVERSITY_ECOSYSTEM_PYTEST_ALLOW_DATABASE_RESET: "1"
          SECRET_KEY: test-secret-key-1234567890abcdef  # pragma: allowlist secret
        run: bash scripts/run_tsan_tests.sh

  rust-tests:
    # Testing session 9, Stream D — the first `cargo test` job in CI (the prior
    # Rust coverage came only from the ASan job + the weekly fuzz run).
    # Runs the native unit/KAT suites for all three Rust crates plus the
    # browser-parity wasm-bindgen tests for rust-crypto. Deterministic, so it is
    # BLOCKING (in the ci-success results array), unlike the advisory
    # long-running load-and-chaos jobs.
    name: "Rust - cargo test (x3 crates) + wasm-pack + coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # rust_ext is a PyO3 crate: even with --no-default-features (extension-module
        # dropped) the build links libpython, so a Python install must be present.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Rust (canonical 1.97.1 + wasm32 target + llvm-tools)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview

      # cargo-llvm-cov coverage targets are deliberately redirected to
      # runner.temp below. This keeps ordinary Cargo build caching fast without
      # restoring stale LLVM profraw files across source revisions.
      - name: Cache Cargo registry + target dirs (coverage-safe)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
            frontend/wasm-sanitizer/target/
            frontend/rust-crypto/target/
          # The v2 namespace prevents an existing cache archive that still
          # contains target/llvm-cov-target from being restored.
          key: ${{ runner.os }}-cargo-rust-tests-v2-${{ hashFiles('native/rust_ext/Cargo.toml', 'native/rust_ext/Cargo.lock', 'frontend/wasm-sanitizer/Cargo.toml', 'frontend/wasm-sanitizer/Cargo.lock', 'frontend/rust-crypto/Cargo.toml', 'frontend/rust-crypto/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-tests-v2-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # cargo-llvm-cov
        with:
          # 0.9.1 understands Cargo's build-dir v2 layout used by current
          # nightly Rust, while remaining immutable and reproducible here.
          tool: cargo-llvm-cov@0.9.1

      - name: Install nightly Rust for branch coverage
        run: rustup toolchain install nightly --component llvm-tools-preview --allow-downgrade --no-self-update

      - name: Clean Rust coverage outputs
        run: |
          set -euo pipefail
          rm -rf -- artifacts/coverage/rust/rust-native
          rm -rf -- artifacts/coverage/rust/rust-wasm-sanitizer
          rm -rf -- artifacts/coverage/rust/rust-crypto
          rm -f -- artifacts/coverage/rust/coverage-provenance.json

      - name: Create coverage output directories
        run: mkdir -p artifacts/coverage/rust/rust-native artifacts/coverage/rust/rust-wasm-sanitizer artifacts/coverage/rust/rust-crypto

      - name: rust_ext — native unit tests + coverage (--no-default-features)
        # extension-module produces undefined Python symbols in a standalone test
        # binary on Linux; drop it and point the linker/loader at setup-python's
        # libpython via sysconfig LIBDIR.
        working-directory: native/rust_ext
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-native
          NIGHTLY_CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-native-nightly
        run: |
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="${LIBDIR}:${LD_LIBRARY_PATH}"
          cargo llvm-cov clean
          cargo llvm-cov --locked --no-default-features --lib --json --output-path ../../artifacts/coverage/rust/rust-native/llvm.json
          cargo llvm-cov report --locked --codecov --output-path ../../artifacts/coverage/rust/rust-native/codecov.json
          # Nightly branch instrumentation has a different compiler/configuration
          # identity. Keep its object files and profdata in a separate target
          # tree so the stable report lifecycle cannot remove or invalidate them.
          nightly_target_dir="${NIGHTLY_CARGO_TARGET_DIR:?}"
          export CARGO_TARGET_DIR="$nightly_target_dir"
          cargo +nightly llvm-cov clean
          cargo +nightly llvm-cov --locked --no-default-features --lib --branch --json --output-path ../../artifacts/coverage/rust/rust-native/branch-llvm.json

      - name: wasm-sanitizer — native unit tests + coverage
        working-directory: frontend/wasm-sanitizer
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-wasm-sanitizer
          NIGHTLY_CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-wasm-sanitizer-nightly
        run: |
          cargo llvm-cov clean
          cargo llvm-cov --locked --lib --json --output-path ../../artifacts/coverage/rust/rust-wasm-sanitizer/llvm.json
          cargo llvm-cov report --locked --codecov --output-path ../../artifacts/coverage/rust/rust-wasm-sanitizer/codecov.json
          # Isolate nightly branch objects from the stable coverage tree.
          nightly_target_dir="${NIGHTLY_CARGO_TARGET_DIR:?}"
          export CARGO_TARGET_DIR="$nightly_target_dir"
          cargo +nightly llvm-cov clean
          cargo +nightly llvm-cov --locked --lib --branch --json --output-path ../../artifacts/coverage/rust/rust-wasm-sanitizer/branch-llvm.json

      - name: rust-crypto — native KAT tests + coverage
        working-directory: frontend/rust-crypto
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-crypto
          NIGHTLY_CARGO_TARGET_DIR: ${{ runner.temp }}/llvm-cov/rust-crypto-nightly
        # Include tests/native.rs in the coverage universe; --lib alone only
        # measures the two src/lib.rs unit tests and leaves the contract below
        # the 99/98 rust-crypto floor.
        run: |
          cargo llvm-cov clean
          cargo llvm-cov --locked --all-targets --json --output-path ../../artifacts/coverage/rust/rust-crypto/llvm.json
          cargo llvm-cov report --locked --codecov --output-path ../../artifacts/coverage/rust/rust-crypto/codecov.json
          # Isolate nightly branch objects from the stable coverage tree.
          nightly_target_dir="${NIGHTLY_CARGO_TARGET_DIR:?}"
          export CARGO_TARGET_DIR="$nightly_target_dir"
          cargo +nightly llvm-cov clean
          cargo +nightly llvm-cov --locked --all-targets --branch --json --output-path ../../artifacts/coverage/rust/rust-crypto/branch-llvm.json

      - name: Write Rust coverage provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(find artifacts/coverage/rust -name 'llvm.json' -type f | wc -l)" -eq 3
          test "$(find artifacts/coverage/rust -name 'branch-llvm.json' -type f | wc -l)" -eq 3
          while IFS= read -r report; do test -s "$report"; done < <(
            find artifacts/coverage/rust -name 'llvm.json' -type f -print
          )
          while IFS= read -r report; do test -s "$report"; done < <(
            find artifacts/coverage/rust -name 'branch-llvm.json' -type f -print
          )
          rustc_version="$(rustc --version | awk '{print $2}')"
          rustc_nightly_version="$(rustc +nightly --version | awk '{print $2}')"
          llvm_cov_version="$(cargo llvm-cov --version | awk '{print $2}')"
          python scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output artifacts/coverage/rust/coverage-provenance.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "rust-coverage-attempt-${RUN_ATTEMPT}" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "rustc=$rustc_version" \
            --tool-version "rustc-nightly=$rustc_nightly_version" \
            --tool-version "cargo-llvm-cov=$llvm_cov_version" \
            --tool-version quality-provenance=2.0.0 \
            --report "rust-native|llvm-cov-json|artifacts/coverage/rust/rust-native/llvm.json|artifacts/coverage/rust/rust-native/llvm.json" \
            --report "rust-native|llvm-cov-branch-json|artifacts/coverage/rust/rust-native/branch-llvm.json|artifacts/coverage/rust/rust-native/branch-llvm.json" \
            --report "rust-wasm-sanitizer|llvm-cov-json|artifacts/coverage/rust/rust-wasm-sanitizer/llvm.json|artifacts/coverage/rust/rust-wasm-sanitizer/llvm.json" \
            --report "rust-wasm-sanitizer|llvm-cov-branch-json|artifacts/coverage/rust/rust-wasm-sanitizer/branch-llvm.json|artifacts/coverage/rust/rust-wasm-sanitizer/branch-llvm.json" \
            --report "rust-crypto|llvm-cov-json|artifacts/coverage/rust/rust-crypto/llvm.json|artifacts/coverage/rust/rust-crypto/llvm.json" \
            --report "rust-crypto|llvm-cov-branch-json|artifacts/coverage/rust/rust-crypto/branch-llvm.json|artifacts/coverage/rust/rust-crypto/branch-llvm.json"

      - name: Upload Rust coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-attempt-${{ github.run_attempt }}
          path: |
            artifacts/coverage/rust/rust-native/llvm.json
            artifacts/coverage/rust/rust-native/branch-llvm.json
            artifacts/coverage/rust/rust-wasm-sanitizer/llvm.json
            artifacts/coverage/rust/rust-wasm-sanitizer/branch-llvm.json
            artifacts/coverage/rust/rust-crypto/llvm.json
            artifacts/coverage/rust/rust-crypto/branch-llvm.json
            artifacts/coverage/rust/coverage-provenance.json
          if-no-files-found: error

      - name: Upload Rust Codecov diagnostic artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-codecov-reports-attempt-${{ github.run_attempt }}
          path: |
            artifacts/coverage/rust/rust-native/codecov.json
            artifacts/coverage/rust/rust-wasm-sanitizer/codecov.json
            artifacts/coverage/rust/rust-crypto/codecov.json
          if-no-files-found: error

      - name: Install wasm-pack
        # rustwasm canonical curl installer (W141 polish-v2 / W142 polish-v3:
        # taiki-e/install-action hardcodes the old drager/wasm-pack repo → 404).
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: rust-crypto — browser-parity KATs (wasm-pack, headless Chrome)
        # ubuntu-24.04 preinstalls Chrome + sets CHROMEWEBDRIVER; fall back to
        # wasm-pack's auto-download if the env var is unset.
        run: |
          if command -v chromedriver >/dev/null 2>&1; then
            CHROMEDRIVER="$(command -v chromedriver)"
            export CHROMEDRIVER
          elif [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "${CHROMEWEBDRIVER}/chromedriver" ]; then
            export CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver"
          fi
          export CHROMEDRIVER_ARGS="--headless=new --no-sandbox --disable-gpu"
          wasm-pack test --headless --chrome frontend/rust-crypto

  # Prove the declared migration rollback boundary, then re-apply every
  # migration to verify the database remains upgradeable after the rollback.
  db-migration-integrity:
    name: DB Migration Rollback Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [alembic-migrations]
    env:
      UV_PYTHON: "3.14"
      SECRET_KEY: "dummy-secret-key-for-migrations-integration-test-12345678" # pragma: allowlist secret
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: migtest
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Resolve fail-closed migration downgrade policy
        id: migration-policy
        run: uv run --frozen --no-sync python scripts/quality/migration_downgrade_policy.py plan >> "$GITHUB_OUTPUT"
      - name: Apply all migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migtest # pragma: allowlist secret
        run: uv run --frozen --no-sync alembic upgrade head
      - name: Roll back the supported migration range
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migtest # pragma: allowlist secret
          SAFE_DOWNGRADE_TARGET: ${{ steps.migration-policy.outputs.safe_target }}
        run: uv run --frozen --no-sync alembic downgrade "$SAFE_DOWNGRADE_TARGET"
      - name: Verify declared irreversible migration boundary
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migtest # pragma: allowlist secret
        run: uv run --frozen --no-sync python scripts/quality/migration_downgrade_policy.py assert-boundary
      - name: Re-apply all migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migtest # pragma: allowlist secret
        run: uv run --frozen --no-sync alembic upgrade head
      - name: Run migration integrity tests
        run: uv run --frozen --no-sync pytest tests/test_migrations_integrity.py -v --tb=short

  # Advisory-only validation of the 10k WebSocket scenario definition. Running
  # that scenario requires a separately provisioned, rate-limit-adjusted stack;
  # CI must not pretend to execute a network smoke against an absent target.
  ws-stress-test:
    name: WebSocket 10k Scenario Validation (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install k6
        run: |
          set -euo pipefail
          k6_version="0.54.0"
          k6_url="https://github.com/grafana/k6/releases/download/v${k6_version}/k6-v${k6_version}-linux-amd64.tar.gz"
          k6_sha256="c7f03434854f837b6790ee81572e4b0f955241974c79a43cbb9f8d0fef069589" # pragma: allowlist secret -- release checksum
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/k6.tar.gz "$k6_url"
          echo "$k6_sha256  /tmp/k6.tar.gz" | sha256sum --check --strict
          tar xzf /tmp/k6.tar.gz -C /tmp
          sudo mv "/tmp/k6-v${k6_version}-linux-amd64/k6" /usr/local/bin/
      - name: Validate k6 script syntax
        run: |
          k6 inspect tests/performance/ws_hub_10k_test.js
          k6 inspect tests/performance/ws_hub_mvp_load_test.js

  coverage-policy-gate:
    name: Coverage & Quality Policy Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - backend-tests
      - frontend-tests
      - go-tests
      - rust-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify aggregate checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Clean aggregate coverage destinations
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- .coverage coverage.xml
          rm -rf -- artifacts/coverage/python/shards
          rm -f -- artifacts/coverage/python/coverage.json
          rm -rf -- frontend/coverage
          rm -rf -- artifacts/coverage/go/gateway
          rm -rf -- artifacts/coverage/go/ws-hub
          rm -rf -- artifacts/coverage/go/file-processor
          rm -rf -- artifacts/coverage/go/shared-inputs
          rm -rf -- artifacts/coverage/go/shared
          rm -rf -- artifacts/coverage/rust/rust-native
          rm -rf -- artifacts/coverage/rust/rust-wasm-sanitizer
          rm -rf -- artifacts/coverage/rust/rust-crypto
          rm -rf -- artifacts/coverage/provenance
          rm -rf -- artifacts/coverage/codecov
          rm -f -- artifacts/coverage/quality-manifest.json
          rm -f -- artifacts/coverage/quality-manifest.json.sha256

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Select retry-safe same-run coverage producer artifacts
        id: select_coverage_producers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m scripts.quality.select_coverage_producer_artifacts \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --consumer-run-attempt "${{ github.run_attempt }}" \
            --commit-sha "${{ github.sha }}" \
            --run-head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --event "${{ github.event_name }}" \
            --workflow-path ".github/workflows/ci.yml"

      - name: Download Python shard coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).backend_shard_0.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/python/shards
          merge-multiple: false

      - name: Download Python shard coverage data (shard 1)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).backend_shard_1.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/python/shards
          merge-multiple: false

      - name: Download Python shard coverage data (shard 2)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).backend_shard_2.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/coverage/python/shards
          merge-multiple: false

      - name: Download Python shard coverage data (shard 3)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ fromJSON(steps.select_coverage_producers.outputs.selections).backend_shard_3.artifact_id }}
