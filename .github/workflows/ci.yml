          }


          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()


          def identity():
              tested = os.environ["EXPECTED_TESTED_SHA"]
              source = os.environ["SOURCE_HEAD_SHA"]
              if any(re.fullmatch(r"[0-9a-f]{40}", value) is None for value in (tested, source)):
                  raise SystemExit("Invalid immutable source identity")
              if git("rev-parse", "HEAD") != tested:
                  raise SystemExit("Checkout differs from expected tested commit")
              if os.environ["WORKFLOW_EVENT"] == "pull_request":
                  parents = [
                      line.split()[1]
                      for line in git("cat-file", "-p", "HEAD").split("\n\n", 1)[0].splitlines()
                      if line.startswith("parent ")
                  ]
                  if len(parents) != 2 or parents[1] != source:
                      raise SystemExit("Tested merge does not have the expected source parent")
              elif source != tested:
                  raise SystemExit("Push source differs from tested commit")
              if subprocess.call(["git", "diff", "--quiet", "--no-ext-diff", "HEAD", "--"]):
                  raise SystemExit("Tracked checkout changed during evidence collection")
              blobs = {}
              for path in PATHS:
                  blob = git("rev-parse", f"HEAD:{path}")
                  if git("hash-object", "--", path) != blob:
                      raise SystemExit("Evidence source file differs from its Git blob")
                  blobs[path] = blob
              return {
                  "source_head_sha": source,
                  "tested_commit_sha": tested,
                  "tested_tree_sha": git("rev-parse", "HEAD^{tree}"),
                  "workflow_sha": os.environ["WORKFLOW_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "blobs": blobs,
              }


          root = Path(sys.argv[1])
          current = identity()
          if sys.argv[2] == "before":
              (root / "source.json").write_text(json.dumps(current, sort_keys=True))
              print("Scoped audit source identity: " + json.dumps(current, sort_keys=True))
          else:
              if current != json.loads((root / "source.json").read_text()):
                  raise SystemExit("Source identity changed during the cohort")
              report = root / "junit.xml"
              if not report.is_file() or not 0 < report.stat().st_size <= 1_048_576:
                  raise SystemExit("Missing or oversized Scoped audit JUnit report")
              document = ElementTree.parse(report)
              suites = list(document.getroot().iter("testsuite"))
              totals = {"tests": "41", "failures": "0", "errors": "0", "skipped": "0"}
              if len(suites) != 1 or any(suites[0].get(key) != value for key, value in totals.items()):
                  raise SystemExit("Scoped audit JUnit totals are not exactly forty-one passes")
              cases = list(document.getroot().iter("testcase"))
              observed = [(case.get("classname"), case.get("name")) for case in cases]
              if len(observed) != 41 or set(observed) != EXPECTED:
                  raise SystemExit("Scoped audit JUnit identities are missing, extra or duplicated")
              if any(list(document.getroot().iter(tag)) for tag in ("failure", "error", "skipped")):
                  raise SystemExit("Scoped audit cohort contains failure, error or skip")
              print("Scoped audit verified named PASS: " + json.dumps(sorted(observed)))
              print("Scoped audit postflight source identity unchanged")
