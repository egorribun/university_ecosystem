# CI Pipeline - Refactored to use Reusable Workflows
name: "CI - Matrix Expansion"

# MOD-20-03 (audit 2026-03-24): Keep push-triggered CI limited to protected
# delivery branches (main, develop, and release/*); pull requests retain their
# required matrix regardless of source branch. Path-level filtering is done
# within individual jobs below.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    # Keep the required gate runnable when a draft PR is promoted to ready.
    # GitHub's default pull_request activity types omit ready_for_review.
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege defaults — individual jobs extend as needed.
# Prevents Poisoned Pipeline Execution (PPE) from fork PRs (OWASP CI/CD C-PPE-1).
permissions: read-all

concurrency:
  # Required PR runs share an admission group per PR so a newer commit cancels
  # stale work for that PR without evicting another PR's required run, while
  # pushes to protected branches retain independent per-ref isolation. The
  # advisory nightly workflow deliberately uses a separate
  # group because GitHub retains only one pending run per group and does not
  # provide priority ordering between workflow events.
  # This is a workflow-scoped per-PR admission/cancellation guard, not an
  # account-wide runner-pool semaphore or a reduction of logical matrix size
  # and per-lane max-parallel contracts. Other workflows have independent
  # concurrency groups and remain subject to the repository/host runner pool.
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('quality-heavy-pr-{0}', github.event.pull_request.number)
      || format('ci-matrix-{0}', github.ref) }}
  # Preserve stale-run cancellation for required PRs and protected-branch
  # pushes without allowing an advisory run to evict a required pending run.
  cancel-in-progress: true

env:
  # RZ-14-06 (audit 2026-03-18): keep the workflow-wide environment free of
  # credentials. Jobs that need a signing key generate an ephemeral value in
  # their own process; no PR-controlled checkout can inherit a repository
  # secret through this global scope.
  SECRET_KEY: ""
  ENVIRONMENT: testing

jobs:
  ci-diagnostic:
    name: CI Diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # CI-03 (audit Wave 10)
    steps:
      - name: System Check
        run: |
          echo "CI Workflow Detected"
          echo "Ref: ${GITHUB_REF}"
          echo "Head Ref: ${GITHUB_HEAD_REF}"
          echo "Event: ${GITHUB_EVENT_NAME}"

  # The ordinary pre-commit sequence used to serialize its two slowest hooks
  # (detect-secrets and mypy) ahead of every test and release qualification job.
  # Keep every hook blocking, but let a quick, read-only subset open the CI
  # fan-out while the slow security/type subset remains an independently
  # required final dependency.  The two jobs use disjoint cache namespaces:
  # cache contents are hook environments only, never quality evidence.
  pre-commit-check:
    name: Pre-commit & Linting (Read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    permissions:
      contents: read
    # Hook config and local hook entrypoints are supplied by the PR checkout.
    # Do not expose the workflow-level test secret to this unprivileged job.
    env:
      SECRET_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for lock check
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Verify uv.lock is up to date (MOD-W5-03)
        # MOD-03 (audit Wave 12): explicit error annotation in GitHub Actions UI panel.
        # `uv lock --check` already exits non-zero on mismatch; the `|| (... && exit 1)`
        # addition surfaces the error in the Checks summary, not just the raw log.
        # Note: uv.lock is generated for the project's Python version (3.14).
        run: |
          uv lock --check || (echo "::error::uv.lock is out of sync — run 'uv lock' locally and commit the updated lockfile" && exit 1)

      - name: Restore fast pre-commit environments
        # Keep the cache keyed by the immutable hook configuration, exact
        # runner closure, and interpreter location. It holds installed hook
        # toolchains only; current repository files are always checked from
        # this fresh checkout.
        # GitHub scopes caches by branch; these prefixes are CI-only and must
        # never be consumed by a privileged workflow_dispatch/workflow_run job.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-fast-v2-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      - name: Install hash-verified pre-commit runner
        # Export only the isolated runner closure: a full `uv run --frozen`
        # would synchronize the complete application environment. Hash-verified
        # pip installation prevents a substituted package from running hooks.
        run: |
          set -euo pipefail
          requirements_file="$RUNNER_TEMP/ci-precommit.requirements.txt"
          uv export --frozen \
            --only-group ci-precommit-runner \
            --no-emit-project \
            --no-emit-workspace \
            --format requirements-txt \
            -o "$requirements_file"
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --force-reinstall \
            -r "$requirements_file"
          test "$(pre-commit --version)" = "pre-commit 4.6.2"

      - name: Run fast pre-commit hooks
        env:
          # CodeQL supplies blocking hosted SAST under ADR-047 Q4.
          # The Docker-backed Semgrep hook remains mandatory locally;
          # CI skips that local hook to keep the quality fan-out bounded.
          SKIP: semgrep-docker
        run: |
          set -euo pipefail
          failed=0
          pre-commit run ruff --all-files --show-diff-on-failure || failed=1
          pre-commit run ruff-format --all-files --show-diff-on-failure || failed=1
          pre-commit run gitleaks --all-files --show-diff-on-failure || failed=1
          pre-commit run bandit --all-files --show-diff-on-failure || failed=1
          pre-commit run enforce-secret-strength --all-files --show-diff-on-failure || failed=1
          pre-commit run no-python2-except --all-files --show-diff-on-failure || failed=1
          pre-commit run actionlint --all-files --show-diff-on-failure || failed=1
          pre-commit run renovate-config-validator --all-files --show-diff-on-failure || failed=1
          exit "$failed"

  pre-commit-security-and-types:
    name: Pre-commit Security & Types (Read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    # This sibling has the same read-only trust boundary as the former single
    # pre-commit job. Starting it independently overlaps its slow scans with
    # the fast gate; ci-success still requires both results and accepts only
    # success. It has no dependencies, so use the default condition: GitHub
    # can cancel it promptly when a newer commit supersedes this attempt.
    permissions:
      contents: read
    # detect-secrets and mypy execute the PR checkout's hook configuration.
    # Keep the workflow-level test secret out of that untrusted execution.
    env:
      SECRET_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for pre-commit security hooks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Restore security/type pre-commit environments
        # Separate from the fast group so concurrent jobs cannot race to write
        # a shared cache key. Key the exact runner closure too. The cache is
        # only third-party hook environments; every scan consumes current
        # checkout files and reports fresh results.
        # This CI-only prefix must never be restored by privileged workflows.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-security-types-v2-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      - name: Install hash-verified pre-commit runner
        # Match the fast sibling exactly: only the isolated runner closure is
        # installed, and the runtime assertion rejects an unexpected executable
        # before detect-secrets or mypy can execute.
        run: |
          set -euo pipefail
          requirements_file="$RUNNER_TEMP/ci-precommit.requirements.txt"
          uv export --frozen \
            --only-group ci-precommit-runner \
            --no-emit-project \
            --no-emit-workspace \
            --format requirements-txt \
            -o "$requirements_file"
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --force-reinstall \
            -r "$requirements_file"
          test "$(pre-commit --version)" = "pre-commit 4.6.2"

      - name: Run security and type pre-commit hooks
        env:
          SKIP: semgrep-docker
        run: |
          set -euo pipefail
          failed=0
          # detect-secrets and mypy have disjoint outputs: the former only
          # canonicalizes .secrets.baseline under its lock, while the latter
          # writes the isolated .mypy_cache. Run both in parallel to remove
          # their serial ~4-minute tail without dropping either blocking gate.
          pre-commit run detect-secrets --all-files --show-diff-on-failure &
          detect_secrets_pid=$!
          pre-commit run mypy --all-files --show-diff-on-failure &
          mypy_pid=$!
          wait "$detect_secrets_pid" || failed=1
          wait "$mypy_pid" || failed=1
          exit "$failed"

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CI secret key if not configured (RZ-14-06)
        # RZ-14-06: the workflow-wide key is intentionally empty for every
        # event; generate an ephemeral 32-byte value only in this job.
        if: env.SECRET_KEY == ''
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$secret"
          printf 'SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"
      - name: Enforce Rate Limit Shim Deadline (TD-003)
        run: |
          count=$(git grep "from app.core import rate_limit" app/ | wc -l || echo "0")
          if [ "$count" -gt 15 ]; then
            echo "::error::Too many legacy rate_limit imports ($count). Baseline is 15. Do not add new ones."
            exit 1
          fi
          echo "Found $count legacy imports."
      - name: Enforce Dishka Migration Deadline (TD-004)
        # TD-4 (audit 2026-03-05): Fail if new files appear in app/deps/ to prevent
        # regression. The baseline at audit time is 12 files. New features MUST use
        # Dishka (FromDishka[]) instead of the legacy Depends() container.
        run: |
          BASELINE=12
          COUNT=$(find app/deps -name "*.py" ! -name "__init__.py" | wc -l)
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::New Depends() files detected in app/deps/ ($COUNT > baseline $BASELINE). Add new services as Dishka providers in app/core/di_provider.py instead."
            exit 1
          fi
          echo "OK: $COUNT legacy deps files (baseline: $BASELINE)"
      - name: Enforce no-pickle gate (RED-01 RZ-W13)
        # RED-01 (audit Wave 13): pickle.loads/dumps enables RCE if the data
        # source (Redis, DB) is ever compromised.  Pydantic JSON serialization
        # is the safe replacement.  This gate prevents future re-introduction.
        shell: bash
        run: |
          python scripts/quality/check_no_pickle.py app/

      - name: "Enforce Python 3 except tuple syntax (RZ-25-01 / MOD-27-01)"
        # MOD-27-01: Fixed regex — previous `grep -v 'except ('` accidentally
        # filtered valid matches, allowing 44 violations to pass the gate.
        # Now anchored to line start, requires trailing colon, no filter pipes.
        shell: bash
        run: |
          result=$(grep -rn --include='*.py' -P '^\s*except\s+[A-Za-z_][\w.]*\s*,\s*[A-Za-z_][\w.]*\s*[,:]' app/ tests/ || true)
          if [ -n "$result" ]; then
            echo "::error::Python 2 except syntax detected (MOD-27-01). Use tuple form: except (A, B):"
            echo "$result"
            echo "Found $(echo "$result" | wc -l) violations"
            exit 1
          fi
          echo "OK: no Python 2 except syntax found"

      - name: "MOD-30-01: Enforce lazy=noload on SQLAlchemy relationships"
        run: |
          python3 - <<'PY'
          import ast
          import io
          import pathlib
          import re
          import sys
          import tokenize

          def dotted_name(node):
              if isinstance(node, ast.Name):
                  return node.id
              if isinstance(node, ast.Attribute):
                  parent = dotted_name(node.value)
                  return f'{parent}.{node.attr}' if parent else None
              return None

          def is_relationship_function(expression, names, modules):
              if isinstance(expression, ast.Name) and expression.id in names:
                  return True
              name = dotted_name(expression)
              return name is not None and any(
                  name == f'{module}.relationship' for module in modules
              )

          def is_relationship_module(expression, modules):
              return dotted_name(expression) in modules

          def references_relationship(expression, names, modules):
              for child in ast.walk(expression):
                  if is_relationship_function(child, names, modules):
                      return True
              return False

          def assignment_targets(target):
              if isinstance(target, ast.Name):
                  return (target.id,)
              return ()

          def add_static_aliases(tree, names, modules):
              assignments = []
              for item in ast.walk(tree):
                  if isinstance(item, ast.Assign):
                      assignments.extend(
                          (name, item.value)
                          for target in item.targets
                          for name in assignment_targets(target)
                      )
                  elif isinstance(item, ast.AnnAssign) and item.value is not None:
                      assignments.extend(
                          (name, item.value) for name in assignment_targets(item.target)
                      )
              changed = True
              while changed:
                  changed = False
                  for name, value in assignments:
                      if is_relationship_module(value, modules) and name not in modules:
                          modules.add(name)
                          changed = True
                      elif (
                          references_relationship(value, names, modules)
                          and name not in names
                      ):
                          names.add(name)
                          changed = True

          def has_exemption(call, lazy_keyword, comments, relationship_calls):
              allowed_lines = {call.end_lineno, lazy_keyword.end_lineno}
              for token in comments:
                  line = token.start[0]
                  if line not in allowed_lines or not re.match(
                      r'#\s*noload-exempt:\s*\S', token.string
                  ):
                      continue
                  calls_on_line = [
                      candidate
                      for candidate in relationship_calls
                      if candidate.lineno <= line <= candidate.end_lineno
                  ]
                  if len(calls_on_line) == 1 and calls_on_line[0] is call:
                      return True
              return False

          models = pathlib.Path('app/models')
          if not models.is_dir():
              print('::error::app/models directory is missing (MOD-30-01)')
              sys.exit(2)
          violations = []
          for path in sorted(models.rglob('*.py')):
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source, filename=str(path))
              relationship_names = {'relationship'}
              relationship_modules = set()
              for item in ast.walk(tree):
                  if isinstance(item, ast.ImportFrom):
                      if item.module == 'sqlalchemy.orm':
                          relationship_names.update(
                              alias.asname or alias.name
                              for alias in item.names
                              if alias.name == 'relationship'
                          )
                      elif item.module == 'sqlalchemy':
                          relationship_modules.update(
                              alias.asname or alias.name
                              for alias in item.names
                              if alias.name == 'orm'
                          )
                  elif isinstance(item, ast.Import):
                      for alias in item.names:
                          if alias.name == 'sqlalchemy.orm':
                              relationship_modules.add(alias.asname or alias.name)
                          elif alias.name == 'sqlalchemy':
                              relationship_modules.add(
                                  f'{alias.asname or alias.name}.orm'
                              )
              add_static_aliases(tree, relationship_names, relationship_modules)
              comments = [
                  token
                  for token in tokenize.generate_tokens(io.StringIO(source).readline)
                  if token.type == tokenize.COMMENT
              ]
              relationship_calls = [
                  item
                  for item in ast.walk(tree)
                  if isinstance(item, ast.Call)
                  and is_relationship_function(
                      item.func, relationship_names, relationship_modules
                  )
              ]
              for item in relationship_calls:
                  lazy_keyword = next(
                      (keyword for keyword in item.keywords if keyword.arg == 'lazy'),
                      None,
                  )
                  lazy = lazy_keyword.value if lazy_keyword is not None else None
                  if isinstance(lazy, ast.Constant) and lazy.value == 'noload':
                      continue
                  if lazy_keyword is not None and has_exemption(
                      item, lazy_keyword, comments, relationship_calls
                  ):
                      continue
                  if lazy_keyword is None:
                      reason = 'missing an explicit lazy= argument'
                  else:
                      reason = (
                          'lazy= must be literal "noload" or use a unique inline '#
                          'noload-exempt reason'
                      )
                  violations.append(f'{path}:{item.lineno}: {reason}')

          if violations:
              print('::error::Invalid SQLAlchemy relationship lazy policy (MOD-30-01):')
              print('\n'.join(violations))
              print('All relationships MUST use lazy="noload".')
              print('Exceptions require explicit lazy= and a unique inline exemption reason.')
              sys.exit(1)
          print(
              'OK: all SQLAlchemy relationships use lazy="noload" or a documented '
              'exemption'
          )
          PY
      - name: Validate docker compose configuration
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          # imgproxy signing is mandatory in Compose; deterministic low-entropy
          # values are sufficient for config rendering and are never deployed.
          $env:IMGPROXY_KEY = [string]::new('0', 64)
          $env:IMGPROXY_SALT = [string]::new('1', 64)
          docker compose -f docker-compose.yml config
          # Also validate the merged load-and-chaos stack (base + infra + go +
          # CI override). WS_HUB_INTERNAL_SECRET is referenced by the fragment.
          $env:WS_HUB_INTERNAL_SECRET = "dummy-ci-validate-secret"  # pragma: allowlist secret
          docker compose -f docker-compose.yml -f docker-compose.infra.yml -f docker-compose.go.yml -f docker-compose.ci-loadtest.yml config | Out-Null

  actionlint:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go for source-pinned actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: Install and Run actionlint
        run: |
          set -euo pipefail
          actionlint_source_sha="5dc52e8daa4ef51bfd76a648128474bd41d65df0"
          actionlint_archive_sha256="908edaee62f6afa5c53b4773c91333043e17f4a1f315f8f5e311a63de0c122ba"
          actionlint_archive="$RUNNER_TEMP/actionlint-source.tar.gz"
          actionlint_source_dir="$RUNNER_TEMP/actionlint-source"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$actionlint_archive" \
            "https://api.github.com/repos/rhysd/actionlint/tarball/${actionlint_source_sha}"
          printf '%s  %s\n' "$actionlint_archive_sha256" "$actionlint_archive" \
            | sha256sum --check --strict
          mkdir "$actionlint_source_dir"
          tar --extract --gzip --file "$actionlint_archive" \
            --directory "$actionlint_source_dir" --strip-components=1
          cd "$actionlint_source_dir"
          test "$(go env GOVERSION)" = "go1.26.10"
          go build -buildvcs=false -trimpath \
            -ldflags "-X github.com/rhysd/actionlint.version=${actionlint_source_sha}" \
            -o "$RUNNER_TEMP/actionlint" ./cmd/actionlint
          version_output="$("$RUNNER_TEMP/actionlint" -version)"
          printf '%s\n' "$version_output"
          printf '%s\n' "$version_output" | grep -Fqx "$actionlint_source_sha"
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color -shellcheck ""


  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Hadolint
        run: |
          set -euo pipefail
          hadolint_version="2.15.1"
          hadolint_sha256="c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
          hadolint_path="$RUNNER_TEMP/hadolint"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$hadolint_path" \
            "https://github.com/hadolint/hadolint/releases/download/v${hadolint_version}/hadolint-linux-x86_64"
          printf '%s  %s\n' "$hadolint_sha256" "$hadolint_path" \
            | sha256sum --check --strict
          chmod +x "$hadolint_path"
          find . -type f \( -name "*Dockerfile*" -o -name "Dockerfile*" \) ! -name "*.dockerignore" ! -path "*/node_modules/*" ! -path "*/.venv/*" -exec "$hadolint_path" --config .hadolint.yaml {} +

  shellcheck:
    name: ShellCheck Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: |
          set -euo pipefail
          shellcheck_version="0.11.0"
          shellcheck_sha256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          shellcheck_archive="$RUNNER_TEMP/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$shellcheck_sha256" "$shellcheck_archive" \
            | sha256sum --check --strict
          tar --extract --file "$shellcheck_archive" --directory "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/shellcheck-v${shellcheck_version}/shellcheck"
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          shellcheck_bin="$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck"
          test -x "$shellcheck_bin"
          find scripts/ -type f -name "*.sh" -exec "$shellcheck_bin" -e SC2086 -e SC2001 -e SC2030 -e SC2031 {} +

  graphql-drift-check:
    name: GraphQL Schema Drift Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Generate current GraphQL Schema
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "dummy-key-for-graphql-generation"  # pragma: allowlist secret
          ENVIRONMENT: testing
        run: |
          uv run python -c "
          from app.graphql.schema import schema
          import pathlib
          pathlib.Path('schema.graphql').write_text(str(schema))
          "
      - name: Check drift against main branch
        run: |
          git fetch origin main
          git show origin/main:schema.graphql > /tmp/schema_main.graphql || touch /tmp/schema_main.graphql
          if [ -s /tmp/schema_main.graphql ]; then
            diff -u /tmp/schema_main.graphql schema.graphql || {
              echo "::error::GraphQL schema has changed! If this is intended, update schema.graphql on main or add the schema.graphql changes to this PR."
              exit 1
            }
          else
            echo "No schema.graphql found on main to compare against."
          fi

  quality:
    name: Code Spell & Markdown Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !.agents/skills/**
            !.venv/**
      - name: Run cspell
        id: cspell
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          config: "cspell.json"
          use_cspell_files: true
          incremental_files_only: false
      - name: Verify cspell checked reviewed docs
        env:
          CSPELL_FILES_CHECKED: ${{ steps.cspell.outputs.number_of_files_checked }}
        run: |
          if [[ "$CSPELL_FILES_CHECKED" != "9" ]]; then
            echo "::error::CSpell checked $CSPELL_FILES_CHECKED files; expected 9 reviewed English docs"
            exit 1
          fi

  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up Rust (canonical 1.99.0)
        # Same compiler as the WASM producer (reusable-e2e-wasm-build.yml);
        # a floating channel would lint and measure different code paths.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Cache Cargo registry + target dirs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
            frontend/wasm-sanitizer/target/
            frontend/rust-crypto/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('native/rust_ext/Cargo.toml', 'frontend/wasm-sanitizer/Cargo.toml', 'frontend/rust-crypto/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
      - name: Check Formatting (rustfmt)
        run: |
          cargo fmt --all --manifest-path native/rust_ext/Cargo.toml -- --check
          cargo fmt --all --manifest-path frontend/wasm-sanitizer/Cargo.toml -- --check
          cargo fmt --all --manifest-path frontend/rust-crypto/Cargo.toml -- --check
      - name: Run Clippy (static analysis)
        run: |
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="${LIBDIR}:${LD_LIBRARY_PATH}"
          cargo clippy --manifest-path native/rust_ext/Cargo.toml --all-targets --no-default-features --locked -- -D warnings
          cargo clippy --manifest-path frontend/wasm-sanitizer/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path frontend/rust-crypto/Cargo.toml --all-targets --locked -- -D warnings

      - name: Install cargo-udeps
        run: |
          set -euo pipefail
          rustup toolchain install nightly
          binstall_script_commit="5aafaaca52423a22d83a812fa3ca77492e2895db"
          binstall_script_sha256="d3a93702160e0ec03e2a4e996855db1f01adee801fb84a43add24e0877ef8eae"
          binstall_script_url="https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${binstall_script_commit}/install-from-binstall-release.sh"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            "${binstall_script_url}" --output /tmp/install-binstall.sh
          printf '%s  %s\n' "${binstall_script_sha256}" /tmp/install-binstall.sh \
            | sha256sum --check --strict
          sh /tmp/install-binstall.sh
          cargo binstall -y cargo-udeps@0.1.61

      - name: Run cargo-udeps (unused dependencies check)
        run: |
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="${LIBDIR}:${LD_LIBRARY_PATH}"
          cargo +nightly udeps --manifest-path native/rust_ext/Cargo.toml --all-targets --no-default-features --locked
          cargo +nightly udeps --manifest-path frontend/wasm-sanitizer/Cargo.toml --all-targets --locked
          cargo +nightly udeps --manifest-path frontend/rust-crypto/Cargo.toml --all-targets --locked


  backend-tests:
    name: "Backend Tests (${{ matrix.name }})"
    strategy:
      fail-fast: false
      # Reusable backend calls expand into unit and (for selected legs)
      # integration jobs.  Keep two callers active so the PR matrix cannot
      # consume the entire hosted-runner pool while preserving all four legs.
      max-parallel: 2
      matrix:
        include:
          - python-version: "3.14"
            name: "Python 3.14-shard-0"
            shard: 0
            run-integration: true
          - python-version: "3.14"
            name: "Python 3.14-shard-1"
            shard: 1
            run-integration: false
          - python-version: "3.14"
            name: "Python 3.14-shard-2"
            shard: 2
            run-integration: false
          - python-version: "3.14"
            name: "Python 3.14-shard-3"
            shard: 3
            run-integration: false
            free-threading: false
    needs: pre-commit-check
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-backend-tests.yml
    with:
      test-group-name: "All-${{ matrix.name }}"
      test-pattern: "tests/"
      integration-test-pattern: "tests/integration/"
      python-version: ${{ matrix.python-version }}
      # A shard sees only part of the suite, so it cannot enforce the global
      # percentage in isolation. coverage-policy-gate combines all four shard
      # files with the DB migration coverage artifact and enforces exact 100%.
      coverage-threshold: 0
      run-integration-tests: ${{ matrix.run-integration }}
      parallel-workers: 0 # LOW-W19: 0 = auto-detect workers via pytest-xdist (-n auto)
      shard-id: ${{ matrix.shard }}
      num-shards: 4
      python-gil: ${{ matrix.free-threading && '0' || '1' }}  # MOD-24-03
  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      # P0-02 (audit 2026-03-06): SHA-pinned — tag-only refs are mutable and vulnerable
      # to supply chain attacks via tag mutation (OWASP CI/CD C-PPE-1).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$secret"
          printf 'SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run mypy
        run: uv run mypy

      - name: Enforce Mypy override budget
        run: |
          uv run python scripts/check_mypy_budget.py
          uv run python scripts/check_mypy_overrides_budget.py

      # Declared runtime dependencies must match what app/ imports; every
      # exception is justified in pyproject.toml [tool.deptry].
      - name: Check runtime dependency hygiene
        run: uv run deptry app

  go-tests:
    name: Go Tests (${{ matrix.service }})
    strategy:
      # Keep every service leg running so one failure cannot mask diagnostics
      # from the remaining modules.
      fail-fast: false
      # Each reusable call expands into test and lint jobs. Two callers keep
      # the required Go matrix bounded while leaving capacity for integration.
      max-parallel: 2
      matrix:
        # Every supported Go module has exact statement coverage. Integration
        # semantics remain a separate required gate below.
        include:
          - service: services/gateway
            coverage-threshold: 100
            coverage-component: go-gateway
            coverage-canonical-path: artifacts/coverage/go/gateway/coverage.out
          - service: services/file-processor
            coverage-threshold: 100
            coverage-component: go-file-processor
            coverage-canonical-path: artifacts/coverage/go/file-processor/coverage.out
          - service: services/ws-hub
            coverage-threshold: 100
            coverage-component: go-ws-hub
            coverage-canonical-path: artifacts/coverage/go/ws-hub/coverage.out
          - service: services/cmd/uni-cli
            coverage-threshold: 100
            coverage-component: go-shared-fragment
            coverage-canonical-path: artifacts/coverage/go/shared-inputs/uni-cli/coverage.out
          - service: services/pkg/logging
            coverage-threshold: 100
            coverage-component: go-shared-fragment
            coverage-canonical-path: artifacts/coverage/go/shared-inputs/logging/coverage.out
          - service: services/pkg/spiffe
            coverage-threshold: 100
            coverage-component: go-shared-fragment
            coverage-canonical-path: artifacts/coverage/go/shared-inputs/spiffe/coverage.out
          - service: services/pkg/spicedb
            coverage-threshold: 100
            coverage-component: go-shared-fragment
            coverage-canonical-path: artifacts/coverage/go/shared-inputs/spicedb/coverage.out
    needs: pre-commit-check
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-go-tests.yml
    with:
      service-directory: ${{ matrix.service }}
      go-version: "1.26.10"
      coverage-threshold: ${{ matrix.coverage-threshold }}
      coverage-component: ${{ matrix.coverage-component }}
      coverage-canonical-path: ${{ matrix.coverage-canonical-path }}

  # MOD-W15-06 (audit 2026-03-23 Wave 15): Go fuzz testing for ws-hub message parsing.
  # Bounded fuzz smoke — finds quick panics and crashes without an unbounded
  # worker lifetime.
  # Crashes are stored in testdata/fuzz/ and replayed on subsequent runs automatically.
  go-fuzz:
    name: Go Fuzz Tests (ws-hub)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Go 1.27.3 contains the upstream fix for golang/go#75804.  Pin the
          # patched toolchain so the bounded fuzz smoke cannot report a false
          # context-deadline failure during normal deadline shutdown.
          go-version: "1.27.3"
          cache-dependency-path: services/ws-hub/go.sum

      - name: Run fuzz tests (bounded smoke)
        run: |
          cd services/ws-hub
          # Serialize fuzz workers to bound runner memory. Go 1.27.3 contains
          # the upstream fix for golang/go#75804, so the full bounded smoke
          # budget is retained without masking or ignoring failures.
          go test ./pkg/hub/ -fuzz=FuzzParseMessage -fuzztime=20s -parallel=1 -timeout=3m
          go test ./pkg/hub/ -fuzz=FuzzExtractAlgFromHeader -fuzztime=20s -parallel=1 -timeout=3m

      - name: Upload fuzz corpus on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-corpus
          path: services/ws-hub/testdata/fuzz/
          retention-days: 30

  # ADR-022: required Go integration tests against real testcontainers-go
  # containers. Each service runs independently for precise diagnostics.
  go-integration-ws-hub:
    name: Go Integration Tests (ws-hub)
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-go-integration-tests.yml
    with:
      service-directory: services/ws-hub
      go-version: "1.26.10"

  go-integration-file-processor:
    name: Go Integration Tests (file-processor)
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-go-integration-tests.yml
    with:
      service-directory: services/file-processor
      go-version: "1.26.10"

  go-integration-gateway:
    name: Go Integration Tests (gateway)
    needs: pre-commit-check
    uses: ./.github/workflows/reusable-go-integration-tests.yml
    with:
      service-directory: services/gateway
      go-version: "1.26.10"

  frontend-tests:
    name: Frontend Tests
    needs:
      - e2e-wasm-build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-frontend-tests.yml
    with:
      node-version: "24"
      run-lighthouse: false
      wasm-artifact-id: ${{ needs.e2e-wasm-build.outputs.artifact_id }}
      wasm-artifact-name: ${{ needs.e2e-wasm-build.outputs.artifact_name }}
      wasm-artifact-digest: ${{ needs.e2e-wasm-build.outputs.artifact_digest }}

  # Build the generated WASM packages once for all frontend and Playwright
  # jobs. Consumers bind the server-issued artifact outputs to this run.
  e2e-wasm-build:
    name: E2E WASM Build
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-e2e-wasm-build.yml

  # Keep dependency and static security analysis blocking for every PR and
  # main push. Results remain a direct prerequisite of the CI Success gate.
  security-audit:
    name: Security Audit
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-security-audit.yml
    with:
      python-version: "3.14"
      node-version: "24.21.0"

  # MOD-21-04 (audit 2026-03-25 Wave 21): Generate Software Bill of Materials
  # for supply chain security compliance (CycloneDX/SPDX).  Uploads as a build
  # artifact so downstream tools (Dependabot, Grype, etc.) can consume it.
  sbom-generate:
    name: SBOM Generation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: pre-commit-check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # MOD-22-04 (audit 2026-03-25 Wave 22): SLSA provenance dry-run.
  # Validates that SLSA provenance tooling (slsa-verifier) is available
  # and the configuration is valid.  Does NOT publish attestations —
  # that is handled by the release workflow.
  provenance-check:
    name: SLSA Provenance Dry-Run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: pre-commit-check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install slsa-verifier
        run: |
          set -euo pipefail
          slsa_verifier_version="2.7.1"
          slsa_verifier_url="https://github.com/slsa-framework/slsa-verifier/releases/download/v${slsa_verifier_version}/slsa-verifier-linux-amd64"
          slsa_verifier_sha256="946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339" #  -- release checksum
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/slsa-verifier "$slsa_verifier_url"
          echo "$slsa_verifier_sha256  /tmp/slsa-verifier" | sha256sum --check --strict
          chmod +x /tmp/slsa-verifier

      - name: Verify slsa-verifier is functional
        run: |
          /tmp/slsa-verifier version
          echo "SLSA verifier is available and functional."

      - name: Validate provenance config exists
        run: |
          # Check that the repo has the expected CI structure for provenance.
          if [ ! -f ".github/workflows/ci.yml" ]; then
            echo "::error::CI workflow not found — provenance generation requires ci.yml"
            exit 1
          fi
          echo "Provenance configuration validated."

  alembic-migrations:
    name: Alembic Migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # MOD-NEW-008 (audit 2026-03-19): Integrate Squawk to automatically lint
      # Alembic migrations. Blocks destructive statements (DROP COLUMN, ALTER TYPE)
      # ensuring Zero-Downtime Deployment (ZDD) compatibility.
      - name: Download and verify Squawk Linter
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS:-}" != "Linux" || "${RUNNER_ARCH:-}" != "X64" ]]; then
            echo "::error::Squawk v2.67.0 asset is supported only on Linux x64" >&2
            exit 1
          fi
          if [[ "$(/usr/bin/uname -s)" != "Linux" || "$(/usr/bin/uname -m)" != "x86_64" ]]; then
            echo "::error::Runner platform does not match the Squawk v2.67.0 Linux x64 asset" >&2
            exit 1
          fi
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* ]]; then
            echo "::error::RUNNER_TEMP must be an absolute path" >&2
            exit 1
          fi

          expected_sha256="03efe0e666b63bf33e2493693ee0aa9dbed07cbdcd20f7a8292245c1da9d790a"
          asset_url="https://github.com/sbdchd/squawk/releases/download/v2.67.0/squawk-linux-x64"
          if [[ ! "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Pinned Squawk SHA-256 is malformed" >&2
            exit 1
          fi

          download_dir="$RUNNER_TEMP/university-ecosystem-tools/squawk/v2.67.0/linux-x64"
          binary_path="$download_dir/squawk-linux-x64"
          partial_path="$binary_path.partial"
          if [[ -e "$download_dir" || -L "$download_dir" ]]; then
            echo "::error::Refusing to reuse an existing Squawk download directory" >&2
            exit 1
          fi
          /usr/bin/mkdir --parents -- "$download_dir"
          /usr/bin/curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-redirs 5 --output "$partial_path" "$asset_url"
          if [[ ! -f "$partial_path" || -L "$partial_path" || ! -s "$partial_path" ]]; then
            echo "::error::Squawk release asset is missing or is not a regular nonempty file" >&2
            exit 1
          fi
          printf '%s  %s\n' "$expected_sha256" "$partial_path" |
            /usr/bin/sha256sum --check --strict
          /usr/bin/chmod 0755 -- "$partial_path"
          /usr/bin/mv -- "$partial_path" "$binary_path"
          if [[ ! -f "$binary_path" || -L "$binary_path" || ! -x "$binary_path" ]]; then
            echo "::error::Downloaded Squawk asset is missing or is not executable" >&2
            exit 1
          fi
          printf '%s  %s\n' "$expected_sha256" "$binary_path" |
            /usr/bin/sha256sum --check --strict

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$secret"
          printf 'SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        shell: pwsh
        run: |
          uv sync --frozen

      - name: Lint Postgres Migrations (Squawk)
        id: migration-squawk
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
          AUD148_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          squawk_binary_path="${RUNNER_TEMP:?RUNNER_TEMP is required}/university-ecosystem-tools/squawk/v2.67.0/linux-x64/squawk-linux-x64"
          expected_sha256="03efe0e666b63bf33e2493693ee0aa9dbed07cbdcd20f7a8292245c1da9d790a"
          if [[ ! -f "$squawk_binary_path" || -L "$squawk_binary_path" || ! -x "$squawk_binary_path" ]]; then
            echo "::error::Verified Squawk executable is missing or is not executable" >&2
            exit 1
          fi
          printf '%s  %s\n' "$expected_sha256" "$squawk_binary_path" |
            /usr/bin/sha256sum --check --strict
          echo "Linting changed Alembic migrations for ZDD safety..."
          base_sha="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base_sha" ]; then base_sha="HEAD~1"; fi
          changed_files="$(git diff --name-only "$base_sha"...HEAD -- 'alembic/versions/*.py')"
          if [ -z "$changed_files" ]; then
            echo "No changed migrations; baseline migrations are covered by the immutable history gate."
            exit 0
          fi
          # AUD-208: lint the DDL each changed revision executes against a live
          # PostgreSQL scratch database. Offline --sql has no inspector, so drop
          # guards render nothing; index, foreign-key and timeout rules stay enabled.
          sql_dir="$(mktemp -d)"
          squawk_args=(
            --exclude prefer-robust-stmts --exclude prefer-text-field
            --exclude prefer-bigint-over-int --exclude prefer-identity
            --exclude prefer-timestamp-tz --exclude disallowed-unique-constraint
            --exclude require-enum-value-ordering
          )
          while IFS= read -r migration; do
            [ -z "$migration" ] && continue
            read -r revision down_revision < <(
              uv run python scripts/quality/read_alembic_revision.py "$migration"
            )
            echo "Checking $migration ($down_revision -> $revision)"
            sql_file="$sql_dir/$revision.sql"
            uv run python -m scripts.quality.render_live_alembic_sql "$migration" "$sql_file"
            printf '%s  %s\n' "$expected_sha256" "$squawk_binary_path" |
              /usr/bin/sha256sum --check --strict
            if [[ "$migration" == "alembic/versions/148642dd1207_fix_missing_tables.py" ]]; then
              [[ "$revision" == "148642dd1207" && "$down_revision" == "f7aa476e968a" ]] || {
                echo "::error::AUD148 ordinary capture: revision metadata mismatch" >&2
                exit 1
              }
              git diff --quiet HEAD -- \
                alembic/versions/148642dd1207_fix_missing_tables.py \
                alembic/env.py alembic.ini \
                scripts/quality/render_live_alembic_sql.py \
                scripts/quality/read_alembic_revision.py \
                .github/workflows/ci.yml .squawk.toml pyproject.toml uv.lock
              AUD148_CHECKOUT_SHA="$(git rev-parse HEAD)"
              AUD148_SQUAWK_BINARY_SHA256="$(/usr/bin/sha256sum -- "$squawk_binary_path" | /usr/bin/cut -d ' ' -f 1)"
              AUD148_SQUAWK_VERSION="$("$squawk_binary_path" --version)"
              export AUD148_CHECKOUT_SHA AUD148_SQUAWK_VERSION AUD148_SQUAWK_BINARY_SHA256
              uv run python - "$sql_file" "${squawk_args[@]}" <<'AUD148_ORDINARY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          from scripts.quality.read_alembic_revision import (
              RevisionMetadataError,
              read_revision_metadata,
          )


          def fail(reason):
              raise SystemExit("AUD148 ordinary capture: " + reason)


          def regular_file(path):
              absolute = path.absolute()
              if any(part.is_symlink() for part in (absolute, *absolute.parents)):
                  fail("symlink input is forbidden")
              if not absolute.is_file():
                  fail("input must be a regular file")
              return absolute


          def git_blob(path):
              data = regular_file(Path(path)).read_bytes()
              header = b"blob " + str(len(data)).encode("ascii") + b"\0"
              return hashlib.sha1(header + data, usedforsecurity=False).hexdigest()


          def capture():
              sql_path = Path(sys.argv[1])
              physical_sql = regular_file(sql_path)
              if not 0 < physical_sql.stat().st_size <= 65536:
                  fail("SQL input exceeds its byte limit or is empty")
              with physical_sql.open("rb") as source:
                  sql_bytes = source.read(65537)
              if not 0 < len(sql_bytes) <= 65536:
                  fail("SQL input exceeds its byte limit or is empty")
              sql_text = sql_bytes.decode("utf-8")
              for name in ("SECRET_KEY", "DATABASE_URL"):
                  value = os.environ.get(name, "")
                  if value and value in sql_text:
                      fail("SQL input contains private runtime context")

              checkout = os.environ.get("AUD148_CHECKOUT_SHA", "")
              workflow = os.environ.get("GITHUB_SHA", "")
              pr_head = os.environ.get("AUD148_PR_HEAD_SHA", "")
              if not re.fullmatch(r"[0-9a-f]{40}", checkout) or checkout != workflow:
                  fail("checkout provenance is invalid")
              if pr_head and not re.fullmatch(r"[0-9a-f]{40}", pr_head):
                  fail("pull request provenance is invalid")
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
              if not all(re.fullmatch(r"[1-9][0-9]{0,19}", value) for value in (run_id, attempt)):
                  fail("workflow run provenance is invalid")
              if os.environ.get("GITHUB_JOB") != "alembic-migrations":
                  fail("producer job is invalid")
              version = os.environ.get("AUD148_SQUAWK_VERSION", "")
              digest = os.environ.get("AUD148_SQUAWK_BINARY_SHA256", "")
              if version != "squawk 2.67.0" or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  fail("verified scanner provenance is invalid")

              migration_path = "alembic/versions/148642dd1207_fix_missing_tables.py"
              source_paths = (
                  migration_path,
                  "alembic/env.py",
                  "alembic.ini",
                  "scripts/quality/render_live_alembic_sql.py",
                  "scripts/quality/read_alembic_revision.py",
                  ".github/workflows/ci.yml",
                  ".squawk.toml",
                  "pyproject.toml",
                  "uv.lock",
              )
              source_blobs = {name: git_blob(name) for name in source_paths}
              revision, parent = read_revision_metadata(regular_file(Path(migration_path)))
              if (revision, parent) != ("148642dd1207", "f7aa476e968a"):
                  fail("migration metadata is invalid")
              metadata = {
                  "status": "diagnostic-only-not-an-exception",
                  "scenario": "ordinary-parent-live",
                  "checkout_sha": checkout,
                  "workflow_sha": workflow,
                  "pr_head_sha": pr_head or None,
                  "workflow_run_id": run_id,
                  "workflow_run_attempt": attempt,
                  "producer_job": "alembic-migrations",
                  "migration_path": migration_path,
                  "revision": revision,
                  "down_revision": parent,
                  "source_blobs": source_blobs,
                  "squawk_version": version,
                  "squawk_binary_sha256": digest,
                  "squawk_args": sys.argv[2:],
                  "sql_file": str(sql_path),
                  "sql_bytes": len(sql_bytes),
                  "sql_sha256": hashlib.sha256(sql_bytes).hexdigest(),
                  "sql": sql_text,
                  "scanner_result": "not-yet-executed",
              }
              rendered = json.dumps(metadata, ensure_ascii=True, sort_keys=True, indent=2)
              output = (
                  "AUD148_ORDINARY_CAPTURE_BEGIN\n"
                  + rendered
                  + "\nAUD148_ORDINARY_CAPTURE_END\n"
              )
              if len(output.encode("utf-8")) > 131072:
                  fail("log payload exceeds its output byte limit")
              return output


          try:
              output = capture()
          except (OSError, UnicodeError, RevisionMetadataError):
              fail("input could not be read or decoded")
          sys.stdout.write(output)
          AUD148_ORDINARY
            fi
            "$squawk_binary_path" "${squawk_args[@]}" "$sql_file"
          done <<< "$changed_files"

      - name: Collect bounded 148642dd1207 DDL evidence
        id: migration-ddl-evidence
        if: >-
          ${{ !cancelled() &&
              (steps.migration-squawk.outcome == 'success' ||
               steps.migration-squawk.outcome == 'failure') }}
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          RUN_INTEGRATION_TESTS: "1"
          ORIGINAL_SQUAWK_OUTCOME: ${{ steps.migration-squawk.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          print_bounded() {
            local file="$1" limit="$2" bytes
            bytes="$(wc -c < "$file")"
            head -c "$limit" "$file"
            if [ "$bytes" -gt "$limit" ]; then
              echo "::error::AUD148 diagnostic output exceeded $limit bytes"
              return 1
            fi
          }
          test_log="$(mktemp)"
          trace_root=".pytest_tmp/aud148-expanded"
          mkdir -p "$(dirname "$trace_root")"
          pytest_status=0
          # Artifact discovery reads physical files; normal capture bounds setup logs.
          uv run pytest -q --tb=short \
            tests/test_migration_148642dd1207_trace.py \
            tests/test_migration_148642dd1207_diagnostic_ci.py \
            tests/test_migration_148642dd1207_safety.py \
            tests/integration/test_migration_148642dd1207.py::test_expanded_ddl_inventory_matches_unmodified_populated_control \
            tests/integration/test_migration_148642dd1207.py::test_convertible_orphan_rolls_back_cutover_and_diagnostic_rows \
            tests/integration/test_migration_148642dd1207.py::test_existing_exact_shadow_check_is_reused_from_real_pg_catalog \
            tests/integration/test_migration_148642dd1207.py::test_existing_shadow_check_rejects_wrong_real_pg_catalog_identity \
            tests/integration/test_migration_148642dd1207.py::test_stale_shadow_value_aborts_before_fk_capture_with_exact_rollback \
            tests/integration/test_migration_148642dd1207.py::test_shadow_cutover_omits_only_transient_validation_after_null_backfill \
            tests/integration/test_migration_148642dd1207.py::test_groups_cutover_uses_only_the_exact_primary_key_index \
            tests/integration/test_migration_148642dd1207.py::test_groups_index_drop_uses_fresh_locked_dependency \
            tests/integration/test_migration_148642dd1207.py::test_groups_index_cutover_failure_restores_exact_catalog_and_data \
            tests/integration/test_migration_148642dd1207.py::test_groups_key_helper_round_trip_restores_legacy_index_and_foreign_keys \
            tests/integration/test_migration_148642dd1207.py::test_groups_successors_do_not_require_the_duplicate_id_index \
            tests/integration/test_migration_148642dd1207.py::test_invalid_fk_value_aborts_shadow_conversion_without_data_loss \
            tests/integration/test_migration_148642dd1207.py::test_upgrade_copies_spotify_state_and_skips_empty_legacy_rows \
            tests/integration/test_migration_148642dd1207.py::test_upgrade_copies_available_fields_from_a_partial_legacy_schema \
            tests/integration/test_migration_148642dd1207.py::test_upgrade_does_not_overwrite_existing_spotify_integration_rows \
            tests/integration/test_migration_148642dd1207.py::test_upgrade_preserves_legacy_user_preferences \
            tests/integration/test_migration_148642dd1207.py::test_upgrade_backfills_missing_preferences_without_overwriting_existing_rows \
            tests/integration/test_migration_148642dd1207.py::test_null_legacy_enabled_aborts_upgrade_without_losing_preferences \
            --basetemp="$trace_root" > "$test_log" 2>&1 || pytest_status=$?
          echo "AUD148_FOCUSED_TESTS_BEGIN"
          if ! print_bounded "$test_log" 131072; then
            [ "$pytest_status" -ne 0 ] || pytest_status=1
          fi
          echo "AUD148_FOCUSED_TESTS_END"
          if [ "$pytest_status" -ne 0 ]; then exit "$pytest_status"; fi
          artifact_paths="$(mktemp)"
          uv run python - "$trace_root" "$artifact_paths" <<'SELECT_AUD148'
          import sys
          from pathlib import Path

          def fail_walk(error):
              raise error


          root = Path(sys.argv[1])
          names = ("148642dd1207.expanded.sql", "148642dd1207.trace.json")
          matches = {name: [] for name in names}
          for directory, _, filenames in root.walk(on_error=fail_walk, follow_symlinks=False):
              for name in names:
                  path = directory / name
                  if name in filenames and path.is_file() and not path.is_symlink():
                      matches[name].append(path)
          if any(len(matches[name]) != 1 for name in names):
              raise SystemExit("AUD148 expected exactly one physical SQL/evidence pair")
          sql_path, evidence_path = (matches[name][0] for name in names)
          if sql_path.parent != evidence_path.parent:
              raise SystemExit("AUD148 SQL and JSON are not from the same test")
          Path(sys.argv[2]).write_bytes(
              b"\0".join(str(path).encode() for path in (sql_path, evidence_path)) + b"\0"
          )
          SELECT_AUD148
          mapfile -d '' -t evidence_files < "$artifact_paths"
          sql_file="${evidence_files[0]}"
          json_file="${evidence_files[1]}"
          squawk_binary_path="${RUNNER_TEMP:?RUNNER_TEMP is required}/university-ecosystem-tools/squawk/v2.67.0/linux-x64/squawk-linux-x64"
          expected_sha256="03efe0e666b63bf33e2493693ee0aa9dbed07cbdcd20f7a8292245c1da9d790a"
          if [[ ! -f "$squawk_binary_path" || -L "$squawk_binary_path" || ! -x "$squawk_binary_path" ]]; then
            echo "::error::Verified Squawk executable is missing or is not executable" >&2
            exit 1
          fi
          printf '%s  %s\n' "$expected_sha256" "$squawk_binary_path" |
            /usr/bin/sha256sum --check --strict
          AUD148_CHECKOUT_SHA="$(git rev-parse HEAD)"
          AUD148_SQUAWK_BINARY_SHA256="$(/usr/bin/sha256sum -- "$squawk_binary_path" | /usr/bin/cut -d ' ' -f 1)"
          AUD148_SQUAWK_VERSION="$("$squawk_binary_path" --version)"
          export AUD148_CHECKOUT_SHA AUD148_SQUAWK_VERSION AUD148_SQUAWK_BINARY_SHA256
          squawk_args=(
            --exclude prefer-robust-stmts --exclude prefer-text-field
            --exclude prefer-bigint-over-int --exclude prefer-identity
            --exclude prefer-timestamp-tz --exclude disallowed-unique-constraint
            --exclude require-enum-value-ordering
          )
          uv run python - "$sql_file" "$json_file" "${squawk_args[@]}" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          sql_path, evidence_path = map(Path, sys.argv[1:3])
          if sql_path.stat().st_size > 65536 or evidence_path.stat().st_size > 4194304:
              raise SystemExit("AUD148 evidence exceeds its input byte limit")
          sql_bytes = sql_path.read_bytes()
          sql_text = sql_bytes.decode("utf-8")
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          if evidence["status"] != "diagnostic-only-not-an-exception":
              raise SystemExit("AUD148 evidence is not diagnostic-only")
          if not sql_text.startswith("-- DIAGNOSTIC ONLY:"):
              raise SystemExit("AUD148 expanded SQL is missing its diagnostic label")
          if hashlib.sha256(sql_bytes).hexdigest() != evidence["expanded_sql_sha256"]:
              raise SystemExit("AUD148 expanded SQL digest mismatch")

          def git_blob(path):
              data = Path(path).read_bytes()
              header = b"blob " + str(len(data)).encode("ascii") + b"\0"
              return hashlib.sha1(header + data, usedforsecurity=False).hexdigest()

          migration_path = "alembic/versions/148642dd1207_fix_missing_tables.py"
          if git_blob(migration_path) != evidence["migration_blob"]:
              raise SystemExit("AUD148 migration source mismatch")
          for key, path in (
              ("helper_sha256", "tests/helpers/migration_148642dd1207_trace.py"),
              ("fixture_sha256", "tests/integration/test_migration_148642dd1207.py"),
          ):
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != evidence[key]:
                  raise SystemExit("AUD148 diagnostic source mismatch")
          nested = evidence["nested_ddl"]
          if not isinstance(nested, list) or not 1 <= len(nested) <= 100:
              raise SystemExit("AUD148 nested inventory is not finite")
          records = []
          for entry in nested:
              statement = entry["sql"]
              digest = hashlib.sha256(statement.encode("utf-8")).hexdigest()
              if not statement.startswith("ALTER TABLE ") or digest != entry["sql_sha256"]:
                  raise SystemExit("AUD148 nested DDL identity mismatch")
              keys = ("outer_ordinal", "site", "sql", "sql_sha256")
              records.append({key: entry[key] for key in keys})
          version = os.environ["AUD148_SQUAWK_VERSION"]
          if "2.67.0" not in version.split() or len(version) > 128:
              raise SystemExit("AUD148 requires the existing Squawk 2.67.0 binary")
          metadata = {
              "status": evidence["status"],
              "checkout_sha": os.environ["AUD148_CHECKOUT_SHA"],
              "workflow_sha": evidence["workflow_sha"],
              "workflow_run_id": evidence["workflow_run_id"],
              "original_squawk_outcome": os.environ["ORIGINAL_SQUAWK_OUTCOME"],
              "migration_blob": evidence["migration_blob"],
              "helper_sha256": evidence["helper_sha256"],
              "fixture_sha256": evidence["fixture_sha256"],
              "workflow_blob": git_blob(".github/workflows/ci.yml"),
              "renderer_blob": git_blob("scripts/quality/render_live_alembic_sql.py"),
              "squawk_config_blob": git_blob(".squawk.toml"),
              "lockfile_blob": git_blob("uv.lock"),
              "postgres_version": evidence["postgres_version"],
              "squawk_version": version,
              "squawk_binary_sha256": os.environ["AUD148_SQUAWK_BINARY_SHA256"],
              "squawk_args": sys.argv[3:],
              "expanded_sql_sha256": evidence["expanded_sql_sha256"],
              "nested_ddl": records,
          }
          rendered = json.dumps(metadata, sort_keys=True, indent=2)
          if len(rendered.encode("utf-8")) + len(sql_bytes) > 131072:
              raise SystemExit("AUD148 log payload exceeds its output byte limit")
          print("AUD148_DIAGNOSTIC_METADATA_BEGIN")
          print(rendered)
          print("AUD148_DIAGNOSTIC_METADATA_END")
          print("AUD148_EXPANDED_SQL_BEGIN")
          print(sql_text, end="" if sql_text.endswith("\n") else "\n")
          print("AUD148_EXPANDED_SQL_END")
          PY
          lint_log="$(mktemp)"
          lint_status=0
          printf '%s  %s\n' "$expected_sha256" "$squawk_binary_path" |
            /usr/bin/sha256sum --check --strict
          "$squawk_binary_path" "${squawk_args[@]}" "$sql_file" > "$lint_log" 2>&1 || lint_status=$?
          echo "AUD148_EXPANDED_SQUAWK_BEGIN"
          if ! print_bounded "$lint_log" 131072; then
            [ "$lint_status" -ne 0 ] || lint_status=1
          fi
          echo "AUD148_EXPANDED_SQUAWK_END"
          echo "AUD148_EXPANDED_SQUAWK_EXIT=$lint_status"
          exit "$lint_status"

      - name: Verify owned PostgreSQL tenant-context acceptance
        id: tenant-context-evidence
        if: >-
          ${{ !cancelled() &&
              (steps.migration-squawk.outcome == 'success' ||
               steps.migration-squawk.outcome == 'failure') }}
        timeout-minutes: 3
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          RUN_INTEGRATION_TESTS: "1"
        shell: bash
        run: |
          set -euo pipefail
          probe_root="$(mktemp -d)"
          trap 'rm -rf -- "$probe_root"' EXIT
          test_log="$probe_root/pytest.log"
          pytest_status=0
          uv run pytest -v --tb=short --show-capture=no --no-cov --maxfail=0 \
            tests/integration/test_aud197_198_notification_outbox_postgres.py::test_content_outbox_restores_tenant_scope \
            tests/integration/test_aud197_198_notification_outbox_postgres.py::test_legacy_null_tenant_content_ignores_worker_ambient_scope \
            tests/test_outbox_tenant_context.py \
            tests/integration/test_aud197_198_notification_outbox_postgres.py::test_unscoped_missing_content_retains_retry_and_dlq_evidence \
            tests/test_event_handlers_behavior_closure.py::test_created_notification_handler_skips_deleted_source_record \
            tests/test_event_handlers_behavior_closure.py::test_comment_notification_fails_closed_when_news_or_author_disappears \
            tests/test_event_handlers_behavior_closure.py::test_comment_notification_skips_deleted_comment_before_loading_sources \
            tests/test_event_handlers_behavior_closure.py::test_created_notification_handler_retries_unscoped_missing_source \
            tests/test_event_handlers_behavior_closure.py::test_comment_notification_retries_unscoped_missing_protected_parent \
            tests/integration/test_aud197_198_notification_outbox_postgres.py::test_grade_committed_assignment_delivery_replay_sends_once \
            tests/integration/test_aud197_198_notification_outbox_postgres.py::test_grade_rollback_then_fresh_retry_sends_only_after_commit \
            --basetemp="$probe_root/basetemp" > "$test_log" 2>&1 || pytest_status=$?
          echo "OWNED_TENANT_CONTEXT_TESTS_BEGIN"
          bytes="$(wc -c < "$test_log")"
          head -c 131072 "$test_log"
          if [ "$bytes" -gt 131072 ]; then
            echo "::error::Owned tenant-context diagnostic output exceeded 131072 bytes"
            [ "$pytest_status" -ne 0 ] || pytest_status=1
          fi
          echo "OWNED_TENANT_CONTEXT_TESTS_END"
          exit "$pytest_status"

      - name: Wait for PostgreSQL
        shell: pwsh
        run: |
          $timeout = 30
          $elapsed = 0
          do {
            if (pg_isready -h localhost -p 5432 -U test) {
              return
            }
            Start-Sleep -Seconds 1
            $elapsed++
          } while ($elapsed -lt $timeout)
          throw "PostgreSQL was not ready in $timeout seconds"

      - name: Create database tables
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        shell: bash
        run: |
          uv run python3 <<'PY'
          import asyncio
          from app.core.database import Base, engine

          async def create_tables():
              async with engine.begin() as conn:
                  from sqlalchemy import text
                  await conn.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
                  await conn.run_sync(Base.metadata.create_all)

          asyncio.run(create_tables())
          PY

      - name: Resolve fail-closed migration downgrade policy
        id: migration-policy
        run: uv run python scripts/quality/migration_downgrade_policy.py plan >> "$GITHUB_OUTPUT"

      - name: Run Alembic upgrade and supported downgrade
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
          SAFE_DOWNGRADE_TARGET: ${{ steps.migration-policy.outputs.safe_target }}
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini downgrade "$SAFE_DOWNGRADE_TARGET"
          uv run python scripts/quality/migration_downgrade_policy.py assert-boundary
          uv run alembic -c alembic.ini upgrade head

      # MOD-22-05 (audit 2026-03-25 Wave 22): Assert exactly 1 migration head.
      # Multiple heads indicate an un-merged migration branch — alembic upgrade
      # will fail in production.  This gate catches the issue before merge.
      - name: Check single migration head (MOD-22-05)
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        shell: bash
        run: |
          set -euo pipefail
          heads="$(uv run alembic heads)"
          HEAD_COUNT="$(awk 'NF { count++ } END { print count + 0 }' <<< "$heads")"
          echo "Alembic heads: $HEAD_COUNT"
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic head but found $HEAD_COUNT. Merge the migration branches before merging this PR."
            uv run alembic heads
            exit 1
          fi

      - name: Check Alembic schema drift (MOD-14-03)
        # RZ-14-05 (audit 2026-03-23): alembic check exits 1 if the ORM models
        # diverge from the live schema — catches missing length constraints,
        # new columns not backed by migrations, and type mismatches.
        # Runs after upgrade head so the schema is at the latest revision.
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: testing
        shell: pwsh
        run: |
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini check || {
            echo "::error::Alembic schema drift detected — ORM models diverge from migration history. Run 'alembic revision --autogenerate' to inspect the diff."
            exit 1
          }

  openapi-verify:
    name: Verify OpenAPI Types
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$secret"
          printf 'SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache Cargo registry
        # rust-ext is built by maturin during uv sync; cache the registry so
        # transient crates.io network faults (e.g. HTTP/2 framing errors) do
        # not cause a full build failure on every cold-cache run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-openapi-${{ hashFiles('native/rust_ext/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-openapi-
            ${{ runner.os }}-cargo-

      - name: Install backend dependencies
        shell: pwsh
        run: |
          uv sync --frozen --no-dev

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Generate OpenAPI schema
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        shell: bash
        run: |
          uv run python3 - <<'PY'
          import json
          import pathlib
          from app.main import app

          schema_path = pathlib.Path("frontend/openapi.json")
          schema_path.write_text(
              json.dumps(app.openapi(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Normalize generated OpenAPI schema
        working-directory: frontend
        run: npm exec -- prettier --write openapi.json

      - name: Generate API types
        working-directory: frontend
        env:
          OPENAPI_PATH: frontend/openapi.json
        run: npm run generate:api

      - name: Verify generated API types are up to date
        shell: pwsh
        run: |
          git diff --exit-code -- `
            frontend/openapi.json `
            frontend/src/api/generated/ `
            frontend/src/tests/mocks/generated/
          if ($LASTEXITCODE -ne 0) {
            echo "::error::Generated OpenAPI, TypeScript SDK, or MSW mocks are not up to date. Run 'npm run generate:api'."
            exit 1
          }

  verify-runtime-reqs:
    name: Verify Runtime Requirements
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # CI-03 (audit Wave 10)
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$secret"
          printf 'SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ensure pyproject.toml excludes test-only packages from main dependencies
        shell: bash
        run: |
          uv run python - <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          banned = {
              "pytest",
              "pytest-asyncio",
              "pytest-cov",
              "pre-commit",
              "fakeredis",
              "asgi-lifespan",
          }

          pyproject_path = pathlib.Path("pyproject.toml")
          with open(pyproject_path, "rb") as f:
              data = tomllib.load(f)

          dependencies = data.get("project", {}).get("dependencies", [])
          violations: list[str] = []
          for entry in dependencies:
              name = re.split(r"[<=>!\[\]]", entry, 1)[0].strip().lower()
              if name in banned:
                  violations.append(entry)

          if violations:
              print("::error::test/development packages found in [project].dependencies in pyproject.toml:")
              for entry in violations:
                  print(f"  - {entry}")
              sys.exit(1)

          print("Project dependencies look clean.")
          PY

  docker-security-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: pre-commit-check
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image for scanning
        # LOW-W19: root Dockerfile does not exist; backend image uses backend.Dockerfile
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t "university-ecosystem/backend:${IMAGE_TAG}" -f backend.Dockerfile .

      - name: Run Trivy vulnerability scanner
        id: trivy_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Prefer the canonical GHCR database. The public mirror can be
          # transiently unavailable from GitHub-hosted runners; changing the
          # source does not alter severity policy or the fail-closed gate.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          version: v0.75.0
          image-ref: university-ecosystem/backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          # Match the pre-category configuration key used by main. The
          # reusable audit has a separate job key for filesystem/config scans.
          category: ".github/workflows/ci.yml:docker-security-scan"

  docker-security-scan-additional:
    name: "Trivy Image Scan - ${{ matrix.image_name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: pre-commit-check
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - image_name: frontend
            file: frontend.Dockerfile
            context: .
            category: trivy-image-frontend
          - image_name: gateway
            file: services/gateway/Dockerfile
            context: .
            category: trivy-image-gateway
          - image_name: ws-hub
            file: services/ws-hub/Dockerfile
            context: .
            category: trivy-image-ws-hub
          - image_name: file-processor
            file: services/file-processor/Dockerfile
            context: .
            category: trivy-image-file-processor
          - image_name: caddy
            file: services/caddy/Dockerfile
            context: services/caddy
            category: trivy-image-caddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local runtime image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          platforms: linux/amd64
          tags: "university-ecosystem/${{ matrix.image_name }}:${{ github.sha }}"
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            ${{ matrix.image_name == 'frontend' && format('VITE_APP_RELEASE={0}', github.sha) || '' }}
            ${{ matrix.image_name == 'frontend' && 'VITE_ENABLE_WEB_VITALS=false' || '' }}
            ${{ matrix.image_name == 'frontend' && 'VITE_CWV_TRUSTED_RUM=false' || '' }}
            ${{ matrix.image_name == 'frontend' && 'VITE_WEB_VITALS_ENDPOINT=/api/v1/cwv' || '' }}
          cache-from: type=gha,scope=university-${{ matrix.image_name }}
          cache-to: type=gha,scope=university-${{ matrix.image_name }},mode=max
          provenance: false
          sbom: false

      - name: Verify fixed Caddy Brotli package offline
        if: matrix.image_name == 'caddy'
        timeout-minutes: 1
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          container_name="caddy-package-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'timeout --kill-after=2s 5s docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=5s 30s docker run --rm --interactive --pull=never \
            --name "$container_name" --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/sh "university-ecosystem/caddy:${IMAGE_TAG}" -eu <<'CADDY_PACKAGE_PROOF'
              release="$(cat /etc/alpine-release)"
              case "$release" in
                3.23.*) ;;
                *) echo "Unexpected Caddy Alpine release: $release" >&2; exit 1 ;;
              esac
              printf "Caddy Alpine release: %s\n" "$release"
              cat /etc/apk/repositories
              apk --no-network --verbose info --exists "brotli-libs=1.2.1-r0"
          CADDY_PACKAGE_PROOF

      - name: Run Trivy vulnerability scanner
        id: trivy_scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          version: v0.75.0
          image-ref: "university-ecosystem/${{ matrix.image_name }}:${{ github.sha }}"
          format: sarif
          output: "trivy-${{ matrix.image_name }}.sarif"
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image_name)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: "trivy-${{ matrix.image_name }}.sarif"
          category: ${{ matrix.category }}

      - name: Summarize Trivy vulnerability metadata
        if: always() && steps.trivy_scan.outcome == 'failure' && hashFiles(format('trivy-{0}.sarif', matrix.image_name)) != ''
        env:
          SARIF_PATH: "trivy-${{ matrix.image_name }}.sarif"
        shell: bash
        run: python3 scripts/quality/report_trivy_metadata.py "$SARIF_PATH"

      - name: Upload Trivy SARIF diagnostic artifact
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image_name)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-${{ matrix.image_name }}-sarif
          path: trivy-${{ matrix.image_name }}.sarif
          retention-days: 14
          if-no-files-found: error


  # MOD-W15-03 (audit 2026-03-23 Wave 15): Helm lint + kubeconform validation.
  # Catches broken Helm templates and K8s manifest schema violations before deploy.
  helm-validate:
    name: Helm Lint & Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: pre-commit-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "4.2.4"

      - name: Helm dependency build
        shell: bash
        run: |
          python3 scripts/ci/helm_dependency_build.py \
            charts/university-ecosystem \
            redis-0.1.0.tgz nats-2.15.0.tgz

      - name: Helm lint — university-ecosystem chart
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm lint charts/university-ecosystem/ --strict \
            --set-string global.environment=development \
            --set-string global.imageTag="${IMAGE_TAG}" \
            --set applicationSecrets.existingSecret=ci-application-secrets

      - name: Helm template — dry-run
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm template university-ecosystem charts/university-ecosystem/ \
            --set-string global.environment=development \
            --set applicationSecrets.existingSecret=ci-application-secrets \
            --set global.imageTag="${IMAGE_TAG}" \
            > /tmp/backend-manifests.yaml
          echo "Helm template rendered successfully ($(wc -l < /tmp/backend-manifests.yaml) lines)"

      - name: Install kubeconform
        run: |
          set -euo pipefail
          kubeconform_version="0.8.0"
          kubeconform_url="https://github.com/yannh/kubeconform/releases/download/v${kubeconform_version}/kubeconform-linux-amd64.tar.gz"
          kubeconform_sha256="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883" #  -- release checksum
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/kubeconform.tar.gz "$kubeconform_url"
          echo "$kubeconform_sha256  /tmp/kubeconform.tar.gz" | sha256sum --check --strict
          tar xf /tmp/kubeconform.tar.gz -C /tmp
          chmod +x /tmp/kubeconform

      - name: Validate manifests with kubeconform
        run: |
          /tmp/kubeconform -strict -summary \
            -skip NetworkChaos,PodChaos,HTTPChaos,ClusterPolicy,ScaledObject,ExternalSecret,SecretStore,ClusterSecretStore,PrometheusRule,TriggerAuthentication,ServiceMonitor,Kustomization,Test \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/866b2653a5334db9aed20ad74701e20fd464471b/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/backend-manifests.yaml

      - name: Validate static K8s manifests with kubeconform
        run: |
          /tmp/kubeconform -strict -summary \
            -ignore-filename-pattern 'secrets-example\.yaml' \
            -ignore-filename-pattern '.*bad.*' \
            -ignore-filename-pattern '.*kyverno.*' \
            -ignore-filename-pattern '.*flags\.json' \
            -ignore-filename-pattern '.*kustomization\.yaml' \
            -skip NetworkChaos,PodChaos,HTTPChaos,ClusterPolicy,ScaledObject,ExternalSecret,SecretStore,ClusterSecretStore,PrometheusRule,TriggerAuthentication,TestSuite,UnitTest,ServiceMonitor,Kustomization,Test \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/866b2653a5334db9aed20ad74701e20fd464471b/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s/

      - name: Validate SPIRE runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          awk '/server.conf: \|/{found=1; next} /^---/{found=0} found {sub(/^    /, ""); print}' \
            k8s/spire/spire-server.yaml \
            | docker run --rm -i \
                --entrypoint /opt/spire/bin/spire-server \
                ghcr.io/spiffe/spire-server:1.15.3@sha256:4082f30d3e0ddc4000a171392c4ea174345ee44d161ee917c70b97b2ecfba141 \
                validate -config /dev/stdin
          awk '/agent.conf: \|/{found=1; next} /^---/{found=0} found {sub(/^    /, ""); print}' \
            k8s/spire/spire-agent.yaml \
            | docker run --rm -i \
                --entrypoint /opt/spire/bin/spire-agent \
                ghcr.io/spiffe/spire-agent:1.15.3@sha256:41b0dcd8b258a69db9e2768292a060766fb76fd866e4bc925849981ea1b825ff \
                validate -config /dev/stdin


  # MOD-W15-04 (audit 2026-03-23 Wave 15): Postgres migration gate.
  # Validates alembic upgrade + the supported downgrade range + upgrade on a
  # real Postgres instance. The same execution supplies raw Alembic coverage
  # for the canonical Tier-0 aggregate. Declared data-loss boundaries are
  # exercised separately and must fail with their exact audited reason.
  db-migration-gate:
    name: DB Migration Gate (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: pre-commit-check
    env:
      UV_PYTHON: "3.14"
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: test
          # Passwordless auth is limited to this disposable job service.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: test_migration
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Resolve fail-closed migration downgrade policy
        id: migration-policy
        run: uv run python scripts/quality/migration_downgrade_policy.py plan >> "$GITHUB_OUTPUT"

      - name: Run supported migration round-trip and verify boundary
        env:
          DATABASE_URL: postgresql+asyncpg://test@localhost:5433/test_migration
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-migration-gate-only
          SAFE_DOWNGRADE_TARGET: ${{ steps.migration-policy.outputs.safe_target }}
        run: |
          rm -f -- .coverage.migration
          echo "=== Upgrade to HEAD ==="
          uv run coverage run --data-file=.coverage.migration \
            --source=alembic/versions -m alembic upgrade head

          echo "=== Downgrade supported range to $SAFE_DOWNGRADE_TARGET ==="
          uv run coverage run --append --data-file=.coverage.migration \
            --source=alembic/versions -m alembic downgrade "$SAFE_DOWNGRADE_TARGET"

          echo "=== Verify declared irreversible boundary ==="
          uv run python scripts/quality/migration_downgrade_policy.py assert-boundary

          echo "=== Upgrade back to HEAD ==="
          uv run coverage run --append --data-file=.coverage.migration \
            --source=alembic/versions -m alembic upgrade head

          echo "=== Migration round-trip complete ==="

      - name: Append focused migration tests to coverage
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-migration-gate-only
          RUN_INTEGRATION_TESTS: "1"
        run: |
          uv run coverage run --append --data-file=.coverage.migration \
            --source=alembic/versions -m pytest \
            tests/test_touched_tier0_migration_contracts.py \
            tests/test_reconcile_schema_drift_migration.py \
            tests/test_legacy_migration_guard_contracts.py \
            tests/test_aud350_reconcile_migration_coverage.py \
            tests/integration/test_aud038_default_partition_redistribution_postgres.py \
            tests/integration/test_historical_migration_semantics_postgres.py \
            tests/integration/test_aud226_partitioning_generated_ids_postgres.py \
            --tb=short

      - name: Append AUD-350 PostgreSQL timestamp counterfactual to migration coverage
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          AUD350_POSTGRES_DATABASE_URL: postgresql+psycopg://test@127.0.0.1:5433/test_migration
          RUN_INTEGRATION_TESTS: "1"
        run: |
          uv run coverage run --append --data-file=.coverage.migration \
            --source=alembic/versions -m pytest \
            tests/integration/test_aud350_stored_event_timestamp_migration.py \
            --tb=short

      - name: Build backend image for password preflight
        shell: bash
        run: |
          set -euo pipefail
          image_tag="local/migrate-passwords-ci:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --file backend.Dockerfile \
            --tag "$image_tag" \
            --load \
            .
          image_id="$(docker image inspect --format '{{.Id}}' "$image_tag")"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "backend image did not produce a full immutable image ID" >&2
            exit 1
          fi
          printf 'MIGPASS_BACKEND_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf 'backend_image_config_digest=%s\n' "$image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify password preflight in immutable backend image
        env:
          DATABASE_URL: postgresql+asyncpg://test@127.0.0.1:5433/test_migration
        run: uv run python scripts/quality/migrate_passwords_image_gate.py

      - name: Write migration coverage provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          ARTIFACT_NAME: python-migration-coverage-attempt-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -s .coverage.migration
          producer_root="artifacts/coverage/python/producer"
          mkdir -p "$producer_root"
          staged_report="$producer_root/.coverage.migration"
          metadata="$producer_root/coverage-provenance-migration.json"
          cp .coverage.migration "$staged_report"
          python_version="$(uv run python -c 'import platform; print(platform.python_version())')"
          coverage_version="$(uv run python -c 'import coverage; print(coverage.__version__)')"
          python scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output "$metadata" \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "$ARTIFACT_NAME" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "python=$python_version" \
            --tool-version "coverage.py=$coverage_version" \
            --tool-version quality-provenance=2.0.0 \
            --report \
              "python-shard|coverage-py-data|$staged_report|artifacts/coverage/python/shards/.coverage.migration"

      - name: Upload migration coverage data for aggregation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-migration-coverage-attempt-${{ github.run_attempt }}
          path: |
            artifacts/coverage/python/producer/.coverage.migration
            artifacts/coverage/python/producer/coverage-provenance-migration.json
          include-hidden-files: true
          if-no-files-found: error

  # MOD-W15-01 / Wave 18.1: Contract tests as a required CI gate.
  # Runs lightweight Python consumer contract tests (no Go/FFI needed).
  # The full Go provider verification continues in contract-tests.yml.
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run contract tests (consumer-side)
        # Contract coverage includes test_file_processor_contract.py (ProcessResult
        # callback schema) alongside the existing ws-hub NATS contract.
        run: |
          set -euo pipefail
          cohort_root="$RUNNER_TEMP/contract-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          consumer_root="$cohort_root/consumer"
          policy_root="$cohort_root/security-disposition"
          mkdir -p "$consumer_root/tmp" "$policy_root/tmp"

          consumer_pid=""
          policy_pid=""
          terminate_contract_process_groups() {
            local process_pid
            local grace_tick
            local any_alive
            local cleanup_status=0

            for process_pid in "$@"; do
              if [[ -n "$process_pid" ]] && kill -0 -- "-$process_pid" 2>/dev/null; then
                kill -TERM -- "-$process_pid" 2>/dev/null || true
              fi
            done

            # Allow both owned process groups one shared 2s grace period, then
            # escalate only groups started by this step.
            for ((grace_tick = 0; grace_tick < 20; grace_tick++)); do
              any_alive=0
              for process_pid in "$@"; do
                if [[ -n "$process_pid" ]] && kill -0 -- "-$process_pid" 2>/dev/null; then
                  any_alive=1
                fi
              done
              if (( any_alive == 0 )); then
                break
              fi
              sleep 0.1
            done

            for process_pid in "$@"; do
              if [[ -n "$process_pid" ]] && kill -0 -- "-$process_pid" 2>/dev/null; then
                kill -KILL -- "-$process_pid" 2>/dev/null || true
              fi
            done
            for process_pid in "$@"; do
              if [[ -n "$process_pid" ]]; then
                wait "$process_pid" 2>/dev/null || true
              fi
            done
            for process_pid in "$@"; do
              if [[ -n "$process_pid" ]] && kill -0 -- "-$process_pid" 2>/dev/null; then
                echo "::error::Contract test process group $process_pid survived SIGKILL."
                cleanup_status=1
              fi
            done
            return "$cleanup_status"
          }
          cleanup_contract_processes() {
            terminate_contract_process_groups "$consumer_pid" "$policy_pid" || true
          }
          trap cleanup_contract_processes EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP

          # Keep the full consumer and exact-disposition populations in this
          # required job, but overlap their independent pytest processes. Each
          # process gets its own basetemp, temp/database root, log, and JUnit file.
          # Bound the consumer to three file-grouped xdist workers: conftest owns
          # each worker database, query log, and temporary Pact directory. Keep
          # module-scoped Pact fixtures together without changing any selectors.
          # The positional expansions in each single-quoted -c script belong to
          # the child Bash, so suppress shellcheck's literal-single-quote warning.
          # shellcheck disable=SC2016
          setsid env \
            TMPDIR="$consumer_root/tmp" TMP="$consumer_root/tmp" TEMP="$consumer_root/tmp" \
            PACT_DO_NOT_TRACK=true \
