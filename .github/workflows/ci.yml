name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-hooks:
    name: Run hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run pre-commit (apply fixes)
        id: precommit_apply
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
        continue-on-error: true
      - name: Detect changes from pre-commit
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit pre-commit fixes
        if: ${{ steps.changes.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: pre-commit autofix"
          git pull --rebase origin "$branch" || true
          git push --force-with-lease origin "HEAD:$branch"
      - name: Fail if fixes were needed and cannot push (fork PR)
        if: ${{ steps.changes.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::pre-commit fixed files; this PR comes from a fork so CI cannot push. Run 'pre-commit run --all-files' locally and push the changes."
          exit 1
      - name: Run pre-commit (verify clean)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: root/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: root/frontend
        run: npm ci
      - name: Run ESLint and Prettier
        working-directory: root/frontend
        run: |
          npm run lint
          npm run format:check

  pip-audit:
    name: Pip audit
    runs-on: ubuntu-latest
    needs: run-hooks
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            root/requirements.txt
            root/requirements-dev.txt
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Run pip-audit (fail only if fixable vulns)
        shell: bash
        run: |
          audit_file() {
            f="$1"
            if [ ! -f "$f" ]; then
              echo "$f not found, skipping"
              return 0
            fi
            fixable="$(pip-audit -r "$f" --format=json 2>/dev/null | jq '.dependencies[].vulns[].fix_versions[]' || true)"
            if [ -z "$fixable" ]; then
              echo "No fixable vulnerabilities in $f"
              return 0
            else
              pip-audit -r "$f"
            fi
          }
          audit_file root/requirements.txt
          audit_file root/requirements-dev.txt

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: run-hooks
    env:
      OTEL_SDK_DISABLED: "true"
    defaults:
      run:
        working-directory: root
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            root/requirements.txt
            root/requirements-dev.txt
            root/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install asgi-lifespan pytest-asyncio httpx
      - name: Verify test deps
        run: |
          python - <<'PY'
          import sys
          try:
              import asgi_lifespan, httpx, pytest_asyncio
              print("OK: asgi_lifespan/httpx/pytest_asyncio installed")
          except Exception as e:
              print("Import check failed:", e)
              sys.exit(1)
          PY
      - name: Run pytest
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --junitxml=pytest-report.xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: root/coverage.xml
      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: root/pytest-report.xml
          if-no-files-found: warn

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: run-hooks
    defaults:
      run:
        working-directory: root/frontend
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: root/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:ci
        env:
          CI: 'true'
      - name: Upload vitest report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-report
          path: root/frontend/vitest-report.xml
          if-no-files-found: warn

  npm-audit:
    name: NPM audit
    runs-on: ubuntu-latest
    needs: frontend-tests
    defaults:
      run:
        working-directory: root/frontend
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: root/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: run-hooks
    defaults:
      run:
        working-directory: root/frontend
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: root/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: root/frontend/dist
          if-no-files-found: error

  lighthouse:
    name: Lighthouse CI
    needs:
      - build
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: ${{ vars.PREVIEW_URL || secrets.PREVIEW_URL || '' }}
      TARGET_PORT: 4174
    defaults:
      run:
        working-directory: root/frontend
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: root/frontend/package-lock.json
      - name: Download built dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: root/frontend/dist
      - name: Decide target URL
        shell: bash
        run: |
          if [ -n "$PREVIEW_URL" ]; then
            echo "TARGET_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          else
            echo "TARGET_URL=http://127.0.0.1:${TARGET_PORT}/" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Collect Lighthouse metrics
        run: npx lhci collect --config=../.lighthouserc.js
      - name: Generate Lighthouse reports
        run: npx lhci upload --config=../.lighthouserc.js
      - name: Build Lighthouse summary
        id: lighthouse_summary
        run: |
          node <<'SCRIPT'
          const fs = require('node:fs');
          const path = require('node:path');

          const marker = '<!-- lhci-report -->';
          const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
          const summaryPath = path.resolve(workspace, 'lighthouse-summary.md');
          const manifestPath = path.resolve('.lighthouseci/manifest.json');

          const buildFallbackSummary = (message) => {
            return [
              marker,
              '### Lighthouse CI',
              '',
              message,
            ].join('\n');
          };

          let summaryContent;

          if (!fs.existsSync(manifestPath)) {
            console.warn(`Manifest not found at ${manifestPath}`);
            summaryContent = buildFallbackSummary(
              '_No Lighthouse manifest was produced. Check the collect/upload steps for details._',
            );
          } else {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (!Array.isArray(manifest) || manifest.length === 0) {
              console.warn('Lighthouse manifest is empty.');
              summaryContent = buildFallbackSummary(
                '_Lighthouse did not report any runs. Check the collect/upload steps for details._',
              );
            } else {
              const metrics = [
                {
                  key: 'performance',
                  label: 'Performance score',
                  formatter: (value) => `${Math.round(value * 100)}`,
                  budget: '≥ 90',
                },
                {
                  key: 'largest-contentful-paint',
                  label: 'Largest Contentful Paint (ms)',
                  formatter: (value) => `${Math.round(value)}`,
                  budget: '≤ 3,500',
                },
                {
                  key: 'total-blocking-time',
                  label: 'Total Blocking Time (ms)',
                  formatter: (value) => `${Math.round(value)}`,
                  budget: '≤ 300',
                },
                {
                  key: 'cumulative-layout-shift',
                  label: 'Cumulative Layout Shift',
                  formatter: (value) => value.toFixed(3),
                  budget: '≤ 0.10',
                },
              ];

              const totals = new Map();
              for (const run of manifest) {
                const summary = run.summary || {};
                for (const metric of metrics) {
                  const value = summary[metric.key];
                  if (typeof value === 'number' && Number.isFinite(value)) {
                    totals.set(metric.key, (totals.get(metric.key) || 0) + value);
                  }
                }
              }

              const runs = manifest.length;
              const tableLines = metrics.map((metric) => {
                const total = totals.get(metric.key);
                const average = typeof total === 'number' ? total / runs : Number.NaN;
                const formatted = Number.isFinite(average) ? metric.formatter(average) : 'n/a';
                return `| ${metric.label} | ${formatted} | ${metric.budget} |`;
              });

              const targetUrl = process.env.TARGET_URL ? `Target URL: ${process.env.TARGET_URL}` : '';
              const lines = [
                marker,
                `### Lighthouse CI (${runs} run${runs === 1 ? '' : 's'})`,
                '',
                targetUrl,
                targetUrl ? '' : undefined,
                '| Metric | Average | Budget |',
                '| --- | --- | --- |',
                ...tableLines,
                '',
                '_Thresholds: Performance ≥ 90, LCP ≤ 3,500 ms, TBT ≤ 300 ms, CLS ≤ 0.10, JS ≤ 350 KB, CSS ≤ 120 KB._',
              ].filter(Boolean);

              summaryContent = lines.join('\n');
            }
          }

          fs.writeFileSync(summaryPath, summaryContent, 'utf8');

          const outputPath = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(
            outputPath,
            `summary_path=${summaryPath}\nsummary<<EOF\n${summaryContent}\nEOF\n`,
            'utf8',
          );
          SCRIPT
      - name: Comment Lighthouse summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SUMMARY_PATH: ${{ steps.lighthouse_summary.outputs.summary_path }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const core = require('@actions/core');
            const fs = require('node:fs');
            const path = require('node:path');
            const marker = '<!-- lhci-report -->';
            const summaryPath = process.env.SUMMARY_PATH
              ? path.resolve(process.env.SUMMARY_PATH)
              : path.resolve('lighthouse-summary.md');

            if (!fs.existsSync(summaryPath)) {
              core.warning(`Lighthouse summary not found at ${summaryPath}. Skipping PR comment.`);
              return;
            }

            const body = fs.readFileSync(summaryPath, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Upload Lighthouse artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: root/frontend/.lighthouseci
          if-no-files-found: warn

  performance-gate:
    name: Performance gate
    runs-on: ubuntu-latest
    needs:
      - lighthouse
    defaults:
      run:
        working-directory: root/frontend
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: root/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Download Lighthouse results
        uses: actions/download-artifact@v5
        with:
          name: lighthouse-results
          path: root/frontend/.lighthouseci
          if-no-files-found: error
      - name: Enforce Lighthouse thresholds
        run: npx lhci assert --config=../.lighthouserc.js
