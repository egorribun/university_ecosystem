# MOD-03 (audit Wave 11): Spectral OpenAPI contract validation.
#
# Validates that the FastAPI-generated OpenAPI spec passes the project's
# Spectral ruleset (.spectral.yml).  Findings are uploaded as SARIF to
# GitHub Code Scanning so they appear as inline annotations on PRs.
#
# The spec is generated from the live FastAPI app object (same as
# generate-openapi.yml) so there is no stale-spec problem.
#
# Trigger: any change that touches the Python API surface or the ruleset.

name: Contract Validation — OpenAPI + Spectral

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "pyproject.toml"
      - ".spectral.yml"
      - ".github/workflows/contract-validation.yml"
  pull_request:
    # OpenAPI Backward Compatibility Check is a required status context in the
    # main-branch ruleset.  A path-filtered required workflow would leave every
    # unrelated PR permanently pending, so it must be scheduled for every PR.
    types: [opened, synchronize, reopened, ready_for_review]

permissions: read-all

concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spectral-lint:
    name: Spectral - OpenAPI lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      ENVIRONMENT: testing
      SECRET_KEY: ""
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Configure ephemeral application secret
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          printf 'SECRET_KEY=%s\n' "$secret" >> "$GITHUB_ENV"

      - name: Generate OpenAPI spec from FastAPI app
        run: |
          uv run python -c "
          import json
          from app.main import app
          spec = app.openapi()
          with open('/tmp/backend-openapi.json', 'w') as f:
              json.dump(spec, f, indent=2)
          print(f'Generated spec: {len(spec[\"paths\"])} paths')
          "

      - name: Run Spectral lint
        # Continue long enough to upload SARIF. The blocking enforcement is the
        # explicit fail-severity step below, not the external upload service.
        id: spectral
        continue-on-error: true
        run: |
          docker run --rm -v /tmp:/tmp -v "${PWD}:/work" -w /work stoplight/spectral:6.17.0@sha256:c8ffae6ee561b70e80402f1ea669e8b37c74fee48a3dbe2147b71359ed987239 lint /tmp/backend-openapi.json \
            --ruleset .spectral.yml \
            --format sarif \
            --output spectral-results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: spectral-results.sarif
          category: spectral-openapi

      - name: Fail if errors found
        if: always()
        # Re-raise on errors (severity ERROR) but not warnings.
        # Spectral exit codes: 0=clean, 1=warnings, 2=errors.
        run: |
          docker run --rm -v /tmp:/tmp -v "${PWD}:/work" -w /work stoplight/spectral:6.17.0@sha256:c8ffae6ee561b70e80402f1ea669e8b37c74fee48a3dbe2147b71359ed987239 lint /tmp/backend-openapi.json \
            --ruleset .spectral.yml \
            --format text \
            --fail-severity error


      - name: Verify Spectral response-rule behavior
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          harness="scripts/quality/check_spectral_operation_responses.py"
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/spectral-response-contract.XXXXXX")"
          container_name="spectral-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${fixture_dir##*/}"
          attempted=0

          cleanup() {
            status=$?
            trap - EXIT
            cleanup_status=0
            if [[ "$attempted" == 1 ]]; then
              container_id=""
              if [[ -s "$fixture_dir/container.cid" ]]; then
                container_id="$(cat "$fixture_dir/container.cid")"
              fi
              if [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]; then
                if ! timeout --kill-after=2s 8s \
                  docker rm -f "$container_id"; then
                  echo "::error::Owned Spectral container cleanup failed"
                  cleanup_status=1
                fi
              else
                echo "::error::Spectral container identity unavailable; cleanup unproven"
                cleanup_status=1
              fi
            fi
            if ! rm -rf -- "$fixture_dir"; then
              echo "::error::Spectral fixture cleanup failed"
              cleanup_status=1
            fi
            if [[ "$status" == 0 ]]; then
              status="$cleanup_status"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          image="$(uv run --frozen --no-sync python "$harness" image)"
          uv run --frozen --no-sync python "$harness" fixture \
            > "$fixture_dir/openapi.json"
          chmod 755 "$fixture_dir"
          chmod 644 "$fixture_dir/openapi.json"

          attempted=1
          timeout --kill-after=5s 45s \
            docker run --name "$container_name" \
            --cidfile "$fixture_dir/container.cid" \
            --pull=never --network=none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work,readonly" \
            --mount "type=bind,source=$fixture_dir,target=/fixtures,readonly" \
            -w /work "$image" lint /fixtures/openapi.json \
            --ruleset .spectral.yml --format json --fail-severity error \
            > "$fixture_dir/diagnostics.json"

          uv run --frozen --no-sync python "$harness" check \
            "$fixture_dir/diagnostics.json"


      - name: Verify Kubernetes alert-rule behavior
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          harness="scripts/quality/check_prometheus_alert_rules.py"
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/prometheus-alert-contract.XXXXXX")"
          attempted=0

          cleanup() {
            status=$?
            trap - EXIT
            cleanup_status=0
            if [[ "$attempted" == 1 ]]; then
              container_id=""
              if [[ -s "$fixture_dir/container.cid" ]]; then
                container_id="$(cat "$fixture_dir/container.cid")"
              fi
              if [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]; then
                if ! timeout --kill-after=2s 8s \
                  docker rm -f "$container_id"; then
                  echo "::error::Owned Promtool container cleanup failed"
                  cleanup_status=1
                fi
              else
                echo "::error::Promtool container identity unavailable; cleanup unproven"
                cleanup_status=1
              fi
            fi
            if ! rm -rf -- "$fixture_dir"; then
              echo "::error::Promtool fixture cleanup failed"
              cleanup_status=1
            fi
            if [[ "$status" == 0 ]]; then
              status="$cleanup_status"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          image="$(timeout --kill-after=2s 10s \
            uv run --frozen --no-sync python "$harness" image)"
          timeout --kill-after=2s 10s \
            uv run --frozen --no-sync python "$harness" rules \
            > "$fixture_dir/rules.json"
          timeout --kill-after=2s 10s \
            uv run --frozen --no-sync python "$harness" fixture \
            > "$fixture_dir/tests.json"
          chmod 755 "$fixture_dir"
          chmod 644 "$fixture_dir/rules.json" "$fixture_dir/tests.json"

          if ! timeout --kill-after=2s 5s \
            docker image inspect "$image" > /dev/null 2>&1; then
            timeout --kill-after=5s 45s docker pull "$image"
          fi

          attempted=1
          timeout --kill-after=2s 10s \
            docker create \
            --cidfile "$fixture_dir/container.cid" \
            --pull=never --network=none \
            --mount "type=bind,source=$fixture_dir,target=/fixtures,readonly" \
            --workdir=/fixtures \
            --entrypoint=/bin/promtool \
            "$image" test rules tests.json > /dev/null

          container_id="$(cat "$fixture_dir/container.cid")"
          if [[ ! "$container_id" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid owned Promtool container identity"
            exit 1
          fi
          attach_status=0
          timeout --kill-after=5s 30s \
            docker start --attach "$container_id" || attach_status=$?

          state="$(timeout --kill-after=2s 5s \
            docker inspect --type container \
            --format '{{.State.Status}} {{.State.ExitCode}}' \
            "$container_id")"

          if [[ ! "$state" =~ ^exited[[:space:]]([0-9]+)$ ]]; then
            echo "::error::Promtool did not reach a verified exited state"
            exit 1
          fi
          tool_status="${BASH_REMATCH[1]}"

          if [[ "$attach_status" != 0 ]]; then
            echo "::error::Promtool attachment or execution failed"
            exit "$attach_status"
          fi
          if [[ "$tool_status" != 0 ]]; then
            echo "::error::Promtool rule evaluation failed"
            exit 1
          fi

  # Wave 2 / Task 2.3 — openapi-diff backward-compatibility gate.
  # Compares the generated spec against the event's immutable baseline snapshot
  # to prevent accidental breaking changes (removed paths, required fields, etc.).
  openapi-diff:
    name: OpenAPI Backward Compatibility Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Cache Cargo registry
        # rust-ext is built by maturin during uv sync; cache the registry so
        # transient crates.io network faults (e.g. HTTP/2 framing errors) do
        # not cause a full build failure on every cold-cache run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-contract-${{ hashFiles('native/rust_ext/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contract-
            ${{ runner.os }}-cargo-

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev


      - name: Generate current PR OpenAPI spec
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: testing
          SECRET_KEY: "openapi-diff-ci-placeholder"  # pragma: allowlist secret
        run: |
          uv run python -c "
          import json, pathlib
          from app.main import app
          spec = app.openapi()
          pathlib.Path('/tmp/pr-openapi.json').write_text(json.dumps(spec))
          print(f'Generated PR spec: {len(spec[\"paths\"])} paths')
          "

      - name: Set up Node.js (for openapi-diff CLI)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install openapi-diff
        # oasdiff detects breaking vs. non-breaking changes.
        # Pinned to exact npm wrapper and native binary versions for reproducibility.
        run: npm install --global @oasdiff-js/oasdiff-js@1.0.0

      - name: Extract OpenAPI snapshot from event baseline
        id: openapi_baseline
        env:
          EVENT_NAME: "${{ github.event_name }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          PUSH_BEFORE_SHA: "${{ github.event.before }}"
        # Extract after candidate generation so refreshing the candidate's
        # checked-in snapshot cannot redefine the old comparison surface.
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) baseline_sha="$PR_BASE_SHA" ;;
            push) baseline_sha="$PUSH_BEFORE_SHA" ;;
            *)
              echo "::error::Unsupported event for OpenAPI baseline selection."
              exit 1
              ;;
          esac
          if [[ ! "$baseline_sha" =~ ^[0-9a-f]{40}$ || "$baseline_sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "::error::OpenAPI baseline requires a nonzero immutable commit SHA."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$baseline_sha"
          git cat-file -e "$baseline_sha^{commit}"
          baseline_path=$(mktemp "$RUNNER_TEMP/base-openapi.XXXXXX.json")
          git show "$baseline_sha:tests/contracts/snapshots/api_openapi_v1.json" > "$baseline_path"
          if [[ ! -s "$baseline_path" ]]; then
            echo "::error::The event baseline OpenAPI snapshot is empty."
            exit 1
          fi
          printf 'path=%s\n' "$baseline_path" >> "$GITHUB_OUTPUT"

      - name: Check for breaking changes against event baseline
        env:
          BASELINE_OPENAPI: "${{ steps.openapi_baseline.outputs.path }}"
        # The exact PR base or pre-push snapshot is the "old" spec.
        # The generated candidate schema is the "new" spec.
        # --fail-on ERR exits non-zero only on breaking changes.
        # Additive changes (new paths, new optional fields) are allowed.
        run: |
          oasdiff breaking \
            "$BASELINE_OPENAPI" \
            /tmp/pr-openapi.json \
            --fail-on ERR || {
            echo "::error::Breaking OpenAPI changes detected in this PR."
            echo "Additive changes (new endpoints, optional fields) are fine."
            echo "Renaming/removing required fields, changing parameter types,"
            echo "or removing endpoints requires a major version bump."
            exit 1
          }
          echo "✅ No breaking OpenAPI changes detected."

  openapi-typescript-drift:
    name: OpenAPI TypeScript Drift Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-drift-${{ hashFiles('native/rust_ext/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-drift-
            ${{ runner.os }}-cargo-

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev

      - name: Generate current OpenAPI spec
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: testing
          SECRET_KEY: "openapi-drift-ci-placeholder" # pragma: allowlist secret
        run: |
          uv run python -c "
          import json, pathlib
          from app.main import app
          spec = app.openapi()
          pathlib.Path('frontend/openapi.json').write_text(
              json.dumps(spec, indent=2, sort_keys=True) + '\n'
          )
          "

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Normalize generated OpenAPI schema
        working-directory: frontend
        run: npm exec -- prettier --write openapi.json

      - name: Regenerate TypeScript client and MSW mocks
        working-directory: frontend
        run: npm run generate:api

      - name: Check for schema-drift / uncommitted changes
        run: |
          # Restrict the gate to files produced by the two generation steps.
          # A repository-wide diff previously mislabeled an unrelated uv.lock
          # update as TypeScript/OpenAPI drift on main.
          git diff --exit-code -- \
            frontend/openapi.json \
            frontend/src/api/generated/ \
            frontend/src/tests/mocks/generated/ || {
            echo "::error::API schema drift detected! The TypeScript client/types in 'frontend/src/api/generated' are out of sync with the backend FastAPI schema."
            echo "To fix this, run 'npm run generate:api' in the 'frontend' directory locally, and commit the generated changes."
            exit 1
          }
          echo "✅ TypeScript interfaces are in sync with the FastAPI schema."
