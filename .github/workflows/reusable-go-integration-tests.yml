# Reusable Go Integration Tests Workflow
#
# Runs //go:build integration tagged tests via `make test-integration` —
# requires Docker (pre-installed on GitHub-hosted ubuntu-latest runners).
# Per ADR-022, these tests spin up real NATS / MinIO / Redis / ClamAV
# containers via testcontainers-go to cover behaviour the in-process fakes
# do not (Nak storms, MinIO multipart, Redis EVALSHA, JWKS hot-reload, etc).
#
# Initially non-blocking — promotes to required only when flake rate over
# 30 days falls below 1 % per ADR-022 §Migration step 5.
name: Go Integration Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use"
        required: false
        type: string
        default: "1.26.6"
      service-directory:
        description: "Service directory to test (e.g., services/gateway)"
        required: true
        type: string

jobs:
  integration:
    name: Integration Tests (${{ inputs.service-directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVICE_DIRECTORY: ${{ inputs.service-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate service directory
        id: validate-service
        shell: bash
        run: |
          case "$SERVICE_DIRECTORY" in
            services/gateway|services/file-processor|services/ws-hub) ;;
            *)
              echo "::error::Unsupported service directory"
              exit 1
              ;;
          esac

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            go.sum

      - name: Verify Docker is available (testcontainers-go requirement)
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker daemon not reachable"; exit 1; }
          docker version --format '{{.Server.Version}}'

      - name: Install dependencies
        run: |
          cd "$SERVICE_DIRECTORY"
          go mod download

      - name: Run integration tests
        run: |
          printf 'Running integration tests for %s…\n' "$SERVICE_DIRECTORY"
          cd "$SERVICE_DIRECTORY"
          make test-integration
        env:
          # testcontainers-go reuses containers across test runs in CI to
          # mitigate cold-start latency; safe because each container has
          # a unique session-scoped name per process.
          TESTCONTAINERS_REUSE_ENABLE: "true"
          # The Ryuk reaper container cleans orphan containers on test exit.
          # Disable in CI — GitHub-hosted runners are ephemeral and the job
          # already cleans up.
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Generate artifact name
        if: always() && steps.validate-service.outcome == 'success'
        id: artifact-name
        shell: bash
        run: |
          # shellcheck disable=SC1003
          SANITIZED=$(printf '%s' "$SERVICE_DIRECTORY" | tr '/\\' '-')
          echo "name=go-integration-$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Upload diagnostics on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.validate-service.outcome == 'success'
        with:
          name: ${{ steps.artifact-name.outputs.name }}-logs
          path: |
            services/gateway/coverage.out
            services/file-processor/coverage.out
            services/ws-hub/coverage.out
          if-no-files-found: ignore
