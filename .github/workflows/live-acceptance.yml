name: Owned Live Acceptance

# Pull requests run the auth and password-reset smoke set on the owned Core
# stack. Scheduled and manually dispatched runs exercise the full suite on
# Core; manual runs also smoke the reviewed manifest-selected RC on the full stack.
# GitHub activates schedule/workflow_dispatch only after this file reaches the
# repository's default branch; non-default manual refs are guarded below.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-acceptance-${{ github.event.pull_request.number || github.ref }}
  # Let an active owned run finish its cleanup before a newer run starts.
  cancel-in-progress: false

jobs:
  live-acceptance:
    name: Owned live Core acceptance (${{ github.event_name }})
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      LIVE_E2E_MODE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the event commit without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify the checked-out event commit
        id: verify-event-commit
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The event commit SHA is unavailable or malformed."
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_EVENT_SHA" ]]; then
            echo "::error::The checked-out commit does not match the event SHA."
            exit 1
          fi
          echo "checked_out_sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Validate live acceptance contracts before starting Docker
        working-directory: frontend
        run: npm run test:e2e:live:contract

      - name: Install locked Chromium and Linux browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Select unique owned Core state directory
        run: |
          state_root="$(python -c 'import tempfile; print(tempfile.gettempdir())')"
          printf 'LIVE_STATE_DIR=%s/ue-live-acceptance/run-%s-%s-core\n' \
            "$state_root" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Start the owned live stand
        id: start-stand
        env:
          STAND_REF: ${{ steps.verify-event-commit.outputs.checked_out_sha }}
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand up
          --in-place --state-dir "$LIVE_STATE_DIR" --ref "$STAND_REF"
          --stack core

      - name: Run live acceptance through the redacting runner
        id: core-e2e
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand e2e
          --in-place --state-dir "$LIVE_STATE_DIR" --mode "$LIVE_E2E_MODE"

      - name: Run owned NATS outage acceptance
        id: nats-outage
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'egorribun/university_ecosystem' && github.event.pull_request.head.ref == 'egorribun' && steps.core-e2e.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand nats-outage
          --in-place --state-dir "$LIVE_STATE_DIR"

      - name: Stop owned containers and preserve stand data
        id: stop-stand
        if: ${{ always() && steps.start-stand.outcome != 'skipped' }}
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand stop
          --in-place --state-dir "$LIVE_STATE_DIR"

      - name: Write the metadata-only Core receipt
        if: ${{ always() }}
        env:
          VERIFIED_SHA: ${{ steps.verify-event-commit.outputs.checked_out_sha }}
          LIVE_MODE: ${{ env.LIVE_E2E_MODE }}
          CHECKOUT_OUTCOME: ${{ steps.verify-event-commit.outcome }}
          STAND_START_OUTCOME: ${{ steps.start-stand.outcome }}
          E2E_OUTCOME: ${{ steps.core-e2e.outcome }}
          NATS_OUTAGE_OUTCOME: ${{ steps.nats-outage.outcome }}
          STAND_STOP_OUTCOME: ${{ steps.stop-stand.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re

          source_sha = os.environ.get("VERIFIED_SHA", "")
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("verified Core source SHA is unavailable")

          mode = os.environ.get("LIVE_MODE", "")
          if mode not in {"smoke", "full"}:
              raise SystemExit("Core live acceptance mode is unavailable")

          allowed_outcomes = {"success", "failure", "cancelled", "skipped"}
          outcomes = {
              "checkout_verification": os.environ.get("CHECKOUT_OUTCOME", ""),
              "stand_start": os.environ.get("STAND_START_OUTCOME", ""),
              "e2e": os.environ.get("E2E_OUTCOME", ""),
              "nats_outage": os.environ.get("NATS_OUTAGE_OUTCOME", ""),
              "stand_stop": os.environ.get("STAND_STOP_OUTCOME", ""),
          }
          if any(value not in allowed_outcomes for value in outcomes.values()):
              raise SystemExit("Core live acceptance step outcome is unavailable")

          receipt = {
              "schema": "ue-live-acceptance-receipt-v1",
              "kind": "owned-core-live-acceptance",
              "source_sha": source_sha,
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "stack": "core",
              "mode": mode,
              "outcomes": outcomes,
          }
          with open("core-live-acceptance-receipt.json", "x", encoding="utf-8") as output:
              json.dump(receipt, output, sort_keys=True, separators=(",", ":"))
              output.write("\n")
          PY

      - name: Upload the metadata-only Core receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-live-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: core-live-acceptance-receipt.json
          if-no-files-found: error
          retention-days: 90

  validate-frozen-rc:
    name: Validate frozen-RC full-smoke request
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve-frozen-rc.outputs.source_sha }}
    steps:
      - name: Require the protected main workflow ref
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Frozen-RC smoke must be dispatched from the protected main ref."
            exit 1
          fi

      - name: Check out the trusted workflow commit without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the reviewed manifest source commit
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The trusted workflow commit SHA is unavailable or malformed."
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_WORKFLOW_SHA" ]]; then
            echo "::error::The manifest checkout does not match the trusted workflow SHA."
            exit 1
          fi

      - name: Resolve the reviewed frozen-RC manifest
        id: resolve-frozen-rc
        run: |
          set -euo pipefail
          source_sha="$(python3 scripts/quality/resolve_frozen_rc_manifest.py \
            --manifest quality/frozen-rc.json)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The reviewed frozen-RC manifest did not resolve an exact SHA."
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  frozen-rc-full-smoke:
    name: Frozen-RC full-stack smoke
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate-frozen-rc.result == 'success' }}
    needs: validate-frozen-rc
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    cache-mode: none
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the immutable frozen RC without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-frozen-rc.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out frozen-RC commit
        id: verify-frozen-rc
        env:
          EXPECTED_FROZEN_RC_SHA: ${{ needs.validate-frozen-rc.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_FROZEN_RC_SHA" ]]; then
            echo "::error::Checked-out frozen-RC commit does not match the requested SHA."
            exit 1
          fi
          echo "checked_out_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Frozen-RC source"
            echo "- Commit: $actual_sha"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install locked Python runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Validate live acceptance contracts before starting Docker
        working-directory: frontend
        run: npm run test:e2e:live:contract

      - name: Install locked Chromium and Linux browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Select unique owned frozen-RC state directory
        run: |
          state_root="$(python -c 'import tempfile; print(tempfile.gettempdir())')"
          printf 'LIVE_STATE_DIR=%s/ue-live-acceptance/run-%s-%s-frozen-rc-full\n' \
            "$state_root" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Start the owned frozen-RC full stand
        id: start-frozen-rc
        env:
          FROZEN_RC_VERIFIED_SHA: ${{ steps.verify-frozen-rc.outputs.checked_out_sha }}
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand up
          --in-place --state-dir "$LIVE_STATE_DIR" --ref "$FROZEN_RC_VERIFIED_SHA"
          --stack full

      - name: Run full frozen-RC acceptance through the redacting runner
        id: frozen-rc-e2e
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand e2e
          --in-place --state-dir "$LIVE_STATE_DIR" --mode full

      - name: Stop frozen-RC containers and preserve stand data
        id: stop-frozen-rc
        if: ${{ always() && steps.start-frozen-rc.outcome != 'skipped' }}
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand stop
          --in-place --state-dir "$LIVE_STATE_DIR"

      - name: Write the metadata-only frozen-RC receipt
        if: ${{ always() }}
        env:
          VERIFIED_SHA: ${{ steps.verify-frozen-rc.outputs.checked_out_sha }}
          E2E_OUTCOME: ${{ steps.frozen-rc-e2e.outcome }}
          STAND_START_OUTCOME: ${{ steps.start-frozen-rc.outcome }}
          STAND_STOP_OUTCOME: ${{ steps.stop-frozen-rc.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re

          source_sha = os.environ.get("VERIFIED_SHA", "")
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("verified frozen-RC SHA is unavailable")

          allowed_outcomes = {"success", "failure", "cancelled", "skipped"}
          outcomes = {
              "e2e": os.environ.get("E2E_OUTCOME", ""),
              "stand_start": os.environ.get("STAND_START_OUTCOME", ""),
              "stand_stop": os.environ.get("STAND_STOP_OUTCOME", ""),
          }
          if any(value not in allowed_outcomes for value in outcomes.values()):
              raise SystemExit("frozen-RC step outcome is unavailable")

          receipt = {
              "schema": "ue-live-acceptance-receipt-v1",
              "kind": "frozen-rc-full-smoke",
              "source_sha": source_sha,
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "stack": "full",
              "outcomes": outcomes,
          }
          with open("frozen-rc-live-receipt.json", "x", encoding="utf-8") as output:
              json.dump(receipt, output, sort_keys=True, separators=(",", ":"))
              output.write("\n")
          PY

      - name: Upload the metadata-only frozen-RC receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-rc-live-receipt-${{ steps.verify-frozen-rc.outputs.checked_out_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: frozen-rc-live-receipt.json
          if-no-files-found: error
          retention-days: 90
