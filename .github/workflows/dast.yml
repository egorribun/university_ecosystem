name: DAST — Nuclei + ZAP Scan

# MOD-NEW-02 (audit 2026-03-07): Dynamic Application Security Testing workflow.
# Nuclei scans the deployed staging environment using a curated set of templates.
# Results are uploaded as SARIF to GitHub Security → Code Scanning.
#
# Trigger strategy:
#   - Weekly (Sunday 02:00 UTC) so findings surface before Monday on-call starts.
#   - Manual dispatch from the protected main ref for ad-hoc scans.
#   - Never from a pull-request event: PR-controlled workflow/configuration
#     must not receive the configured DAST target.

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch: #checkov:skip=CKV_GHA_7:manual input intentionally selects the DAST target
    inputs:
      target_url:
        description: "Target URL to scan (overrides DAST_TARGET_URL secret)"
        required: false
        type: string

permissions: read-all

# Active scans target one protected staging surface.  Serialize scheduled and
# manual runs so a duplicate dispatch cannot consume two scanner stacks or
# compete for the repository's hosted-runner budget.  Keep queued evidence
# rather than cancelling an in-flight security scan.
concurrency:
  group: dast-main
  cancel-in-progress: false

jobs:
  verify-trusted-ref:
    name: Verify trusted DAST source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Reject untrusted workflow ref
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "::error::DAST scans must run from the protected main ref."
            exit 1
          fi

  nuclei:
    name: Nuclei DAST scan
    # Only the protected default branch can supply the active-scan workflow,
    # templates, and configured target to a scheduled or manual execution.
    needs: verify-trusted-ref
    if: ${{ needs.verify-trusted-ref.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Required to upload SARIF to Code Scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The preflight enforces main; the event SHA binds evidence to its source.
          ref: ${{ github.sha }}
          # Only the workflow tree and the Nuclei findings gate are needed
          sparse-checkout: |
            .github
            scripts/quality
          sparse-checkout-cone-mode: false

      # MOD-01 (audit 2026-03-08 Wave 5): Previous SHA 9da1d2b...f8a9 was
      # fabricated — tag v2.3.6 does not exist in projectdiscovery/nuclei-action.
      # Updated to the verified SHA for v3.1.0 (latest stable as of 2026-03-08).
      # To re-verify: gh api repos/projectdiscovery/nuclei-action/git/refs/tags
      - name: Set up Nuclei
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          version: v3.11.1
          # The custom step below validates TARGET_URL before any scan runs.
          install-only: true

      - name: Validate Nuclei target URL
        env:
          DAST_SECRET_TARGET: ${{ secrets.DAST_TARGET_URL }}
        run: |
          set -euo pipefail
          python3 -m scripts.quality.dast_privacy prepare-target \
            --output "$RUNNER_TEMP/nuclei-target.txt"

      - name: Run Nuclei scan
        id: nuclei_scan
        shell: bash
        run: |
          set -euo pipefail
          nuclei \
            -l "$RUNNER_TEMP/nuclei-target.txt" \
            -t cves/ \
            -t exposures/ \
            -t misconfiguration/ \
            -t vulnerabilities/ \
            -t network/ \
            -severity critical,high,medium,low,info \
            -exclude-tags dos,fuzz \
            -rate-limit 50 \
            -concurrency 10 \
            -timeout 10 \
            -max-host-error 30 \
            -sarif-export "$RUNNER_TEMP/nuclei-results.sarif" \
            -json-export "$RUNNER_TEMP/nuclei-results.json" \
            -trace-log "$RUNNER_TEMP/nuclei-trace.jsonl" \
            -omit-raw \
            -no-color \
            -stats >"$RUNNER_TEMP/nuclei-stdout.log" 2>"$RUNNER_TEMP/nuclei-stderr.log"

      # Trace and scanner logs may contain target details: keep them private on
      # the runner. A response establishes execution, not complete coverage.
      - name: Validate Nuclei scan completion
        if: ${{ always() }}
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.nuclei_scan.outcome }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::DAST checkout does not match the event source."
            exit 1
          fi
          DAST_TARGET_FILE="$RUNNER_TEMP/nuclei-target.txt" \
            python3 -m scripts.quality.dast_privacy verify-scan \
            --trace-in "$RUNNER_TEMP/nuclei-trace.jsonl" \
            --log-in "$RUNNER_TEMP/nuclei-stderr.log" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # Nuclei 3.11.1 emits no SARIF when there are no findings. Require it
      # for every nonempty export while retaining the original clean JSON.
      - name: Validate Nuclei report evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/nuclei_findings_gate.py "$RUNNER_TEMP/nuclei-results.json" \
            --check-sarif "$RUNNER_TEMP/nuclei-results.sarif"

      - name: Sanitize Nuclei reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          DAST_TARGET_FILE="$RUNNER_TEMP/nuclei-target.txt" \
            python3 -m scripts.quality.dast_privacy sanitize \
            --json-in "$RUNNER_TEMP/nuclei-results.json" \
            --sarif-in "$RUNNER_TEMP/nuclei-results.sarif" \
            --json-out nuclei-results.json \
            --sarif-out nuclei-results.sarif

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ success() && hashFiles('nuclei-results.sarif') != '' }}
        with:
          sarif_file: nuclei-results.sarif
          category: nuclei-dast

      - name: Upload sanitized JSON findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nuclei-results-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: nuclei-results.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload sanitized SARIF report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && hashFiles('nuclei-results.sarif') != '' }}
        with:
          name: nuclei-sarif-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: nuclei-results.sarif
          retention-days: 90
          if-no-files-found: error

      # AUD-381: findings are published above first. Medium, high and critical
      # Nuclei findings fail the run; info and low are reported only. A missing
      # or malformed export fails closed because the scan result is then unknown.
      - name: Fail on medium, high or critical Nuclei findings
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/nuclei_findings_gate.py "$RUNNER_TEMP/nuclei-results.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # MOD-W5-07: OWASP ZAP Full Scan — active scan for dynamic discovery
  # Complements Nuclei (CVE/template-based) with active probing for injection,
  # auth bypass, misconfiguration, and other dynamic vulnerabilities.
  #
  # SHA pinned to zaproxy/action-full-scan@v0.10.0 — verify with:
  #   gh api repos/zaproxy/action-full-scan/git/refs/tags/v0.10.0
  # ---------------------------------------------------------------------------
  zap:
    name: OWASP ZAP Full Scan
    # Keep the same protected-source boundary as the Nuclei active scan.
    needs: verify-trusted-ref
    if: ${{ needs.verify-trusted-ref.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository (ZAP rules config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: |
            .zap
          sparse-checkout-cone-mode: false

      - name: Validate ZAP target URL
        env:
          TARGET_URL: ${{ inputs.target_url || secrets.DAST_TARGET_URL }}
        run: |
          echo "::add-mask::$TARGET_URL"
          if [ -z "$TARGET_URL" ]; then
            echo "::error::No target URL configured. Set DAST_TARGET_URL secret or pass target_url input."
            exit 1
          fi

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        env:
          TARGET_URL: ${{ inputs.target_url || secrets.DAST_TARGET_URL }}
        with:
          target: ${{ inputs.target_url || secrets.DAST_TARGET_URL }}
          # rules_file_name: suppresses known false positives for safe patterns
          rules_file_name: ".zap/rules.tsv"
          # -a: active scan, -j: Ajax spider, -T 60: max active scan duration 60 min
          cmd_options: "-a -j -T 60"
          # Upload SARIF to Code Scanning
          artifact_name: zap-results-${{ github.run_id }}

      - name: Upload ZAP SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: zap-results.sarif
          category: zap-dast
