name: DAST — Nuclei + ZAP Scan

# MOD-NEW-02 (audit 2026-03-07): Dynamic Application Security Testing workflow.
# Nuclei scans the deployed staging environment using a curated set of templates.
# Results are uploaded as SARIF to GitHub Security → Code Scanning.
#
# Trigger strategy:
#   - Weekly (Sunday 02:00 UTC) so findings surface before Monday on-call starts.
#   - Manual dispatch for ad-hoc scans (e.g. after large feature merges).
#   - NOT on push/PR — DAST requires a running target and is too slow for CI.

on:
  schedule:
    - cron: "0 2 * * 0"
  # W23: Allow triggering DAST on PRs when the 'run-dast' label is applied.
  # This lets security reviewers kick off a scan without waiting for Sunday.
  # The workflow still requires a running DAST_TARGET_URL (staging environment).
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch: # checkov:skip=CKV_GHA_7:manual input intentionally selects the DAST target
    inputs:
      target_url:
        description: "Target URL to scan (overrides DAST_TARGET_URL secret)"
        required: false
        type: string

permissions: read-all

jobs:
  nuclei:
    name: Nuclei DAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Required to upload SARIF to Code Scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only need templates directory, not full history
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false

      # MOD-01 (audit 2026-03-08 Wave 5): Previous SHA 9da1d2b...f8a9 was
      # fabricated — tag v2.3.6 does not exist in projectdiscovery/nuclei-action.
      # Updated to the verified SHA for v3.1.0 (latest stable as of 2026-03-08).
      # To re-verify: gh api repos/projectdiscovery/nuclei-action/git/refs/tags
      - name: Set up Nuclei
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          nuclei-version: v3.3.9

      - name: Run Nuclei scan
        env:
          TARGET_URL: ${{ inputs.target_url || secrets.DAST_TARGET_URL }}
        run: |
          # TD-W16-05: Mask target URL in CI logs (secrets auto-masked but inputs are not).
          echo "::add-mask::$TARGET_URL"
          if [ -z "$TARGET_URL" ]; then
            echo "::error::No target URL configured. Set DAST_TARGET_URL secret or pass target_url input."
            exit 1
          fi

          nuclei \
            -u "$TARGET_URL" \
            -t cves/ \
            -t exposures/ \
            -t misconfiguration/ \
            -t vulnerabilities/ \
            -t network/ \
            -severity critical,high,medium \
            -exclude-tags dos,fuzz \
            -rate-limit 50 \
            -concurrency 10 \
            -timeout 10 \
            -max-host-error 30 \
            -sarif-export nuclei-results.sarif \
            -json-export nuclei-results.json \
            -stats \
            || true  # Don't fail the workflow — findings are uploaded as SARIF

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        with:
          sarif_file: nuclei-results.sarif
          category: nuclei-dast

      - name: Upload raw JSON findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nuclei-results-${{ github.run_id }}
          path: nuclei-results.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # MOD-W5-07: OWASP ZAP Full Scan — active scan for dynamic discovery
  # Complements Nuclei (CVE/template-based) with active probing for injection,
  # auth bypass, misconfiguration, and other dynamic vulnerabilities.
  #
  # SHA pinned to zaproxy/action-full-scan@v0.10.0 — verify with:
  #   gh api repos/zaproxy/action-full-scan/git/refs/tags/v0.10.0
  # ---------------------------------------------------------------------------
  zap:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository (ZAP rules config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .zap
          sparse-checkout-cone-mode: false

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        env:
          TARGET_URL: ${{ inputs.target_url || secrets.DAST_TARGET_URL }}
        with:
          target: ${{ inputs.target_url || secrets.DAST_TARGET_URL }}
          # rules_file_name: suppresses known false positives for safe patterns
          rules_file_name: ".zap/rules.tsv"
          # -a: active scan, -j: Ajax spider, -T 60: max active scan duration 60 min
          cmd_options: "-a -j -T 60"
          # Upload SARIF to Code Scanning
          artifact_name: zap-results-${{ github.run_id }}

      - name: Upload ZAP SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        with:
          sarif_file: zap-results.sarif
          category: zap-dast
