name: DAST — Nuclei + ZAP Scan

# MOD-NEW-02 (audit 2026-03-07): Dynamic Application Security Testing workflow.
# AUD-381 (owner decision 2026-11-12): every scanner job starts its own
# ephemeral owned Compose stand inside the job with scripts/live_stand.py, the
# same launcher used by live acceptance, and scans only that loopback stand.
# No external DAST target secret or workflow input exists.
#
# Results are uploaded as SARIF to GitHub Security → Code Scanning, and the
# sanitized evidence is retained for 90 days.
#
# Trigger strategy:
#   - Weekly (Sunday 02:00 UTC) so findings surface before Monday on-call starts.
#   - Manual dispatch from the protected main ref for ad-hoc scans.
#   - Never from a pull-request event: PR-controlled workflow/configuration
#     must not receive a scan authorization.

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions: read-all

# Each scan owns its own stand. Serialize scheduled and manual runs so a
# duplicate dispatch cannot consume two scanner stacks or compete for the
# repository's hosted-runner budget. Keep queued evidence rather than
# cancelling an in-flight security scan.
concurrency:
  group: dast-main
  cancel-in-progress: false

jobs:
  verify-trusted-ref:
    name: Verify trusted DAST source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Reject untrusted workflow ref
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "::error::DAST scans must run from the protected main ref."
            exit 1
          fi

  nuclei:
    name: Nuclei DAST scan
    # Only the protected default branch can supply the active-scan workflow,
    # templates, and owned stand to a scheduled or manual execution.
    needs: verify-trusted-ref
    if: ${{ needs.verify-trusted-ref.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write # Required to upload SARIF to Code Scanning

    steps:
      # The owned stand is built from the checkout, so the full event commit is
      # required; the in-place launcher refuses dirty or mismatched trees.
      - name: Check out the event commit without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify the checked-out event commit
        id: verify-event-commit
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The event commit SHA is unavailable or malformed."
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_EVENT_SHA" ]]; then
            echo "::error::The DAST checkout does not match the event commit."
            exit 1
          fi
          echo "checked_out_sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Select unique owned DAST state directory
        run: |
          state_root="$(python -c 'import tempfile; print(tempfile.gettempdir())')"
          printf 'LIVE_STATE_DIR=%s/ue-live-acceptance/run-%s-%s-dast-nuclei\n' \
            "$state_root" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Start the owned ephemeral DAST stand
        id: start-stand
        env:
          STAND_REF: ${{ steps.verify-event-commit.outputs.checked_out_sha }}
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand up
          --in-place --state-dir "$LIVE_STATE_DIR" --ref "$STAND_REF"
          --stack core

      # Status is read-only; its output stays private on the runner. The
      # launcher prints the loopback base URL that the scanner will receive.
      - name: Read the owned stand status privately
        id: stand-status
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand status
          --in-place --state-dir "$LIVE_STATE_DIR"
          >"$RUNNER_TEMP/dast-stand-status.txt"

      - name: Prepare the owned stand target for Nuclei
        id: nuclei_target
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.quality.dast_privacy prepare-target \
            --status-in "$RUNNER_TEMP/dast-stand-status.txt" \
            --output "$RUNNER_TEMP/nuclei-target.txt"

      - name: Set up Nuclei
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          version: v3.11.1
          # Scan command below validates the owned stand target before scanning.
          install-only: true

      - name: Run Nuclei scan
        id: nuclei_scan
        shell: bash
        run: |
          set -euo pipefail
          nuclei \
            -l "$RUNNER_TEMP/nuclei-target.txt" \
            -t cves/ \
            -t exposures/ \
            -t misconfiguration/ \
            -t vulnerabilities/ \
            -t network/ \
            -severity critical,high,medium,low,info \
            -exclude-tags dos,fuzz \
            -rate-limit 50 \
            -concurrency 10 \
            -timeout 10 \
            -max-host-error 30 \
            -sarif-export "$RUNNER_TEMP/nuclei-results.sarif" \
            -json-export "$RUNNER_TEMP/nuclei-results.json" \
            -trace-log "$RUNNER_TEMP/nuclei-trace.jsonl" \
            -omit-raw \
            -no-color \
            -stats >"$RUNNER_TEMP/nuclei-stdout.log" 2>"$RUNNER_TEMP/nuclei-stderr.log"

      # Stop and remove the owned stand whether or not the scan succeeded.
      # Teardown removes only the signed Compose project resources and volumes.
      - name: Stop and remove the owned DAST stand
        id: stop-stand
        if: ${{ always() && steps.start-stand.outcome != 'skipped' }}
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand teardown
          --in-place --state-dir "$LIVE_STATE_DIR"

      # Trace and scanner logs may contain target details: keep them private on
      # the runner. A response establishes execution, not complete coverage.
      - name: Validate Nuclei scan completion
        if: ${{ always() }}
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.nuclei_scan.outcome }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::DAST checkout does not match the event source."
            exit 1
          fi
          DAST_TARGET_FILE="$RUNNER_TEMP/nuclei-target.txt" \
            python3 -m scripts.quality.dast_privacy verify-scan \
            --trace-in "$RUNNER_TEMP/nuclei-trace.jsonl" \
            --log-in "$RUNNER_TEMP/nuclei-stderr.log" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # Nuclei 3.11.1 emits no SARIF when there are no findings. Require it
      # for every nonempty export while retaining the original clean JSON.
      - name: Validate Nuclei report evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/nuclei_findings_gate.py "$RUNNER_TEMP/nuclei-results.json" \
            --check-sarif "$RUNNER_TEMP/nuclei-results.sarif"

      - name: Sanitize Nuclei reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          DAST_TARGET_FILE="$RUNNER_TEMP/nuclei-target.txt" \
            python3 -m scripts.quality.dast_privacy sanitize \
            --json-in "$RUNNER_TEMP/nuclei-results.json" \
            --sarif-in "$RUNNER_TEMP/nuclei-results.sarif" \
            --json-out nuclei-results.json \
            --sarif-out nuclei-results.sarif

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ success() && hashFiles('nuclei-results.sarif') != '' }}
        with:
          sarif_file: nuclei-results.sarif
          category: nuclei-dast

      - name: Upload sanitized JSON findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nuclei-results-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: nuclei-results.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload sanitized SARIF report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && hashFiles('nuclei-results.sarif') != '' }}
        with:
          name: nuclei-sarif-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: nuclei-results.sarif
          retention-days: 90
          if-no-files-found: error

      # AUD-381: findings are published above first. Medium, high and critical
      # Nuclei findings fail the run; info and low are reported only. A missing
      # or malformed export fails closed because the scan result is then unknown.
      - name: Fail on medium, high or critical Nuclei findings
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/nuclei_findings_gate.py "$RUNNER_TEMP/nuclei-results.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # MOD-W5-07: OWASP ZAP Full Scan — active scan for dynamic discovery
  # Complements Nuclei (CVE/template-based) with active probing for injection,
  # auth bypass, misconfiguration, and other dynamic vulnerabilities.
  #
  # The pinned official image runs privately against the owned loopback stand;
  # only verified projections publish.
  # ---------------------------------------------------------------------------
  zap:
    name: OWASP ZAP Full Scan
    # Keep the same protected-source boundary as the Nuclei active scan.
    needs: verify-trusted-ref
    if: ${{ needs.verify-trusted-ref.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      security-events: write

    steps:
      # The owned stand and the ZAP rules are both read from this exact commit.
      - name: Check out the event commit without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Select unique owned DAST state directory
        run: |
          state_root="$(python -c 'import tempfile; print(tempfile.gettempdir())')"
          printf 'LIVE_STATE_DIR=%s/ue-live-acceptance/run-%s-%s-dast-zap\n' \
            "$state_root" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Start the owned ephemeral DAST stand
        id: start-stand
        env:
          STAND_REF: ${{ github.sha }}
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand up
          --in-place --state-dir "$LIVE_STATE_DIR" --ref "$STAND_REF"
          --stack core

      - name: Read the owned stand status privately
        id: stand-status
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand status
          --in-place --state-dir "$LIVE_STATE_DIR"
          >"$RUNNER_TEMP/dast-stand-status.txt"

      # Verify source and image before scanning, then scan privately.
      # Native reports, context, target and logs never enter the public directory.
      - name: Prepare private ZAP scan and sanitized evidence
        id: zap_prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.quality.zap_workflow prepare \
            --repo-root "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/zap-private" \
            --public "$GITHUB_WORKSPACE/zap-public" \
            --status-in "$RUNNER_TEMP/dast-stand-status.txt" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # Stop and remove the owned stand whether or not the scan succeeded.
      - name: Stop and remove the owned DAST stand
        id: stop-stand
        if: ${{ always() && steps.start-stand.outcome != 'skipped' }}
        run: >-
          uv run --frozen --no-sync python -m scripts.live_stand teardown
          --in-place --state-dir "$LIVE_STATE_DIR"

      - name: Verify ZAP public evidence and provenance
        id: zap_verify
        if: ${{ always() && steps.zap_prepare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.quality.zap_workflow verify \
            --repo-root "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/zap-private" \
            --public "$GITHUB_WORKSPACE/zap-public"

      - name: Upload ZAP SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ always() && steps.zap_prepare.outcome == 'success' && steps.zap_verify.outcome == 'success' }}
        with:
          sarif_file: zap-public/zap-results.sarif
          category: zap-dast

      - name: Upload verified ZAP public evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.zap_prepare.outcome == 'success' && steps.zap_verify.outcome == 'success' }}
        with:
          name: zap-results-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            zap-public/zap-results.sarif
            zap-public/zap-evidence.txt
            zap-public/zap-sarif-provenance.json
          retention-days: 90
          if-no-files-found: error

      # AUD-381: publish verified findings before applying the medium/high gate.
      # No continue-on-error: any earlier failure remains a failed workflow.
      - name: Fail on medium or high ZAP findings
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.quality.zap_workflow gate \
            --repo-root "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/zap-private" \
            --public "$GITHUB_WORKSPACE/zap-public" \
            --summary-file "$GITHUB_STEP_SUMMARY"
