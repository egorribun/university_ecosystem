# MOD-01 (audit Wave 10): SLSA Level 3 non-falsifiable provenance generation.
#
# Triggered on every published GitHub Release.  The slsa-github-generator
# builder runs in an ephemeral, isolated environment so the build provenance is
# cryptographically attestable — fulfilling SLSA Level 3 requirements:
#   - Source: hermetic build from pinned commit
#   - Build: isolated, reproducible build service
#   - Provenance: signed SLSA provenance attestation uploaded to the release
#
# Prerequisites:
#   1. GITHUB_TOKEN must have `packages: write` and `id-token: write` permissions.
#   2. The Docker images referenced below must already exist (pushed by the
#      reusable-build-and-sign.yml workflow that runs before the release tag).
name: SLSA Provenance

on:
  release:
    types: [published]

permissions:
  contents: read   # minimum required for checkout inside reusable workflow

jobs:
  # ── Backend image provenance ────────────────────────────────────────────────
  provenance-backend:
    name: SLSA provenance — backend
    permissions:
      actions: read          # Required by the SLSA generator
      id-token: write        # OIDC token for keyless signing
      packages: write        # Required: push provenance attestation to GHCR
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      image: ghcr.io/${{ github.repository }}/backend
      digest: ${{ github.sha }}  # The actual digest is injected by the reusable caller
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── Frontend image provenance ───────────────────────────────────────────────
  provenance-frontend:
    name: SLSA provenance — frontend
    permissions:
      actions: read
      id-token: write
      packages: write        # Required: push provenance attestation to GHCR
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      image: ghcr.io/${{ github.repository }}/frontend
      digest: ${{ github.sha }}
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── Go service provenance (ws-hub, file-processor, gateway) ────────────────
  provenance-go-services:
    name: SLSA provenance — ${{ matrix.service }}
    permissions:
      actions: read
      id-token: write
      packages: write        # Required: push provenance attestation to GHCR
    strategy:
      matrix:
        service: [ws-hub, file-processor, gateway]
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      image: ghcr.io/${{ github.repository }}/${{ matrix.service }}
      digest: ${{ github.sha }}
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}
