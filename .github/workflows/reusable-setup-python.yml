# Reusable Python Setup Workflow
#
# Call from other workflows:
#   jobs:
#     setup:
#       uses: ./.github/workflows/reusable-setup-python.yml
#       with:
#         python-version: '3.13'
#         install-dev-deps: true

name: Setup Python

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version to install"
                required: false
                type: string
                default: "3.13"
            install-dev-deps:
                description: "Install development dependencies"
                required: false
                type: boolean
                default: false
            working-directory:
                description: "Working directory for pip install"
                required: false
                type: string
                default: "."

permissions: read-all

jobs:
    setup:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

            - name: Setup Python ${{ inputs.python-version }}
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7.1.5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              working-directory: ${{ inputs.working-directory }}
              shell: pwsh
              run: |
                  uv lock --check
                  uv sync --frozen

