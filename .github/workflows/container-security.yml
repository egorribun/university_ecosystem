name: Container security

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-security-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: university-ecosystem-backend
  IMAGE_TAG: scan
  TRIVY_FAIL_SEVERITIES: "HIGH,CRITICAL"

jobs:
  trivy:
    name: Build and scan backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      IMAGE_REF: university-ecosystem-backend:scan
      TRIVY_SEVERITY: HIGH,CRITICAL
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          tags: ${{ env.IMAGE_REF }}
          pull: true
          load: true
          provenance: false

      - name: Capture image size
        id: image_size
        run: |
          set -euo pipefail
          size_bytes=$(docker image inspect ${{ env.IMAGE_REF }} --format='{{.Size}}')
          size_human=$(SIZE_BYTES="$size_bytes" python - <<'PY2'
          import math
          import os
          size = int(os.environ["SIZE_BYTES"])
          units = ["B", "KiB", "MiB", "GiB", "TiB"]
          idx = 0
          while size >= 1024 and idx < len(units) - 1:
              size /= 1024
              idx += 1
          print(f"{size:.2f} {units[idx]}")
          PY2
          )
          printf 'bytes=%s\n' "$size_bytes" >> "$GITHUB_OUTPUT"
          printf 'human=%s\n' "$size_human" >> "$GITHUB_OUTPUT"

      # ── Image scan ────────────────────────────────────────────────────────────
      # SARIF scan: results go to the Security tab. continue-on-error so the
      # filesystem scan always runs even when this step finds vulnerabilities.
      - name: Trivy image scan (SARIF)
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-image.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      # Table scan: prints findings to the CI log so failures are immediately
      # visible without downloading SARIF artifacts. exit-code 0 — never fails.
      - name: Trivy image scan (table — CI log)
        if: always()
        run: |
          trivy image \
            --severity "${{ env.TRIVY_SEVERITY }}" \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --format table \
            --exit-code 0 \
            "${{ env.IMAGE_REF }}"

      # ── Filesystem scan ───────────────────────────────────────────────────────
      - name: Trivy filesystem scan (SARIF)
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Trivy filesystem scan (table — CI log)
        if: always()
        run: |
          trivy fs \
            --severity "${{ env.TRIVY_SEVERITY }}" \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --format table \
            --exit-code 0 \
            .

      # ── Upload & report ───────────────────────────────────────────────────────
      - name: Upload SARIF (image)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload SARIF (filesystem)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-image.sarif
            trivy-fs.sarif

      - name: Job summary
        if: always()
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Container security
          - Image: `${{ env.IMAGE_REF }}`
          - Size: ${{ steps.image_size.outputs.human }}
          - Image scan: ${{ steps.trivy_image.outcome }}
          - Filesystem scan: ${{ steps.trivy_fs.outcome }}
          - Failing severities: `${{ env.TRIVY_SEVERITY }}`
          SUMMARY

      # Explicit failure gate — runs after all scans and uploads so nothing
      # is skipped. Fails the job only when a SARIF scan actually found issues.
      - name: Fail on findings
        if: >-
          always() && (
            steps.trivy_image.outcome == 'failure' ||
            steps.trivy_fs.outcome   == 'failure'
          )
        run: |
          echo "::error::Trivy found ${{ env.TRIVY_SEVERITY }} vulnerabilities."
          echo "Image scan:      ${{ steps.trivy_image.outcome }}"
          echo "Filesystem scan: ${{ steps.trivy_fs.outcome }}"
          echo "Check the table output above and the Security tab for details."
          exit 1
