# Admin visual smoke monitoring (`frontend/scripts/admin-visual-smoke.mjs`).
#
# This workflow performs a real browser-context login with the seeded admin
# account, then runs the app through Caddy, Node SSR, and the backend. It
# verifies five admin routes in English and Russian, each in light and dark
# themes. A capture is valid only when the `/dashboard` bootstrap succeeds,
# the authenticated client route, document language, main landmark, admin
# theme and localized heading match, and a screenshot is written. Hydration
# errors fail the run. Artifacts contain sanitized sidecars and screenshots
# from this invocation only.
#
# Manual runs use `workflow_dispatch`; scheduled runs use Monday 03:00 UTC.
# GitHub requires this workflow file to be present on the repository's default
# branch for schedule and manual activation. A copy that exists only on a
# feature branch is not an active scheduled workflow.
#
# The job starts PostgreSQL, Redis, and NATS services, runs migrations and
# seeds a dedicated admin account, then starts the backend, Node SSR, and
# Caddy. `/api/v1/*` and `/.well-known/*` route to the backend; other requests
# route to Node SSR. The admin account is seeded server-side because public
# registration cannot assign the admin role.
#
# Exit codes: 0 means all 20 captures pass with no hydration errors; 1 means a
# bootstrap, route, locale, or screenshot check failed; 2 means a hydration
# error was found; 3 means the login token is not RS256; 4 means the JWKS
# endpoint has no usable RSA key. The summary step independently checks capture
# completeness and page/screenshot readiness before the workflow concludes.
name: Admin Smoke Monitoring (Linux Periodic)

on:
  workflow_dispatch: {}
  schedule:
    # Mondays 03:00 UTC = ~06:00 Moscow weekly
    # Cron format: minute hour day-of-month month day-of-week
    # `0 3 * * 1` = run at 03:00 UTC every Monday
    - cron: "0 3 * * 1"

permissions: read-all

concurrency:
  group: admin-smoke-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-smoke:
    name: Admin React #418 monitoring
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Backend env mirrors the local visual-audit stack configuration.
      SECRET_KEY: "dummy_secret_key_for_admin_smoke_monitoring_at_least_32_chars" # pragma: allowlist secret
      ENVIRONMENT: testing
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test_admin_smoke" # pragma: allowlist secret
      UE_SEED_TARGET: admin-smoke
      OTEL_SDK_DISABLED: "true"
      ALGORITHM: "RS256"
      JWT_PRIVATE_KEY_PATH: ".secrets/jwt_rs256.pem"
      # Explicit NATS_URL for the localhost NATS service.
      NATS_URL: "nats://127.0.0.1:4222"
      # Explicit Redis URLs. Login flow uses redis_session via
      # rate_limit_storage_uri (defaults to "memory://" if unset → invalid URL
      # scheme → HTTP 500 on login). Must set explicitly.
      CACHE_REDIS_URL: "redis://127.0.0.1:6379/0"
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: "redis://127.0.0.1:6379/1"
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test # pragma: allowlist secret
          POSTGRES_DB: test_admin_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_admin_smoke"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # NATS required for backend lifespan (NatsTaskBroker can't be skipped via
      # env-flag; Dishka-injected dependency).
      nats:
        image: nats:2.10.25-alpine@sha256:3290c829aa05ddd4da12026783ccaff86f3fbc1f0551722908a934c293cd6228
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget -q -O - http://localhost:8222/varz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Install wasm-pack
        # Use the rustwasm installer; the alternate installer can resolve to a
        # retired download URL.
        uses: taiki-e/install-action@54420ca6e3a4cab262aeabc1af4f52908ca28931 # wasm-pack
        with:
          tool: wasm-pack@0.13.1

      - name: Setup Rust toolchain
        # Keep generated WASM reproducible when the hosted stable channel
        # advances; checked-in consumers enforce byte-exact provenance.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # pinned action
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build WASM modules
        # Retry transient binaryen download failures three times with a 10s
        # backoff; each build is idempotent and can reuse the binaryen cache.
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            if wasm-pack build rust-crypto --target web && \
               wasm-pack build wasm-sanitizer --target web; then
              echo "OK: WASM modules built (attempt $attempt)"
              exit 0
            fi
            echo "WASM build failed on attempt $attempt; retrying after 10s..."
            sleep 10
          done
          echo "::error::WASM build failed after 3 attempts"
          exit 1

      - name: Generate RS256 keypair
        # Generate the same kind of test-only RS256 key used by visual-audit.yml.
        run: |
          mkdir -p .secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out .secrets/jwt_rs256.pem
          ls -la .secrets/jwt_rs256.pem
          echo "OK: RS256 keypair generated"

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Build frontend (E2E reduced-chrome mode, NOT VITE_LHCI bypass)
        # Use the same VITE_E2E_MODE=1 build as visual-audit.yml to keep the
        # built app mode and tree-shake checks consistent between browser lanes.
        #
        # Tree-shake invariants verified post-build:
        # 1. VITE_LHCI bypass STAYS tree-shaken (zero `lhci-mock-user` in dist
        #    — admin smoke uses REAL admin user auth, not mock-user bypass)
        # 2. VITE_E2E_MODE branch IS bundled (`data-e2e-stub` markers present)
        working-directory: frontend
        env:
          FRONTEND_BUILD_MAX_RSS_MB: "2048"
          FRONTEND_BUILD_MAX_OLD_SPACE_MB: "1536"
          VITE_BACKEND_ORIGIN: http://localhost
          VITE_E2E_MODE: "1"
        run: |
          npm run build
          if find dist/client/assets -name "*.js" -exec grep -l "lhci-mock-user" {} + 2>/dev/null | grep -q .; then
            echo "::error::VITE_LHCI tree-shake invariant violated — E2E build contains LHCI mock-user reference"
            exit 1
          fi
          echo "OK: VITE_LHCI bypass tree-shaken cleanly"
          if ! find dist/client/assets -name "*.js" -exec grep -l "data-e2e-stub" {} + 2>/dev/null | grep -q .; then
            echo "::error::VITE_E2E_MODE flag did NOT take effect — dist lacks data-e2e-stub markers"
            exit 1
          fi
          echo "OK: VITE_E2E_MODE=1 took effect (data-e2e-stub markers present in dist)"

      - name: Install Playwright real Chrome
        # The smoke prefers real Chrome and keeps bundled Chromium installed as
        # a fallback; the separate visual-audit lane uses bundled Chromium.
        working-directory: frontend
        run: bash ../scripts/ci/install-playwright-with-deps.sh chromium chrome

      - name: Start backend
        # Mirrors visual-audit.yml:285-287.
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level debug > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend health
        # Probe the backend readiness endpoint.
        # 180s timeout (90 × 2s) — backend startup includes lifespan with NATS
        # connect + potential service discovery delays.
        run: |
          # shellcheck disable=SC2009
          for i in {1..90}; do
            if curl -sf http://127.0.0.1:8000/health/ready > /dev/null; then
              echo "OK: backend ready after $i attempts (~$(( i * 2 ))s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend failed to start within 180s"
          echo "---backend-log-tail---"
          tail -200 /tmp/backend.log 2>&1 || echo "(no /tmp/backend.log file)"
          echo "---ps-aux-uvicorn---"
          pgrep -fa uvicorn 2>&1 | head -5 || echo "(no uvicorn process)"
          exit 1

      - name: Verify JWKS endpoint
        # The canonical JWKS endpoint must serve at least one usable RS256 key.
        # The smoke exits with code 4 when the key set is empty or unusable.
        run: |
          if ! curl -sf http://127.0.0.1:8000/.well-known/jwks.json | python -c "import sys, json; d = json.load(sys.stdin); keys = d.get('keys', []); assert len(keys) > 0, 'JWKS empty'; print(f'OK: JWKS has {len(keys)} key(s)')"; then
            echo "::error::JWKS endpoint not serving keys (RS256 backend setup broken)"
            exit 1
          fi

      - name: Generate masked admin smoke password
        id: admin_smoke_password
        shell: bash
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32) + "!Aa0")')"
          printf '::add-mask::%s\n' "$password"
          printf 'password=%s\n' "$password" >> "$GITHUB_OUTPUT"

      - name: Seed demo data
        # Base demo content does not need the ephemeral admin password.
        run: |
          uv run python scripts/seed_demo_data.py
          echo "OK: demo data seeded"

      - name: Seed demo admin user
        # Reuse the run-scoped password for the real browser login.
        env:
          TEST_PASSWORD: ${{ steps.admin_smoke_password.outputs.password }}
        run: uv run python scripts/seed_admin_data.py

      - name: Start frontend Node SSR
        # Start the production Node SSR server on :3000.
        working-directory: frontend
        env:
          NODE_ENV: production
          PORT: "3000"
          HOST: "0.0.0.0"
        run: |
          npm run start &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend Node SSR health
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3000/healthz > /dev/null; then
              echo "OK: frontend Node SSR ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "::error::Frontend Node SSR failed to start within 60s"
          exit 1

      - name: Start Caddy ingress
        # Mirrors visual-audit.yml:395-433 — Caddy on :80 routes:
        #   /api/v1/*       → backend :8000
        #   /.well-known/*  → backend :8000
        #   default         → Node SSR :3000
        # `--network host` so caddy reaches 127.0.0.1 directly.
        run: |
          cat > /tmp/Caddyfile <<'EOF'
          {
            auto_https off
            admin off
          }
          :80 {
            handle /api/v1/* {
              reverse_proxy 127.0.0.1:8000
            }
            handle /.well-known/* {
              reverse_proxy 127.0.0.1:8000
            }
            handle {
              reverse_proxy 127.0.0.1:3000
            }
          }
          EOF
          docker run -d --name caddy --network host -v /tmp/Caddyfile:/etc/caddy/Caddyfile caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          for i in {1..15}; do
            if curl -sf http://localhost/healthz > /dev/null && curl -sf http://localhost/.well-known/jwks.json > /dev/null; then
              echo "OK: Caddy ingress reachable + proxying correctly"
              exit 0
            fi
            echo "Waiting for Caddy proxy... ($i/15)"
            sleep 2
          done
          echo "::error::Caddy proxy chain not reachable"
          docker logs caddy || true
          exit 1

      - name: Run admin smoke script
        # admin-visual-smoke.mjs hardcodes 5 admin routes × 2 locales ×
        # 2 themes = 20 captures. Each invocation writes to a fresh run-owned
        # directory and exposes only that directory to this workflow attempt.
        #
        # `continue-on-error: true` → artifact upload always runs (script exit
        # codes 1-4 indicate violations; we want the sidecar JSONs).
        # The "Re-assert smoke result" step below propagates non-zero exit to
        # workflow status so scheduled cron failures show up red in Actions UI.
        id: smoke
        working-directory: frontend
        env:
          ORIGIN: http://localhost
          TEST_EMAIL: admin@university.dev
          TEST_PASSWORD: ${{ steps.admin_smoke_password.outputs.password }}
        run: node ./scripts/admin-visual-smoke.mjs
        continue-on-error: true

      - name: Backend log diagnostic dump
        # Always include a bounded backend log tail for smoke failure triage.
        if: always()
        run: |
          echo "---backend-log-tail---"
          tail -300 /tmp/backend.log 2>&1 || echo "(no /tmp/backend.log file)"

      - name: Print summary table
        # Reads only this attempt's run directory and emits sanitized capture
        # status to $GITHUB_STEP_SUMMARY; old PNGs and sidecars are not included.
        if: always()
        id: summary
        working-directory: frontend
        env:
          ADMIN_SMOKE_DIR: ${{ steps.smoke.outputs.artifact_dir }}
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const workspaceRelativeDir = process.env.ADMIN_SMOKE_DIR;
            const publishFailure = (failed) => {
              if (process.env.GITHUB_OUTPUT) {
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `failed=${failed}\n`);
              }
            };
            if (!workspaceRelativeDir) {
              console.log("No sidecar JSONs to summarize (script may have failed before producing reports)");
              publishFailure(true);
              process.exit(0);
            }
            const dir = path.resolve("..", workspaceRelativeDir);
            if (!fs.existsSync(dir)) {
              console.log("Current admin smoke run directory is missing");
              publishFailure(true);
              process.exit(0);
            }
            const files = fs.readdirSync(dir).filter((f) => f.endsWith(".json"));
            if (files.length === 0) {
              console.log("No capture JSON sidecars found in the current run");
              publishFailure(true);
              process.exit(0);
            }
            const summary = process.env.GITHUB_STEP_SUMMARY;
            const lines = [];
            lines.push("## Admin Smoke Monitoring Results (Linux Periodic)");
            lines.push("");
            lines.push("Routes captured: 5 admin routes × 2 locales × 2 themes = 20 expected.");
            lines.push("React hydration detection matches minified React error IDs and hydration-related messages.");
            lines.push("");
            lines.push("| Path | Locale | Theme | Bootstrap /dashboard HTTP | Auth | Page | Screenshot | Hydr err | Console err | Net req |");
            lines.push("|---|---|---|---:|---|---|---|---:|---:|---:|");
            let totalHydration = 0;
            let captureFailed = 0;
            const locales = new Set();
            for (const f of files.sort()) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
                const p = r.path ?? "?";
                const locale = r.locale ?? "?";
                if (locale === "en" || locale === "ru") locales.add(locale);
                const theme = r.theme ?? "?";
                const http = r.bootstrapHttpStatus ?? "-";
                const adminRoleConfirmed = r.adminRoleConfirmed === true;
                const authed = r.redirectedToLogin ? "REDIRECT" : adminRoleConfirmed ? "ADMIN" : "UNVERIFIED";
                const pageReady = r.pageReadiness?.ready === true;
                const hasScreenshot = Boolean(r.screenshotPath);
                const hyd = r.hydrationErrorCount ?? 0;
                const cons = r.consoleErrorCount ?? 0;
                const net = r.networkRequestCount ?? 0;
                if (hyd > 0) totalHydration += hyd;
                if (r.bootstrapPath !== "/dashboard" || http !== 200 || !adminRoleConfirmed || r.redirectedToLogin || !pageReady || !hasScreenshot) captureFailed++;
                lines.push(`| ${p} | ${locale} | ${theme} | ${http} | ${authed} | ${pageReady ? "READY" : "FAIL"} | ${hasScreenshot ? "yes" : "no"} | ${hyd} | ${cons} | ${net} |`);
              } catch {
                captureFailed++;
                lines.push(`| (${f}) | - | - | - | - | FAIL | no | - | - | - |`);
              }
            }
            const incomplete = files.length !== 20 || locales.size !== 2;
            const monitoringFailed = captureFailed > 0 || incomplete || totalHydration > 0;
            lines.push("");
            if (totalHydration > 0) {
              lines.push(`⚠ **${totalHydration} hydration error(s) detected across ${files.length} capture(s)** — review the current-run screenshots and sanitized sidecars.`);
            }
            if (captureFailed > 0) {
              lines.push(`⚠ **${captureFailed} capture(s) failed** — require a verified admin login, HTTP 200 from /dashboard, authenticated routing, a ready page, and a written screenshot.`);
            }
            if (incomplete) {
              lines.push(`⚠ **Incomplete run: ${files.length}/20 captures and ${locales.size}/2 locales found.**`);
            }
            if (!monitoringFailed) {
              lines.push(`✅ **All ${files.length} captures clean** (bootstrap HTTP 200 + authenticated + ready page + screenshot + 0 hydration errors).`);
            } else {
              lines.push("❌ **Admin smoke monitoring failed; inspect the current run artifact.**");
            }
            const out = lines.join("\n");
            console.log(out);
            if (summary) {
              fs.appendFileSync(summary, out + "\n");
            }
            publishFailure(monitoringFailed);
          '

      - name: Terminate background processes
        if: always()
        run: |
          if [ -n "$BACKEND_PID" ]; then kill "$BACKEND_PID" 2>/dev/null || true; fi
          if [ -n "$FRONTEND_PID" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
          docker rm -f caddy 2>/dev/null || true

      - name: Upload smoke reports
        # 30-day retention (vs visual-audit's 14) — enables quarterly trend
        # analysis if React #418 re-emerges sporadically.
        # `.screenshots/` is hidden, so include-hidden-files keeps the report
        # and screenshots available in the uploaded artifact.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-smoke-reports
          path: ${{ steps.smoke.outputs.artifact_dir }}
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true

      - name: Re-assert smoke result
        # Propagate script or summary failures after the summary and artifact
        # upload steps have run, so scheduled runs are visible as failed.
        if: always() && (steps.smoke.outcome == 'failure' || steps.summary.outputs.failed == 'true')
        run: |
          echo "::error::Admin smoke detected a bootstrap, route, locale, screenshot, or hydration violation. Review the step summary and current-run artifact."
          exit 1
