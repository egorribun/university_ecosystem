# Wave 171 SW1 — Admin React #418 monitoring (wave165-admin-visual-smoke.mjs).
#
# ## Why this exists
#
# W169 SW2+SW5 captured 30 admin pages × 0 React #418 firings on byte-equivalent
# bundle — characterized W168 SW2 finding (`/admin/audit light` text-content
# residual) as **non-reproducible / transient timing race** per W141 #4 honest
# framing. Per W170 §Honesty + plan-time discussion: "non-reproducible ≠ proven
# absent". The operational counterpart is **periodic CI monitoring** that fires
# automatically if React #418 ever re-emerges in scheduled smoke runs.
#
# This workflow runs `frontend/scripts/wave165-admin-visual-smoke.mjs` (W165 SW3)
# on a Linux runner against the full authed Caddy→Node SSR chain on a weekly
# cadence. If any of the 10 captures (5 admin routes × 2 themes) shows a
# Minified React error #418 (W167 SW1 regex catches #418-#427 hydration boundary
# class), the workflow FAILS and uploads sidecar JSONs as artifacts for triage.
#
# Pre-considered scope per W170 hand-off priority #3 (Q0 D deferred from W170).
# Closes W169 §Honesty residual "admin React #418 non-reproducible ≠ proven
# absent" **operationally** (not absolute closure — monitoring infrastructure
# ships; future scheduled cron firings provide empirical evidence over time).
#
# ## Triggers
#
# 1. `workflow_dispatch` — manual run via Actions UI / `gh workflow run`. Used
#    for first-pass validation post-merge + on-demand triage after suspected
#    regression.
#
# 2. `schedule: cron("0 3 * * 1")` — Mondays 03:00 UTC = ~06:00 Moscow weekly.
#    Rationale: weekly balances early detection vs CI cost (~20-25 min/run ×
#    4 weeks/month = ~80-100 min/month). Off-peak timing reduces shared runner
#    contention. Could be revisited as monthly (cost concern) or daily (if
#    React #418 risk perceived higher).
#
#    **CRITICAL**: scheduled cron triggers require the workflow file to exist
#    on the default branch (main) per GitHub Actions limitation. Workflow on
#    feature branch (egorribun) is INERT — neither cron NOR workflow_dispatch
#    will fire until: (a) PR #1114 merges to main (automatic activation
#    Recommended), OR (b) user-authorized cherry-pick to main per W139 SW1
#    precedent (commit 4db94fb5a cherry-picked visual-audit.yml). See
#    AUDIT_WAVE171.md §Honesty caveat #11 + Wave 172+ hand-off Path A/B.
#
# ## Architecture
#
# Mirrors visual-audit.yml infrastructure (W139 SW1 + W140 SW4 iter cycles)
# but invokes wave165 (admin smoke) instead of wave138 (visual a11y audit):
#
#   - backend: `uv run uvicorn` on :8000 (mirrors reusable-e2e-tests.yml)
#   - frontend Node SSR: `npm run start` on :3000 (W131 SW1 server-prod.mjs)
#   - Caddy ingress: `docker run caddy --network host` on :80
#     routes /api/v1/* + /.well-known/* → :8000, default → :3000
#   - postgres + redis + nats: GitHub Actions `services:`
#
# ## Key differences from visual-audit.yml (4 items)
#
# 1. **Trigger**: workflow_dispatch + `schedule: cron("0 3 * * 1")` (visual-audit
#    is workflow_dispatch only — on-demand debug, not periodic monitoring).
#
# 2. **User seeding**: NEW `uv run python scripts/seed_demo_data.py` +
#    `uv run python scripts/seed_admin_data.py` (visual-audit uses CSRF dance for
#    test@university.dev via /api/v1/auth/register). The admin user has a `role`
#    attribute that can't be set via the public register endpoint; must be seeded
#    via the backend Python script. Both scripts are idempotent.
#
# 3. **Script invocation**: `wave165-admin-visual-smoke.mjs` (visual-audit
#    invokes wave138-visual-audit.mjs). Different scripts:
#      - wave138: 8 SSR routes, axe a11y, test user
#      - wave165: 5 admin routes × 2 themes, React #418 detection, admin user
#
# 4. **Artifact path + retention**: `.screenshots/wave165-admin-visual-smoke` +
#    30-day retention (visual-audit: 14 days). Longer retention enables
#    quarterly trend analysis if needed. `include-hidden-files: true` defensive
#    per W160 SW1 (z) — `.screenshots/` is hidden dir; actions/upload-artifact@v7
#    strips hidden contents by default.
#
# ## Exit code semantics (wave165 line 562-575)
#
#   0 = clean (all 10 captures HTTP 200 + 0 hydration errors)
#   1 = HTTP-failed (non-200 OR redirected to /login on ≥1 capture)
#   2 = hydration-detected (≥1 capture had Minified React error #418 OR similar)
#   3 = JWT-not-RS256 (backend RS256 setup broken)
#   4 = JWKS-empty (JWKS endpoint not serving keys)
#
# `continue-on-error: true` on the script step → artifacts always upload.
# Final "Re-assert smoke result" step propagates non-zero exit to workflow
# status so scheduled cron failures show up red in Actions UI immediately.
name: Admin Smoke Monitoring (Linux Periodic)

on:
  workflow_dispatch: {}
  schedule:
    # Mondays 03:00 UTC = ~06:00 Moscow weekly
    # Cron format: minute hour day-of-month month day-of-week
    # `0 3 * * 1` = run at 03:00 UTC every Monday
    - cron: "0 3 * * 1"

permissions: read-all

concurrency:
  group: admin-smoke-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-smoke:
    name: Admin React #418 monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Backend env — MIRRORS visual-audit.yml:80-104 EXACTLY (W139 SW2 + W140
      # SW4 iter6 lessons preserved verbatim).
      SECRET_KEY: "dummy_secret_key_for_admin_smoke_monitoring_at_least_32_chars" # pragma: allowlist secret
      ENVIRONMENT: testing
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test_admin_smoke" # pragma: allowlist secret
      OTEL_SDK_DISABLED: "true"
      ALGORITHM: "RS256"
      JWT_PRIVATE_KEY_PATH: ".secrets/jwt_rs256.pem"
      # W139 SW3 iter2: explicit NATS_URL pointing at the localhost NATS service.
      NATS_URL: "nats://127.0.0.1:4222"
      # W140 SW4 iter6: explicit Redis URLs. Login flow uses redis_session via
      # rate_limit_storage_uri (defaults to "memory://" if unset → invalid URL
      # scheme → HTTP 500 on login). Must set explicitly.
      CACHE_REDIS_URL: "redis://127.0.0.1:6379/0"
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: "redis://127.0.0.1:6379/1"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test # pragma: allowlist secret
          POSTGRES_DB: test_admin_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # NATS required for backend lifespan (NatsTaskBroker can't be skipped via
      # env-flag; Dishka-injected dependency).
      nats:
        image: nats:2.10.25-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget -q -O - http://localhost:8222/varz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Install wasm-pack
        # W141 polish-v2: rustwasm canonical curl installer (taiki-e/install-action
        # hardcodes drager URL → 404 since 2026-05-11).
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build WASM modules
        # W139 (z) #5 + W140 SW4 iter3: binaryen download flake → 3-attempt retry
        # with 10s backoff. Each build idempotent (binaryen cache reused).
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            if wasm-pack build rust-crypto --target web && \
               wasm-pack build wasm-sanitizer --target web; then
              echo "OK: WASM modules built (attempt $attempt)"
              exit 0
            fi
            echo "WASM build failed on attempt $attempt; retrying after 10s..."
            sleep 10
          done
          echo "::error::WASM build failed after 3 attempts"
          exit 1

      - name: Generate RS256 keypair
        # Mirrors start-docker.ps1 New-JwtRs256Key (W137 SW1) + visual-audit.yml.
        run: |
          mkdir -p .secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out .secrets/jwt_rs256.pem
          ls -la .secrets/jwt_rs256.pem
          echo "OK: RS256 keypair generated"

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Build frontend (E2E reduced-chrome mode, NOT VITE_LHCI bypass)
        # Wave 171 SW1 — same VITE_E2E_MODE=1 build as visual-audit.yml (W141 SW1
        # reduced MainLayout pattern). For admin smoke this matters less than for
        # axe a11y (wave165 doesn't run axe), but consistency with visual-audit
        # build avoids dist-mode divergence + keeps tree-shake invariants stable.
        #
        # Tree-shake invariants verified post-build:
        # 1. VITE_LHCI bypass STAYS tree-shaken (zero `lhci-mock-user` in dist
        #    — admin smoke uses REAL admin user auth, not mock-user bypass)
        # 2. VITE_E2E_MODE branch IS bundled (`data-e2e-stub` markers present)
        working-directory: frontend
        env:
          VITE_BACKEND_ORIGIN: http://localhost
          VITE_E2E_MODE: "1"
        run: |
          npm run build
          if find dist/client/assets -name "*.js" -exec grep -l "lhci-mock-user" {} + 2>/dev/null | grep -q .; then
            echo "::error::VITE_LHCI tree-shake invariant violated — E2E build contains LHCI mock-user reference"
            exit 1
          fi
          echo "OK: VITE_LHCI bypass tree-shaken cleanly"
          if ! find dist/client/assets -name "*.js" -exec grep -l "data-e2e-stub" {} + 2>/dev/null | grep -q .; then
            echo "::error::VITE_E2E_MODE flag did NOT take effect — dist lacks data-e2e-stub markers"
            exit 1
          fi
          echo "OK: VITE_E2E_MODE=1 took effect (data-e2e-stub markers present in dist)"

      - name: Install Playwright real Chrome
        # Wave 165 explicitly uses `channel: "chrome"` (real Chrome) NOT bundled
        # Chromium (wave165.mjs:486-490). On Linux runners both are available;
        # we install both for fallback. Note: visual-audit.yml uses bundled
        # chromium only (wave138 needs that path for axe-core compat); admin
        # smoke (wave165) uses real Chrome for visual fidelity.
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium chrome

      - name: Start backend
        # Mirrors visual-audit.yml:285-287.
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level debug > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend health
        # W140 SW4 iter3 fix: /health/ready (NOT /health which 404s).
        # 180s timeout (90 × 2s) — backend startup includes lifespan with NATS
        # connect + potential service discovery delays.
        run: |
          # shellcheck disable=SC2009
          for i in {1..90}; do
            if curl -sf http://127.0.0.1:8000/health/ready > /dev/null; then
              echo "OK: backend ready after $i attempts (~$(( i * 2 ))s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend failed to start within 180s"
          echo "---backend-log-tail---"
          tail -200 /tmp/backend.log 2>&1 || echo "(no /tmp/backend.log file)"
          echo "---ps-aux-uvicorn---"
          ps aux | grep -i uvicorn 2>&1 | head -5 || echo "(no uvicorn process)"
          exit 1

      - name: Verify JWKS endpoint
        # JWKS endpoint MUST serve at least 1 RS256 key. wave165 (lines 165-184)
        # checks /.well-known/jwks.json (the canonical RFC 8615 path); exit 4
        # if 0 keys returned.
        run: |
          if ! curl -sf http://127.0.0.1:8000/.well-known/jwks.json | python -c "import sys, json; d = json.load(sys.stdin); keys = d.get('keys', []); assert len(keys) > 0, 'JWKS empty'; print(f'OK: JWKS has {len(keys)} key(s)')"; then
            echo "::error::JWKS endpoint not serving keys (RS256 backend setup broken)"
            exit 1
          fi

      - name: Seed demo data + admin user
        # Wave 171 SW1 — CRITICAL DIFFERENCE from visual-audit.yml (which uses
        # CSRF dance for test@university.dev via /api/v1/auth/register).
        #
        # Admin user has a `role` attribute (UserRole.ADMIN) that CANNOT be set
        # via the public /api/v1/auth/register endpoint (default role is
        # "student" per backend). Must be seeded via backend Python script
        # `scripts/seed_admin_data.py` which uses get_password_hash_sync +
        # async_session directly.
        #
        # seed_admin_data.py depends on base groups from seed_demo_data.py (line
        # 4 of seed_admin_data.py docstring + line 254 `select(Group)` lookup).
        # Both scripts are idempotent (catch IntegrityError on unique-constraint
        # violations).
        #
        # Credentials: admin@university.dev / Admin@2024test (seed_admin_data.py:61-62).
        # These match the wave165 script defaults (wave165.mjs:124-125).
        run: |
          uv run python scripts/seed_demo_data.py
          uv run python scripts/seed_admin_data.py
          echo "OK: demo + admin user seeded"

      - name: Start frontend Node SSR
        # W131 SW1 server-prod.mjs on :3000.
        working-directory: frontend
        env:
          NODE_ENV: production
          PORT: "3000"
          HOST: "0.0.0.0"
        run: |
          npm run start &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend Node SSR health
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3000/healthz > /dev/null; then
              echo "OK: frontend Node SSR ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "::error::Frontend Node SSR failed to start within 60s"
          exit 1

      - name: Start Caddy ingress
        # Mirrors visual-audit.yml:395-433 — Caddy on :80 routes:
        #   /api/v1/*       → backend :8000
        #   /.well-known/*  → backend :8000
        #   default         → Node SSR :3000
        # `--network host` so caddy reaches 127.0.0.1 directly.
        run: |
          cat > /tmp/Caddyfile <<'EOF'
          {
            auto_https off
            admin off
          }
          :80 {
            handle /api/v1/* {
              reverse_proxy 127.0.0.1:8000
            }
            handle /.well-known/* {
              reverse_proxy 127.0.0.1:8000
            }
            handle {
              reverse_proxy 127.0.0.1:3000
            }
          }
          EOF
          docker run -d --name caddy --network host -v /tmp/Caddyfile:/etc/caddy/Caddyfile caddy:2.11.2-alpine
          for i in {1..15}; do
            if curl -sf http://localhost/healthz > /dev/null && curl -sf http://localhost/.well-known/jwks.json > /dev/null; then
              echo "OK: Caddy ingress reachable + proxying correctly"
              exit 0
            fi
            echo "Waiting for Caddy proxy... ($i/15)"
            sleep 2
          done
          echo "::error::Caddy proxy chain not reachable"
          docker logs caddy || true
          exit 1

      - name: Run admin smoke script
        # Wave 165 (wave165-admin-visual-smoke.mjs) hardcodes 5 admin routes ×
        # 2 themes = 10 captures. No ROUTES env override (admin scope is FIXED
        # by definition — wave165:131-137 ADMIN_ROUTES const).
        #
        # `continue-on-error: true` → artifact upload always runs (script exit
        # codes 1-4 indicate violations; we want the sidecar JSONs).
        # The "Re-assert smoke result" step below propagates non-zero exit to
        # workflow status so scheduled cron failures show up red in Actions UI.
        id: smoke
        working-directory: frontend
        env:
          ORIGIN: http://localhost
          TEST_EMAIL: admin@university.dev
          TEST_PASSWORD: Admin@2024test # pragma: allowlist secret
        run: node ./scripts/wave165-admin-visual-smoke.mjs
        continue-on-error: true

      - name: Backend log diagnostic dump
        # W140 SW4 iter5 pattern: tail last 300 lines of /tmp/backend.log
        # unconditionally for triage on smoke failure.
        if: always()
        run: |
          echo "---backend-log-tail---"
          tail -300 /tmp/backend.log 2>&1 || echo "(no /tmp/backend.log file)"

      - name: Print summary table
        # Reads .screenshots/wave165-admin-visual-smoke/*.json sidecar files +
        # emits markdown to $GITHUB_STEP_SUMMARY. Sidecar shape per
        # wave165.mjs:408-420: path, theme, httpStatus, finalUrl,
        # redirectedToLogin, consoleErrorCount, hydrationErrorCount,
        # networkRequestCount, screenshotPath, sampleErrors, navError.
        if: always()
        working-directory: frontend
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = ".screenshots/wave165-admin-visual-smoke";
            if (!fs.existsSync(dir)) {
              console.log("No sidecar JSONs to summarize (script may have failed before producing reports)");
              process.exit(0);
            }
            const files = fs.readdirSync(dir).filter((f) => f.endsWith(".json"));
            if (files.length === 0) {
              console.log("No JSON sidecars found");
              process.exit(0);
            }
            const summary = process.env.GITHUB_STEP_SUMMARY;
            const lines = [];
            lines.push("## Admin Smoke Monitoring Results (Linux Periodic)");
            lines.push("");
            lines.push("Routes captured: 5 admin routes × 2 themes = 10 expected.");
            lines.push("React #418 detection via W167 SW1 regex /Minified React error #\\d+/ + hydration substring matches.");
            lines.push("");
            lines.push("| Path | Theme | HTTP | Auth | Hydr err | Console err | Net req |");
            lines.push("|---|---|---|---|---|---|---|");
            let totalHydration = 0;
            let totalFailed = 0;
            for (const f of files.sort()) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
                const p = r.path ?? "?";
                const theme = r.theme ?? "?";
                const http = r.httpStatus ?? "-";
                const authed = r.redirectedToLogin ? "REDIRECT" : "AUTHED";
                const hyd = r.hydrationErrorCount ?? 0;
                const cons = r.consoleErrorCount ?? 0;
                const net = r.networkRequestCount ?? 0;
                if (hyd > 0) totalHydration += hyd;
                if (http !== 200 || r.redirectedToLogin) totalFailed++;
                lines.push(`| ${p} | ${theme} | ${http} | ${authed} | ${hyd} | ${cons} | ${net} |`);
              } catch (e) {
                lines.push(`| (${f}) | - | - | - | - | parse-error | - |`);
              }
            }
            lines.push("");
            if (totalHydration > 0) {
              lines.push(`⚠ **${totalHydration} hydration error(s) detected across ${files.length} capture(s)** — React #418 re-emergence suspected. Review artifacts + run Wave 172+ triage.`);
            } else if (totalFailed > 0) {
              lines.push(`⚠ **${totalFailed} capture(s) returned non-200 OR redirected to /login** — auth/SSR setup may be broken.`);
            } else {
              lines.push(`✅ **All ${files.length} captures clean** (HTTP 200 + AUTHED + 0 hydration errors). W169 §Honesty residual non-reproducibility re-confirmed.`);
            }
            const out = lines.join("\n");
            console.log(out);
            if (summary) {
              fs.appendFileSync(summary, out + "\n");
            }
          '

      - name: Terminate background processes
        if: always()
        run: |
          if [ -n "$BACKEND_PID" ]; then kill "$BACKEND_PID" 2>/dev/null || true; fi
          if [ -n "$FRONTEND_PID" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
          docker rm -f caddy 2>/dev/null || true

      - name: Upload smoke reports
        # 30-day retention (vs visual-audit's 14) — enables quarterly trend
        # analysis if React #418 re-emerges sporadically.
        # include-hidden-files: true is DEFENSIVE per W160 SW1 (z) lesson —
        # `.screenshots/` starts with "." (hidden dir per actions/upload-artifact@v7
        # behavior). Current visual-audit.yml doesn't set the flag and works,
        # but defensive cost is zero (1 line).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-smoke-reports
          path: frontend/.screenshots/wave165-admin-visual-smoke
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true

      - name: Re-assert smoke result
        # Propagates non-zero exit from wave165 script to workflow status.
        # `continue-on-error: true` on the script step keeps artifacts uploading
        # on failure, but we need the workflow to FAIL (red in Actions UI) if
        # any captures hit React #418 / HTTP failures so scheduled cron alerts
        # are visible. Last step so artifact + summary already ran.
        if: always() && steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Admin smoke detected violations (wave165 exit code != 0). Review the Step Summary table above + the uploaded artifact for sidecar JSONs. If hydration errors > 0 on any capture, W169 §Honesty residual has re-emerged — file W172+ triage wave."
          exit 1
