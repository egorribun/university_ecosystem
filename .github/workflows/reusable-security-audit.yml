# Reusable Security Audit Workflow
name: Security Audit

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for pip-audit"
        required: false
        type: string
        default: "3.14"
      node-version:
        description: "Node.js version for npm audit"
        required: false
        type: string
        default: "24"
      run-pip-audit:
        description: "Run pip-audit for Python dependencies"
        required: false
        type: boolean
        default: true
      run-npm-audit:
        description: "Run npm audit for Node.js dependencies"
        required: false
        type: boolean
        default: true

jobs:
  pip-audit:
    name: Python Dependency Audit
    if: ${{ inputs.run-pip-audit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group security

      - name: Export Python requirements
        run: uv export --frozen --no-hashes --no-dev --no-emit-workspace > /tmp/requirements.txt

      - name: Run Python known-vulnerability allowlist gate
        shell: bash
        run: |
          set +e
          pip_audit_status=1
          for attempt in 1 2 3; do
            rm -f /tmp/pip-audit.json
            uv run --frozen --no-sync pip-audit \
              --strict \
              --no-deps \
              --disable-pip \
              --requirement /tmp/requirements.txt \
              --format json \
              --aliases on \
              --desc off \
              --progress-spinner off \
              --vulnerability-service osv \
              --output /tmp/pip-audit.json
            pip_audit_status=$?
            # OSV outages can fail before pip-audit writes a report. Retry only
            # that operationally incomplete case; a valid report always reaches
            # the fail-closed allowlist validator, including real advisories.
            if [[ "$pip_audit_status" -eq 0 || -s /tmp/pip-audit.json ]]; then
              break
            fi
            echo "::warning::pip-audit produced no report (attempt $attempt/3); retrying OSV query"
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 15))
            fi
          done
          set -e
          uv run --frozen --no-sync python scripts/check_dependency_audit_report.py pip \
            --report /tmp/pip-audit.json \
            --scanner-status "$pip_audit_status" \
            --allowlist security/audit-allowlist.yaml

  npm-audit:
    name: Node.js Dependency Audit
    if: ${{ inputs.run-npm-audit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          Set-Location ..
          uv sync --frozen

      - name: Run npm audit with allowlist
        shell: pwsh
        run: |
          Set-Location ..
          uv run python scripts/audit_dependencies.py `
            --allowlist security/audit-allowlist.yaml `
            --npm frontend

  docker-security:
    name: Container Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "3.17.0"

      - name: Build Helm dependencies for Trivy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if helm dependency build charts/university-ecosystem/; then
              test -s charts/university-ecosystem/charts/redis-20.13.4.tgz
              test -s charts/university-ecosystem/charts/nats-8.5.4.tgz
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Helm dependency build failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Install Trivy (via apt repo)
        # GitHub-Releases downloads are unreliable on this runner;
        # the Aqua apt repository is the stable fallback.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scanner (filesystem)
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          # SARIF otherwise contains every severity even when the scan filter
          # is restricted. Keep Code Scanning aligned with the blocking policy.
          limit-severities-for-sarif: true
          # skip-setup-trivy: use the binary we installed above via apt
          skip-setup-trivy: true
          # Preserve SARIF upload, then re-assert this blocking result below.
          exit-code: "1"

      - name: Run Trivy configuration scanner (IaC)
        id: trivy_config
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          trivy-config: "security/trivy-university-config.yaml"
          # The revocation chart is scanned separately with its required
          # release identity; keeping it out of this aggregate scan prevents
          # Helm's intentional empty defaults from being silently skipped.
          skip-dirs: "charts/revocation-store"
          # Keep the OSS-Fuzz builder's documented root exception scoped to
          # that single Dockerfile; all other container user findings remain
          # blocking code-scanning alerts.
          # The YAML ignore file contains both the scoped OSS-Fuzz exception
          # and the repository-wide SPIRE Kubernetes suppressions. Trivy does
          # not allow mixing plain and YAML ignore files in one scan.
          trivyignores: ".trivyignore.yaml"
          format: "sarif"
          output: "trivy-config.sarif"
          severity: "CRITICAL,HIGH"
          # Without this flag Trivy deliberately emits LOW/MEDIUM findings in
          # SARIF, which can block the zero-alert ruleset while the job is green.
          limit-severities-for-sarif: true
          skip-setup-trivy: true
          exit-code: "1"

      - name: Validate Helm charts before Trivy configuration scan
        shell: bash
        run: | # pragma: allowlist secret -- contains only a Kubernetes Secret name override
          set -euo pipefail
          trivy_application_secret_override="applicationSecrets.existingSecret=trivy-scan-application" # pragma: allowlist secret -- Secret name only; no credential material

          helm template trivy-revocation charts/revocation-store \
            --dependency-update=false \
            --values security/trivy-revocation-values.yaml \
            >/tmp/trivy-revocation-render.yaml
          helm template trivy-university charts/university-ecosystem \
            --dependency-update=false \
            --set "$trivy_application_secret_override" \
            >/tmp/trivy-university-render.yaml

          scan_chart() {
            local chart="$1"
            local log_file="$2"
            local output_file="/tmp/${chart##*/}-trivy-preflight.json"
            shift 2
            trivy config --misconfig-scanners helm \
              --format json --output "$output_file" \
              "$@" "$chart" 2>&1 | tee "$log_file"
            if grep -Fqi "Skipping chart" "$log_file" || \
              grep -Fqi "missing in charts/" "$log_file" || \
              grep -Fqi "Failed to render Chart files" "$log_file"; then
              echo "::error::Trivy skipped Helm chart $chart" >&2
              return 1
            fi
            if ! jq -e '.Results | type == "array" and length > 0' \
              "$output_file" >/dev/null; then
              echo "::error::Trivy produced no rendered Helm results for $chart" >&2
              return 1
            fi
          }

          scan_chart charts/revocation-store /tmp/trivy-revocation-preflight.log \
            --helm-values security/trivy-revocation-values.yaml
          scan_chart charts/university-ecosystem /tmp/trivy-university-preflight.log \
            --helm-set "$trivy_application_secret_override"

      - name: Run Trivy revocation-store configuration scanner
        id: trivy_revocation
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "charts/revocation-store"
          trivy-config: "security/trivy-revocation-config.yaml"
          trivyignores: ".trivyignore.yaml"
          format: "sarif"
          output: "trivy-revocation-config.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          skip-setup-trivy: true
          exit-code: "1"

      - name: Upload Trivy filesystem scan results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-fs.sarif"
          # Keep the implicit category historically used by main so PR
          # configuration matching remains stable while the config scan below
          # has its own category and cannot overwrite filesystem findings.
          category: ".github/workflows/ci.yml:docker-security"

      - name: Upload Trivy config scan results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-config.sarif"
          category: "trivy-config"

      - name: Upload Trivy revocation-store results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-revocation-config.sarif"
          category: "trivy-revocation-config"

      - name: Re-assert Trivy filesystem and configuration gates
        if: always()
        shell: bash
        env:
          FILESYSTEM_OUTCOME: ${{ steps.trivy_fs.outcome }}
          CONFIGURATION_OUTCOME: ${{ steps.trivy_config.outcome }}
          REVOCATION_OUTCOME: ${{ steps.trivy_revocation.outcome }}
        run: |
          set -euo pipefail
          failed=0
          if [[ "$FILESYSTEM_OUTCOME" != "success" ]]; then
            echo "::error::Trivy filesystem scan concluded '$FILESYSTEM_OUTCOME'."
            failed=1
          fi
          if [[ "$CONFIGURATION_OUTCOME" != "success" ]]; then
            echo "::error::Trivy configuration scan concluded '$CONFIGURATION_OUTCOME'."
            failed=1
          fi
          if [[ "$REVOCATION_OUTCOME" != "success" ]]; then
            echo "::error::Trivy revocation-store configuration scan concluded '$REVOCATION_OUTCOME'."
            failed=1
          fi
          exit "$failed"

  # ── Go vulnerability scanning ──────────────────────────────────────────────
  govulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install govulncheck
        # The version resolves to an immutable Go module (content-addressed via sum DB).
        # Scorecard goCommand: version tag is equivalent to commit pinning for Go modules.  # nosec
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck on all Go modules
        # Audit all workspace modules. govulncheck fails if a directory has no packages,
        # so we iterate over all modules and run it only where packages exist.
        run: |
          exit_code=0
          for dir in $(go list -m -f '{{.Dir}}'); do
            if [ -n "$(go list -C "$dir" ./... 2>/dev/null)" ]; then
              echo "Scanning module: $dir"
              govulncheck -C "$dir" ./... || exit_code=$?
            fi
          done
          exit $exit_code

  # ── SBOM generation ────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SPDX-JSON SBOM
        # Scans the full repository (all languages/ecosystems Syft detects).
        # SPDX-JSON is the most interoperable format for downstream tooling.
        run: |
          syft . --output spdx-json=sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          retention-days: 90

  # ── detect-secrets baseline integrity ─────────────────────────────────────
  # AUDIT-INFRA-06: A contributor with push access can suppress new secrets by
  # updating .secrets.baseline. This job re-scans the repo and fails if the
  # committed baseline suppresses patterns not present in the current scan,
  # catching newly added suppressions. Combined with CODEOWNERS this ensures
  # that any baseline change requires security-team approval.
  detect-secrets-baseline:
    name: detect-secrets Baseline Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan repo (no baseline)
        run: detect-secrets scan > /tmp/current_scan.json

      - name: Verify baseline has not regressed
        run: python scripts/verify_secrets_baseline.py .secrets.baseline /tmp/current_scan.json

  # ── Semgrep SAST ───────────────────────────────────────────────────────────
  # Uses the official semgrep/semgrep Docker image so no binary installation
  # is required.  Runs a registry-backed scan on every PR. `semgrep ci`
  # requires an AppSec-platform login and otherwise emits an empty SARIF
  # document, which GitHub rejects instead of creating an analysis.
  # Results are uploaded to GitHub Advanced Security as SARIF so findings
  # appear in the Security → Code Scanning tab.
  # SEMGREP_APP_TOKEN secret: Settings → Secrets → Actions → New repository secret.
  # Without the token Semgrep CE's `scan --config auto` remains fully local to
  # the repository while still producing a valid SARIF analysis.
  # (MOD-5: audit 2026-02-24)
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read
    container:
      image: semgrep/semgrep:1.113.0@sha256:136c094630123be54d7f832217fd0a217d148a8bfea08c7c366ce17f94cfdb22
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The CE fallback uses --baseline-commit for diff-aware PR scans.
          fetch-depth: 0

      - name: Run Semgrep SAST
        # Keep the SARIF upload alive when findings make the scanner return 1;
        # the follow-up gate fails the job after GitHub has received findings.
        # Without the AppSec token, use the documented CE command instead of
        # `semgrep ci`, which requires `semgrep login`. The baseline keeps the
        # PR gate focused on newly introduced findings; scheduled/full scans
        # remain responsible for existing repository debt.
        run: |
          set -u
          scan_status=0
          if [ -n "${SEMGREP_APP_TOKEN:-}" ]; then
            semgrep ci --error --sarif --sarif-output=semgrep.sarif || scan_status=$?
          else
            semgrep scan --config auto --baseline-commit origin/main \
              --error --sarif --sarif-output=semgrep.sarif || scan_status=$?
          fi
          if [ ! -s semgrep.sarif ]; then
            echo "::error::Semgrep completed without producing SARIF output"
            exit 1
          fi
          echo "SEMGREP_SCAN_STATUS=$scan_status" >> "$GITHUB_ENV"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Fail if Semgrep reported findings or scan errors
        if: always()
        run: |
          scan_status="${SEMGREP_SCAN_STATUS:-2}"
          python3 scripts/quality/validate_semgrep_sarif.py \
            --report semgrep.sarif \
            --policy security/semgrep-suppression-policy.json \
            --scanner-status "$scan_status"
