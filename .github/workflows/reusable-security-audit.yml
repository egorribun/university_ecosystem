# Reusable Security Audit Workflow
name: Security Audit

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for pip-audit"
        required: false
        type: string
        default: "3.14"
      node-version:
        description: "Node.js version for npm audit"
        required: false
        type: string
        default: "24"
      run-pip-audit:
        description: "Run pip-audit for Python dependencies"
        required: false
        type: boolean
        default: true
      run-npm-audit:
        description: "Run npm audit for Node.js dependencies"
        required: false
        type: boolean
        default: true

jobs:
  # Scanner configuration, ignore lists and release-quality policies are
  # executable security inputs.  Keep their integrity check as a separate
  # prerequisite so every consumer waits for the same fail-closed decision;
  # checking only one scanner leaves the parallel consumers exposed to a
  # policy change in the pull-request checkout.
  policy-integrity:
    name: Security policy integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify security policy inputs against protected base
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pull-request base SHA is not an immutable 40-hex commit" >&2
            exit 1
          fi
          if [[ "$BASE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::security policy check refuses a cross-repository pull request" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          policy_paths=(
            ".github/workflows"
            ".github/CODEOWNERS"
            ".github/actionlint.yaml"
            ".github/codeql/codeql-config.yml"
            ".github/dependency-review-config.yml"
            ".checkov.yml"
            ".gitleaks.toml"
            ".semgrep.yml"
            ".semgrepignore"
            ".trivyignore"
            ".trivyignore.yaml"
            ".zap/rules.tsv"
            "budget.json"
            "quality/quality-contract.json"
            "quality/release-required-checks.json"
            "quality/ci-check-catalog.json"
            "quality/security-false-positive-dispositions.json"
            "quality/coverage-source-policy.json"
            "quality/mutation-exclusions.json"
            "security/audit-allowlist.yaml"
            "security/semgrep-suppression-policy.json"
            "security/trivy-university-config.yaml"
            "security/trivy-university-chart-config.yaml"
            "security/trivy-university-values.yaml"
            "security/trivy-redis-compat-config.yaml"
            "security/trivy-redis-compat-values.yaml"
            "security/trivy-revocation-config.yaml"
            "security/trivy-revocation-values.yaml"
            "zizmor.yml"
            "trivy.yaml"
            ".pre-commit-config.yaml"
            "pyproject.toml"
            "frontend/scripts/lhci-route-policy.mjs"
            "frontend/scripts/lhci-route-policy-config.cjs"
            "scripts/osv_batch_audit.py"
            "scripts/check_dependency_audit_report.py"
            "scripts/audit_dependencies.py"
            "scripts/ci/helm_dependency_build.py"
            "frontend/scripts/generate-zod-root-lock-candidate.mjs"
            "frontend/scripts/generate-zod-root-lock-candidate.test.mjs"
            "frontend/scripts/generate-puppeteer-lock-candidate.mjs"
            "frontend/scripts/generate-puppeteer-lock-candidate.test.mjs"
            "frontend/scripts/browser-dependency-smoke.mjs"
            "frontend/scripts/browser-dependency-smoke.test.mjs"
            "frontend/scripts/generate-react-compiler-adapter-lock-candidate.mjs"
            "frontend/scripts/generate-react-compiler-adapter-lock-candidate.test.mjs"
            "frontend/scripts/generate-react-compiler-final-lock-candidate.mjs"
            "frontend/scripts/generate-react-compiler-final-lock-candidate.test.mjs"
            "frontend/scripts/pack-react-compiler-zod-compat.mjs"
            "frontend/scripts/pack-react-compiler-zod-compat.test.mjs"
            "frontend/scripts/react-compiler-zod-compat/index.cjs"
            "frontend/scripts/react-compiler-zod-compat/package.json"
            "frontend/scripts/react-compiler-zod-compat/legacy-baseline.json"
            "frontend/scripts/react-compiler-zod-compat.test.mjs"
            "scripts/ci/probe_react_compiler_artifacts.py"
            "tests/test_probe_react_compiler_artifacts.py"
            "scripts/quality/prepare_trivy_backend_values.py"
            "scripts/quality/create_checkov_oci_image_evidence.py"
            "scripts/quality/resolve_oci_platform_digest.py"
            "scripts/quality/filter_checkov_sarif.py"
            "scripts/verify_secrets_baseline.py"
            "scripts/quality/validate_semgrep_sarif.py"
            "security/detect-secrets-requirements.txt"
            "native/rust_ext/deny.toml"
            "frontend/package.json"
            "frontend/.npmrc"
            "frontend/scripts/ensure-wasm.mjs"
            "frontend/scripts/setup-husky.cjs"
            "frontend/scripts/setup-lhci-binaries.cjs"
          )
          changed=()
          for path in "${policy_paths[@]}"; do
            if ! git diff --quiet "$BASE_SHA" -- "$path"; then
              changed+=("$path")
            fi
          done
          if ((${#changed[@]} > 0)); then
            if [[ "$PR_AUTHOR" != "egorribun" ]]; then
              printf '::error::security policy changes require an owner-authored PR: %s\n' "${changed[*]}" >&2
              exit 1
            fi
            printf '::notice::owner-authored policy update accepted for review: %s\n' "${changed[*]}"
          fi

  pip-audit:
    name: Python Dependency Audit
    needs: policy-integrity
    if: ${{ inputs.run-pip-audit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify security policy inputs against protected base
        # Scanner configuration, ignore lists and release-quality policy are
        # executable security inputs.  On pull requests, compare their exact
        # bytes with the immutable base commit before any scanner consumes
        # them.  A policy change is accepted only when the PR itself is
        # authored by the trusted repository owner; external contributors must
        # propose policy changes through an owner-authored follow-up so a
        # review cannot silently weaken a required gate.
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pull-request base SHA is not an immutable 40-hex commit" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          policy_paths=(
            ".github/workflows"
            ".github/CODEOWNERS"
            ".github/actionlint.yaml"
            ".github/codeql/codeql-config.yml"
            ".github/dependency-review-config.yml"
            ".checkov.yml"
            ".semgrep.yml"
            ".semgrepignore"
            ".trivyignore"
            ".trivyignore.yaml"
            ".zap/rules.tsv"
            "budget.json"
            "quality/quality-contract.json"
            "quality/release-required-checks.json"
            "quality/ci-check-catalog.json"
            "quality/security-false-positive-dispositions.json"
            "quality/coverage-source-policy.json"
            "quality/mutation-exclusions.json"
            "security/audit-allowlist.yaml"
            "security/semgrep-suppression-policy.json"
            "security/trivy-university-config.yaml"
            "security/trivy-university-chart-config.yaml"
            "security/trivy-university-values.yaml"
            "security/trivy-redis-compat-config.yaml"
            "security/trivy-redis-compat-values.yaml"
            "security/trivy-revocation-config.yaml"
            "security/trivy-revocation-values.yaml"
            "frontend/scripts/lhci-route-policy.mjs"
            "frontend/scripts/lhci-route-policy-config.cjs"
            "scripts/osv_batch_audit.py"
            "scripts/check_dependency_audit_report.py"
            "scripts/audit_dependencies.py"
            "scripts/ci/helm_dependency_build.py"
            "frontend/scripts/generate-zod-root-lock-candidate.mjs"
            "frontend/scripts/generate-zod-root-lock-candidate.test.mjs"
            "frontend/scripts/generate-puppeteer-lock-candidate.mjs"
            "frontend/scripts/generate-puppeteer-lock-candidate.test.mjs"
            "frontend/scripts/browser-dependency-smoke.mjs"
            "frontend/scripts/browser-dependency-smoke.test.mjs"
            "frontend/scripts/generate-react-compiler-adapter-lock-candidate.mjs"
            "frontend/scripts/generate-react-compiler-adapter-lock-candidate.test.mjs"
            "frontend/scripts/generate-react-compiler-final-lock-candidate.mjs"
            "frontend/scripts/generate-react-compiler-final-lock-candidate.test.mjs"
            "frontend/scripts/pack-react-compiler-zod-compat.mjs"
            "frontend/scripts/pack-react-compiler-zod-compat.test.mjs"
            "frontend/scripts/react-compiler-zod-compat/index.cjs"
            "frontend/scripts/react-compiler-zod-compat/package.json"
            "frontend/scripts/react-compiler-zod-compat/legacy-baseline.json"
            "frontend/scripts/react-compiler-zod-compat.test.mjs"
            "scripts/ci/probe_react_compiler_artifacts.py"
            "tests/test_probe_react_compiler_artifacts.py"
            "scripts/quality/prepare_trivy_backend_values.py"
            "scripts/quality/create_checkov_oci_image_evidence.py"
            "scripts/quality/resolve_oci_platform_digest.py"
            "scripts/quality/filter_checkov_sarif.py"
            "scripts/verify_secrets_baseline.py"
            "scripts/quality/validate_semgrep_sarif.py"
            "security/detect-secrets-requirements.txt"
            "native/rust_ext/deny.toml"
          )
          changed=()
          for path in "${policy_paths[@]}"; do
            if ! git diff --quiet "$BASE_SHA" -- "$path"; then
              changed+=("$path")
            fi
          done
          if ((${#changed[@]} > 0)); then
            if [[ "$PR_AUTHOR" != "egorribun" ]]; then
              printf '::error::security policy changes require an owner-authored PR: %s\n' "${changed[*]}" >&2
              exit 1
            fi
            printf '::notice::owner-authored policy update accepted for review: %s\n' "${changed[*]}"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group security

      - name: Export Python requirements
        run: uv export --frozen --no-hashes --no-dev --no-emit-workspace > /tmp/requirements.txt

      - name: Run Python known-vulnerability allowlist gate
        shell: bash
        run: |
          # OSV's batch endpoint avoids a flaky N+1 request pattern while the
          # adapter preserves pip-audit's frozen requirement and report contract.
          # Status 1 means complete findings; status 2 means operationally
          # incomplete data. Both are validated fail-closed below.
          set +e
          rm -f /tmp/pip-audit.json
          uv run --frozen --no-sync python scripts/osv_batch_audit.py \
            --requirement /tmp/requirements.txt \
            --output /tmp/pip-audit.json \
            --timeout 30 \
            --attempts 4 \
            --batch-size 100
          pip_audit_status=$?
          set -e
          uv run --frozen --no-sync python scripts/check_dependency_audit_report.py pip \
            --report /tmp/pip-audit.json \
            --scanner-status "$pip_audit_status" \
            --allowlist security/audit-allowlist.yaml

  npm-audit:
    name: Node.js Dependency Audit
    needs: policy-integrity
    if: ${{ inputs.run-npm-audit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      # Keep applied dependency generators retired; retain their fixture guards.
      - name: Verify root Zod lock candidate guards
        timeout-minutes: 1
        run: node --test scripts/generate-zod-root-lock-candidate.test.mjs

      - name: Verify staged compiler adapter lock guards
        timeout-minutes: 1
        run: node --test scripts/generate-react-compiler-adapter-lock-candidate.test.mjs

      - name: Verify React compiler artifact probe guards
        timeout-minutes: 1
        working-directory: .
        run: python -B tests/test_probe_react_compiler_artifacts.py

      - name: Inspect mature React compiler artifacts without executing them
        timeout-minutes: 8
        working-directory: .
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python -B scripts/ci/probe_react_compiler_artifacts.py

      - name: Verify Puppeteer lock candidate guards
        timeout-minutes: 1
        run: node --test scripts/generate-puppeteer-lock-candidate.test.mjs

      - name: Verify browser dependency smoke guards
        timeout-minutes: 1
        run: node --test scripts/browser-dependency-smoke.test.mjs

      - name: Verify final compiler consumer lock guards
        timeout-minutes: 1
        run: node --test scripts/generate-react-compiler-final-lock-candidate.test.mjs

      - name: Verify compiler facade archive guards
        timeout-minutes: 1
        run: node --test scripts/pack-react-compiler-zod-compat.test.mjs

      - name: Generate compiler facade archive candidate
        timeout-minutes: 3
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/pack-react-compiler-zod-compat.mjs

      - name: Generate final compiler consumer lock candidate
        timeout-minutes: 8
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/generate-react-compiler-final-lock-candidate.mjs

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          Set-Location ..
          uv sync --frozen

      - name: Run npm audit with allowlist
        shell: pwsh
        run: |
          Set-Location ..
          uv run python scripts/audit_dependencies.py `
            --allowlist security/audit-allowlist.yaml `
            --npm frontend

      # The audit above remains blocking. This optional report only identifies
      # public advisory metadata when its numeric IDs are insufficient to triage.
      - name: Report npm advisory metadata after failure
        if: ${{ failure() }}
        timeout-minutes: 2
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          const result = spawnSync("npm", ["audit", "--audit-level=high", "--json"], {
            encoding: "utf8",
            shell: false,
            timeout: 60_000,
            maxBuffer: 8 * 1024 * 1024,
          });
          if (result.error || result.signal || ![0, 1].includes(result.status)) {
            throw new Error("npm advisory diagnostic could not complete");
          }
          let payload;
          try {
            payload = JSON.parse(result.stdout);
          } catch {
            throw new Error("npm advisory diagnostic returned invalid JSON");
          }
          const scalar = (value, limit = 512) =>
            typeof value === "string" || typeof value === "number"
              ? String(value).slice(0, limit) : null;
          for (const [packageName, finding] of Object.entries(payload.vulnerabilities ?? {})) {
            if (!finding || !["high", "critical"].includes(finding.severity)) continue;
            for (const advisory of Array.isArray(finding.via) ? finding.via : []) {
              if (!advisory || typeof advisory !== "object") continue;
              console.log("npm advisory metadata: " + JSON.stringify({
                id: scalar(advisory.source),
                package: scalar(packageName),
                name: scalar(advisory.name),
                severity: scalar(advisory.severity ?? finding.severity, 32),
                url: scalar(advisory.url, 1024),
                range: scalar(advisory.range ?? finding.range),
              }));
            }
          }
          NODE

  docker-security:
    name: Container Security Scan
    needs: policy-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify source revision for backend OCI evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse --verify HEAD)" == "$SOURCE_SHA" ]]
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Trivy source checkout is not clean before dependency generation" >&2
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "4.2.4"

      - name: Install checksum-pinned Trivy
        env:
          TRIVY_VERSION: 0.75.0
          # Official immutable GitHub release asset digest for
          # trivy_0.75.0_Linux-64bit.tar.gz.
          TRIVY_ARCHIVE_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          set -euo pipefail
          [[ "$TRIVY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TRIVY_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          trivy_dir="$(mktemp -d)"
          trap 'rm -rf -- "$trivy_dir"' EXIT
          archive="$trivy_dir/trivy.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$trivy_dir" trivy
          sudo install --mode 0755 "$trivy_dir/trivy" /usr/local/bin/trivy
          trivy --version

      - name: Build source-bound backend OCI archive
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Export backend OCI and prepare isolated Helm profiles
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse --verify HEAD)" == "$SOURCE_SHA" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          git diff --quiet HEAD --
          image_repository="${SOURCE_REPOSITORY,,}"
          archive="$RUNNER_TEMP/backend.oci.tar"
          profiles="$RUNNER_TEMP/trivy-inputs"
          [[ ! -e "$archive" && ! -L "$archive" ]]
          [[ ! -e "$profiles" && ! -L "$profiles" ]]
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${SOURCE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "ghcr.io/${image_repository}/backend:${SOURCE_SHA}" \
            --file backend.Dockerfile \
            --cache-from type=gha,scope=university-backend \
            --cache-to type=gha,scope=university-backend,mode=max \
            --output "type=oci,dest=${archive}" \
            .
          python3 scripts/quality/prepare_trivy_backend_values.py \
            --archive "$archive" \
            --repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --output-dir "$profiles" \
            --repository-root "$GITHUB_WORKSPACE"
          test -s "$profiles/backend-evidence.json"
          test -s "$profiles/trivy-revocation-config.json"
          test -s "$profiles/trivy-university-config.json"
          test -s "$profiles/trivy-redis-compat-config.json"

      - name: Build Helm dependencies for Trivy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/helm_dependency_build.py \
            charts/university-ecosystem \
            redis-0.1.0.tgz nats-2.15.0.tgz

      - name: Run Trivy vulnerability scanner (filesystem)
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          skip-setup-trivy: true
          exit-code: "1"

      - name: Verify the pinned Kyverno fixture before the Trivy configuration scan
        shell: bash
        run: |
          set -euo pipefail
          version_output="$(trivy --version)"
          if ! grep -Fxq 'Version: 0.75.0' <<<"$version_output"; then
            echo "::error::The fixture preflight requires Trivy 0.75.0" >&2
            exit 1
          fi
          fixture="k8s/kyverno/tests/disallow-host-access/host-access.yaml"
          report="$RUNNER_TEMP/trivy-host-access-noignore.json"
          [[ ! -e "$report" && ! -L "$report" ]]
          trivy config \
            --config security/trivy-university-config.yaml \
            --ignorefile= \
            --skip-dirs "charts/revocation-store,charts/university-ecosystem,charts/redis-compat" \
            --severity "CRITICAL,HIGH" \
            --format json \
            --output "$report" \
            "$fixture"
          python3 scripts/quality/validate_trivy_kyverno_fixture.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --target "$fixture" \
            --report "$report"

      - name: Run Trivy configuration scanner (IaC)
        id: trivy_config
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: "config"
          scan-ref: "."
          trivy-config: "security/trivy-university-config.yaml"
          skip-dirs: "charts/revocation-store,charts/university-ecosystem,charts/redis-compat"
          trivyignores: ".trivyignore.yaml"
          format: "sarif"
          output: "trivy-config.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          skip-setup-trivy: true
          exit-code: "1"

      - name: Validate isolated Helm profiles before Trivy scans
        shell: bash
        run: |
          set -euo pipefail
          profiles="$RUNNER_TEMP/trivy-inputs"
          revocation_values=(
            --values security/trivy-revocation-values.yaml
            --values "$profiles/revocation-values.json"
          )
          university_values=(
            --values security/trivy-university-values.yaml
            --values "$profiles/university-values.json"
          )
          redis_values=(
            --values security/trivy-redis-compat-values.yaml
            --values "$profiles/redis-compat-values.json"
          )

          helm template trivy-revocation charts/revocation-store \
            --dependency-update=false "${revocation_values[@]}" \
            >/tmp/trivy-revocation-render.yaml
          helm template trivy-university charts/university-ecosystem \
            --dependency-update=false "${university_values[@]}" \
            >/tmp/trivy-university-render.yaml
          helm template trivy-redis-compat charts/redis-compat \
            --dependency-update=false "${redis_values[@]}" \
            >/tmp/trivy-redis-compat-render.yaml

          scan_chart() {
            local chart="$1"
            local config="$2"
            local log_file="$3"
            local output_file="$4"
            trivy config --config "$config" --misconfig-scanners helm \
              --format json --output "$output_file" "$chart" 2>&1 | tee "$log_file"
            if grep -Fqi "Skipping chart" "$log_file" || \
              grep -Fqi "missing in charts/" "$log_file" || \
              grep -Fqi "Failed to render Chart files" "$log_file"; then
              echo "::error::Trivy skipped Helm chart $chart" >&2
              return 1
            fi
            if ! jq -e 'type == "object" and (.Results | type == "array" and length > 0)' \
              "$output_file" >/dev/null; then
              echo "::error::Trivy produced no valid Helm results for $chart" >&2
              return 1
            fi
          }

          scan_chart charts/revocation-store "$profiles/trivy-revocation-config.json" \
            /tmp/trivy-revocation-preflight.log /tmp/trivy-revocation-preflight.json
          scan_chart charts/university-ecosystem "$profiles/trivy-university-config.json" \
            /tmp/trivy-university-preflight.log /tmp/trivy-university-preflight.json
          scan_chart charts/redis-compat "$profiles/trivy-redis-compat-config.json" \
            /tmp/trivy-redis-compat-preflight.log /tmp/trivy-redis-compat-preflight.json

      - name: Upload source-bound Trivy inputs and Helm preflight reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-source-bound-helm-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/trivy-inputs/backend-evidence.json
            ${{ runner.temp }}/trivy-inputs/*-values.json
            ${{ runner.temp }}/trivy-inputs/trivy-*-config.json
            /tmp/trivy-*-preflight.json
            /tmp/trivy-*-preflight.log
          if-no-files-found: error
          retention-days: 14

      - name: Run Trivy revocation-store configuration scanner
        id: trivy_revocation
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: "config"
          scan-ref: "charts/revocation-store"
          trivy-config: "${{ runner.temp }}/trivy-inputs/trivy-revocation-config.json"
          trivyignores: ".trivyignore.yaml"
          format: "sarif"
          output: "trivy-revocation-config.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          skip-setup-trivy: true
          exit-code: "1"

      - name: Run Trivy university-ecosystem configuration scanner
        id: trivy_university
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: "config"
          scan-ref: "charts/university-ecosystem"
          trivy-config: "${{ runner.temp }}/trivy-inputs/trivy-university-config.json"
          trivyignores: ".trivyignore.yaml"
          format: "sarif"
          output: "trivy-university-config.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          skip-setup-trivy: true
          exit-code: "1"

      - name: Run Trivy redis-compat configuration scanner
        id: trivy_redis_compat
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: "config"
          scan-ref: "charts/redis-compat"
          trivy-config: "${{ runner.temp }}/trivy-inputs/trivy-redis-compat-config.json"
          trivyignores: ".trivyignore.yaml"
          format: "sarif"
          output: "trivy-redis-compat-config.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          skip-setup-trivy: true
          exit-code: "1"

      - name: Upload Trivy filesystem scan results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-fs.sarif"
          category: ".github/workflows/ci.yml:docker-security"

      - name: Upload Trivy config scan results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-config.sarif"
          category: "trivy-config"

      - name: Upload Trivy revocation-store results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-revocation-config.sarif"
          category: "trivy-revocation-config"

      - name: Upload Trivy university-ecosystem results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-university-config.sarif"
          category: "trivy-university-config"

      - name: Upload Trivy redis-compat results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-redis-compat-config.sarif"
          category: "trivy-redis-compat-config"

      - name: Re-assert Trivy filesystem and configuration gates
        if: always()
        shell: bash
        env:
          FILESYSTEM_OUTCOME: ${{ steps.trivy_fs.outcome }}
          CONFIGURATION_OUTCOME: ${{ steps.trivy_config.outcome }}
          REVOCATION_OUTCOME: ${{ steps.trivy_revocation.outcome }}
          UNIVERSITY_OUTCOME: ${{ steps.trivy_university.outcome }}
          REDIS_COMPAT_OUTCOME: ${{ steps.trivy_redis_compat.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for outcome in \
            "$FILESYSTEM_OUTCOME" \
            "$CONFIGURATION_OUTCOME" \
            "$REVOCATION_OUTCOME" \
            "$UNIVERSITY_OUTCOME" \
            "$REDIS_COMPAT_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              echo "::error::A required Trivy scan concluded '$outcome'."
              failed=1
            fi
          done
          exit "$failed"

  # ── Go vulnerability scanning ──────────────────────────────────────────────
  govulncheck:
    name: Go Vulnerability Scan
    needs: policy-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install govulncheck
        # The version resolves to an immutable Go module (content-addressed via sum DB).
        # Scorecard goCommand: version tag is equivalent to commit pinning for Go modules.  # nosec
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck on all Go modules
        # Audit all workspace modules. govulncheck fails if a directory has no packages,
        # so we iterate over all modules and run it only where packages exist.
        run: |
          exit_code=0
          for dir in $(go list -m -f '{{.Dir}}'); do
            if [ -n "$(go list -C "$dir" ./... 2>/dev/null)" ]; then
              echo "Scanning module: $dir"
              govulncheck -C "$dir" ./... || exit_code=$?
            fi
          done
          exit $exit_code

  # ── SBOM generation ────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    needs: policy-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate SPDX-JSON SBOM
        # Scans the full repository (all languages/ecosystems Syft detects).
        # SPDX-JSON is the most interoperable format for downstream tooling.
        run: |
          syft . --output spdx-json=sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          retention-days: 90

  # ── detect-secrets baseline integrity ─────────────────────────────────────
  # AUDIT-INFRA-06: A contributor with push access can suppress new secrets by
  # updating .secrets.baseline. This job re-scans the repo and compares
  # finding-level identities, catching both newly detected findings and
  # suppressions added relative to the trusted pull-request base. Combined
  # with CODEOWNERS this ensures that any baseline change requires
  # security-team approval.
  detect-secrets-baseline:
    name: detect-secrets Baseline Integrity
    needs: policy-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install detect-secrets
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --disable-pip-version-check
          --no-cache-dir
          -r security/detect-secrets-requirements.txt

      - name: Scan repo (no baseline)
        # The baseline is scanner metadata, not application input. Scanning it
        # would recursively flag every stored digest and keyword entry and
        # make finding-level verification impossible. The checked-in WASM
        # provenance file is likewise a generated SHA-256 inventory; the
        # provenance validator binds every listed source/package byte before
        # the artifact is consumed. Keep both exclusions exact: all other
        # repository files remain scan-covered.
        run: detect-secrets scan --exclude-files '^(?:\.secrets\.baseline|frontend/WASM_SOURCE_PROVENANCE\.json)$' > /tmp/current_scan.json

      - name: Fetch immutable trusted source base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) SOURCE_BASE_SHA="$PR_BASE_SHA" ;;
            push) SOURCE_BASE_SHA="$PUSH_BEFORE_SHA" ;;
            *)
              echo "ERROR: unsupported event for trusted source comparison" >&2
              exit 1
              ;;
          esac
          if [[ ! "$SOURCE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$SOURCE_BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo "ERROR: trusted source base is missing, zero, or malformed" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$SOURCE_BASE_SHA"
          git cat-file -e "${SOURCE_BASE_SHA}^{commit}"
          echo "SOURCE_BASE_SHA=$SOURCE_BASE_SHA" >> "$GITHUB_ENV"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git show "$SOURCE_BASE_SHA:.secrets.baseline" > "$RUNNER_TEMP/trusted-base-baseline.json"
            test -s "$RUNNER_TEMP/trusted-base-baseline.json"
          fi

      - name: Verify baseline has not regressed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TRUSTED_BASELINE_PATH: ${{ runner.temp }}/trusted-base-baseline.json
        run: |
          set -euo pipefail
          disposition_args=()
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_AUTHOR" == "egorribun" ]]; then
            set +e
            git diff --quiet "$SOURCE_BASE_SHA" -- quality/security-false-positive-dispositions.json
            disposition_diff_status=$?
            set -e
            case "$disposition_diff_status" in
              0) ;;
              1) disposition_args+=(--owner-authored-disposition-update) ;;
              *)
                echo "ERROR: disposition policy diff could not be verified" >&2
                exit 1
                ;;
            esac
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/verify_secrets_baseline.py \
              .secrets.baseline /tmp/current_scan.json \
              --trusted-base-baseline "$TRUSTED_BASELINE_PATH" \
              --trusted-base-source-sha "$SOURCE_BASE_SHA" \
              "${disposition_args[@]}"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            python scripts/verify_secrets_baseline.py \
              .secrets.baseline /tmp/current_scan.json \
              --trusted-base-source-sha "$SOURCE_BASE_SHA" \
              --trusted-disposition-source-sha "$HEAD_SHA"
          else
            echo "ERROR: unsupported event for secret policy verification" >&2
            exit 1
          fi
