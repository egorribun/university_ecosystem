# Reusable Security Audit Workflow
name: Security Audit

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version for pip-audit"
                required: false
                type: string
                default: "3.13"
            node-version:
                description: "Node.js version for npm audit"
                required: false
                type: string
                default: "22"
            run-pip-audit:
                description: "Run pip-audit for Python dependencies"
                required: false
                type: boolean
                default: true
            run-npm-audit:
                description: "Run npm audit for Node.js dependencies"
                required: false
                type: boolean
                default: true

jobs:
    pip-audit:
        name: Python Dependency Audit
        if: ${{ inputs.run-pip-audit }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run pip-audit with allowlist
              run: |
                  uv run python scripts/audit_dependencies.py \
                    --allowlist security/audit-allowlist.yaml \
                    --pip

    npm-audit:
        name: Node.js Dependency Audit
        if: ${{ inputs.run-npm-audit }}
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              run: |
                  npm ci
                  cd .. && uv sync --frozen

            - name: Run npm audit with allowlist
              run: |
                  cd .. && uv run python scripts/audit_dependencies.py \
                    --allowlist security/audit-allowlist.yaml \
                    --npm frontend

    docker-security:
        name: Container Security Scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v5

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@0.33.1
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "sarif"
                  output: "trivy-fs.sarif"
                  severity: "CRITICAL,HIGH"

            - name: Upload Trivy scan results
              uses: github/codeql-action/upload-sarif@v4
              if: always()
              continue-on-error: true
              with:
                  sarif_file: "trivy-fs.sarif"
