# Reusable Security Audit Workflow
name: Security Audit

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for pip-audit"
        required: false
        type: string
        default: "3.13"
      node-version:
        description: "Node.js version for npm audit"
        required: false
        type: string
        default: "22"
      run-pip-audit:
        description: "Run pip-audit for Python dependencies"
        required: false
        type: boolean
        default: true
      run-npm-audit:
        description: "Run npm audit for Node.js dependencies"
        required: false
        type: boolean
        default: true

jobs:
  pip-audit:
    name: Python Dependency Audit
    if: ${{ inputs.run-pip-audit }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        shell: pwsh
        run: uv sync --frozen

      - name: Run pip-audit with allowlist
        shell: pwsh
        run: |
          uv run python scripts/audit_dependencies.py `
            --allowlist security/audit-allowlist.yaml `
            --pip

  npm-audit:
    name: Node.js Dependency Audit
    if: ${{ inputs.run-npm-audit }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          Set-Location ..
          uv sync --frozen

      - name: Run npm audit with allowlist
        shell: pwsh
        run: |
          Set-Location ..
          uv run python scripts/audit_dependencies.py `
            --allowlist security/audit-allowlist.yaml `
            --npm frontend

  docker-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Trivy (via apt repo)
        # GitHub-Releases downloads are unreliable on this runner;
        # the Aqua apt repository is the stable fallback.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          # skip-setup-trivy: use the binary we installed above via apt
          skip-setup-trivy: true
          # fs scan feeds advisory SARIF; blocking is enforced by the image scan in build-and-sign
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-fs.sarif"

  # ── Go vulnerability scanning ──────────────────────────────────────────────
  govulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck on all Go modules
        # Audit all workspace modules. govulncheck fails if a directory has no packages,
        # so we iterate over all modules and run it only where packages exist.
        run: |
          exit_code=0
          for dir in $(go list -m -f '{{.Dir}}'); do
            if [ -n "$(go list -C "$dir" ./... 2>/dev/null)" ]; then
              echo "Scanning module: $dir"
              govulncheck -C "$dir" ./... || exit_code=$?
            fi
          done
          exit $exit_code

  # ── SBOM generation ────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SPDX-JSON SBOM
        # Scans the full repository (all languages/ecosystems Syft detects).
        # SPDX-JSON is the most interoperable format for downstream tooling.
        run: |
          syft . --output spdx-json=sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          retention-days: 90

  # ── detect-secrets baseline integrity ─────────────────────────────────────
  # AUDIT-INFRA-06: A contributor with push access can suppress new secrets by
  # updating .secrets.baseline. This job re-scans the repo and fails if the
  # committed baseline suppresses patterns not present in the current scan,
  # catching newly added suppressions. Combined with CODEOWNERS this ensures
  # that any baseline change requires security-team approval.
  detect-secrets-baseline:
    name: detect-secrets Baseline Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan repo (no baseline)
        run: detect-secrets scan > /tmp/current_scan.json

      - name: Verify baseline has not regressed
        run: python scripts/verify_secrets_baseline.py .secrets.baseline /tmp/current_scan.json

  # ── Semgrep SAST ───────────────────────────────────────────────────────────
  # Uses the official semgrep/semgrep Docker image so no binary installation
  # is required.  Runs diff-aware analysis on PRs and full-scan on main.
  # Results are uploaded to GitHub Advanced Security as SARIF so findings
  # appear in the Security → Code Scanning tab.
  # SEMGREP_APP_TOKEN secret: Settings → Secrets → Actions → New repository secret.
  # Without the token Semgrep falls back to OSS rules (still useful, no fail).
  # (MOD-5: audit 2026-02-24)
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read
    container:
      image: semgrep/semgrep:1.113.0  # RZ-22-03: pin to specific version
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep SAST
        # --sarif-output writes to a file instead of stdout so the exit
        # code only reflects scan errors, not finding count.
        run: semgrep ci --sarif --sarif-output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
