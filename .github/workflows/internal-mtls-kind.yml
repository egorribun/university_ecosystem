name: Internal mTLS kind proof

# AUD-373: proves the gateway-to-backend SPIFFE mTLS hop on a disposable kind cluster.
# The owner decision is that there is no staging cluster; this hosted job is the proof.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend.Dockerfile"
      - "backend.Dockerfile.dockerignore"
      - ".dockerignore"
      - "app/**"
      - "native/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "go.mod"
      - "go.sum"
      - "gen/go/**"
      - "services/pkg/logging/**"
      - "services/pkg/spiffe/**"
      - "k8s/README.md"
      - "charts/**"
      - "k8s/spire/**"
      - "services/gateway/**"
      - "app/server/**"
      - "scripts/kind/**"
      - ".github/workflows/internal-mtls-kind.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only runs for the same PR supersede each other. Manual and scheduled runs
  # have independent groups; the script cleans up only its own named resources.
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('aud373-kind-pr-{0}', github.event.pull_request.number)
    || format('aud373-kind-{0}-{1}-{2}', github.event_name, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aud373-kind-proof:
    name: AUD-373 kind SPIFFE mTLS proof
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run kind mTLS proof
        env:
          UE_KIND_DIAG_DIR: ${{ runner.temp }}/aud373-diagnostics
        run: bash scripts/kind/aud373_internal_mtls_proof.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aud373-internal-mtls-kind-diagnostics
          path: ${{ runner.temp }}/aud373-diagnostics
          retention-days: 14
          if-no-files-found: error
