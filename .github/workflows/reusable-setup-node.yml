# Reusable Node.js Setup Workflow
#
# Call from other workflows:
#   jobs:
#     setup:
#       uses: ./.github/workflows/reusable-setup-node.yml
#       with:
#         node-version: '22'
#         working-directory: 'frontend'

name: Setup Node.js

on:
    workflow_call:
        inputs:
            node-version:
                description: "Node.js version to install"
                required: false
                type: string
                default: "22"
            working-directory:
                description: "Working directory for npm install"
                required: false
                type: string
                default: "frontend"
            install-deps:
                description: "Run npm ci to install dependencies"
                required: false
                type: boolean
                default: true

jobs:
    setup:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ inputs.working-directory }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup Node.js ${{ inputs.node-version }}
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: npm
                  cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

            - name: Install dependencies
              if: ${{ inputs.install-deps }}
              run: npm ci

