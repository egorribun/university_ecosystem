# Reusable Node.js Setup Workflow
#
# Call from other workflows:
#   jobs:
#     setup:
#       uses: ./.github/workflows/reusable-setup-node.yml
#       with:
#         node-version: '22'
#         working-directory: 'frontend'

name: Setup Node.js

on:
    workflow_call:
        inputs:
            node-version:
                description: "Node.js version to install"
                required: false
                type: string
                default: "22"
            working-directory:
                description: "Working directory for npm install"
                required: false
                type: string
                default: "frontend"
            install-deps:
                description: "Run npm ci to install dependencies"
                required: false
                type: boolean
                default: true

jobs:
    setup:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ inputs.working-directory }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node.js ${{ inputs.node-version }}
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: npm
                  cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

            - name: Install dependencies
              if: ${{ inputs.install-deps }}
              run: npm ci

