name: Auto-merge dependabot patches

on: pull_request

permissions: read-all

jobs:
  auto-merge:
    name: Auto Merge Dependabot Patches
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fetch PR details
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            // Regex: only patch-level bumps (e.g., bump pkg from 1.2.3 to 1.2.4)
            if (/bump .+ from \d+\.\d+\.\d+ to \d+\.\d+\.\d+$/.test(pr.title)) {
              // RZ-22-01: Use enableAutoMerge instead of direct merge.
              // enableAutoMerge gates on branch protection required status checks,
              // preventing merge before CI (tests, security audit, lint) passes.
              // The previous github.rest.pulls.merge() bypassed all checks.
              console.log("Enabling auto-merge for Dependabot patch PR #" + pr.number);
              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) { clientMutationId }
                }
              `, { pullRequestId: pr.node_id });
            } else {
              console.log("PR #" + pr.number + " is not a patch bump. Skipping auto-merge.");
            }

