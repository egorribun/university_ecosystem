name: Auto-merge dependabot patches

on: pull_request

permissions: read-all

jobs:
  auto-merge:
    name: Auto Merge Dependabot Patches
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Fetch PR details
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            // Regex: only patch-level bumps (e.g., bump pkg from 1.2.3 to 1.2.4)
            if (/bump .+ from \d+\.\d+\.\d+ to \d+\.\d+\.\d+$/.test(pr.title)) {
              console.log("Auto-merging Dependabot patch PR #" + pr.number);
              await github.rest.pulls.merge({
                ...context.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
            } else {
              console.log("PR #" + pr.number + " is not a patch bump. Skipping auto-merge.");
            }

