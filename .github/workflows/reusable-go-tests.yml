# Reusable Go Tests Workflow
#
# Call from other workflows:
#   jobs:
#     go-tests:
#       uses: ./.github/workflows/reusable-go-tests.yml
#       with:
#         go-version: '1.25.x'

name: Go Tests

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use"
        required: false
        type: string
        default: "1.25.x"
      services:
        description: "Comma-separated list of service directories"
        required: false
        type: string
        default: "services/gateway,services/file-processor,services/ws-hub"

jobs:
  test:
    name: Test Go Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            go.sum

      - name: Install dependencies
        run: |
          IFS=',' read -ra SERVICES <<< "${{ inputs.services }}"
          for service in "${SERVICES[@]}"; do
            (cd "${service}" && go mod download)
          done

      - name: Run tests with coverage
        run: |
          IFS=',' read -ra SERVICES <<< "${{ inputs.services }}"
          for service in "${SERVICES[@]}"; do
            echo "Testing ${service}..."
            (cd "${service}" && go test -v -race -coverprofile=coverage.out ./...)
          done

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: |
            services/*/coverage.out

  lint:
    name: Lint Go Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: services/gateway

      - name: Run golangci-lint on file-processor
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: services/file-processor

      - name: Run golangci-lint on ws-hub
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: services/ws-hub

