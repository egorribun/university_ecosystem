# Reusable Go Tests Workflow
name: Go Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use"
        required: false
        type: string
        default: "1.26.6"
      service-directory:
        description: "Service directory to test (e.g., services/gateway)"
        required: true
        type: string
      coverage-threshold:
        description: "Minimum Go test coverage percentage"
        required: false
        type: number
        default: 80

jobs:
  test:
    name: Test Go Service (${{ inputs.service-directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            go.sum

      - name: Install dependencies
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          cd "$SERVICE_DIRECTORY"
          go mod download

      - name: Run tests with coverage
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          echo "Testing $SERVICE_DIRECTORY..."
          cd "$SERVICE_DIRECTORY"
          go test -v -race -coverprofile=coverage.out ./...

      # MOD-26-01: Enforce minimum Go test coverage on all non-generated/non-mock code.
      - name: Check coverage threshold
        shell: bash
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          cd "$SERVICE_DIRECTORY"
          if [ -f coverage.out ]; then
            # Filter out protobuf files, mock files, and generated schema/API files
            grep -vE "\.pb\.go|_mock\.go|mock_|/gen/go" coverage.out > coverage.filtered.out || true
            mv coverage.filtered.out coverage.out
          fi
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | tr -d '%')
          echo "Go test coverage (excluding generated/mocks): ${COVERAGE}%"
          THRESHOLD="$COVERAGE_THRESHOLD"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Install go-mutesting
        run: |
          # The pseudo-version v0.0.0-20210610104036-6d9217011a00 encodes the exact
          # commit hash 6d9217011a00, making this a reproducible, content-addressed
          # install equivalent to pinning by commit SHA.
          # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection
          GOBIN=/usr/local/bin go install github.com/zimmski/go-mutesting/cmd/go-mutesting@v0.0.0-20210610104036-6d9217011a00  # nosec

      - name: Run incremental mutation tests
        shell: bash
        env:
          BASE_REF_NAME: ${{ github.event.pull_request.base.ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          set -euo pipefail
          # Configure base ref for diff
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF_NAME" --depth=1
            BASE_REF="origin/$BASE_REF_NAME"
          else
            git fetch origin main --depth=1
            BASE_REF="HEAD~1"
            if ! git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
              BASE_REF="origin/main"
            fi
          fi
          if ! git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
            echo "::error::Unable to resolve mutation-test base revision '$BASE_REF'."
            exit 1
          fi

          echo "Comparing against $BASE_REF to find modified Go files..."

          # Find modified Go files within the service directory (excluding tests and generated files)
          CHANGED_PATHS="$(git diff --name-only "$BASE_REF"...HEAD)"
          CHANGED_FILES="$(
            printf '%s\n' "$CHANGED_PATHS" \
              | grep -E "^${SERVICE_DIRECTORY}/.*\.go$" \
              | grep -vE "_test\.go$|\.pb\.go$|/gen/" \
              || true
          )"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed Go source files found in $SERVICE_DIRECTORY. Skipping mutation tests."
            exit 0
          fi

          # Map files to their package paths relative to service directory
          cd "$SERVICE_DIRECTORY"
          PACKAGES=""
          for file in $CHANGED_FILES; do
            # Remove service-directory prefix
            rel_file=${file#"$SERVICE_DIRECTORY"/}
            pkg_dir=$(dirname "$rel_file")
            if [ "$pkg_dir" = "." ]; then
              pkg="."
            else
              pkg="./$pkg_dir"
            fi
            # Add to list if not already present
            if [[ " $PACKAGES " != *" $pkg "* ]]; then
              PACKAGES="$PACKAGES $pkg"
            fi
          done

          # Clean up whitespace
          PACKAGES=$(echo "$PACKAGES" | xargs)
          if [ -z "$PACKAGES" ]; then
            echo "::error::Changed Go files were found, but no mutation-test packages were resolved."
            exit 1
          fi

          echo "Running mutation tests on: $PACKAGES"
          # Run go-mutesting and fail if any mutant survives (exit code 1).
          # Limit execution time per package to keep CI fast (5m per package)
          for pkg in $PACKAGES; do
            echo "Mutating package $pkg..."
            log_file="/tmp/go-mutesting-${pkg//[^A-Za-z0-9_.-]/_}.log"
            set +e
            timeout 300s go-mutesting "$pkg" 2>&1 | tee "$log_file"
            pipeline_status=("${PIPESTATUS[@]}")
            status=${pipeline_status[0]}
            tee_status=${pipeline_status[1]}
            set -e
            if [ "$tee_status" -ne 0 ]; then
              echo "::error::Unable to persist go-mutesting output for $pkg (tee exit $tee_status)."
              exit "$tee_status"
            fi
            if [ "$status" -ne 0 ]; then
              if grep -Eq 'panic: runtime error|go/types\.\(\*StdSizes\)\.Sizeof' "$log_file"; then
                echo "::error::go-mutesting is incompatible with the active Go toolchain for $pkg; mutation evidence is unavailable. Pin or upgrade the mutator before merging."
                exit 1
              else
                echo "::error::go-mutesting failed for $pkg with exit code $status."
                exit "$status"
              fi
            fi
          done

      - name: Generate artifact name
        if: always()
        id: artifact-name
        shell: bash
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          # shellcheck disable=SC1003
          # Sanitize path: replace / and \ with -
          SANITIZED=$(echo "$SERVICE_DIRECTORY" | tr '/\\' '-')
          echo "name=go-coverage-$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            ${{ inputs.service-directory }}/coverage.out

  lint:
    name: Lint Go Service (${{ inputs.service-directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            services/cmd/uni-cli/go.sum
            services/pkg/spiffe/go.sum
            services/pkg/spicedb/go.sum
            go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.3.0
          install-mode: goinstall
          working-directory: ${{ inputs.service-directory }}
          args: --config ${{ github.workspace }}/.golangci.yml --timeout 5m
          # The action's default config verification downloads a remote JSON
          # schema. The lint run still parses and validates this config locally;
          # avoid making the required gate depend on schema-host availability.
          verify: false
