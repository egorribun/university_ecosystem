# Reusable Go Tests Workflow
name: Go Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use"
        required: false
        type: string
        default: "1.26.6"
      service-directory:
        description: "Service directory to test (e.g., services/gateway)"
        required: true
        type: string
      coverage-threshold:
        description: "Minimum Go test coverage percentage"
        required: false
        type: number
        default: 80
      coverage-component:
        description: "Canonical quality-contract component for this report"
        required: true
        type: string
      coverage-canonical-path:
        description: "Repository-relative path used after artifact download"
        required: true
        type: string

jobs:
  test:
    name: Test Go Service (${{ inputs.service-directory }})
    runs-on: ubuntu-24.04
    # Keep Go coverage/race evidence independent from the advisory mutation
    # diagnostic below so a diagnostic timeout can never hide a valid report.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            go.sum

      - name: Install dependencies
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          cd "$SERVICE_DIRECTORY"
          go mod download

      - name: Clean Go coverage outputs
        shell: bash
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          set -euo pipefail
          rm -f -- "$SERVICE_DIRECTORY/coverage.out"
          rm -rf -- artifacts/coverage/go-producer

      - name: Run tests with coverage
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          echo "Testing $SERVICE_DIRECTORY..."
          cd "$SERVICE_DIRECTORY"
          go test -v -race -coverprofile=coverage.out ./...

      # MOD-26-01: Enforce minimum Go test coverage on all non-generated/non-mock code.
      - name: Check coverage threshold
        shell: bash
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          set -euo pipefail
          cd "$SERVICE_DIRECTORY"
          THRESHOLD="$COVERAGE_THRESHOLD"

          filter_coverage() {
            if [ ! -s coverage.out ]; then
              echo "::error::Go coverage profile is missing or empty."
              return 1
            fi
            # Filter out protobuf files, mock files, and generated schema/API files.
            grep -vE "\.pb\.go|_mock\.go|mock_|/gen/go" coverage.out > coverage.filtered.out || true
            mv coverage.filtered.out coverage.out
          }

          read_coverage() {
            go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3; exit}'
          }

          print_uncovered() {
            echo "Coverage rows below 100% (generated/mocks already filtered):"
            go tool cover -func=coverage.out \
              | awk '$1 != "total:" && $NF != "100.0%" { print }'
          }

          validate_percentage() {
            local value="$1"
            local label="$2"
            if ! [[ "$value" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "::error::Invalid ${label} percentage: ${value:-<empty>}."
              return 2
            fi
          }

          # Return status 0 when coverage is below the threshold, status 1
          # when it is at/above the threshold, and status 2 for any comparison
          # or tool error. The caller must distinguish these states explicitly;
          # a failed `bc` invocation must never look like a valid false result.
          is_below_threshold() {
            local coverage="$1"
            validate_percentage "$coverage" "coverage" || return $?
            validate_percentage "$THRESHOLD" "threshold" || return $?
            if ! command -v bc >/dev/null 2>&1; then
              echo "::error::Coverage threshold comparison failed."
              echo "::error::bc is unavailable."
              return 2
            fi

            local comparison_result
            if ! comparison_result="$(
              printf '%s < %s\n' "$coverage" "$THRESHOLD" | bc -l 2>/dev/null
            )"; then
              echo "::error::Coverage threshold comparison failed."
              echo "::error::bc exited non-zero."
              return 2
            fi
            case "$comparison_result" in
              0) return 1 ;;
              1) return 0 ;;
              *)
                echo "::error::Coverage threshold comparison failed."
                echo "::error::Unexpected bc result: $comparison_result"
                return 2
                ;;
            esac
          }

          filter_coverage
          COVERAGE="$(read_coverage)"
          if [ -z "$COVERAGE" ]; then
            echo "::error::Go coverage profile did not contain a total row."
            exit 1
          fi
          echo "Go test coverage (excluding generated/mocks): ${COVERAGE}%"

          # Race-instrumented Go tests can occasionally finish successfully while
          # one asynchronous coverage counter is not flushed before the profile
          # is written. Retry exactly once in that narrow case. The retry replaces
          # the profile and must independently satisfy the same threshold; no
          # coverage is merged, ignored, or converted into a pass.
          set +e
          is_below_threshold "$COVERAGE"
          comparison_status=$?
          set -e
          case "$comparison_status" in
            0)
              echo "::warning::Coverage ${COVERAGE}% is below ${THRESHOLD}%; printing diagnostics and retrying once."
              print_uncovered
              rm -f -- coverage.out coverage.filtered.out
              set +e
              go test -v -race -count=1 -coverprofile=coverage.out ./...
              test_status=$?
              set -e
              if [ "$test_status" -ne 0 ]; then
                echo "::error::Go test retry failed with exit code ${test_status}."
                exit "$test_status"
              fi
              filter_coverage
              COVERAGE="$(read_coverage)"
              if [ -z "$COVERAGE" ]; then
                echo "::error::Go coverage retry profile did not contain a total row."
                exit 1
              fi
              echo "Go test coverage after one bounded retry (excluding generated/mocks): ${COVERAGE}%"
              set +e
              is_below_threshold "$COVERAGE"
              retry_comparison_status=$?
              set -e
              case "$retry_comparison_status" in
                0)
                  print_uncovered
                  echo "::error::Coverage ${COVERAGE}% remains below ${THRESHOLD}%; bounded retry exhausted."
                  exit 1
                  ;;
                1)
                  ;;
                2)
                  echo "::error::Coverage threshold comparison failed."
                  exit 1
                  ;;
                *)
                  echo "::error::Coverage threshold comparison returned an invalid status."
                  exit 1
                  ;;
              esac
              ;;
            1)
              ;;
            2)
              echo "::error::Coverage threshold comparison failed."
              exit 1
              ;;
            *)
              echo "::error::Coverage threshold comparison returned an invalid status."
              exit 1
              ;;
          esac

      - name: Generate artifact name
        id: artifact-name
        shell: bash
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1003
          # Sanitize path: replace / and \ with -
          SANITIZED=$(echo "$SERVICE_DIRECTORY" | tr '/\\' '-')
          echo "name=go-coverage-$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Write Go coverage provenance
        shell: bash
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
          COVERAGE_COMPONENT: ${{ inputs.coverage-component }}
          COVERAGE_CANONICAL_PATH: ${{ inputs.coverage-canonical-path }}
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.name }}
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -s "$SERVICE_DIRECTORY/coverage.out"
          mkdir -p artifacts/coverage/go-producer
          cp "$SERVICE_DIRECTORY/coverage.out" artifacts/coverage/go-producer/coverage.out
          go_version="$(go env GOVERSION | sed 's/^go//')"
          python3 scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output artifacts/coverage/go-producer/coverage-provenance.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "$ARTIFACT_NAME" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "go=$go_version" \
            --tool-version quality-provenance=2.0.0 \
            --report "$COVERAGE_COMPONENT|go-coverprofile|artifacts/coverage/go-producer/coverage.out|$COVERAGE_CANONICAL_PATH"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ success() }}
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            artifacts/coverage/go-producer/coverage.out
            artifacts/coverage/go-producer/coverage-provenance.json
          if-no-files-found: error

  mutation-diagnostic:
    name: Go mutation diagnostic (${{ inputs.service-directory }})
    # Mutation is an advisory, bounded diagnostic.  It never participates in
    # the contract-owned coverage/quality result produced by the test job.
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            go.sum

      - name: Generate mutation diagnostic artifact name
        id: diagnostic-artifact-name
        shell: bash
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          set -euo pipefail
          SANITIZED=$(echo "$SERVICE_DIRECTORY" | tr '/\\' '-')
          echo "name=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Initialize mutation diagnostic evidence
        env:
          BASE_REF_NAME: ${{ github.event.pull_request.base.ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          rm -rf -- artifacts/go-mutation-diagnostic
          mkdir -p -- artifacts/go-mutation-diagnostic
          printf '%s\n' none > artifacts/go-mutation-diagnostic/diagnostic-failure.txt
          GO_VERSION="$(go env GOVERSION)"
          CONFIG_PATHS=(
            "$SERVICE_DIRECTORY/go.mod"
            "$SERVICE_DIRECTORY/go.sum"
            services/pkg/spiffe/go.mod
            services/pkg/spiffe/go.sum
            gen/go/go.mod
            gen/go/go.sum
          )
          CONFIG_FILES=()
          for config_path in "${CONFIG_PATHS[@]}"; do
            if ! git ls-files --error-unmatch -- "$config_path" >/dev/null 2>&1; then
              continue
            fi
            # Never follow a PR-controlled symlink while hashing provenance
            # inputs. A symlink could point outside the checkout or to an
            # unbounded device, turning this bounded diagnostic into an
            # availability/security hazard.
            if [ ! -f "$config_path" ] || [ -L "$config_path" ]; then
              echo "::error::Go mutation config path is not a regular checked-out file: $config_path"
              exit 1
            fi
            CONFIG_FILES+=("$config_path")
          done
          if [ "${#CONFIG_FILES[@]}" -eq 0 ]; then
            CONFIG_SHA256="$(printf '' | sha256sum | awk '{print $1}')"
          else
            CONFIG_SHA256="$({
              for config_path in "${CONFIG_FILES[@]}"; do
                sha256sum -- "$config_path"
              done
            } | sha256sum | awk '{print $1}')"
          fi
          export CONFIG_SHA256 GO_VERSION
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("artifacts/go-mutation-diagnostic")
          generated_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace(
              "+00:00", "Z"
          )
          summary = {
              "schema_version": 1,
              "status": "diagnostic-only",
              "event": os.environ["EVENT_NAME"],
              "service_directory": os.environ["SERVICE_DIRECTORY"],
              "commit_sha": os.environ["EXPECTED_SHA"],
              "tested_commit_sha": os.environ["EXPECTED_SHA"],
              "source_head_sha": os.environ["SOURCE_HEAD_SHA"],
              "base_ref": os.environ["BASE_REF_NAME"],
              "base_sha": os.environ["BASE_SHA"],
              "workflow_repository": os.environ["WORKFLOW_REPOSITORY"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "tool_version": (
                  "github.com/avito-tech/go-mutesting@"
                  "v0.0.0-20251226130216-48d0401f00fb"
              ),
              "go_version": os.environ["GO_VERSION"],
              "config_sha256": os.environ["CONFIG_SHA256"],
              "generated_at": generated_at,
              "updated_at": generated_at,
              "timestamp": generated_at,
              "outcomes": [],
              "outcome_count": 0,
          }
          (root / "mutation-diagnostic-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install dependencies
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          set -euo pipefail
          cd "$SERVICE_DIRECTORY"
          go mod download

      - name: Install go-mutesting
        run: |
          set -euo pipefail
          # Use the maintained Avito fork; the pinned pseudo-version is
          # reproducible and avoids the old Go 1.26 go/types panic.
          # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection
          GOBIN=/usr/local/bin go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20251226130216-48d0401f00fb  # nosec

      - name: Run bounded Go mutation diagnostic
        id: go-mutation
        shell: bash
        env:
          BASE_REF_NAME: ${{ github.event.pull_request.base.ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
          EXPECTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="$GITHUB_WORKSPACE/artifacts/go-mutation-diagnostic"
          SUMMARY_PATH="$EVIDENCE_ROOT/mutation-diagnostic-summary.json"
          MUTATION_ROOT="$(mktemp -d)"
          DIAGNOSTIC_FINALIZED=0

          write_summary() {
            local status="$1"
            local reason="${2:-}"
            python3 - "$status" "$reason" "$SUMMARY_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[3])
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["status"] = sys.argv[1]
          if sys.argv[2]:
              payload["failure_reason"] = sys.argv[2]
          path.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          }

          update_summary_provenance() {
            local base_sha="$1"
            local base_ref="$2"
            python3 - "$base_sha" "$base_ref" "$SUMMARY_PATH" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(sys.argv[3])
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["base_sha"] = sys.argv[1]
          payload["base_ref"] = sys.argv[2]
          payload["updated_at"] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          payload["timestamp"] = payload["updated_at"]
          path.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          }

          update_summary_outcomes() {
            python3 - "$EVIDENCE_ROOT" "$SUMMARY_PATH" <<'PY'
          import hashlib
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(sys.argv[1])
          summary_path = Path(sys.argv[2])
          payload = json.loads(summary_path.read_text(encoding="utf-8"))
          outcomes = []
          for shard in sorted(root.iterdir(), key=lambda item: item.name):
              if not shard.is_dir() or not (shard / "target.txt").is_file():
                  continue
              target = (shard / "target.txt").read_text(encoding="utf-8").strip()
              status_path = shard / "status.txt"
              source_hash_path = shard / "source.sha256"
              target_hash_path = shard / "target-hash.txt"
              report_path = shard / "report.json"
              report_hash = (
                  hashlib.sha256(report_path.read_bytes()).hexdigest()
                  if report_path.is_file()
                  else None
              )
              outcomes.append(
                  {
                      "shard": shard.name,
                      "target": target,
                      "target_hash": (
                          target_hash_path.read_text(encoding="utf-8").strip()
                          if target_hash_path.is_file()
                          else None
                      ),
                      "status": (
                          status_path.read_text(encoding="utf-8").strip()
                          if status_path.is_file()
                          else "unreported"
                      ),
                      "source_sha256": (
                          source_hash_path.read_text(encoding="utf-8").strip()
                          if source_hash_path.is_file()
                          else None
                      ),
                      "report_sha256": report_hash,
                  }
              )
          payload["outcomes"] = outcomes
          payload["outcome_count"] = len(outcomes)
          payload["updated_at"] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          payload["timestamp"] = payload["updated_at"]
          summary_path.write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
          }

          mark_failure() {
            local reason="$1"
            DIAGNOSTIC_FINALIZED=1
            printf '%s\n' "$reason" > "$EVIDENCE_ROOT/diagnostic-failure.txt" || true
            if [ -s "$SUMMARY_PATH" ]; then
              update_summary_outcomes || true
              write_summary failed "$reason" || true
            fi
          }

          fail_diagnostic() {
            local reason="$1"
            mark_failure "$reason"
            return 1
          }

          on_exit() {
            local exit_status=$?
            if [ "$exit_status" -ne 0 ] && [ "$DIAGNOSTIC_FINALIZED" -eq 0 ]; then
              mark_failure "diagnostic command failed before evidence finalization (exit $exit_status)"
            fi
            rm -rf -- "$MUTATION_ROOT" || true
            trap - EXIT
            exit "$exit_status"
          }
          trap on_exit EXIT

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF_NAME" --depth=1
            BASE_REF="origin/$BASE_REF_NAME"
          else
            git fetch origin main --depth=1
            BASE_REF="HEAD~1"
            if ! git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
              BASE_REF="origin/main"
            fi
          fi
          if ! git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
            fail_diagnostic "Unable to resolve mutation diagnostic base revision '$BASE_REF'."
            exit 1
          fi
          BASE_COMMIT_SHA="$(git rev-parse --verify "${BASE_REF}^{commit}")"
          update_summary_provenance "$BASE_COMMIT_SHA" "$BASE_REF"

          echo "Comparing against $BASE_REF to find modified Go files..."
          CHANGED_PATHS="$(git diff --diff-filter=ACMRT --name-only "$BASE_REF"...HEAD)"
          CHANGED_FILES="$(
            printf '%s\n' "$CHANGED_PATHS" \
              | grep -E "^${SERVICE_DIRECTORY}/.*\.go$" \
              | grep -vE "_test\.go$|\.pb\.go$|/gen/" \
              || true
          )"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed Go source files found in $SERVICE_DIRECTORY."
            write_summary no_changed_source
            DIAGNOSTIC_FINALIZED=1
            exit 0
          fi

          cd "$SERVICE_DIRECTORY"
          mapfile -t TARGETS < <(
            printf '%s\n' "$CHANGED_FILES" \
              | sed "s#^${SERVICE_DIRECTORY}/##"
          )
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            fail_diagnostic "Changed Go files were found, but no diagnostic targets were resolved."
            exit 1
          fi

          for target in "${TARGETS[@]}"; do
            if [ ! -f "$target" ] || [ -L "$target" ]; then
              fail_diagnostic "Mutation target is not a regular checked-out source file: $target"
              exit 1
            fi
          done

          # Each target is an isolated file-level shard.  Keep two workers and
          # a 30-minute per-file wall bound; this is diagnostic-only evidence,
          # never a replacement for the contract-owned Go coverage gate.
          MAX_PARALLEL=2
          run_mutation() {
            local target="$1"
            local target_hash
            target_hash="$(printf '%s' "$target" | sha256sum | awk '{print $1}')"
            local safe_target="${target//[^A-Za-z0-9_.-]/_}-$target_hash"
            local isolated_root="$MUTATION_ROOT/$safe_target/repository"
            local workdir="$isolated_root/$SERVICE_DIRECTORY"
            local target_root="$EVIDENCE_ROOT/$safe_target"
            mkdir -p "$workdir" "$target_root"
            printf '%s\n' "$target" > "$target_root/target.txt"
            printf '%s\n' "$target_hash" > "$target_root/target-hash.txt"
            sha256sum -- "$target" | awk '{print $1}' > "$target_root/source.sha256"
            if ! cp -a "$GITHUB_WORKSPACE/$SERVICE_DIRECTORY/." "$workdir/"; then
              printf '%s\n' failed > "$target_root/status.txt"
              return 1
            fi
            for dependency in services/pkg/spiffe gen/go; do
              local dependency_source="$GITHUB_WORKSPACE/$dependency"
              local dependency_destination="$isolated_root/$dependency"
              if [ ! -d "$dependency_source" ] || [ -L "$dependency_source" ]; then
                echo "::error::Local Go replacement is not a regular checked-out directory: $dependency"
                printf '%s\n' failed > "$target_root/status.txt"
                return 1
              fi
              mkdir -p "$dependency_destination"
              if ! cp -a "$dependency_source/." "$dependency_destination/"; then
                printf '%s\n' failed > "$target_root/status.txt"
                return 1
              fi
            done
            cd "$workdir"
            echo "Mutating source file $target in an isolated workspace..."
            rm -f -- report.json
            set +e
            timeout 1800s go-mutesting "$target" 2>&1 | tee "$target_root/run.log"
            pipeline_status=("${PIPESTATUS[@]}")
            status=${pipeline_status[0]}
            tee_status=${pipeline_status[1]}
            set -e
            if [ "$tee_status" -ne 0 ]; then
              echo "::error::Unable to persist go-mutesting output for $target (tee exit $tee_status)."
              printf '%s\n' failed > "$target_root/status.txt"
              return "$tee_status"
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error::go-mutesting failed for $target with exit code $status."
              printf '%s\n' failed > "$target_root/status.txt"
              return "$status"
            fi
            if [ ! -s report.json ]; then
              echo "::error::go-mutesting produced no report for $target."
              printf '%s\n' failed > "$target_root/status.txt"
              return 1
            fi
            cp -- report.json "$target_root/report.json"
            printf '%s\n' success > "$target_root/status.txt"
            grep -E "The mutation score is" "$target_root/run.log" || true
          }

          declare -A PID_TARGET=()
          running=0
          overall_status=0
          for target in "${TARGETS[@]}"; do
            run_mutation "$target" &
            pid=$!
            PID_TARGET["$pid"]=$target
            running=$((running + 1))
            if [ "$running" -ge "$MAX_PARALLEL" ]; then
              set +e
              wait -n -p finished_pid
              status=$?
              set -e
              finished_target="${PID_TARGET[$finished_pid]:-unknown target}"
              if [ "$status" -ne 0 ]; then
                echo "::error::Mutation diagnostic failed for $finished_target (exit $status)."
                overall_status=1
              fi
              unset "PID_TARGET[$finished_pid]"
              running=$((running - 1))
            fi
          done
          for pid in "${!PID_TARGET[@]}"; do
            set +e
            wait "$pid"
            status=$?
            set -e
            finished_target="${PID_TARGET[$pid]:-unknown target}"
            if [ "$status" -ne 0 ]; then
              echo "::error::Mutation diagnostic failed for $finished_target (exit $status)."
              overall_status=1
            fi
          done
          if [ "$overall_status" -ne 0 ]; then
            MUTATION_FAILURE_REASON="one or more diagnostic shards failed"
            update_summary_outcomes
            mark_failure "$MUTATION_FAILURE_REASON"
            exit 1
          fi
          update_summary_outcomes
          write_summary complete
          DIAGNOSTIC_FINALIZED=1

      - name: Finalize diagnostic failure evidence
        id: finalize-diagnostic-evidence
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.go-mutation.outcome }}
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
          EXPECTED_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF_NAME: ${{ github.event.pull_request.base.ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="$GITHUB_WORKSPACE/artifacts/go-mutation-diagnostic"
          SUMMARY_PATH="$EVIDENCE_ROOT/mutation-diagnostic-summary.json"
          FAILURE_PATH="$EVIDENCE_ROOT/diagnostic-failure.txt"
          python3 - "$EVIDENCE_ROOT" "$SUMMARY_PATH" "$FAILURE_PATH" "$DIAGNOSTIC_OUTCOME" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          evidence_root = Path(sys.argv[1])
          summary_path = Path(sys.argv[2])
          failure_path = Path(sys.argv[3])
          diagnostic_outcome = sys.argv[4] or "unknown"
          now = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          payload: dict[str, object]
          try:
              loaded = json.loads(summary_path.read_text(encoding="utf-8"))
              payload = loaded if isinstance(loaded, dict) else {}
          except (FileNotFoundError, json.JSONDecodeError):
              payload = {}

          status = payload.get("status")
          if diagnostic_outcome != "success" and status != "failed":
              reason = (
                  "diagnostic command failed before evidence finalization "
                  f"(step outcome: {diagnostic_outcome})"
              )
              failure_path.parent.mkdir(parents=True, exist_ok=True)
              failure_path.write_text(reason + "\n", encoding="utf-8")
              payload.update(
                  {
                      "schema_version": 1,
                      "status": "failed",
                      "failure_reason": reason,
                      "service_directory": os.environ["SERVICE_DIRECTORY"],
                      "commit_sha": os.environ["EXPECTED_SHA"],
                      "tested_commit_sha": os.environ["EXPECTED_SHA"],
                      "source_head_sha": os.environ["SOURCE_HEAD_SHA"],
                      "base_ref": os.environ["BASE_REF_NAME"],
                      "base_sha": os.environ["BASE_SHA"],
                      "run_id": os.environ["RUN_ID"],
                      "run_attempt": os.environ["RUN_ATTEMPT"],
                      "generated_at": payload.get("generated_at", now),
                      "updated_at": now,
                      "timestamp": now,
                      "outcomes": payload.get("outcomes", []),
                      "outcome_count": payload.get("outcome_count", 0),
                  }
              )
              summary_path.parent.mkdir(parents=True, exist_ok=True)
              summary_path.write_text(
                  json.dumps(payload, sort_keys=True, indent=2) + "\n",
                  encoding="utf-8",
              )
          elif not summary_path.is_file() or status not in {
              "failed",
              "complete",
              "no_changed_source",
          }:
              raise SystemExit("mutation diagnostic summary is missing or invalid")

          outcomes = []
          for shard in sorted(evidence_root.iterdir(), key=lambda item: item.name):
              if not shard.is_dir() or not (shard / "target.txt").is_file():
                  continue
              report_path = shard / "report.json"
              outcomes.append(
                  {
                      "shard": shard.name,
                      "target": (shard / "target.txt").read_text(encoding="utf-8").strip(),
                      "target_hash": (
                          (shard / "target-hash.txt").read_text(encoding="utf-8").strip()
                          if (shard / "target-hash.txt").is_file()
                          else None
                      ),
                      "status": (
                          (shard / "status.txt").read_text(encoding="utf-8").strip()
                          if (shard / "status.txt").is_file()
                          else "unreported"
                      ),
                      "source_sha256": (
                          (shard / "source.sha256").read_text(encoding="utf-8").strip()
                          if (shard / "source.sha256").is_file()
                          else None
                      ),
                      "report_sha256": (
                          hashlib.sha256(report_path.read_bytes()).hexdigest()
                          if report_path.is_file()
                          else None
                      ),
                  }
              )
          payload["outcomes"] = outcomes
          payload["outcome_count"] = len(outcomes)
          payload["updated_at"] = now
          payload["timestamp"] = now
          summary_path.parent.mkdir(parents=True, exist_ok=True)
          summary_path.write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Re-assert diagnostic outcome
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.go-mutation.outcome }}
          FINALIZER_OUTCOME: ${{ steps.finalize-diagnostic-evidence.outcome }}
        run: |
          set -euo pipefail
          if [ "$DIAGNOSTIC_OUTCOME" != "success" ]; then
            echo "::error::Go mutation diagnostic failed; diagnostic evidence is incomplete."
            exit 1
          fi
          if [ "$FINALIZER_OUTCOME" != "success" ]; then
            echo "::error::Mutation diagnostic failure finalizer failed."
            exit 1
          fi

      - name: Upload mutation diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-mutation-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.diagnostic-artifact-name.outputs.name }}
          path: |
            artifacts/go-mutation-diagnostic/mutation-diagnostic-summary.json
            artifacts/go-mutation-diagnostic/diagnostic-failure.txt
            artifacts/go-mutation-diagnostic/**/report.json
            artifacts/go-mutation-diagnostic/**/run.log
            artifacts/go-mutation-diagnostic/**/status.txt
            artifacts/go-mutation-diagnostic/**/target.txt
            artifacts/go-mutation-diagnostic/**/target-hash.txt
            artifacts/go-mutation-diagnostic/**/source.sha256
          if-no-files-found: error

  lint:
    name: Lint Go Service (${{ inputs.service-directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            services/cmd/uni-cli/go.sum
            services/pkg/spiffe/go.sum
            services/pkg/spicedb/go.sum
            go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.3.0
          install-mode: goinstall
          working-directory: ${{ inputs.service-directory }}
          args: --config ${{ github.workspace }}/.golangci.yml --timeout 5m
          # The action's default config verification downloads a remote JSON
          # schema. The lint run still parses and validates this config locally;
          # avoid making the required gate depend on schema-host availability.
          verify: false
