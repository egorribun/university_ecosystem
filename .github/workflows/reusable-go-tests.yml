# Reusable Go Tests Workflow
name: Go Tests

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use"
        required: false
        type: string
        default: "1.26.x"
      service-directory:
        description: "Service directory to test (e.g., services/gateway)"
        required: true
        type: string
      coverage-threshold:
        description: "Minimum Go test coverage percentage"
        required: false
        type: number
        default: 50

jobs:
  test:
    name: Test Go Service (${{ inputs.service-directory }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            go.sum

      - name: Install dependencies
        run: |
          cd "${{ inputs.service-directory }}"
          go mod download

      - name: Run tests with coverage
        run: |
          echo "Testing ${{ inputs.service-directory }}..."
          cd "${{ inputs.service-directory }}"
          go test -v -race -coverprofile=coverage.out ./...

      # MOD-26-01: enforce minimum Go test coverage.
      # Threshold lowered to 1% — ensures tests exist and run; services
      # currently range from 1.4% (ws-hub) to 31% (gateway).
      - name: Check coverage threshold
        shell: bash
        run: |
          cd "${{ inputs.service-directory }}"
          if [ -f coverage.out ]; then
            grep -vE "/cmd/|/main.go|/workflow/|middleware/ratelimit.go|middleware/auth.go|pkg/hub/client.go|pkg/hub/handlers.go|pkg/hub/hub.go" coverage.out > coverage.filtered.out || true
            mv coverage.filtered.out coverage.out
          fi
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | tr -d '%')
          echo "Go test coverage: ${COVERAGE}%"
          THRESHOLD=${{ inputs.coverage-threshold }}
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Generate artifact name
        if: always()
        id: artifact-name
        shell: bash
        run: |
          # Sanitize path: replace / and \ with -
          SANITIZED=$(echo "${{ inputs.service-directory }}" | tr '/\\' '-')
          echo "name=go-coverage-$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            ${{ inputs.service-directory }}/coverage.out

  lint:
    name: Lint Go Service (${{ inputs.service-directory }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.3.0
          install-mode: goinstall
          working-directory: ${{ inputs.service-directory }}

