# Reusable Go Tests Workflow
name: Go Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use"
        required: false
        type: string
        default: "1.26.6"
      service-directory:
        description: "Service directory to test (e.g., services/gateway)"
        required: true
        type: string
      coverage-threshold:
        description: "Minimum Go test coverage percentage"
        required: false
        type: number
        default: 80
      coverage-component:
        description: "Canonical quality-contract component for this report"
        required: true
        type: string
      coverage-canonical-path:
        description: "Repository-relative path used after artifact download"
        required: true
        type: string

jobs:
  test:
    name: Test Go Service (${{ inputs.service-directory }})
    runs-on: ubuntu-24.04
    # Large entrypoints (notably gateway/cmd/gateway/main.go) can contain
    # hundreds of mutants. Keep the blocking mutation evidence fail-closed,
    # but give the complete changed-source set enough wall-clock budget to
    # finish instead of converting a valid run into an outer timeout.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            go.sum

      - name: Install dependencies
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          cd "$SERVICE_DIRECTORY"
          go mod download

      - name: Clean Go coverage outputs
        shell: bash
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          set -euo pipefail
          rm -f -- "$SERVICE_DIRECTORY/coverage.out"
          rm -rf -- artifacts/coverage/go-producer

      - name: Run tests with coverage
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          echo "Testing $SERVICE_DIRECTORY..."
          cd "$SERVICE_DIRECTORY"
          go test -v -race -coverprofile=coverage.out ./...

      # MOD-26-01: Enforce minimum Go test coverage on all non-generated/non-mock code.
      - name: Check coverage threshold
        shell: bash
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          cd "$SERVICE_DIRECTORY"
          if [ -f coverage.out ]; then
            # Filter out protobuf files, mock files, and generated schema/API files
            grep -vE "\.pb\.go|_mock\.go|mock_|/gen/go" coverage.out > coverage.filtered.out || true
            mv coverage.filtered.out coverage.out
          fi
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | tr -d '%')
          echo "Go test coverage (excluding generated/mocks): ${COVERAGE}%"
          THRESHOLD="$COVERAGE_THRESHOLD"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Install go-mutesting
        run: |
          # Use the maintained Avito fork. The original zimmski release vendors
          # golang.org/x/tools from 2019 and panics in go/types with Go 1.26.
          # This pseudo-version encodes the exact v2.3.1 commit 48d0401f00fb,
          # making the install reproducible and content-addressed.
          # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection
          GOBIN=/usr/local/bin go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20251226130216-48d0401f00fb  # nosec

      - name: Run incremental mutation tests
        shell: bash
        env:
          BASE_REF_NAME: ${{ github.event.pull_request.base.ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          set -euo pipefail
          # Configure base ref for diff
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF_NAME" --depth=1
            BASE_REF="origin/$BASE_REF_NAME"
          else
            git fetch origin main --depth=1
            BASE_REF="HEAD~1"
            if ! git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
              BASE_REF="origin/main"
            fi
          fi
          if ! git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
            echo "::error::Unable to resolve mutation-test base revision '$BASE_REF'."
            exit 1
          fi

          echo "Comparing against $BASE_REF to find modified Go files..."

          # Find modified Go files within the service directory (excluding tests and generated files)
          CHANGED_PATHS="$(git diff --name-only "$BASE_REF"...HEAD)"
          CHANGED_FILES="$(
            printf '%s\n' "$CHANGED_PATHS" \
              | grep -E "^${SERVICE_DIRECTORY}/.*\.go$" \
              | grep -vE "_test\.go$|\.pb\.go$|/gen/" \
              || true
          )"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed Go source files found in $SERVICE_DIRECTORY. Skipping mutation tests."
            exit 0
          fi

          # Mutate each changed source file directly. Mutating a whole package
          # expands the scope to unrelated files and used to trigger the old
          # mutator's Go 1.26 go/types panic at package loading time.
          cd "$SERVICE_DIRECTORY"
          mapfile -t TARGETS < <(
            printf '%s\n' "$CHANGED_FILES" \
              | sed "s#^${SERVICE_DIRECTORY}/##"
          )
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "::error::Changed Go files were found, but no mutation-test source files were resolved."
            exit 1
          fi

           echo "Running mutation tests on: ${TARGETS[*]}"
           # The maintained CLI reports surviving mutants in report.json but
           # returns non-zero only for an execution/tool failure. Treat that
           # distinction explicitly: a panic, timeout, or missing report fails
           # closed; a score is retained in the CI log for auditability. Large
           # entrypoints can legitimately contain hundreds of mutants, so allow
           # up to 60 minutes for one source file without weakening failure
           # handling. Run two isolated targets concurrently: the previous
           # sequential loop exceeded the 120-minute job deadline for ws-hub,
           # while sharing report.json would make parallel execution unsafe.
           MAX_PARALLEL="${GO_MUTATION_PARALLELISM:-2}"
           if ! [[ "$MAX_PARALLEL" =~ ^[1-9][0-9]*$ ]]; then
             echo "::error::GO_MUTATION_PARALLELISM must be a positive integer."
             exit 1
           fi
           MUTATION_ROOT="$(mktemp -d)"
           trap 'rm -rf -- "$MUTATION_ROOT"' EXIT

           run_mutation() {
             local target="$1"
             local safe_target="${target//[^A-Za-z0-9_.-]/_}"
             local workdir="$MUTATION_ROOT/$safe_target"
             local log_file="$MUTATION_ROOT/$safe_target.log"

             mkdir -p "$workdir"
             cp -a "$GITHUB_WORKSPACE/$SERVICE_DIRECTORY/." "$workdir/"
             cd "$workdir"
             echo "Mutating source file $target in an isolated workspace..."
             rm -f report.json
             set +e
             timeout 3600s go-mutesting "$target" 2>&1 | tee "$log_file"
             pipeline_status=("${PIPESTATUS[@]}")
             status=${pipeline_status[0]}
             tee_status=${pipeline_status[1]}
             set -e
             if [ "$tee_status" -ne 0 ]; then
               echo "::error::Unable to persist go-mutesting output for $target (tee exit $tee_status)."
               return "$tee_status"
             fi
             if [ "$status" -ne 0 ]; then
               if grep -Eq 'panic: runtime error|go/types\.\(\*StdSizes\)\.Sizeof' "$log_file"; then
                 echo "::error::go-mutesting failed under the active Go toolchain for $target; mutation evidence is unavailable."
                 return 1
               fi
               echo "::error::go-mutesting failed for $target with exit code $status."
               return "$status"
             fi
             if [ ! -s report.json ]; then
               echo "::error::go-mutesting produced no report for $target."
               return 1
             fi
             grep -E "The mutation score is" "$log_file" || true
             rm -f report.json
           }

           declare -A PID_TARGET=()
           running=0
           overall_status=0
           for target in "${TARGETS[@]}"; do
             run_mutation "$target" &
             pid=$!
             PID_TARGET["$pid"]="$target"
             running=$((running + 1))
             if [ "$running" -ge "$MAX_PARALLEL" ]; then
               set +e
               wait -n -p finished_pid
               status=$?
               set -e
               finished_target="${PID_TARGET[$finished_pid]:-unknown target}"
               if [ "$status" -ne 0 ]; then
                 echo "::error::Mutation test failed for $finished_target (exit $status)."
                 overall_status=1
               else
                 echo "Mutation test completed for $finished_target."
               fi
               unset "PID_TARGET[$finished_pid]"
               running=$((running - 1))
             fi
           done

           for pid in "${!PID_TARGET[@]}"; do
             set +e
             wait "$pid"
             status=$?
             set -e
             finished_target="${PID_TARGET[$pid]:-unknown target}"
             if [ "$status" -ne 0 ]; then
               echo "::error::Mutation test failed for $finished_target (exit $status)."
               overall_status=1
             else
               echo "Mutation test completed for $finished_target."
             fi
           done
           exit "$overall_status"

      - name: Generate artifact name
        id: artifact-name
        shell: bash
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
        run: |
          # shellcheck disable=SC1003
          # Sanitize path: replace / and \ with -
          SANITIZED=$(echo "$SERVICE_DIRECTORY" | tr '/\\' '-')
          echo "name=go-coverage-$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Write Go coverage provenance
        shell: bash
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
          COVERAGE_COMPONENT: ${{ inputs.coverage-component }}
          COVERAGE_CANONICAL_PATH: ${{ inputs.coverage-canonical-path }}
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.name }}
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -s "$SERVICE_DIRECTORY/coverage.out"
          mkdir -p artifacts/coverage/go-producer
          cp "$SERVICE_DIRECTORY/coverage.out" artifacts/coverage/go-producer/coverage.out
          go_version="$(go env GOVERSION | sed 's/^go//')"
          python3 scripts/quality/coverage_provenance.py write \
            --repository-root "$GITHUB_WORKSPACE" \
            --output artifacts/coverage/go-producer/coverage-provenance.json \
            --expected-sha "$EXPECTED_SHA" \
            --identity-provider github-actions \
            --repository "$WORKFLOW_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT" \
            --job "$GITHUB_JOB" \
            --artifact "$ARTIFACT_NAME" \
            --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tool-version "go=$go_version" \
            --tool-version quality-provenance=2.0.0 \
            --report "$COVERAGE_COMPONENT|go-coverprofile|artifacts/coverage/go-producer/coverage.out|$COVERAGE_CANONICAL_PATH"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ success() }}
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            artifacts/coverage/go-producer/coverage.out
            artifacts/coverage/go-producer/coverage-provenance.json
          if-no-files-found: error

  lint:
    name: Lint Go Service (${{ inputs.service-directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: |
            services/gateway/go.sum
            services/file-processor/go.sum
            services/ws-hub/go.sum
            services/cmd/uni-cli/go.sum
            services/pkg/spiffe/go.sum
            services/pkg/spicedb/go.sum
            go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.3.0
          install-mode: goinstall
          working-directory: ${{ inputs.service-directory }}
          args: --config ${{ github.workspace }}/.golangci.yml --timeout 5m
          # The action's default config verification downloads a remote JSON
          # schema. The lint run still parses and validates this config locally;
          # avoid making the required gate depend on schema-host availability.
          verify: false
