# Reusable Backend Tests Workflow
name: Backend Tests

permissions:
    contents: read

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.14"
            coverage-threshold:
                description: "Minimum coverage percentage"
                required: false
                type: number
                default: 90
            run-integration-tests:
                description: "Run PostgreSQL integration tests"
                required: false
                type: boolean
                default: false
            run-unit-tests:
                description: "Run the unit-test job"
                required: false
                type: boolean
                default: true
            test-group-name:
                description: "Name of the test group (e.g., Auth, Events)"
                required: false
                type: string
                default: "All"
            test-pattern:
                description: "Pytest pattern to include (e.g., tests/test_auth*)"
                required: false
                type: string
                default: "tests/"
            integration-test-pattern:
                description: "Pytest pattern for the PostgreSQL integration job"
                required: false
                type: string
                default: "tests/integration/"
            parallel-workers:
                description: "Number of parallel workers for pytest-xdist (0 = auto, -1 = disabled)"
                required: false
                type: number
                default: 0
            shard-id:
                description: "0-based historical-duration shard index"
                required: false
                type: number
                default: -1
            num-shards:
                description: "Total number of historical-duration shards"
                required: false
                type: number
                default: 1
            integration-shard-id:
                description: "0-based historical-duration integration shard index"
                required: false
                type: number
                default: -1
            integration-num-shards:
                description: "Total number of historical-duration integration shards"
                required: false
                type: number
                default: 1
            fail-fast:
                description: "Stop on first test failure"
                required: false
                type: boolean
                default: false
            # MOD-24-03: Support free-threading CI variant (PEP 703).
            python-gil:
                description: "PYTHON_GIL value ('1' = default GIL, '0' = free-threading). Only effective on Python 3.14+."
                required: false
                type: string
                default: "1"
        secrets:
            SECRET_KEY:
                required: false
                description: "Application secret key"


jobs:
    unit-tests:
        name: Unit Tests (${{ inputs.test-group-name }})
        if: ${{ inputs.run-unit-tests }}
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        permissions:
            contents: read
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy_secret_key_for_ci_tests_at_least_32_chars' }}
            ENVIRONMENT: testing
            OTEL_SDK_DISABLED: "true"
            PYTHON_GIL: ${{ inputs.python-gil }}  # MOD-24-03: free-threading support
        services:
            redis:
                image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              shell: pwsh
              run: |
                  uv lock --check
                  uv sync --frozen

            - name: Build pinned Helm dependencies
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: v3.17.0

            - name: Resolve Helm chart dependencies
              shell: bash
              run: helm dependency build charts/university-ecosystem/

            - name: Run pytest
              shell: pwsh
              run: |  # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection
                  $parallelArgs = @()
                  if ("${{ inputs.parallel-workers }}" -ne "-1") {
                    if ("${{ inputs.parallel-workers }}" -eq "0") {
                      $parallelArgs = @("-n", "auto")
                    } else {
                      $parallelArgs = @("-n", "${{ inputs.parallel-workers }}")
                    }
                  }

                  $failFastArgs = @()
                  if ("${{ inputs.fail-fast }}" -eq "true") {
                    $failFastArgs = @("-x")
                  }

                  $shardArgs = @()
                  $shardSuffix = "full"
                  $coverageXmlName = "coverage.xml"
                  $coverageJsonName = "coverage.json"
                  if ("${{ inputs.num-shards }}" -gt "1") {
                    if ("${{ inputs.shard-id }}" -lt "0" -or "${{ inputs.shard-id }}" -ge "${{ inputs.num-shards }}") {
                      throw "shard-id must be between 0 and num-shards - 1"
                    }
                    $shardArgs = @(
                      "--shard-id=${{ inputs.shard-id }}",
                      "--num-shards=${{ inputs.num-shards }}"
                    )
                    $shardSuffix = "shard-${{ inputs.shard-id }}"
                    $coverageXmlName = "coverage-$shardSuffix.xml"
                    $coverageJsonName = "coverage-$shardSuffix.json"
                  }

                  $pytestArgs = @("${{ inputs.test-pattern }}")  # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection
                  $pytestArgs += $parallelArgs
                  $pytestArgs += $shardArgs
                  $pytestArgs += $failFastArgs

                  # pytest-cov must not enforce a whole-suite floor on an
                  # individual shard. The aggregate coverage-policy-gate
                  # combines the raw data files below and enforces the floor
                  # once all shards are present.
                  $coverageDataFile = ".coverage"
                  if ("${{ inputs.num-shards }}" -gt "1") {
                    $coverageDataFile = ".coverage.${{ inputs.shard-id }}"
                  }
                  $env:COVERAGE_FILE = $coverageDataFile
                  
                  # Ensure the artifact output folder exists
                  New-Item -ItemType Directory -Force artifacts/coverage/python | Out-Null
                  
                  $pytestArgs += @(
                    "--ignore=tests/test_schemathesis_api.py",
                    "--cov=app",
                    "--cov-report=xml:$coverageXmlName",
                    "--cov-report=json:artifacts/coverage/python/$coverageJsonName",
                    "--cov-report=term-missing",
                    "--junitxml=pytest-report.xml",
                    "--dist=loadgroup"
                  )

                  if ("${{ inputs.num-shards }}" -le "1" -and "${{ inputs.coverage-threshold }}" -gt "0") {
                    $pytestArgs += "--cov-fail-under=${{ inputs.coverage-threshold }}"  # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection
                  } else {
                    $pytestArgs += "--cov-fail-under=0"
                  }

                  uv run pytest @pytestArgs

            - name: Check differential coverage (diff-cover)
              # A sharded runner only owns a subset of the test universe.  Running
              # diff-cover here would either reference the old, non-existent
              # coverage-full.xml name or incorrectly fail a shard because another
              # shard owns the changed file.  The aggregate coverage-policy-gate
              # combines all four raw data files before enforcing repository-wide
              # coverage; retain this fast check for non-sharded callers.
              if: ${{ github.event_name == 'pull_request' && inputs.coverage-threshold > 0 && inputs.num-shards <= 1 }}
              shell: pwsh
              env:
                COMPARE_BRANCH: ${{ github.base_ref }}
              run: |
                $compareBranch = $env:COMPARE_BRANCH
                git fetch origin $compareBranch
                uv run diff-cover coverage.xml --compare-branch=origin/$compareBranch --fail-under=100

            - name: Upload coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: backend-coverage-${{ inputs.test-group-name }}
                  path: |
                      coverage-*.xml
                      artifacts/coverage/python/coverage-*.json

            - name: Upload raw coverage data for aggregation
              if: ${{ inputs.num-shards > 1 }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: backend-coverage-data-${{ inputs.test-group-name }}
                  path: .coverage.${{ inputs.shard-id }}
                  include-hidden-files: true

            - name: Upload pytest report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: backend-pytest-report-${{ inputs.test-group-name }}
                  path: pytest-report.xml
                  if-no-files-found: warn

            - name: Update historical test durations
              if: always() && hashFiles('pytest-report.xml') != ''
              shell: pwsh
              env:
                TEST_GROUP_NAME: ${{ inputs.test-group-name }}
              run: |
                  uv run python scripts/quality/update_test_durations.py pytest-report.xml `
                    --output "artifacts/quality/test-durations-$env:TEST_GROUP_NAME.json"


    integration-tests:
        name: Integration Tests (${{ inputs.test-group-name }})
        if: ${{ inputs.run-integration-tests }}
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy_secret_key_for_ci_tests_at_least_32_chars' }}
            ENVIRONMENT: testing
            OTEL_SDK_DISABLED: "true"
            DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
            REDIS_URL: redis://localhost:6379
            REVOCATION_REDIS_URL: redis://localhost:6380/0
            RUN_INTEGRATION_TESTS: "1"
        services:
            postgres:
                image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                options: >-
                    --health-cmd "pg_isready -U test -d test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
            redis:
                image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            revocation-redis:
                image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
                ports:
                    - 6380:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              shell: pwsh
              run: |
                  uv sync --frozen

            - name: Wait for PostgreSQL
              shell: pwsh
              # LOW-W19: added max-iteration counter to prevent infinite loop
              run: |
                  $maxRetries = 30
                  $attempt = 0
                  do {
                    pg_isready -h localhost -p 5432 -U test
                    if ($LASTEXITCODE -eq 0) { break }
                    $attempt++
                    if ($attempt -ge $maxRetries) {
                      throw "PostgreSQL was not ready after $maxRetries seconds"
                    }
                    Start-Sleep -Seconds 1
                  } while ($true)

            - name: Run Alembic migrations
              shell: pwsh
              run: uv run alembic upgrade head

            - name: Test migration downgrade safety (MOD-03)
              shell: pwsh
              run: |
                  uv run alembic upgrade head
                  uv run alembic downgrade -1
                  uv run alembic upgrade head
                  echo "Migration round-trip succeeded"

            - name: Pre-pull testcontainer images with bounded retries
              shell: pwsh
              run: |
                  # Testcontainers pulls these images lazily.  A transient
                  # Docker Hub token/registry timeout must not turn a healthy
                  # integration suite into a false-negative CI failure.
                  $images = @(
                    "nats:2.10.25-alpine@sha256:3290c829aa05ddd4da12026783ccaff86f3fbc1f0551722908a934c293cd6228",
                    "postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b",
                    "redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2",
                    "pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f"
                  )
                  $maxAttempts = 5

                  foreach ($image in $images) {
                    $available = $false
                    for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
                      docker image inspect $image *> $null
                      if ($LASTEXITCODE -eq 0) {
                        $available = $true
                        break
                      }

                      Write-Host "Pulling $image (attempt $attempt/$maxAttempts)"
                      docker pull $image
                      if ($LASTEXITCODE -eq 0) {
                        $available = $true
                        break
                      }

                      if ($attempt -lt $maxAttempts) {
                        $delaySeconds = [int][math]::Pow(2, $attempt)
                        Write-Host "Retrying $image in $delaySeconds seconds"
                        Start-Sleep -Seconds $delaySeconds
                      }
                    }

                    if (-not $available) {
                      throw "Unable to make testcontainer image available after $maxAttempts attempts: $image"
                    }
                  }

            - name: Run integration tests
              shell: pwsh
              env:
                  INTEGRATION_SHARD_ID: ${{ inputs.integration-shard-id }}
                  INTEGRATION_NUM_SHARDS: ${{ inputs.integration-num-shards }}
                  INTEGRATION_TEST_PATTERN: ${{ inputs.integration-test-pattern }}
              run: |
                  $integrationShardArgs = @()
                  $integrationShardId = [int]$env:INTEGRATION_SHARD_ID
                  $integrationNumShards = [int]$env:INTEGRATION_NUM_SHARDS
                  if ($integrationShardId -ge 0 -or $integrationNumShards -ne 1) {
                    if ($integrationShardId -lt 0 -or $integrationShardId -ge $integrationNumShards -or $integrationNumShards -lt 1) {
                      throw "Invalid integration shard configuration: id=$integrationShardId total=$integrationNumShards"
                    }
                    $integrationShardArgs = @(
                      "--shard-id=$integrationShardId",
                      "--num-shards=$integrationNumShards"
                    )
                  }

                  $pytestArgs = @(
                    $env:INTEGRATION_TEST_PATTERN,
                    "tests/test_events_localization.py",
                    "tests/test_migrations_runtime.py",
                    "tests/test_query_plans.py",
                    "-v",
                    "--tb=short",
                    "-x"
                  )
                  $pytestArgs += $integrationShardArgs
                  $pytestArgs += @(
                    "--ignore=tests/performance",
                    "--ignore=tests/test_schemathesis_api.py"
                  )
                  uv run pytest @pytestArgs

            - name: Upload test results
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: failure()
              with:
                  name: postgres-test-failures-${{ inputs.test-group-name }}
                  path: pytest-report.xml
                  if-no-files-found: ignore
