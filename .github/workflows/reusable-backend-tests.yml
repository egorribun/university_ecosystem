# Reusable Backend Tests Workflow
name: Backend Tests

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.13"
            coverage-threshold:
                description: "Minimum coverage percentage"
                required: false
                type: number
                default: 72
            run-integration-tests:
                description: "Run PostgreSQL integration tests"
                required: false
                type: boolean
                default: false
            test-group-name:
                description: "Name of the test group (e.g., Auth, Events)"
                required: false
                type: string
                default: "All"
            test-pattern:
                description: "Pytest pattern to include (e.g., tests/test_auth*)"
                required: false
                type: string
                default: "tests/"
            parallel-workers:
                description: "Number of parallel workers for pytest-xdist (0 = auto, -1 = disabled)"
                required: false
                type: number
                default: 0
            fail-fast:
                description: "Stop on first test failure"
                required: false
                type: boolean
                default: false
        secrets:
            SECRET_KEY:
                required: false
                description: "Application secret key"

jobs:
    unit-tests:
        name: Unit Tests (${{ inputs.test-group-name }})
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy_secret_key_for_ci_tests_at_least_32_chars' }}
            ENVIRONMENT: testing
            OTEL_SDK_DISABLED: "true"
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v5

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              run: |
                  uv sync --frozen

            - name: Run pytest
              run: |
                  PARALLEL_ARGS=""
                  if [[ "${{ inputs.parallel-workers }}" != "-1" ]]; then
                    if [[ "${{ inputs.parallel-workers }}" == "0" ]]; then
                      PARALLEL_ARGS="-n auto"
                    else
                      PARALLEL_ARGS="-n ${{ inputs.parallel-workers }}"
                    fi
                  fi

                  FAIL_FAST=""
                  if [[ "${{ inputs.fail-fast }}" == "true" ]]; then
                    FAIL_FAST="-x"
                  fi

                  uv run pytest ${{ inputs.test-pattern }} \
                    $PARALLEL_ARGS \
                    $FAIL_FAST \
                    --cov=app \
                    --cov-report=xml \
                    --cov-report=term-missing \
                    --cov-fail-under=${{ inputs.coverage-threshold }} \
                    --junitxml=pytest-report.xml \
                    --dist=loadgroup

            - name: Upload coverage artifact
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage-${{ inputs.test-group-name }}
                  path: coverage.xml

            - name: Upload pytest report
              uses: actions/upload-artifact@v4
              with:
                  name: backend-pytest-report-${{ inputs.test-group-name }}
                  path: pytest-report.xml
                  if-no-files-found: warn

    integration-tests:
        name: Integration Tests (${{ inputs.test-group-name }})
        if: ${{ inputs.run-integration-tests }}
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy_secret_key_for_ci_tests_at_least_32_chars' }}
            ENVIRONMENT: testing
            OTEL_SDK_DISABLED: "true"
            DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
            REDIS_URL: redis://localhost:6379
        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v5

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              run: |
                  uv sync --frozen

            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432 -U test; do
                    sleep 1
                  done

            - name: Run Alembic migrations
              run: uv run alembic upgrade head

            - name: Run integration tests
              run: uv run pytest ${{ inputs.test-pattern }} -v --tb=short -x --ignore=tests/performance

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: postgres-test-failures-${{ inputs.test-group-name }}
                  path: pytest-report.xml
                  if-no-files-found: ignore
