# Reusable Backend Tests Workflow
name: Backend Tests

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.13"
            coverage-threshold:
                description: "Minimum coverage percentage"
                required: false
                type: number
                default: 80
            run-integration-tests:
                description: "Run PostgreSQL integration tests"
                required: false
                type: boolean
                default: false
            test-group-name:
                description: "Name of the test group (e.g., Auth, Events)"
                required: false
                type: string
                default: "All"
            test-pattern:
                description: "Pytest pattern to include (e.g., tests/test_auth*)"
                required: false
                type: string
                default: "tests/"
            parallel-workers:
                description: "Number of parallel workers for pytest-xdist (0 = auto, -1 = disabled)"
                required: false
                type: number
                default: 0
            fail-fast:
                description: "Stop on first test failure"
                required: false
                type: boolean
                default: false
        secrets:
            SECRET_KEY:
                required: false
                description: "Application secret key"

jobs:
    unit-tests:
        name: Unit Tests (${{ inputs.test-group-name }})
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy_secret_key_for_ci_tests_at_least_32_chars' }}
            ENVIRONMENT: testing
            OTEL_SDK_DISABLED: "true"
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              shell: pwsh
              run: |
                  uv lock --check
                  uv sync --frozen

            - name: Run pytest
              shell: pwsh
              run: |
                  $parallelArgs = @()
                  if ("${{ inputs.parallel-workers }}" -ne "-1") {
                    if ("${{ inputs.parallel-workers }}" -eq "0") {
                      $parallelArgs = @("-n", "auto")
                    } else {
                      $parallelArgs = @("-n", "${{ inputs.parallel-workers }}")
                    }
                  }

                  $failFastArgs = @()
                  if ("${{ inputs.fail-fast }}" -eq "true") {
                    $failFastArgs = @("-x")
                  }

                  uv run pytest ${{ inputs.test-pattern }} `
                    $parallelArgs `
                    $failFastArgs `
                    --cov=app `
                    --cov-report=xml `
                    --cov-report=term-missing `
                    --cov-fail-under=${{ inputs.coverage-threshold }} `
                    --junitxml=pytest-report.xml `
                    --dist=loadgroup

            - name: Upload coverage artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: backend-coverage-${{ inputs.test-group-name }}
                  path: coverage.xml

            - name: Upload pytest report
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: backend-pytest-report-${{ inputs.test-group-name }}
                  path: pytest-report.xml
                  if-no-files-found: warn

    integration-tests:
        name: Integration Tests (${{ inputs.test-group-name }})
        if: ${{ inputs.run-integration-tests }}
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy_secret_key_for_ci_tests_at_least_32_chars' }}
            ENVIRONMENT: testing
            OTEL_SDK_DISABLED: "true"
            DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
            REDIS_URL: redis://localhost:6379
        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Setup Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              shell: pwsh
              run: |
                  uv sync --frozen

            - name: Wait for PostgreSQL
              shell: pwsh
              run: |
                  do {
                    pg_isready -h localhost -p 5432 -U test
                    if ($LASTEXITCODE -eq 0) { break }
                    Start-Sleep -Seconds 1
                  } while ($true)

            - name: Run Alembic migrations
              shell: pwsh
              run: uv run alembic upgrade head

            - name: Test migration downgrade safety (MOD-03)
              shell: pwsh
              run: |
                  uv run alembic upgrade head
                  uv run alembic downgrade -1
                  uv run alembic upgrade head
                  echo "Migration round-trip succeeded"

            - name: Run integration tests
              shell: pwsh
              run: uv run pytest ${{ inputs.test-pattern }} -v --tb=short -x --ignore=tests/performance

            - name: Upload test results
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: failure()
              with:
                  name: postgres-test-failures-${{ inputs.test-group-name }}
                  path: pytest-report.xml
                  if-no-files-found: ignore


