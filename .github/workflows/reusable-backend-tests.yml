# Reusable Backend Tests Workflow
name: Backend Tests

permissions:
    contents: read

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.14"
            coverage-threshold:
                description: "Minimum coverage percentage"
                required: false
                type: number
                default: 90
            run-integration-tests:
                description: "Run PostgreSQL integration tests"
                required: false
                type: boolean
                default: false
            run-unit-tests:
                description: "Run the unit-test job"
                required: false
                type: boolean
                default: true
            test-group-name:
                description: "Name of the test group (e.g., Auth, Events)"
                required: false
                type: string
                default: "All"
            test-pattern:
                description: "Pytest pattern to include (e.g., tests/test_auth*)"
                required: false
                type: string
                default: "tests/"
            integration-test-pattern:
                description: "Pytest pattern for the PostgreSQL integration job"
                required: false
                type: string
                default: "tests/integration/"
            parallel-workers:
                description: "Number of parallel workers for pytest-xdist (0 = auto, -1 = disabled)"
                required: false
                type: number
                default: 0
            shard-id:
                description: "0-based historical-duration shard index"
                required: false
                type: number
                default: -1
            num-shards:
                description: "Total number of historical-duration shards"
                required: false
                type: number
                default: 1
            integration-shard-id:
                description: "0-based historical-duration integration shard index"
                required: false
                type: number
                default: -1
            integration-num-shards:
                description: "Total number of historical-duration integration shards"
                required: false
                type: number
                default: 1
            fail-fast:
                description: "Stop on first test failure"
                required: false
                type: boolean
                default: false
            # MOD-24-03: Support free-threading CI variant (PEP 703).
            python-gil:
                description: "PYTHON_GIL value ('1' = default GIL, '0' = free-threading). Only effective on Python 3.14+."
                required: false
                type: string
                default: "1"
        secrets:
            SECRET_KEY:
                required: false
                description: "Application secret key"


jobs:
    unit-tests:
        name: Unit Tests (${{ inputs.test-group-name }})
        if: ${{ inputs.run-unit-tests }}
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        permissions:
            contents: read
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy_secret_key_for_ci_tests_at_least_32_chars' }}
            ENVIRONMENT: testing
            OTEL_SDK_DISABLED: "true"
            # Authentication-capable unit tests exercise the revocation-aware
            # session path.  Keep the URL explicit even when the suite mocks
            # the Redis transport; the fail-closed client must never silently
            # fall back to the development default.
            REVOCATION_REDIS_URL: redis://localhost:6380/0
            PYTHON_GIL: ${{ inputs.python-gil }}  # MOD-24-03: free-threading support
        services:
            redis:
                image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              shell: pwsh
              run: |
                  uv lock --check
                  uv sync --frozen

            # Fail release-safety regressions early; the complete unit shard still
            # runs below, with its existing coverage and provenance gates unchanged.
            - name: Verify frozen-RC contracts and complete validator coverage
              if: ${{ inputs.shard-id == 0 }}
              timeout-minutes: 5
              shell: bash
              run: |
                  set -euo pipefail
                  focused_dir="$(mktemp -d "$RUNNER_TEMP/frozen-rc-coverage.XXXXXX")"
                  trap 'rm -rf -- "$focused_dir"' EXIT
                  rcfile="$focused_dir/coverage.ini"
                  datafile="$focused_dir/.coverage"
                  target="$GITHUB_WORKSPACE/scripts/quality/resolve_frozen_rc_manifest.py"
                  printf '[run]\nbranch = True\ninclude = %s\n' "$target" > "$rcfile"
                  COVERAGE_FILE="$datafile" uv run --frozen --no-sync pytest \
                    --cov --cov-branch --cov-config="$rcfile" --cov-report= -n 2 \
                    tests/test_frozen_rc_manifest.py \
                    tests/test_cli_tests.py::test_smoke_targets_the_existing_endpoint_smoke_suite tests/test_metrics_closure.py::test_cache_metrics_probe_the_actual_redis_layer tests/test_search_api.py::test_unified_search_sdk_failures_fall_back_to_empty_results tests/test_live_stand.py::test_live_playwright_full_count_matches_collected_inventory tests/test_live_stand.py::test_live_playwright_skip_index_matches_collected_inventory tests/test_live_stand.py::test_live_playwright_skip_map_matches_current_project_guard_declarations tests/test_helm_staging_contract.py::test_frontend_service_port_matches_node_listener tests/test_observability_closure.py::test_worker_status_tracks_last_outcome_not_wall_clock tests/test_cache_closure.py::test_tiered_backfill_does_not_extend_source_or_l1_expiry tests/test_cache_closure.py::test_tiered_redis_envelope_promotion_preserves_expiry tests/test_cache_closure.py::test_tiered_non_memory_promotion_requires_unbounded_source tests/test_cache_closure.py::test_tiered_rechecks_expiry_after_awaiting_l2 tests/test_cache_closure.py::test_tiered_cache_l1_hit_l2_backfill_and_miss tests/test_cache_closure.py::test_tiered_refuses_malformed_source_metadata tests/test_cache_closure.py::test_tiered_promotion_rechecks_after_normalization tests/test_cache_closure.py::test_tiered_promotion_preserves_lru_and_payload_ownership tests/test_cache_closure.py::test_tiered_does_not_bypass_memory_subclass_set tests/test_live_acceptance_workflow.py tests/test_live_stand.py::test_nats_outage_cli_exposes_owned_state_options tests/test_live_stand.py::test_nats_outage_requires_owned_state_before_state_side_effects tests/test_owned_nats_outage.py tests/test_owned_nats_correlation.py tests/test_owned_nats_restoration.py tests/test_owned_nats_worker_policy.py tests/test_owned_nats_outbox_state.py tests/test_owned_nats_broker.py tests/test_owned_nats_deadlines.py -v tests/test_compliance_service_coverage.py::test_register_user_failure_log_omits_exception_data tests/test_user_profile_service_closure.py::test_get_users_denies_one_character_non_admin_queries tests/test_user_profile_service_closure.py::test_get_users_allows_two_character_query_and_preserves_cursor tests/test_user_profile_service_closure.py::test_get_users_validates_effective_name_before_legacy_alias tests/test_user_profile_service_closure.py::test_get_users_preserves_name_precedence_and_legacy_fallback tests/test_user_profile_service_closure.py::test_get_users_preserves_one_character_admin_search tests/test_user_profile_service_closure.py::test_get_users_preserves_internal_one_character_search tests/test_nats_kv_cache.py tests/test_notification_task_nats_roundtrip.py::test_uuid_notification_ids_round_trip_through_nats_task_payload tests/test_auth_endpoints_coverage.py::test_register_endpoint tests/test_profile_media_ownership.py::test_s3_preserves_a_parsed_foreign_owner_key tests/test_profile_media_ownership.py::test_s3_deletes_a_parsed_current_owner_key_without_network tests/test_owned_nats_outage_coordinator.py tests/test_user_relationship_updates.py::test_update_attributes_creates_all_nested_children tests/test_user_relationship_updates.py::test_nested_updates_ignore_fields_outside_child_allowlists tests/test_user_relationship_updates.py::test_nested_profile_update_creates_missing_profile tests/test_duration_sharding_contract.py::test_duration_merge_omits_new_all_skipped_files_and_preserves_history tests/test_duration_sharding_contract.py::test_duration_merge_keeps_executed_and_mixed_file_estimates tests/services/test_chat_helpers.py::test_handle_message_sent_refreshes_preloaded_sender_profile tests/services/test_chat_helpers.py::test_notify_new_message_creates_push_for_other_participants tests/test_compare_paired_benchmarks.py::test_cli_applies_the_strict_regression_boundary tests/test_backend_api_runtime_contracts.py::test_notify_new_message_bounds_metrics_and_preserves_broadcast_ids tests/test_ical.py::TestGenerateScheduleIcs::test_generated_parity_tracks_iso_week_53_to_week_1 tests/test_owned_nats_process.py tests/test_schedule_repository_closure.py::test_schedule_repository_ignores_stale_process_cache tests/test_cqrs_schedule_handlers.py::test_create_invokes_service_and_invalidates_cache tests/test_cqrs_schedule_handlers.py::test_update_owner_succeeds_and_invalidates_both_groups tests/test_cqrs_schedule_handlers.py::test_delete_owner_success_invalidates_cache tests/test_event_repository_db.py::test_filtered_event_total_matches_exhaustive_listing tests/test_event_service_closure.py::test_get_events_non_active_first_page_uses_total_count tests/test_event_service_closure.py::test_get_events_cursor_page_builds_next_cursor_without_total tests/test_news_localization.py::test_clearing_existing_english_translations_persists_after_reload tests/test_live_stand.py::test_live_e2e_mode_maps_to_fixed_playwright_selection tests/test_live_stand.py::test_live_playwright_emits_only_validated_failure_locations tests/test_live_stand.py::test_live_playwright_failure_source_allowlist_matches_tracked_full_suite  tests/test_live_nats_owner_file_reader.py tests/test_event_date_order_http.py tests/test_events_cursor.py tests/test_events_api_closure.py::test_all_events_and_my_events_call_services tests/test_live_nats_lifecycle_lock.py tests/test_live_stand.py::test_compose_resource_projection_full_matches_existing_wrapper tests/test_live_stand.py::test_compose_resource_projection_core_preserves_closure_and_filtering tests/test_live_stand.py::test_compose_resource_projection_legacy_preserves_schema tests/test_live_stand.py::test_compose_resource_projection_preserves_malformed_model_errors tests/test_live_stand.py::test_compose_resource_projection_preserves_core_selection_errors tests/test_live_stand.py::test_compose_resource_wrapper_preserves_preprojection_failures tests/test_fast_preflight.py tests/test_fast_preflight_descendant_pipe_timeout.py tests/test_helm_keda_hibernation.py tests/test_lifespan.py::test_aud091_shutdown_attempts_independent_finalizers_in_order tests/test_lifespan_restart_contract.py tests/test_ci_critical_path_analysis.py::test_aud093_diagnostic_bound_excludes_independent_scheduling_gap tests/test_ci_critical_path_analysis.py::test_aud093_cli_serializes_execution_bound_separately_from_wall_span tests/test_lifespan.py::test_shutdown_subsystems tests/test_lifespan.py::test_shutdown_stops_the_cdc_worker_before_cancelling_tasks tests/test_lifespan.py::test_shutdown_is_unaffected_when_no_cdc_worker_was_started tests/test_helm_staging_contract.py::test_first_party_service_names_and_references_fit_dns_labels tests/test_outbox_worker.py::test_aud096_listener_reconnects_only_for_connection_loss tests/test_outbox_worker.py::test_outbox_worker_listen_loop_exceptions tests/test_gateway_api_helm_contract.py::test_gateway_api_template_preserves_tls_redirect_and_route_dispatch tests/test_outbox_worker.py::test_outbox_worker_listen_loop tests/test_metrics_endpoint.py::test_aud103_alert_inputs_are_real_exported_gauges tests/test_database_settings_closure.py::test_deployment_pool_defaults_match_database_settings tests/test_database_settings_closure.py::test_deployment_pool_override_example_remains_explicit tests/test_observability_closure.py::test_bounded_shutdown_joins_only_started_threads_with_shared_budget --durations=30 --durations-min=0.1
                  uv run --frozen --no-sync coverage report --rcfile="$rcfile" \
                    --data-file="$datafile" --include="$target" --fail-under=100

            # Surface audit regressions before the long shard; the full suite,
            # coverage collection and provenance below remain mandatory on success.
            - name: Verify focused audit regression contracts
              if: ${{ inputs.shard-id == 0 }}
              timeout-minutes: 5
              shell: bash
              run: |
                  set -euo pipefail
                  focused_dir="$(mktemp -d "$RUNNER_TEMP/audit-regressions.XXXXXX")"
                  trap 'rm -rf -- "$focused_dir"' EXIT
                  uv run --frozen --no-sync pytest -q -p no:cacheprovider --no-cov \
                    --basetemp="$focused_dir/pytest" \
                    tests/test_user_analytics_window_contracts.py \
                    tests/test_stats_api.py \
                    tests/test_email_reset_fragment_redaction.py \
                    tests/test_ci_critical_path_analysis.py \
                    tests/test_quality_workflow_contract.py::test_ci_success_publishes_current_run_health_artifact \
                    tests/test_aud467_settings_integration_environment.py \
                    tests/test_core_config.py::test_auto_create_schema_default_false_in_production \
                    tests/test_core_config.py::test_auto_create_schema_warns_when_enabled_in_production

            - name: Build pinned Helm dependencies
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: v4.2.4

            - name: Resolve Helm chart dependencies
              shell: bash
              run: |
                python3 scripts/ci/helm_dependency_build.py \
                  charts/university-ecosystem \
                  redis-0.1.0.tgz nats-2.15.0.tgz

            - name: Run pytest
              shell: pwsh
              env:
                  TEST_PATTERN: ${{ inputs.test-pattern }}
                  PARALLEL_WORKERS: ${{ inputs.parallel-workers }}
                  FAIL_FAST: ${{ inputs.fail-fast }}
                  SHARD_ID: ${{ inputs.shard-id }}
                  NUM_SHARDS: ${{ inputs.num-shards }}
                  COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
                  PYTEST_SHARD_MANIFEST: artifacts/coverage/python/pytest-shard-${{ inputs.shard-id }}.json
              run: |
                  # Keep all caller-controlled values in the step environment.
                  # Interpolating them into PowerShell source would turn a
                  # reusable-workflow input into executable runner code.
                  $parallelWorkers = [int]$env:PARALLEL_WORKERS
                  $parallelArgs = @()
                  if ($parallelWorkers -ne -1) {
                    if ($parallelWorkers -eq 0) {
                      $parallelArgs = @("-n", "auto")
                    } else {
                      $parallelArgs = @("-n", [string]$parallelWorkers)
                    }
                  }

                  $failFastArgs = @()
                  if ([System.Convert]::ToBoolean($env:FAIL_FAST)) {
                    $failFastArgs = @("-x")
                  }

                  $shardArgs = @()
                  $shardSuffix = "full"
                  $coverageXmlName = "coverage.xml"
                  $coverageJsonName = "coverage.json"
                  $shardId = [int]$env:SHARD_ID
                  $numShards = [int]$env:NUM_SHARDS
                  if ($numShards -gt 1) {
                    if ($shardId -lt 0 -or $shardId -ge $numShards) {
                      throw "shard-id must be between 0 and num-shards - 1"
                    }
                    $shardArgs = @(
                      "--shard-id=$shardId",
                      "--num-shards=$numShards"
                    )
                    $shardSuffix = "shard-$shardId"
                    $coverageXmlName = "coverage-$shardSuffix.xml"
                    $coverageJsonName = "coverage-$shardSuffix.json"
                  }

                  $pytestArgs = @($env:TEST_PATTERN)
                  $pytestArgs += $parallelArgs
                  $pytestArgs += $shardArgs
                  $pytestArgs += $failFastArgs

                  # pytest-cov must not enforce a whole-suite floor on an
                  # individual shard. The aggregate coverage-policy-gate
                  # combines the raw data files below and enforces the floor
                  # once all shards are present.
                  $coverageDataFile = ".coverage"
                  if ($numShards -gt 1) {
                    $coverageDataFile = ".coverage.$shardId"
                  }
                  $env:COVERAGE_FILE = $coverageDataFile
                  
                  # Ensure the artifact output folder exists
                  New-Item -ItemType Directory -Force artifacts/coverage/python | Out-Null
                  
                  $pytestArgs += @(
                    "--ignore=tests/test_schemathesis_api.py",
                    "--ignore=tests/integration/test_quarantine_reservations_postgres.py",
                    "--cov=app",
                    "--cov=alembic/versions",
                    "--cov-report=xml:$coverageXmlName",
                    "--cov-report=json:artifacts/coverage/python/$coverageJsonName",
                    "--cov-report=term-missing",
                    "--junitxml=pytest-report.xml",
                    "--dist=loadgroup"
                  )

                  $coverageThreshold = [int]$env:COVERAGE_THRESHOLD
                  if ($numShards -le 1 -and $coverageThreshold -gt 0) {
                    $pytestArgs += "--cov-fail-under=$coverageThreshold"
                  } else {
                    $pytestArgs += "--cov-fail-under=0"
                  }

                  uv run pytest @pytestArgs

            - name: Check differential coverage (diff-cover)
              # A sharded runner only owns a subset of the test universe.  Running
              # diff-cover here would either reference the old, non-existent
              # coverage-full.xml name or incorrectly fail a shard because another
              # shard owns the changed file. The aggregate coverage-policy-gate
              # combines the four shard files with DB Migration Gate coverage
              # before enforcing repository-wide coverage; keep this fast check
              # for non-sharded callers.
              if: ${{ github.event_name == 'pull_request' && inputs.coverage-threshold > 0 && inputs.num-shards <= 1 }}
              shell: pwsh
              env:
                COMPARE_BRANCH: ${{ github.base_ref }}
              run: |
                $compareBranch = $env:COMPARE_BRANCH
                git fetch origin $compareBranch
                uv run diff-cover coverage.xml --compare-branch=origin/$compareBranch --fail-under=100

            - name: Upload coverage artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: backend-coverage-${{ inputs.test-group-name }}
                  path: |
                      coverage-*.xml
                      artifacts/coverage/python/coverage-*.json
                  if-no-files-found: error

            - name: Write backend shard coverage provenance
              if: ${{ inputs.num-shards > 1 }}
              shell: bash
              env:
                  SHARD_ID: ${{ inputs.shard-id }}
                  ARTIFACT_NAME: backend-coverage-data-${{ inputs.test-group-name }}-attempt-${{ github.run_attempt }}
                  EXPECTED_SHA: ${{ github.sha }}
                  WORKFLOW_REPOSITORY: ${{ github.repository }}
                  WORKFLOW_REF: ${{ github.workflow_ref }}
                  WORKFLOW_SHA: ${{ github.workflow_sha }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
                  WORKFLOW_EVENT: ${{ github.event_name }}
              run: |
                  set -euo pipefail
                  source_report=".coverage.$SHARD_ID"
                  source_manifest="artifacts/coverage/python/pytest-shard-$SHARD_ID.json"
                  producer_root="artifacts/coverage/python/producer"
                  staged_report="$producer_root/.coverage.shard-$SHARD_ID"
                  staged_manifest="$producer_root/pytest-shard-$SHARD_ID.json"
                  metadata="$producer_root/coverage-provenance-shard-$SHARD_ID.json"
                  test -s "$source_report"
                  test -s "$source_manifest"
                  rm -rf -- "$producer_root"
                  mkdir -p "$producer_root"
                  cp "$source_report" "$staged_report"
                  cp "$source_manifest" "$staged_manifest"
                  python_version="$(python3 -c 'import platform; print(platform.python_version())')"
                  coverage_version="$(uv run coverage --version | awk 'NR == 1 {print $2}')"
                  python3 scripts/quality/coverage_provenance.py write \
                    --repository-root "$GITHUB_WORKSPACE" \
                    --output "$metadata" \
                    --expected-sha "$EXPECTED_SHA" \
                    --identity-provider github-actions \
                    --repository "$WORKFLOW_REPOSITORY" \
                    --workflow-ref "$WORKFLOW_REF" \
                    --workflow-sha "$WORKFLOW_SHA" \
                    --run-id "$RUN_ID" \
                    --run-attempt "$RUN_ATTEMPT" \
                    --event "$WORKFLOW_EVENT" \
                    --job "$GITHUB_JOB" \
                    --artifact "$ARTIFACT_NAME" \
                    --collected-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                    --tool-version "python=$python_version" \
                    --tool-version "coverage.py=$coverage_version" \
                    --tool-version quality-provenance=2.0.0 \
                    --report "python-shard|coverage-py-data|$staged_report|artifacts/coverage/python/shards/.coverage.shard-$SHARD_ID" \
                    --report "python-shard|pytest-node-manifest|$staged_manifest|artifacts/coverage/python/shards/pytest-shard-$SHARD_ID.json"

            - name: Upload raw coverage data for aggregation
              if: ${{ inputs.num-shards > 1 }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: backend-coverage-data-${{ inputs.test-group-name }}-attempt-${{ github.run_attempt }}
                  path: |
                      artifacts/coverage/python/producer/.coverage.shard-${{ inputs.shard-id }}
                      artifacts/coverage/python/producer/pytest-shard-${{ inputs.shard-id }}.json
                      artifacts/coverage/python/producer/coverage-provenance-shard-${{ inputs.shard-id }}.json
                  include-hidden-files: true
                  if-no-files-found: error

            - name: Upload pytest report
              if: ${{ always() && hashFiles('pytest-report.xml') != '' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: backend-pytest-report-${{ inputs.test-group-name }}
                  path: pytest-report.xml
                  if-no-files-found: warn

            - name: Update historical test durations
              # A failed collection can leave a syntactically valid but
              # incomplete JUnit document (for example, an error testcase
              # without file/classname). Historical timing is advisory and
              # must not mask the primary pytest failure with a second parser
              # failure; only update it after the test step succeeds.
              if: success() && hashFiles('pytest-report.xml') != ''
              shell: pwsh
              env:
                TEST_GROUP_NAME: ${{ inputs.test-group-name }}
              run: |
                  uv run python scripts/quality/update_test_durations.py pytest-report.xml `
                    --output "artifacts/quality/test-durations-$env:TEST_GROUP_NAME.json"


    integration-tests:
        name: Integration Tests (${{ inputs.test-group-name }})
        if: ${{ inputs.run-integration-tests }}
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy_secret_key_for_ci_tests_at_least_32_chars' }}
            ENVIRONMENT: testing
            OTEL_SDK_DISABLED: "true"
            DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
            UNIVERSITY_ECOSYSTEM_PYTEST_ALLOW_DATABASE_RESET: "1"
            REDIS_URL: redis://localhost:6379
            REVOCATION_REDIS_URL: redis://localhost:6380/0
            RUN_INTEGRATION_TESTS: "1"
        services:
            postgres:
                image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                options: >-
                    --health-cmd "pg_isready -U test -d test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
            redis:
                image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            revocation-redis:
                image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
                ports:
                    - 6380:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            mailpit:
                # Official GHCR mirror, immutable v1.31.1 manifest-list digest.
                # Both unauthenticated endpoints stay bound to the runner loopback.
                image: ghcr.io/axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
                ports:
                    - "127.0.0.1:8025:8025"
                    - "127.0.0.1:1025:1025"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              shell: pwsh
              run: |
                  uv sync --frozen

            - name: Wait for PostgreSQL
              shell: pwsh
              # LOW-W19: added max-iteration counter to prevent infinite loop
              run: |
                  $maxRetries = 30
                  $attempt = 0
                  do {
                    pg_isready -h localhost -p 5432 -U test
                    if ($LASTEXITCODE -eq 0) { break }
                    $attempt++
                    if ($attempt -ge $maxRetries) {
                      throw "PostgreSQL was not ready after $maxRetries seconds"
                    }
                    Start-Sleep -Seconds 1
                  } while ($true)

            - name: Run Alembic migrations
              shell: pwsh
              run: uv run alembic upgrade head

            - name: Test migration downgrade safety (MOD-03)
              shell: pwsh
              run: |
                  uv run alembic upgrade head
                  uv run alembic downgrade -1
                  uv run alembic upgrade head
                  echo "Migration round-trip succeeded"

            - name: Wait for Mailpit
              shell: bash
              timeout-minutes: 2
              run: |
                  set -euo pipefail
                  python3 - <<'PY'
                  import smtplib
                  import time
                  from urllib.request import urlopen

                  for attempt in range(30):
                      try:
                          with urlopen("http://127.0.0.1:8025/readyz", timeout=2) as response:
                              if response.status != 200:
                                  raise OSError("Mailpit HTTP readiness failed")
                          with smtplib.SMTP("127.0.0.1", 1025, timeout=2) as smtp:
                              if smtp.noop()[0] != 250:
                                  raise OSError("Mailpit SMTP readiness failed")
                          break
                      except (OSError, smtplib.SMTPException):
                          if attempt == 29:
                              raise SystemExit("Mailpit HTTP/SMTP readiness did not pass") from None
                          time.sleep(1)
                  PY

            - name: Verify email MFA outbox delivery
              shell: bash
              timeout-minutes: 10
              env:
                  MFA_TEST_MAILPIT_API: http://127.0.0.1:8025
                  MFA_TEST_SMTP_PORT: "1025"
              run: |
                  set -euo pipefail
                  uv run pytest -q -p no:cacheprovider \
                    tests/integration/test_mfa_mailpit_outbox.py \
                    --junitxml=mfa-mailpit-report.xml
                  python3 - <<'PY'
                  from xml.etree import ElementTree

                  suite = ElementTree.parse("mfa-mailpit-report.xml").getroot().find("testsuite")
                  if suite is None or any(
                      int(suite.get(name, "0")) != expected
                      for name, expected in (
                          ("tests", 1),
                          ("skipped", 0),
                          ("failures", 0),
                          ("errors", 0),
                      )
                  ):
                      raise SystemExit("Required Mailpit acceptance did not execute successfully")
                  PY

            - name: Pre-pull testcontainer images with bounded retries
              shell: pwsh
              run: |
                  # Testcontainers pulls these images lazily.  A transient
                  # Docker Hub token/registry timeout must not turn a healthy
                  # integration suite into a false-negative CI failure.
                  $images = @(
                    "nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4",
                    "postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b",
                    "redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2",
                    "pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d"
                  )
                  $maxAttempts = 5

                  foreach ($image in $images) {
                    $available = $false
                    for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
                      docker image inspect $image *> $null
                      if ($LASTEXITCODE -eq 0) {
                        $available = $true
                        break
                      }

                      Write-Host "Pulling $image (attempt $attempt/$maxAttempts)"
                      docker pull $image
                      if ($LASTEXITCODE -eq 0) {
                        $available = $true
                        break
                      }

                      if ($attempt -lt $maxAttempts) {
                        $delaySeconds = [int][math]::Pow(2, $attempt)
                        Write-Host "Retrying $image in $delaySeconds seconds"
                        Start-Sleep -Seconds $delaySeconds
                      }
                    }

                    if (-not $available) {
                      throw "Unable to make testcontainer image available after $maxAttempts attempts: $image"
                    }
                  }

            - name: Run integration tests
              shell: pwsh
              env:
                  INTEGRATION_SHARD_ID: ${{ inputs.integration-shard-id }}
                  INTEGRATION_NUM_SHARDS: ${{ inputs.integration-num-shards }}
                  INTEGRATION_TEST_PATTERN: ${{ inputs.integration-test-pattern }}
              run: |
                  $integrationShardArgs = @()
                  $integrationShardId = [int]$env:INTEGRATION_SHARD_ID
                  $integrationNumShards = [int]$env:INTEGRATION_NUM_SHARDS
                  if ($integrationShardId -ge 0 -or $integrationNumShards -ne 1) {
                    if ($integrationShardId -lt 0 -or $integrationShardId -ge $integrationNumShards -or $integrationNumShards -lt 1) {
                      throw "Invalid integration shard configuration: id=$integrationShardId total=$integrationNumShards"
                    }
                    $integrationShardArgs = @(
                      "--shard-id=$integrationShardId",
                      "--num-shards=$integrationNumShards"
                    )
                  }

                  $pytestArgs = @(
                    $env:INTEGRATION_TEST_PATTERN,
                    "tests/test_events_localization.py",
                    "tests/test_user_analytics_window_contracts.py",
                    "tests/test_migrations_runtime.py",
                    "tests/test_query_plans.py",
                    "tests/test_news_repository_db.py::test_comment_service_commits_create_and_edit_across_sessions",
                    "tests/test_news_repository_db.py::test_comment_delete_commits_across_sessions_and_preserves_creation_outbox",
                    "-v",
                    "--tb=short",
                    "-x"
                  )
                  $pytestArgs += $integrationShardArgs
                  $pytestArgs += @(
                    "--ignore=tests/performance",
                    "--ignore=tests/test_schemathesis_api.py"
                  )
                  uv run pytest @pytestArgs

            - name: Upload test results
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: postgres-test-failures-${{ inputs.test-group-name }}
                  path: |
                      pytest-report.xml
                      mfa-mailpit-report.xml
                  if-no-files-found: ignore
