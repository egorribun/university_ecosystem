# Reusable Backend Tests Workflow
name: Backend Tests

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version to use"
                required: false
                type: string
                default: "3.13"
            coverage-threshold:
                description: "Minimum coverage percentage"
                required: false
                type: number
                default: 78
            run-integration-tests:
                description: "Run PostgreSQL integration tests"
                required: false
                type: boolean
                default: false
            test-group-name:
                description: "Name of the test group (e.g., Auth, Events)"
                required: false
                type: string
                default: "All"
            test-pattern:
                description: "Pytest pattern to include (e.g., tests/test_auth*)"
                required: false
                type: string
                default: "tests/"
            parallel-workers:
                description: "Number of parallel workers for pytest-xdist (0 = auto, -1 = disabled)"
                required: false
                type: number
                default: 0
            fail-fast:
                description: "Stop on first test failure"
                required: false
                type: boolean
                default: false
            # MOD-24-03: Support free-threading CI variant (PEP 703).
            python-gil:
                description: "PYTHON_GIL value ('1' = default GIL, '0' = free-threading). Only effective on Python 3.14+."
                required: false
                type: string
                default: "1"
        secrets:
            SECRET_KEY:
                required: false
                description: "Application secret key"

jobs:
    unit-tests:
        name: Unit Tests (${{ inputs.test-group-name }})
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy_secret_key_for_ci_tests_at_least_32_chars' }}
            ENVIRONMENT: testing
            OTEL_SDK_DISABLED: "true"
            PYTHON_GIL: ${{ inputs.python-gil }}  # MOD-24-03: free-threading support
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              shell: pwsh
              run: |
                  uv lock --check
                  uv sync --frozen

            - name: Run pytest
              shell: pwsh
              run: |
                  $parallelArgs = @()
                  if ("${{ inputs.parallel-workers }}" -ne "-1") {
                    if ("${{ inputs.parallel-workers }}" -eq "0") {
                      $parallelArgs = @("-n", "auto")
                    } else {
                      $parallelArgs = @("-n", "${{ inputs.parallel-workers }}")
                    }
                  }

                  $failFastArgs = @()
                  if ("${{ inputs.fail-fast }}" -eq "true") {
                    $failFastArgs = @("-x")
                  }

                  uv run pytest ${{ inputs.test-pattern }} `
                    $parallelArgs `
                    $failFastArgs `
                    --cov=app `
                    --cov-report=xml `
                    --cov-report=term-missing `
                    --cov-fail-under=${{ inputs.coverage-threshold }} `
                    --junitxml=pytest-report.xml `
                    --dist=loadgroup

            - name: Check differential coverage (diff-cover)
              if: ${{ github.event_name == 'pull_request' && inputs.coverage-threshold > 0 }}
              shell: pwsh
              run: |
                $compareBranch = "${{ github.base_ref }}"
                git fetch origin $compareBranch
                uv run diff-cover coverage.xml --compare-branch=origin/$compareBranch --fail-under=80

            - name: Upload coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: backend-coverage-${{ inputs.test-group-name }}
                  path: coverage.xml

            - name: Upload pytest report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: backend-pytest-report-${{ inputs.test-group-name }}
                  path: pytest-report.xml
                  if-no-files-found: warn

    integration-tests:
        name: Integration Tests (${{ inputs.test-group-name }})
        if: ${{ inputs.run-integration-tests }}
        runs-on: ubuntu-latest
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy_secret_key_for_ci_tests_at_least_32_chars' }}
            ENVIRONMENT: testing
            OTEL_SDK_DISABLED: "true"
            DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
            REDIS_URL: redis://localhost:6379
        services:
            postgres:
                image: pgvector/pgvector:pg17
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Setup Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install dependencies
              shell: pwsh
              run: |
                  uv sync --frozen

            - name: Wait for PostgreSQL
              shell: pwsh
              # LOW-W19: added max-iteration counter to prevent infinite loop
              run: |
                  $maxRetries = 30
                  $attempt = 0
                  do {
                    pg_isready -h localhost -p 5432 -U test
                    if ($LASTEXITCODE -eq 0) { break }
                    $attempt++
                    if ($attempt -ge $maxRetries) {
                      throw "PostgreSQL was not ready after $maxRetries seconds"
                    }
                    Start-Sleep -Seconds 1
                  } while ($true)

            - name: Run Alembic migrations
              shell: pwsh
              run: uv run alembic upgrade head

            - name: Test migration downgrade safety (MOD-03)
              shell: pwsh
              run: |
                  uv run alembic upgrade head
                  uv run alembic downgrade -1
                  uv run alembic upgrade head
                  echo "Migration round-trip succeeded"

            - name: Run integration tests
              shell: pwsh
              run: uv run pytest ${{ inputs.test-pattern }} -v --tb=short -x --ignore=tests/performance

            - name: Upload test results
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: failure()
              with:
                  name: postgres-test-failures-${{ inputs.test-group-name }}
                  path: pytest-report.xml
                  if-no-files-found: ignore


