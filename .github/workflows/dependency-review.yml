# Dependency Review Workflow
# Checks for vulnerable dependencies in pull requests
name: Dependency Review

on:
    pull_request:
        branches:
            - main
            - master

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    dependency-review:
        name: Review Dependencies
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: "Checkout Repository"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Verify security policy inputs against protected base
              if: ${{ github.event_name == 'pull_request' }}
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
              run: |
                  set -euo pipefail
                  if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "::error::pull-request base SHA is not an immutable 40-hex commit" >&2
                      exit 1
                  fi
                  if [[ "$BASE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
                      echo "::error::security policy check refuses a cross-repository pull request" >&2
                      exit 1
                  fi
                  git fetch --no-tags --depth=1 origin "$BASE_SHA"
                  policy_paths=(
                      ".github/workflows"
                      ".github/dependency-review-config.yml"
                      "go.work"
                      "scripts/quality/verify_dependency_review_scope.py"
                      "tests/test_verify_dependency_review_scope.py"
                      "native/rust_ext/deny.toml"
                      "quality/ci-check-catalog.json"
                      "quality/security-false-positive-dispositions.json"
                      "security/audit-allowlist.yaml"
                  )
                  changed=()
                  for path in "${policy_paths[@]}"; do
                      if ! git diff --quiet "$BASE_SHA" -- "$path"; then
                          changed+=("$path")
                      fi
                  done
                  if ((${#changed[@]} > 0)); then
                      if [[ "$PR_AUTHOR" != "egorribun" ]]; then
                          printf '::error::security policy changes require an owner-authored PR: %s\n' "${changed[*]}" >&2
                          exit 1
                      fi
                      printf '::notice::owner-authored policy update accepted for review: %s\n' "${changed[*]}"
                  fi

            - name: Test exact dependency review guard
              shell: bash
              run: python3 -m unittest discover -s tests -p 'test_verify_dependency_review_scope.py' -v

            - name: Verify exact dependency license scope
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: python3 scripts/quality/verify_dependency_review_scope.py preflight --root . --base-sha "$BASE_SHA"

            # MOD-W17-01 (Wave 17): Switched from deny-list to positive allow-list.
            # A deny-list of 2 licenses misses SSPL, BSL, EUPL, and other
            # copyleft/source-available licenses increasingly common in 2026.
            - name: Dependency Review
              id: dependency_review
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  config-file: .github/dependency-review-config.yml

            - name: Save full Dependency Review comparison in a bounded file
              if: ${{ always() }}
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  python3 scripts/quality/verify_dependency_review_scope.py fetch --root . --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

            - name: Verify exact Dependency Review license rows
              if: ${{ always() }}
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  DEPENDENCY_CHANGES_FILE: ${{ runner.temp }}/dependency-review-changes.json
              run: python3 scripts/quality/verify_dependency_review_scope.py changes --root . --base-sha "$BASE_SHA" --changes-file "$DEPENDENCY_CHANGES_FILE"
