# Dependency Review Workflow
# Checks for vulnerable dependencies in pull requests
name: Dependency Review

on:
    pull_request:
        branches:
            - main
            - master

permissions:
    contents: read
    pull-requests: write

jobs:
    dependency-review:
        name: Review Dependencies
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout Repository"
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            # MOD-W17-01 (Wave 17): Switched from deny-list to positive allow-list.
            # A deny-list of 2 licenses misses SSPL, BSL, EUPL, and other
            # copyleft/source-available licenses increasingly common in 2026.
            - name: Dependency Review
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  config-file: .github/dependency-review-config.yml

            - name: Upload dependency review report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dependency-review-report
                  path: dependency-review-report.json
                  if-no-files-found: ignore
