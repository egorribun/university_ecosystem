# Wave 191 SW2 — Unauthed visual smoke for 4 public routes on PR trigger.
#
# ## Why this exists
#
# W189 SW2 created `frontend/scripts/wave189-unauthed-smoke.mjs` (~280 LoC) —
# a Playwright real-Chrome smoke covering /login + /register + /forgot-password
# + /reset-password through the real Caddy → Node SSR → backend chain. W189
# polish-v1 explicitly DEFERRED CI integration as Tier 2 housekeeping. W191 SW2
# (this workflow) closes that deferral.
#
# Closes W187 §H NEW #2 fully (W189 SW2 closed the local-verification scope;
# W191 SW2 closes the on-PR continuous-verification scope).
#
# ## Triggers
#
# 1. `pull_request: branches: [main]` — runs on every PR open / push to PR
#    branch. Catches regressions in the 4 unauth public routes (the highest-
#    traffic surfaces for new visitors / unauthenticated bookmark hits).
#
# 2. `workflow_dispatch` — manual run via Actions UI / `gh workflow run` for
#    on-demand debug + ad-hoc verification post-merge.
#
# **No `push: branches: [main]`** trigger because post-merge CI on main is
# already covered by `ci.yml` aggregate. Avoids double-run waste.
#
# ## Architecture
#
# Mirrors admin-smoke-monitoring.yml (W171 SW1) + visual-audit.yml (W139 SW1)
# pattern — same Caddy ingress + backend uvicorn + frontend Node SSR + Linux
# runner services. Key differences from admin-smoke (which targets AUTHED admin
# routes with seeded admin user):
#
# 1. **Trigger**: pull_request (every PR) — admin-smoke uses weekly cron
# 2. **No user seeding**: anonymous public routes — no `seed_demo_data.py` /
#    `seed_admin_data.py` invocation
# 3. **Matrix theme**: `theme: [light, dark]` parallel — admin-smoke does
#    sequential 2-call inside its single wave165 script invocation
# 4. **Script**: `wave189-unauthed-smoke.mjs` (admin-smoke uses wave165)
# 5. **Artifact retention**: 14 days (matches visual-audit.yml; admin-smoke
#    keeps 30 for quarterly analysis since cron firings are spaced weeks apart)
#
# ## Exit code semantics (wave189-unauthed-smoke.mjs)
#
#   0 = clean (all 4 routes HTTP 200 + 0 hydration errors)
#   1 = HTTP-failed (non-200 OR navigation error)
#   2 = hydration-detected (≥1 capture had React #418-#427 OR "Hydration failed"
#       substring match — W167 SW1 regex per W189 SW2)
#
# `continue-on-error: true` on script step → artifacts upload regardless. Final
# "Re-assert smoke result" step propagates exit code to workflow status so PR
# checks show red immediately on regression.
#
# ## Costs
#
# ~5-10 min per matrix entry × 2 themes = ~10-20 min total per PR run.
# Comparable to e2e tests; well under typical PR review timeline.
name: Wave189 Unauthed Smoke (Linux On-PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions: read-all

concurrency:
  group: wave189-unauthed-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unauthed-smoke:
    name: Wave189 unauthed smoke (theme=${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    env:
      # Backend env — MIRRORS admin-smoke-monitoring.yml:108-124 EXACTLY (W139
      # SW2 + W140 SW4 iter6 lessons preserved verbatim). Unauth routes don't
      # exercise lockout/MFA/passkey paths, but backend lifespan + JWKS still
      # depend on these env vars being valid.
      SECRET_KEY: "dummy_secret_key_for_wave189_unauthed_smoke_at_least_32_chars" # pragma: allowlist secret
      ENVIRONMENT: testing
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test_wave189_smoke" # pragma: allowlist secret
      OTEL_SDK_DISABLED: "true"
      ALGORITHM: "RS256"
      JWT_PRIVATE_KEY_PATH: ".secrets/jwt_rs256.pem"
      NATS_URL: "nats://127.0.0.1:4222"
      CACHE_REDIS_URL: "redis://127.0.0.1:6379/0"
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: "redis://127.0.0.1:6379/1"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test # pragma: allowlist secret
          POSTGRES_DB: test_wave189_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # NATS required for backend lifespan (NatsTaskBroker Dishka-injected
      # dependency; can't be env-flag-skipped).
      nats:
        image: nats:2.10.25-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget -q -O - http://localhost:8222/varz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Install wasm-pack
        # W141 polish-v2: rustwasm canonical curl installer (taiki-e/install-action
        # hardcoded drager URL → 404 since 2026-05-11).
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build WASM modules
        # W139 (z) #5 + W140 SW4 iter3: binaryen download flake → 3-attempt retry
        # with 10s backoff. Each build idempotent (binaryen cache reused).
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            if wasm-pack build rust-crypto --target web && \
               wasm-pack build wasm-sanitizer --target web; then
              echo "OK: WASM modules built (attempt $attempt)"
              exit 0
            fi
            echo "WASM build failed on attempt $attempt; retrying after 10s..."
            sleep 10
          done
          echo "::error::WASM build failed after 3 attempts"
          exit 1

      - name: Generate RS256 keypair
        # Mirrors start-docker.ps1 New-JwtRs256Key (W137 SW1) + visual-audit.yml.
        run: |
          mkdir -p .secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out .secrets/jwt_rs256.pem
          ls -la .secrets/jwt_rs256.pem
          echo "OK: RS256 keypair generated"

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Build frontend (E2E reduced-chrome mode, NOT VITE_LHCI bypass)
        # Wave 191 SW2 — keeps parity with admin-smoke-monitoring.yml + visual-
        # audit.yml E2E build mode. wave189 covers compact-layout routes
        # (/login + /register + /forgot-password + /reset-password) where
        # MainLayout's Navbar/Footer aren't rendered anyway (per useRouteType
        # .isCompactPage), so VITE_E2E_MODE has minimal effect — but kept for
        # consistency + tree-shake invariant preservation.
        working-directory: frontend
        env:
          VITE_BACKEND_ORIGIN: http://localhost
          VITE_E2E_MODE: "1"
        run: |
          npm run build
          if find dist/client/assets -name "*.js" -exec grep -l "lhci-mock-user" {} + 2>/dev/null | grep -q .; then
            echo "::error::VITE_LHCI tree-shake invariant violated — E2E build contains LHCI mock-user reference"
            exit 1
          fi
          echo "OK: VITE_LHCI bypass tree-shaken cleanly"

      - name: Install Playwright bundled Chromium
        # wave189-unauthed-smoke.mjs uses `import { chromium } from "playwright"`
        # — bundled Chromium (NOT real Chrome via `channel: "chrome"`). Different
        # from wave165 which uses real Chrome for visual fidelity. Bundled
        # Chromium is sufficient for unauth public-route smoke + matches the
        # script's import contract.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level debug > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend health
        # W140 SW4 iter3 fix: /health/ready (NOT /health which 404s).
        run: |
          for i in {1..90}; do
            if curl -sf http://127.0.0.1:8000/health/ready > /dev/null; then
              echo "OK: backend ready after $i attempts (~$(( i * 2 ))s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend failed to start within 180s"
          echo "---backend-log-tail---"
          tail -200 /tmp/backend.log 2>&1 || echo "(no /tmp/backend.log file)"
          exit 1

      - name: Verify JWKS endpoint
        # Defense-in-depth — unauth routes don't validate JWT, but a broken JWKS
        # endpoint signals backend RS256 setup is broken (would affect any
        # subsequent authed test in the same job — though wave189 doesn't auth).
        run: |
          if ! curl -sf http://127.0.0.1:8000/.well-known/jwks.json | python -c "import sys, json; d = json.load(sys.stdin); keys = d.get('keys', []); assert len(keys) > 0, 'JWKS empty'; print(f'OK: JWKS has {len(keys)} key(s)')"; then
            echo "::error::JWKS endpoint not serving keys (RS256 backend setup broken)"
            exit 1
          fi

      # **NO user seeding step** — wave189 is UNAUTHED smoke. The 4 routes
      # (/login + /register + /forgot-password + /reset-password) render as
      # public landing pages regardless of any seeded user state. CRITICAL
      # DIFFERENCE from admin-smoke-monitoring.yml which needs seed_admin_data.py.

      - name: Start frontend Node SSR
        # W131 SW1 server-prod.mjs on :3000.
        working-directory: frontend
        env:
          NODE_ENV: production
          PORT: "3000"
          HOST: "0.0.0.0"
        run: |
          npm run start &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend Node SSR health
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3000/healthz > /dev/null; then
              echo "OK: frontend Node SSR ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "::error::Frontend Node SSR failed to start within 60s"
          exit 1

      - name: Start Caddy ingress
        # Mirrors admin-smoke-monitoring.yml:341-376 Caddyfile.
        run: |
          cat > /tmp/Caddyfile <<'EOF'
          {
            auto_https off
            admin off
          }
          :80 {
            handle /api/v1/* {
              reverse_proxy 127.0.0.1:8000
            }
            handle /.well-known/* {
              reverse_proxy 127.0.0.1:8000
            }
            handle {
              reverse_proxy 127.0.0.1:3000
            }
          }
          EOF
          docker run -d --name caddy --network host -v /tmp/Caddyfile:/etc/caddy/Caddyfile caddy:2.11.2-alpine
          for i in {1..15}; do
            if curl -sf http://localhost/healthz > /dev/null && curl -sf http://localhost/.well-known/jwks.json > /dev/null; then
              echo "OK: Caddy ingress reachable + proxying correctly"
              exit 0
            fi
            echo "Waiting for Caddy proxy... ($i/15)"
            sleep 2
          done
          echo "::error::Caddy proxy chain not reachable"
          docker logs caddy || true
          exit 1

      - name: Run wave189 unauthed smoke script
        # wave189-unauthed-smoke.mjs (W189 SW2) hardcodes 4 unauth routes.
        # Script env contract per script lines 55-72:
        #   ORIGIN  (default "http://localhost") — Caddy ingress
        #   THEME   (default "light")           — light OR dark per matrix entry
        #   OUT_DIR (default ".screenshots/wave189-unauthed-smoke")
        # Matrix interpolation: each entry gets its own OUT_DIR so artifacts
        # don't collide on upload.
        id: smoke
        working-directory: frontend
        env:
          ORIGIN: http://localhost
          THEME: ${{ matrix.theme }}
          OUT_DIR: .screenshots/wave189-unauthed-smoke-${{ matrix.theme }}
        run: node ./scripts/wave189-unauthed-smoke.mjs
        continue-on-error: true

      - name: Backend log diagnostic dump
        # W140 SW4 iter5 pattern — tail last 300 lines unconditionally for
        # triage on smoke failure.
        if: always()
        run: |
          echo "---backend-log-tail---"
          tail -300 /tmp/backend.log 2>&1 || echo "(no /tmp/backend.log file)"

      - name: Print summary table
        # Reads .screenshots/wave189-unauthed-smoke-${theme}/*.json sidecars.
        # Sidecar shape per wave189 script: path, theme, httpStatus, finalUrl,
        # hydrationErrorCount, consoleErrorCount, networkRequestCount.
        if: always()
        working-directory: frontend
        env:
          THEME: ${{ matrix.theme }}
          SIDECAR_DIR: .screenshots/wave189-unauthed-smoke-${{ matrix.theme }}
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = process.env.SIDECAR_DIR;
            const theme = process.env.THEME ?? "?";
            if (!fs.existsSync(dir)) {
              console.log("No sidecar JSONs to summarize (script may have failed before producing reports)");
              process.exit(0);
            }
            const files = fs.readdirSync(dir).filter((f) => f.endsWith(".json"));
            if (files.length === 0) {
              console.log("No JSON sidecars found");
              process.exit(0);
            }
            const summary = process.env.GITHUB_STEP_SUMMARY;
            const lines = [];
            lines.push(`## Wave189 Unauthed Smoke (theme=${theme})`);
            lines.push("");
            lines.push("4 unauth public routes: /login + /register + /forgot-password + /reset-password.");
            lines.push("React #418-#427 detection via W167 SW1 regex + hydration substring matches.");
            lines.push("");
            lines.push("| Path | HTTP | Hydr err | Console err | Net req |");
            lines.push("|---|---|---|---|---|");
            let totalHydration = 0;
            let totalFailed = 0;
            for (const f of files.sort()) {
              try {
                const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
                const p = r.path ?? "?";
                const http = r.httpStatus ?? "-";
                const hyd = r.hydrationErrorCount ?? 0;
                const cons = r.consoleErrorCount ?? 0;
                const net = r.networkRequestCount ?? 0;
                if (hyd > 0) totalHydration += hyd;
                if (http !== 200) totalFailed++;
                lines.push(`| ${p} | ${http} | ${hyd} | ${cons} | ${net} |`);
              } catch (e) {
                lines.push(`| (${f}) | - | - | parse-error | - |`);
              }
            }
            lines.push("");
            if (totalHydration > 0) {
              lines.push(`⚠ **${totalHydration} hydration error(s) detected across ${files.length} capture(s)** (theme=${theme}) — investigate React #418 class regression.`);
            } else if (totalFailed > 0) {
              lines.push(`⚠ **${totalFailed} capture(s) returned non-200** (theme=${theme}) — SSR / routing setup may be broken.`);
            } else {
              lines.push(`✅ **All ${files.length} captures clean** (theme=${theme}; HTTP 200 + 0 hydration errors).`);
            }
            const out = lines.join("\n");
            console.log(out);
            if (summary) {
              fs.appendFileSync(summary, out + "\n");
            }
          '

      - name: Terminate background processes
        if: always()
        run: |
          if [ -n "$BACKEND_PID" ]; then kill "$BACKEND_PID" 2>/dev/null || true; fi
          if [ -n "$FRONTEND_PID" ]; then kill "$FRONTEND_PID" 2>/dev/null || true; fi
          docker rm -f caddy 2>/dev/null || true

      - name: Upload smoke reports
        # 14-day retention matches visual-audit.yml convention (admin-smoke uses
        # 30 for quarterly cron analysis — wave189 fires per-PR so shorter is OK).
        # include-hidden-files: true defensive per W160 SW1 (z) — `.screenshots/`
        # is hidden dir (actions/upload-artifact@v7 strips hidden contents by
        # default unless flag set).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wave189-unauthed-smoke-${{ matrix.theme }}
          path: frontend/.screenshots/wave189-unauthed-smoke-${{ matrix.theme }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

      - name: Re-assert smoke result
        # Propagates wave189 script non-zero exit to workflow status (red in
        # Actions UI). continue-on-error on the script step keeps artifacts
        # uploading; this step is the gate.
        if: always() && steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Wave189 unauthed smoke FAILED (theme=${{ matrix.theme }}) — see artifact frontend/.screenshots/wave189-unauthed-smoke-${{ matrix.theme }}/ for sidecar JSONs"
          exit 1
