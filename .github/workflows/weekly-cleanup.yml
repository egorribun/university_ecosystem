name: Weekly cleanup

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run weekly cleanup
        if: ${{ env.DATABASE_URL != '' && env.SECRET_KEY != '' }}
        run: |
          uv run python -m app.management.weekly_cleanup

      - name: Report missing secrets
        if: ${{ env.DATABASE_URL == '' || env.SECRET_KEY == '' }}
        run: |
          echo "Required secrets DATABASE_URL and SECRET_KEY are not configured; skipping cleanup."
          exit 0
