name: Weekly cleanup

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: read-all

# Cleanup mutates shared retention state; never allow scheduled and manually
# dispatched runs to overlap, and retain the active run if a newer invocation
# arrives so the earlier operation can finish atomically.
concurrency:
  group: weekly-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OTEL_SDK_DISABLED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted main source
        env:
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Weekly cleanup refuses to run outside protected main."
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main --depth=1
          trusted_sha="$(git rev-parse refs/remotes/origin/main)"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Protected main did not resolve to a full commit SHA."
            exit 1
          fi
          if [[ "$checked_out_sha" != "$trusted_sha" || "$EVENT_SHA" != "$trusted_sha" || "$WORKFLOW_SHA" != "$trusted_sha" ]]; then
            echo "::error::Weekly cleanup source is not the current immutable protected-main commit."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # This step is deliberately fail-closed, and a warn-and-skip variant was
      # considered and rejected. The job already runs only on main (see the
      # job-level `if` above), so a fork or a PR never reaches it and there is
      # no cross-repository noise to suppress. On main the secrets are required
      # configuration: a missing one means retention has silently stopped
      # running, and downgrading to a warning would hide exactly that. The
      # behaviour is pinned by
      # tests/test_workflow_fail_closed_contracts.py::test_scheduled_workflows_reject_missing_required_inputs.
      - name: Validate cleanup configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" || -z "$SECRET_KEY" ]]; then
            echo "::error::Required cleanup configuration DATABASE_URL or SECRET_KEY is not available." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run weekly cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          uv run python -m app.management.weekly_cleanup
