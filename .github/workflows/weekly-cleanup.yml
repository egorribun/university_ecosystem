name: Weekly cleanup

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    env:
      OTEL_SDK_DISABLED: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run weekly cleanup
        if: ${{ env.DATABASE_URL != '' && env.SECRET_KEY != '' }}
        run: |
          uv run python -m app.management.weekly_cleanup

      - name: Fail when required cleanup configuration is missing
        if: ${{ env.DATABASE_URL == '' || env.SECRET_KEY == '' }}
        run: |
          echo "::error::Required cleanup configuration DATABASE_URL or SECRET_KEY is not available."
          exit 1
