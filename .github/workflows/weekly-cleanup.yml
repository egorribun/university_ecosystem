name: Weekly cleanup

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run weekly cleanup
        if: ${{ env.DATABASE_URL != '' && env.SECRET_KEY != '' }}
        run: |
          uv run python -m app.management.weekly_cleanup

      - name: Report missing secrets
        if: ${{ env.DATABASE_URL == '' || env.SECRET_KEY == '' }}
        run: |
          echo "Required secrets DATABASE_URL and SECRET_KEY are not configured; skipping cleanup."
          exit 0
