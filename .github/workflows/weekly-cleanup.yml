name: Weekly cleanup

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OTEL_SDK_DISABLED: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Generate CI secret key if not configured (RZ-14-06)
        if: env.SECRET_KEY == ''
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run weekly cleanup
        if: ${{ env.DATABASE_URL != '' && env.SECRET_KEY != '' }}
        run: |
          uv run python -m app.management.weekly_cleanup

      - name: Report missing secrets
        if: ${{ env.DATABASE_URL == '' || env.SECRET_KEY == '' }}
        run: |
          echo "Required secrets DATABASE_URL and SECRET_KEY are not configured; skipping cleanup."
          exit 0
