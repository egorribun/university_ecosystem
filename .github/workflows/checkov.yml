name: Checkov (IaC Scan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checkov:
    name: Checkov Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify security policy inputs against protected base
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pull-request base SHA is not an immutable 40-hex commit" >&2
            exit 1
          fi
          if [[ "$BASE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::security policy check refuses a cross-repository pull request" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          policy_paths=(
            ".github/workflows"
            ".checkov.yml"
            "native/rust_ext/deny.toml"
            "scripts/quality/filter_checkov_sarif.py"
            "quality/ci-check-catalog.json"
            "security/audit-allowlist.yaml"
          )
          changed=()
          for path in "${policy_paths[@]}"; do
            if ! git diff --quiet "$BASE_SHA" -- "$path"; then
              changed+=("$path")
            fi
          done
          if ((${#changed[@]} > 0)); then
            if [[ "$PR_AUTHOR" != "egorribun" ]]; then
              printf '::error::security policy changes require an owner-authored PR: %s\n' "${changed[*]}" >&2
              exit 1
            fi
            printf '::notice::owner-authored policy update accepted for review: %s\n' "${changed[*]}"
          fi

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@5798bad4f6dd9c1fb67ae3ec10d42d8fb67037c4 # v12.3126.0
        with:
          directory: .
          config_file: .checkov.yml
          framework: all
          output_format: sarif
          output_file_path: results.sarif

      - name: Remove inline-suppressed results from SARIF
        if: always()
        run: >-
          python scripts/quality/filter_checkov_sarif.py results.sarif
          --output-path filtered-results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: filtered-results.sarif
