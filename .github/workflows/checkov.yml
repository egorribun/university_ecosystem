name: Checkov (IaC Scan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checkov:
    name: Checkov Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          directory: .
          config_file: .checkov.yml
          framework: all
          output_format: sarif
          output_file_path: results.sarif

      - name: Remove inline-suppressed results from SARIF
        if: always()
        run: >-
          python scripts/quality/filter_checkov_sarif.py results.sarif
          --output-path filtered-results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: filtered-results.sarif
