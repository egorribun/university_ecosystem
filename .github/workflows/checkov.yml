name: Checkov (IaC Scan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12.3119.0
        with:
          directory: .
          config_file: .checkov.yml
          framework: all
          output_format: sarif
          output_file_path: results.sarif

      - name: Remove inline-suppressed results from SARIF
        if: always()
        run: >-
          python scripts/quality/filter_checkov_sarif.py results.sarif
          --output-path filtered-results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: filtered-results.sarif
