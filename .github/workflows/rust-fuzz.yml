name: Rust Fuzzing

on:
  push:
    branches: [ main, master ]
    paths:
      - 'native/rust_ext/**'
      - 'crates/pyo3-sanitizer/**'
  pull_request:
    paths:
      - 'native/rust_ext/**'
      - 'crates/pyo3-sanitizer/**'
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    name: Run cargo fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly

      - name: Install Rust stable for cargo-fuzz bootstrap
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # stable
        with:
          toolchain: stable

      - name: Cache cargo registry & index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('native/rust_ext/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        # Pinned to 0.12.0 for reproducibility; update deliberately when a new version is validated.
        # Build cargo-fuzz with stable: cargo-fuzz 0.12.0's locked rustix
        # dependency uses rustc-private cfgs rejected by newer nightlies.
        run: cargo +stable install cargo-fuzz --version 0.12.0 --locked

      - name: Run fuzz targets
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cd native/rust_ext
          # Run for 1 minute (60 seconds) on PR/push, or 5 minutes (300 seconds) on cron/dispatch
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            DURATION=300
          else
            DURATION=60
          fi
          echo "Running fuzz_target_1 for $DURATION seconds..."
          cargo +nightly fuzz run fuzz_target_1 -- -max_total_time=$DURATION
          echo "Running fuzz_sanitizer for $DURATION seconds..."
          cargo +nightly fuzz run fuzz_sanitizer -- -max_total_time=$DURATION

      - name: Archive crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes
          path: |
            native/rust_ext/fuzz/artifacts/
            native/rust_ext/fuzz/crash-*
          if-no-files-found: ignore
