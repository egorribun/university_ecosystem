name: Rust Fuzzing

on:
  push:
    branches: [ main, master ]
    paths:
      # The three fuzz jobs below are required branch-protection contexts.
      # Keep this workflow schedulable for every push so a docs-only or
      # test-only PR cannot leave those required contexts missing/pending.
      - '**'
      - 'native/rust_ext/**'
      - 'crates/pyo3-sanitizer/**'
      - 'frontend/wasm-sanitizer/**'
      - 'frontend/rust-crypto/**'
      - '.github/workflows/rust-fuzz.yml'
  pull_request:
    paths:
      # Required contexts must be created for every PR, even when the change
      # does not touch Rust sources. The fuzz jobs remain bounded below.
      - '**'
      - 'native/rust_ext/**'
      - 'crates/pyo3-sanitizer/**'
      - 'frontend/wasm-sanitizer/**'
      - 'frontend/rust-crypto/**'
      - '.github/workflows/rust-fuzz.yml'
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    # `Run cargo fuzz` is a protected PR/push context.  Scheduled and manual
    # five-minute evidence runs must not be able to satisfy that context.
    name: "${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'Run cargo fuzz' || 'Extended Rust fuzz evidence' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly

      - name: Install Rust stable for cargo-fuzz bootstrap
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry & index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust_ext/target/
            frontend/wasm-sanitizer/fuzz/target/
            frontend/rust-crypto/fuzz/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('native/rust_ext/Cargo.toml', 'native/rust_ext/Cargo.lock', 'frontend/wasm-sanitizer/fuzz/Cargo.toml', 'frontend/wasm-sanitizer/fuzz/Cargo.lock', 'frontend/rust-crypto/fuzz/Cargo.toml', 'frontend/rust-crypto/fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        # Pinned to 0.12.0 for reproducibility; update deliberately when a new version is validated.
        # Build cargo-fuzz with stable: cargo-fuzz 0.12.0's locked rustix
        # dependency uses rustc-private cfgs rejected by newer nightlies.
        run: cargo +stable install cargo-fuzz --version 0.12.0 --locked

      - name: Run fuzz targets
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cd native/rust_ext
          # Run for 1 minute (60 seconds) on PR/push, or 5 minutes (300 seconds) on cron/dispatch
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            DURATION=300
          else
            DURATION=60
          fi
          echo "Running fuzz_target_1 for $DURATION seconds..."
          cargo +nightly fuzz run fuzz_target_1 -- -max_total_time=$DURATION
          echo "Running fuzz_sanitizer for $DURATION seconds..."
          cargo +nightly fuzz run fuzz_sanitizer -- -max_total_time=$DURATION

      - name: Archive crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes
          path: |
            native/rust_ext/fuzz/artifacts/
            native/rust_ext/fuzz/crash-*
          if-no-files-found: ignore

      - name: Validate OSS-Fuzz config
        # WHY: guard against accidental deletion of the OSS-Fuzz integration
        # stub — these files are required for upstream OSS-Fuzz project setup.
        run: |
          test -f infra/oss-fuzz/project.yaml
          test -f infra/oss-fuzz/build.sh
          echo "OSS-Fuzz config present"

  fuzz-additional-rust-crates:
    name: Fuzz ${{ matrix.directory }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: frontend/wasm-sanitizer/fuzz
            name: frontend-wasm-sanitizer-fuzz
            parent_manifest: frontend/wasm-sanitizer/Cargo.toml
            targets: "fuzz_sanitize_rich_text fuzz_strip_html"
          - directory: frontend/rust-crypto/fuzz
            name: frontend-rust-crypto-fuzz
            parent_manifest: frontend/rust-crypto/Cargo.toml
            targets: "fuzz_hmac fuzz_scrypt"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # nightly
        with:
          toolchain: nightly

      - name: Install Rust stable for cargo-fuzz bootstrap
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Cache additional fuzz target build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ matrix.directory }}/target/
          key: ${{ runner.os }}-${{ matrix.name }}-cargo-fuzz-${{ hashFiles(format('{0}/Cargo.toml', matrix.directory), format('{0}/Cargo.lock', matrix.directory), matrix.parent_manifest) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --version 0.12.0 --locked

      - name: Run fuzz targets
        env:
          EVENT_NAME: ${{ github.event_name }}
        working-directory: ${{ matrix.directory }}
        run: |
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            DURATION=300
          else
            DURATION=60
          fi
          for target in ${{ matrix.targets }}; do
            cargo +nightly fuzz run "$target" -- -max_total_time="$DURATION"
          done

      - name: Archive additional fuzz crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes-${{ matrix.name }}
          path: |
            ${{ matrix.directory }}/artifacts/
            ${{ matrix.directory }}/crash-*
          if-no-files-found: ignore
