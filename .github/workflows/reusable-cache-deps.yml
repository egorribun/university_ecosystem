# Improved Caching Workflow
# Provides enhanced caching for dependencies across workflows
name: Cache Dependencies

permissions:
    contents: read

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version"
                required: false
                type: string
                default: "3.14"
            node-version:
                description: "Node.js version"
                required: false
                type: string
                default: "24"
            go-version:
                description: "Go version"
                required: false
                type: string
                default: "1.26.6"
        outputs:
            python-cache-hit:
                description: "Whether Python cache was hit"
                value: ${{ jobs.cache.outputs.python-cache-hit }}
            node-cache-hit:
                description: "Whether Node.js cache was hit"
                value: ${{ jobs.cache.outputs.node-cache-hit }}

jobs:
    cache:
        name: Warm Dependency Caches
        runs-on: ubuntu-24.04
        outputs:
            python-cache-hit: ${{ steps.python-cache.outputs.cache-hit }}
            node-cache-hit: ${{ steps.node-cache.outputs.cache-hit }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Python dependencies cache
            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              id: python-cache
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install Python dependencies
              run: |
                  uv sync --frozen

            # Node.js dependencies cache
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Cache Node.js dependencies
              id: node-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      frontend/node_modules
                      ~/.npm
                  key: node-${{ inputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
                  restore-keys: |
                      node-${{ inputs.node-version }}-

            - name: Install Node.js dependencies
              if: steps.node-cache.outputs.cache-hit != 'true'
              working-directory: frontend
              run: npm ci

            # Go dependencies cache (for services)
            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ inputs.go-version }}
                  cache: true
                  cache-dependency-path: |
                      services/gateway/go.sum
                      services/file-processor/go.sum
                      services/ws-hub/go.sum

            - name: Cache summary
              run: |
                  {
                    echo "## Dependency Cache Status"
                    echo ""
                    echo "| Language | Cache Hit |"
                    echo "|----------|-----------|"
                    echo "| Python | ${{ steps.python-cache.outputs.cache-hit || 'false' }} |"
                    echo "| Node.js | ${{ steps.node-cache.outputs.cache-hit || 'false' }} |"
                    echo "| Go | (managed by setup-go) |"
                  } >> "$GITHUB_STEP_SUMMARY"
