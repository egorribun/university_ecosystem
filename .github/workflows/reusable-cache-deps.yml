# Improved Caching Workflow
# Provides enhanced caching for dependencies across workflows
name: Cache Dependencies

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version"
                required: false
                type: string
                default: "3.13"
            node-version:
                description: "Node.js version"
                required: false
                type: string
                default: "22"
            go-version:
                description: "Go version"
                required: false
                type: string
                default: "1.25.x"
        outputs:
            python-cache-hit:
                description: "Whether Python cache was hit"
                value: ${{ jobs.cache.outputs.python-cache-hit }}
            node-cache-hit:
                description: "Whether Node.js cache was hit"
                value: ${{ jobs.cache.outputs.node-cache-hit }}

jobs:
    cache:
        name: Warm Dependency Caches
        runs-on: ubuntu-latest
        outputs:
            python-cache-hit: ${{ steps.python-cache.outputs.cache-hit }}
            node-cache-hit: ${{ steps.node-cache.outputs.cache-hit }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

            # Python dependencies cache
            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7.1.5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install Python dependencies
              run: |
                  uv sync --frozen

            # Node.js dependencies cache
            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Cache Node.js dependencies
              id: node-cache
              uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
              with:
                  path: |
                      frontend/node_modules
                      ~/.npm
                  key: node-${{ inputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
                  restore-keys: |
                      node-${{ inputs.node-version }}-

            - name: Install Node.js dependencies
              if: steps.node-cache.outputs.cache-hit != 'true'
              working-directory: frontend
              run: npm ci

            # Go dependencies cache (for services)
            - name: Setup Go
              uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.3.0
              with:
                  go-version: ${{ inputs.go-version }}
                  cache: true
                  cache-dependency-path: |
                      services/gateway/go.sum
                      services/file-processor/go.sum
                      services/ws-hub/go.sum

            - name: Cache summary
              run: |
                  {
                    echo "## Dependency Cache Status"
                    echo ""
                    echo "| Language | Cache Hit |"
                    echo "|----------|-----------|"
                    echo "| Python | ${{ steps.python-cache.outputs.cache-hit || 'false' }} |"
                    echo "| Node.js | ${{ steps.node-cache.outputs.cache-hit || 'false' }} |"
                    echo "| Go | (managed by setup-go) |"
                  } >> "$GITHUB_STEP_SUMMARY"

