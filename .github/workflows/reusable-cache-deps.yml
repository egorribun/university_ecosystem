# Improved Caching Workflow
# Provides enhanced caching for dependencies across workflows
name: Cache Dependencies

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version"
                required: false
                type: string
                default: "3.13"
            node-version:
                description: "Node.js version"
                required: false
                type: string
                default: "22"
            go-version:
                description: "Go version"
                required: false
                type: string
                default: "1.25.x"
        outputs:
            python-cache-hit:
                description: "Whether Python cache was hit"
                value: ${{ jobs.cache.outputs.python-cache-hit }}
            node-cache-hit:
                description: "Whether Node.js cache was hit"
                value: ${{ jobs.cache.outputs.node-cache-hit }}

jobs:
    cache:
        name: Warm Dependency Caches
        runs-on: ubuntu-latest
        outputs:
            python-cache-hit: ${{ steps.python-cache.outputs.cache-hit }}
            node-cache-hit: ${{ steps.node-cache.outputs.cache-hit }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # Python dependencies cache
            - name: Setup Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install Python dependencies
              run: |
                  uv sync --frozen

            # Node.js dependencies cache
            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Cache Node.js dependencies
              id: node-cache
              uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
              with:
                  path: |
                      frontend/node_modules
                      ~/.npm
                  key: node-${{ inputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
                  restore-keys: |
                      node-${{ inputs.node-version }}-

            - name: Install Node.js dependencies
              if: steps.node-cache.outputs.cache-hit != 'true'
              working-directory: frontend
              run: npm ci

            # Go dependencies cache (for services)
            - name: Setup Go
              uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
              with:
                  go-version: ${{ inputs.go-version }}
                  cache: true
                  cache-dependency-path: |
                      services/gateway/go.sum
                      services/file-processor/go.sum
                      services/ws-hub/go.sum

            - name: Cache summary
              run: |
                  {
                    echo "## Dependency Cache Status"
                    echo ""
                    echo "| Language | Cache Hit |"
                    echo "|----------|-----------|"
                    echo "| Python | ${{ steps.python-cache.outputs.cache-hit || 'false' }} |"
                    echo "| Node.js | ${{ steps.node-cache.outputs.cache-hit || 'false' }} |"
                    echo "| Go | (managed by setup-go) |"
                  } >> "$GITHUB_STEP_SUMMARY"

