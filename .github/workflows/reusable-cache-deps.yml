# Improved Caching Workflow
# Provides enhanced caching for dependencies across workflows
name: Cache Dependencies

permissions:
    contents: read

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version"
                required: false
                type: string
                default: "3.14"
            node-version:
                description: "Node.js version"
                required: false
                type: string
                default: "22"
            go-version:
                description: "Go version"
                required: false
                type: string
                default: "1.26.4"
        outputs:
            python-cache-hit:
                description: "Whether Python cache was hit"
                value: ${{ jobs.cache.outputs.python-cache-hit }}
            node-cache-hit:
                description: "Whether Node.js cache was hit"
                value: ${{ jobs.cache.outputs.node-cache-hit }}

jobs:
    cache:
        name: Warm Dependency Caches
        runs-on: ubuntu-latest
        outputs:
            python-cache-hit: ${{ steps.python-cache.outputs.cache-hit }}
            node-cache-hit: ${{ steps.node-cache.outputs.cache-hit }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            # Python dependencies cache
            - name: Setup Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              id: python-cache
              uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install Python dependencies
              run: |
                  uv sync --frozen

            # Node.js dependencies cache
            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Cache Node.js dependencies
              id: node-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      frontend/node_modules
                      ~/.npm
                  key: node-${{ inputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
                  restore-keys: |
                      node-${{ inputs.node-version }}-

            - name: Install Node.js dependencies
              if: steps.node-cache.outputs.cache-hit != 'true'
              working-directory: frontend
              run: npm ci

            # Go dependencies cache (for services)
            - name: Setup Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version: ${{ inputs.go-version }}
                  cache: true
                  cache-dependency-path: |
                      services/gateway/go.sum
                      services/file-processor/go.sum
                      services/ws-hub/go.sum

            - name: Cache summary
              run: |
                  {
                    echo "## Dependency Cache Status"
                    echo ""
                    echo "| Language | Cache Hit |"
                    echo "|----------|-----------|"
                    echo "| Python | ${{ steps.python-cache.outputs.cache-hit || 'false' }} |"
                    echo "| Node.js | ${{ steps.node-cache.outputs.cache-hit || 'false' }} |"
                    echo "| Go | (managed by setup-go) |"
                  } >> "$GITHUB_STEP_SUMMARY"
