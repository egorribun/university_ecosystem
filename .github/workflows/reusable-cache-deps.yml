# Improved Caching Workflow
# Provides enhanced caching for dependencies across workflows
name: Cache Dependencies

permissions:
    contents: read

on:
    workflow_call:
        inputs:
            python-version:
                description: "Python version"
                required: false
                type: string
                default: "3.14"
            node-version:
                description: "Node.js version"
                required: false
                type: string
                default: "24"
            go-version:
                description: "Go version"
                required: false
                type: string
                default: "1.26.11"
        outputs:
            python-cache-hit:
                description: "Whether Python cache was hit"
                value: ${{ jobs.cache.outputs.python-cache-hit }}
            node-cache-hit:
                description: "Whether Node.js cache was hit"
                value: ${{ jobs.cache.outputs.node-cache-hit }}

jobs:
    cache:
        name: Warm Dependency Caches
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        outputs:
            python-cache-hit: ${{ steps.python-cache.outputs.cache-hit }}
            node-cache-hit: ${{ steps.node-cache.outputs.cache-hit }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            # Python dependencies cache
            - name: Setup Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ inputs.python-version }}

            - name: Install uv
              id: python-cache
              uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install Python dependencies
              run: |
                  uv sync --frozen

            # Node.js dependencies cache
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Cache Node.js dependencies
              id: node-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.npm
                  key: node-${{ inputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

            - name: Install Node.js dependencies
              working-directory: frontend
              run: npm ci --no-audit --no-fund

            # Go dependencies cache (for services)
            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ inputs.go-version }}
                  cache: true
                  cache-dependency-path: |
                      services/gateway/go.sum
                      services/file-processor/go.sum
                      services/ws-hub/go.sum

            - name: Cache summary
              env:
                TI_PYTHON_CACHE_CACHE_HIT_FALSE: ${{ steps.python-cache.outputs.cache-hit || 'false' }}
                TI_NODE_CACHE_CACHE_HIT_FALSE: ${{ steps.node-cache.outputs.cache-hit || 'false' }}
              run: |
                  {
                    echo "## Dependency Cache Status"
                    echo ""
                    echo "| Language | Cache Hit |"
                    echo "|----------|-----------|"
                    echo "| Python | ${TI_PYTHON_CACHE_CACHE_HIT_FALSE} |"
                    echo "| Node.js | ${TI_NODE_CACHE_CACHE_HIT_FALSE} |"
                    echo "| Go | (managed by setup-go) |"
                  } >> "$GITHUB_STEP_SUMMARY"
