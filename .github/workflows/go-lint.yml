# MOD-05 (audit Wave 10): golangci-lint CI for all Go services.
# MOD-08 (audit Wave 10): per-service Go SBOM generation (SPDX-JSON via Syft).
# Runs on every PR and push to main that touches Go source code.
name: Go Lint & SBOM

on:
  pull_request:
    paths:
      - "services/**/*.go"
      - "services/**/go.mod"
      - ".golangci.yml"
  push:
    branches: [main]
    paths:
      - "services/**/*.go"
      - "services/**/go.mod"
      - ".golangci.yml"

permissions:
  contents: read

jobs:
  golangci-lint:
    name: Lint ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - ws-hub
          - file-processor
          - gateway

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache: false  # golangci-lint-action manages its own cache

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.3.0
          install-mode: goinstall
          working-directory: services/${{ matrix.service }}
          args: --config ../../.golangci.yml --timeout 5m

  # ── MOD-08: SBOM generation for each Go service ────────────────────────────
  go-sbom:
    name: SBOM — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only generate SBOMs on pushes to main (not on every PR) to avoid noise.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - ws-hub
          - file-processor
          - gateway

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # MOD-08: Install Syft for Go-aware SBOM generation.
      # Syft understands go.mod / go.sum and emits accurate component lists.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@df80a2d718b525f00e28f115998a4497e682ca7f # v0.18.0

      - name: Generate SPDX-JSON SBOM for ${{ matrix.service }}
        run: |
          syft dir:services/${{ matrix.service }} \
            --output spdx-json=sbom-${{ matrix.service }}.spdx.json \
            --scope all-layers
          echo "Generated SBOM for ${{ matrix.service }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90
