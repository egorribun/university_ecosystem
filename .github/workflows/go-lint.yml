# MOD-05 (audit Wave 10): golangci-lint CI for all Go services.
# MOD-08 (audit Wave 10): per-service Go SBOM generation (SPDX-JSON via Syft).
# Runs on every PR and push to main that touches Go source code.
name: Go Lint & SBOM

on:
  pull_request:
    paths:
      - "services/**/*.go"
      - "services/**/go.mod"
      - ".golangci.yml"
  push:
    branches: [main]
    paths:
      - "services/**/*.go"
      - "services/**/go.mod"
      - ".golangci.yml"

permissions:
  contents: read

jobs:
  golangci-lint:
    name: Lint ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - ws-hub
          - file-processor
          - gateway

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache: false  # golangci-lint-action manages its own cache

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.3.0
          install-mode: goinstall
          working-directory: services/${{ matrix.service }}
          args: --config ../../.golangci.yml --timeout 5m

  # ── MOD-08: SBOM generation for each Go service ────────────────────────────
  go-sbom:
    name: SBOM — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only generate SBOMs on pushes to main (not on every PR) to avoid noise.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - ws-hub
          - file-processor
          - gateway

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # MOD-08: Install Syft for Go-aware SBOM generation.
      # Syft understands go.mod / go.sum and emits accurate component lists.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SPDX-JSON SBOM for ${{ matrix.service }}
        run: |
          syft dir:services/${{ matrix.service }} \
            --output spdx-json=sbom-${{ matrix.service }}.spdx.json \
            --scope all-layers
          echo "Generated SBOM for ${{ matrix.service }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90
