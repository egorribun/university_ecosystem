name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly scan — Monday 01:30 UTC (staggered from other Monday jobs)
    - cron: "30 1 * * 1"
  # Manual reruns use repository_dispatch so the workflow is always loaded
  # from the default branch, never from a caller-selected ref.
  repository_dispatch:
    types: [run-scorecard]

permissions: read-all

concurrency:
  # Only a newer main push supersedes an older push. Scheduled and manual
  # security evidence runs retain unique groups and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Required for publishing SARIF results to the Security tab
      security-events: write
      # Required for OIDC token exchange with Scorecard API
      id-token: write
      # Scorecard reads repository contents
      contents: read
      # Required for actions/checkout
      actions: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Scorecard needs full history to check commit signing, branch protection, etc.
          persist-credentials: false

      - name: Verify trusted main source
        env:
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Scorecard refuses to run outside protected main."
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main --depth=1
          trusted_sha="$(git rev-parse refs/remotes/origin/main)"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Protected main did not resolve to a full commit SHA."
            exit 1
          fi
          if [[ "$checked_out_sha" != "$trusted_sha" || "$EVENT_SHA" != "$trusted_sha" || "$WORKFLOW_SHA" != "$trusted_sha" ]]; then
            echo "::error::Workflow source is not the current immutable protected-main commit."
            exit 1
          fi

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Disabled because this job post-processes SARIF with a `run:` step.
          # The public Scorecard API only accepts workflows whose Scorecard job
          # contains `uses:` steps exclusively; Code Scanning still receives the
          # filtered SARIF via github/codeql-action/upload-sarif below.
          publish_results: false

      - name: Normalize Scorecard SARIF ownership
        run: sudo chown "$USER:$USER" scorecard-results.sarif

      - name: Filter policy-only Scorecard SARIF findings
        shell: python
        run: |
          import json
          from pathlib import Path

          sarif_path = Path("scorecard-results.sarif")
          sarif = json.loads(sarif_path.read_text(encoding="utf-8"))
          suppressed_rule_ids = {
              # These are repository policy or operations signals. Keep them in
              # the published Scorecard result, but do not duplicate them as
              # source-code alerts where they cannot be remediated by a diff.
              "BranchProtectionID",
              "CIIBestPracticesID",
              "CITestsID",
              "CodeReviewID",
              "PinnedDependenciesID",
              "SASTID",
              "TokenPermissionsID",
              # Dependency CVEs are uploaded by Trivy with package context.
              "VulnerabilitiesID",
          }

          for run in sarif.get("runs", []):
              tool = run.get("tool", {}).get("driver", {})
              tool["rules"] = [
                  rule
                  for rule in tool.get("rules", [])
                  if rule.get("id") not in suppressed_rule_ids
              ]
              run["results"] = [
                  result
                  for result in run.get("results", [])
                  if result.get("ruleId") not in suppressed_rule_ids
              ]

          sarif_path.write_text(json.dumps(sarif, indent=2), encoding="utf-8")

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: scorecard-results.sarif
