name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly scan — Monday 01:30 UTC (staggered from other Monday jobs)
    - cron: "30 1 * * 1"
  # Allow manual trigger for ad-hoc scoring
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required for publishing SARIF results to the Security tab
      security-events: write
      # Required for OIDC token exchange with Scorecard API
      id-token: write
      # Scorecard reads repository contents
      contents: read
      # Required for actions/checkout
      actions: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Scorecard needs full history to check commit signing, branch protection, etc.
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish to public Scorecard API (shows badge on README, requires public repo)
          publish_results: true

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: scorecard-results.sarif


