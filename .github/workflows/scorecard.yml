name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly scan — Monday 01:30 UTC (staggered from other Monday jobs)
    - cron: "30 1 * * 1"
  # Manual reruns use repository_dispatch so the workflow is always loaded
  # from the default branch, never from a caller-selected ref.
  repository_dispatch:
    types: [run-scorecard]

permissions: read-all

concurrency:
  # Only a newer main push supersedes an older push. Scheduled and manual
  # security evidence runs retain unique groups and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Required for publishing SARIF results to the Security tab
      security-events: write
      # Scorecard reads repository contents
      contents: read
      # Required for actions/checkout
      actions: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Scorecard needs full history to check commit signing, branch protection, etc.
          persist-credentials: false

      - name: Verify trusted main source
        id: trusted_source
        env:
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Scorecard refuses to run outside protected main."
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main --depth=1
          trusted_sha="$(git rev-parse refs/remotes/origin/main)"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Protected main did not resolve to a full commit SHA."
            exit 1
          fi
          if [[ "$checked_out_sha" != "$trusted_sha" || "$EVENT_SHA" != "$trusted_sha" || "$WORKFLOW_SHA" != "$trusted_sha" ]]; then
            echo "::error::Workflow source is not the current immutable protected-main commit."
            exit 1
          fi

      - name: Run OpenSSF Scorecard (native JSON for the floor gate)
        id: scorecard-json
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.json
          results_format: json
          # Publication is disabled: the public Scorecard API only accepts
          # workflows whose Scorecard job contains `uses:` steps exclusively.
          # The SARIF run below is what reaches Code Scanning.
          publish_results: false

      - name: Run OpenSSF Scorecard (SARIF for Code Scanning)
        id: scorecard-sarif
        if: ${{ always() && steps.trusted_source.outcome == 'success' }}
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Normalize Scorecard result ownership
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          for report in scorecard-results.json scorecard-results.sarif; do
            if [[ -f "$report" ]]; then
              sudo chown "$USER:$USER" "$report"
            fi
          done

      - name: Verify Scorecard report source
        id: report_source
        if: ${{ always() && steps.trusted_source.outcome == 'success' && steps.scorecard-sarif.outcome == 'success' }}
        env:
          EVENT_SHA: ${{ github.sha }}
          SCORECARD_RESULT_OUTCOME: ${{ steps.scorecard-json.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Scorecard event commit is invalid."
            exit 1
          fi
          # Each action scans remote main separately. Protected main disallows
          # force pushes; unchanged pre- and post-scan tips bind both scans to
          # the event commit provided that branch protection is not bypassed.
          git fetch --no-tags --depth=1 origin refs/heads/main
          report_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "$report_sha" != "$EVENT_SHA" ]]; then
            echo "::error::Protected main changed while Scorecard was scanning."
            exit 1
          fi
          if [[ "$SCORECARD_RESULT_OUTCOME" == "success" ]]; then
            python3 scripts/quality/scorecard_floors_gate.py \
              quality/scorecard-floors.json scorecard-results.json \
              --expected-commit "$EVENT_SHA" --validate-source-only
          fi

      # AUD-381: every check is published to Code Scanning before the floor gate
      # runs. The filter that previously removed policy checks from the upload
      # is removed, so gated checks are visible in the Security tab too.
      - name: Upload SARIF results to GitHub Security tab
        if: ${{ always() && steps.scorecard-sarif.outcome == 'success' && steps.report_source.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard-results.sarif

      # AUD-381: gate per key check on the score floors recorded in
      # quality/scorecard-floors.json, not on the aggregate score. Checks that
      # the repository cannot change are published and never gated.
      - name: Gate Scorecard key-check floors
        shell: bash
        env:
          SCORECARD_RESULT_OUTCOME: ${{ steps.scorecard-json.outcome }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$SCORECARD_RESULT_OUTCOME" != "success" ]]; then
            echo "::error::Scorecard JSON run did not succeed; the scan result is unknown." >&2
            exit 1
          fi
          python3 scripts/quality/scorecard_floors_gate.py \
            quality/scorecard-floors.json \
            scorecard-results.json \
            --expected-commit "$EVENT_SHA" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload Scorecard reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results-${{ github.run_id }}
          path: |
            scorecard-results.json
            scorecard-results.sarif
          if-no-files-found: error
          retention-days: 90
