name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly scan — Monday 01:30 UTC (staggered from other Monday jobs)
    - cron: "30 1 * * 1"
  # Allow manual trigger for ad-hoc scoring
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required for publishing SARIF results to the Security tab
      security-events: write
      # Required for OIDC token exchange with Scorecard API
      id-token: write
      # Scorecard reads repository contents
      contents: read
      # Required for actions/checkout
      actions: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Scorecard needs full history to check commit signing, branch protection, etc.
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish to public Scorecard API (shows badge on README, requires public repo)
          publish_results: true

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: scorecard-results.sarif


