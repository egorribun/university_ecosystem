# GitHub's workflow schema supports `jobs.<job_id>.services.<service_id>.command`;
# actionlint v1.7.12 does not yet model that key and reports a false syntax
# error. Keep the exception scoped to the one CI workflow and exact message.
paths:
  .github/workflows/ci.yml:
    ignore:
      - 'unexpected key "command" for "services" section'
  .github/workflows/contract-validation.yml:
    ignore:
      - 'SC2046'
  .github/workflows/visual-audit.yml:
    ignore:
      - 'SC2009'
  .github/workflows/manual-mutation-evidence.yml:
    ignore:
      - 'SC2319'
