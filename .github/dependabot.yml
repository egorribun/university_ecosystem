version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      npm-dependencies:
        patterns:
          - "*"
  # The root project is managed by uv. The "pip" ecosystem edits pyproject.toml
  # without regenerating uv.lock, which leaves `uv lock --check` failing; the
  # "uv" ecosystem updates both files together.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # semgrep (security group) requires jsonschema <4.26; the pin and its
      # stubs move together once semgrep accepts 4.26.
      - dependency-name: "jsonschema"
        versions: [">=4.26"]
      - dependency-name: "types-jsonschema"
        versions: [">=4.26"]
    groups:
      uv-dependencies:
        patterns:
          - "*"
  # The hash-pinned detect-secrets runner requirements are a plain pip file.
  - package-ecosystem: "pip"
    directory: "/security"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      detect-secrets-runner:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
  # FIX-DEP-02: Add Dependabot Go module entries for all three Go services.
  # Without these entries, Go module dependencies (go.mod / go.sum) are never
  # scanned for outdated or vulnerable packages.
  - package-ecosystem: "gomod"
    directory: "/services/ws-hub"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go-ws-hub:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/services/gateway"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:30"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go-gateway:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/services/file-processor"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go-file-processor:
        patterns:
          - "*"
