version: 2
# Dependency updates target the integration branch; main receives them through
# the reviewed egorribun -> main pull request (owner decision 2026-09-25).
updates:
  - package-ecosystem: "npm"
    target-branch: "egorribun"
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    # OpenTelemetry moves as one generation. The 2.12 SDK peers with
    # @opentelemetry/api below 1.10.0 and pairs with the 0.223 experimental line,
    # so major releases and 0.x minor bumps (for example 0.223 -> 0.300, which
    # needs api 1.10) wait for a reviewed, coordinated lock refresh.
    ignore:
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/api"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@opentelemetry/instrumentation"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@opentelemetry/instrumentation-fetch"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@opentelemetry/instrumentation-user-interaction"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@opentelemetry/instrumentation-xml-http-request"
        update-types: ["version-update:semver-minor"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
  # The root project is managed by uv. The "pip" ecosystem edits pyproject.toml
  # without regenerating uv.lock, which leaves `uv lock --check` failing; the
  # "uv" ecosystem updates both files together.
  - package-ecosystem: "uv"
    target-branch: "egorribun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # semgrep (security group) requires jsonschema <4.26; the pin and its
      # stubs move together once semgrep accepts 4.26.
      - dependency-name: "jsonschema"
        versions: [">=4.26"]
      - dependency-name: "types-jsonschema"
        versions: [">=4.26"]
    groups:
      uv-dependencies:
        patterns:
          - "*"
  # The hash-pinned detect-secrets runner requirements are a plain pip file.
  - package-ecosystem: "pip"
    target-branch: "egorribun"
    directory: "/security"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      detect-secrets-runner:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    target-branch: "egorribun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
  # FIX-DEP-02: Add Dependabot Go module entries for all three Go services.
  # Without these entries, Go module dependencies (go.mod / go.sum) are never
  # scanned for outdated or vulnerable packages.
  - package-ecosystem: "gomod"
    target-branch: "egorribun"
    directory: "/services/ws-hub"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go-ws-hub:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    target-branch: "egorribun"
    directory: "/services/gateway"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:30"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go-gateway:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    target-branch: "egorribun"
    directory: "/services/file-processor"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go-file-processor:
        patterns:
          - "*"
