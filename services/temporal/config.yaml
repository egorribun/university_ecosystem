# Temporal Server v1.30.7 — plain server config for Wave 144 SW2 Path B
#
# References (per W141 anti-pattern #3 — VERIFIED upstream sources):
#   - Upstream development-postgres12.yaml:
#     https://github.com/temporalio/temporal/blob/v1.30.7/config/development-postgres12.yaml
#   - Authorization struct YAML tags:
#     https://github.com/temporalio/temporal/blob/v1.30.7/common/config/config.go
#     lines 603-622 (Authorization) + 624-628 (JWTKeyProvider)
#   - JWT signature verification path:
#     https://github.com/temporalio/temporal/blob/v1.30.7/common/authorization/default_token_key_provider.go
#     uses github.com/go-jose/go-jose/v4 (JWKS) + github.com/golang-jwt/jwt/v4 v4.5.2 (verify)
#
# CRITICAL schema correction vs W144 Phase 1 Agent 2 (which quoted Context7's
# `tokenKeyProvider`): the actual upstream key is `jwtKeyProvider` (per
# config.go:605 `yaml:"jwtKeyProvider"`). `claimMapper`, `authorizer`, and
# `audience` are SIBLING fields at the same level (NOT nested inside
# jwtKeyProvider). Confirmed by reading the Go struct + YAML tags.
#
# The JWKS round-trip contract (tests/test_jwks_roundtrip.py) disproved this.
# Agent 2 W142's "JWKS byte-encoding mismatch" hypothesis: encoding IS
# canonical RFC 7518 § 6.3.1.1; end-to-end Python verify against real
# .secrets/temporal_api_key PASSES against both PEM-derived AND JWKS-
# reconstructed pub keys. W144 SW2 plain-server runtime swap is the
# verification step (per W141 anti-pattern #2) — if the same "crypto/rsa:
# verification error" appears, it is structurally Temporal-runtime-specific,
# walk the 6-phase diagnostic decision tree per Phase 1 Agent 2 report.

log:
  stdout: true
  level: info

# ─── Persistence ────────────────────────────────────────────────────────────
#
# Two PostgreSQL databases: `temporal` (primary) + `temporal_visibility`
# (visibility queries). Schema bootstrap is performed once by the
# `temporal-admin-tools` sidecar in docker-compose.full.yml (W144 SW2 Step 2)
# via `temporal-sql-tool` commands before this server starts.
persistence:
  defaultStore: postgres-default
  visibilityStore: postgres-visibility
  numHistoryShards: 4  # dev-sized; production uses 512+
  datastores:
    postgres-default:
      sql:
        pluginName: "postgres12"
        databaseName: "temporal"
        connectAddr: "postgres:5432"   # service-name DNS inside compose network
        connectProtocol: "tcp"
        user: "${POSTGRES_USER}"        # rendered from compose env
        password: "${POSTGRES_PWD}"
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: "1h"
    postgres-visibility:
      sql:
        pluginName: "postgres12"
        databaseName: "temporal_visibility"
        connectAddr: "postgres:5432"
        connectProtocol: "tcp"
        user: "${POSTGRES_USER}"
        password: "${POSTGRES_PWD}"
        maxConns: 2
        maxIdleConns: 2
        maxConnLifetime: "1h"

# ─── Global config (membership + metrics + authorization) ───────────────────
global:
  membership:
    maxJoinDuration: 30s
    # Every Temporal service runs in this one container. The internal services
    # (history, matching, worker, internal-frontend) bind only to 127.0.0.1, so
    # the membership ring must advertise loopback too. External clients reach
    # the authenticated frontend on 0.0.0.0:7233 and never use membership.
    broadcastAddress: "127.0.0.1"
  pprof:
    port: 7936
  metrics:
    prometheus:
      framework: "tally"
      timerType: "histogram"
      listenAddress: "0.0.0.0:8000"
  # ─── JWT authorization (W144 SW2 Path B closure target) ───────────────────
  #
  # The default JWT claim mapper validates the JWT signature against keys
  # fetched from `jwtKeyProvider.keySourceURIs`. Refresh interval re-fetches
  # the JWKS so that key rotation is picked up without restart.
  #
  # - `claimMapper: "default"` invokes `defaultJWTClaimMapper`: parses the
  #   JWT, verifies signature against JWKS, and extracts roles from the
  #   permissions claim. Missing permissions grant no roles.
  # - `authorizer: "default"` selects `defaultAuthorizer`, which enforces the
  #   roles carried by the verified claims. The empty value selects
  #   `noopAuthorizer` (every signature-verified caller is allowed) and is
  #   intentionally not used (AUD-506).
  # - `keySourceURIs` is rendered from TEMPORAL_JWKS_URL by entrypoint.sh and
  #   must use https. Plain-HTTP key discovery lets a network attacker replace
  #   the signing keys that the claim mapper trusts (AUD-506).
  # - `audience: "temporal"` matches the `aud` claim minted by
  #   start-docker.ps1's New-TemporalServiceToken function (default audience
  #   value is "temporal").
  authorization:
    jwtKeyProvider:
      keySourceURIs:
        - "${TEMPORAL_JWKS_URL}"
      refreshInterval: 1m
    claimMapper: "default"
    authorizer: "default"
    audience: "temporal"

# ─── Services (frontend/internal-frontend/matching/history/worker) ─────────
#
# All services share one container (TEMPORAL_SERVICES in entrypoint.sh). The
# public frontend gRPC listener (7233), membership listener (6933), and enabled
# HTTP API (7243) use bindOnIP 0.0.0.0. Public frontend RPC requests and HTTP
# API calls forwarded to RPC handlers use the configured JWT authorization.
# Prometheus metrics on 0.0.0.0:8000 are separate and have no Temporal JWT
# authorization. Pprof port 7936 defaults to localhost when its host is omitted
# in Temporal Server v1.30.7.
#
# The internal-frontend, history, matching, and worker listeners configured
# below bind to 127.0.0.1 at ports 6934, 6935, 6936, 6939, 7234, 7235, 7236,
# 7239, and 7246. The existing peer-negative checks cover exactly those nine
# ports; they do not establish that 7233 is the only bridge-reachable listener.
# Temporal's system SDK client (used by the worker scanner) talks to
# `internal-frontend` instead when that service is defined
# (common/resource/fx.go hasIFE). It runs the NoopClaimMapper, which grants
# system admin to any caller, so it must stay bound to loopback. Do not expose
# its ports or move its bind address off 127.0.0.1.
#
# `bindOnLocalHost` must stay false when `bindOnIP` is set. Temporal rejects
# the two options together (common/rpc/rpc.go).
services:
  frontend:
    rpc:
      grpcPort: 7233
      membershipPort: 6933
      bindOnLocalHost: false
      bindOnIP: "0.0.0.0"
      httpPort: 7243
  internal-frontend:
    rpc:
      grpcPort: 7236
      membershipPort: 6936
      bindOnLocalHost: false
      bindOnIP: "127.0.0.1"
      # Non-zero because the local frontend HTTP client used by callbacks and
      # Nexus operations resolves this service when internal-frontend exists
      # (common/rpc/rpc.go createLocalFrontendHTTPClient). The HTTP listener
      # inherits the gRPC listener's loopback address.
      httpPort: 7246
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnLocalHost: false
      bindOnIP: "127.0.0.1"
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnLocalHost: false
      bindOnIP: "127.0.0.1"
  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnLocalHost: false
      bindOnIP: "127.0.0.1"

# ─── Cluster metadata (single-cluster dev) ──────────────────────────────────
#
# `rpcAddress: "temporal:7233"` allows other Temporal services in the cluster
# to discover the frontend via Docker service-name DNS. Single active cluster
# (no global namespaces).
clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: "active"
  currentClusterName: "active"
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: "frontend"
      rpcAddress: "temporal:7233"

dcRedirectionPolicy:
  policy: "noop"

# Default namespace registered by `temporal-namespace-init` sidecar (W144 SW2
# Step 2). file-processor's Go client connects with namespace="default".
namespaceDefaults:
  archival:
    history:
      state: "disabled"
    visibility:
      state: "disabled"
