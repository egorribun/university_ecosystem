# osv-scanner.toml — ws-hub service
#
# ADR-SEC-2026-04-23: Accepted-risk entries for Go stdlib vulnerabilities
# introduced in go1.26.1 (all four services use the same toolchain version).
#
# Context: osv-scanner flags stdlib vulnerabilities based on the go directive
# in go.mod.  These 7 IDs were published in April 2026 and affect the stdlib
# bundled with go1.26.1.  The fix for every entry is to upgrade the Go
# toolchain to the next patch release (≥ go1.26.2) once it is available.
#
# Risk acceptance rationale (per vulnerability):
#   GO-2026-4864  internal/syscall/unix — Root.Chmod TOCTOU symlink escape.
#                 ws-hub does not call Root.Chmod or any os/root API.
#   GO-2026-4865  html/template — XSS via JS template literal context.
#                 ws-hub is a WebSocket/NATS relay; it renders no HTML.
#   GO-2026-4866  crypto/x509 — Wildcard SAN DNS constraint bypass.
#                 JWK sets for JWT verification are fetched from a static
#                 internal JWKS endpoint; no untrusted wildcard certs are
#                 evaluated.
#   GO-2026-4869  archive/tar — OOM on sparse tar archives.
#                 ws-hub processes only WebSocket frames; no tar archives.
#   GO-2026-4870  crypto/tls — CVE-2026-32283.
#                 TLS is terminated at the ingress layer; NATS and Redis
#                 connections use server-controlled certificates inside the
#                 cluster.
#   GO-2026-4946  crypto/x509 — DoS via policy mapping chains.
#                 No client-supplied certificate chains are accepted.
#   GO-2026-4947  crypto/x509 — DoS via intermediate certificate flooding.
#                 Same rationale as GO-2026-4946.
#
# ignoreUntil: 2026-07-01 — forces re-evaluation once go1.26.2+ is released.
# Owner: @security-team  Ticket: SEC-2026-042

[[IgnoredVulns]]
id = "GO-2026-4864"
ignoreUntil = 2026-07-01
reason = "ws-hub does not invoke Root.Chmod or any os/root API; TOCTOU symlink-escape is unexploitable here. Fix: upgrade toolchain to go>=1.26.2."

[[IgnoredVulns]]
id = "GO-2026-4865"
ignoreUntil = 2026-07-01
reason = "ws-hub is a WebSocket/NATS relay with no HTML rendering; html/template is not imported or invoked. Fix: upgrade toolchain to go>=1.26.2."

[[IgnoredVulns]]
id = "GO-2026-4866"
ignoreUntil = 2026-07-01
reason = "JWKS are fetched from a static internal endpoint; no untrusted wildcard SAN certificates are evaluated. Fix: upgrade toolchain to go>=1.26.2."

[[IgnoredVulns]]
id = "GO-2026-4869"
ignoreUntil = 2026-07-01
reason = "ws-hub processes only WebSocket frames and NATS messages; archive/tar is not used. Fix: upgrade toolchain to go>=1.26.2."

[[IgnoredVulns]]
id = "GO-2026-4870"
ignoreUntil = 2026-07-01
reason = "TLS is terminated at the ingress layer; NATS/Redis connections use server-controlled certificates inside the cluster. CVE-2026-32283 exposure is limited to the controlled perimeter. Fix: upgrade toolchain to go>=1.26.2."

[[IgnoredVulns]]
id = "GO-2026-4946"
ignoreUntil = 2026-07-01
reason = "No client-supplied X.509 certificate chains are accepted; policy-mapping DoS vector is not reachable. Fix: upgrade toolchain to go>=1.26.2."

[[IgnoredVulns]]
id = "GO-2026-4947"
ignoreUntil = 2026-07-01
reason = "No client-supplied intermediate certificates are accepted; intermediate-flooding DoS vector is not reachable. Fix: upgrade toolchain to go>=1.26.2."
