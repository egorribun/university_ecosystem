schema {
  query: Query
  mutation: Mutation
}

type Query {
  health: String!
  file(id: ID!): File
}

type Mutation {
  processFile(input: ProcessFileInput!): FileJob!
}

type File {
  id: ID!
  url: String!
  size: Int
  type: String
}

type FileJob {
  jobId: ID!
  status: String!
  resultUrl: String
}

input ProcessFileInput {
  type: String!
  sourceKey: String!
  destKey: String!
  width: Int
  height: Int
}
