# SpiceDB PostgreSQL Datastore Configuration for Production
#
# This configuration file provides production-ready settings for SpiceDB
# with PostgreSQL as the datastore backend. Key features:
# - Connection pooling with appropriate limits
# - Health checks and readiness probes
# - TLS encryption for database connections
# - Garbage collection configuration
# - Watch API support for real-time permission updates
#
# Environment Variables Required:
#   SPICEDB_GRPC_PRESHARED_KEY - Pre-shared key for gRPC authentication
#   SPICEDB_DATASTORE_URI - PostgreSQL connection string
#   SPICEDB_DATASTORE_CONN_MAX_OPEN - Max open connections (default: 20)
#   SPICEDB_DATASTORE_CONN_MAX_IDLE_TIME - Max idle time (default: 30m)
#
# Reference: https://authzed.com/docs/spicedb/ops/deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicedb
  namespace: university-ecosystem
  labels:
    app: spicedb
    component: authorization
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spicedb
  template:
    metadata:
      labels:
        app: spicedb
        component: authorization
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: spicedb
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: spicedb
          image: authzed/spicedb:v1.38.0
          args:
            - serve
            # Datastore configuration
            - --datastore-engine=postgres
            - --datastore-conn-uri=$(SPICEDB_DATASTORE_URI)
            - --datastore-conn-pool-read-healthcheck-interval=30s
            - --datastore-conn-pool-read-max-idletime=$(SPICEDB_DATASTORE_CONN_MAX_IDLE_TIME)
            - --datastore-conn-pool-read-max-lifetime=1h
            - --datastore-conn-pool-read-max-open=$(SPICEDB_DATASTORE_CONN_MAX_OPEN)
            - --datastore-conn-pool-read-min-open=5
            - --datastore-conn-pool-write-healthcheck-interval=30s
            - --datastore-conn-pool-write-max-idletime=$(SPICEDB_DATASTORE_CONN_MAX_IDLE_TIME)
            - --datastore-conn-pool-write-max-lifetime=1h
            - --datastore-conn-pool-write-max-open=$(SPICEDB_DATASTORE_CONN_MAX_OPEN)
            - --datastore-conn-pool-write-min-open=5
            # Garbage collection settings
            - --datastore-gc-interval=3m
            - --datastore-gc-window=24h
            - --datastore-gc-max-operation-time=1m
            # Watch API for real-time updates
            - --datastore-watch-buffer-length=1024
            # gRPC settings
            - --grpc-preshared-key=$(SPICEDB_GRPC_PRESHARED_KEY)
            - --grpc-addr=:50051
            - --grpc-max-conn-age=30m
            # HTTP gateway settings
            - --http-addr=:8443
            - --http-enabled=true
            # Metrics and telemetry
            - --metrics-addr=:9090
            - --metrics-enabled=true
            # Dispatch settings for distributed authorization
            - --dispatch-cache-enabled=true
            - --dispatch-cluster-enabled=false
            - --dispatch-num-retries=3
            # Namespace cache
            - --ns-cache-expiration=1m
            # Request hedging for improved latency
            - --dispatch-hedging-enabled=true
            - --dispatch-hedging-initial-slow-value=50ms
            - --dispatch-hedging-max-requests=4
            # Logging
            - --log-level=info
            - --log-format=json
          env:
            - name: SPICEDB_GRPC_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: spicedb-secrets
                  key: grpc-preshared-key
            - name: SPICEDB_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: spicedb-secrets
                  key: datastore-uri
            - name: SPICEDB_DATASTORE_CONN_MAX_OPEN
              value: "20"
            - name: SPICEDB_DATASTORE_CONN_MAX_IDLE_TIME
              value: "30m"
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: http
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: spicedb
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: spicedb
---
apiVersion: v1
kind: Service
metadata:
  name: spicedb
  namespace: university-ecosystem
  labels:
    app: spicedb
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: http
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: spicedb
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spicedb
  namespace: university-ecosystem
---
# PostgreSQL migration job for SpiceDB schema
apiVersion: batch/v1
kind: Job
metadata:
  name: spicedb-migrate
  namespace: university-ecosystem
  labels:
    app: spicedb
    component: migration
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: spicedb-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: spicedb
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: authzed/spicedb:v1.38.0
          args:
            - migrate
            - head
            - --datastore-engine=postgres
            - --datastore-conn-uri=$(SPICEDB_DATASTORE_URI)
            - --log-level=info
            - --log-format=json
          env:
            - name: SPICEDB_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: spicedb-secrets
                  key: datastore-uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
# PodDisruptionBudget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spicedb-pdb
  namespace: university-ecosystem
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: spicedb
---
# HorizontalPodAutoscaler for dynamic scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spicedb-hpa
  namespace: university-ecosystem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spicedb
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
