# RZ-05 (audit Wave 12): Docker secrets — mounted at /run/secrets/<name> as tmpfs
# files, invisible to `docker inspect` and not stored in image layers.
#
# Setup (Docker Swarm):
#   echo "min-32-char-secret-key" | docker secret create secret_key -
#   echo "postgresql://user:pass@host/db" | docker secret create database_url -
#   echo "nats-auth-token" | docker secret create nats_auth_token -
#
# Setup (Docker Compose without Swarm) — use file: secrets (keep outside repo):
#   secrets:
#     secret_key:
#       file: /etc/university/secrets/secret_key   # chmod 0400, owned by deploy user
#   POSTGRES_PASSWORD_SOURCE_FILE=/etc/university/secrets/postgres_password
#
# Python config reads SECRET_KEY_FILE, DATABASE_URL_FILE, NATS_AUTH_TOKEN_FILE
# via _load_file_secret() in app/core/config/base.py.

secrets:
  secret_key:
    external: true
  database_url:
    external: true
  nats_auth_token:
    external: true
  postgres_password:
    file: ${POSTGRES_PASSWORD_SOURCE_FILE:?Set POSTGRES_PASSWORD_SOURCE_FILE for production}

services:
  backend:
    profiles: ["prod"]
    # RZ-05: secret files replace plain env vars so sensitive values never appear
    # in `docker inspect` or the process environment.
    # MOD-14-06: DATABASE_URL_FILE must contain a URL with host=pgbouncer (not
    # postgres) so connections go through PgBouncer in transaction pooling mode.
    # Example: postgresql+asyncpg://university:<pass>@pgbouncer:5432/university
    secrets:
      - secret_key
      - database_url
      - nats_auth_token
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      NATS_AUTH_TOKEN_FILE: /run/secrets/nats_auth_token
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN for production}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS for production}
    # RZ-W13-05: container hardening — defence-in-depth on top of K8s securityContext.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/cache:size=256m,nosuid
    cap_drop:
      - ALL
    # PERF-W15-05 (audit 2026-03-23 Wave 15): Health check enables depends_on
    # conditions in downstream services (e.g. nginx) and surfaces startup failures
    # in `docker ps` / `docker compose ps` without needing to tail logs.
    # Uses Python stdlib urllib so no extra packages needed.
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3); sys.exit(0)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  notifications-worker:
    profiles: ["prod"]
    secrets:
      - secret_key
      - database_url
      - nats_auth_token
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      NATS_AUTH_TOKEN_FILE: /run/secrets/nats_auth_token
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    # The worker already exposes a dedicated monitoring application on port 9101;
    # probe its health endpoint instead of a PID file that it never creates.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  outbox-worker:
    profiles: ["prod"]
    secrets:
      - secret_key
      - database_url
      - nats_auth_token
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      NATS_AUTH_TOKEN_FILE: /run/secrets/nats_auth_token
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    # The worker writes both files after DB/NATS initialization. A stale heartbeat
    # detects a blocked event loop while signal 0 also detects a dead process.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; pid=int(open('/tmp/worker.pid', encoding='ascii').read()); os.kill(pid,0); raise SystemExit(0 if time.time()-os.path.getmtime('/tmp/worker.heartbeat') < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  migrations:
    profiles: ["prod"]
    secrets:
      - secret_key
      - database_url
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
    depends_on:
      pgbouncer:
        condition: service_healthy
    # Migrations need write access for Alembic temp files; no read_only here.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  postgres:
    image: pgvector/pgvector:pg17
    profiles: ["prod"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-university}
      POSTGRES_DB: ${POSTGRES_DB:-university}
      # The base Compose file injects POSTGRES_PASSWORD. An empty override lets
      # the official entrypoint select the mounted *_FILE value instead.
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  # MOD-14-06 (audit 2026-03-18): PgBouncer connection pooler in transaction mode.
  # The maintained edoburu image generates its config and SCRAM userlist at
  # startup. The wrapper reads the database password from the mounted secret so
  # it never appears in Compose environment metadata.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    profiles: ["prod"]
    restart: unless-stopped
    secrets:
      - postgres_password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export DB_PASSWORD="$$(cat /run/secrets/postgres_password)"
        exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-university}"
      DB_USER: "${POSTGRES_USER:-university}"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      # The Compose-managed PostgreSQL service has no server certificate.
      # `prefer` still negotiates TLS when an external TLS-enabled DB is used.
      SERVER_TLS_SSLMODE: prefer
      ADMIN_USERS: "${POSTGRES_USER:-university}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_net
    read_only: true
    tmpfs:
      - /tmp:uid=70,gid=70,mode=0700
      - /etc/pgbouncer:uid=70,gid=70,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$DB_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
