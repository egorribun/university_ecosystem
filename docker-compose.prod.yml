      AUDIT_LOG_SECRET_FILE: /run/secrets/audit_log_secret
      ELASTICSEARCH_PASSWORD_FILE: /run/secrets/elasticsearch_password
      INTERNAL_AUTH_TOKEN_FILE: /run/secrets/internal_auth_token
      INTERNAL_HMAC_SECRET_FILE: /run/secrets/internal_hmac_secret
      SPICEDB_PRESHARED_KEY_FILE: /run/secrets/spicedb_preshared_key
      TOKEN_HMAC_SECRET_FILE: /run/secrets/token_hmac_secret
      IDEMPOTENCY_HMAC_SECRET_FILE: /run/secrets/idempotency_hmac_secret
      WS_HUB_INTERNAL_SECRET_FILE: /run/secrets/ws_hub_internal_secret
      RATE_LIMIT_STORAGE_URI_FILE: !reset null
      VAPID_PRIVATE_KEY_FILE: !reset null
      SPOTIFY_CLIENT_SECRET_FILE: !reset null
      SPOTIFY_OAUTH_STATE_SECRET_FILE: !reset null
      SPOTIFY_CLIENT_ID: !reset null
    depends_on:
      pgbouncer:
        condition: service_healthy
    # Migrations need write access for Alembic temp files; no read_only here.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    profiles: ["prod"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-university}
      POSTGRES_DB: ${POSTGRES_DB:-university}
      # The base Compose file injects POSTGRES_PASSWORD. An empty override lets
      # the official entrypoint select the mounted *_FILE value instead.
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  # MOD-14-06 (audit 2026-03-18): PgBouncer connection pooler in transaction mode.
  # The maintained edoburu image generates its config and SCRAM userlist at
  # startup. The wrapper reads the database password from the mounted secret so
  # it never appears in Compose environment metadata.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
    profiles: ["prod"]
    restart: unless-stopped
    secrets:
      - postgres_password
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export DB_PASSWORD="$$(cat /run/secrets/postgres_password)"
        exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-university}"
      DB_USER: "${POSTGRES_USER:-university}"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      # The Compose-managed PostgreSQL service has no server certificate.
      # `prefer` still negotiates TLS when an external TLS-enabled DB is used.
      SERVER_TLS_SSLMODE: prefer
      ADMIN_USERS: "${POSTGRES_USER:-university}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_net
    read_only: true
    tmpfs:
      - /tmp:uid=70,gid=70,mode=0700
      - /etc/pgbouncer:uid=70,gid=70,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # PgBouncer is an event-driven pooler; 128 MiB and 0.25 CPU leave
          # room for the configured 1,000 client slots without an unbounded
          # process when a client storm occurs.
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$DB_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
