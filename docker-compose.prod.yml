# RZ-05 (audit Wave 12): Docker secrets — mounted at /run/secrets/<name> as tmpfs
# files, invisible to `docker inspect` and not stored in image layers.
#
# Setup (Docker Swarm):
#   echo "min-32-char-secret-key" | docker secret create secret_key -
#   echo "postgresql://user:pass@host/db" | docker secret create database_url -
#   echo "nats-auth-token" | docker secret create nats_auth_token -
#
# Setup (Docker Compose without Swarm) — use file: secrets (keep outside repo):
#   secrets:
#     secret_key:
#       file: /etc/university/secrets/secret_key   # chmod 0400, owned by deploy user
#
# Python config reads SECRET_KEY_FILE, DATABASE_URL_FILE, NATS_AUTH_TOKEN_FILE
# via _load_file_secret() in app/core/config/base.py.

secrets:
  secret_key:
    external: true
  database_url:
    external: true
  nats_auth_token:
    external: true

services:
  backend:
    profiles: ["prod"]
    # RZ-05: secret files replace plain env vars so sensitive values never appear
    # in `docker inspect` or the process environment.
    # MOD-14-06: DATABASE_URL_FILE must contain a URL with host=pgbouncer (not
    # postgres) so connections go through PgBouncer in transaction pooling mode.
    # Example: postgresql+asyncpg://university:<pass>@pgbouncer:5432/university
    secrets:
      - secret_key
      - database_url
      - nats_auth_token
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      NATS_AUTH_TOKEN_FILE: /run/secrets/nats_auth_token
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN for production}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS for production}
    # RZ-W13-05: container hardening — defence-in-depth on top of K8s securityContext.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/cache:size=256m,nosuid
    cap_drop:
      - ALL
    # PERF-W15-05 (audit 2026-03-23 Wave 15): Health check enables depends_on
    # conditions in downstream services (e.g. nginx) and surfaces startup failures
    # in `docker ps` / `docker compose ps` without needing to tail logs.
    # Uses Python stdlib urllib so no extra packages needed.
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3); sys.exit(0)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  notifications-worker:
    profiles: ["prod"]
    secrets:
      - secret_key
      - database_url
      - nats_auth_token
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      NATS_AUTH_TOKEN_FILE: /run/secrets/nats_auth_token
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    # PERF-W15-05: Worker health check via PID 1 liveness (process running = healthy).
    # Workers don't expose an HTTP endpoint; checking process existence is sufficient.
    # If the worker's event loop crashes and the process exits, Docker restarts it.
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1/status') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  outbox-worker:
    profiles: ["prod"]
    secrets:
      - secret_key
      - database_url
      - nats_auth_token
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      NATS_AUTH_TOKEN_FILE: /run/secrets/nats_auth_token
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    # PERF-W15-05: Same PID-liveness pattern as notifications-worker.
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1/status') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  migrations:
    profiles: ["prod"]
    secrets:
      - secret_key
      - database_url
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
    # Migrations need write access for Alembic temp files; no read_only here.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  postgres:
    image: pgvector/pgvector:pg17
    profiles: ["prod"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-university}
      POSTGRES_DB: ${POSTGRES_DB:-university}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:?Provide POSTGRES_PASSWORD_FILE for production}

  # MOD-14-06 (audit 2026-03-18): PgBouncer connection pooler in transaction mode.
  # Sits between backend/workers and PostgreSQL; caps server-side connections at
  # PGBOUNCER_DEFAULT_POOL_SIZE (25) regardless of how many app replicas are running.
  # Auth uses scram-sha-256 via pgbouncer.get_auth() so PgBouncer never holds
  # plaintext passwords.  DATABASE_URL_FILE must point to a URL using host=pgbouncer.
  pgbouncer:
    image: pgbouncer/pgbouncer:1.23.1
    restart: unless-stopped
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: "5432"
      DATABASES_DBNAME: "${POSTGRES_DB:-university}"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "1000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_AUTH_USER: "${POSTGRES_USER:-university}"
      PGBOUNCER_AUTH_QUERY: "SELECT password FROM pgbouncer.get_auth($1)"
      PGBOUNCER_SERVER_TLS_SSLMODE: require
      PGBOUNCER_ADMIN_USERS: "${POSTGRES_USER:-university}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5
