# Production uses file-backed Docker Compose secrets (not Swarm `external`
# secrets). Keep source files outside the repository. Compose file secrets are
# host bind mounts; Compose does not remap uid/gid/mode for them.
#
# Required source paths before rendering or starting the `prod` profile:
#   SECRET_KEY_SOURCE_FILE=/etc/university/secrets/secret_key
#   DATABASE_URL_SOURCE_FILE=/etc/university/secrets/database_url
#   NATS_AUTH_TOKEN_SOURCE_FILE=/etc/university/secrets/nats_auth_token
#   CACHE_REDIS_URL_SOURCE_FILE=/etc/university/secrets/cache_redis_url
#   RATE_LIMIT_STORAGE_URI_SOURCE_FILE=/etc/university/secrets/rate_limit_storage_uri
#   REVOCATION_REDIS_URL_SOURCE_FILE=/etc/university/secrets/revocation_redis_url
#   POSTGRES_PASSWORD_SOURCE_FILE=/etc/university/secrets/postgres_password
#   MFA_TOTP_ENCRYPTION_KEYS_SOURCE_FILE=/etc/university/secrets/mfa_totp_encryption_keys
#   VAPID_PRIVATE_KEY_SOURCE_FILE=/etc/university/secrets/vapid_private_key
#   SPOTIFY_CLIENT_SECRET_SOURCE_FILE=/etc/university/secrets/spotify_client_secret
#   SPOTIFY_OAUTH_STATE_SECRET_SOURCE_FILE=/etc/university/secrets/spotify_oauth_state_secret
#   SPOTIFY_TOKEN_SECRET_SOURCE_FILE=/etc/university/secrets/spotify_token_secret
#   AUDIT_LOG_SECRET_SOURCE_FILE=/etc/university/secrets/audit_log_secret
#   ELASTICSEARCH_PASSWORD_SOURCE_FILE=/etc/university/secrets/elasticsearch_password
#   INTERNAL_AUTH_TOKEN_SOURCE_FILE=/etc/university/secrets/internal_auth_token
#   INTERNAL_HMAC_SECRET_SOURCE_FILE=/etc/university/secrets/internal_hmac_secret
#   SPICEDB_PRESHARED_KEY_SOURCE_FILE=/etc/university/secrets/spicedb_preshared_key
#   TOKEN_HMAC_SECRET_SOURCE_FILE=/etc/university/secrets/token_hmac_secret
#   WS_HUB_INTERNAL_SECRET_SOURCE_FILE=/etc/university/secrets/ws_hub_internal_secret
#   IDEMPOTENCY_HMAC_SECRET_SOURCE_FILE=/etc/university/secrets/idempotency_hmac_secret
#   TRUSTED_PROXIES=<comma-separated Caddy and gateway CIDRs, for example the
#     service_net subnet>
# Every path above is required. Only VAPID private, Spotify client, and Spotify
# OAuth-state sources may be empty regular files, and only while their respective
# integrations are disabled. Spotify requires a client ID, client secret, and
# OAuth-state secret together. The token-encryption secret is always non-empty
# for every production Python service. Never generate placeholder credentials.
# The operator also supplies ELASTICSEARCH_URL (HTTPS), a TLS-capable
# SPICEDB_ENDPOINT, and EVENT_FILE_SCANNER_HOST; Compose fails rendering when any
# is absent. The bundled SpiceDB service is configured without TLS, so production
# API calls must target a separately managed TLS endpoint while retaining the
# forced-TLS client guard. EVENT_FILE_SCANNER_PORT defaults to clamd's existing
# 3310 setting. The scanner host must be reachable from the backend container;
# 127.0.0.1 refers to that container. No scanner is provisioned here, and render
# checks do not prove search, SpiceDB, or scanner connectivity or production readiness.
#
# The backend image runs as UID:GID 10001:10001. Backend, notification, outbox,
# and migration containers must be able to read every mounted application secret
# as UID 10001, with execute permission on every parent directory. A source mode
# of 0400 suffices only when the exact host-mapped UID 10001 owns it; otherwise
# grant a read ACL to that mapped UID (and traverse ACLs on parent directories).
# PgBouncer's pinned image runs as Alpine postgres UID:GID 70:70; pgvector uses
# Debian postgres UID:GID 999:999. This overlay mounts the same postgres_password
# source into both, so grant read ACLs to both mapped identities. A service-specific
# Compose override can use separate source files if distinct ACLs are required. With
# rootless Docker or user namespace remapping, grant access to the corresponding
# host-mapped numeric IDs; deployment-owner 0400 alone is not sufficient.
#
# Before startup, run content-silent readability checks inside each pinned service
# identity (for example, `test -r /run/secrets/secret_key` in a Python container,
# and checks as `--user 999:999` for postgres and `--user 70:70` for pgbouncer).
# Check exit status only; never print or read secret contents in diagnostics.
# Source values for NATS, Redis, PostgreSQL, and SpiceDB must match the credentials
# configured for those existing services. The TOTP active key ID is nonsecret and
# must be supplied directly as MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID. File-backed
# Python values use the explicitly supported base loader or their field validators.
secrets:
  secret_key:
    file: ${SECRET_KEY_SOURCE_FILE:?Set SECRET_KEY_SOURCE_FILE for production}
  database_url:
    file: ${DATABASE_URL_SOURCE_FILE:?Set DATABASE_URL_SOURCE_FILE for production}
  nats_auth_token:
    file: ${NATS_AUTH_TOKEN_SOURCE_FILE:?Set NATS_AUTH_TOKEN_SOURCE_FILE for production}
  # AUD-191: both Redis URLs embed the Redis password, so they are file-backed.
  cache_redis_url:
    file: ${CACHE_REDIS_URL_SOURCE_FILE:?Set CACHE_REDIS_URL_SOURCE_FILE for production}
  revocation_redis_url:
    file: ${REVOCATION_REDIS_URL_SOURCE_FILE:?Set REVOCATION_REDIS_URL_SOURCE_FILE for production}
  postgres_password:
    file: ${POSTGRES_PASSWORD_SOURCE_FILE:?Set POSTGRES_PASSWORD_SOURCE_FILE for production}
  mfa_totp_encryption_keys:
    file: ${MFA_TOTP_ENCRYPTION_KEYS_SOURCE_FILE:?Set MFA_TOTP_ENCRYPTION_KEYS_SOURCE_FILE for production}
  vapid_private_key:
    file: ${VAPID_PRIVATE_KEY_SOURCE_FILE:?Set VAPID_PRIVATE_KEY_SOURCE_FILE for production}
  spotify_client_secret:
    file: ${SPOTIFY_CLIENT_SECRET_SOURCE_FILE:?Set SPOTIFY_CLIENT_SECRET_SOURCE_FILE for production}
  spotify_oauth_state_secret:
    file: ${SPOTIFY_OAUTH_STATE_SECRET_SOURCE_FILE:?Set SPOTIFY_OAUTH_STATE_SECRET_SOURCE_FILE for production}
  spotify_token_secret:
    file: ${SPOTIFY_TOKEN_SECRET_SOURCE_FILE:?Set SPOTIFY_TOKEN_SECRET_SOURCE_FILE for production}
  audit_log_secret:
    file: ${AUDIT_LOG_SECRET_SOURCE_FILE:?Set AUDIT_LOG_SECRET_SOURCE_FILE for production}
  elasticsearch_password:
    file: ${ELASTICSEARCH_PASSWORD_SOURCE_FILE:?Set ELASTICSEARCH_PASSWORD_SOURCE_FILE for production}
  internal_auth_token:
    file: ${INTERNAL_AUTH_TOKEN_SOURCE_FILE:?Set INTERNAL_AUTH_TOKEN_SOURCE_FILE for production}
  internal_hmac_secret:
    file: ${INTERNAL_HMAC_SECRET_SOURCE_FILE:?Set INTERNAL_HMAC_SECRET_SOURCE_FILE for production}
  rate_limit_storage_uri:
    file: ${RATE_LIMIT_STORAGE_URI_SOURCE_FILE:?Set RATE_LIMIT_STORAGE_URI_SOURCE_FILE for production}
  spicedb_preshared_key:
    file: ${SPICEDB_PRESHARED_KEY_SOURCE_FILE:?Set SPICEDB_PRESHARED_KEY_SOURCE_FILE for production}
  token_hmac_secret:
    file: ${TOKEN_HMAC_SECRET_SOURCE_FILE:?Set TOKEN_HMAC_SECRET_SOURCE_FILE for production}
  ws_hub_internal_secret:
    file: ${WS_HUB_INTERNAL_SECRET_SOURCE_FILE:?Set WS_HUB_INTERNAL_SECRET_SOURCE_FILE for production}
  # AUD-490: every staging/production process refuses to start without the HMAC key
  # that signs idempotency keys. It is file-backed like the other application keys.
  idempotency_hmac_secret:
    file: ${IDEMPOTENCY_HMAC_SECRET_SOURCE_FILE:?Set IDEMPOTENCY_HMAC_SECRET_SOURCE_FILE for production}

services:
  backend:
    profiles: ["prod"]
    env_file: !reset []
    # RZ-05: secret files replace plain env vars so sensitive values never appear
    # in `docker inspect` or the process environment.
    # MOD-14-06: DATABASE_URL_FILE must contain a URL with host=pgbouncer (not
    # postgres) so connections go through PgBouncer in transaction pooling mode.
    # Example: postgresql+asyncpg://university:<pass>@pgbouncer:5432/university
    secrets:
      - secret_key
      - database_url
      - nats_auth_token
      - cache_redis_url
      - rate_limit_storage_uri
      - revocation_redis_url
      - mfa_totp_encryption_keys
      - vapid_private_key
      - spotify_client_secret
      - spotify_oauth_state_secret
      - spotify_token_secret
      - audit_log_secret
      - elasticsearch_password
      - internal_auth_token
      - internal_hmac_secret
      - spicedb_preshared_key
      - token_hmac_secret
      - idempotency_hmac_secret
      - ws_hub_internal_secret
    environment:
      ENVIRONMENT: production
      DATABASE_URL: !reset null
      SECRET_KEY: !reset null
      NATS_AUTH_TOKEN: !reset null
      VAPID_PRIVATE_KEY: !reset null
      SPOTIFY_CLIENT_SECRET: !reset null
      SPOTIFY_OAUTH_STATE_SECRET: !reset null
      SPOTIFY_TOKEN_SECRET: !reset null
      MFA_TOTP_ENCRYPTION_KEYS: !reset null
      MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID: ${MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID:?Set MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID for production}
      MFA_TOTP_ENCRYPTION_KEYS_FILE: /run/secrets/mfa_totp_encryption_keys
      MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID_FILE: !reset null
      SPICEDB_INSECURE: !reset null
      CACHE_REDIS_URL: !reset null
      REVOCATION_REDIS_URL: !reset null
      CACHE_REDIS_URL_FILE: /run/secrets/cache_redis_url
      REVOCATION_REDIS_URL_FILE: /run/secrets/revocation_redis_url
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      NATS_AUTH_TOKEN_FILE: /run/secrets/nats_auth_token
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      SPOTIFY_CLIENT_SECRET_FILE: /run/secrets/spotify_client_secret
      SPOTIFY_OAUTH_STATE_SECRET_FILE: /run/secrets/spotify_oauth_state_secret
      SPOTIFY_TOKEN_SECRET_FILE: /run/secrets/spotify_token_secret
      # AUD-164: the API keys rate limits on the forwarded client address only for
      # peers listed here. Name the Caddy and gateway CIDRs; the API refuses to start
      # with an empty list in production.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?Set TRUSTED_PROXIES to the Caddy and gateway CIDRs for production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN for production}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS for production}
      MINIO_SECURE: "true"
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:?Set HTTPS ELASTICSEARCH_URL for production}
      SPICEDB_ENDPOINT: ${SPICEDB_ENDPOINT:?Set TLS SPICEDB_ENDPOINT for production}
      EVENT_FILE_SCANNER_ENABLED: "true"
      EVENT_FILE_SCANNER_HOST: ${EVENT_FILE_SCANNER_HOST:?Set reachable clamd EVENT_FILE_SCANNER_HOST for production}
      EVENT_FILE_SCANNER_PORT: ${EVENT_FILE_SCANNER_PORT:-3310}
      INTERNAL_HMAC_SECRET: !reset null
      WS_HUB_INTERNAL_SECRET: !reset null
      SPICEDB_PRESHARED_KEY: !reset null
      TOKEN_HMAC_SECRET: !reset null
      INTERNAL_AUTH_TOKEN: !reset null
      RATE_LIMIT_STORAGE_URI: !reset null
      AUDIT_LOG_SECRET: !reset null
      ELASTICSEARCH_PASSWORD: !reset null
      RATE_LIMIT_STORAGE_URI_FILE: /run/secrets/rate_limit_storage_uri
      AUDIT_LOG_SECRET_FILE: /run/secrets/audit_log_secret
      ELASTICSEARCH_PASSWORD_FILE: /run/secrets/elasticsearch_password
      INTERNAL_AUTH_TOKEN_FILE: /run/secrets/internal_auth_token
      INTERNAL_HMAC_SECRET_FILE: /run/secrets/internal_hmac_secret
      SPICEDB_PRESHARED_KEY_FILE: /run/secrets/spicedb_preshared_key
      TOKEN_HMAC_SECRET_FILE: /run/secrets/token_hmac_secret
      IDEMPOTENCY_HMAC_SECRET_FILE: /run/secrets/idempotency_hmac_secret
      WS_HUB_INTERNAL_SECRET_FILE: /run/secrets/ws_hub_internal_secret
    # RZ-W13-05: container hardening — defence-in-depth on top of K8s securityContext.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/cache:size=256m,nosuid
    cap_drop:
      - ALL
    # PERF-W15-05 (audit 2026-03-23 Wave 15): Health check enables depends_on
    # conditions in downstream services (e.g. nginx) and surfaces startup failures
    # in `docker ps` / `docker compose ps` without needing to tail logs.
    # Uses Python stdlib urllib so no extra packages needed.
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3); sys.exit(0)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  notifications-worker:
    profiles: ["prod"]
    env_file: !reset []
    secrets:
      - secret_key
      - database_url
      - nats_auth_token
      - cache_redis_url
      - rate_limit_storage_uri
      - vapid_private_key
      - spotify_token_secret
      - audit_log_secret
      - elasticsearch_password
      - internal_auth_token
      - internal_hmac_secret
      - spicedb_preshared_key
      - token_hmac_secret
      - idempotency_hmac_secret
      - ws_hub_internal_secret
    environment:
      ENVIRONMENT: production
      DATABASE_URL: !reset null
      SECRET_KEY: !reset null
      NATS_AUTH_TOKEN: !reset null
      SPOTIFY_TOKEN_SECRET: !reset null
      SPOTIFY_CLIENT_ID: !reset null
      VAPID_PRIVATE_KEY: !reset null
      SPOTIFY_CLIENT_SECRET: !reset null
      MFA_TOTP_ENCRYPTION_KEYS: !reset null
      MFA_TOTP_ENCRYPTION_KEYS_FILE: !reset null
      MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID: !reset null
      MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID_FILE: !reset null
      SPICEDB_INSECURE: !reset null
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      NATS_AUTH_TOKEN_FILE: /run/secrets/nats_auth_token
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      SPOTIFY_TOKEN_SECRET_FILE: /run/secrets/spotify_token_secret
      MINIO_SECURE: "true"
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:?Set HTTPS ELASTICSEARCH_URL for production}
      SPICEDB_ENDPOINT: ${SPICEDB_ENDPOINT:?Set TLS SPICEDB_ENDPOINT for production}
      EVENT_FILE_SCANNER_ENABLED: "true"
      EVENT_FILE_SCANNER_HOST: ${EVENT_FILE_SCANNER_HOST:?Set reachable clamd EVENT_FILE_SCANNER_HOST for production}
      EVENT_FILE_SCANNER_PORT: ${EVENT_FILE_SCANNER_PORT:-3310}
      REVOCATION_REDIS_URL: !reset null
      INTERNAL_HMAC_SECRET: !reset null
      WS_HUB_INTERNAL_SECRET: !reset null
      CACHE_REDIS_URL: !reset null
      SPICEDB_PRESHARED_KEY: !reset null
      TOKEN_HMAC_SECRET: !reset null
      INTERNAL_AUTH_TOKEN: !reset null
      SPOTIFY_OAUTH_STATE_SECRET: !reset null
      RATE_LIMIT_STORAGE_URI: !reset null
      AUDIT_LOG_SECRET: !reset null
      ELASTICSEARCH_PASSWORD: !reset null
      CACHE_REDIS_URL_FILE: /run/secrets/cache_redis_url
      RATE_LIMIT_STORAGE_URI_FILE: /run/secrets/rate_limit_storage_uri
      AUDIT_LOG_SECRET_FILE: /run/secrets/audit_log_secret
      ELASTICSEARCH_PASSWORD_FILE: /run/secrets/elasticsearch_password
      INTERNAL_AUTH_TOKEN_FILE: /run/secrets/internal_auth_token
      INTERNAL_HMAC_SECRET_FILE: /run/secrets/internal_hmac_secret
      SPICEDB_PRESHARED_KEY_FILE: /run/secrets/spicedb_preshared_key
      TOKEN_HMAC_SECRET_FILE: /run/secrets/token_hmac_secret
      IDEMPOTENCY_HMAC_SECRET_FILE: /run/secrets/idempotency_hmac_secret
      WS_HUB_INTERNAL_SECRET_FILE: /run/secrets/ws_hub_internal_secret
      REVOCATION_REDIS_URL_FILE: !reset null
      SPOTIFY_CLIENT_SECRET_FILE: !reset null
      SPOTIFY_OAUTH_STATE_SECRET_FILE: !reset null
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    # The worker already exposes a dedicated monitoring application on port 9101;
    # probe its health endpoint instead of a PID file that it never creates.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  outbox-worker:
    profiles: ["prod"]
    env_file: !reset []
    secrets:
      - secret_key
      - database_url
      - nats_auth_token
      - cache_redis_url
      - spotify_token_secret
      - audit_log_secret
      - elasticsearch_password
      - internal_auth_token
      - internal_hmac_secret
      - spicedb_preshared_key
      - token_hmac_secret
      - idempotency_hmac_secret
      - ws_hub_internal_secret
    environment:
      ENVIRONMENT: production
      DATABASE_URL: !reset null
      SECRET_KEY: !reset null
      NATS_AUTH_TOKEN: !reset null
      SPOTIFY_TOKEN_SECRET: !reset null
      MFA_TOTP_ENCRYPTION_KEYS: !reset null
      MFA_TOTP_ENCRYPTION_KEYS_FILE: !reset null
      MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID: !reset null
      MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID_FILE: !reset null
      SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      NATS_AUTH_TOKEN_FILE: /run/secrets/nats_auth_token
      SPOTIFY_TOKEN_SECRET_FILE: /run/secrets/spotify_token_secret
      MINIO_SECURE: "true"
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:?Set HTTPS ELASTICSEARCH_URL for production}
      SPICEDB_ENDPOINT: ${SPICEDB_ENDPOINT:?Set TLS SPICEDB_ENDPOINT for production}
      EVENT_FILE_SCANNER_ENABLED: "true"
      EVENT_FILE_SCANNER_HOST: ${EVENT_FILE_SCANNER_HOST:?Set reachable clamd EVENT_FILE_SCANNER_HOST for production}
      EVENT_FILE_SCANNER_PORT: ${EVENT_FILE_SCANNER_PORT:-3310}
      REVOCATION_REDIS_URL: !reset null
      VAPID_PRIVATE_KEY: !reset null
      INTERNAL_HMAC_SECRET: !reset null
      SPOTIFY_CLIENT_SECRET: !reset null
      WS_HUB_INTERNAL_SECRET: !reset null
      CACHE_REDIS_URL: !reset null
      SPICEDB_PRESHARED_KEY: !reset null
      TOKEN_HMAC_SECRET: !reset null
      INTERNAL_AUTH_TOKEN: !reset null
      SPOTIFY_OAUTH_STATE_SECRET: !reset null
      RATE_LIMIT_STORAGE_URI: !reset null
      AUDIT_LOG_SECRET: !reset null
      ELASTICSEARCH_PASSWORD: !reset null
      CACHE_REDIS_URL_FILE: /run/secrets/cache_redis_url
      AUDIT_LOG_SECRET_FILE: /run/secrets/audit_log_secret
      ELASTICSEARCH_PASSWORD_FILE: /run/secrets/elasticsearch_password
      INTERNAL_AUTH_TOKEN_FILE: /run/secrets/internal_auth_token
      INTERNAL_HMAC_SECRET_FILE: /run/secrets/internal_hmac_secret
      SPICEDB_PRESHARED_KEY_FILE: /run/secrets/spicedb_preshared_key
      TOKEN_HMAC_SECRET_FILE: /run/secrets/token_hmac_secret
      IDEMPOTENCY_HMAC_SECRET_FILE: /run/secrets/idempotency_hmac_secret
      WS_HUB_INTERNAL_SECRET_FILE: /run/secrets/ws_hub_internal_secret
      RATE_LIMIT_STORAGE_URI_FILE: !reset null
      REVOCATION_REDIS_URL_FILE: !reset null
      VAPID_PRIVATE_KEY_FILE: !reset null
      SPOTIFY_CLIENT_SECRET_FILE: !reset null
      SPOTIFY_OAUTH_STATE_SECRET_FILE: !reset null
      SPOTIFY_CLIENT_ID: !reset null
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    # The worker writes both files after DB/NATS initialization. A stale heartbeat
    # detects a blocked event loop while signal 0 also detects a dead process.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; pid=int(open('/tmp/worker.pid', encoding='ascii').read()); os.kill(pid,0); raise SystemExit(0 if time.time()-os.path.getmtime('/tmp/worker.heartbeat') < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

