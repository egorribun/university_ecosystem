# CI-only override for the "Load and Chaos Resilience Tests" job.
#
# Layered LAST after docker-compose.infra.yml + docker-compose.go.yml +
# docker-compose.yml. It bind-mounts the RS256 signing key into the backend and
# points the Go ws-hub at the password-protected valkey + the auth'd nats.
#
# NOTE on host-publishing: the backend is reached on the host (k6 --network=host,
# the readiness poll, the chaos suite) via a `socat` sidecar started in the CI
# job, NOT via a `ports:` override here. Reason: docker compose v2.x (the CI
# runner) does NOT merge a `ports:` override added to a service whose base
# definition has only `expose:` (backend, postgres) -- it silently drops them
# (verified: CI `docker compose ps` showed backend with no published port even
# though `config` on v5.x renders it). A `volumes:` override DOES merge on v2.x
# (the RS256 mount below applies), so this file keeps only the merge-safe
# overrides and leaves host-publishing to the version-independent socat sidecar.
#
# Caddy is BYPASSED for the load tests: k6 hits backend:8000 (via socat) +
# ws-hub:8081 + gateway:8080 directly, so the production services/caddy/Caddyfile
# (incl. the W132 weighted_round_robin canary block) is untouched.
services:
  backend:
    environment:
      # ws-hub validates room-join authz by calling the backend's internal API
      # with an HMAC signed by WS_HUB_INTERNAL_SECRET (W204). The base compose
      # does not set it (backend defaults to "" in dev), so wire the SAME value
      # the CI job exported into BOTH backend + ws-hub -> the join handshake
      # matches. (The 101 upgrade is ticket-based + works regardless; this makes
      # the full WS chain -- connect + join -- correct end-to-end.)
      WS_HUB_INTERNAL_SECRET: ${WS_HUB_INTERNAL_SECRET}
      # Auth rate-limit headroom for the k6 WS load test. ALL k6 VUs collapse to
      # ONE source IP (the socat sidecar's container IP) so the PER-IP limiters
      # 429 the auth dance (ratelimit/fastapi.py keys unauthenticated requests by
      # client IP). Three distinct limiters are in play:
      #   - GET /api/v1/auth/csrf-cookie -> rate_limit_DEFAULT ("200/minute",
      #     bucket "ip:<ip>:default", rate_limit_settings.py:21). ROUND-7
      #     diagnostic root cause: after 200 GETs this 429s -> NO Set-Cookie ->
      #     the next /register + /login/json arrive with cookie_present=False
      #     header_present=False -> "CSRF rejected (missing token)" 403 (surfaced
      #     to k6 as the generic "CSRF token mismatch" detail). This DEFAULT
      #     limiter is SEPARATE from the sensitive/auth ones below, so round-6 --
      #     which raised only those -- still 429'd here. The k6 dance itself is
      #     correct (50 logins succeeded; "/" load test passed 100% because "/"
      #     is rate-limit-EXEMPT, middleware.py:223). One env var fixes it.
      #   - POST /login/json -> rate_limit_sensitive ("5/minute").
      #   - POST /register   -> rate_limit_auth_register ("5/minute").
      # Raise all of them; once a csrf_token cookie sticks the WS test logs in
      # ONCE per VU (login-once-per-VU cache), so the GET /csrf-cookie volume
      # drops to ~1 per VU. Chaos-safe: the chaos suite exercises the GATEWAY's
      # Go rate-limiter, not these backend rate_limit_* values.
      RATE_LIMIT_DEFAULT: 100000/minute
      RATE_LIMIT_SENSITIVE: 100000/minute
      RATE_LIMIT_AUTH_LOGIN: 100000/minute
      RATE_LIMIT_AUTH_REGISTER: 100000/minute
      # POST /ws/ticket is gated by the WEBSOCKET limiter (rate_limit_websocket
      # "60/minute", bucket "ip:<ip>:/ws"). ROUND-9 observed limit=60 429s on
      # /ws/ticket: all VUs share the socat IP and the test retries the ticket
      # ~1x/s. Separate from rate_limit_default/sensitive; raise it too.
      RATE_LIMIT_WEBSOCKET: 100000/minute
      # Concurrent-session headroom for the WS load test. Each /login/json mints
      # a session and the backend caps them per user (session_service.py:170 ->
      # max_sessions_per_user, default 5 in non-test envs). ROUND-8 observed
      # 10 VUs x 5 = 50 logins then 403 "too_many_sessions" because the test
      # re-logged-in every iteration (it cached JSON body .access_token, which
      # W126 leaves absent -> HttpOnly access_token_v2 cookie). The round-9 test
      # rewrite logs in ONCE per VU (cookie-jar auth thereafter) -> 1 session/VU
      # steady state; this cap raise is belt-and-suspenders against any ramp-up
      # retry. Backend-only; chaos-safe (gateway Go limiter is separate).
      MAX_SESSIONS_PER_USER: 100000
    volumes:
      # L8 -- RS256 private key. backend.Dockerfile sets WORKDIR /app and
      # JWT_PRIVATE_KEY_PATH=.secrets/jwt_rs256.pem (relative) -> resolves to
      # /app/.secrets/jwt_rs256.pem. The CI job generates the key + chmod 644
      # so the non-root backend user can read it (else: Permission denied).
      - ./.secrets:/app/.secrets:ro
    # ROUND-13: override the base HEALTHCHECK (docker-compose.yml:111 uses /healthz
    # -- the FULL check requiring ES/SpiceDB/Tempo all reachable, which 503s under
    # k6 load when a subsystem flaps -> the container is marked UNHEALTHY even
    # though the app is fine, k6 auth all passed). The chaos suite's setup runs
    # `docker compose up -d`, which then fails exit 1 ("dependency failed to start:
    # container backend-1 is unhealthy") on a service_healthy dependency, ERRORing
    # all 5 chaos tests at setup. Use /health/ready (Lean Readiness Probe -- DB
    # connectivity only, app/api/health.py:362), mirroring the docker-compose.full
    # .yml W140 SW3-fix. healthcheck is a map -> the override merges per-key on
    # compose v2.x. Lets the chaos `up -d` see a healthy backend so the suite runs.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  ws-hub:
    # go.yml attaches ws-hub to internal + public ONLY -- NOT cache_net, where
    # valkey lives (docker-compose.yml:341). So ws-hub cannot resolve `valkey`
    # ("lookup valkey ... server misbehaving" = a cross-network SERVFAIL, not
    # transient DNS) -> Redis connect fails -> the OTT ticket GETDEL hard-rejects
    # -> the WS 101 upgrade fails. Restate internal+public (so nats + backend
    # stay reachable) + add cache_net. Works whether v2.x merges the networks
    # sequence by union or replace -- both yield internal+public+cache_net.
    networks:
      - internal
      - public
      - cache_net
    environment:
      # ws-hub HARD-EXITS at startup if WS_HUB_INTERNAL_SECRET is empty
      # (services/ws-hub/main.go:28 os.Exit(1) -- "WS_HUB_INTERNAL_SECRET is not
      # set"). go.yml's ws-hub block doesn't set it + .env.example lacks it ->
      # the round-2 ws-hub Restarting(1) loop (confirmed via the always-on
      # diagnostics step). The CI job exports the value to GITHUB_ENV; same
      # secret as backend above so the room-join authz HMAC matches.
      WS_HUB_INTERNAL_SECRET: ${WS_HUB_INTERNAL_SECRET}
      # The OTT ticket is WRITTEN by the backend to valkey DB 0
      # (CACHE_REDIS_URL=redis://:${REDIS_PASSWORD}@valkey:6379/0) and READ here
      # via GETDEL. ws-hub's defaults (REDIS_URL=redis:6379, REDIS_PASSWORD="",
      # REDIS_DB=0) point at the wrong host + no password -> ticket validation
      # 401s. Override host + password; DB 0 already matches the backend.
      # (environment overrides DO merge on compose v2.x, unlike ports.)
      REDIS_URL: valkey:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      # nats runs with --auth ${NATS_AUTH_TOKEN}; the go.yml default URL lacks
      # the token. WS upgrade (101) is NATS-independent; message fan-out is not.
      NATS_URL: nats://${NATS_AUTH_TOKEN}@nats:4222
