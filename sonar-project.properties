# SonarCloud Project Configuration
sonar.projectKey=egorribun_university_ecosystem
sonar.organization=egorribun

# Source configuration
sonar.sources=app,frontend/src
sonar.tests=tests,frontend/src
sonar.test.inclusions=**/test_*.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Language settings
sonar.python.version=3.13
sonar.javascript.node.maxspace=4096

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/migrations/**,\
  **/alembic/**,\
  **/*.min.js,\
  **/dist/**,\
  **/build/**,\
  **/.venv/**,\
  **/gen/**

# Duplication exclusions
sonar.cpd.exclusions=\
  **/test_*.py,\
  **/*.test.ts,\
  **/*.test.tsx

# Quality gate settings
sonar.qualitygate.wait=true

# Issue severity
sonar.issue.ignore.multicriteria=e1,e2
# Ignore TODO comments
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
# Ignore cognitive complexity in tests
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*
