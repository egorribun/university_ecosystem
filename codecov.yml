codecov:
  require_ci_to_pass: true

comment:
  layout: "condensed_header, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
      python:
        target: 100%
        threshold: 0%
        flags:
          - python
      frontend:
        target: 100%
        threshold: 0%
        flags:
          - frontend
      go-gateway:
        target: 100%
        threshold: 0%
        flags:
          - go-gateway
      go-ws-hub:
        target: 100%
        threshold: 0%
        flags:
          - go-ws-hub
      go-file-processor:
        target: 100%
        threshold: 0%
        flags:
          - go-file-processor
      go-shared:
        target: 100%
        threshold: 0%
        flags:
          - go-shared
      rust-native:
        target: 100%
        threshold: 0%
        flags:
          - rust-native
      rust-pyo3-sanitizer:
        target: 100%
        threshold: 0%
        flags:
          - rust-pyo3-sanitizer
      rust-wasm-sanitizer:
        target: 100%
        threshold: 0%
        flags:
          - rust-wasm-sanitizer
      rust-crypto:
        target: 100%
        threshold: 0%
        flags:
          - rust-crypto
    patch:
      default:
        target: 100%
        threshold: 0%

flags:
  python:
    paths:
      - app/
  frontend:
    paths:
      - frontend/src/
  go-gateway:
    paths:
      - services/gateway/
  go-ws-hub:
    paths:
      - services/ws-hub/
  go-file-processor:
    paths:
      - services/file-processor/
  go-shared:
    paths:
      - services/cmd/uni-cli/
      - services/pkg/logging/
      - services/pkg/spiffe/
      - services/pkg/spicedb/
  rust-native:
    paths:
      - native/rust_ext/
  rust-pyo3-sanitizer:
    paths:
      - crates/pyo3-sanitizer/
  rust-wasm-sanitizer:
    paths:
      - frontend/wasm-sanitizer/
  rust-crypto:
    paths:
      - frontend/rust-crypto/
