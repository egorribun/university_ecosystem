# Observability Stack
# Run with: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d

services:
  # Enable the backend endpoint only when the observability layer is selected.
  # Authentication prevents the localhost-published backend port from exposing
  # operational internals anonymously.
  backend:
    environment:
      ENABLE_METRICS_ENDPOINT: "true"
      METRICS_BASIC_AUTH_USERNAME: "metrics_scraper"
      METRICS_BASIC_AUTH_PASSWORD: ${METRICS_BASIC_AUTH_PASSWORD:?METRICS_BASIC_AUTH_PASSWORD is required - run start-docker.ps1}
      METRICS_ALLOWLIST: ""

  minio:
    environment:
      MINIO_PROMETHEUS_AUTH_TYPE: public

  # Grafana Tempo - Distributed tracing backend
  tempo:
    image: grafana/tempo:2.10.3
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # Replace the base Tempo binding instead of merging a second host binding.
    ports: !override
      - "127.0.0.1:3200:3200"   # Tempo API
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - internal
      - public
    restart: unless-stopped

  # Grafana Loki - Log aggregation
  loki:
    image: grafana/loki:3.7.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infrastructure/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - internal
      - public
    restart: unless-stopped

  # Loki is also distroless, so its readiness check runs from a sidecar.
  loki-healthprobe:
    image: curlimages/curl:8.10.1
    network_mode: "service:loki"
    depends_on:
      - loki
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Grafana Alloy - supported Docker log collector for Loki. Promtail reached
  # end-of-life on 2026-03-02 and receives no further fixes.
  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official image's /var/lib/alloy parent is owned by alloy:alloy with
    # mode 0770. Root needs this single capability to traverse into the mounted
    # state volume; all other Linux capabilities remain dropped.
    cap_add:
      - DAC_OVERRIDE
    networks:
      - internal
      - public
    depends_on:
      loki-healthprobe:
        condition: service_healthy
    restart: unless-stopped

  # Pyroscope - Continuous profiling
  pyroscope:
    image: grafana/pyroscope:1.19.1
    # Replace the base localhost binding instead of publishing it twice.
    ports: !override
      - "127.0.0.1:4040:4040"
    volumes:
      - pyroscope-data:/data
    networks:
      - internal
      - public
    restart: unless-stopped

  # Grafana - Unified dashboards
  grafana:
    image: grafana/grafana:12.3.6
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required - run start-docker.ps1}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_DATABASE_WAL: "true"
      GF_DATABASE_QUERY_RETRIES: "10"
      GF_DATABASE_TRANSACTION_RETRIES: "10"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor tempoSearch tempoBackendSearch"
    volumes:
      - ./infrastructure/observability/grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/university-ecosystem.yaml:ro
      - grafana-data:/var/lib/grafana
    networks:
      - internal
      - public
    depends_on:
      tempo-healthprobe:
        condition: service_healthy
      loki-healthprobe:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      pyroscope:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Prometheus - Metrics (extend existing if present)
  prometheus:
    image: prom/prometheus:v3.10.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf '%s' "$$METRICS_BASIC_AUTH_PASSWORD" > /tmp/backend_metrics_password
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=15d \
          --web.enable-remote-write-receiver
    environment:
      METRICS_BASIC_AUTH_PASSWORD: ${METRICS_BASIC_AUTH_PASSWORD:?METRICS_BASIC_AUTH_PASSWORD is required - run start-docker.ps1}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks:
      - internal
      - public
    depends_on:
      backend:
        condition: service_healthy
      redis-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0
    environment:
      REDIS_ADDR: redis://valkey:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - cache_net
      - internal
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  pyroscope-data:
  grafana-data:
  prometheus-data:
  alloy-data:
