# Observability Stack
# Run with: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d

services:
  # Enable the backend endpoint only when the observability layer is selected.
  # Authentication prevents the localhost-published backend port from exposing
  # operational internals anonymously.
  backend:
    environment:
      ENABLE_METRICS_ENDPOINT: "true"
      METRICS_BASIC_AUTH_USERNAME: "metrics_scraper"
      METRICS_BASIC_AUTH_PASSWORD: ${METRICS_BASIC_AUTH_PASSWORD:?METRICS_BASIC_AUTH_PASSWORD is required - run start-docker.ps1}
      METRICS_ALLOWLIST: ""

  # Grafana Tempo - Distributed tracing backend
  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # Replace the base Tempo binding instead of merging a second host binding.
    ports: !override
      - "127.0.0.1:3200:3200"   # Tempo API
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    networks:
      - internal
      - public
    restart: unless-stopped

  # Tempo's distroless image has no HTTP client. Keep the observability
  # override self-contained by probing /ready from a tiny shared-namespace
  # sidecar; the base/full compose files define the same service.
  tempo-healthprobe:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    network_mode: "service:tempo"
    depends_on:
      - tempo
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 32M
    restart: unless-stopped

  # Grafana Loki - Log aggregation
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infrastructure/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    networks:
      - internal
      - public
    restart: unless-stopped

  # Loki is also distroless, so its readiness check runs from a sidecar.
  loki-healthprobe:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    network_mode: "service:loki"
    depends_on:
      - loki
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 32M
    restart: unless-stopped

  # Grafana Alloy - supported Docker log collector for Loki. Promtail reached
  # end-of-life on 2026-03-02 and receives no further fixes.
  # The adapter is the sole Docker API client; `:ro` on the socket does not restrict API methods.
  docker-log-proxy:
    build:
      context: .
      dockerfile: infrastructure/observability/alloy/Dockerfile.docker-log-proxy
    labels:
      com.university-ecosystem.config-revision: "${DOCKER_CONFIG_REVISION:-unmanaged}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    # Run nonroot and join only the Docker socket group. Set DOCKER_SOCKET_GID
    # to the numeric GID from stat(/var/run/docker.sock); the default 0 covers
    # a root:root socket. Rootless and userns-remapped sockets are unsupported.
    # The socket bind remains read-only; do not grant Linux capabilities.
    user: "65532:65532"
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks:
      - alloy_docker_api
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official image's /var/lib/alloy parent is owned by alloy:alloy with
    # mode 0770. Root needs this single capability to traverse into the mounted
    # state volume; all other Linux capabilities remain dropped.
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - internal
      - public
      - alloy_docker_api
    depends_on:
      docker-log-proxy:
        condition: service_started
      loki-healthprobe:
        condition: service_healthy
    restart: unless-stopped

  # Pyroscope - Continuous profiling
  pyroscope:
    image: grafana/pyroscope:2.3.1@sha256:86a9ee7448487409ead8ada78789de7b78b739711b92b5d7224a1a54abf3eeb2
    command: ["-architecture.storage=v1", "-write-path=ingester", "-pyroscopedb.data-path=/data"]
    # Replace the base localhost binding instead of publishing it twice.
    ports: !override
      - "127.0.0.1:4040:4040"
    volumes:
      - pyroscope-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    networks:
      - internal
      - public
    restart: unless-stopped

  # Grafana - Unified dashboards
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required - run start-docker.ps1}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_DATABASE_WAL: "true"
      GF_DATABASE_QUERY_RETRIES: "10"
      GF_DATABASE_TRANSACTION_RETRIES: "10"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor tempoSearch tempoBackendSearch"
    volumes:
      - ./infrastructure/observability/grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/university-ecosystem.yaml:ro
      - grafana-data:/var/lib/grafana
    networks:
      - internal
      - public
    depends_on:
      tempo-healthprobe:
        condition: service_healthy
      loki-healthprobe:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      pyroscope:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    restart: unless-stopped

  # Prometheus - Metrics (extend existing if present)
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf '%s' "$$METRICS_BASIC_AUTH_PASSWORD" > /tmp/backend_metrics_password
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=15d \
          --web.enable-remote-write-receiver
    environment:
      METRICS_BASIC_AUTH_PASSWORD: ${METRICS_BASIC_AUTH_PASSWORD:?METRICS_BASIC_AUTH_PASSWORD is required - run start-docker.ps1}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks:
      - internal
      - public
    depends_on:
      backend:
        condition: service_healthy
      redis-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0@sha256:6ca518a72f30f7f576ef92963de1b91d3c3f5fd3aeac949f878bfda183587820
    environment:
      REDIS_ADDR: redis://valkey:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - cache_net
      - internal
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  pyroscope-data:
  grafana-data:
  prometheus-data:
  alloy-data:

networks:
  alloy_docker_api:
    internal: true
