[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "rust_ext"
license = "LicenseRef-University-Ecosystem-Proprietary"
license-files = [
  "LICENSE",
  "LICENSE-APACHE-LEGACY",
  "LICENSE-THIRD-PARTY",
  "LICENSE-THIRD-PARTY-SOURCES.md",
  "LICENSE-RUST-STD",
  "LICENSE-RUST-STD-COPYRIGHT.txt",
  "LICENSE-RUST-STD-SOURCES.md",
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
version = "0.1.0"
