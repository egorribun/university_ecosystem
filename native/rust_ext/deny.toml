# Shared cargo-deny license policy, stored with native/rust_ext.

[graph]
targets = []

[advisories]
db-path = "~/.cargo-deny-advisories"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Apache-2.0 WITH LLVM-exception",
    # The frontend sanitizer's ammonia/html5ever/cssparser graph uses MPL-2.0.
    # Keep its source/notice obligations when using this shared policy.
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
