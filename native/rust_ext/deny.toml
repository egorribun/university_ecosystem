# cargo-deny configuration for native/rust_ext

[graph]
targets = []

[advisories]
db-path = "~/.cargo-deny-advisories"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Apache-2.0 WITH LLVM-exception",
    # ammonia's html5ever/cssparser dependency chain is MPL-2.0 and is
    # distributed under a compatible, OSI-approved copyleft license.
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
