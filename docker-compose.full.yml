# University Ecosystem - Full Docker Compose
# Usage: pwsh scripts/dc.ps1 up -d

services:
  # ============================================================================
  # Core Application
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run start-docker.ps1}@postgres:5432/university"
      FRONTEND_ORIGIN: http://localhost:8081
      FRONTEND_ORIGINS: http://localhost:8081,http://localhost:8080
      # Wave 137 SW4: TrustedHostMiddleware allowlist. Default in dev is
      # "localhost,127.0.0.1,testserver" which rejects requests from inside
      # the docker network whose Host header is the docker-compose service-name
      # DNS (e.g. frontend SSR fetches backend:8000/.well-known/jwks.json with
      # Host: backend:8000 → 400 Bad Request). Adding `backend` so JWKS
      # endpoint reachable from frontend, gateway, ws-hub via service-DNS.
      # `gateway` added so Go gateway's reverse-proxy requests are accepted
      # (httputil.ReverseProxy forwards the incoming Host header unchanged).
      # NOTE: middleware reads ALLOWED_HOSTS (not TRUSTED_HOSTS) — see
      # app/core/middleware/setup.py:154 + cors_settings.py:25 + 154 (the
      # `trusted_hosts_list` property is a separate read-only computation,
      # `allowed_hosts_list` is what TrustedHostMiddleware consumes).
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,caddy,gateway,0.0.0.0,testserver"
      # Wave 137 SW4: dev-only — bump max sessions per user from 5 to 50 so
      # repeated smoke runs during diagnostic don't hit the per-user cap.
      # Production K8s should keep default (5) for credential-stuffing defense.
      MAX_SESSIONS_PER_USER: "50"
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}@redis:6379/0"
      REVOCATION_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}@revocation-redis:6379/0"
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}@redis:6379/1"
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: uploads
      MINIO_SECURE: "false"
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      SPOTIFY_SCOPES: ${SPOTIFY_SCOPES:-}
      AUTO_CREATE_SCHEMA: "false"
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD:?NATS_PASSWORD is required - run start-docker.ps1}@nats:4222"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      ELASTICSEARCH_USER: "elastic"
      ELASTICSEARCH_PASSWORD: "${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required - set in .env file}"
      SPICEDB_ENDPOINT: "spicedb:50051"
      SPICEDB_INSECURE: "true"
      FLAGD_HOST: "flagd"
      FLAGD_PORT: "8013"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      ENABLE_OTEL_LOGS: "false"
      ENABLE_OTEL_METRICS: "false"
      ENABLE_METRICS_ENDPOINT: "true"
      METRICS_BASIC_AUTH_USERNAME: "metrics_scraper"
      METRICS_BASIC_AUTH_PASSWORD: ${METRICS_BASIC_AUTH_PASSWORD:?METRICS_BASIC_AUTH_PASSWORD is required - run start-docker.ps1}
      METRICS_ALLOWLIST: ""
      EMBEDDED_OUTBOX_WORKER_ENABLED: "false"
    volumes:
      - static-data:/app/app/static
      # Wave 137 SW1: RS256 private key mount (read-only).
      # start-docker.ps1's New-JwtRs256Key generates ./.secrets/jwt_rs256.pem on host.
      # Backend reads it at startup via jwt_settings.py:202-205 when ALGORITHM=RS256.
      - ./.secrets:/app/.secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      revocation-redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      flagd-healthprobe:
        condition: service_healthy
    # LOW-W19: bind to loopback only — backend should only be reached via the gateway
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal
      - public
    # Wave 140 SW3-fix: override Dockerfile HEALTHCHECK (which uses /healthz Full
    # Check requiring ES/SpiceDB/Tempo all reachable) with /health/ready (Lean
    # readiness probe: just DB connectivity + not shutting down). Two reasons:
    #   1. file-processor depends_on backend: service_healthy (W140 SW3) must
    #      resolve reliably. `/healthz` returns 503 in dev compose when any of
    #      ES/SpiceDB/Tempo is slow to start (W139 (z) #4 backend lifespan
    #      blocker family), which prevents file-processor from ever starting
    #      even though backend's lifespan startup (including NATS broker
    #      connect + stream creation per W140 SW1) is fully complete.
    #   2. `/health/ready` matches the K8s readinessProbe pattern (production
    #      uses K8s readiness probes from manifest, not Docker HEALTHCHECK).
    # Python stdlib urllib (same as Dockerfile pattern) — no curl/wget needed.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # OpenFeature evaluation service. The source file is shared with the K8s
  # kustomization so local Docker and production evaluate identical flags.
  flagd:
    image: ghcr.io/open-feature/flagd:v0.16.1@sha256:9525b3c2916183810f93f0a72774c1dfad48d1ae22852c753719c46db80af5e7
    labels:
      com.university-ecosystem.config-revision: "${DOCKER_CONFIG_REVISION:-unmanaged}"
    command:
      - start
      - --uri
      - file:/etc/flagd/flags.json
      - --port
      - "8013"
      - --management-port
      - "8014"
    volumes:
      - ./k8s/flagd/flags.json:/etc/flagd/flags.json:ro
    expose:
      - "8013"
      - "8014"
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
    restart: unless-stopped

  # flagd is distroless and intentionally contains no shell or HTTP client.
  # Probe its official readiness endpoint from the same network namespace.
  flagd-healthprobe:
    image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    labels:
      com.university-ecosystem.config-revision: "${DOCKER_CONFIG_REVISION:-unmanaged}"
    network_mode: "service:flagd"
    depends_on:
      flagd:
        condition: service_started
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8014/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 32M
    restart: unless-stopped

  frontend:
    # Wave 132 SW1 — port + healthcheck aligned to W131 SW3 Node SSR runtime.
    # Pre-W131 nginx EXPOSE was 8080; W131 SW3 frontend.Dockerfile sets ENV
    # PORT=3000 + EXPOSE 3000 to match server-prod.mjs default. Compose port
    # mapping + healthcheck were W131 carry-overs not caught because Docker
    # stack runtime verification was deferred to W132 (W131 §Honesty #1+#2).
    build:
      context: .
      dockerfile: frontend.Dockerfile
      target: runtime
      args:
        # Build-time fallback for browser media/CSP helpers. Node SSR uses the
        # runtime BACKEND_ORIGIN below, so the image remains deployment-portable.
        VITE_BACKEND_ORIGIN: "http://backend:8000"
        # W153 SW1 — unminified bundle + linked source maps for /login wedge
        # diagnosis (W150-polish-followup caveat #14, W152 iter-5 honest defer).
        # KEEPS mode=production so JSX transform stays at production runtime
        # (jsx not jsxDEV) — SSR-compatible. Strip this line + rebuild to
        # return to production-minified output. NEVER set in production
        # compose / CI deploy configs (would expose source maps + ship
        # unminified bundle).
        #
        # W158 SW1 — wedge resolved via W156 SW3 hydrateRoot(document) + user
        # real-Chrome × 3 browsers verified rendering at W157 close. Diagnostic
        # flag now defaults OFF. Flip "" → "true" + rebuild if future
        # client-side stack-trace debug needs the unminified bundle + linked
        # source maps. Tree-shake invariants preserved per W157 SW1:
        # 0 react-dom-client.development refs in PROD; 0 jsxDEV in server.js.
        #
        # W169 SW1+SW4 — Path D text-content investigation (B-full scope).
        # SW1 enabled "true" + SW2 ran admin smoke with diagnostic bundle +
        # SW2 found 0 React #418 firings across all 10 captures (diagnostic
        # build did NOT reproduce W168 SW2 finding). Per W141 anti-pattern #1
        # STRICT 1-iter cap, SW3 was a NO-OP (no mismatch to fix). SW4 reverts
        # to "" + rebuilds for production-minified verification in SW5. Flag
        # defaults OFF in long-lived branches.
        # W180 polish-v2 (2026-05-21) — diagnostic build captured FULL unminified
        # React #418 error on data-only routes; root cause identified as W152 SW2
        # `import.meta.env.SSR ? null : <div>` legacy guard in router.ts
        # defaultPendingComponent (post-W156 SW3 hydrateRoot(document) the
        # hasRealSsrContent detection target no longer exists; guard became
        # active harm on data-only routes' Suspense fallback DOM divergence).
        # Fix applied in router.ts:102 + re-verified by the visual audit:
        # ALL 9 SSR routes now show 0 hydration errors under diagnostic build.
        # Flag flipped back to "" + rebuilt for production-minified verification.
        FRONTEND_BUILD_UNMINIFIED: ""
        # W156 SW1 Tier 1 #1 — opt-in development React for /login wedge
        # diagnosis (W155 NAMED React #418 + getParentHydrationBoundary
        # mechanisms but minified error args [text, ""] hide exact mismatch).
        # Aliases react-dom/client → development cjs bundle + scopes
        # NODE_ENV=development to client environment only (server stays
        # production → no W152 SW1 jsxDEV trap). NEVER set in production
        # compose / CI deploy configs (would ship dev React ~150 KB larger).
        #
        # W157 SW1 — wedge resolved via W156 SW3 hydrateRoot(document) fix;
        # diagnostic flag now defaults OFF. Flip to "true" + rebuild if
        # future hydration debugging needs the dev React bundle's full
        # error messages. Tree-shake invariant verified W157 SW1: PROD
        # bundle has 0 react-dom-client.development refs.
        #
        # W169 SW1+SW4 — Path D paired diagnostic flag. SW1 enabled "true" +
        # SW2 ran 10-capture admin smoke against dev React bundle; sidecars
        # contained 0 unminified "Hydration failed because" phrases (dev
        # React vendor bundle confirmed via grep to ship the phrase × 2
        # internally). Conclusion: W168 SW2 finding NOT reproducible with
        # diagnostic build → bundle-mode-dependent OR transient timing fluke.
        # SW4 reverts to "" + rebuilds production-minified for SW5 verify.
        #
        # W180 polish-v2 (2026-05-21) — diagnostic React dev mode captured the
        # exact element-type mismatch component stack pointing to defaultPendingComponent.
        # Fix applied in router.ts:102; diagnostic flag reverted to "" for PROD verification.
        FRONTEND_REACT_DEV_MODE: ""
    environment:
      # Runtime override makes the immutable SSR image portable across networks.
      BACKEND_ORIGIN: "http://backend:8000"
    ports:
      - "127.0.0.1:8081:3000"
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # /healthz is the W131 SW2 fast-path early-return (<10ms response,
      # bypasses SSR + JWT + theme/lang). Probes never run full SSR.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  notifications-worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    command: python -m app.workers.notifications
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run start-docker.ps1}@postgres:5432/university"
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}@redis:6379/0"
      REVOCATION_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}@revocation-redis:6379/0"
      AUTO_CREATE_SCHEMA: "false"
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD:?NATS_PASSWORD is required - run start-docker.ps1}@nats:4222"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      ENABLE_OTEL_LOGS: "false"
      ENABLE_OTEL_METRICS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      revocation-redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    # Override Dockerfile HEALTHCHECK — worker listens on :9101, not :8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  outbox-worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    command: python -m app.workers.outbox
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run start-docker.ps1}@postgres:5432/university"
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}@redis:6379/0"
      REVOCATION_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}@revocation-redis:6379/0"
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD:?NATS_PASSWORD is required - run start-docker.ps1}@nats:4222"
      AUTO_CREATE_SCHEMA: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      ENABLE_OTEL_LOGS: "false"
      ENABLE_OTEL_METRICS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      revocation-redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; pid=int(open('/tmp/worker.pid', encoding='ascii').read()); os.kill(pid,0); raise SystemExit(0 if time.time()-os.path.getmtime('/tmp/worker.heartbeat') < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  postgres:
    # TD-W10-07: Pinned to a specific minor version to prevent surprise upgrades.
    # Major version (pg17) floats within the same PostgreSQL release; to pin to a
    # patch update check https://hub.docker.com/r/pgvector/pgvector/tags
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    command: ["postgres", "-c", "max_connections=500", "-c", "track_commit_timestamp=on"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run start-docker.ps1}
      POSTGRES_DB: ${POSTGRES_DB:-university}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Wave 132 polish — multi-database init. Single postgres container
      # backs TWO logical databases: `university` (POSTGRES_DB env, auto-
      # created) + `spicedb` (created via init script). Init scripts run
      # ONLY on first postgres startup (empty data dir); re-trigger via
      # `docker compose down -v && up`.
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
    restart: unless-stopped

  # Idempotently create every auxiliary database before dependent services.
  # Unlike unconditional CREATE DATABASE calls, this keeps normal restarts free
  # of duplicate-database errors and also repairs pre-existing data volumes.
  postgres-databases-init:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:-postgres}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run start-docker.ps1}"
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - |
        for database in spicedb temporal temporal_visibility; do
          exists="$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$${database}'")"
          if [ "$${exists}" = "1" ]; then
            echo "[postgres-databases-init] $${database} already exists."
          else
            psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$${database}\""
            echo "[postgres-databases-init] Created $${database}."
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

  redis:
    # Switched from Redis 7.4 to Valkey 8 (Linux Foundation fork) — Redis 8.x
    # changed license to RSALv2/SSPL. Production compose already uses Valkey.
    # Python `redis` client is fully compatible (same RESP protocol).
    image: valkey/valkey:8.1-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    command:
      - "valkey-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "200mb"
      - "--maxmemory-policy"
      # RZ-21-02 (Wave 21): volatile-lru — only evict keys with TTL set.
      - "volatile-lru"
      - "--hz"
      - "20"
      # LOW-W19: require a password so unauthenticated access is blocked
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}"
    healthcheck:
      test: [ "CMD", "valkey-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  # Durable, non-evicting security state. Keeping revoked:jti tombstones out
  # of the volatile cache prevents token resurrection during memory pressure.
  revocation-redis:
    image: valkey/valkey:8.1-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    # The image entrypoint otherwise starts as root and calls setpriv. With all
    # capabilities dropped that UID transition is denied before Valkey starts.
    user: "999:1000"
    command:
      - "valkey-server"
      - "--save"
      - "60 1"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}
    volumes:
      - revocation-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$REDIS_PASSWORD --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 320M
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0@sha256:2c8c55c63ce4d915389f03d337b8acef56aaaca9fab8728291287e612d4d6398
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    restart: unless-stopped

  # ── S3-compatible object storage (MinIO) ──────────────────────────────────
  minio:
    # NOTE: minio/minio repo archived Feb 2026. This is the last published tag.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - run start-docker.ps1}
      # Local-only internal scrape endpoint. The console remains bound to
      # 127.0.0.1 and production uses its own authenticated monitoring policy.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - internal
      # An internal-only Docker network deliberately disables host port
      # publishing. Keep the console loopback-only, but attach a non-internal
      # bridge so Docker can materialize 127.0.0.1:9001.
      - public
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:9001:9001"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb local/uploads --ignore-existing
    environment:
      # mc defaults to /root/.mc. Keep its short-lived credential-bearing
      # config on a private tmpfs while leaving the image filesystem read-only.
      MC_CONFIG_DIR: /mc-config
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - run start-docker.ps1}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /mc-config:size=1m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M

  migrations:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    command: alembic upgrade head
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run start-docker.ps1}@postgres:5432/university"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: on-failure

  nats:
    image: nats:2.12.6-alpine@sha256:1cfc36e2e5e638243d8c722f72c954cd0ec4b15ee82fadbc718ce12e2b3c1652
    labels:
      com.university-ecosystem.config-revision: "${DOCKER_CONFIG_REVISION:-unmanaged}"
    # TD-09 (audit 2026-03-06): credentials via config file, not CLI args.
    # --user/--pass appear in `docker ps` output and /proc/<pid>/cmdline.
    # envsubst renders the template at startup; generated file lives in /tmp (not persisted).
    entrypoint:
      - "sh"
      - "-c"
      - |
        sed "s/\$$NATS_USER/$NATS_USER/g; s/\$$NATS_PASSWORD/$NATS_PASSWORD/g" /etc/nats/nats.conf.template > /tmp/nats.conf
        exec nats-server --config /tmp/nats.conf
    environment:
      - NATS_USER=${NATS_USER:?NATS_USER is required - set in .env file}
      - NATS_PASSWORD=${NATS_PASSWORD:?NATS_PASSWORD is required - set in .env file}
    # Ports not published: NATS is internal-only. Monitoring (8222) accessible via SSH tunnel.
    volumes:
      - ./config/nats.conf.template:/etc/nats/nats.conf.template:ro
      - nats-data:/data
    networks:
      - internal
    healthcheck:
      # Monitoring endpoint (8222) does not require credentials — safe for healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    labels:
      com.university-ecosystem.config-revision: "${DOCKER_CONFIG_REVISION:-unmanaged}"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      BACKEND_URL: http://backend:8000
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}@redis:6379/3"
      REVOCATION_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}@revocation-redis:6379/0"
      # JWT_SECRET kept for defense-in-depth: gateway falls back to HS256 if RS256
      # verify fails. Pre-W137 in-flight HS256 tokens decode via this until expiry.
      JWT_SECRET: ${SECRET_KEY:?SECRET_KEY is required - run start-docker.ps1}
      JWT_AUDIENCE: university-ecosystem-api
      # Wave 137 SW1: enable RS256 verification via JWKS hot-reload (MOD-W17-03).
      # Gateway polls backend's /.well-known/jwks.json every JWKS_REFRESH_INTERVAL
      # seconds; atomic public-key swap on rotation. ws-hub already uses JWKS_URL
      # default http://backend:8000/.well-known/jwks.json (no compose change needed).
      JWKS_ENDPOINT: http://backend:8000/.well-known/jwks.json
      JWKS_REFRESH_INTERVAL: "60"
      INTERNAL_HMAC_SECRET: "${INTERNAL_HMAC_SECRET:?INTERNAL_HMAC_SECRET is required - run start-docker.ps1}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      OTEL_SERVICE_NAME: "gateway"
      # AUDIT-INFRA-05: explicit opt-out for local dev — production K8s must NOT set this
      GRPC_USE_TLS: "false"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      revocation-redis:
        condition: service_healthy
      tempo-healthprobe:
        condition: service_healthy
    networks:
      - public
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    restart: unless-stopped

  ws-hub:
    build:
      context: .
      dockerfile: services/ws-hub/Dockerfile
    ports:
      - "127.0.0.1:8083:8081"
    environment:
      WS_HUB_PORT: "8081"
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD:?NATS_PASSWORD is required - run start-docker.ps1}@nats:4222"
      JWT_SECRET: ${SECRET_KEY:?SECRET_KEY is required - run start-docker.ps1}
      # AUDIT-INFRA-02: required — ws-hub fails to start if empty
      WS_HUB_INTERNAL_SECRET: ${WS_HUB_INTERNAL_SECRET:?WS_HUB_INTERNAL_SECRET is required - run start-docker.ps1}
      # Wave 173 polish-v1: ws-hub reads REDIS_URL + REDIS_PASSWORD per
      # `services/ws-hub/pkg/config/config.go:120-121` (defaults: addr
      # `redis:6379`, no password). Pre-W173-polish-v1, REDIS_PASSWORD
      # was missing from compose env → ws-hub connected to Redis without
      # auth → `NOAUTH Authentication required` startup error → fell back
      # to "L2 cache disabled" mode → handlers.go:195 `redisClient.GetDel`
      # for OTT validation returned error → ALL real tickets received 401
      # at WS upgrade. Closes the second half of the chat flow chain
      # (W173 SW1 Fix B closed /ws/ticket HTTP routing; this closes the
      # downstream WS upgrade ticket validation that depends on Redis).
      # Same-mechanism sub-fix per W138 Lesson #1 (ws-hub infra config
      # gaps from W131-era multi-service split).
      REDIS_URL: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}
      REDIS_DB: "0"
      REVOCATION_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run start-docker.ps1}@revocation-redis:6379/0"
      # Wave 173 polish-v3: ws-hub default ALLOWED_ORIGINS per
      # `services/ws-hub/pkg/config/config.go:103` = ["http://localhost:3000",
      # "http://localhost:5173"] (Vite dev server ports). Production-like
      # Docker setup accesses frontend via `http://localhost` (port 80, via
      # Caddy reverse proxy) — browser sends `Origin: http://localhost` (no
      # port). gorilla/websocket Upgrader CheckOrigin (handlers.go:40)
      # rejected mismatch → 403 Forbidden on WS upgrade. Closes the THIRD
      # ws-hub infra config gap from W131-era multi-service split arc.
      # Same-mechanism polish-v3 sub-fix per W138 Lesson #1. Includes all
      # common dev access patterns: `http://localhost` (Caddy port 80
      # canonical), `http://localhost:8081` (direct frontend Node SSR port
      # mapping per W132 SW1-fix), plus the legacy Vite dev defaults
      # `http://localhost:3000` (Vite dev) + `http://localhost:5173` (Vite
      # preview default) for parity with non-Docker dev workflows.
      ALLOWED_ORIGINS: "http://localhost,http://localhost:8081,http://localhost:3000,http://localhost:5173"
      # MOD-01 (audit 2026-03-15 Wave 7): Standard OTel env vars — SDK reads
      # these automatically so no hardcoded endpoint in telemetry.go code.
      # OTEL_EXPORTER_OTLP_INSECURE=true is correct for local dev (tempo has
      # no TLS); production pods omit this so TLS is enforced by default.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: "ws-hub"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      revocation-redis:
        condition: service_healthy
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    restart: unless-stopped

  file-processor:
    build:
      context: .
      dockerfile: services/file-processor/Dockerfile
    labels:
      com.university-ecosystem.config-revision: "${DOCKER_CONFIG_REVISION:-unmanaged}"
    environment:
      FP_NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD:?NATS_PASSWORD is required - run start-docker.ps1}@nats:4222"
      FP_MINIO_ENDPOINT: minio:9000
      FP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - set in .env file}
      FP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - set in .env file}
      FP_MINIO_BUCKET: uploads
      FP_RSA_PUBLIC_KEY_FILE: "/app/.secrets/jwt_rs256.pub.pem"
      FP_OTLP_ENDPOINT: "tempo:4317"
      FP_OTLP_INSECURE: "true"
      # Wave 144 SW2 Step 3 — Path (a-auth) full ACTIVATION.
      # W141 SW5 Go credentials chain (config.go TemporalAPIKeyFile field +
      # main.go connectTemporal reading token from this path then attaching
      # via `client.NewAPIKeyStaticCredentials(token)` + `ConnectionOptions.
      # TLSDisabled: true` for plaintext dev gRPC) was scaffolded but kept
      # disabled (empty env) through W141-W143 while temporal auth was
      # blocked by (z) #10 root cause investigation.
      #
      # W143 SW2 contract test DISPROVED crypto root cause (Temporal uses
      # go-jose/v4 + golang-jwt/jwt/v4 v4.5.2; encoding canonical; Python
      # end-to-end verify passes). W144 SW2 plain temporalio/server:1.30.2
      # + config.yaml JWT auth is the runtime verification step per W141
      # anti-pattern #2.
      #
      # Token at .secrets/temporal_api_key (W141 SW4 minted with kid='primary'
      # header) is mounted r/o via the volume below. If file-processor's
      # connectTemporal logs "Using Temporal credentials from file" + then
      # "Connected to Temporal addr=temporal:7233", W137 §Honesty #5 +
      # W140 NEW #6 CLOSE.
      FP_TEMPORAL_API_KEY_FILE: "/app/.secrets/temporal_api_key"
      FP_TEMPORAL_TLS_DISABLED: "true"
      FP_ENVIRONMENT: "${ENVIRONMENT:-development}"
    volumes:
      # Wave 141 SW4 scaffolding preserved: read-only mount of .secrets/
      # for the Temporal service token (and any future file-based credentials).
      # Mirrors backend pattern at line 61 (./.secrets:/app/.secrets:ro). Token
      # at .secrets/temporal_api_key is generated by start-docker.ps1's
      # New-TemporalServiceToken function (W141 SW4 scaffolding); W142+ will
      # activate the read via setting FP_TEMPORAL_API_KEY_FILE above.
      - ./.secrets:/app/.secrets:ro
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      # Wave 144 SW2: default namespace must be registered before file-processor
      # connects (Temporal SDK uses namespace="default" by default; if it
      # doesn't exist the client.Connect call fails with "namespace not found").
      temporal-namespace-init:
        condition: service_completed_successfully
      tempo-healthprobe:
        condition: service_healthy
      # Wave 140 SW3: backend MUST be healthy before file-processor starts.
      # Architectural contract per W140 Q2 (production parity):
      #   - Backend's NatsTaskBroker.connect() (called via app/core/lifespan.py
      #     Stage 5 _startup_background_workers → dishka_container.get(
      #     NatsTaskBroker)) creates both TASK_QUEUE and FILES_PROCESS streams
      #     (W140 SW1).
      #   - Backend's `/healthz` (Dockerfile HEALTHCHECK at backend.Dockerfile:97-98
      #     using Python stdlib urllib) only returns 200 after the lifespan
      #     startup completes (FastAPI doesn't accept HTTP traffic until lifespan
      #     finishes), so `service_healthy` means streams have been provisioned.
      #   - file-processor's NATS QueueSubscribe at main.go:214 then finds the
      #     stream and subscribes successfully (closes the chain W139 §Honesty #6).
      backend:
        condition: service_healthy
    networks:
      - internal
    # Wave 137 SW5: gRPC healthcheck via grpc_health_probe binary baked into
    # distroless runtime (services/file-processor/Dockerfile health-probe stage).
    # main.go:277-280 already registers grpc_health_v1.HealthCheckResponse_SERVING
    # for the FileProcessingService at :50051. Same pattern as authzed/spicedb.
    #
    # Wave 139 SW2 — Temporal connectivity restored (Path (a-rebind only)):
    # file-processor's Temporal::Connect() now succeeds in the startup retry
    # loop because the temporal entrypoint binds 0.0.0.0 (see temporal block
    # ~line 539). Verified empirically via `docker logs file-processor`:
    # `INFO Connected to Temporal addr=temporal:7233`.
    #
    # § Honesty pre-existing dev-stack gaps unmasked by W139 SW2:
    # The rebind closes the FIRST blocker in startup sequence; two pre-existing
    # blockers (always there, just masked by the Temporal blocker firing earlier)
    # are now visible:
    #   1. NATS subscribe failure: `Failed to subscribe to NATS queue —
    #      nats: no stream matches subject`. NATS stream `files.process` is
    #      not provisioned in dev compose. (Backend code likely creates
    #      streams on-demand at startup, but there's a race / missing init.)
    #   2. schema.graphql missing: `schema.graphql not found: open
    #      schema.graphql: no such file or directory`. The distroless runtime
    #      Dockerfile (services/file-processor/Dockerfile) does not COPY the
    #      GraphQL schema file into the final image.
    # Both cause file-processor's startup to abort BEFORE the gRPC server
    # binds → healthcheck (`grpc_health_probe -addr=:50051`) fails → Docker
    # restart loop. NOT regressions caused by W139 SW2 — pre-existing
    # gaps newly-visible per W138 Lesson #2 (empirical findings disprove plan
    # assumptions; the "5th unanticipated path" was that file-processor depends
    # on more than Temporal).
    #
    # W137 §Honesty #5 closure status post-W139 SW2:
    #   - Temporal connectivity blocker: CLOSED (verified)
    #   - NATS stream provisioning gap: NEW W139 §Honesty caveat — W140+ scope
    #   - schema.graphql Dockerfile gap: NEW W139 §Honesty caveat — W140+ scope
    #   - Path (a-auth) full token validation: deferred per Context7 finding
    #     (Temporal dev-server has no auth flag — needs image switch)
    #
    # Operational note: file-processor is currently `docker compose stop`'d
    # (W139 SW2 wave-end state) to halt the restart loop. Run
    # `docker compose -f docker-compose.full.yml start file-processor`
    # to restart it (will still crash-loop until W140+ closes NATS + schema
    # gaps; tail logs to confirm the unmasked errors).
    #
    # In PRODUCTION K8s the picture is unchanged — production deployments
    # use external/managed Temporal cluster with its own auth (mTLS / API
    # key), unaffected by this dev-compose-only change. Production NATS
    # streams are provisioned via separate K8s manifests + CD pipeline; the
    # schema.graphql Dockerfile gap may or may not affect production builds
    # (W140 audit will determine).
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.12@sha256:6711d4eff91dce95b900eb3c771c5298672ba00f6d20cab79551c4acc133f629
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=false  # single-node, internal network only
