# University Ecosystem - Full Docker Compose
# Usage: docker compose -f docker-compose.full.yml up -d

services:
  # ============================================================================
  # Core Application
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/university"
      FRONTEND_ORIGIN: http://localhost:8081
      FRONTEND_ORIGINS: http://localhost:8081,http://localhost:8080
      # Wave 137 SW4: TrustedHostMiddleware allowlist. Default in dev is
      # "localhost,127.0.0.1,testserver" which rejects requests from inside
      # the docker network whose Host header is the docker-compose service-name
      # DNS (e.g. frontend SSR fetches backend:8000/.well-known/jwks.json with
      # Host: backend:8000 → 400 Bad Request). Adding `backend` so JWKS
      # endpoint reachable from frontend, gateway, ws-hub via service-DNS.
      # NOTE: middleware reads ALLOWED_HOSTS (not TRUSTED_HOSTS) — see
      # app/core/middleware/setup.py:154 + cors_settings.py:25 + 154 (the
      # `trusted_hosts_list` property is a separate read-only computation,
      # `allowed_hosts_list` is what TrustedHostMiddleware consumes).
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,caddy,0.0.0.0,testserver"
      # Wave 137 SW4: dev-only — bump max sessions per user from 5 to 50 so
      # repeated smoke runs during diagnostic don't hit the per-user cap.
      # Production K8s should keep default (5) for credential-stuffing defense.
      MAX_SESSIONS_PER_USER: "50"
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: "redis://:${REDIS_PASSWORD:-DevRedisPass2024x}@redis:6379/0"
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: "redis://:${REDIS_PASSWORD:-DevRedisPass2024x}@redis:6379/1"
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: uploads
      MINIO_SECURE: "false"
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
      SPOTIFY_SCOPES: ${SPOTIFY_SCOPES}
      AUTO_CREATE_SCHEMA: "false"
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      ELASTICSEARCH_USER: "elastic"
      ELASTICSEARCH_PASSWORD: "${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required - set in .env file}"
      SPICEDB_ENDPOINT: "spicedb:50051"
      SPICEDB_INSECURE: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      ENABLE_OTEL_LOGS: "false"
      ENABLE_OTEL_METRICS: "false"
    volumes:
      - static-data:/app/app/static
      # Wave 137 SW1: RS256 private key mount (read-only).
      # start-docker.ps1's New-JwtRs256Key generates ./.secrets/jwt_rs256.pem on host.
      # Backend reads it at startup via jwt_settings.py:202-205 when ALGORITHM=RS256.
      - ./.secrets:/app/.secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    # LOW-W19: bind to loopback only — backend should only be reached via the gateway
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal
      - public
    # Wave 140 SW3-fix: override Dockerfile HEALTHCHECK (which uses /healthz Full
    # Check requiring ES/SpiceDB/Tempo all reachable) with /health/ready (Lean
    # readiness probe: just DB connectivity + not shutting down). Two reasons:
    #   1. file-processor depends_on backend: service_healthy (W140 SW3) must
    #      resolve reliably. `/healthz` returns 503 in dev compose when any of
    #      ES/SpiceDB/Tempo is slow to start (W139 (z) #4 backend lifespan
    #      blocker family), which prevents file-processor from ever starting
    #      even though backend's lifespan startup (including NATS broker
    #      connect + stream creation per W140 SW1) is fully complete.
    #   2. `/health/ready` matches the K8s readinessProbe pattern (production
    #      uses K8s readiness probes from manifest, not Docker HEALTHCHECK).
    # Python stdlib urllib (same as Dockerfile pattern) — no curl/wget needed.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    # Wave 132 SW1 — port + healthcheck aligned to W131 SW3 Node SSR runtime.
    # Pre-W131 nginx EXPOSE was 8080; W131 SW3 frontend.Dockerfile sets ENV
    # PORT=3000 + EXPOSE 3000 to match server-prod.mjs default. Compose port
    # mapping + healthcheck were W131 carry-overs not caught because Docker
    # stack runtime verification was deferred to W132 (W131 §Honesty #1+#2).
    build:
      context: .
      dockerfile: frontend.Dockerfile
      target: runtime
      args:
        # Wave 137 SW3: bake docker-internal backend service-name DNS at build time.
        # ssrAuth.ts:79 reads import.meta.env.VITE_BACKEND_ORIGIN as a Rolldown
        # build-time literal substitution (NOT runtime env lookup), so setting
        # this in compose runtime env DOES NOT WORK. Must be a Docker build ARG.
        # Pre-W137 the empty string fell back to ssrAuth.ts default localhost:8000
        # which is unreachable from inside the frontend container → JWKS fetch
        # failed silently → SSR returned UNAUTH → redirect to /login.
        # Production CI overrides via deploy-time arg pointing at real backend
        # hostname (e.g. https://api.example.com); compose value is dev-only.
        VITE_BACKEND_ORIGIN: "http://backend:8000"
    ports:
      - "8081:3000"
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # /healthz is the W131 SW2 fast-path early-return (<10ms response,
      # bypasses SSR + JWT + theme/lang). Probes never run full SSR.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  notifications-worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    command: python -m app.workers.notifications
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/university"
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: "redis://:${REDIS_PASSWORD:-DevRedisPass2024x}@redis:6379/0"
      AUTO_CREATE_SCHEMA: "false"
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      ENABLE_OTEL_LOGS: "false"
      ENABLE_OTEL_METRICS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    # Override Dockerfile HEALTHCHECK — worker listens on :9101, not :8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  postgres:
    # TD-W10-07: Pinned to a specific minor version to prevent surprise upgrades.
    # Major version (pg17) floats within the same PostgreSQL release; to pin to a
    # patch update check https://hub.docker.com/r/pgvector/pgvector/tags
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-university}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Wave 132 polish — multi-database init. Single postgres container
      # backs TWO logical databases: `university` (POSTGRES_DB env, auto-
      # created) + `spicedb` (created via init script). Init scripts run
      # ONLY on first postgres startup (empty data dir); re-trigger via
      # `docker compose down -v && up`.
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
    restart: unless-stopped

  redis:
    # Switched from Redis 7.4 to Valkey 8 (Linux Foundation fork) — Redis 8.x
    # changed license to RSALv2/SSPL. Production compose already uses Valkey.
    # Python `redis` client is fully compatible (same RESP protocol).
    image: valkey/valkey:8.1-alpine
    command:
      - "valkey-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "200mb"
      - "--maxmemory-policy"
      # RZ-21-02 (Wave 21): volatile-lru — only evict keys with TTL set.
      - "volatile-lru"
      - "--hz"
      - "20"
      # LOW-W19: require a password so unauthenticated access is blocked
      - "--requirepass"
      - "${REDIS_PASSWORD:-DevRedisPass2024x}"
    healthcheck:
      test: [ "CMD", "valkey-cli", "-a", "${REDIS_PASSWORD:-DevRedisPass2024x}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  # ── S3-compatible object storage (MinIO) ──────────────────────────────────
  minio:
    # NOTE: minio/minio repo archived Feb 2026. This is the last published tag.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:9001:9001"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    command: alembic upgrade head
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/university"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: on-failure

  nats:
    image: nats:2.12.6-alpine
    # TD-09 (audit 2026-03-06): credentials via config file, not CLI args.
    # --user/--pass appear in `docker ps` output and /proc/<pid>/cmdline.
    # envsubst renders the template at startup; generated file lives in /tmp (not persisted).
    entrypoint:
      - "sh"
      - "-c"
      - |
        sed "s/\$$NATS_USER/$NATS_USER/g; s/\$$NATS_PASSWORD/$NATS_PASSWORD/g" /etc/nats/nats.conf.template > /tmp/nats.conf
        exec nats-server --config /tmp/nats.conf
    environment:
      - NATS_USER=${NATS_USER:?NATS_USER is required - set in .env file}
      - NATS_PASSWORD=${NATS_PASSWORD:?NATS_PASSWORD is required - set in .env file}
    # Ports not published: NATS is internal-only. Monitoring (8222) accessible via SSH tunnel.
    volumes:
      - ./config/nats.conf.template:/etc/nats/nats.conf.template:ro
      - nats-data:/data
    networks:
      - internal
    healthcheck:
      # Monitoring endpoint (8222) does not require credentials — safe for healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      BACKEND_URL: http://backend:8000
      REDIS_URL: "redis://:${REDIS_PASSWORD:-DevRedisPass2024x}@redis:6379/3"
      # JWT_SECRET kept for defense-in-depth: gateway falls back to HS256 if RS256
      # verify fails. Pre-W137 in-flight HS256 tokens decode via this until expiry.
      JWT_SECRET: ${SECRET_KEY}
      # Wave 137 SW1: enable RS256 verification via JWKS hot-reload (MOD-W17-03).
      # Gateway polls backend's /.well-known/jwks.json every JWKS_REFRESH_INTERVAL
      # seconds; atomic public-key swap on rotation. ws-hub already uses JWKS_URL
      # default http://backend:8000/.well-known/jwks.json (no compose change needed).
      JWKS_ENDPOINT: http://backend:8000/.well-known/jwks.json
      JWKS_REFRESH_INTERVAL: "60"
      # AUDIT-INFRA-05: explicit opt-out for local dev — production K8s must NOT set this
      GRPC_USE_TLS: "false"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - public
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    restart: unless-stopped

  ws-hub:
    build:
      context: .
      dockerfile: services/ws-hub/Dockerfile
    ports:
      - "8083:8081"
    environment:
      WS_HUB_PORT: "8081"
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
      JWT_SECRET: ${SECRET_KEY}
      # AUDIT-INFRA-02: required — ws-hub fails to start if empty
      WS_HUB_INTERNAL_SECRET: ${WS_HUB_INTERNAL_SECRET}
      # MOD-01 (audit 2026-03-15 Wave 7): Standard OTel env vars — SDK reads
      # these automatically so no hardcoded endpoint in telemetry.go code.
      # OTEL_EXPORTER_OTLP_INSECURE=true is correct for local dev (tempo has
      # no TLS); production pods omit this so TLS is enforced by default.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: "ws-hub"
    depends_on:
      - nats
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    restart: unless-stopped

  file-processor:
    build:
      context: .
      dockerfile: services/file-processor/Dockerfile
    environment:
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - set in .env file}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - set in .env file}
      MINIO_BUCKET: uploads
      # Wave 141 SW4 -> SW5 partial defer: env var unset (empty string) so
      # file-processor's Go connectTemporal logs "No FP_TEMPORAL_API_KEY_FILE
      # set; connecting to Temporal without auth" + skips the credentials
      # attachment. Temporal runs in no-auth mode (W139 SW2 baseline; admin
      # -tools start-dev) so this works. W142+ Path (a-auth) full will set
      # this env to /app/.secrets/temporal_api_key (which the volume mount
      # below already provides).
      FP_TEMPORAL_API_KEY_FILE: ""
    volumes:
      # Wave 141 SW4 scaffolding preserved: read-only mount of .secrets/
      # for the Temporal service token (and any future file-based credentials).
      # Mirrors backend pattern at line 61 (./.secrets:/app/.secrets:ro). Token
      # at .secrets/temporal_api_key is generated by start-docker.ps1's
      # New-TemporalServiceToken function (W141 SW4 scaffolding); W142+ will
      # activate the read via setting FP_TEMPORAL_API_KEY_FILE above.
      - ./.secrets:/app/.secrets:ro
    depends_on:
      nats:
        condition: service_started
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
      # Wave 140 SW3: backend MUST be healthy before file-processor starts.
      # Architectural contract per W140 Q2 (production parity):
      #   - Backend's NatsTaskBroker.connect() (called via app/core/lifespan.py
      #     Stage 5 _startup_background_workers → dishka_container.get(
      #     NatsTaskBroker)) creates both TASK_QUEUE and FILES_PROCESS streams
      #     (W140 SW1).
      #   - Backend's `/healthz` (Dockerfile HEALTHCHECK at backend.Dockerfile:97-98
      #     using Python stdlib urllib) only returns 200 after the lifespan
      #     startup completes (FastAPI doesn't accept HTTP traffic until lifespan
      #     finishes), so `service_healthy` means streams have been provisioned.
      #   - file-processor's NATS QueueSubscribe at main.go:214 then finds the
      #     stream and subscribes successfully (closes the chain W139 §Honesty #6).
      backend:
        condition: service_healthy
    networks:
      - internal
    # Wave 137 SW5: gRPC healthcheck via grpc_health_probe binary baked into
    # distroless runtime (services/file-processor/Dockerfile health-probe stage).
    # main.go:277-280 already registers grpc_health_v1.HealthCheckResponse_SERVING
    # for the FileProcessingService at :50051. Same pattern as authzed/spicedb.
    #
    # Wave 139 SW2 — Temporal connectivity restored (Path (a-rebind only)):
    # file-processor's Temporal::Connect() now succeeds in the startup retry
    # loop because the temporal entrypoint binds 0.0.0.0 (see temporal block
    # ~line 539). Verified empirically via `docker logs file-processor`:
    # `INFO Connected to Temporal addr=temporal:7233`.
    #
    # § Honesty pre-existing dev-stack gaps unmasked by W139 SW2:
    # The rebind closes the FIRST blocker in startup sequence; two pre-existing
    # blockers (always there, just masked by the Temporal blocker firing earlier)
    # are now visible:
    #   1. NATS subscribe failure: `Failed to subscribe to NATS queue —
    #      nats: no stream matches subject`. NATS stream `files.process` is
    #      not provisioned in dev compose. (Backend code likely creates
    #      streams on-demand at startup, but there's a race / missing init.)
    #   2. schema.graphql missing: `schema.graphql not found: open
    #      schema.graphql: no such file or directory`. The distroless runtime
    #      Dockerfile (services/file-processor/Dockerfile) does not COPY the
    #      GraphQL schema file into the final image.
    # Both cause file-processor's startup to abort BEFORE the gRPC server
    # binds → healthcheck (`grpc_health_probe -addr=:50051`) fails → Docker
    # restart loop. NOT regressions caused by W139 SW2 — pre-existing
    # gaps newly-visible per W138 Lesson #2 (empirical findings disprove plan
    # assumptions; the "5th unanticipated path" was that file-processor depends
    # on more than Temporal).
    #
    # W137 §Honesty #5 closure status post-W139 SW2:
    #   - Temporal connectivity blocker: CLOSED (verified)
    #   - NATS stream provisioning gap: NEW W139 §Honesty caveat — W140+ scope
    #   - schema.graphql Dockerfile gap: NEW W139 §Honesty caveat — W140+ scope
    #   - Path (a-auth) full token validation: deferred per Context7 finding
    #     (Temporal dev-server has no auth flag — needs image switch)
    #
    # Operational note: file-processor is currently `docker compose stop`'d
    # (W139 SW2 wave-end state) to halt the restart loop. Run
    # `docker compose -f docker-compose.full.yml start file-processor`
    # to restart it (will still crash-loop until W140+ closes NATS + schema
    # gaps; tail logs to confirm the unmasked errors).
    #
    # In PRODUCTION K8s the picture is unchanged — production deployments
    # use external/managed Temporal cluster with its own auth (mTLS / API
    # key), unaffected by this dev-compose-only change. Production NATS
    # streams are provisioned via separate K8s manifests + CD pipeline; the
    # schema.graphql Dockerfile gap may or may not affect production builds
    # (W140 audit will determine).
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.12
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=false  # single-node, internal network only
      - "ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required - set in .env file}"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    # Port not published: ES is internal-only. Access via SSH tunnel if needed.
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped

  spicedb:
    # P1-06 (audit 2026-03-06): Fixed hardcoded "dev-key" + memory datastore.
    # memory datastore → ACLs lost on restart; "dev-key" → brute-forceable.
    # Now uses env var (invisible to `docker ps`) and PostgreSQL for persistence.
    image: authzed/spicedb:v1.51.0
    command: >-
      serve
      --datastore-engine postgres
      --datastore-conn-uri "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/spicedb?sslmode=disable"
    # Internal only - accessed by backend services; no host port exposure
    expose:
      - "50051"
    environment:
      # P1-10: Key is in env var — invisible to `docker ps --no-trunc` / docker inspect env.
      SPICEDB_GRPC_PRESHARED_KEY: "${SPICEDB_PRESHARED_KEY:?SPICEDB_PRESHARED_KEY is required - set in .env file}"
      # Dev-only: skip TLS on gRPC — production K8s must NOT set this
      SPICEDB_GRPC_NO_TLS: "true"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  temporal:
    # Wave 141 SW3-SW5 partial defer (per SW5 verification, 2026-05-11):
    # Attempted full Path (a-auth) via `temporalio/auto-setup:1.29.6.1`
    # rolled back to `temporalio/admin-tools:1.30.2` start-dev (W139 SW2
    # baseline) after RUNTIME verification surfaced 5+ (z) discoveries:
    #
    #   (z) #1: temporalio/auto-setup:1.30.2 doesn't exist — auto-setup tags
    #     lag Temporal Server releases (latest = 1.29.6.1 vs admin-tools
    #     1.30.2). Acceptable downgrade in API minor version.
    #   (z) #2: USE_INTERNAL_FRONTEND=true required to prevent internal
    #     worker "Request unauthorized" against own auth-gated frontend.
    #   (z) #3: auto-setup script's default namespace registration uses
    #     temporal CLI -> public frontend (auth-gated) -> rejected with
    #     "Request unauthorized" -> namespace never created -> temporal
    #     never reaches healthy state.
    #   (z) #4: worker's internal SDK client "context deadline exceeded"
    #     post USE_INTERNAL_FRONTEND -> publicClient YAML field is omitted
    #     by config_template.yaml conditional, but worker still tries to
    #     reach some default address that's unreachable.
    #   (z) #5: Path (a-auth) full closure requires more than env vars:
    #     either custom pre-bootstrap (run auto-setup WITHOUT auth, then
    #     switch config to enable auth), OR plain temporalio/server +
    #     manual namespace registration via authenticated temporal CLI,
    #     OR an auth-bypass during init.
    #
    # Per feedback_perfectionism.md "structural deferrals acceptable" +
    # W141 anti-pattern #4 ("don't claim closure pre-impl") -- the
    # structural complexity is W142+ scope (revised estimate ~10-15h,
    # NOT the originally planned 3-5h).
    #
    # SW3-SW5 commit scaffolding preserved in codebase:
    #   - PowerShell New-TemporalServiceToken function (start-docker.ps1):
    #     mints RS256 JWT into .secrets/temporal_api_key
    #   - file-processor Go credentials attach (config.go +
    #     cmd/file-processor/main.go connectTemporal): reads
    #     FP_TEMPORAL_API_KEY_FILE, attaches via
    #     client.NewAPIKeyStaticCredentials + ConnectionOptions.TLSDisabled
    #   - .secrets/ volume mount on file-processor (kept harmless against
    #     no-auth temporal - file-processor's Go code logs
    #     "No FP_TEMPORAL_API_KEY_FILE set" when env is empty)
    #
    # W137 §Honesty #5 + W140 NEW #6 stay open as W142+ structural caveats.
    # W139 SW2 0.0.0.0 rebind preserved (file-processor reaches Temporal via
    # service-name DNS temporal:7233 from internal network).
    image: temporalio/admin-tools:1.30.2
    container_name: temporal
    ports:
      - "127.0.0.1:7233:7233"  # gRPC: localhost only; access via SSH tunnel
      # UI port (8233) not published: use SSH tunnel or internal access only
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    entrypoint: [ "/bin/sh", "-c", "temporal server start-dev --ip 0.0.0.0 --ui-port 8233 --db-filename /tmp/temporal.db" ]
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
    restart: unless-stopped

  imgproxy:
    image: darthsim/imgproxy:v3.28.0
    ports:
      - "8082:8080"
    environment:
      # P1-09 (audit 2026-03-06): Restrict to known sources only — open allowlist
      # enables SSRF to AWS IMDS (169.254.169.254) or any internal host.
      IMGPROXY_ALLOWED_SOURCES: "http://backend:8000/static/"
      # SECURITY: NEVER enable in production — leaks internal paths and stacktraces
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: "false"
    networks:
      - internal
      - public
    # W136 SW7: imgproxy ships its own `imgproxy health` CLI subcommand
    # (v3.18+). The container is distroless except for the imgproxy binary,
    # so this is the only viable healthcheck path.
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.6
    ports:
      - "127.0.0.1:3000:3000"  # localhost only; access via SSH tunnel in production
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required - set in .env file}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - internal
    # W136 SW7: grafana base image (alpine) has wget. /api/health endpoint
    # returns JSON with database/version status; HTTP 200 = healthy.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0
    ports:
      # P1-07 (audit 2026-03-06): Bind to localhost — unauthenticated Prometheus
      # exposes latency histograms, queue depths, internal IPs.
      - "127.0.0.1:9090:9090"
    networks:
      - internal
    # W136 SW7: prom/prometheus base image is busybox-based with wget.
    # /-/healthy returns 200 OK when ready to serve queries.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.3
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    networks:
      - internal
    # W136 SW7 → W137 SW6: tempo's distroless image lacks any HTTP client to
    # probe its own /ready endpoint on :3200. Sidecar pattern (tempo-healthprobe
    # below) does the probing via shared network namespace. By-design caveat:
    # sidecar healthcheck reflects PROBE health, NOT tempo container health
    # directly — for compose `depends_on: service_healthy` semantics, the
    # sidecar's healthy state is what downstream sees. Acceptable for dev;
    # production K8s should use upstream's /ready via livenessProbe HTTP check.
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  # W137 SW6: distroless healthcheck via curl sidecar pattern.
  # network_mode: service:tempo shares the network namespace (probes
  # localhost:3200/ready directly). curl base image is ~5MB so overhead is
  # small. Sidecar keeps running via `sleep infinity` so its healthcheck
  # has a stable container to attach to.
  tempo-healthprobe:
    image: curlimages/curl:8.10.1
    network_mode: "service:tempo"
    depends_on:
      - tempo
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infrastructure/observability/loki.yaml:/etc/loki/loki.yaml:ro
    networks:
      - internal
    # W136 SW7 → W137 SW6: same sidecar pattern as tempo — see loki-healthprobe.
    # /ready endpoint on :3100 probed via curlimages/curl through shared
    # network_mode. Same by-design caveat about sidecar-vs-container health.
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  loki-healthprobe:
    image: curlimages/curl:8.10.1
    network_mode: "service:loki"
    depends_on:
      - loki
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_started
      ws-hub:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

networks:
  public:
  internal:
    internal: true

volumes:
  postgres-data:
  static-data:
  minio-data:
  nats-data:
  elasticsearch-data:

