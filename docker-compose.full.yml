# University Ecosystem - Full Docker Compose
# Usage: docker compose -f docker-compose.full.yml up -d

services:
  # ============================================================================
  # Core Application
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/university"
      FRONTEND_ORIGIN: http://localhost:8081
      FRONTEND_ORIGINS: http://localhost:8081,http://localhost:8080
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_BACKEND: redis
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      MINIO_ENDPOINT: garage:3900
      MINIO_BUCKET: uploads
      MINIO_SECURE: "false"
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
      SPOTIFY_SCOPES: ${SPOTIFY_SCOPES}
      AUTO_CREATE_SCHEMA: "false"
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      ELASTICSEARCH_USER: "elastic"
      ELASTICSEARCH_PASSWORD: "${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required - set in .env file}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      ENABLE_OTEL_LOGS: "false"
      ENABLE_OTEL_METRICS: "false"
    volumes:
      - static-data:/app/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    # LOW-W19: bind to loopback only — backend should only be reached via the gateway
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      target: runtime
      args:
        VITE_BACKEND_ORIGIN: ""
    ports:
      - "8081:8080"
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  notifications-worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    command: python -m app.workers.notifications
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/university"
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_SCHEMA: "false"
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      ENABLE_OTEL_LOGS: "false"
      ENABLE_OTEL_METRICS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  postgres:
    # TD-W10-07: Pinned to a specific minor version to prevent surprise upgrades.
    # Major version (pg17) floats within the same PostgreSQL release; to pin to a
    # patch update check https://hub.docker.com/r/pgvector/pgvector/tags
    image: pgvector/pgvector:pg17.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-university}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "200mb"
      - "--maxmemory-policy"
      # RZ-21-02 (Wave 21): volatile-lru — only evict keys with TTL set.
      - "volatile-lru"
      - "--hz"
      - "20"
      # LOW-W19: require a password so unauthenticated access is blocked
      - "--requirepass"
      - "${REDIS_PASSWORD:-DevRedisPass2024!}"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  # ── Garage S3-compatible object storage ─────────────────────────────────────
  # MOD-W8-01 (audit 2026-03-15): MinIO was archived on 2026-02-13 and no longer
  # receives security patches.  Garage (https://garagehq.deuxfleurs.fr) is a
  # Rust-based, S3-compatible replacement with active development.
  #
  # S3 API:   garage:3900  (internal; same interface, just a different port)
  # Admin API: garage:3903  (internal; used only by the garage-init container)
  # RPC:      garage:3901  (internal; cluster coordination)
  #
  # Backward-compat: MINIO_ROOT_USER / MINIO_ROOT_PASSWORD continue to serve as
  # the S3 access-key ID / secret — no changes needed in backend or file-processor.
  garage:
    image: ghcr.io/deuxfleurs/garage:v1.0.1
    command: server
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    environment:
      # 32-byte hex RPC secret — generate with: openssl rand -hex 32
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required (openssl rand -hex 32)}
      # Admin API bearer token — generate with: openssl rand -base64 32
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required (openssl rand -base64 32)}
    # S3 (3900), admin (3903), and RPC (3901) are all internal-only.
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3903/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  # One-shot init container: creates the layout, access key, and bucket.
  # Runs after garage is healthy; exits 0 on success.  Restarts are safe
  # because every garage command is idempotent (|| true guards).
  garage-init:
    image: ghcr.io/deuxfleurs/garage:v1.0.1
    entrypoint: ["/bin/sh", "/scripts/garage-init.sh"]
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - ./scripts/garage-init.sh:/scripts/garage-init.sh:ro
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - set in .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - set in .env file}
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    restart: on-failure

  migrations:
    build:
      context: .
      dockerfile: backend.Dockerfile
      target: runtime
    command: alembic upgrade head
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/university"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: on-failure

  rust-optimizer:
    build:
      context: .
      dockerfile: services/rust-optimizer/Dockerfile
    # RZ-W10-09: Removed public port exposure and public network membership.
    # rust-optimizer must only be reachable via the internal network through
    # the API gateway, which enforces authentication. Exposing it publicly
    # allowed unauthenticated access to image processing and file write APIs.
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped

  nats:
    image: nats:2.10.25-alpine
    # TD-09 (audit 2026-03-06): credentials via config file, not CLI args.
    # --user/--pass appear in `docker ps` output and /proc/<pid>/cmdline.
    # envsubst renders the template at startup; generated file lives in /tmp (not persisted).
    entrypoint:
      - "sh"
      - "-c"
      - "envsubst < /etc/nats/nats.conf.template > /tmp/nats.conf && exec nats-server --config /tmp/nats.conf"
    environment:
      - NATS_USER=${NATS_USER:?NATS_USER is required - set in .env file}
      - NATS_PASSWORD=${NATS_PASSWORD:?NATS_PASSWORD is required - set in .env file}
    # Ports not published: NATS is internal-only. Monitoring (8222) accessible via SSH tunnel.
    volumes:
      - ./config/nats.conf.template:/etc/nats/nats.conf.template:ro
      - nats-data:/data
    networks:
      - internal
    healthcheck:
      # Monitoring endpoint (8222) does not require credentials — safe for healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/3
      JWT_SECRET: ${SECRET_KEY}
      # AUDIT-INFRA-05: explicit opt-out for local dev — production K8s must NOT set this
      GRPC_USE_TLS: "false"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - public
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    restart: unless-stopped

  ws-hub:
    build:
      context: .
      dockerfile: services/ws-hub/Dockerfile
    ports:
      - "8083:8081"
    environment:
      WS_HUB_PORT: "8081"
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
      JWT_SECRET: ${SECRET_KEY}
      # AUDIT-INFRA-02: required — ws-hub fails to start if empty
      WS_HUB_INTERNAL_SECRET: ${WS_HUB_INTERNAL_SECRET}
      # MOD-01 (audit 2026-03-15 Wave 7): Standard OTel env vars — SDK reads
      # these automatically so no hardcoded endpoint in telemetry.go code.
      # OTEL_EXPORTER_OTLP_INSECURE=true is correct for local dev (tempo has
      # no TLS); production pods omit this so TLS is enforced by default.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: "ws-hub"
    depends_on:
      - nats
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    restart: unless-stopped

  file-processor:
    build:
      context: .
      dockerfile: services/file-processor/Dockerfile
    environment:
      NATS_URL: "nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
      MINIO_ENDPOINT: garage:3900
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required - set in .env file}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required - set in .env file}
      MINIO_BUCKET: uploads
    depends_on:
      nats:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=false  # single-node, internal network only
      - "ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required - set in .env file}"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    # Port not published: ES is internal-only. Access via SSH tunnel if needed.
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped

  spicedb:
    # P1-06 (audit 2026-03-06): Fixed hardcoded "dev-key" + memory datastore.
    # memory datastore → ACLs lost on restart; "dev-key" → brute-forceable.
    # Now uses env var (invisible to `docker ps`) and PostgreSQL for persistence.
    image: authzed/spicedb:v1.36.0
    command: >-
      serve
      --datastore-engine postgres
      --datastore-conn-uri "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/spicedb?sslmode=disable"
    # Internal only - accessed by backend services; no host port exposure
    expose:
      - "50051"
    environment:
      # P1-10: Key is in env var — invisible to `docker ps --no-trunc` / docker inspect env.
      SPICEDB_GRPC_PRESHARED_KEY: "${SPICEDB_PRESHARED_KEY:?SPICEDB_PRESHARED_KEY is required - set in .env file}"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  temporal:
    image: temporalio/admin-tools:1.26.2
    container_name: temporal
    ports:
      - "127.0.0.1:7233:7233"  # gRPC: localhost only; access via SSH tunnel
      # UI port (8233) not published: use SSH tunnel or internal access only
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    # P0-03 (audit 2026-03-06): Bind to 127.0.0.1 — Temporal dev-server has no auth.
    # Without this, ALL containers on the `internal` network can execute arbitrary
    # Workflows/Activities without authentication (full code execution vector).
    entrypoint: [ "/bin/bash", "-c", "temporal server start-dev --ip 127.0.0.1 --ui-port 8233 --db-filename /tmp/temporal.db" ]
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
    restart: unless-stopped

  imgproxy:
    image: darthsim/imgproxy:v3.15.0
    ports:
      - "8082:8080"
    environment:
      # P1-09 (audit 2026-03-06): Restrict to known sources only — open allowlist
      # enables SSRF to AWS IMDS (169.254.169.254) or any internal host.
      IMGPROXY_ALLOWED_SOURCES: "http://backend:8000/static/"
      # SECURITY: NEVER enable in production — leaks internal paths and stacktraces
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: "false"
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "127.0.0.1:3000:3000"  # localhost only; access via SSH tunnel in production
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required - set in .env file}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      # P1-07 (audit 2026-03-06): Bind to localhost — unauthenticated Prometheus
      # exposes latency histograms, queue depths, internal IPs.
      - "127.0.0.1:9090:9090"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infrastructure/observability/loki.yaml:/etc/loki/loki.yaml:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  caddy:
    image: caddy:2.9.1-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

networks:
  public:
  internal:
    internal: true

volumes:
  postgres-data:
  static-data:
  garage-meta:   # Garage cluster metadata (layout, keys, bucket registry)
  garage-data:   # Garage object data
  nats-data:
  elasticsearch-data:
  tempo-data:
  loki-data:
  grafana-data:
  prometheus-data:
  temporal-data:

