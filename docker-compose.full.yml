  spicedb-migrate:
    image: authzed/spicedb:v1.51.0@sha256:f2e6e77f89f8a0c087d9fd26b9ecd443ea601aa5422c92912f7ca95c412eb929
    command:
      - datastore
      - migrate
      - head
      - --skip-release-check=true
      - --datastore-engine
      - postgres
      - --datastore-conn-uri
