# Owned acceptance stand overlay (plan phase 5).
#
# Apply only through scripts/live_stand.py, which runs the launcher from a
# dedicated git worktree:
#
#   .\start-docker.ps1 -Build -ExtraCompose docker-compose.live.yml
#
# live_stand.py pins a unique, ownership-checked Compose project for each run,
# so volumes and networks never touch another stack. Generated keys and the
# ownership marker stay in this worktree's ignored .secrets directory.
# Every host publication is replaced by a distinct, signed per-run port from
# live_stand.py. All ports bind to loopback so the acceptance stack can coexist
# with the developer stack and is not exposed to the LAN. `!override` requires
# Docker Compose 2.24.4+ and prevents the full-stack ports from being appended.
services:
  frontend:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_FRONTEND:?set by scripts/live_stand.py}:3000"

  postgres:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_POSTGRES:?set by scripts/live_stand.py}:5432"

  gateway:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_GATEWAY:?set by scripts/live_stand.py}:8080"

  ws-hub:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_WS_HUB:?set by scripts/live_stand.py}:8081"
    environment:
      # Admit this stand's exact loopback origin without weakening WS origin checks.
      ALLOWED_ORIGINS: >-
        ${LIVE_BASE_URL:?set by scripts/live_stand.py},http://localhost,http://localhost:8081,http://localhost:3000,http://localhost:5173

  temporal:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_TEMPORAL_GRPC:?set by scripts/live_stand.py}:7233"
      - "127.0.0.1:${LIVE_HOST_PORT_TEMPORAL_WEB:?set by scripts/live_stand.py}:7243"

  imgproxy:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_IMGPROXY:?set by scripts/live_stand.py}:8080"

  grafana:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_GRAFANA:?set by scripts/live_stand.py}:3000"

  prometheus:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_PROMETHEUS:?set by scripts/live_stand.py}:9090"

  alloy:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_ALLOY:?set by scripts/live_stand.py}:12345"

  pyroscope:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_PYROSCOPE:?set by scripts/live_stand.py}:4040"

  caddy:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_CADDY_HTTP:?set by scripts/live_stand.py}:80"
      - "127.0.0.1:${LIVE_HOST_PORT_CADDY_HTTPS:?set by scripts/live_stand.py}:443"

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "false"
      MP_MAX_MESSAGES: "5000"
    networks:
      - internal
      - public
    ports: !override
      - "127.0.0.1:${LIVE_MAILPIT_PORT:?set by scripts/live_stand.py}:8025"
    read_only: true
    # Mailpit keeps its message database in /tmp.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    ports: !override
      - "127.0.0.1:${LIVE_HOST_PORT_BACKEND:?set by scripts/live_stand.py}:8000"
    environment: &live-delivery
      # Browser projects share one client IP; reserve enough room for the full
      # live suite. The 5/minute application default remains in effect outside
      # this owned acceptance-only overlay.
      RATE_LIMIT_AUTH_LOGIN: "60/minute"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      SMTP_STARTTLS: "false"
      MAIL_FROM: no-reply@university.test
      VAPID_PUBLIC_KEY: ${LIVE_VAPID_PUBLIC_KEY:?generated by scripts/live_stand.py}
      VAPID_PRIVATE_KEY: ${LIVE_VAPID_PRIVATE_KEY:?generated by scripts/live_stand.py}
      VAPID_SUBJECT: mailto:acceptance@university.test
      # The live stand backs application uploads with its project-scoped SeaweedFS S3 API.
      # Compose resolves credentials from the protected MINIO_ROOT_* env file; no
      # credential values are copied into this generated state overlay or logged.
      STORAGE_BACKEND: minio
      STORAGE_S3_BUCKET: uploads
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?required}"
      STORAGE_S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?required}"
      STORAGE_S3_ENDPOINT_URL: http://minio:9000
      STORAGE_S3_BASE_URL: "${LIVE_BASE_URL:?required}/storage/uploads"
  outbox-worker:
    environment: *live-delivery
  notifications-worker:
    environment: *live-delivery
