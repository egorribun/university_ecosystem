# Owned acceptance stand overlay (plan phase 5).
#
# Apply only through scripts/live_stand.py, which runs the launcher from a
# dedicated git worktree:
#
#   .\start-docker.ps1 -Build -ExtraCompose docker-compose.live.yml
#
# The worktree's directory name becomes the Compose project, so volumes,
# networks and generated secrets never touch the developer's own stack.
# Only Caddy (80/443, the origin the stack is configured for) and the Mailpit
# API stay published; every other host port is removed.
services:
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "false"
      MP_MAX_MESSAGES: "5000"
    networks:
      - internal
      - public
    ports:
      - "127.0.0.1:${LIVE_MAILPIT_PORT:-18025}:8025"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    environment: &live-delivery
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      SMTP_STARTTLS: "false"
      MAIL_FROM: no-reply@university.test
      VAPID_PUBLIC_KEY: ${LIVE_VAPID_PUBLIC_KEY:?generated by scripts/live_stand.py}
      VAPID_PRIVATE_KEY: ${LIVE_VAPID_PRIVATE_KEY:?generated by scripts/live_stand.py}
      VAPID_SUBJECT: mailto:acceptance@university.test
    ports: !reset []
  outbox-worker:
    environment: *live-delivery
  notifications-worker:
    environment: *live-delivery

  frontend:
    ports: !reset []
  postgres:
    ports: !reset []
  # Storage runs on SeaweedFS: MinIO no longer publishes its images, so the
  # base MinIO/mc services cannot start on a fresh machine. The stand starts
  # empty, so there is no data to migrate and no cutover attestation to make;
  # the volume is project-scoped and never the developer's cutover volume.
  minio:
    image: ghcr.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: !override ["mini", "-dir=/data", "-s3.port=9000"]
    environment: !override
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: uploads
    volumes: !override
      - live-seaweedfs-data:/data
    expose: !override
      - "9000"
    ports: !reset []
    healthcheck: !override
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/status"]
      interval: 10s
      timeout: 5s
      retries: 12
  minio-init:
    # SeaweedFS mini creates S3_BUCKET itself; only wait for its S3 API.
    image: ghcr.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    entrypoint: !override ["/bin/sh", "-ec"]
    command: !override ["wget -qO- http://minio:9000/status >/dev/null"]
    environment: !override {}
  gateway:
    ports: !reset []
  ws-hub:
    ports: !reset []
  temporal:
    ports: !reset []
  imgproxy:
    ports: !reset []
  grafana:
    ports: !reset []
  prometheus:
    ports: !reset []
  alloy:
    ports: !reset []
  pyroscope:
    ports: !reset []

volumes:
  live-seaweedfs-data: {}
