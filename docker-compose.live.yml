# Owned acceptance stand overlay (plan phase 5).
#
# Apply only through scripts/live_stand.py, which runs the launcher from a
# dedicated git worktree:
#
#   .\start-docker.ps1 -Build -ExtraCompose docker-compose.live.yml
#
# live_stand.py pins a unique, ownership-checked Compose project for each run,
# so volumes and networks never touch another stack. Generated keys and the
# ownership marker stay in this worktree's ignored .secrets directory.
# The stand keeps the base stack's host ports (Caddy on 80/443 is the origin
# the stack is configured for, the rest bind 127.0.0.1 and serve the
# launcher's readiness probes), so it cannot run alongside the local stack;
# live_stand.py refuses to start while 80/443 are taken.
services:
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "false"
      MP_MAX_MESSAGES: "5000"
    networks:
      - internal
      - public
    ports:
      - "127.0.0.1:${LIVE_MAILPIT_PORT:-18025}:8025"
    read_only: true
    # Mailpit keeps its message database in /tmp.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    environment: &live-delivery
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      SMTP_STARTTLS: "false"
      MAIL_FROM: no-reply@university.test
      VAPID_PUBLIC_KEY: ${LIVE_VAPID_PUBLIC_KEY:?generated by scripts/live_stand.py}
      VAPID_PRIVATE_KEY: ${LIVE_VAPID_PRIVATE_KEY:?generated by scripts/live_stand.py}
      VAPID_SUBJECT: mailto:acceptance@university.test
  outbox-worker:
    environment: *live-delivery
  notifications-worker:
    environment: *live-delivery
