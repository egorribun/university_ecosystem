[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# INFO level needed so that caplog captures audit_logger.info() calls.
# Without this the root logger's default WARNING level discards INFO records
# before they reach pytest's caplog handler, causing audit event assertions to fail.
log_level = INFO
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: marks tests that require live external services (Redis, Postgres) — skipped in CI by default
