applicationReleaseName: ""

redis:
  fullnameOverride: ""
  commonLabels:
    university-ecosystem.io/revocation-store-for: ""
    app.kubernetes.io/instance: ""
  auth:
    existingSecret: revocation-redis-credentials
    existingSecretPasswordKey: revocation-redis-password
  image:
    registry: docker.io
    repository: redis
    tag: 7.4.11-alpine
    digest: sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    pullPolicy: Always
  master:
    count: 1
    revisionHistoryLimit: 10
    terminationGracePeriodSeconds: 30
    updateStrategy:
      type: RollingUpdate
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: true
      size: 2Gi
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenScaled: Retain
      whenDeleted: Retain
    pdb:
      minAvailable: 1
    disableCommands:
      - ACL
      - CONFIG
      - FLUSHDB
      - FLUSHALL
      - FUNCTION
      - MIGRATE
      - MODULE
      - MONITOR
      - REPLICAOF
      - SLAVEOF
      - SHUTDOWN
  commonConfiguration: |-
    maxmemory 384mb
    maxmemory-policy noeviction
    save 60 1
    appendonly yes
    appendfsync everysec
  networkPolicy:
    enabled: true
    monitoringNamespace: monitoring
  metrics:
    enabled: true
    passwordFileInitImage:
      repository: university-backend
      tag: ""
      digest: REQUIRED_SHA256_DIGEST
      pullPolicy: Always
    image:
      registry: docker.io
      repository: oliver006/redis_exporter
      tag: v1.93.0
      digest: sha256:6ca518a72f30f7f576ef92963de1b91d3c3f5fd3aeac949f878bfda183587820
      pullPolicy: Always
    port: 9121
    resources:
      requests:
        cpu: 25m
        memory: 24Mi
      limits:
        cpu: 100m
        memory: 64Mi