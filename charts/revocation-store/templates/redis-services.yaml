{{- include "revocation-store.validate" . -}}
{{- $fullName := include "revocation-store.redis.fullname" . -}}
{{- $masterName := include "revocation-store.redis.masterName" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "revocation-store.redis.headlessName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "revocation-store.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Values.applicationReleaseName | quote }}
    app.kubernetes.io/name: revocation-redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $masterName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "revocation-store.redis.labels" . | nindent 4 }}
    app.kubernetes.io/component: master
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  sessionAffinity: None
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "revocation-store.redis.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-metrics" $fullName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "revocation-store.redis.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 9121
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Values.applicationReleaseName | quote }}
    app.kubernetes.io/name: revocation-redis