{{- include "revocation-store.validate" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "revocation-store.redis.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "revocation-store.redis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.applicationReleaseName | quote }}
      app.kubernetes.io/name: revocation-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 6379
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{ printf "%s-revocation-redis-client" .Values.applicationReleaseName }}: "true"
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.applicationReleaseName | quote }}
              app.kubernetes.io/name: revocation-redis
    - ports:
        - port: 9121
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress: []