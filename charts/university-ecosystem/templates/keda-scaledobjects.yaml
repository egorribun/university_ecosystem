{{- if .Values.keda.backend.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "university-ecosystem.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "university-ecosystem.fullname" . }}-backend
  minReplicaCount: {{ .Values.keda.backend.minReplicas }}
  maxReplicaCount: {{ .Values.keda.backend.maxReplicas }}
  cooldownPeriod: {{ .Values.keda.backend.cooldownPeriod }}
  pollingInterval: {{ .Values.keda.backend.pollingInterval }}
  triggers:
    {{- if .Values.keda.backend.redisQueue.enabled }}
    - type: redis
      metadata:
        address: {{ .Values.keda.backend.redisQueue.address | quote }}
        listName: {{ .Values.keda.backend.redisQueue.listName | quote }}
        listLength: {{ .Values.keda.backend.redisQueue.listLength | quote }}
        databaseIndex: {{ .Values.keda.backend.redisQueue.databaseIndex | quote }}
        enableTLS: "false"
      {{- if .Values.keda.redisAuth.enabled }}
      authenticationRef:
        name: {{ include "university-ecosystem.fullname" . }}-trigger-auth-redis
      {{- end }}
    {{- end }}
    {{- if .Values.keda.backend.natsJetstream.enabled }}
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ .Values.keda.backend.natsJetstream.monitoringEndpoint | quote }}
        account: "$SYS"
        stream: {{ .Values.keda.backend.natsJetstream.stream | quote }}
        consumer: {{ .Values.keda.backend.natsJetstream.consumer | quote }}
        lagThreshold: {{ .Values.keda.backend.natsJetstream.lagThreshold | quote }}
        activationLagThreshold: "0"
      {{- if .Values.keda.natsAuth.enabled }}
      authenticationRef:
        name: {{ include "university-ecosystem.fullname" . }}-trigger-auth-nats
      {{- end }}
    {{- end }}
    {{- if and .Values.hibernation.enabled .Values.hibernation.workloads.backend.enabled }}
    - type: cron
      metadata:
        timezone: {{ .Values.hibernation.schedules.offPeak.timezone | quote }}
        start: {{ .Values.hibernation.schedules.offPeak.start | quote }}
        end: {{ .Values.hibernation.schedules.offPeak.end | quote }}
        desiredReplicas: {{ .Values.hibernation.schedules.offPeak.desiredReplicas | quote }}
    {{- end }}
{{- end }}

