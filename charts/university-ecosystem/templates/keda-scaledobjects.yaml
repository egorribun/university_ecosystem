{{- if .Values.keda.enabled -}}

{{- if .Values.keda.outboxWorker.enabled -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "university-ecosystem.fullname" . }}-outbox-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "university-ecosystem.fullname" . }}-outbox-worker
  minReplicaCount: {{ .Values.keda.outboxWorker.minReplicas }}
  maxReplicaCount: {{ .Values.keda.outboxWorker.maxReplicas }}
  cooldownPeriod: {{ .Values.keda.outboxWorker.cooldownPeriod }}
  pollingInterval: {{ .Values.keda.outboxWorker.pollingInterval }}
  triggers:
    {{- if .Values.keda.outboxWorker.natsJetstream.enabled }}
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ .Values.keda.outboxWorker.natsJetstream.monitoringEndpoint | quote }}
        account: "$SYS"
        stream: {{ .Values.keda.outboxWorker.natsJetstream.stream | quote }}
        consumer: {{ .Values.keda.outboxWorker.natsJetstream.consumer | quote }}
        lagThreshold: {{ .Values.keda.outboxWorker.natsJetstream.lagThreshold | quote }}
        activationLagThreshold: "0"
      {{- if .Values.keda.natsAuth.enabled }}
      authenticationRef:
        name: {{ include "university-ecosystem.fullname" . }}-trigger-auth-nats
      {{- end }}
    {{- end }}
    {{- if and .Values.hibernation.enabled .Values.hibernation.workloads.outboxWorker.enabled }}
    - type: cron
      metadata:
        timezone: {{ .Values.hibernation.schedules.offPeak.timezone | quote }}
        start: {{ .Values.hibernation.schedules.offPeak.start | quote }}
        end: {{ .Values.hibernation.schedules.offPeak.end | quote }}
        desiredReplicas: {{ .Values.hibernation.schedules.offPeak.desiredReplicas | quote }}
    {{- end }}
{{- end }}

