        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: revocation-redis
              app.kubernetes.io/component: master
              university-ecosystem.io/revocation-store-for: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

{{- if .Values.backup.enabled }}

---
# Backup CronJob: no ingress; reads PostgreSQL and uploads the encrypted-in-
# transit dump to MinIO. External managed endpoints may require TCP 443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backup-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backup
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

{{- if .Values.migrations.enabled }}

---
# The migration hook intentionally omits release selector labels so it can run
# before normal chart resources exist. This policy selects it by component on
# upgrades and permits only PostgreSQL, the dedicated revocation Redis, and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-migration-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
  annotations:
    # The migration Job is a pre-install/pre-upgrade hook.  This policy must
    # be created first on a fresh release, otherwise the Job can briefly run
    # without its egress isolation.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    # Keep the policy after the hook completes so the Job remains isolated for
    # diagnostic retention; replace it only before the next hook execution.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: migration
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 5432
    # The separately bootstrapped store permits only pods carrying the
    # <release>-revocation-redis-client label added to migration-job.yaml.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: revocation-redis
              app.kubernetes.io/component: master
              university-ecosystem.io/revocation-store-for: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

---
# Backend: accepts gateway traffic, public JWKS discovery from ingress, and
# the default JWKS refresh from this release's file-processor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 8000
    {{- if and .Values.fileProcessor.enabled (not .Values.fileProcessor.config.jwksURL) }}
    # The default file-processor JWKS URL targets this release's backend service.
    - from:
        - podSelector:
            matchLabels:
              {{- include "university-ecosystem.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: file-processor
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    {{- end }}
    {{- if and .Values.ingress.enabled (not .Values.gatewayApi.enabled) }}
    # The ingress controller terminates TLS for the public API origin and
    # forwards only the explicitly routed /.well-known discovery path here.
    # Keep the selector configurable for nginx, Traefik, AWS ALB, or Istio.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressController.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressController.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
    {{- if .Values.gatewayApi.enabled }}
    # The Gateway API route sends /.well-known directly to the backend.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.gatewayApi.networkPolicy.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.gatewayApi.networkPolicy.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ws-hub
      ports:
        - protocol: TCP
          port: 8000
    # Prometheus scraping from monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # PostgreSQL.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Redis — session cache, rate limiting, pub/sub.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Revocation tombstones are stored separately from the volatile cache.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: revocation-redis
              app.kubernetes.io/component: master
              university-ecosystem.io/revocation-store-for: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: 6379
    # NATS messaging.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    # SpiceDB authz service.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spicedb
      ports:
        - protocol: TCP
          port: 50051
    # OTLP trace exporter.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    # External HTTPS: HIBP, Spotify OAuth, S3 object storage.
    - ports:
        - protocol: TCP
          port: 443
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# File processor: accepts gRPC from the gateway and exports metrics to the
# monitoring namespace; reaches NATS, Temporal, object storage, and OTLP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-file-processor-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: file-processor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 50051
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    {{- if and .Values.fileProcessor.enabled (not .Values.fileProcessor.config.jwksURL) }}
    # The default JWKS endpoint is the same release backend over its service port.
    - to:
        - podSelector:
            matchLabels:
              {{- include "university-ecosystem.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
    # File-processor JWT validation uses the dedicated persistent revocation
    # store; keep this release-bound and narrower than cache Redis access.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: revocation-redis
              app.kubernetes.io/component: master
              university-ecosystem.io/revocation-store-for: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Frontend: accepts traffic from the ingress controller. The Node SSR runtime
# calls the backend for route loaders and JWKS validation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
