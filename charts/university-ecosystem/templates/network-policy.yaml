              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
    {{- end }}
    {{- if .Values.gatewayApi.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.gatewayApi.networkPolicy.namespaceSelector }}
