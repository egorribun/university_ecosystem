# RZ-04 (audit Wave 12): NetworkPolicy — default-deny + per-component allow-lists.
#
# Design rationale:
#   1. A namespace-wide default-deny blocks ALL ingress and egress for every pod
#      in the release namespace.  Without this baseline, individual allow policies
#      are purely additive and provide no isolation guarantee.
#
#   2. Each component then gets its own NetworkPolicy with explicit allow rules.
#      This is the zero-trust network model: deny everything, allow exactly what
#      is necessary.
#
#   3. DNS egress (UDP/TCP 53) must be explicitly allowed or image pulls and
#      service discovery will silently fail — a common operational pitfall.
#
#   4. The "ingress-controller" podSelector relies on the standard label
#      "app.kubernetes.io/name: ingress-nginx" set by the nginx-ingress Helm chart.
#      Adjust to match the ingress controller deployed in your cluster.

{{- if or (eq (len .Values.networkPolicy.dns.namespaceSelector) 0) (eq (len .Values.networkPolicy.dns.podSelector) 0) -}}
  {{- fail "networkPolicy.dns namespaceSelector and podSelector must both identify the cluster DNS pods" -}}
{{- end -}}
{{- if has .Values.global.environment (list "staging" "production") -}}
  {{- if eq (len .Values.networkPolicy.gatewayJWKS.egressCIDRs) 0 -}}
    {{- fail "networkPolicy.gatewayJWKS.egressCIDRs must contain owner-verified CIDRs for the external HTTPS JWKS issuer in staging/production" -}}
  {{- end -}}
  {{- range $cidr := .Values.networkPolicy.gatewayJWKS.egressCIDRs -}}
    {{- $validIPv4 := regexMatch "^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/([1-9]|[12][0-9]|3[0-2])$" (toString $cidr) -}}
    {{- $validIPv6Syntax := regexMatch "^([0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){7}|::([0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){0,6})?|[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){0,6}::|[0-9A-Fa-f]{1,4}::[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){0,5}|[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){1}::[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){0,4}|[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){2}::[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){0,3}|[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){3}::[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){0,2}|[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){4}::[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){0,1}|[0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){5}::[0-9A-Fa-f]{1,4})/([1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])$" (toString $cidr) -}}
    {{- if not (or $validIPv4 $validIPv6Syntax) -}}
      {{- fail (printf "networkPolicy.gatewayJWKS.egressCIDRs entry %q must be a non-/0 IPv4 or IPv6 CIDR (Kubernetes validates address semantics)" $cidr) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

---
# Default deny: block all ingress AND egress for every pod bearing release labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

---
# Gateway: receives external traffic from the ingress controller; calls backend,
# redis, and the file-processor gRPC service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if and .Values.ingress.enabled (not .Values.gatewayApi.enabled) }}
    # Accept traffic from the ingress controller.
    # Labels are configured in values.yaml under networkPolicy.ingressController
    # so the chart works with nginx, Traefik, AWS ALB, or Istio.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressController.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressController.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.gatewayApi.enabled }}
    # Envoy Gateway data plane selected explicitly by gatewayApi.networkPolicy.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.gatewayApi.networkPolicy.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.gatewayApi.networkPolicy.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    # Internal health-check / Prometheus scraping from the monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9102
  egress:
    # Backend API proxy target.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8000
    # Redis — rate limiter.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Dedicated durable session-revocation store.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: revocation-redis
              app.kubernetes.io/component: master
              university-ecosystem.io/revocation-store-for: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: 6379
    # File-processor gRPC.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: file-processor
      ports:
        - protocol: TCP
          port: 50051
    # OTLP trace exporter (gRPC 4317).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    {{- if or (eq .Values.global.environment "staging") (eq .Values.global.environment "production") }}
    # Release JWKS discovery can reach only owner-configured issuer CIDRs.
    {{- range $cidr := .Values.networkPolicy.gatewayJWKS.egressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
    # DNS is limited to the configured cluster DNS pods.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

{{- if .Values.wsHub.enabled }}
