  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    # DNS for in-cluster backend service discovery.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Standalone transactional outbox worker: no ingress; only its data plane and
# observability dependencies are reachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-outbox-worker-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: outbox-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spicedb
      ports:
        - protocol: TCP
          port: 50051
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
