# RZ-04 (audit Wave 12): NetworkPolicy — default-deny + per-component allow-lists.
#
# Design rationale:
#   1. A namespace-wide default-deny blocks ALL ingress and egress for every pod
#      in the release namespace.  Without this baseline, individual allow policies
#      are purely additive and provide no isolation guarantee.
#
#   2. Each component then gets its own NetworkPolicy with explicit allow rules.
#      This is the zero-trust network model: deny everything, allow exactly what
#      is necessary.
#
#   3. DNS egress (UDP/TCP 53) must be explicitly allowed or image pulls and
#      service discovery will silently fail — a common operational pitfall.
#
#   4. The "ingress-controller" podSelector relies on the standard label
#      "app.kubernetes.io/name: ingress-nginx" set by the nginx-ingress Helm chart.
#      Adjust to match the ingress controller deployed in your cluster.

---
# Default deny: block all ingress AND egress for every pod bearing release labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

---
# Gateway: receives external traffic from the ingress controller; calls backend,
# redis, and the file-processor gRPC service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept traffic from the ingress controller.
    # Labels are configured in values.yaml under networkPolicy.ingressController
    # so the chart works with nginx, Traefik, AWS ALB, or Istio.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressController.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressController.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    # Internal health-check / Prometheus scraping from the monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9102
  egress:
    # Backend API proxy target.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8000
    # Redis — rate limiter.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Dedicated durable session-revocation store.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: revocation-redis
              app.kubernetes.io/component: master
              university-ecosystem.io/revocation-store-for: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: 6379
    # File-processor gRPC.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: file-processor
      ports:
        - protocol: TCP
          port: 50051
    # OTLP trace exporter (gRPC 4317).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    # DNS — required for service discovery and hostname resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

{{- if .Values.wsHub.enabled }}
---
# WS Hub: ingress only from the edge controller; egress only to its explicit
# backend, Redis, NATS, telemetry and DNS dependencies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ws-hub-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
    app.kubernetes.io/component: ws-hub
spec:
  podSelector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ws-hub
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressController.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressController.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.wsHub.service.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: revocation-redis
              app.kubernetes.io/component: master
              university-ecosystem.io/revocation-store-for: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

{{- if .Values.backup.enabled }}

---
# Backup CronJob: no ingress; reads PostgreSQL and uploads the encrypted-in-
# transit dump to MinIO. External managed endpoints may require TCP 443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backup-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backup
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

{{- if .Values.migrations.enabled }}

---
# The migration hook intentionally omits release selector labels so it can run
# before normal chart resources exist. This policy selects it by component on
# upgrades and permits only PostgreSQL, the dedicated revocation Redis, and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-migration-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
  annotations:
    # The migration Job is a pre-install/pre-upgrade hook.  This policy must
    # be created first on a fresh release, otherwise the Job can briefly run
    # without its egress isolation.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    # Keep the policy after the hook completes so the Job remains isolated for
    # diagnostic retention; replace it only before the next hook execution.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: migration
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 5432
    # The separately bootstrapped store permits only pods carrying the
    # <release>-revocation-redis-client label added to migration-job.yaml.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: revocation-redis
              app.kubernetes.io/component: master
              university-ecosystem.io/revocation-store-for: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

---
# Backend: accepts traffic from the gateway only; calls postgres, redis, NATS,
# and external HTTPS endpoints (HIBP, Spotify OAuth, etc.).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ws-hub
      ports:
        - protocol: TCP
          port: 8000
    # Prometheus scraping from monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # PostgreSQL.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Redis — session cache, rate limiting, pub/sub.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Revocation tombstones are stored separately from the volatile cache.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: revocation-redis
              app.kubernetes.io/component: master
              university-ecosystem.io/revocation-store-for: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: 6379
    # NATS messaging.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    # SpiceDB authz service.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spicedb
      ports:
        - protocol: TCP
          port: 50051
    # OTLP trace exporter.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    # External HTTPS: HIBP, Spotify OAuth, S3/Garage object storage.
    - ports:
        - protocol: TCP
          port: 443
    # DNS.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# File processor: accepts gRPC from the gateway and exports metrics to the
# monitoring namespace; reaches NATS, Temporal, object storage, and OTLP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-file-processor-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: file-processor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 50051
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Frontend: accepts traffic from the ingress controller. The Node SSR runtime
# calls the backend for route loaders and JWKS validation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-frontend-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressController.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressController.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    # DNS for in-cluster backend service discovery.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Standalone transactional outbox worker: no ingress; only its data plane and
# observability dependencies are reachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-outbox-worker-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: outbox-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spicedb
      ports:
        - protocol: TCP
          port: 50051
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
