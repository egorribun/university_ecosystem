apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "university-ecosystem.fullname" . }}-gateway
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not (and .Values.keda.enabled (and .Values.hibernation.enabled .Values.hibernation.workloads.gateway.enabled)) }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "university-ecosystem.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
        {{ printf "%s-redis-client" .Release.Name }}: "true"
        {{ printf "%s-revocationRedis-client" .Release.Name }}: "true"
      annotations:
        university-ecosystem.io/source-sha: {{ .Values.global.imageTag | quote }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # TD-05 (audit Wave 12): dedicated ServiceAccount.
      serviceAccountName: {{ .Release.Name }}-gateway
      automountServiceAccountToken: false
      # RZ-03 (audit Wave 12): pod-level security context.
      # runAsUser 65532 matches the distroless 'nonroot' user in services/gateway/Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "university-ecosystem.image" (dict "root" . "image" .Values.gateway.image) | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          # RZ-03: distroless Go binary has no filesystem writes — readOnlyRootFilesystem
          # is safe without any emptyDir volumes.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9102
              protocol: TCP
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "university-ecosystem.applicationSecretName" . | quote }}
                  key: jwt-secret
            - name: JWT_AUDIENCE
              value: {{ required "gateway.config.jwtAudience must be set" .Values.gateway.config.jwtAudience | quote }}
            - name: BACKEND_URL
              value: "http://{{ include "university-ecosystem.fullname" . }}-backend:8000"
            - name: FILE_PROCESSOR_ADDR
              value: "{{ include "university-ecosystem.fullname" . }}-file-processor:50051"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "connections.existingSecret must be set" .Values.connections.existingSecret | quote }}
                  key: {{ required "connections.redisGatewayURLKey must be set" .Values.connections.redisGatewayURLKey | quote }}
            - name: REVOCATION_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "connections.existingSecret must be set" .Values.connections.existingSecret | quote }}
                  key: {{ required "connections.redisRevocationURLKey must be set" .Values.connections.redisRevocationURLKey | quote }}
            - name: VITE_ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
            - name: GRPC_USE_TLS
              value: {{ .Values.gateway.config.grpcUseTLS | quote }}
            {{- if .Values.internalGrpcMTLS.enabled }}
            - name: GRPC_CA_FILE
              value: /run/secrets/internal-grpc-mtls/ca.crt
            - name: GRPC_CLIENT_CERT_FILE
              value: /run/secrets/internal-grpc-mtls/tls.crt
            - name: GRPC_CLIENT_KEY_FILE
              value: /run/secrets/internal-grpc-mtls/tls.key
            - name: GRPC_SERVER_NAME
              value: {{ .Values.internalGrpcMTLS.serverName | quote }}
            - name: GRPC_CLIENT_IDENTITY_URI
              value: {{ .Values.internalGrpcMTLS.gatewayIdentityURI | quote }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.gateway.config.otelEndpoint | quote }}
            - name: GATEWAY_H3_ENABLED
              value: {{ .Values.gateway.config.h3Enabled | quote }}
            - name: JWKS_ENDPOINT
              value: {{ printf "http://%s-backend:%v/.well-known/jwks.json" (include "university-ecosystem.fullname" .) .Values.backend.service.port | quote }}
            - name: JWKS_REFRESH_INTERVAL
              value: "60"
            - name: INTERNAL_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "university-ecosystem.applicationSecretName" . | quote }}
                  key: internal-hmac-secret
            # PERF-03 (RZ-W13): OTel sampling — 10% in production.
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.otel.sampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.otel.samplerArg | quote }}
          # TD-04 (audit Wave 12): explicit probe timing.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          {{- if .Values.internalGrpcMTLS.enabled }}
          volumeMounts:
            - name: internal-grpc-mtls
              mountPath: /run/secrets/internal-grpc-mtls
              readOnly: true
          {{- end }}
      {{- if .Values.internalGrpcMTLS.enabled }}
      volumes:
        - name: internal-grpc-mtls
          secret:
            secretName: {{ required "internalGrpcMTLS.gatewayClient.existingSecret must be set" .Values.internalGrpcMTLS.gatewayClient.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.internalGrpcMTLS.gatewayClient.certKey | quote }}
                path: tls.crt
              - key: {{ .Values.internalGrpcMTLS.gatewayClient.privateKeyKey | quote }}
                path: tls.key
              - key: {{ .Values.internalGrpcMTLS.gatewayClient.caKey | quote }}
                path: ca.crt
      {{- end }}
