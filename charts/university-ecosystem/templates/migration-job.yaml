{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "university-ecosystem.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ include "university-ecosystem.chart" . }}
    app.kubernetes.io/component: migration
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    # Keep the most recent Job for diagnostics; replace it on the next release.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
        # This exact client label is required by the dedicated noeviction
        # revocation Redis NetworkPolicy; do not substitute cache Redis.
        {{ printf "%s-revocation-redis-client" .Release.Name }}: "true"
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "university-ecosystem.image" (dict "root" . "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "connections.existingSecret must be set before Helm install" .Values.connections.existingSecret | quote }}
                  key: {{ required "connections.databaseURLKey must be set" .Values.connections.databaseURLKey | quote }}
            # Contract retirement may revoke already-issued bearer JTIs before
            # altering their database rows. This must target the dedicated,
            # persistent noeviction datastore, never the cache Redis instance.
            - name: REVOCATION_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "connections.existingSecret must be set before Helm install" .Values.connections.existingSecret | quote }}
                  key: {{ required "connections.redisRevocationURLKey must be set" .Values.connections.redisRevocationURLKey | quote }}
            # Development mode prevents unrelated runtime-service secret
            # validators from blocking the isolated migration Job.
            - name: ENVIRONMENT
              value: development
            - name: AUTO_CREATE_SCHEMA
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
