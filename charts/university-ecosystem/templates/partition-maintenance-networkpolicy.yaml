{{- if .Values.partitionMaintenance.enabled }}
# Partition-retention CronJob: no ingress. Egress matches the migration policy it
# mirrors: PostgreSQL, the dedicated revocation Redis that its pods label for, and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-partition-maintenance-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: partition-maintenance
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: revocation-redis
              app.kubernetes.io/component: master
              university-ecosystem.io/revocation-store-for: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.namespaceSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.dns.podSelector }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
