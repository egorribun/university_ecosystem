{{- if .Values.outboxWorker.enabled }}
{{- $connectionSecret := required "connections.existingSecret must be set" .Values.connections.existingSecret -}}
{{- $rateLimitURIKey := required "connections.rateLimitStorageURIKey must be set" .Values.connections.rateLimitStorageURIKey -}}
{{- $applicationSecret := include "university-ecosystem.applicationSecretName" . -}}
{{- $connectionSecretKeys := list
  (required "connections.databaseURLKey must be set" .Values.connections.databaseURLKey)
  (required "connections.redisBackendURLKey must be set" .Values.connections.redisBackendURLKey)
  $rateLimitURIKey
  (required "connections.natsURLKey must be set" .Values.connections.natsURLKey)
  (required "connections.natsAuthTokenKey must be set" .Values.connections.natsAuthTokenKey)
-}}
{{- $applicationSecretKeys := list
  "jwt-secret"
  "jwt-rsa-private-key"
  "internal-hmac-secret"
  "ws-hub-internal-secret"
  "csrf-hmac-secret"
  "spotify-token-secret"
  "elasticsearch-password"
  "spicedb-preshared-key"
  "audit-log-secret"
  "token-hmac-secret"
  "idempotency-hmac-secret"
  (required "applicationSecrets.keys.mfaEmailDeliveryKEKs must be set" .Values.applicationSecrets.keys.mfaEmailDeliveryKEKs)
-}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "university-ecosystem.fullname" . }}-outbox-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox-worker
spec:
  {{- if not (and .Values.keda.enabled .Values.keda.outboxWorker.enabled) }}
  replicas: {{ .Values.outboxWorker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: outbox-worker
  template:
    metadata:
      labels:
        {{- include "university-ecosystem.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: outbox-worker
        {{ printf "%s-redis-client" .Release.Name }}: "true"
        {{ printf "%s-nats-client" .Release.Name }}: "true"
      annotations:
        university-ecosystem.io/source-sha: {{ .Values.global.imageTag | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Release.Name }}-outbox-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outbox-worker
          image: {{ include "university-ecosystem.image" (dict "root" . "image" .Values.outboxWorker.image) | quote }}
          imagePullPolicy: {{ .Values.outboxWorker.image.pullPolicy }}
          # Clear stale health markers before Python imports the worker application.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              rm -f -- /tmp/worker.pid /tmp/worker.heartbeat
              exec python -m app.workers.outbox
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- range $key, $value := .Values.outboxWorker.env }}
            {{- if and (not (has $key (list "DATABASE_URL" "CACHE_REDIS_URL" "REVOCATION_REDIS_URL" "NATS_URL" "NATS_AUTH_TOKEN" "ENVIRONMENT" "SECRET_KEY" "ALGORITHM" "JWT_PRIVATE_KEY_PATH" "INTERNAL_HMAC_SECRET" "WS_HUB_INTERNAL_SECRET" "CSRF_HMAC_SECRET" "SPOTIFY_TOKEN_SECRET" "ELASTICSEARCH_PASSWORD" "SPICEDB_PRESHARED_KEY" "AUDIT_LOG_SECRET" "TOKEN_HMAC_SECRET" "IDEMPOTENCY_HMAC_SECRET" "MFA_TOTP_ENCRYPTION_KEYS" "MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID" "MFA_EMAIL_OTP_HMAC_KEYS" "MFA_TOTP_ENCRYPTION_KEYS_FILE" "MFA_TOTP_ACTIVE_ENCRYPTION_KEY_ID_FILE" "MFA_EMAIL_DELIVERY_KEKS" "MFA_EMAIL_DELIVERY_ACTIVE_KEK_ID" "MFA_TRUSTED_DEVICE_HMAC_KEYS" "MFA_TRUSTED_DEVICE_ACTIVE_HMAC_KEY_ID" "MINIO_SECURE" "ELASTICSEARCH_URL" "EVENT_FILE_SCANNER_ENABLED" "KEDA_POSTGRESQL_CONNECTION" "DATABASE_URL_FILE" "CACHE_REDIS_URL_FILE" "REVOCATION_REDIS_URL_FILE" "NATS_URL_FILE" "NATS_AUTH_TOKEN_FILE" "SECRET_KEY_FILE" "INTERNAL_HMAC_SECRET_FILE" "WS_HUB_INTERNAL_SECRET_FILE" "CSRF_HMAC_SECRET_FILE" "SPOTIFY_TOKEN_SECRET_FILE" "ELASTICSEARCH_PASSWORD_FILE" "SPICEDB_PRESHARED_KEY_FILE" "AUDIT_LOG_SECRET_FILE" "TOKEN_HMAC_SECRET_FILE" "IDEMPOTENCY_HMAC_SECRET_FILE" "MFA_EMAIL_DELIVERY_KEKS_FILE"))) (not (has (upper $key) (list "RATE_LIMIT_STORAGE_BACKEND" "RATE_LIMIT_STORAGE_URI" "RATE_LIMIT_STORAGE_URI_FILE"))) }}
            - name: {{ $key }}
              value: {{ tpl $value $ | quote }}
            {{- end }}
            {{- end }}
            - name: RATE_LIMIT_STORAGE_BACKEND
              value: "redis"
            - name: RATE_LIMIT_STORAGE_URI_FILE
              value: {{ printf "/run/secrets/%s/%s" $connectionSecret $rateLimitURIKey | quote }}
            - name: DATABASE_URL_FILE
              value: {{ printf "/run/secrets/%s/%s" $connectionSecret (required "connections.databaseURLKey must be set" .Values.connections.databaseURLKey) | quote }}
            - name: CACHE_REDIS_URL_FILE
              value: {{ printf "/run/secrets/%s/%s" $connectionSecret (required "connections.redisBackendURLKey must be set" .Values.connections.redisBackendURLKey) | quote }}
            # Outbox dispatch has no authentication responsibility. Its process
            # role disables the revocation capability, and no security-store URL
            # or NetworkPolicy label is rendered for this workload.
            - name: APP_PROCESS_ROLE
              value: "outbox-worker"
            - name: REVOCATION_REDIS_ACCESS_ENABLED
              value: "false"
            - name: NATS_URL_FILE
              value: {{ printf "/run/secrets/%s/%s" $connectionSecret (required "connections.natsURLKey must be set" .Values.connections.natsURLKey) | quote }}
            - name: NATS_AUTH_TOKEN_FILE
              value: {{ printf "/run/secrets/%s/%s" $connectionSecret (required "connections.natsAuthTokenKey must be set" .Values.connections.natsAuthTokenKey) | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
            - name: SECRET_KEY_FILE
              value: {{ printf "/run/secrets/%s/%s" $applicationSecret "jwt-secret" | quote }}
            - name: ALGORITHM
              value: "RS256"
            - name: JWT_PRIVATE_KEY_PATH
              value: {{ printf "/run/secrets/%s/%s" $applicationSecret "jwt-rsa-private-key" | quote }}
            {{- range $variable, $key := dict "INTERNAL_HMAC_SECRET" "internal-hmac-secret" "WS_HUB_INTERNAL_SECRET" "ws-hub-internal-secret" "CSRF_HMAC_SECRET" "csrf-hmac-secret" "SPOTIFY_TOKEN_SECRET" "spotify-token-secret" "ELASTICSEARCH_PASSWORD" "elasticsearch-password" "SPICEDB_PRESHARED_KEY" "spicedb-preshared-key" "AUDIT_LOG_SECRET" "audit-log-secret" "TOKEN_HMAC_SECRET" "token-hmac-secret" "IDEMPOTENCY_HMAC_SECRET" "idempotency-hmac-secret" }}
            - name: {{ printf "%s_FILE" $variable }}
              value: {{ printf "/run/secrets/%s/%s" $applicationSecret $key | quote }}
            {{- end }}
            - name: MFA_EMAIL_DELIVERY_KEKS_FILE
              value: {{ printf "/run/secrets/%s/%s" $applicationSecret (required "applicationSecrets.keys.mfaEmailDeliveryKEKs must be set" .Values.applicationSecrets.keys.mfaEmailDeliveryKEKs) | quote }}
            - name: MINIO_SECURE
              value: {{ .Values.backend.config.minioSecure | quote }}
            - name: ELASTICSEARCH_URL
              value: {{ .Values.backend.config.elasticsearchURL | quote }}
            - name: EVENT_FILE_SCANNER_ENABLED
              value: {{ .Values.backend.config.eventFileScannerEnabled | quote }}
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import os; raise SystemExit(0 if os.path.exists('/tmp/worker.heartbeat') else 1)"
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,time; pid=int(open('/tmp/worker.pid', encoding='ascii').read()); os.kill(pid,0); raise SystemExit(0 if time.time()-os.path.getmtime('/tmp/worker.heartbeat') < 30 else 1)"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,time; pid=int(open('/tmp/worker.pid', encoding='ascii').read()); os.kill(pid,0); raise SystemExit(0 if time.time()-os.path.getmtime('/tmp/worker.heartbeat') < 30 else 1)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.outboxWorker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "university-ecosystem.secretVolumeMounts" (dict "secrets" (list (dict "id" "connections" "secretName" $connectionSecret "keys" $connectionSecretKeys) (dict "id" "application" "secretName" $applicationSecret "keys" $applicationSecretKeys))) | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        {{- include "university-ecosystem.secretVolumes" (dict "secrets" (list (dict "id" "connections" "secretName" $connectionSecret "keys" $connectionSecretKeys) (dict "id" "application" "secretName" $applicationSecret "keys" $applicationSecretKeys))) | nindent 8 }}
{{- end }}
