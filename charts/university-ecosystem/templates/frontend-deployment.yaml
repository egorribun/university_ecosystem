apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "university-ecosystem.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not (or .Values.frontend.autoscaling.enabled (and .Values.keda.enabled (and .Values.hibernation.enabled .Values.hibernation.workloads.frontend.enabled))) }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "university-ecosystem.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        university-ecosystem.io/source-sha: {{ .Values.global.imageTag | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      # TD-05 (audit Wave 12): dedicated ServiceAccount.
      serviceAccountName: {{ .Release.Name }}-frontend
      automountServiceAccountToken: false
      # The runtime image's dedicated non-root app account uses UID/GID 10001.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "university-ecosystem.image" (dict "root" . "image" .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          # Node SSR does not write to the image filesystem; /tmp remains
          # available for standard-library and runtime temporary files.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.frontend.service.port | quote }}
            # Node SSR requests and JWKS discovery use the in-cluster backend;
            # browser requests remain relative and flow through the gateway.
            - name: BACKEND_ORIGIN
              {{- if .Values.internalHttpMTLS.enabled }}
              value: "http://127.0.0.1:18000"
              {{- else }}
              value: "http://{{ include "university-ecosystem.componentName" (dict "root" . "component" "backend") }}:{{ .Values.backend.service.port }}"
              {{- end }}
            - name: JWT_ISSUER
              value: {{ required "global.jwtIssuer must be set" .Values.global.jwtIssuer | quote }}
          # TD-04 (audit Wave 12): explicit probe timing.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- if .Values.internalHttpMTLS.enabled }}
        # Only this loopback proxy receives the Workload API socket. Browser
        # traffic reaches Node, never this listener or the identity socket.
        - name: ssr-proxy
          image: {{ include "university-ecosystem.image" (dict "root" . "image" .Values.gateway.image) | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: ["/ssr-proxy"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SSR_MTLS_ENABLED
              value: "true"
            - name: SSR_BACKEND_ORIGIN
              value: "https://{{ include "university-ecosystem.componentName" (dict "root" . "component" "backend") }}:{{ .Values.backend.service.port }}"
            - name: SSR_SPIFFE_ID
              value: {{ .Values.internalHttpMTLS.frontendSpiffeID | quote }}
            - name: SSR_BACKEND_SPIFFE_ID
              value: {{ .Values.internalHttpMTLS.backendSpiffeID | quote }}
            - name: SSR_SPIFFE_TRUST_DOMAIN
              value: {{ .Values.internalHttpMTLS.trustDomain | quote }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: {{ printf "unix://%s/agent.sock" .Values.internalHttpMTLS.workloadAPI.mountPath | quote }}
          startupProbe:
            exec:
              command: ["/ssr-proxy", "probe"]
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/ssr-proxy", "probe"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/ssr-proxy", "live"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.ssrProxyResources | nindent 12 }}
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: {{ .Values.internalHttpMTLS.workloadAPI.mountPath | quote }}
              readOnly: true
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        {{- if .Values.internalHttpMTLS.enabled }}
        - name: spiffe-workload-api
          csi:
            driver: {{ .Values.internalHttpMTLS.workloadAPI.csiDriver | quote }}
            readOnly: true
        {{- end }}
