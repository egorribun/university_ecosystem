apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "university-ecosystem.fullname" . }}-frontend
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not (and .Values.keda.enabled (and .Values.hibernation.enabled .Values.hibernation.workloads.frontend.enabled)) }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "university-ecosystem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "university-ecosystem.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # TD-05 (audit Wave 12): dedicated ServiceAccount.
      serviceAccountName: {{ .Release.Name }}-frontend
      automountServiceAccountToken: false
      # RZ-03 (audit Wave 12): pod-level security context.
      # runAsUser 101 matches the nginx user in nginxinc/nginx-unprivileged (frontend.Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          # RZ-03: nginx-unprivileged writes pid + temp files to /tmp and cache to
          # /var/cache/nginx. Provide emptyDir volumes; root filesystem is read-only.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          # TD-04 (audit Wave 12): explicit probe timing.
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          # RZ-03: writable dirs required by nginx-unprivileged with readOnlyRootFilesystem.
          # /tmp: nginx pid file + client body temp.
          # /var/cache/nginx: proxy and fastcgi cache dir (even without proxy_cache).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 128Mi
