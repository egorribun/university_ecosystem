{{- if not .Values.applicationSecrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "university-ecosystem.applicationSecretName" . }}
type: Opaque
data:
  # Development convenience only. Production should set
  # applicationSecrets.existingSecret so credentials stay out of Helm state.
  jwt-secret: {{ required "gateway.config.jwtSecret must be set (--set gateway.config.jwtSecret=...)" .Values.gateway.config.jwtSecret | b64enc | quote }}
  jwt-rsa-private-key: {{ required "backend.config.jwtPrivateKeyPEM must be set (prefer --set-file)" .Values.backend.config.jwtPrivateKeyPEM | b64enc | quote }}
  internal-hmac-secret: {{ required "backend.config.internalHMACSecret must be set" .Values.backend.config.internalHMACSecret | b64enc | quote }}
  ws-hub-internal-secret: {{ required "backend.config.wsHubInternalSecret must be set" .Values.backend.config.wsHubInternalSecret | b64enc | quote }}
  csrf-hmac-secret: {{ required "backend.config.csrfHMACSecret must be set" .Values.backend.config.csrfHMACSecret | b64enc | quote }}
  spotify-token-secret: {{ required "backend.config.spotifyTokenSecret must be set" .Values.backend.config.spotifyTokenSecret | b64enc | quote }}
  elasticsearch-password: {{ required "backend.config.elasticsearchPassword must be set" .Values.backend.config.elasticsearchPassword | b64enc | quote }}
  spicedb-preshared-key: {{ required "backend.config.spicedbPresharedKey must be set" .Values.backend.config.spicedbPresharedKey | b64enc | quote }}
  audit-log-secret: {{ required "backend.config.auditLogSecret must be set" .Values.backend.config.auditLogSecret | b64enc | quote }}
  idempotency-hmac-secret: {{ required "backend.config.idempotencyHMACSecret must be set" .Values.backend.config.idempotencyHMACSecret | b64enc | quote }}
  {{ required "applicationSecrets.keys.mfaEmailOtpHMACKeys must be set" .Values.applicationSecrets.keys.mfaEmailOtpHMACKeys | quote }}: {{ required "backend.config.mfaEmailOtpHMACKeys must be set" .Values.backend.config.mfaEmailOtpHMACKeys | b64enc | quote }}
  {{ required "applicationSecrets.keys.mfaEmailOtpActiveHMACKeyId must be set" .Values.applicationSecrets.keys.mfaEmailOtpActiveHMACKeyId | quote }}: {{ required "backend.config.mfaEmailOtpActiveHMACKeyId must be set" .Values.backend.config.mfaEmailOtpActiveHMACKeyId | b64enc | quote }}
  {{ required "applicationSecrets.keys.mfaEmailDeliveryKEKs must be set" .Values.applicationSecrets.keys.mfaEmailDeliveryKEKs | quote }}: {{ required "backend.config.mfaEmailDeliveryKEKs must be set" .Values.backend.config.mfaEmailDeliveryKEKs | b64enc | quote }}
  {{ required "applicationSecrets.keys.mfaEmailDeliveryActiveKEKId must be set" .Values.applicationSecrets.keys.mfaEmailDeliveryActiveKEKId | quote }}: {{ required "backend.config.mfaEmailDeliveryActiveKEKId must be set" .Values.backend.config.mfaEmailDeliveryActiveKEKId | b64enc | quote }}
  {{ required "applicationSecrets.keys.mfaTrustedDeviceHMACKeys must be set" .Values.applicationSecrets.keys.mfaTrustedDeviceHMACKeys | quote }}: {{ required "backend.config.mfaTrustedDeviceHMACKeys must be set" .Values.backend.config.mfaTrustedDeviceHMACKeys | b64enc | quote }}
  {{ required "applicationSecrets.keys.mfaTrustedDeviceActiveHMACKeyId must be set" .Values.applicationSecrets.keys.mfaTrustedDeviceActiveHMACKeyId | quote }}: {{ required "backend.config.mfaTrustedDeviceActiveHMACKeyId must be set" .Values.backend.config.mfaTrustedDeviceActiveHMACKeyId | b64enc | quote }}
  {{- if .Values.fileProcessor.enabled }}
  jwt-rsa-public-key: {{ required "fileProcessor.config.rsaPublicKeyPEM must be set (prefer --set-file)" .Values.fileProcessor.config.rsaPublicKeyPEM | b64enc | quote }}
  temporal-api-key: {{ required "fileProcessor.config.temporalAPIKey must be set" .Values.fileProcessor.config.temporalAPIKey | b64enc | quote }}
  {{- end }}
  {{- if or .Values.fileProcessor.enabled .Values.backup.enabled }}
  minio-access-key: {{ required "fileProcessor.config.minioAccessKey must be set" .Values.fileProcessor.config.minioAccessKey | b64enc | quote }}
  minio-secret-key: {{ required "fileProcessor.config.minioSecretKey must be set" .Values.fileProcessor.config.minioSecretKey | b64enc | quote }}
  {{- end }}
{{- end }}
