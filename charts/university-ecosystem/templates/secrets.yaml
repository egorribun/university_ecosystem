apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
data:
  # Base64 encoded dummy values. In prod, use external secrets or inject at install time.
  # "change-me-in-production" -> Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=
  jwt-secret: {{ .Values.gateway.config.jwtSecret | b64enc | quote }}
