apiVersion: v1
kind: Service
metadata:
  name: {{ include "university-ecosystem.fullname" . }}-gateway
  labels:
    {{- include "university-ecosystem.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.gateway.service.type "NodePort" }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
  selector:
    {{- include "university-ecosystem.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
