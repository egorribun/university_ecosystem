# Global settings
global:
  environment: "development"
  imageRegistry: "docker.io/library"

# Backend Service (Python/FastAPI)
backend:
  replicaCount: 1
  image:
    repository: university-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  env:
    DATABASE_URL: "postgresql+asyncpg://postgres:DevSecurePass2024!@postgres:5432/university"
    # Using internal redis service
    CACHE_REDIS_URL: "redis://redis:6379/0"

# Gateway Service (Go)
gateway:
  replicaCount: 1
  image:
    repository: university-gateway
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  config:
    jwtSecret: "" # MUST be provided as --set gateway.config.jwtSecret=...
    rateLimitRps: 100

# File Processor (Go)
fileProcessor:
  replicaCount: 2
  image:
    repository: university-file-processor
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 50051

# Rust Optimizer
rustOptimizer:
  replicaCount: 1
  image:
    repository: university-rust-optimizer
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080

# Infrastructure (Dependencies)
# In a real chart, these would be subcharts (bitnami/redis, etc.)
# For now, we define simple deployment values or assume external
postgres:
  enabled: true
redis:
  enabled: true
minio:
  enabled: true
temporal:
  enabled: true
