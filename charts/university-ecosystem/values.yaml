global:
  imagePullSecrets: []
  domain: university.local

# Backend configuration
backend:
  enabled: true
  image:
    repository: backend
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 2
  
  service:
    type: ClusterIP
    port: 8000
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: university-ecosystem-db
          key: url
    - name: REDIS_URL
      value: redis://university-ecosystem-redis-master:6379/0
    - name: AUDIT_LOG_SECRET
      valueFrom:
        secretKeyRef:
          name: university-ecosystem-secrets
          key: audit-log-secret

# Frontend configuration
frontend:
  enabled: true
  image:
    repository: frontend
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 2
  
  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: university.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /img
          pathType: Prefix
          service: backend
        - path: /static
          pathType: Prefix
          service: backend

# External Dependencies (via Subcharts)
postgresql:
  enabled: true
  auth:
    username: university
    database: university
    existingSecret: university-ecosystem-db-pass
  primary:
    persistence:
      enabled: true
      size: 8Gi

redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 2Gi
