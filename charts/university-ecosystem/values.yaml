# Global settings
global:
  environment: "development"
  imageRegistry: "docker.io/library"

# Backend Service (Python/FastAPI)
backend:
  replicaCount: 1
  image:
    repository: university-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  env:
    DATABASE_URL: "postgresql+asyncpg://postgres:DevSecurePass2024!@postgres:5432/university"
    # Using internal redis service
    CACHE_REDIS_URL: "redis://redis:6379/0"

# Gateway Service (Go)
gateway:
  replicaCount: 1
  image:
    repository: university-gateway
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  config:
    jwtSecret: "" # MUST be provided as --set gateway.config.jwtSecret=...
    rateLimitRps: 100

# File Processor (Go)
fileProcessor:
  replicaCount: 2
  image:
    repository: university-file-processor
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 50051

# Rust Optimizer
rustOptimizer:
  replicaCount: 1
  image:
    repository: university-rust-optimizer
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080

# Network Policy ingress-controller selector.
# DEBT-07 (RZ-W13): parametrized so the chart works with any ingress controller
# (nginx, Traefik, AWS ALB, Istio). Override with --set for non-nginx clusters:
#   --set networkPolicy.ingressController.namespaceSelector.kubernetes\.io/metadata\.name=traefik
# OpenTelemetry sampling configuration.
# PERF-03 (RZ-W13): Without explicit sampler config the SDK defaults to
# parentbased_always_on (100% sampling). At production load (1000+ req/s)
# this saturates the OTLP Collector and adds measurable CPU overhead.
# Use parentbased_traceidratio + 0.1 for 10% head-based sampling in production.
otel:
  sampler: "parentbased_traceidratio"
  samplerArg: "0.1"   # 10% in production; set 1.0 in staging/dev

networkPolicy:
  ingressController:
    # Namespace where the ingress controller pods live.
    namespaceSelector:
      "kubernetes.io/metadata.name": ingress-nginx
    # Labels on the ingress controller pods themselves.
    podSelector:
      "app.kubernetes.io/name": ingress-nginx

# Infrastructure (Dependencies)
# In a real chart, these would be subcharts (bitnami/redis, etc.)
# For now, we define simple deployment values or assume external
postgres:
  enabled: true
redis:
  enabled: true
minio:
  enabled: true
temporal:
  enabled: true
