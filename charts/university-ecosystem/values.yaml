# Global settings
global:
  environment: "development"
  imageRegistry: "docker.io/library"

# Backend Service (Python/FastAPI)
backend:
  replicaCount: 2
  image:
    repository: university-backend
    pullPolicy: IfNotPresent
    tag: ""  # RZ-33-26: empty = Chart.AppVersion; "latest" rejected by Kyverno
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    DATABASE_URL: ""  # RZ-26-02: MUST be provided via --set or ExternalSecret. Never commit credentials.
    CACHE_REDIS_URL: "redis://redis:6379/0"

# Frontend Service (nginx)
frontend:
  replicaCount: 2
  image:
    repository: university-frontend
    pullPolicy: IfNotPresent
    tag: ""  # RZ-33-26: empty = Chart.AppVersion; "latest" rejected by Kyverno
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Gateway Service (Go)
gateway:
  replicaCount: 2
  image:
    repository: university-gateway
    pullPolicy: IfNotPresent
    tag: ""  # RZ-33-26: empty = Chart.AppVersion; "latest" rejected by Kyverno
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    jwtSecret: "" # MUST be provided as --set gateway.config.jwtSecret=...
    rateLimitRps: 100

# File Processor (Go)
fileProcessor:
  replicaCount: 2
  image:
    repository: university-file-processor
    pullPolicy: IfNotPresent
    tag: ""  # RZ-33-26: empty = Chart.AppVersion; "latest" rejected by Kyverno
  service:
    type: ClusterIP
    port: 50051
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Rust Optimizer
rustOptimizer:
  replicaCount: 1
  image:
    repository: university-rust-optimizer
    pullPolicy: IfNotPresent
    tag: ""  # RZ-33-26: empty = Chart.AppVersion; "latest" rejected by Kyverno
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# CDC Worker
cdcWorker:
  replicaCount: 1
  image:
    repository: university-backend
    pullPolicy: IfNotPresent
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    DATABASE_URL: ""
    NATS_URL: ""
    ENABLE_CDC_OUTBOX: "true"
    POSTGRES_REPLICATION_SLOT: "outbox_cdc_slot"
    CDC_SLOT_NAME: "outbox_cdc_slot"
    CDC_PUBLICATION_NAME: "outbox_pub"

# Ingress (MOD-30-04: fully parameterized)
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: university.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
    - host: api.university.example.com
      paths:
        - path: /
          pathType: Prefix
          service: backend
  tls:
    - secretName: university-ecosystem-tls  # pragma: allowlist secret
      hosts:
        - university.example.com
        - api.university.example.com

# Network Policy ingress-controller selector.
# DEBT-07 (RZ-W13): parametrized so the chart works with any ingress controller
# (nginx, Traefik, AWS ALB, Istio). Override with --set for non-nginx clusters:
#   --set networkPolicy.ingressController.namespaceSelector.kubernetes\.io/metadata\.name=traefik
# OpenTelemetry sampling configuration.
# PERF-03 (RZ-W13): Without explicit sampler config the SDK defaults to
# parentbased_always_on (100% sampling). At production load (1000+ req/s)
# this saturates the OTLP Collector and adds measurable CPU overhead.
# Use parentbased_traceidratio + 0.1 for 10% head-based sampling in production.
otel:
  sampler: "parentbased_traceidratio"
  samplerArg: "0.1"   # 10% in production; set 1.0 in staging/dev

networkPolicy:
  ingressController:
    # Namespace where the ingress controller pods live.
    namespaceSelector:
      "kubernetes.io/metadata.name": ingress-nginx
    # Labels on the ingress controller pods themselves.
    podSelector:
      "app.kubernetes.io/name": ingress-nginx

# Infrastructure (Dependencies)
# PERF-W18-03 / Wave 18.1: bitnami subcharts with explicit resource limits.
# Run `helm dependency update` after modifying.
postgres:
  enabled: true  # External — managed by CloudNativePG or external RDS
  wal_level: logical
  max_replication_slots: 5
  max_wal_senders: 5
  config:
    wal_level: logical
    max_replication_slots: 5
    max_wal_senders: 5

postgresql:
  enabled: true
  wal_level: logical
  max_replication_slots: 5
  max_wal_senders: 5
  config:
    wal_level: logical
    max_replication_slots: 5
    max_wal_senders: 5

# bitnami/redis subchart configuration.
# Docs: https://github.com/bitnami/charts/tree/main/bitnami/redis
redis:
  enabled: true
  architecture: standalone  # standalone for dev; replication for prod
  auth:
    enabled: true
    existingSecret: "redis-credentials" #checkov:skip=CKV_SECRET_6:references a Kubernetes Secret name, not a credential value
    existingSecretPasswordKey: "redis-password" #checkov:skip=CKV_SECRET_6:references a Secret key name, not a credential value
  master:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    persistence:
      enabled: true
      size: 8Gi
    # Pod security hardening (matches our Kyverno Enforce policies)
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
  # Redis configuration matching docker-compose.yml valkey settings.
  commonConfiguration: |-
    maxmemory 1536mb
    maxmemory-policy volatile-lru
    save ""
    appendonly no
  metrics:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# bitnami/nats subchart configuration.
# Docs: https://github.com/bitnami/charts/tree/main/bitnami/nats
nats:
  enabled: true
  resourceType: statefulset
  replicaCount: 1  # standalone for dev; 3 for prod cluster
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nats:
    jetstream:
      enabled: true
      memStorage:
        enabled: true
        size: 512Mi
      fileStorage:
        enabled: true
        size: 10Gi
  # Pod security hardening
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

minio:
  enabled: true  # External — managed separately
temporal:
  enabled: true  # External — managed separately

# KEDA Auto-Scaling Configuration (Vector 17 FinOps)
keda:
  enabled: false  # Global master switch (set true in clusters with KEDA operator installed)

  redisAuth:
    enabled: true
    secretName: "redis-credentials"
    secretPasswordKey: "redis-password"

  natsAuth:
    enabled: false
    secretName: "nats-credentials"  # pragma: allowlist secret
    secretTokenKey: "nats-token"  # pragma: allowlist secret

  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    cooldownPeriod: 300
    pollingInterval: 30
    redisQueue:
      enabled: true
      address: "university-ecosystem-redis-master:6379"
      listName: "backend_tasks"
      listLength: 20
      databaseIndex: 0
    natsJetstream:
      enabled: true
      monitoringEndpoint: "http://university-ecosystem-nats:8222"
      stream: "TASK_QUEUE"
      consumer: "backend-worker"
      lagThreshold: 25

  fileProcessor:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    cooldownPeriod: 300
    pollingInterval: 15
    natsJetstream:
      enabled: true
      monitoringEndpoint: "http://university-ecosystem-nats:8222"
      stream: "FILES_PROCESS"
      consumer: "file-processor-worker"
      lagThreshold: 10

  outboxWorker:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cooldownPeriod: 60
    pollingInterval: 15
    natsJetstream:
      enabled: true
      monitoringEndpoint: "http://university-ecosystem-nats:8222"
      stream: "OUTBOX_EVENTS"
      consumer: "outbox-cdc-worker"
      lagThreshold: 50

# Off-Peak Resource Hibernation (FinOps scale-to-zero for dev/staging)
hibernation:
  enabled: false  # Default false in production; set true in dev/staging
  schedules:
    offPeak:
      timezone: "UTC"
      start: "0 20 * * 1-5"   # 20:00 Mon-Fri (start off-peak hibernation)
      end: "0 7 * * 1-5"     # 07:00 Mon-Fri (resume daytime scaling)
      desiredReplicas: 0

  workloads:
    frontend:
      enabled: true
      minReplicasDay: 2
      maxReplicasDay: 5
    backend:
      enabled: true
      minReplicasDay: 2
      maxReplicasDay: 8
    gateway:
      enabled: true
      minReplicasDay: 2
      maxReplicasDay: 5
    fileProcessor:
      enabled: true
      minReplicasDay: 1
      maxReplicasDay: 5
    rustOptimizer:
      enabled: true
      minReplicasDay: 1
      maxReplicasDay: 3
    outboxWorker:
      enabled: true
      minReplicasDay: 2
      maxReplicasDay: 10
