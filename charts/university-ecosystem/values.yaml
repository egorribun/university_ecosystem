# Global settings
global:
  environment: "development"
  # Leave empty so dependency charts can use their own verified registries.
  imageRegistry: ""
  # Optional immutable release tag shared by all first-party workloads. A
  # component-specific image.tag takes precedence; Chart.AppVersion is fallback.
  imageTag: ""
  imagePullSecrets: []

# Existing Secret containing complete, URL-encoded connection strings. Keeping
# credentials out of values.yaml avoids leaking them through Helm release state.
# Required keys by default:
#   database-url: postgresql+asyncpg://...
#   redis-backend-url: redis://:PASSWORD@<release>-redis-master:6379/0
#   redis-gateway-url: redis://:PASSWORD@<release>-redis-master:6379/3
#   redis-revocation-url: redis://:PASSWORD@<release>-revocation-redis-master:6379/0
#   nats-url: nats://<release>-nats:4222
#   nats-auth-token: independent NATS authentication token
#   keda-postgresql-url: postgresql://... (only when the PostgreSQL scaler is on)
#   backup-database-url: postgresql://... (only when backup.enabled=true)
connections:
  existingSecret: "university-connections"
  databaseURLKey: "database-url"
  redisBackendURLKey: "redis-backend-url"
  redisGatewayURLKey: "redis-gateway-url"
  # Session revocation is security state and must use the dedicated durable,
  # non-evicting datastore configured by revocationRedis below.
  redisRevocationURLKey: "redis-revocation-url"
  natsURLKey: "nats-url"
  natsAuthTokenKey: "nats-auth-token"
  kedaPostgresqlURLKey: "keda-postgresql-url"
  backupDatabaseURLKey: "backup-database-url"

# Set to an externally managed Secret in staging/production. When empty, the
# chart creates <release>-secrets from the explicit values below for local/dev.
# Required keys: jwt-secret, jwt-rsa-private-key, jwt-rsa-public-key,
# internal-hmac-secret, ws-hub-internal-secret, csrf-hmac-secret,
# spotify-token-secret, elasticsearch-password, spicedb-preshared-key,
# audit-log-secret, idempotency-hmac-secret, minio-access-key,
# minio-secret-key, temporal-api-key.
applicationSecrets:
  existingSecret: ""

# Database backup is opt-in because it requires reachable PostgreSQL and MinIO
# services plus the Secret keys documented above. The init container produces a
# consistent custom-format pg_dump; the main container uploads it to MinIO.
backup:
  enabled: false
  schedule: "0 2 * * *"
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  ttlSecondsAfterFinished: 86400
  postgresImage: "pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f"
  minioClientImage: "minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727"
  minioEndpoint: "http://minio:9000"
  minioBucket: "backups"

# Schema migrations run as a blocking Helm pre-install/pre-upgrade hook before
# application workloads are rolled out. connections.existingSecret must exist
# before `helm install` because it contains the migration database URL.
migrations:
  enabled: true
  activeDeadlineSeconds: 900
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Backend Service (Python/FastAPI)
backend:
  replicaCount: 2
  image:
    repository: university-backend
    pullPolicy: Always
    digest: ""  # sha256:... takes precedence over tag for immutable deployment
    tag: ""  # RZ-33-26: empty = Chart.AppVersion; "latest" rejected by Kyverno
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # Non-secret extra environment variables. Connection variables are sourced
  # from connections.existingSecret and reserved by the Deployment template.
  env: {}
  config:
    jwtPrivateKeyPEM: ""
    # Development-only inline values used to create <release>-secrets. Prefer
    # applicationSecrets.existingSecret outside disposable local clusters.
    internalHMACSecret: ""
    wsHubInternalSecret: ""
    csrfHMACSecret: ""
    spotifyTokenSecret: ""
    elasticsearchPassword: ""
    spicedbPresharedKey: ""
    auditLogSecret: ""
    idempotencyHMACSecret: ""
    # Empty disables the Elasticsearch integration. Production URLs must use
    # HTTPS; the application validates this at startup.
    elasticsearchURL: ""
    minioSecure: false
    # OpenFeature RPC provider endpoint. The flagd Service is deployed from
    # k8s/flagd/ in the same namespace by the GitOps stack.
    flagdHost: "flagd"
    flagdPort: 8013

# Frontend Service (Node SSR)
frontend:
  replicaCount: 2
  image:
    repository: university-frontend
    pullPolicy: Always
    digest: ""
    tag: ""  # RZ-33-26: empty = Chart.AppVersion; "latest" rejected by Kyverno
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Gateway Service (Go)
gateway:
  replicaCount: 2
  image:
    repository: university-gateway
    pullPolicy: Always
    digest: ""
    tag: ""  # RZ-33-26: empty = Chart.AppVersion; "latest" rejected by Kyverno
  service:
    type: ClusterIP
    port: 8080
    nodePort: 30080  # Used only when type=NodePort.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    jwtSecret: "" # MUST be provided as --set gateway.config.jwtSecret=...
    jwtAudience: "university-ecosystem-api"
    rateLimitRps: 100
    # Plaintext is suitable only for the NetworkPolicy-isolated development
    # chart. Set true when gRPC/OTLP endpoints terminate trusted TLS.
    grpcUseTLS: false
    otelEndpoint: "otel-collector:4317"
    # Kubernetes ingress terminates HTTP/3. The pod listener is disabled unless
    # operators intentionally expose UDP and mount a trusted certificate.
    h3Enabled: false

# File Processor (Go)
fileProcessor:
  enabled: true
  replicaCount: 2
  image:
    repository: university-file-processor
    pullPolicy: Always
    digest: ""
    tag: ""  # RZ-33-26: empty = Chart.AppVersion; "latest" rejected by Kyverno
  service:
    type: ClusterIP
    port: 50051
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  config:
    # Optional non-secret override. Empty uses connections.natsURLKey.
    natsURL: ""
    minioEndpoint: "minio:9000"
    minioAccessKey: ""
    minioSecretKey: ""
    # Local MinIO is plaintext. Set true for staging/production.
    minioSecure: false
    temporalHost: "temporal:7233"
    # Local Temporal dev server is plaintext. Set false for staging/production.
    temporalTLSDisabled: true
    temporalAPIKey: ""
    rsaPublicKeyPEM: ""
    otlpEndpoint: "otel-collector:4317"
    # Production config validation rejects true; set false with a TLS endpoint.
    otlpInsecure: true

# Transactional outbox worker (reactive PostgreSQL LISTEN/NOTIFY + polling fallback)
outboxWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: university-backend
    pullPolicy: Always
    digest: ""
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Non-secret extra environment variables. Database, Redis, NATS, and KEDA
  # connection variables are sourced from connections.existingSecret.
  env: {}

# Ingress (MOD-30-04: fully parameterized)
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: university.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
    - host: api.university.example.com
      paths:
        - path: /
          pathType: Prefix
          # Keep authentication, rate limiting, and gRPC dispatch at the edge.
          service: gateway
  tls:
    - secretName: university-ecosystem-tls  # pragma: allowlist secret
      hosts:
        - university.example.com
        - api.university.example.com

# Network Policy ingress-controller selector.
# DEBT-07 (RZ-W13): parametrized so the chart works with any ingress controller
# (nginx, Traefik, AWS ALB, Istio). Override with --set for non-nginx clusters:
#   --set networkPolicy.ingressController.namespaceSelector.kubernetes\.io/metadata\.name=traefik
# OpenTelemetry sampling configuration.
# PERF-03 (RZ-W13): Without explicit sampler config the SDK defaults to
# parentbased_always_on (100% sampling). At production load (1000+ req/s)
# this saturates the OTLP Collector and adds measurable CPU overhead.
# Use parentbased_traceidratio + 0.1 for 10% head-based sampling in production.
otel:
  sampler: "parentbased_traceidratio"
  samplerArg: "0.1"   # 10% in production; set 1.0 in staging/dev

networkPolicy:
  ingressController:
    # Namespace where the ingress controller pods live.
    namespaceSelector:
      "kubernetes.io/metadata.name": ingress-nginx
    # Labels on the ingress controller pods themselves.
    podSelector:
      "app.kubernetes.io/name": ingress-nginx

# Infrastructure (Dependencies)
# PERF-W18-03 / Wave 18.1: bitnami subcharts with explicit resource limits.
# Run `helm dependency update` after modifying.
postgres:
  enabled: true  # External — managed by CloudNativePG or external RDS
  config:
    # Required by the LISTEN/NOTIFY outbox recovery watermark; no CDC slots needed.
    track_commit_timestamp: true

postgresql:
  enabled: true
  config:
    track_commit_timestamp: true

# bitnami/redis subchart configuration.
# Docs: https://github.com/bitnami/charts/tree/main/bitnami/redis
redis:
  enabled: true
  architecture: standalone  # standalone for dev; replication for prod
  auth:
    enabled: true
    existingSecret: "redis-credentials" #checkov:skip=CKV_SECRET_6:references a Kubernetes Secret name, not a credential value
    existingSecretPasswordKey: "redis-password" #checkov:skip=CKV_SECRET_6:references a Secret key name, not a credential value
  master:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    persistence:
      enabled: true
      size: 8Gi
    # Pod security hardening (matches our Kyverno Enforce policies)
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
  # Redis configuration matching docker-compose.yml valkey settings.
  commonConfiguration: |-
    maxmemory 1536mb
    maxmemory-policy volatile-lru
    save ""
    appendonly no
  metrics:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Dedicated security-state datastore. Revocation tombstones outlive cache
# churn and pod restarts, and noeviction prevents revoked tokens resurrecting.
revocationRedis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: "redis-credentials" #checkov:skip=CKV_SECRET_6:references a Kubernetes Secret name, not a credential value
    existingSecretPasswordKey: "redis-password" #checkov:skip=CKV_SECRET_6:references a Secret key name, not a credential value
  master:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: true
      size: 2Gi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
  commonConfiguration: |-
    maxmemory 384mb
    maxmemory-policy noeviction
    save 60 1
    appendonly yes
    appendfsync everysec
  metrics:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 24Mi
      limits:
        cpu: 100m
        memory: 64Mi

# bitnami/nats subchart configuration.
# Docs: https://github.com/bitnami/charts/tree/main/bitnami/nats
nats:
  enabled: true
  resourceType: statefulset
  replicaCount: 1  # standalone for dev; 3 for prod cluster
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nats:
    jetstream:
      enabled: true
      memStorage:
        enabled: true
        size: 512Mi
      fileStorage:
        enabled: true
        size: 10Gi
  # Pod security hardening
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

minio:
  enabled: true  # External — managed separately
temporal:
  enabled: true  # External — managed separately

# KEDA Auto-Scaling Configuration (Vector 17 FinOps)
keda:
  enabled: false  # Global master switch (set true in clusters with KEDA operator installed)

  redisAuth:
    enabled: true
    secretName: "redis-credentials"
    secretPasswordKey: "redis-password"

  natsAuth:
    enabled: false
    secretName: "nats-credentials"  # pragma: allowlist secret
    secretTokenKey: "nats-token"  # pragma: allowlist secret

  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    cooldownPeriod: 300
    pollingInterval: 30
    redisQueue:
      enabled: true
      address: ""
      listName: "backend_tasks"
      listLength: 20
      databaseIndex: 0
    natsJetstream:
      enabled: true
      monitoringEndpoint: ""
      stream: "TASK_QUEUE"
      consumer: "backend-worker"
      lagThreshold: 25

  fileProcessor:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    cooldownPeriod: 300
    pollingInterval: 15
    natsJetstream:
      enabled: true
      monitoringEndpoint: ""
      stream: "FILES_PROCESS"
      consumer: "file-processor-worker"
      lagThreshold: 10

  outboxWorker:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    cooldownPeriod: 60
    pollingInterval: 15
    postgresql:
      enabled: true
      targetQueryValue: 50
      activationTargetQueryValue: 0

# Off-Peak Resource Hibernation (FinOps scale-to-zero for dev/staging)
hibernation:
  enabled: false  # Default false in production; set true in dev/staging
  schedules:
    offPeak:
      timezone: "UTC"
      start: "0 20 * * 1-5"   # 20:00 Mon-Fri (start off-peak hibernation)
      end: "0 7 * * 1-5"     # 07:00 Mon-Fri (resume daytime scaling)
      desiredReplicas: 0

  workloads:
    frontend:
      enabled: true
      minReplicasDay: 2
      maxReplicasDay: 5
    backend:
      enabled: true
      minReplicasDay: 2
      maxReplicasDay: 8
    gateway:
      enabled: true
      minReplicasDay: 2
      maxReplicasDay: 5
    fileProcessor:
      enabled: true
      minReplicasDay: 1
      maxReplicasDay: 5
    outboxWorker:
      enabled: true
      minReplicasDay: 2
      maxReplicasDay: 10
