apiVersion: v2
name: university-ecosystem
description: A Helm chart for the University Ecosystem microservices platform
type: application
version: 0.2.2
appVersion: "1.0.0"
maintainers:
  - name: antigravity
    email: bot@example.com

# Cache uses the first-party Redis wrapper to preserve Redis service and PVC identities.
# NATS uses the official NATS-maintained chart with a reviewed immutable server image.
dependencies:
  - name: redis
    version: "0.1.0"
    repository: "file://../redis-compat"
    condition: redis.enabled
  - name: nats
    version: "2.15.0"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
